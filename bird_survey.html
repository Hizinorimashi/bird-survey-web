    </div>${(selMode && _ld.flights.length)?`<div class="tiny muted" style="margin:2px 2px 6px;">経路だけの記録（🛩）は選択中は表示していません。消すときは記録を開いてください</div>`:''}`;
  const selBar = selMode
    ? `<div class="sp"></div><button class="btn danger big" id="selDelBtn" ${SCREENS._sel.set.size?'':'disabled'} onclick="deleteSelected()">選択した${SCREENS._sel.set.size}件を削除</button>`
    : '';
  const notes = DB.notesOf(u);
  // 鳥（観察・経路）に付けたメモ。新しい順。押すとその記録を開く（v234 ユーザー）
  const _tv=x=>{ const v=Date.parse(x||''); return isNaN(v)?-Infinity:v; };
  const birdMemos = obs.map(o=>({ t:o.observed_at, name:o.species_name_snapshot||'（未同定）',
      text:[o.note?String(o.note):'', o.nest_note?'巣: '+o.nest_note:'', o.env_note?'環境: '+o.env_note:''].filter(x=>String(x).trim()).join(' ／ '),
      arg:{sv:u, id:o.uuid} }))
    .concat(DB.flightsOf(u).map(f=>({ t:f.start_time, name:'🛩 '+(f.species_name_snapshot||'（未同定）'),
      text:String(f.memo||''), arg:null, fl:f })))
    .filter(m=>String(m.text).trim())
    .sort((a,b)=>_tv(b.t)-_tv(a.t));
  // 経路のメモは、同じ鳥の観察があればそちらを開く（観察が無ければ経路を軸に開く）
  birdMemos.forEach(m=>{ if(m.arg) return;
    const k=m.fl.individual_key; const o2=k ? obs.find(o=>o.individual_key===k) : null;
    m.arg = o2 ? {sv:u, id:o2.uuid} : {sv:u, fl:m.fl.uuid}; });

  return {
    title: s.name||'調査', sub,
    html:`
      ${startBtn}
      ${actions}
      ${!running?`<div class="sp"></div><div class="btn-grid">
        <button class="btn" onclick="nav('map','${u}')">🗺 地図</button>
        <button class="btn" onclick="nav('offlineMap','${u}')">💾 オフライン地図を保存</button>
        <button class="btn" onclick="nav('summary','${u}')">📊 集計</button>
        <button class="btn" onclick="nav('hypotheses','${u}')">💡 仮説・検証</button>
        <button class="btn" onclick="nav('obsEdit', JSON.stringify({sv:'${u}'}))">🐦 観察を追加</button>
        <button class="btn" onclick="nav('routeEdit','${u}')">🧭 調査ルート</button>
        ${(s.route&&s.route.length)?roBtn(`<button class="btn" onclick="newSurveyFromRoute('${u}')">🧭 このルートで新規調査</button>`):''}
        <button class="btn" onclick="nav('surveyEdit','${u}')">✎ 調査情報を編集</button>
        <button class="btn" onclick="nav('surveyEnd','${u}')">⏹ 終了・振り返り</button>
      </div>`:''}
      <div class="divider"></div>
      ${obsHeader}
      <div id="obsList">${obsListHtml(u)}</div>
      ${selBar}
      ${notes.length?`<div class="divider"></div><h3>調査メモ <span class="muted small">(${notes.length})</span></h3>
        ${notes.map(n=>`<div class="card tap" onclick="nav('noteEdit', JSON.stringify({sv:'${u}',id:'${n.uuid}'}))">
          <div class="small"><span class="badge">${esc(n.category||'')}</span> ${fmtTime(n.recorded_at)}</div>
          <div>${esc((n.content||'').slice(0,120))}</div></div>`).join('')}`:''}
      ${birdMemos.length?`<div class="divider"></div><h3>鳥のメモ <span class="muted small">(${birdMemos.length})</span></h3>
        ${birdMemos.map(m=>`<div class="card tap" data-arg="${esc(JSON.stringify(m.arg))}" onclick="${window.READ_ONLY?'':`nav('obsEdit', this.dataset.arg)`}">
          <div class="small"><b>${esc(m.name)}</b> <span class="muted">${fmtTime(m.t)}</span></div>
          <div>${esc(String(m.text).slice(0,200))}</div></div>`).join('')}`:''}
    `,
    onMount:()=>{ if(running && gpsWatchId==null) startGpsIndicator(); }   // 再描画では張り直さない（瞬断防止）
  };
};
// 一覧の「さらに表示」「要確認のみ」。録音中は再描画で録音が中断されるため操作を保留してもらう
// 録音の保存が進行中の本数。停止を押すと REC はすぐ空になるが、音声の書き込みはまだ続いている。
// この間に記録の種類を変えると、遅れて完了した分の持ち主が居なくなり、直前の録音が失われる
let AUDIO_PENDING=0;
function recBusy(){ return !!REC || _recStarting || AUDIO_PENDING>0; }   // 録音中＋マイク許可待ち＋保存待ち
function obsMore(){ if(recBusy()){ toast('録音を停止してから操作してください'); return; }
  SCREENS._obsLimit=(SCREENS._obsLimit||50)+50;
  obsListPaint(); }   // 画面を丸ごと描き直さない＝押した位置のまま増える（録音・GPS・地図も切れない）
function obsReviewToggle(){
  SCREENS._obsGrpShown=new Map(); if(recBusy()){ toast('録音を停止してから操作してください'); return; }
  SCREENS._sel=null;   // 絞り込みで見えなくなった記録が選択されたまま削除されるのを防ぐ（選択は解除）
  SCREENS._obsReviewOnly=!SCREENS._obsReviewOnly; SCREENS._obsLimit=50; render(); }
// 「すぐ録音」は v233 で削除（鳴き声AIの「🎙 いまの音を残す」で代わりにする）
// 終了した調査を再開する（終了ボタンの押し間違い・帰り際の追加観察に対応）。振り返りはそのまま残る。
// 「終了〜再開」の中断時間は paused_ms に積み、経過時間の表示から差し引く（翌日再開でも水増しされない）
function resumeSurvey(u){ const s=DB.survey(u); if(!s) return;
  if(!confirm('この調査を再開しますか？\n終了時刻はいったん消え、もう一度終了したときに記録し直されます（振り返りは残ります）')) return;
  if(s.end_datetime){ const pause=Date.now()-new Date(s.end_datetime).getTime();
    if(isFinite(pause) && pause>0) s.paused_ms=(s.paused_ms||0)+pause; }
  s.status='調査中'; s.end_datetime='';
  if(!DB.upsertSurvey(s)) return;
  toast('調査を再開しました'); render(); }
function startSurvey(u){ if(!writeAllowed()) return; const s=DB.survey(u); if(!s) return;
  s.status='調査中'; if(!s.start_datetime) s.start_datetime=nowISO();
  // 保存できたときだけ「開始しました」と言う。容量不足で保存できないまま
  // 現場へ出ると、開始時刻も調査中の状態も残らない（監査 Major）
  if(!DB.upsertSurvey(s)) return;   // 失敗の断りは DB.save 側が出している
  toast('調査を開始しました'); render(); }

/* GPS状態インジケータ（ヘッダの pill を更新） */
let gpsWatchId=null, lastFix=null;
// 位置の自動入力に使ってよい鮮度。これより古い測位は「前の地点・前日の位置」の恐れがあるため自動では使わない
const FIX_FRESH_MS=5*60*1000;
function freshFix(maxMs){ return (lastFix && (Date.now()-(lastFix.t||0))<=(maxMs||FIX_FRESH_MS)) ? lastFix : null; }
function startGpsIndicator(){
  stopGps();
  if(WALK) return;   // 歩行記録中はルートのwatchがlastFixと#pGpsを更新するので二重監視しない（電池対策）
  if(!navigator.geolocation) return;
  gpsWatchId=navigator.geolocation.watchPosition(p=>{
    lastFix={lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy, t:Date.now()};
    const el=$('#pGps'); if(el){ el.textContent=`GPS ±${Math.round(p.coords.accuracy)}m`; el.className='pill ok'; }
  }, e=>{ const el=$('#pGps'); if(el){ el.textContent='GPS 取得不可'; el.className='pill off'; } },
  {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
}
function stopGps(){ if(gpsWatchId!=null && navigator.geolocation){ navigator.geolocation.clearWatch(gpsWatchId); } gpsWatchId=null; }

/* ============================================================
   観察記録 追加/編集
   ============================================================ */

SCREENS.obsEdit = (argStr)=>{
  const arg = JSON.parse(argStr||'{}');
  const svUuid = arg.sv || currentSurveyUuid;
  // 複数個体: 内部の組み直し（切替・追加・保存後）は BIRDS を保つ。外から開いたら仕切り直す
  let revisit = SCREENS._birdKeep===true; SCREENS._birdKeep=false;
  if(!revisit && typeof BIRDS!=='undefined' && BIRDS.some(b=>b&&b.dirty)){
    // 内部フラグの無い再描画（同期後の render など）が書きかけの最中に走っても、
    // 個体一覧を初期化して入力・仮記録の管理を失わない（切替と同じ復元の道を通す）。
    // ただし**別の調査**を開いたときは引き継がない。引き継ぐと、調査Aで入れた内容が
    // 調査Bの記録として保存される（2026-08-28 全体監査 Critical）
    if(SCREENS._birdsSv && SCREENS._birdsSv!==svUuid){
      try{ toast('別の調査を開いたので、前の調査の書きかけは引き継ぎませんでした', 5000); }catch(_){}
    } else revisit=true;
  }
  if(!revisit){ BIRDS=[newBird()]; BIRD_IDX=0; }
  SCREENS._birdsSv=svUuid;   // いまの個体一覧が、どの調査のものかを覚えておく
  let editing = !!arg.id;
  let revisitBird=null;
  if(revisit){
    const b=CUR();
    if(b.reinitId){ editing=true; }
    else if(b.reinitFl){ editing=false; }
    else if(b.st.obs){ editing=!!b.st.obsEditing; revisitBird=b; }
    else { editing=false; }   // 追加されたばかりの個体
  }
  // 経路のカードから開いたとき（観察の記録がまだ無い鳥）。経路を軸に統合画面を開く。
  // 飛翔だけを保存した個体の読み直し（reinitFl）も同じ道を通る
  const _flId = revisit ? (CUR().reinitFl || (CUR().st&&CUR().st.flAnchorUuid) || '') : (arg.fl||'');
  // 音声の下書き・前の記録からの引き継ぎは「最初の表示」だけで使う。
  // 内部の再表示（個体の追加・切替・保存後）で再利用すると、元の内容が新しい個体へ複製される
  const initVoice = revisit ? null : (arg.voice||null);
  const initKeep  = revisit ? null : (arg.keep||null);
  const flAnchor = (!editing && _flId) ? DB.flightsOf(svUuid).find(f=>f.uuid===_flId) : null;
  let o=null;
  if(editing){
    // 編集対象の番号: 保存後の読み直し（reinitId）→ 退避中の個体自身 → 外から渡された id の順。
    //（切替の再表示で arg.id を使うと、追加個体などで id が無く、保存済みが新規扱いに落ちて
    //  作成日時や画面に無い既存項目が失われる）
    const editId=(revisit && CUR().reinitId) ? CUR().reinitId
      : (revisitBird ? ((revisitBird.st.obs&&revisitBird.st.obs.uuid)||'') : (revisit ? '' : (arg.id||'')));
    const live=editId ? DB.observations().find(x=>x&&x.uuid===editId) : null;
    if(!live){
      if(revisitBird && revisitBird.st.obsEditing){
        // 退避中に別の書き手が削除した。新規扱いへ落とすと削除を取り消す上書きになるため、
        // 表示は退避内容のまま保ち、保存は入り口の生存確認で止める
        o=revisitBird.st.obs;
      } else {
        editing=false;   // 外から渡された存在しない番号は新規の空として開く
      }
    }
    else o = revisitBird ? revisitBird.st.obs : Object.assign({}, live);
  }
  if(revisit){ delete CUR().reinitId; delete CUR().reinitFl; }
  if(revisitBird && !o) o=revisitBird.st.obs;   // 未保存の退避個体（editing=false のまま内容を保つ）
  if(!o){
    o = { uuid:uuid(), survey_uuid:svUuid, observed_at:localDatetimeValue(), latitude:'', longitude:'',
      gps_accuracy:'', species_id:'', species_name_snapshot:'', count:1, detection_method:'目視',
      behavior:'', habitat:'', age_class:'不明', sex:'不明', distance_band:'', direction:'',
      target_latitude:'', target_longitude:'', perch_size:'', perch_class:'',
      nest_tree_species:'', nest_tree_height:'', nest_state:'',
      perch_type:'', perch_artificial:'', perch_note:'', nest_latitude:'', nest_longitude:'',
      individual_label:'',
      note:'', identification_status:'確定', confidence:'中',
      needs_review:false, external_photo_reference:'',
      // 環境・営巣木それぞれの写真とメモ（2026-08-14 追加）。
      // 観察のメディア記録とは**別に持つ**。どの写真が何の写真かが分かるように
      env_note:'', nest_note:'', env_media:[], nest_media:[] };
    // 「保存して続けて」からは前の記録の位置をそのまま引き継ぐ（位置を消して保存したなら空のまま＝GPSで上書きしない）。
    // keepが無いときだけ、新鮮なGPSを初期値にする（古い測位は使わない）
    if(initKeep){ const k=initKeep;
      if(validLatLon(String(k.lat||''), String(k.lon||''))){ o.latitude=String(k.lat); o.longitude=String(k.lon); o.gps_accuracy=(k.acc==null)?'':k.acc; }
      // 飛翔経路から「止まった」で来たとき: 種名・数・齢と、同一個体の目印を引き継ぐ
      if(k.species_name){ o.species_name_snapshot=k.species_name;
        o.species_id=(speciesByName(k.species_name)||{}).species_id||''; }
      if(k.count!=null && k.count!=='') o.count=k.count;   // 0羽もそのまま引き継ぐ（0は未指定ではない）
      if(k.age_class) o.age_class=k.age_class;
      if(k.individual_label) o.individual_label=k.individual_label;   // 同じ鳥の続きなら呼び名も引き継ぐ
      if(k.individual_key){
        o.individual_key=k.individual_key;
        // その鳥にすでに巣があるなら、画面にも読み込む。
        // 読み込まないと、見えていない巣をこの画面の操作で知らずに消してしまう
        const ng=nestGroups(DB.obsOf(svUuid).filter(x=>x.individual_key===k.individual_key));
        if(ng.length===1){ const n0=ng[0];
          o.nest_id=nestId(n0);
          o.nest_latitude=coordStr(n0.nest_latitude); o.nest_longitude=coordStr(n0.nest_longitude);
          o.nest_tree_species=n0.nest_tree_species||''; o.nest_tree_height=n0.nest_tree_height||'';
          o.nest_state=n0.nest_state||'';
        }
      }
    }
    else { const fx=freshFix(); if(fx){ o.latitude=fx.lat.toFixed(6); o.longitude=fx.lon.toFixed(6); o.gps_accuracy=Math.round(fx.acc); } }
    // 経路のカードから開いたとき: 種名・個体数・齢・結び付けの目印に加え、
    // 添付・メモ・要確認も経路から読み込む（読み込まないと、保存で空に置き換わって消える）
    if(flAnchor){
      if(flAnchor.species_name_snapshot){ o.species_name_snapshot=flAnchor.species_name_snapshot;
        o.species_id=flAnchor.species_id||(speciesByName(flAnchor.species_name_snapshot)||{}).species_id||''; }
      if(flAnchor.count!=null && flAnchor.count!=='') o.count=flAnchor.count;
      if(flAnchor.age_class) o.age_class=flAnchor.age_class;
      if(flAnchor.individual_key) o.individual_key=flAnchor.individual_key;
      if(flAnchor.individual_label) o.individual_label=flAnchor.individual_label;
      o.audio=(flAnchor.audio||[]).slice(); o.media=(flAnchor.media||[]).slice();
      o.note=flAnchor.memo||''; o.needs_review=!!flAnchor.needs_review;
    }
    // 下書き（arg.voice）。解析できた項目だけ初期値を上書き（保存は利用者の確認後）。
    // 話した言葉の音声入力は v229 で撤去したが、この入口は「聞こえた鳥（鳴き声AI）から観察を開く」ときに使う予定で残す
    if(initVoice){ const v=initVoice;
      if(v.species_name){ o.species_name_snapshot=v.species_name;
        o.species_id=(speciesByName(v.species_name)||{}).species_id||''; }
      if(v.count) o.count=v.count;
      if(v.note) o.note=v.note;
      // 行動・確認方法・距離帯・確認方向は観察にしか置き場所が無い。
      // ここで入れると「最初からそうだった」ことになり、経路だけで保存したとき黙って消える。
      // 画面を組んだあと（初期状態を控えたあと）に入れる（onMount 参照）
    }
  } else if(o.observed_at && o.observed_at.length>16){ o.observed_at=localDatetimeValue(new Date(o.observed_at)); }

  // 「その他（記入内容）」をボタン一致用の値と記入欄の初期値に分解
  // 「その他（記入内容）」の分解は、記入欄を持つ項目だけに行う。
  // 止まり木は記入欄が無いので分解すると記入内容が消える（選択肢に無い値はそのまま残す作りになっている）
  const oOther={}; ['behavior','habitat'].forEach(f=>{ const p=otherParse(o[f]); o[f]=p.v; oOther[f]=p.other; });
  // 齢は語彙をそろえた（成→成鳥 等）。古い値のままだとどのボタンにも当たらず未選択に見えるので、
  // 画面を組む前に写しておく。ここで写せば、保存し直したときに新しい語彙で書かれる
  o.age_class=ageNorm(o.age_class);
  const seg=(field,opts,allowEmpty)=>`<div class="seg" data-seg="${field}">
    ${allowEmpty?`<button type="button" class="${!o[field]?'on':''}" onclick="pickObs(this,'${field}','')">なし</button>`:''}
    ${opts.map(x=>`<button type="button" class="${o[field]===x?'on':''}" onclick="pickObs(this,'${field}','${esc(x)}')">${esc(x)}</button>`).join('')}</div>`;
  // 行動・生息環境などは複数選択（「・」区切りで保存。タップでON/OFF切替）
  const segMulti=(field,opts)=>{ const set=new Set(String(o[field]||'').split('・').filter(Boolean));
    return `<div class="seg" data-seg="${field}">${opts.map(x=>
      `<button type="button" class="${set.has(x)?'on':''}" onclick="toggleMulti(this)">${esc(x)}</button>`).join('')}</div>${
      opts.includes('その他')?otherBox(field,oOther[field],set.has('その他')):''}`; };
  // 単一選択のプルダウン版（画面をすっきりさせたい項目用）。値の読み取りは segVal が SELECT にも対応
  // 保存済みの値が選択肢に無い場合（旧データ等）はその値の選択肢を足して黙って変わるのを防ぐ。
  // 必須項目でも既存値が空なら「未設定」を足す（先頭の選択肢が黙って選ばれて保存が変わるのを防ぐ。監査Major対応）
  // 齢は「成鳥 A」のように略号を添えて出す。値（value）は今までどおり（2026-11-07 ユーザー要望）
  const segLabel_=(field,x)=>esc(x)+((field==='age_class' && AGE_ABBR[x])?' '+AGE_ABBR[x]:'');
  const segSelect=(field,opts,allowEmpty)=>`<select data-seg="${field}">
    ${allowEmpty?`<option value="" ${!o[field]?'selected':''}>なし</option>`:''}
    ${(!allowEmpty && !o[field])?`<option value="" selected>未設定</option>`:''}
    ${(o[field]&&!opts.includes(o[field]))?`<option value="${esc(o[field])}" selected>${esc(o[field])}</option>`:''}
    ${opts.map(x=>`<option value="${esc(x)}" ${o[field]===x?'selected':''}>${segLabel_(field,x)}</option>`).join('')}</select>`;
  // 複数選択の折りたたみ版。閉じたままでも選択中の内容が見える（toggleMulti が segsum-* を更新）
  const segFold=(field,label,opts)=>`<div class="field"><details class="fold">
    <summary><span class="lab" style="display:inline; margin:0;">${esc(label)}</span>
      <span class="small muted" id="segsum-${field}">${esc(String(o[field]||'').split('・').filter(Boolean).join('・')||'未選択')}</span></summary>
    ${segMulti(field,opts)}
  </details></div>`;

  // 経路だけの記録（観察の無い鳥）を開いたときも、見た目は「編集中」にする（v234。追加タブに見えていた）
  const editView = editing || !!flAnchor;
  SCREENS._obsEditView = editView;
  return {
    title: editView?'観察を編集':'観察を追加',
    hideBack: editView,
    html:`
      <!-- 追加と編集をタブで分ける（2026-11-07 ユーザー決定）。編集中の「＋ 追加」は、保存してから新しい観察へ -->
      <div class="seg obs-tabs" id="obsTabs" style="margin-bottom:8px;">
        <button type="button" class="${editView?'':'on'}" onclick="obsTabAdd('${o.uuid}','${svUuid}',${editing?'true':'false'},${editView?'true':'false'})">＋ 追加</button>
        <button type="button" class="${editView?'on':''}" onclick="obsTabEdit(${editView?'true':'false'})">✎ 編集${editView?'中':''} ▾</button>
      </div>
      <div id="obsPickBox" class="obs-pick-box" style="display:none;"></div>
      <!-- 地図が主役。P=鳥がいた場所（点）、F=飛翔経路（線）。何を保存するかは地図の中身で決まる -->
      <div class="card" style="background:var(--panel2); padding:8px;">
        <div id="obsPosMap" style="height:300px; border-radius:var(--radius); border:1px solid var(--line);"></div>
        <div class="row" style="margin-top:6px; gap:8px; align-items:center;">
          <span class="tiny muted grow" id="mapInfo"></span>
          <button type="button" class="btn ghost" style="width:auto; padding:6px 10px;" onclick="obsMapUndo()" title="1つ戻す">↶</button>
          <button type="button" class="btn ghost" style="width:auto; padding:6px 10px;" onclick="obsMapClear()" title="全部消す">🗑</button>
        </div>
        <!-- **いま選んでいるトレース（L）の属性を、地図のすぐ下に1行でまとめる。**
             報告書の記号（◎旋回上昇・↠急降下）は L ごとの属性で決まるので、
             線でも面でも同じ場所で選べないと図が作れない。
             折りたたみの中だと、描いてから開き直すことになり現場で手が止まる -->
        <div id="flAttrRow" style="display:none; margin-top:6px;">
          <div class="row" style="gap:8px; align-items:center; flex-wrap:wrap;">
            <span class="tiny muted" id="flAttrLabel" style="font-weight:700;">L1</span>
            <div class="seg" data-seg="fl_shape">
              <button type="button" class="on" onclick="pickObs(this,'fl_shape'); flShapePick()">線</button>
              <button type="button" onclick="pickObs(this,'fl_shape'); flShapePick()">面</button>
            </div>
            <label id="flAreaTypeWrap" style="display:none; margin:0;">
              <select data-seg="fl_area_type" onchange="flAreaTypePick()" style="width:auto;">
                <option value="">種類を選ぶ</option>
                ${AREA_TYPES.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
              </select></label>
            <label id="flHeightWrap" style="display:none; margin:0;">
              <select data-seg="fl_height" onchange="flHeightPick()" style="width:auto;">
                <option value="">高度を選ぶ</option>
                ${OPT.flightHeight.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
              </select></label>
          </div>
          <!-- 線の行動は種情報の「行動」1つにまとめた（2026-11-07）。この欄は使わない -->
          <div id="flBehWrap" style="display:none;">${segFold('fl_behavior','行動（複数選択可）',OPT.flightBehavior)}</div>
          <!-- 「この線だけ違う鳥」は 2026-11-07 にやめた（ユーザー決定）。齢・性別・個体名は種名のすぐ下へ -->
        </div>
        <!-- くるくるは**線の属性ではなく描き方**なので、L の欄の外に置く。
             中に置くと、線が2本以上あって選んでいないとき（＝新しいLを押した直後）に
             欄ごと隠れて選べなくなる（2026-08-13 実機で指摘） -->
            <!-- くるくる（旋回）。報告書の結果図では、飛翔経路の線そのものに輪が入る。
                 1点ずつ輪を描くのは現場で無理なので、押しておくと1タップで輪が1つ入る。
                 ふだんは大きさ・周回数を隠して、画面をうるさくしない -->
            <div class="row" id="flSpiralWrap" style="display:none; gap:8px; align-items:center; flex-wrap:wrap; margin-top:4px;">
              <button type="button" class="btn ghost" id="flSpiralBtn" style="width:auto; padding:6px 10px;"
                onclick="spiralToggle()">◠ くるくる（旋回）</button>
              <span id="flSpiralOpts" style="display:none;">
                <span class="row" style="gap:6px; align-items:center; flex-wrap:wrap;">
                  <div class="seg" data-seg="fl_spiral_size">
                    ${SPIRAL_SIZES.map((s,i)=>`<button type="button" class="${i===1?'on':''}" onclick="pickObs(this,'fl_spiral_size'); spiralInfo()">${esc(s.name)}</button>`).join('')}
                  </div>
                  <div class="seg" data-seg="fl_spiral_side">
                    ${['左','右'].map((n,i)=>`<button type="button" class="${i===0?'on':''}" onclick="pickObs(this,'fl_spiral_side'); spiralInfo()">${n}回り</button>`).join('')}
                  </div>
                  <div class="seg" data-seg="fl_spiral_move">
                    ${['その場','進む'].map((n,i)=>`<button type="button" class="${i===0?'on':''}" onclick="pickObs(this,'fl_spiral_move'); spiralInfo()">${n}</button>`).join('')}
                  </div>
                </span>
              </span>
            </div>
        <!-- **短く1行で**。長い説明は狭い画面で3行にもなり、下の入力を押し下げる
             （2026-08-14 実機で指摘）。入力できない欄は薄くなっているので見れば分かる。
             止まりの記録の仕方だけ、いちばん短い形で残す -->
        <div class="note" id="obsOnlyNote" style="display:none;"><span id="obsOnlyText" style="display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">飛翔経路だけの記録です。止まりは <b>P</b> で。</span>
          <div class="sp"></div><button type="button" class="btn ghost" style="width:auto; padding:6px 10px;" onclick="obsOnlyReset()">観察の項目を元に戻す</button></div>
        <div class="note" id="legacyPosNote" style="display:none;">この記録の位置は、以前の画面では「止まり木・巣など」の位置でした。巣の位置なら下のボタンで移せます。
          <div class="sp"></div><button type="button" class="btn ghost" style="width:auto; padding:6px 10px;" onclick="legacyPosToNest()">この位置を巣にする</button></div>
        <!-- 落としたものの一覧。選ぶと地図で光り、位置直しや削除ができる（P=止まり／L=経路） -->
        <div class="chips" id="segChips" style="margin-top:6px;"></div>
        <!-- 案内は**ボタンと同じ行に置かない**。狭い画面では場所を取り合って

             1行で収まるよう、独立した行にして折り返しも禁じる -->
        <div id="segEditBar" style="display:none; margin-top:6px;">
          <div class="tiny" id="segEditMsg" style="margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
          <div class="row" style="gap:8px; align-items:center;">
            <button type="button" class="btn ghost" id="segFlMore" style="display:none; width:auto; padding:6px 10px;" onclick="segFlOpen()">🎤📷 この経路の添付・メモ</button>
            <button type="button" class="btn ghost" id="soarPlaceBtn" style="display:none; width:auto; padding:6px 10px;" onclick="soarPlaceStart()">◎ ここに旋回上昇</button>
            <span id="soarEditWrap" style="display:none;">

            </span>
            <button type="button" class="btn ghost" style="width:auto; padding:6px 10px;" onclick="segEditDone()">やめる</button>
            <button type="button" class="btn danger" style="width:auto; padding:6px 10px;" onclick="segEditDelete()">✕ 消す</button>
          </div>
        </div>
      </div>
      <div id="birdList" style="display:none; margin-bottom:8px;"></div>
      <form id="obForm">
        <!-- 並び（2026-11-07 実機の要望）: 種名 → 観察メモ → 種情報 → 環境 → 営巣木 → メディア → 登録。
             種名と観察メモは一番使うので折りたたみの外。欄の名前・保存のしかたは変えない -->
        <div id="spBlock">
        <label class="field" id="spField"><span class="lab">種名（未入力でも保存可）</span>
          <input id="spInput" autocomplete="off" value="${esc(o.species_name_snapshot)}"
            placeholder="和名で検索…" oninput="spSearch(this.value); indLabelChips()">
          <div id="spSuggest"></div>
          <div class="chips" id="spQuick"></div>
        </label>
        <!-- 齢・性別・個体名は種名のすぐ下（2026-11-07 ユーザー決定。種情報の中から移した。欄の名前・保存は同じ） -->
        <div class="two">
          <label class="field"><span class="lab">齢</span>${segSelect('age_class',OPT.obsAge)}</label>
          <label class="field obs-only"><span class="lab">性別</span>${segSelect('sex',OPT.sex)}</label>
        </div>
        <label class="field"><span class="lab">個体名（任意・同じ鳥を追うとき）</span>
          <input id="indLabel" autocomplete="off" value="${esc(o.individual_label||'')}"

        </div>
        <label class="field" id="noteField"><span class="lab">観察メモ</span>

        <details class="fold" id="foldSpecies">
          <summary><span class="lab" style="display:inline; margin:0;">🐦 種情報</span>
            <span class="small muted">数・同定・行動など</span></summary>
          <div class="two">
            <label class="field"><span class="lab">個体数</span>
              <input type="number" name="count" inputmode="numeric" min="0" value="${esc(o.count!=null?o.count:1)}"></label>
            <label class="field obs-only"><span class="lab">同定状態</span>${segSelect('identification_status',OPT.idStatus)}</label>
          </div>
          <div id="idHint" class="note" style="display:none; margin:2px 0 10px;"></div>
          <!-- 行動は1つの欄（2026-11-07）。線を選んでいればその線の行動、それ以外は観察の行動（behSwitch） -->
          <div id="behWrap">${segFold('behavior','行動（複数選択可）',BEH_ALL)}</div>
          <!-- 飛翔の行動・高度は**地図のすぐ下（#flAttrRow）**に移した。

          <div id="breedHint" class="note" style="display:none; margin:2px 0 10px;"></div>
          <div class="two obs-only">
            <label class="field"><span class="lab">確認方法</span>${segSelect('detection_method',OPT.detection)}</label>
            <label class="field"><span class="lab">確認方向（任意）</span>${segSelect('direction',OPT.direction,true)}</label>
          </div>
          <label class="field obs-only"><span class="lab">信頼度</span>${segSelect('confidence',OPT.confidence)}</label>
          <label class="field row" style="gap:12px; align-items:center;">
            <input type="checkbox" id="needsReview" style="width:auto;" ${o.needs_review?'checked':''}>
            <span class="lab" style="margin:0;">要確認フラグ（あとで見直す）</span></label>
          <!-- 時刻と距離帯は地図の操作から自動で入る。新規では隠し、保存後の編集でだけ直せるようにする -->
          <div id="autoWrap" style="display:${(editing||flAnchor)?'':'none'};">
            <div class="two">
              <label class="field obs-only"><span class="lab">観察日時</span>
                <input type="datetime-local" name="observed_at" value="${esc(o.observed_at)}"></label>
              <label class="field obs-only"><span class="lab">距離帯</span>${segSelect('distance_band',OPT.distBand,true)}</label>
            </div>
            <div class="two" id="flTimeWrap" style="display:none;">
              <label class="field"><span class="lab">飛翔の開始時刻</span>
                <input type="datetime-local" id="flStart" value="" oninput="flTimeEdit('start')"></label>
              <label class="field"><span class="lab">終了時刻</span>
                <input type="datetime-local" id="flEnd" value="" oninput="flTimeEdit('end')"></label>
            </div>
          </div>
        </details>

        <details class="fold obs-only" id="foldEnv">
          <summary><span class="lab" style="display:inline; margin:0;">🌿 環境</span>
            <span class="small muted">生息環境・止まり木・写真</span></summary>
          <div class="lab" style="margin-top:4px;">まわりの環境（どんな場所か・複数選択可）</div>
          <label class="field">${segMulti('habitat',OPT.habitat)}</label>
          <div class="divider"></div>
          <div class="row" style="align-items:center; gap:8px;">
            <span class="lab grow" style="margin:0;">止まっていたもの</span>
            <span class="chips" id="perchTabs"></span>
          </div>
          <div class="tiny muted" id="perchWhich" style="margin:2px 0 6px;"></div>
          <label class="field"><span class="lab">種類</span>
            <select id="perchType" onchange="perchTypeChanged()">
              <option value="">未選択</option>
              ${OPT.perchType.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
            </select></label>
          <div id="perchTree" style="display:none;">
            <label class="field"><span class="lab">高さ・サイズ</span>
              <select id="perchSize" onchange="perchStore()">
                <option value="">未選択</option>
                ${OPT.perchSize.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
              </select></label>
            <label class="field"><span class="lab">樹種の分類</span>
              <select id="perchClass" onchange="perchStore()">
                <option value="">未選択</option>
                ${OPT.perchClass.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
              </select></label>
            <div class="two">
              <label class="field"><span class="lab">樹種名</span>
                <input id="perchSpecies" placeholder="例：アカエゾマツ" oninput="perchStore()"></label>
              <label class="field"><span class="lab">樹高(m)</span>
                <input id="perchHeight" inputmode="decimal" placeholder="任意" oninput="perchStore()"></label>
            </div>
          </div>
          <div id="perchArt" style="display:none;">
            <label class="field"><span class="lab">人工物の種類</span>
              <select id="perchArtSel" onchange="perchStore()">
                <option value="">未選択</option>
                ${OPT.perchArtificial.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
              </select></label>
          </div>
          <label class="field" id="perchNoteWrap" style="display:none;"><span class="lab">メモ（任意）</span>
            <input id="perchNote" placeholder="どんなものに止まっていたか" oninput="perchStore()"></label>
          <div class="divider"></div>
          <div class="field"><span class="lab">環境の写真</span><div id="envMediaPanel"></div></div>
          <label class="field"><span class="lab">環境のメモ</span>
            <textarea name="env_note" placeholder="どんな場所か・林の様子・水辺の状態など">${esc(o.env_note||'')}</textarea></label>
        </details>

        <details class="fold obs-only" id="foldNest">
          <summary><span class="lab" style="display:inline; margin:0;">🪺 営巣木・巣</span>
            <span class="small muted" id="sumNest">地図のNで位置を指定</span></summary>
          <div class="note">営巣木は「止まっていた場所」とは限りません。地図の <b>N</b> に切り替えてタップすると、巣の位置を指定できます。</div>
          <div class="small muted" id="nestPosLabel" style="margin:6px 0;">巣の位置：未指定</div>
          <div class="two">
            <label class="field"><span class="lab">営巣木の樹種</span>
              <input name="nest_tree_species" value="${esc(o.nest_tree_species||'')}" placeholder="例：アカエゾマツ"></label>
            <label class="field"><span class="lab">樹高(m)</span>
              <input name="nest_tree_height" inputmode="decimal" value="${esc(o.nest_tree_height||'')}" placeholder="任意"></label>
          </div>
          <label class="field"><span class="lab">巣の状態（記入）</span>
            <input name="nest_state" value="${esc(o.nest_state||'')}" list="nestStateList" placeholder="例：抱卵、育雛、巣立ち後"
              oninput="syncDisabledStates()">
            <datalist id="nestStateList">${OPT.nestState.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>

          <label class="field"><span class="lab">営巣木のメモ</span>

          <input type="hidden" id="nestLat" value="${esc(o.nest_latitude||'')}">
          <input type="hidden" id="nestLon" value="${esc(o.nest_longitude||'')}">
        </details>

        <details class="fold" id="foldMedia">
          <summary><span class="lab" style="display:inline; margin:0;">📷 メディア記録</span>
            <span class="small muted">写真・録音・動画</span></summary>
          <div class="field"><span class="lab">録音メモ（鳴き声など）</span><div id="recPanel"></div></div>
          <div class="field"><span class="lab">写真・動画</span><div id="mediaPanel"></div></div>
          <!-- 図鑑・鳴き声のリンク（種名から作る）。2026-11-07 種名の下からメディアの中へ移した -->
          <div class="field"><span class="lab">図鑑・鳴き声</span><div class="chips" id="spRefLinks"></div></div>
        </details>

        <details class="fold obs-only" id="foldReg">
          <summary><span class="lab" style="display:inline; margin:0;">🕮 登録</span>
            <span class="small muted">図鑑登録・別カメラの番号</span></summary>
          <button type="button" class="btn ghost" style="margin-bottom:10px;" onclick="addObsToGuide()">🕮 この鳴き声・写真を図鑑に登録（確定種）</button>
          <label class="field"><span class="lab">外部写真番号・ファイル名</span>
            <input name="external_photo_reference" value="${esc(o.external_photo_reference)}" placeholder="別カメラの写真番号など"></label>
        </details>

        <!-- 観察者の位置は画面に出さず保存時にGPSから入れる。otLat/otLon が P（鳥がいた場所） -->
        <input type="hidden" id="latIn" value="${esc(o.latitude)}">
        <input type="hidden" id="lonIn" value="${esc(o.longitude)}">
        <input type="hidden" id="otLat" value="${esc(o.target_latitude||'')}">
        <input type="hidden" id="otLon" value="${esc(o.target_longitude||'')}">
      </form>
      <!-- 「＋ 保存して続けて次の記録へ」ボタンは現場でほぼ使われないため非表示（v199）。
           saveObs の next=true と位置引き継ぎ（keep）の仕組み自体は残している -->
      ${editing?`<div class="sp"></div><button class="btn danger" onclick="deleteObs('${o.uuid}')">この記録を削除</button>`:''}
      <div class="sp"></div>
      <div class="note">地図の <b>P</b> で鳥がいた場所、<b>L</b> で飛んだ経路を記録します。範囲（旋回上昇・行動範囲など）は、囲ってから<b>始点をもう一度タップ</b>すると面になります。落とした内容に応じて記録が作られ、時刻と距離帯は自動で入ります。</div>
      <!-- 現場でいちばん押すのは「保存して次の個体へ」なので、こちらを常に見える位置に置く。
           記録を直しているとき（editing）は次の個体に進む場面ではないので「保存する」を前に出す -->
      <div class="savebar">${editView
        ? `<button class="btn primary big" onclick="saveObs('${o.uuid}','${svUuid}',${editing},false)">保存する</button>`
        : `<button class="btn primary big" onclick="saveObs('${o.uuid}','${svUuid}',${editing},'addBird')">💾 保存して次の個体へ</button>`}</div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        ${editView
          ? `<button type="button" class="btn" style="flex:1;" onclick="saveObs('${o.uuid}','${svUuid}',${editing},'addBird')">💾 保存して次の個体へ</button>`
          : `<button type="button" class="btn" style="flex:1;" onclick="saveObs('${o.uuid}','${svUuid}',${editing},false)">保存する</button>`}
        ${BIRDS.length>1?`<button type="button" class="btn danger" style="flex:1;" onclick="birdDrop()">この個体を消す</button>`:''}
      </div>
      <!-- 「複数羽を同時に追う」の入口は出さない（2026-11-07 ユーザー: 不要）。画面・保存の仕組みは残す -->
    `,
    onMount:()=>{ SCREENS._obs=o;
      if(revisitBird){
        // 個体の切替: 状態は入れ物に生きているので読み直さない。
        // 画面（入力欄・添付・地図）だけを入れ物の内容へ「その場で」合わせ直す。
        //（後回しにすると、その隙の保存・離脱が復元前の空の値を使ってしまう）
        try{ formRestore(document.getElementById('obForm'), revisitBird.form||null); }catch(e){}
        // 復元した選択の「その他」欄・折りたたみ見出しの要約も表示へ反映する
        try{
          document.querySelectorAll('#obForm [data-seg]').forEach(sg=>{
            const f2=sg.getAttribute('data-seg');
            try{ if(typeof syncOther==='function') syncOther(f2); }catch(e){}
            try{ if(typeof segSumUpdate==='function') segSumUpdate(f2); }catch(e){}
          });
        }catch(e){}
        obsBindFormWatch();   // 組み直したフォームに変更監視を掛け直す
        obsOnlyInitReapply();  // 「最初の状態に戻す」の基準も新しいDOMへ掛け直す
        try{ renderRecPanel(); renderMediaPanel(); }catch(e){}
        SCREENS._flSeg=null;   // 組み直したDOMへ必ず flLoadFrom させる（取込データの未知の行動の選択肢を再生成）
        try{ perchTabs(); perchLoad(); segChips(); nestSync(); pfInfo(); pfSyncFlightFields(); legacyPosNoteSync(); }catch(e){}
        try{ if(typeof updateIdHint==='function') updateIdHint(); }catch(e){}
        try{ if(typeof updateBreedHint==='function') updateBreedHint(); }catch(e){}
        try{ indLabelChips(); }catch(e){}
        try{ if(typeof startGpsIndicator==='function') startGpsIndicator(); }catch(e){}
        SCREENS._dirty=!!revisitBird.dirty;
        birdListSync();
        _mapTimer=setTimeout(()=>{ initObsPosMap(); }, 60);
        return;
      }
      // 経路を軸に開いたときは、録音・写真の持ち主も最初から経路にする
      //（観察名義で撮ってから付け替える方式は、途中で失敗すると持ち主が食い違う）
      SCREENS._mediaCtx = flAnchor
        ? {kind:'flight', uuid:flAnchor.uuid, sv:o.survey_uuid}
        : {kind:'obs', uuid:o.uuid, sv:o.survey_uuid};
      SCREENS._audio=(o.audio||[]).slice(); SCREENS._media=(o.media||[]).slice();
      // 環境・営巣木の写真も読み直す（2026-08-14 追加）
      SCREENS._envMedia=(o.env_media||[]).slice(); SCREENS._nestMedia=(o.nest_media||[]).slice();
      // 記録モードは毎回「止まっている」から始める（前の画面の経路を持ち越さない）
      // 地図の状態は毎回まっさらから始める（前の画面の内容を持ち越さない）
      PF_MODE='P'; PF_SEGS=[]; PF_NEWLINE=true; PF_SPIRAL=false; flightPath=[]; flightLayer=null; pfLayer=null;
      PF_PAN=true; PF_PT=false;   // 開いたときは「✋ 移動」（地図を動かすだけ）。置くときは P・L・N を押す（2026-11-08 ユーザー決定）
      PF_NEST=null; PF_NEST_ID=nestId(o); PERCH_IDX=0; PF_SEL=-1;
      SCREENS._flSeg=null; PF_HIST=[]; PF_SEQ=0;
      // 「保存して続けて」で位置を引き継いだときは、その位置を守る（空のまま引き継いだ場合も）
      SCREENS._keepPos = !!(initKeep && ('lat' in initKeep));
      // 位置が無いために P を出せない古い記録でも、止まり木の情報は持っている。
      // あとから P を足したとき、その P に引き継ぐ（空で上書きして失わないように）
      SCREENS._pendingPerch=null; SCREENS._hadP=false;
      // 「この画面で指定した」だけを指定済みとする。新規で最初から値がある＝音声や引き継ぎでの指定
      //（編集で開いただけの既存値は、そのままでは他のPにまで配られてしまうので別扱いにする）
      SCREENS._bandTouched=(!editing) && !!o.distance_band;
      if(validLatLon(coordStr(o.nest_latitude), coordStr(o.nest_longitude))){
        PF_NEST=[parseFloat(o.nest_latitude), parseFloat(o.nest_longitude)];
      }
      if(editing && validLatLon(coordStr(o.target_latitude), coordStr(o.target_longitude))){
        // 既存記録を開いたとき: 鳥の位置は P として地図に出す。
        // 「止まっていたもの」も一緒に読み込む（読み込まないと、開いて保存し直すだけで消える）
        PF_SEGS.push({t:'P', id:pfId(), fromExisting:true, srcUuid:o.uuid, pt:[parseFloat(o.target_latitude), parseFloat(o.target_longitude)], time:o.observed_at||'',
          perch:{ // 古い記録には「種類」が無い。木の項目だけが入っていれば木として読み替える。
                  // 人工物・メモも混ざっているときは推定しない（推定すると木以外の項目が保存で削られる）
                  type:o.perch_type||((!o.perch_artificial && !o.perch_note
                    && (o.perch_size||o.perch_class||o.perch_species||o.perch_height))?'木':''),
                  size:o.perch_size||'', cls:o.perch_class||'',
                  species:o.perch_species||'', height:o.perch_height||'',
                  art:o.perch_artificial||'', note:o.perch_note||'' }});
      }
      // 同じ鳥（individual_key）の他の記録もまとめて読み込む。
      // 1羽を「止まり2か所＋経路1本」と分けて保存した記録を、開き直したときも1画面で扱えるように
      SCREENS._loadedObs=[]; SCREENS._loadedFl=[];
      SCREENS._flAnchorUuid = flAnchor ? flAnchor.uuid : '';
      // 経路のカードから開いたときは、その経路（と同じ鳥の経路）を読み込む
      if(flAnchor){
        const flKey=flAnchor.individual_key||'';
        DB.flightsOf(svUuid)
          .filter(f=>flKey ? f.individual_key===flKey : f.uuid===flAnchor.uuid)
          .sort((a,b)=>String(a.start_time||'').localeCompare(String(b.start_time||'')))
          .forEach(f=>{
            // 2点未満（壊れた・作りかけの経路）も読み込む。読み込まないと直すことも消すこともできない
            const path=(f.path||[]).filter(validPathPt);
            SCREENS._loadedFl.push(f.uuid);
            PF_SEGS.push({t:'F', id:pfId(), fromExisting:true, srcUuid:f.uuid,
              pts:path.map(pt=>pt.slice()), times:path.map(()=>''),
              fl:{height:f.height_class||'', behavior:f.behavior||'',
                  // 形も引き継ぐ。引き継がないと、開いて保存し直すだけで面が線に戻る
                  shape:shapeOf(f), area_type:f.area_type||''},
              soars:soarSpotsOf(f),   // 線の途中の◎（項目が無い古い記録は◎なし）
              // 開いたときの形を控える。**形を変えたら「触った」扱いにする**ため
              //（控えないと、2点の線を面に変えても検査を素通りする）
              shape0:shapeOf(f),
              // 1点目が引き継いだ点かどうかも戻す（「始」の印の位置と、面にするとき外す点）
              cont:contOf(f),
              ov:{start:f.start_time||'', end:f.end_time||''}});
          });
      }
      if(editing && o.individual_key){
        const perchOf=x=>({ type:x.perch_type||((!x.perch_artificial && !x.perch_note
            && (x.perch_size||x.perch_class||x.perch_species||x.perch_height))?'木':''),
          size:x.perch_size||'', cls:x.perch_class||'', species:x.perch_species||'', height:x.perch_height||'',
          art:x.perch_artificial||'', note:x.perch_note||'' });
        DB.obsOf(svUuid).filter(x=>x.individual_key===o.individual_key && x.uuid!==o.uuid)
          .sort((a,b)=>String(a.observed_at||'').localeCompare(String(b.observed_at||'')))
          .forEach(x=>{
            if(!validLatLon(coordStr(x.target_latitude), coordStr(x.target_longitude))) return;
            SCREENS._loadedObs.push(x.uuid);
            PF_SEGS.push({t:'P', id:pfId(), fromExisting:true, srcUuid:x.uuid,
              pt:[parseFloat(x.target_latitude), parseFloat(x.target_longitude)], time:x.observed_at||'',
              perch:perchOf(x)});
          });
        DB.flightsOf(svUuid).filter(f=>f.individual_key===o.individual_key)
          .sort((a,b)=>String(a.start_time||'').localeCompare(String(b.start_time||'')))
          .forEach(f=>{
            const path=(f.path||[]).filter(validPathPt);
            SCREENS._loadedFl.push(f.uuid);
            PF_SEGS.push({t:'F', id:pfId(), fromExisting:true, srcUuid:f.uuid,
              pts:path.map(pt=>pt.slice()), times:path.map(()=>''),
              fl:{height:f.height_class||'', behavior:f.behavior||'',
                  // 形も引き継ぐ。引き継がないと、開いて保存し直すだけで面が線に戻る
                  shape:shapeOf(f), area_type:f.area_type||''},
              soars:soarSpotsOf(f),   // 線の途中の◎（項目が無い古い記録は◎なし）
              // 開いたときの形を控える。**形を変えたら「触った」扱いにする**ため
              //（控えないと、2点の線を面に変えても検査を素通りする）
              shape0:shapeOf(f),
              // 1点目が引き継いだ点かどうかも戻す（「始」の印の位置と、面にするとき外す点）
              cont:contOf(f),
              ov:{start:f.start_time||'', end:f.end_time||''}});
          });
      }
      // 飛翔経路から「止まったところを記録」で来たとき、終点を P として置く
      if(!editing && initKeep && validLatLon(String(initKeep.plat||''), String(initKeep.plon||''))){
        PF_SEGS.push({t:'P', id:pfId(), pt:[parseFloat(initKeep.plat), parseFloat(initKeep.plon)],
          time:localDatetimeValue(), perch:perchNew()});
      }
      // 兄弟から読み込んだPを混ぜない。「開いた記録自身にPがあったか」だけで判定する
      //（混ぜると、位置なしの開いた記録の止まり木情報が、兄弟のPのせいで空にされる）
      SCREENS._hadP = editing && validLatLon(coordStr(o.target_latitude), coordStr(o.target_longitude));
      if(editing && !SCREENS._hadP){
        const pk={ type:o.perch_type||((!o.perch_artificial && !o.perch_note
          && (o.perch_size||o.perch_class||o.perch_species||o.perch_height))?'木':''),
          size:o.perch_size||'', cls:o.perch_class||'', species:o.perch_species||'',
          height:o.perch_height||'', art:o.perch_artificial||'', note:o.perch_note||'' };
        // 表示用の引き継ぎ。保存時の元値の保持は「受け持つPが未編集なら元記録から逐語コピー」
        // の規則が受け持つ（画面に出せない数値の0やfalseもそちらで保たれる）
        const hasAnyPerch=['perch_type','perch_size','perch_class','perch_species','perch_height','perch_artificial','perch_note']
          .some(k=>o[k]!==undefined && o[k]!==null && o[k]!=='');
        if(hasAnyPerch){ SCREENS._pendingPerch=pk; }
      }
      SCREENS._chosenId=o.species_id||''; SCREENS._obsEditing=editing;
      // 精度の扱い: null=保存時に既存値を維持 / ''=不明（手入力座標） / 数値=確定値。初期値は画面に表示している精度と一致させる
      SCREENS._acc=(o.gps_accuracy===''||o.gps_accuracy==null)?null:o.gps_accuracy;
      // 距離帯・日時・齢・個体数・巣などの変更監視は共通関数で登録する（個体切替後の組み直しでも使う）
      // 個体名を触ったか。触っていないのに空欄というだけで、同じまとまりの記録から
      // 名前を消してしまわないため（名前なしの記録を開いて保存しただけ、という場面がある）
      SCREENS._indLabelTouched=false;
      SCREENS._obsAtTouched=false;   // 観察日時を触ったか。触った指定を、Pを落とした時刻で上書きしないため
      SCREENS._ageTouched=false;     // 齢を触ったか。触っていない保存では既存の飛翔の齢（空含む）を残す
      obsBindFormWatch();
      if(initVoice) SCREENS._dirty=true;   // 音声の下書きが入っている＝未保存の入力として離脱時に確認する
      renderQuickSpecies(); renderRecPanel(); renderMediaPanel(); updateSpRefLinks(o.species_name_snapshot);
      indLabelChips();   // その調査で使った個体名をすぐ選べるように
      updateBreedHint(); updateIdHint();
      if(typeof startGpsIndicator==='function') startGpsIndicator();   // 観察者の位置は保存時に使う
      // 入力欄への読み込みは今すぐ行う。地図の用意（60ms待ち）を待つと、
      // その前に保存された場合に空の入力欄で既存の値を上書きしてしまう
      SCREENS._obsOnlyInit=null;
      SCREENS._behT=null; SCREENS._obsBeh=behVal();   // 行動の欄は観察を指した状態から始める
      nestFoldSync();
      pfSyncFlightFields(); perchTabs(); perchLoad(); segChips(); nestLabelSync();
      obsOnlyCapture();   // ここまでが「最初の状態」
      // 個体数を利用者が触ったかを見分ける（巣だけの記録で、初期値の1羽を勝手に数えないため）。
      // 値の比較ではなく操作で見分ける——一度変えて元に戻した「1羽」は利用者の指定なので守る
      SCREENS._countTouched=false; SCREENS._nestTouchedMap=false; SCREENS._nestTouchedForm=false;
      // この画面を開いたとき、巣が見えていたか。見えていなかった画面からの「巣を空にする」は
      // 他の記録に配らない（見えないものは消せない、が原則）
      SCREENS._hadNestAtOpen = !!(nestId(o)
        || validLatLon(coordStr(o.nest_latitude), coordStr(o.nest_longitude))
        || o.nest_state || o.nest_tree_species || o.nest_tree_height);
      // 開いたとき見えていた巣の目印・位置・内容。伝播の照合はこれを基準にする
      //（editing の元記録でも、引き継ぎで読み込んだ巣でも同じ扱いになる）
      SCREENS._openNest = SCREENS._hadNestAtOpen
        ? { id:nestId(o), pos:nestPosKey(o), fp:nestFpKey(o) } : null;
      // 話して入れた個体数も、利用者が指定したものとして扱う（勝手に0羽へ書き換えない）
      if(initVoice && initVoice.count) SCREENS._countTouched=true;
      //（個体数・巣の記入欄の監視は obsBindFormWatch で登録済み）
      // 音声の下書きのうち観察にしか置き場所が無い項目は、ここで入れる。
      // こうすると「利用者が入れたもの」として扱われ、経路だけで保存しようとしたときに気づける
      if(initVoice){ const vd=initVoice;
        if(vd.detection_method) segSet('detection_method', vd.detection_method);
        if(vd.distance_band) segSet('distance_band', vd.distance_band);
        if(vd.direction) segSet('direction', vd.direction);
        if(vd.behavior) String(vd.behavior).split('・').filter(Boolean).forEach(x=>{
          const b=[...document.querySelectorAll('[data-seg="behavior"] button')].find(y=>y.textContent===x);
          if(b && !b.classList.contains('on')) b.click(); });
        updateBreedHint(); updateIdHint();
      }
      // 古い記録の位置は「止まり木・巣など」の共通の位置だった。巣の情報があるのに巣の位置が無いなら、
      // その位置は巣かもしれない。勝手に決めず、移せるように案内だけ出す
      PF_LEGACY_ID=null;
      if(editing && pfPoints().length && !validLatLon(coordStr(o.nest_latitude), coordStr(o.nest_longitude))
        && (o.nest_state||o.nest_tree_species||o.nest_tree_height)){
        const ownP=PF_SEGS.find(sg=>sg.t==='P' && sg.srcUuid===o.uuid);
        PF_LEGACY_ID=ownP?ownP.id:null;
      }
      legacyPosNoteSync();
      birdListSync();
      _mapTimer=setTimeout(()=>{ initObsPosMap(); }, 60);   // 地図は画面の主役なので最初から出す   // 編集で開いたときも選択済みの内容に合わせてヒントを出す
    }
  };
};
// 複数羽の同時トレース（タブで色分けして何羽ぶんも線を引く専用画面）。
// 記録の入口は統合画面に一本化したので、ここだけがこの画面への道になる
function openMultiTrace(svUuid){
  if(typeof birdBusy==='function' && birdBusy()) return;
  const name=(($('#spInput')&&$('#spInput').value)||'').trim();
  const keep={ species_id:SCREENS._chosenId||'', species_name:name,
    age_class:(typeof segVal==='function'?segVal('age_class'):'')||'' };
  nav('flightEdit', JSON.stringify({sv:svUuid, keep, multi:1}));
}
function pickObs(btn,field,val){
  const before=btn.classList.contains('on');   // 同じ値を押し直しただけなら未保存扱いにしない（無用な離脱確認を出さない）
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); syncOther(field);
  // 経路の読み込みで押した分は「書きかけ」にしない（toggleMulti と同じ扱い）。
  // しないと、トレースを選び直しただけで離脱確認が出る
  if(!before && !SCREENS._flLoading) SCREENS._dirty=true;
  if(field==='identification_status') updateIdHint(); }
function segVal(field){ const root=document.querySelector(`[data-seg="${field}"]`); if(!root) return '';
  if(root.tagName==='SELECT') return root.value;   // プルダウン版（「なし」は value="" なのでそのまま空）
  const on=root.querySelector('button.on'); return on? (on.textContent==='なし'?'':on.textContent):''; }
// 選択欄に値を入れる。プルダウンでもボタン群でも同じ書き方で使えるようにする
//（プルダウンに作り替えた項目にボタン向けの処理が残ると、音声や種名の選び直しが効かなくなる）
function segSet(field, value){
  const root=document.querySelector(`[data-seg="${field}"]`); if(!root) return false;
  if(root.tagName==='SELECT'){
    if(value && !Array.from(root.options).some(op=>op.value===value)){
      const op=document.createElement('option'); op.value=value; op.textContent=value; root.appendChild(op);
    }
    root.value=value||'';
    root.dispatchEvent(new Event('change',{bubbles:true}));
    return true;
  }
  const b=[...root.querySelectorAll('button')].find(x=>x.textContent===(value||'なし'));
  if(b && !b.classList.contains('on')) b.click();
  return !!b;
}
function segVals(field){ return [...document.querySelectorAll(`[data-seg="${field}"] button.on`)].map(b=>b.textContent).filter(t=>t!=='なし').join('・'); }

/* ---------- 入力中のライブガイド（Survey123の「条件つき質問」に相当） ----------
   render()は使わない（画面を作り直すと編集中の入力が全部消え、新規なら記録IDまで変わるため）。
   HTMLに置いた非表示のヒント欄の文言と表示だけを書き換える。
   各関数は冒頭の要素ガードが必須: 行動segは飛翔経路の入力画面にもあり、そこで誤動作させないため */
const NEST_BEHAVIORS=['巣立ち雛','給餌','餌運び','餌渡し','巣材運搬'];   // 巣・対象位置の欄を自動で開く行動
function updateBreedHint(){
  const el=$('#breedHint'); if(!el) return;
  const bs=segVals('behavior');
  const rank=breedingRank(bs, true);
  if(rank==='A' || rank==='B'){
    el.style.display='';
    el.textContent = rank==='A' ? '🐣 この行動は繁殖ランクA（繁殖を確認）に相当します'
                                : '🐣 この行動は繁殖ランクB（繁殖の可能性）に相当します';
  }else el.style.display='none';
  // 巣に関わる行動なら、巣・対象位置の入力欄を自動で開く（開くだけで閉じない——入力済みかもしれないため）。
  // 「さえずり」等のB該当だけでは開かない（最頻タグのため毎回開くと邪魔になる）
  const fold=$('#foldNest');
  if(fold && bs.split('・').some(b=>NEST_BEHAVIORS.includes(b))) fold.open=true;
}
function updateIdHint(){
  const el=$('#idHint'); if(!el) return;
  const v=segVal('identification_status');
  if(v==='未同定' || v==='仮同定'){
    el.style.display='';
    // 自動付与は新規保存のみのため、断定しない文言にする（編集時は付かない——利用者の判断を尊重する仕様）
    el.textContent='💡 録音・写真や根拠メモを残しておくと、あとで同定できます（新規の記録には保存時に「要確認」が自動で付きます）';
  }else el.style.display='none';
}

/* ---------- 「その他」の記入欄 ----------
   「その他」ボタンを選ぶと記入欄が現れ、保存時は値の「その他」を「その他（記入内容）」に
   置き換えて同じ項目に格納する（列を増やさずCSV・検索・表示にそのまま出る）。
   編集時は otherParse で「その他」と記入内容に分解して、ボタン一致と記入欄の初期値に使う */
function otherParse(v){ v=String(v||''); const m=v.match(/その他（([^）]*)）/);
  return m? {v:v.replace(m[0],'その他'), other:m[1]} : {v, other:''}; }
function otherBox(field, other, show){
  return `<input data-other="${field}" value="${esc(other||'')}" placeholder="「その他」の内容を記入（任意）"
    style="margin-top:6px;${show?'':'display:none;'}" oninput="otherInput('${field}')">`; }
// 「その他」の記入: 行動の欄は、記入した瞬間に今の対象（線／観察）へ控える（↶ や切り替えで失わないように。監査 Major）
function otherInput(field){
  if(SCREENS._flLoading) return;
  SCREENS._dirty=true;
  if(field==='behavior' && typeof behStoreCur==='function') behStoreCur();
}
function otherMerge(val, field){
  const inp=document.querySelector(`[data-other="${field}"]`);
  const t=inp?inp.value.trim():''; if(!t) return val;
  return String(val||'').split('・').map(x=>x==='その他'?`その他（${t}）`:x).join('・'); }
function syncOther(field){
  const inp=document.querySelector(`[data-other="${field}"]`); if(!inp) return;
  const on=[...document.querySelectorAll(`[data-seg="${field}"] button.on`)].some(b=>b.textContent==='その他');
  inp.style.display=on?'':'none'; }
function toggleMulti(btn){ btn.classList.toggle('on');
  const seg=btn.closest('[data-seg]'); if(seg){ syncOther(seg.dataset.seg); segSumUpdate(seg.dataset.seg); }

async function orthoImport(input){
  const files = Array.from((input && input.files) || []);
  if(input) input.value = '';

  if(!orthoCanWrite()){ toast('このタブは閲覧のみなので、取り込めません'); return false; }

  const problem = orthoPairProblem(files, p);

  allMaps().forEach(applyOrthos);   // 取り込み中は重ねている写真を外す（展開・透明化のメモリと重ならないように）
  const n = p.pairs.length, fails = [];

  try{
    for(let i = 0; i < n; i++){
      toast(n > 1 ? `読み込んでいます…（${i+1}/${n}）` : '読み込んでいます…');
      const r = await orthoImportOne(p.pairs[i].img, p.pairs[i].wfile);
      if(r.ok){ ok++; shrunk = shrunk || r.shrunk; if(r.alpha === 'ng') alphaNg++; }
      else{

  if(ok){ await orthoResync(); orthoNotify(); }
  else allMaps().forEach(applyOrthos);   // 外していた写真を戻す
  const alphaNote = alphaNg ? `${alphaNg}枚は透明にできず、そのまま入れました（端末のメモリ不足かもしれません。PC の道具で透明にしてから入れ直せます）` : '';
  if(stopped){
    alert(`${ok}枚を取り込みました。${ORTHO_LOST}（残り ${n-ok}組は入れていません）` + (alphaNote ? '\n' + alphaNote : ''));
  }else if(fails.length){
    if(n === 1) alert(fails[0].why);
    else alert(`${ok}枚を取り込み、${fails.length}枚は取り込めませんでした：\n` + fails.map(f=>`・${f.name}：${f.why}`).join('\n') + (alphaNote ? '\n' + alphaNote : ''));

    const note = shrunk ? '（大きかったので縮めました）' : '';

async function orthoDeleteMany(ids){

  if(!orthoCanWrite()){ toast('このタブは閲覧のみなので、消せません'); return false; }
  if(!confirm(`選んだ ${ids.length}枚を消します。よろしいですか？`)) return false;

    // 1枚ごとに使用権を確かめ、失ったらそこでやめる（1枚が消せなかっただけなら残りは続ける）

function orthoControlEntry(m, overlays){

function orthoEntrySync(){

/* 地図の拡大の上限（v235 ユーザー要望「もう少しズームしたい」）。地理院タイルは18段までなので、

  };

function compassStop(){
  if(_compassHandler){ window.removeEventListener(_compassEvName, _compassHandler); _compassHandler=null; }

// 方位（磁北から時計回りの度）を算出。iOSはwebkitCompassHeading、その他は3軸（alpha/beta/gamma）から算出。
// 水平に持ったときは「端末の上端が向く方向」、立てて持ったときは「画面の裏＝自分が見ている方向」を使う
//（どちらか一方だけだと、持ち方によって計算不能・大ズレになるため切り替える）
function headingFromOrientation(e){
  if(typeof e.webkitCompassHeading==='number' && isFinite(e.webkitCompassHeading)) return e.webkitCompassHeading;
  if(!(e.absolute===true || _compassEvName==='deviceorientationabsolute')) return null;
  const a=e.alpha, b=e.beta, g=e.gamma;
  if(!Number.isFinite(a)) return null;
  if(!Number.isFinite(b) || !Number.isFinite(g)) return (360-a)%360;   // 3軸が揃わない端末は簡易計算
  const d=Math.PI/180;
  const cA=Math.cos(a*d), sA=Math.sin(a*d), cB=Math.cos(b*d), sB=Math.sin(b*d), cG=Math.cos(g*d), sG=Math.sin(g*d);
  const Ey=-sA*cB, Ny=cA*cB;                       // 端末の上端（y軸）の東・北成分
  if(Math.hypot(Ey,Ny)>0.15) return (Math.atan2(Ey,Ny)/d+360)%360;
  const Ez=sG*cA + sB*cG*sA, Nz=sG*sA - sB*cG*cA;  // ほぼ立てて持っている場合: 画面の裏（-z軸）の向き
  return (Math.atan2(-Ez,-Nz)/d+360)%360;
}
function compassToggle(btn){
  if(_compassOn || _compassHandler){ compassStop(); toast('向き追従をやめました（地図の向きはそのまま）'); return; }
  const req=++_compassReq;   // この操作の世代番号（許可待ち中に画面が変わったら無効化される）
  const start=()=>{
    if(req!==_compassReq){ return; }   // 待っている間に地図が破棄された（別画面へ移動した）
    let last=null, got=false;
    _compassEvName=('ondeviceorientationabsolute' in window)?'deviceorientationabsolute':'deviceorientation';
    _compassHandler=(e)=>{
      const h=headingFromOrientation(e);
      if(h==null) return;
      if(!got){ got=true;   // 最初の有効な値を受け取ってから「動作中」の表示にする
        const bb=document.getElementById('compassBtn'); if(bb){ bb.style.background='var(--accent)'; bb.disabled=false; }
        toast('自分の向きが画面の上になります（🧭をもう一度押すと解除）');
      }
      if(last!=null && Math.abs(((h-last+540)%360)-180)<2) return;   // 2度未満の揺れは無視（チラつき防止）
      last=h;
      if(mapObj && typeof mapObj.setBearing==='function'){ try{ mapObj.setBearing(-h); }catch(err){} }
    };
    window.addEventListener(_compassEvName, _compassHandler);

}

  // 小窓の位置はそのまま（新しい空の個体は描き直しで一番上から始まる）

try{ if(window.ResizeObserver){ const ro=new ResizeObserver(()=>sheetSync()); document.addEventListener('DOMContentLoaded', ()=>{ const a=document.querySelector('.app'); if(a) ro.observe(a); }); const a=document.querySelector('.app'); if(a) ro.observe(a); } }catch(e){}

/* ---------- 描くモード（✏ 描く）。観察の地図・飛翔の地図で共用 ----------
   状態: 'idle'（待機）／'draw'（1本のペン・指でなぞっている）／'gesture'（2本指の操作中）。
   - 描くモード中は地図のドラッグ移動・2本指回転・ダブルタップ拡大を止める（オフで**開始前の状態に**戻す）
   - 2本目の接触で描きかけを捨てて 'gesture' へ。拡大縮小は Leaflet に任せ、全部離れるまで点を足さない
   - なぞり終えた直後の click は点の追加に使わない（同じ操作が二重に入らない）
   - 地図上のボタン（.leaflet-control）からは描き始めない
   - 確定は onCommit(latlngs, times) に一括で渡す（呼び出し側が履歴を1件だけ積む） */
const DRAW_MIN_PX=3, DRAW_TOL_PX=2.5, DRAW_MAX_PTS=300, DRAW_COLLECT_MAX=4000, DRAW_MIN_LEN_PX=10;
/* ペンのタップ: ペン先は「トン」と触れても少しずれるため、地図の部品（Leaflet）は地図を少し動かしたと
   受け取り、click を出さないことがある（2026-11-07 実機: ペンで P・N が置けない）。
   描くモードがオフのとき、ペンの接触が小さく短ければ自前でタップとして扱い、後から来る click は二重にしない */
const PEN_TAP_PX=12, PEN_TAP_MS=600;
/* 長押しで選ぶ（2026-11-07 実機の要望「一度描いた線や点を直したい」）。短いタップは今までどおり新しく置く。
   止まりは飛んできた線の終点に置くことが多く、短いタップで選ぶ作りにすると新しく置けなくなるため長押しにした。
   長押しが成立したら、**その接触**から出るタップ・ペンのタップ・なぞりの確定・地図の click は処理しない */
const LONGPRESS_MS=500, LONGPRESS_PX=12;
let _draw=null;   // {m, el, on, state, pts, times, pid, pointers:Set, tmp, prev:{...}, btn, onCommit, onToggle, blockClickUntil, handlers}
function drawClickBlocked(){ return !!(_draw && Date.now() < _draw.blockClickUntil); }
function drawIsOn(){ return !!(_draw && _draw.on); }
// 間引き: 形を保ったまま点を減らす（Douglas–Peucker、画面上の距離）。
// 距離は**線分上の最近点まで**で測る（無限に延びる直線までで測ると、折り返しや、
// 始点に戻る一周の線が消える。2026-11-07 監査 Major）
function drawSegDist(p, a, b){
  const dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy;
  if(l2===0) return Math.hypot(p.x-a.x, p.y-a.y);   // 両端が同じ点なら端点までの距離
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2; t=Math.max(0, Math.min(1, t));
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}
function drawSimplify(pts, tol){
  if(pts.length<3) return pts.slice();
  const keep=new Uint8Array(pts.length); keep[0]=1; keep[pts.length-1]=1;
  const stack=[[0, pts.length-1]];
  while(stack.length){
    const [a,b]=stack.pop(); let idx=-1, dmax=0;
    for(let i=a+1;i<b;i++){ const d=drawSegDist(pts[i], pts[a], pts[b]); if(d>dmax){ dmax=d; idx=i; } }
    if(dmax>tol && idx>0){ keep[idx]=1; stack.push([a,idx],[idx,b]); }
  }
  return pts.filter((_,i)=>keep[i]);
}
function drawAttach(m, opts){
  drawDetach();
  const el=m.getContainer();
  const d={m, el, on:false, state:'idle', pts:[], times:[], pid:null, pointers:new Set(), tmp:null, prev:null,
    btn:null, onCommit:opts.onCommit, onToggle:opts.onToggle||null, onTap:opts.onTap||null, blockClickUntil:0, handlers:{},
    onDrawTap:opts.onDrawTap||null,   // 描くモード中の軽いタップ（短いなぞり）を受け取る
    pen:null,    // pen … 描くモードがオフのときのペンの接触 {id, x, y, t}
    onLongPress:opts.onLongPress||null, lp:null, lpHold:null,   // lp … 長押し待ち {id,x,y,timer}／lpHold … 長押しが成立して押したままの接触
    touching:new Set(), lpMulti:false};   // touching … 地図に触れている接触（描くモードのオン・オフに関係なく）／lpMulti … 2本以上触れた操作の途中
  _draw=d;
  // 長押しの成立。選べたときだけ、その接触の残りの動作を止める（選べなければ何もしない＝今までどおり）
  const lpFire=()=>{
    const lp=d.lp; d.lp=null;
    if(!lp || _draw!==d || !d.onLongPress) return;
    let hit=false; try{ hit=!!d.onLongPress(L.point(lp.x, lp.y)); }catch(err){ console.error(err); }
    if(!hit) return;
    d.lpHold=lp.id; d.pen=null;
    if(d.state==='draw'){ drawTmpClear(d); d.pts=[]; d.times=[]; d.pid=null; d.state='idle'; }   // なぞりの確定もしない
    d.blockClickUntil=Infinity;   // 離すまでの地図の click は使わない（離したら 0.6秒後に解く）
  };
  const C=L.Control.extend({ onAdd:function(){
    const b=L.DomUtil.create('button','draw-btn'); b.type='button'; b.id='drawBtn';
    b.textContent='✏ 描く'; b.title='オンの間は、ペンでも指でもなぞって線を描けます（2本指で拡大縮小）';
    L.DomEvent.disableClickPropagation(b);
    L.DomEvent.on(b,'click',L.DomEvent.stop).on(b,'click',()=>drawSet(!d.on));
    d.btn=b; return b; }});
  new C({position:'topright'}).addTo(m);
  const pt=(e)=>{ const r=el.getBoundingClientRect(); return L.point(e.clientX-r.left, e.clientY-r.top); };
  d.handlers.down=(e)=>{
    // 長押し待ち: 1本だけ触れているときだけ。2本目が来たら待ちを捨て、全部離れるまで始めない
    //（1本目を動かして待ちが消えたあとに2本目を置いても、拡大縮小の途中で選ばれないように。監査 Major）
    d.touching.add(e.pointerId);
    if(d.touching.size>=2) d.lpMulti=true;
    if(d.onLongPress){
      if(d.lpMulti || d.lp || d.lpHold!=null){ drawLpClear(d); }
      else if(!(e.target && e.target.closest && e.target.closest('.leaflet-control, .map-full-tools'))){
        const p0=pt(e); d.lp={id:e.pointerId, x:p0.x, y:p0.y, timer:setTimeout(lpFire, LONGPRESS_MS)};
      }
    }
    if(!d.on){
      d.blockClickUntil=0;   // 新しい接触は別の操作。前のペンのタップの click 抑止は解く（監査 Minor）
      // ペンのタップの見分け（描くモードがオフのとき）。ボタン・印（マーカー）の上ではそれぞれに任せる
      if(e.pointerType==='pen' && d.onTap && !(e.target && e.target.closest && e.target.closest('.leaflet-control, .leaflet-marker-icon, .map-full-tools'))){
        const p=pt(e); d.pen={id:e.pointerId, x:p.x, y:p.y, t:Date.now()};
      } else d.pen=null;
      return;
    }
    // ボタン・地図の拡大表示に重ねた入力欄（.map-full-tools）からは描き始めない・タップにしない（v227 監査 Major）
    if(e.target && e.target.closest && e.target.closest('.leaflet-control, .map-full-tools')) return;
    d.pointers.add(e.pointerId);
    if(d.pointers.size>=2){ drawCancel('gesture'); return; }   // 2本目: 描きかけを捨てて地図の操作へ
    if(d.state!=='idle') return;
    d.state='draw'; d.pid=e.pointerId; d.pts=[pt(e)]; d.times=[new Date()]; d.t0=Date.now();
    try{ el.setPointerCapture && el.setPointerCapture(e.pointerId); }catch(_){}
    if(e.pointerType!=='touch') e.preventDefault();   // ペン・マウスで文字選択などが起きないように
  };
  d.handlers.move=(e)=>{
    if(d.lp && d.lp.id===e.pointerId){ const p=pt(e); if(Math.hypot(p.x-d.lp.x, p.y-d.lp.y)>LONGPRESS_PX) drawLpClear(d); }   // 動かしたら長押しにしない
    if(!d.on){
      // ペンのタップ候補: 途中で一度でも大きく動いたら、元の位置近くへ戻して離してもタップにしない（監査 Major）
      if(d.pen && d.pen.id===e.pointerId){ const p=pt(e); if(Math.hypot(p.x-d.pen.x, p.y-d.pen.y)>PEN_TAP_PX) d.pen=null; }
      return;
    }
    if(d.state!=='draw' || e.pointerId!==d.pid) return;
    const p=pt(e), last=d.pts[d.pts.length-1];
    if(Math.hypot(p.x-last.x, p.y-last.y) < DRAW_MIN_PX) return;
    if(d.pts.length>=DRAW_COLLECT_MAX){ drawCancel('idle'); toast('線が長すぎるので取り消しました。何回かに分けて描いてください', 4000); return; }
    d.pts.push(p); d.times.push(new Date());
    drawTmpUpdate(d);
  };
  d.handlers.up=(e)=>{
    if(d.lpHold!=null && d.lpHold===e.pointerId){   // 長押しで選んだ接触を離した: 何も置かない・描かない
      d.lpHold=null; d.pen=null; d.pointers.delete(e.pointerId);
      d.blockClickUntil=Date.now()+600;   // 離した直後に来る地図の click も使わない
      return;
    }
    if(d.lp && d.lp.id===e.pointerId) drawLpClear(d);
    if(!d.on && d.pen && d.pen.id===e.pointerId){
      const p=pt(e), pen=d.pen; d.pen=null;
      if(Math.hypot(p.x-pen.x, p.y-pen.y)<=PEN_TAP_PX && Date.now()-pen.t<=PEN_TAP_MS){
        let ll=null; try{ ll=d.m.containerPointToLatLng(L.point(pen.x, pen.y)); }catch(_){}
        if(ll){ d.blockClickUntil=Date.now()+600;   // 後から来る地図の click で同じ点を二重に置かない
          try{ d.onTap(ll.lat, ll.lng); }catch(err){ console.error(err); } }
      }
      return;
    }
    d.pointers.delete(e.pointerId);
    if(d.state==='draw' && e.pointerId===d.pid){ drawFinish(d); }
    if(d.state==='gesture' && d.pointers.size===0){ d.state='idle'; d.blockClickUntil=Date.now()+500; }
  };
  d.handlers.cancel=(e)=>{ if(d.pen && d.pen.id===e.pointerId) d.pen=null;
    if(d.lpHold!=null && d.lpHold===e.pointerId){ d.lpHold=null; d.blockClickUntil=Date.now()+600; }
    d.pointers.delete(e.pointerId); drawCancel(d.pointers.size?'gesture':'idle'); };
  el.addEventListener('pointerdown', d.handlers.down, true);
  el.addEventListener('pointermove', d.handlers.move, true);
  el.addEventListener('pointerup', d.handlers.up, true);
  el.addEventListener('pointercancel', d.handlers.cancel, true);
  d.handlers.wend=(e)=>{
    d.touching.delete(e.pointerId);
    if(!d.touching.size) d.lpMulti=false;
    if(d.lp && d.lp.id===e.pointerId) drawLpClear(d);
    if(d.lpHold!=null && d.lpHold===e.pointerId){ d.lpHold=null; d.blockClickUntil=Date.now()+600; }
  };
  window.addEventListener('pointerup', d.handlers.wend);
  window.addEventListener('pointercancel', d.handlers.wend);
  // 画面が隠れたら、描きかけ・長押し・接触の記録をすべて捨てる。離した知らせが届かないまま戻っても、
  // 古い接触が残って長押しが始まらない・click が解けない、とならないように（監査 Major）
  d.handlers.vis=()=>{ if(document.hidden){ drawCancel('idle'); drawResetContacts(d); } };
  document.addEventListener('visibilitychange', d.handlers.vis);
  return d;
}
function drawTmpUpdate(d){
  if(d._raf) return;
  d._raf=requestAnimationFrame(()=>{ d._raf=0;
    if(!_draw || _draw!==d || d.state!=='draw') return;
    let ll; try{ ll=d.pts.map(p=>d.m.containerPointToLatLng(p)); }catch(e){ return; }
    if(!d.tmp) d.tmp=L.polyline(ll,{color:'#e0a030',weight:4,opacity:.85,interactive:false}).addTo(d.m);
    else d.tmp.setLatLngs(ll);
  });
}
function drawLpClear(d){ if(d && d.lp){ clearTimeout(d.lp.timer); d.lp=null; } }
function drawResetContacts(d){
  if(!d) return;
  drawLpClear(d); d.lpHold=null; d.pen=null; d.lpMulti=false;
  d.touching.clear(); d.pointers.clear();
  if(!Number.isFinite(d.blockClickUntil)) d.blockClickUntil=Date.now()+600;   // 解けない抑止を残さない
}
function drawTmpClear(d){ if(d && d.tmp){ try{ d.m.removeLayer(d.tmp); }catch(e){} d.tmp=null; } }
// 描きかけを捨てる（中断・2本目の指・画面が隠れたとき）。点も履歴も増やさない
function drawCancel(nextState){
  const d=_draw; if(!d) return;
  drawLpClear(d);   // 中断・2本目の指・画面が隠れたときは長押し待ちも捨てる
  const wasActive = d.state!=='idle' || d.pts.length>0;   // 描きかけ・2本指の操作があったときだけ直後の click を抑える
  drawTmpClear(d); d.pts=[]; d.times=[]; d.pid=null;
  d.state=nextState||'idle';
  if(wasActive || d.state!=='idle') d.blockClickUntil=Date.now()+500;
}
function drawFinish(d){
  const raw=d.pts, times=d.times; d.pts=[]; d.times=[]; d.pid=null; d.state='idle';
  drawTmpClear(d);
  d.blockClickUntil=Date.now()+500;   // なぞり終えた直後の click で点が二重に入らないように
  let len=0; for(let i=1;i<raw.length;i++) len+=Math.hypot(raw[i].x-raw[i-1].x, raw[i].y-raw[i-1].y);
  if(raw.length<2 || len<DRAW_MIN_LEN_PX){
    // 短すぎるなぞりは線にしない。ただし短く触れただけならタップとして渡す（描くモードのまま
    // 始点を押して面にする・◎を置く・選んだ点を動かす。2026-11-07 実機:「面にできない・◎が置けない」）
    if(d.onDrawTap && raw.length && (Date.now()-(d.t0||0))<=PEN_TAP_MS){
      let ll=null; try{ ll=d.m.containerPointToLatLng(raw[0]); }catch(e){}
      if(ll){ try{ d.onDrawTap(ll.lat, ll.lng); }catch(e){ console.error(e); } }
    }
    return;
  }
  // 間引き。上限を超えたら黙って切らず、間引きを強める
  const idx=raw.map((p,i)=>({x:p.x, y:p.y, i}));
  let tol=DRAW_TOL_PX, s=drawSimplify(idx, tol);
  while(s.length>DRAW_MAX_PTS && tol<200){ tol*=1.6; s=drawSimplify(idx, tol); }
  if(s.length>DRAW_MAX_PTS){ toast('線が複雑すぎるので取り消しました。何回かに分けて描いてください', 4000); return; }
  let ll; try{ ll=s.map(p=>{ const q=d.m.containerPointToLatLng(L.point(p.x,p.y)); return [q.lat, q.lng]; }); }catch(e){ return; }
  const tt=s.map(p=>times[p.i]);
  if(!ll.every(validPathPt)) return;
  try{ d.onCommit(ll, tt); }catch(e){ console.error(e); toast('線を記録できませんでした: '+(e.message||e), 5000); }
}
// 描くモードの切り替え。地図の操作の設定は「開始前の状態」を覚えて戻す（一律オンにしない。計画レビュー M2）
function drawSet(on){
  const d=_draw; if(!d) return;
  if(on===d.on) return;
  const m=d.m;
  if(on){
    d.prev={drag: !!(m.dragging && m.dragging.enabled()), rot: !!(m.touchRotate && m.touchRotate.enabled()),
            dbl: !!(m.doubleClickZoom && m.doubleClickZoom.enabled())};
    try{ m.dragging && m.dragging.disable(); }catch(e){}
    try{ m.touchRotate && m.touchRotate.disable(); }catch(e){}
    try{ m.doubleClickZoom && m.doubleClickZoom.disable(); }catch(e){}
    if(typeof compassStop==='function') compassStop();   // 描いている間に地図が回らないように
    d.on=true; d.el.classList.add('drawing-on');
  } else {
    drawCancel('idle');
    const p=d.prev||{};
    try{ if(p.drag && m.dragging) m.dragging.enable(); }catch(e){}
    try{ if(p.rot && m.touchRotate) m.touchRotate.enable(); }catch(e){}
    try{ if(p.dbl && m.doubleClickZoom) m.doubleClickZoom.enable(); }catch(e){}
    d.on=false; d.el.classList.remove('drawing-on');
  }
  if(d.btn){ d.btn.classList.toggle('on', d.on); d.btn.textContent=d.on?'✏ 描く：オン':'✏ 描く'; }
  if(d.onToggle) d.onToggle(d.on);
}
// 地図を破棄する前に必ず呼ぶ（地図の要素は残ることがあるので、付けた見張りを外す）
function drawDetach(){
  const d=_draw; if(!d) return;
  drawCancel('idle'); drawResetContacts(d);
  try{
    window.removeEventListener('pointerup', d.handlers.wend);
    window.removeEventListener('pointercancel', d.handlers.wend);
    d.el.removeEventListener('pointerdown', d.handlers.down, true);
    d.el.removeEventListener('pointermove', d.handlers.move, true);
    d.el.removeEventListener('pointerup', d.handlers.up, true);
    d.el.removeEventListener('pointercancel', d.handlers.cancel, true);
    document.removeEventListener('visibilitychange', d.handlers.vis);
    d.el.classList.remove('drawing-on');
  }catch(e){}
  _draw=null;
}

// 仮記録の一括破棄。'ok'=全部消せた（または対象なし） / 'abort'=読めないため何も消していない /
// 'restored'=途中失敗したが全部戻せた / 'broken'=戻しきれなかった（点検が必要）
function birdGhostPurge(ghosts){
  const live=[];
  for(const g of ghosts){
    const arr=loadStrict(g.key);
    if(!arr) return 'abort';
    const cur=arr.find(x=>x&&x.uuid===g.uuid);
    if(!cur) continue;   // 本体が無い＝消すものが無い（墓標だけ付ける事故を防ぐため対象外）
    g.prev=JSON.stringify(cur);
    // 「自分が書いた仮記録のまま」を証明できる場合だけ消す。控え（exp）が無い・
    // 一致しない場合は、別の書き手が正式化した可能性があるため触らない（残す）
    if(!g.exp || g.exp!==g.prev){ g.keptReal=true; continue; }
    // 事前の墓標の有無を控える（補償で外してよいのは自分が付けた墓標だけ）
    try{ g.hadTomb=tombstonesList().some(t=>t && (t===g.uuid || t.uuid===g.uuid)); }catch(e){ g.hadTomb=true; }
    live.push(g);
  }
  const attempted=[]; let fail=false;
  for(const g of live){
    // 削除の直前にもう一度読み、本体が控えと全文一致するときだけ消す。
    // 一致しない・消えている場合はその対象に一切触れない（別の書き手の削除・更新を尊重）
    const aD=loadStrict(g.key);
    const cD=aD?aD.find(x=>x&&x.uuid===g.uuid):null;
    if(!aD || !cD || JSON.stringify(cD)!==g.prev){ fail=true; break; }
    // 削除後にあるべき「残りの全文」を先に確定しておく。
    // 削除の読み書きの隙に別の書き手が他の記録を更新していたら、この照合で検知して補償へ回す
    //（検知せず進むと、古い配列の後勝ち保存で相手の更新を消してしまう）
    const expectRest=JSON.stringify(aD.filter(x=>!(x&&x.uuid===g.uuid)));
    attempted.push(g);   // 削除を実行する対象だけを補償の対象にする（触っていない対象を復活させない）
    let okD=false;
    try{
      okD=DB.hardDelete(g.key, g.uuid);
      if(okD){
        const aP=loadStrict(g.key);
        if(!aP || JSON.stringify(aP)!==expectRest) okD=false;   // 消えたこと＋他の記録が無傷なことまで確認
      }
    }catch(e){ okD=false; }
    if(!okD){ fail=true; break; }
  }
  if(!fail) return 'ok';
  let restoredAll=true;
  for(const d of attempted.slice().reverse()){
    // 先に「自分が付けた墓標」だけを外す（事前から墓標があった対象は他者の削除＝外さない）
    let tombLeft=true;
    if(!d.hadTomb){
      if(untombVerified(d.uuid)) tombLeft=false;
      else restoredAll=false;
    }
    try{
      // 墓標がまだ残っている（他者の削除・外せなかった）なら、本体を戻さない
      //（戻すと他者の削除の取り消しになり、墓標との食い違いも生む）
      if(tombLeft){ if(!d.hadTomb) restoredAll=false; continue; }
      const arr=loadStrict(d.key);
      if(!arr){ restoredAll=false; }
      else {
        const idx=arr.findIndex(x=>x&&x.uuid===d.uuid);
        if(idx<0){
          // 本体が無い場合だけ控えを戻す
          arr.push(JSON.parse(d.prev));
          if(!DB.save(d.key, arr)){ restoredAll=false; }
          else {
            const aV=loadStrict(d.key);
            const cV=aV?aV.find(x=>x&&x.uuid===d.uuid):null;
            if(!cV || JSON.stringify(cV)!==d.prev) restoredAll=false;
          }
        } else if(JSON.stringify(arr[idx])!==d.prev){
          // 別の書き手の本体が既にある＝絶対に上書きしない
          restoredAll=false;
        }
      }

function birdAfterSave(u2, add, flU, stay){

  const obsLive = u2 ? DB.observations().find(x=>x&&x.uuid===u2) : null;
  const flLive = flU ? DB.flights().find(f=>f.uuid===flU) : null;
  if(obsLive) b.reinitId=u2; else if(flLive) b.reinitFl=flU;

  try{

      segs.push({t:'P', id:0, pt:[parseFloat(o2.target_latitude), parseFloat(o2.target_longitude)], time:'', perch:perchNew()}); };
    const pushF=f2=>{ const pth=(f2.path||[]).filter(validPathPt);

      const sv2=baseRec.survey_uuid, key2=baseRec.individual_key||'';
      const obsList = key2 ? DB.obsOf(sv2).filter(o2=>o2.individual_key===key2) : (obsLive?[obsLive]:[]);
      const flList  = key2 ? DB.flightsOf(sv2).filter(f=>f.individual_key===key2) : (flLive?[flLive]:[]);
      obsList.forEach(pushP);
      flList.forEach(pushF);
      const nestSrc=obsList.find(o2=>validLatLon(coordStr(o2.nest_latitude), coordStr(o2.nest_longitude)))||null;
      if(nestSrc) b.map.nest=[parseFloat(nestSrc.nest_latitude), parseFloat(nestSrc.nest_longitude)];

  }catch(e){}
  if(add){
    // 保存した個体は**個体の一覧から外す**（入力用のデータだけ。保存した記録・添付は消えない。
    // 地図の保存済みの印・薄描き・「✎ 編集」から開ける）。v239・2026-11-08 ユーザー:
    // 「保存して次の個体へで（種名未入力）が出るのをやめて」
    BIRDS.splice(BIRD_IDX, 1);
    if(!BIRDS.length){ BIRDS.push(newBird()); BIRD_IDX=0; }   // 書きかけが無ければ空の1個体（一覧は出ない）
    else BIRD_IDX=Math.min(BIRD_IDX, BIRDS.length-1);            // 書きかけが残っていれば次の書きかけを開く
  }
  SCREENS._birdKeep=true;
  render();
  // 開いた個体が書きかけなら未保存の印を保つ（離脱確認が効く。v239 計画レビュー Major 1）。空の個体なら立てない
  SCREENS._dirty = add ? !!(CUR() && CUR().dirty) : false;
  if(add && !SCREENS._dirty){ const app=document.querySelector('.app'); if(app) app.scrollTop=0; }   // 新しい空の個体は一番上から

}

/* ---- 囲む（v244。計画: tasks/todo.md「「鳥」ボタンで範囲を囲む」Q1〜Q6・補足。Codex 計画レビュー済み） ----
   なぞった線を閉じて範囲にし、小窓を開く。囲めない形（点が少ない・交差・同じ点・面積 10m² 未満）は置かない */
const PT_AREA_MIN_M2=10;
let PT_TOGGLE_BACK=false;   // 確認で取り消したときに「描く」を元に戻している最中（確認を繰り返さない）
function ptRingFromStroke(ll){
  const out=[];
  (ll||[]).forEach(p=>{ if(!validPathPt(p)) return; const q=[Number(p[0].toFixed(7)), Number(p[1].toFixed(7))];
    const last=out[out.length-1]; if(!last || last[0]!==q[0] || last[1]!==q[1]) out.push(q); });
  if(out.length>1 && out[0][0]===out[out.length-1][0] && out[0][1]===out[out.length-1][1]) out.pop();   // 閉じる点は持たない
  return out;
}
function ptPointInRing(pt, ring){
  let inside=false; const y=pt[0], x=pt[1];
  for(let i=0, j=ring.length-1; i<ring.length; j=i++){
    const yi=ring[i][0], xi=ring[i][1], yj=ring[j][0], xj=ring[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
// 観察の位置（範囲の真ん中）: 面積の重心。重心が面の外（くぼんだ形）なら、重心の緯度の横線と面の交わりの最初の区間の中点
function ptAreaPoint(ring){
  const c=areaCentroid(ring);
  if(c && ptPointInRing(c, ring)) return c;
  const y=c ? c[0] : ring.reduce((a,p)=>a+p[0],0)/ring.length;
  const xs=[];
  for(let i=0, j=ring.length-1; i<ring.length; j=i++){
    const a=ring[j], b=ring[i];
    if((a[0]>y)!==(b[0]>y)) xs.push(a[1]+(y-a[0])*(b[1]-a[1])/(b[0]-a[0]));
  }
  xs.sort((p,q)=>p-q);
  if(xs.length>=2) return [y, (xs[0]+xs[1])/2];
  return ring[0];
}
function ptOpenArea(ll){
  if(!writeAllowed()) return;
  if(!ll || ll.length<2) return;   // 短いなぞり・タップは何もしない
  const ring=ptRingFromStroke(ll);
  const pb=areaProblem(ring);
  if(pb){ toast(`囲めませんでした（${pb}）。もう一度なぞってください`, 4500); return; }
  if(pathArea(ring)<PT_AREA_MIN_M2){ toast('囲めませんでした（範囲が小さすぎます）。もう一度なぞってください', 4500); return; }
  const c=ptAreaPoint(ring);
  ptOpen(c[0], c[1], ring);
}

// 同じ調査で保存済みの記録を、種名つきの印で地図に出す（毎回 DB から。v233 で P・巣・経路にも広げた）。
// 「✋ 移動」のときに印を押すと、確かめてからその記録を開いて直す。P・L・N・鳥を選んでいるときは、印の上でも今までどおり置ける
/* 範囲の鳥の保存（v244 補足 P-M1・P-M2）。観察1件と面1件（大まかな確認範囲）を同じ individual_key で結ぶ。
   - 2件とも小窓の入力と囲んだ時点の控え（c）だけから作る（編集中の観察の種・齢・個体名・時刻を参照しない）
   - 今の観察の保存と同じ控え（bs_save_journal・phase:'writing'）を書いてから、飛翔→観察の順に1件ずつ書く。
     途中で失敗したら今回書いた2件だけを控えどおり戻す。戻せない・控えを消せないときは saveFatalHalt で止める
     （途中でアプリが閉じたら、起動時の saveJournalRecover が控えから戻す） */
function ptSaveArea(c, name, cnt, memo, method){
  if(PT_BUSY || (typeof SAVE_BUSY!=='undefined' && SAVE_BUSY)) return;
  if(!loadStrict(DB.key.fl) || !loadStrict(DB.key.ob)){ toast('記録を読めないため保存できませんでした（入力は残しています）', 5000); return; }
  const sp=speciesByName(name), spId=sp?sp.species_id:'', review=!sp, ik=uuid(), now=nowISO();
  const fl={ uuid:uuid(), survey_uuid:c.sv, species_id:spId, species_name_snapshot:name,
    path:c.area.map(p=>[p[0],p[1]]), start_time:c.localTime, end_time:c.localTime,
    shape:SHAPE_AREA, area_type:'大まかな確認範囲', continued_start:false, height_class:'', age_class:'不明',
    individual_label:'', behavior:'', count:cnt, memo, needs_review:review, individual_key:ik,
    soar_spots:[], audio:[], media:[], created_at:now, updated_at:now };
  const ob={ uuid:uuid(), survey_uuid:c.sv, observed_at:c.time,
    latitude:c.fix?c.fix.lat.toFixed(6):'', longitude:c.fix?c.fix.lon.toFixed(6):'', gps_accuracy:c.fix?Math.round(c.fix.acc):'',
    species_id:spId, species_name_snapshot:name, count:cnt, detection_method:method,
    behavior:'', habitat:'', age_class:'不明', sex:'不明', distance_band:'', direction:'',
    target_latitude:c.lat.toFixed(6), target_longitude:c.lon.toFixed(6), perch_size:'', perch_class:'',
    nest_tree_species:'', nest_tree_height:'', nest_state:'',
    identification_status:'確定', confidence:'中', needs_review:review,
    note:memo, external_photo_reference:'', audio:[], media:[], env_note:'', nest_note:'', env_media:[], nest_media:[],
    individual_key:ik, individual_label:'', source:'point', created_at:now, updated_at:now };
  PT_BUSY=true; SAVE_BUSY=true; if(typeof BACKUP_GEN!=='undefined') BACKUP_GEN++;
  const plan=[{key:DB.key.fl, rec:fl}, {key:DB.key.ob, rec:ob}];
  const j={ t:now, tx:uuid(), phase:'writing', undo:plan.map(p=>({ key:p.key, uuid:p.rec.uuid, prev:null, wroteRec:'' })), fl:null, ghost:null };
  CUR_TX=j.tx;
  const done=(ok)=>{ SAVE_BUSY=false; PT_BUSY=false; CUR_TX=null; return ok; };
  if(!saveJournalSet(j)){ done(false); toast('空き容量が足りず、保存を開始できませんでした（入力は残しています）', 6000); return; }
  const tried=[];   // 書き込みを試みた記録（読み直しで確かめられなくても戻す対象）
  const writeNew=(p, k)=>{
    const arr=loadStrict(p.key); if(!arr || arr.some(x=>x&&x.uuid===p.rec.uuid)) return false;
    j.undo[k].expectedRec=stableJson(p.rec);
    if(!saveJournalSet(j)) return false;
    tried.push(j.undo[k]);
    arr.push(p.rec);
    if(!DB.save(p.key, arr)) return false;
    const a1=loadStrict(p.key); const got=a1 && a1.find(x=>x&&x.uuid===p.rec.uuid);
    if(!got || stableJson(got)!==stableJson(p.rec)) return false;
    j.undo[k].wroteRec=JSON.stringify(got);
    return saveJournalSet(j);
  };
  // 今回書こうとした記録だけを、こちらが書いた姿（書いた直後の控え、無ければ予定値）のままなら消す。
  // 読めない・姿が違う・消せない・消えたことを確かめられないなら false（控えを残して止める）
  const undo=()=>{
    let ok=true;
    for(const e of tried.slice().reverse()){
      const arr=loadStrict(e.key); if(!arr){ ok=false; continue; }
      const i=arr.findIndex(x=>x&&x.uuid===e.uuid);
      if(i<0) continue;   // 書けていなかった
      const mine = e.wroteRec ? JSON.stringify(arr[i])===e.wroteRec : stableJson(arr[i])===e.expectedRec;
      if(!mine){ ok=false; continue; }
      arr.splice(i,1);
      if(!DB.save(e.key, arr)){ ok=false; continue; }
      const a2=loadStrict(e.key); if(!a2 || a2.some(x=>x&&x.uuid===e.uuid)) ok=false;
    }
    return ok;
  };
  for(let k=0;k<plan.length;k++){
    if(!writeNew(plan[k], k)){
      if(undo() && saveJournalClear(j.tx)){ done(false); toast('保存できませんでした（入力は残しています）。空き容量などを確かめてもう一度押してください', 6000); return; }
      done(false); saveFatalHalt('範囲の鳥の保存に失敗し、書きかけを取り消せませんでした。'); return;
    }

  if(!saveJournalClear(j.tx)){ done(false); saveFatalHalt('保存の控えを片付けられませんでした。'); return; }
  done(true);
  DB.pushRecent(name);
  if(typeof scheduleFolderFull==='function') scheduleFolderFull();
  toast(`${name} ${cnt}羽を範囲で記録しました`+(sp?'':'（種名が一覧に無いため要確認を付けました）'), sp?1800:4000);
  ptClose();
  ptDrawMarks();
  if(typeof pfRedraw==='function') pfRedraw();   // 保存済みの面の薄描きに出す
}
