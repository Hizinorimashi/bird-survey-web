<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!-- ピンチ拡大可（屋外・老眼・手袋対応） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f0d">
<title>鳥類調査記録</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png"><!-- iOSはPNGのみ対応（SVG指定だと無視されスクリーンショットが使われる） -->
<link rel="stylesheet" href="./leaflet.css">
<style>
  :root{
    --bg:#0a0f0d; --panel:#12181a; --panel2:#1a2226; --line:#2a3438;
    --fg:#e8efe9; --muted:#8a9a93; --accent:#3fb984; --accent2:#2c8a63;
    --warn:#e0a030; --danger:#d05555; --chip:#233029;
    --radius:14px;
  }
  /* 屋外モード（明るい表示）。晴天の野外で暗色画面が反射で読めない対策。
     htmlのlightクラスで切替（html側に付けると最上位背景・引っ張り表示の帯まで明るくなる） */
  html.light{
    --bg:#eef1ef; --panel:#ffffff; --panel2:#dfe6e1; --line:#b9c6be;
    --fg:#17211b; --muted:#57685f; --accent:#1f7a52; --accent2:#276e50;
    --warn:#9a6b00; --danger:#b23c3c; --chip:#dbe5dd;
  }
  html.light .leaflet-container{background:#dfe3df;}
  html.light .act.recing{background:#f0dada; color:#8a2525;}
  html.light .btn.danger{border-color:#d0a0a0;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:16px; line-height:1.5; overscroll-behavior:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  h1,h2,h3{margin:0 0 .4em;}
  a{color:var(--accent);}
  button{font-family:inherit; font-size:16px;}
  .app{max-width:900px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* ヘッダー */
  header{position:sticky; top:0; z-index:500; background:var(--panel);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;}
  .hbar{display:flex; align-items:center; gap:10px;}
  .htitle{font-weight:700; font-size:18px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .back{background:none; border:none; color:var(--accent); font-size:17px; padding:10px 12px; cursor:pointer;}
  .hsub{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; font-size:13px; color:var(--muted);}
  .hsub .pill{background:var(--chip); border:1px solid var(--line); border-radius:20px; padding:2px 10px;}
  .pill.ok{color:var(--accent);} .pill.warn{color:var(--warn);} .pill.off{color:var(--muted);}

  main{flex:1; padding:14px; padding-bottom:90px;}

  /* カード・リスト */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
  .card.tap{cursor:pointer;} .card.tap:active{background:var(--panel2);}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1;}
  .muted{color:var(--muted);} .small{font-size:13px;} .tiny{font-size:12px;}
  .badge{display:inline-block; border-radius:20px; padding:2px 10px; font-size:12px; background:var(--chip); border:1px solid var(--line);}
  .badge.status-未開始{color:var(--muted);}
  .badge.status-調査中{color:var(--accent); border-color:var(--accent2);}
  .badge.status-終了{color:var(--muted);}
  .badge.warn{color:var(--warn);}
  .sp{height:8px;}

  /* ボタン */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:12px; padding:12px 16px; cursor:pointer; width:100%; text-align:center;}
  .btn:active{background:var(--panel);}
  .btn.primary{background:var(--accent2); border-color:var(--accent); color:#fff; font-weight:700;}
  .btn.ghost{background:none;}
  .btn.danger{color:var(--danger); border-color:#5a2e2e;}
  .btn.big{font-size:18px; padding:18px; font-weight:700;}
  .btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .btn-grid.one{grid-template-columns:1fr;}

  /* フォーム */
  label.field{display:block; margin-bottom:14px;}
  label.field > .lab{display:block; font-size:13px; color:var(--muted); margin-bottom:5px;}
  input,select,textarea{width:100%; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:16px;}
  textarea{min-height:70px; resize:vertical;}
  input:focus,select,textarea:focus{outline:none; border-color:var(--accent);}
  .req{color:var(--accent);}
  .seg{display:flex; flex-wrap:wrap; gap:8px;}
  .seg button{background:var(--panel2); border:1px solid var(--line); color:var(--muted);
    border-radius:22px; padding:11px 16px; cursor:pointer;}   /* 手袋・雨天でも押せる約44px */
  .seg button.on{background:var(--accent2); border-color:var(--accent); color:#fff;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* 大ボタン群（調査中） */
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .act{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 12px; text-align:center; cursor:pointer; font-size:17px; font-weight:700;
    /* button要素で使うため、ブラウザ既定の書体・文字色・幅を打ち消す */
    font-family:inherit; color:inherit; width:100%; display:block;}
  .act:active{background:var(--panel2);}
  .act .ic{font-size:26px; display:block; margin-bottom:6px;}
  .act.primary{background:var(--accent2); border-color:var(--accent); color:#fff;}
  .act.wide{grid-column:1 / -1;}
  .act.recing{border-color:var(--danger); background:#3a1d1d; color:#fff;}
  /* 小型ボタン（よく使う2つ以外）。約46pxで押しやすさは維持しつつ、一覧を上に見せる */
  .act.sm{padding:13px 8px; font-size:14px; font-weight:600;}   /* 約46px＝手袋でも押せる高さを維持 */
  .act.sm .ic{font-size:16px; display:inline; margin:0 4px 0 0;}

  /* 検索候補 */
  .suggest{border:1px solid var(--line); border-radius:10px; margin-top:6px; overflow:hidden; max-height:280px; overflow-y:auto;}
  .suggest .item{padding:11px 12px; border-bottom:1px solid var(--line); cursor:pointer;}
  .suggest .item:last-child{border-bottom:none;}
  .suggest .item:active{background:var(--panel2);}
  .suggest .item .fam{font-size:12px; color:var(--muted);}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .chips .c{background:var(--chip); border:1px solid var(--line); border-radius:16px; padding:5px 10px; font-size:13px;}
  .chips .c[onclick]{border-radius:20px; padding:10px 14px; font-size:15px; cursor:pointer;}   /* タップできるチップだけ大きく */

  /* 地図 */
  #map{height:calc(100vh - 220px); min-height:320px; border-radius:var(--radius); border:1px solid var(--line);}
  .leaflet-container{background:#0d1412;}
  .locate-btn{width:42px; height:42px; font-size:20px; line-height:1;
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:10px; cursor:pointer; box-shadow:0 1px 5px rgba(0,0,0,.4);}
  .locate-btn:active{background:var(--panel2);}
  /* 位置指定マップの中心十字（指で目標が隠れないよう、地図の方を動かして狙う）。
     形は細い黒線のSVG（白フチ付き。航空写真の暗い場所でも見える） */
  .map-cross{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:800;
    pointer-events:none; line-height:0;}
  .map-drop-btn{width:auto; padding:9px 14px; font-size:14px; font-weight:700;
    background:var(--accent); color:#0a0f0d; border:none; border-radius:10px;
    cursor:pointer; box-shadow:0 1px 5px rgba(0,0,0,.4);}
  .map-drop-btn:active{opacity:.85;}
  @media (max-width:420px){ .map-drop-btn{margin-bottom:22px;} }   /* 狭い画面で右下の出典表示と重ならないよう一段上げる */
  /* 地図を画面いっぱいに広げるボタン（右下）。目立ちすぎないよう地の色で、押せることは枠で示す */
  .map-full-btn{width:auto; padding:8px 11px; font-size:13px; font-weight:700; white-space:nowrap;
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:10px; cursor:pointer; box-shadow:0 1px 5px rgba(0,0,0,.4);}
  .map-full-btn:active{background:var(--panel2);}
  /* 音声入力の種名候補。押して選ぶ（選ばれているものは塗りつぶし＋✓）。
     指で押す前提なので、小さくても縦の当たり判定は確保する */
  .voice-chip{display:inline-block; margin:2px 5px 2px 0; padding:6px 11px; font-size:13px; font-weight:700;
    background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:999px; cursor:pointer;}
  .voice-chip.on{background:var(--accent); color:#0a0f0d; border-color:var(--accent);}
  .voice-chip:active{opacity:.85;}
  /* 全画面中は、iPhoneのノッチ・ホームバーの上に操作ボタンが隠れないよう内側に寄せる。
     横向きではノッチが左右に来る（「小さく」ボタンが押せなくなる＝戻れなくなる）ので四方向とも避ける */
  .map-full .leaflet-top{margin-top:env(safe-area-inset-top, 0px);}
  .map-full .leaflet-bottom{margin-bottom:env(safe-area-inset-bottom, 0px);}
  .map-full .leaflet-left{left:env(safe-area-inset-left, 0px);}
  .map-full .leaflet-right{right:env(safe-area-inset-right, 0px);}
  /* 全画面中の背面ページの固定。直接 body.style を書き換えると、その間に別処理が変えた指定を消してしまう */
  body.map-full-lock{overflow:hidden;}
  .north-needle{display:inline-block; line-height:1.05; font-size:13px; font-weight:700; transition:transform .15s;}

  /* 集計テーブル */
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--panel);}
  td.num,th.num{text-align:right;}
  .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}

  /* トースト */
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:#000; color:#fff; padding:11px 18px; border-radius:24px; font-size:14px;
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:2000; max-width:90%;}
  #toast.show{opacity:.94;}

  /* 録音 */
  .reclist{margin-top:10px; display:flex; flex-direction:column; gap:10px;}
  .recitem{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px;}
  .recaudio{width:100%; margin-top:8px; height:38px;}
  .recdot{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--danger); margin-right:6px; animation:recblink 1s infinite;}
  @keyframes recblink{0%,100%{opacity:1;} 50%{opacity:.2;}}
  /* 写真・動画 */
  .mediagrid{margin-top:10px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .mediaitem{position:relative;}
  .mediathumb{position:relative; width:100%; aspect-ratio:1/1; background:var(--panel2);
    border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .mediael{width:100%; height:100%; object-fit:cover; display:block; background:#000;}
  .mediadel{position:absolute; top:4px; right:4px; width:40px; height:40px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; border:1px solid rgba(255,255,255,.5); font-size:18px;
    line-height:1; cursor:pointer; z-index:2;}
  .mediacap{margin-top:3px; text-align:center;}
  /* メディア一覧（ギャラリー）・拡大表示 */
  .galplay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:26px; text-shadow:0 1px 6px rgba(0,0,0,.8); pointer-events:none;}
  .galaudio{width:100%; height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:4px; font-size:26px; color:var(--muted);}
  /* 保存バー（長いフォームでも保存ボタンが常に画面下に見える） */
  .savebar{position:sticky; bottom:0; z-index:60; padding:10px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(to top, var(--bg) 70%, transparent);}
  details.fold summary{cursor:pointer; padding:12px; background:var(--panel2);
    border:1px solid var(--line); border-radius:10px; font-weight:600; list-style:none;}
  details.fold summary::before{content:'▸ ';}
  details.fold[open] summary::before{content:'▾ ';}
  details.fold[open] summary{margin-bottom:8px;}
  .lightbox{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:1500;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px;}
  .lightbox-media{max-width:100%; max-height:68vh; object-fit:contain; border-radius:8px; background:#000;}
  .lightbox-bar{margin-top:12px; width:100%; max-width:480px; text-align:center; color:#fff;}

  /* 選択削除 */
  .selcard.selected{border-color:var(--accent); background:var(--panel2);}
  .selcb{font-size:22px; line-height:1; color:var(--accent); flex:0 0 auto;}
  button:disabled,.btn:disabled{opacity:.45; pointer-events:none;}

  .empty{text-align:center; color:var(--muted); padding:40px 10px;}
  .divider{height:1px; background:var(--line); margin:14px 0;}
  .note{font-size:13px; color:var(--muted); background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px;}
  .hidden{display:none !important;}
  /* Leafletのレイヤ切替アイコン(images/layers.png)を同梱していないので、絵文字で代替表示する */
  .leaflet-control-layers-toggle{background-image:none !important; width:36px !important; height:36px !important; position:relative;}
  .leaflet-control-layers-toggle::after{content:'🗺'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:20px;}
  .leaflet-retina .leaflet-control-layers-toggle{background-image:none !important;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hbar">
      <button class="back hidden" id="backBtn" onclick="goBack()">‹ 戻る</button>
      <div class="htitle" id="hTitle">鳥類調査記録</div>
    </div>
    <div class="hsub" id="hSub"></div>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script src="./leaflet.js"></script>
<script src="./vendor/leaflet-rotate.js"></script><!-- 地図回転（読み込めない場合は北固定のまま動く） -->
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
/* ============================================================
   鳥類調査員育成用フィールド記録アプリ — Web/PWA 試作版 v1
   保存: localStorage(JSON) + IndexedDB(録音音声) / 地図: Leaflet + 地理院タイル
   ※ 軌跡記録(GPSトラック)は次版で追加予定
   ============================================================ */

/* ---------- バージョン（更新されたか目視で確認するための表示） ---------- */
const APP_VERSION = 'v89（2026-08-05 観察入力の位置を種名の上へ：撮る→位置→種名の順に）';

/* ---------- ユーティリティ ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const uuid = ()=> (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
      const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16);}));
const nowISO = ()=> new Date().toISOString();
function localDatetimeValue(d=new Date()){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dateValue(d=new Date()){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
const DATE_ONLY_RE = /^\d{4}-\d{2}-\d{2}$/;   // 日付だけの項目（survey_date・verified_at 等）
// 時差の付かない日時。飛翔経路は datetime-local の値をそのまま保存しているためこの形になる
const NAIVE_DT_RE = /^\d{4}-\d{2}-\d{2}[Tt ]\d{2}:\d{2}(:\d{2}(\.\d+)?)?$/;
// 時差またはZの付いた日時。観察日時は toISOString() でこの形になる
const ZONED_DT_RE = /^\d{4}-\d{2}-\d{2}[Tt ]\d{2}:\d{2}(:\d{2}(\.\d+)?)?(Z|[+-]\d{2}:?\d{2})$/;
// 業務日時（観察日時・飛翔の開始終了・検証日など）として許す形。空・日付のみ・時差なし日時・時差付き日時の4種類。
// 取込や同期でこれ以外が入ると isoLocal() が変換せず素通しし、書き出しに壊れた値がそのまま出るため入口で弾く。
// 形が合っていても存在しない日時（2026-99-99 / 25:99 / +99:99 など）は Date.parse で弾く。
// ただし Date.parse は 2026-02-30 を 3/2 に繰り上げて受け入れてしまうので、暦日は別に検査する。
function validCalendarDate(s){
  const y=+s.slice(0,4), m=+s.slice(5,7), d=+s.slice(8,10);
  const t=new Date(Date.UTC(y,m-1,d));
  if(y>=0 && y<=99) t.setUTCFullYear(y);   // Date.UTCは0〜99年を1900年代とみなすため戻す
  return t.getUTCFullYear()===y && t.getUTCMonth()===m-1 && t.getUTCDate()===d; }
function okStamp(v){ if(v==null || v==='') return true;
  if(typeof v!=='string') return false;
  if(!DATE_ONLY_RE.test(v) && !NAIVE_DT_RE.test(v) && !ZONED_DT_RE.test(v)) return false;
  if(!validCalendarDate(v)) return false;
  return !isNaN(Date.parse(v.replace(' ','T'))); }
// 管理用日時（created_at / updated_at / deleted_at）。省略は許すが空文字は許さない。
// 壊れた値は文字列比較で常に最新扱いになり、以後どの正しい更新にも勝ち続けて同期を恒久的に壊すため必ず弾く。
function okTime(v){ return v==null || (typeof v==='string' && v!=='' && okStamp(v)); }
// UUID・メディアIDは空文字を許さない。取込側の safeId は空を通すため、
// 空IDのまま取り込めてしまうと同期側（非空を要求）が拒否し続ける状態を作れる
function okUuid(v){ return typeof v==='string' && /^[\w-]+$/.test(v); }
const okStrOpt=v=>v==null || typeof v==='string';
// 記録に付く録音・写真の参照。取込・同期の両方がこれ1つを使う。
// 片方だけ緩いと「取り込めるのに同期は拒否し続ける」データを作れてしまうため、条件を分けない。
function okMediaList(a){ return a==null || (Array.isArray(a) && a.every(m=>
  m && typeof m==='object' && !Array.isArray(m) && okUuid(m.id)
  && okStrOpt(m.ext) && okStrOpt(m.mime) && okStrOpt(m.kind) && okStrOpt(m.name))); }
// 削除記録の1件。at は省略・空を許さない（欠けると文字列比較で「最新」と判定され生きた記録が消える）
function okTombstone(t){ return !!t && typeof t==='object' && !Array.isArray(t)
  && okUuid(t.uuid) && typeof t.at==='string' && t.at!=='' && okStamp(t.at); }
// 1レコードの不正箇所を列挙する（点検・修復用）。name は種別（業務日時の項目を引くため）。
// okRecord（取込・同期の合否）はこの結果が空かどうかで決める。判定を2か所に持つと
// 「点検では正常なのに同期は拒否する」ずれが生じるため、必ずこの関数を唯一の正とする。
const REF_ID_FIELDS = ['id','survey_uuid','hypothesis_uuid','ref_id'];
function recordIssues(name, x){
  if(!x || typeof x!=='object' || Array.isArray(x)) return ['record'];
  const bad=[];
  if(!okUuid(x.uuid)) bad.push('uuid');
  for(const f of REF_ID_FIELDS){ if(!safeId(x[f])) bad.push(f); }
  for(const f of ['created_at','updated_at','deleted_at']){ if(!okTime(x[f])) bad.push(f); }
  for(const f of (STAMP_FIELDS[name]||[])){ if(!okStamp(x[f])) bad.push(f); }
  if(!okMediaList(x.audio)) bad.push('audio');
  if(!okMediaList(x.media)) bad.push('media');
  // 修復メモ（点検・修復機能が元の値を控える欄）。細工バックアップで巨大な文字列を
  // 持ち込まれて保存領域やメモリを圧迫されないよう、正式な検査項目として上限を課す
  if(!(x.repair_note==null || (typeof x.repair_note==='string' && x.repair_note.length<=REPAIR_NOTE_MAX))) bad.push('repair_note');
  // 1記録の大きさの上限。検査対象外の項目（メモ・種名など将来の項目も含めて許容している）に
  // 巨大な文字列を仕込んだ細工データが、検査を素通りして保存領域を食い潰すのを防ぐ。
  // 上限は正当な最大級の記録（長時間の飛翔経路のGPS点列など）より十分大きく取る
  try{ if(JSON.stringify(x).length>REC_JSON_MAX) bad.push('size'); }catch(e){ bad.push('size'); }
  return bad;
}
const REPAIR_NOTE_MAX = 500;       // 修復メモの上限文字数（取込・同期・点検で共通）
const REC_JSON_MAX = 4000000;      // 1記録のJSON上限文字数（約4百万字＝保存領域全体の大半。正当な記録はまず届かない）
// 手動取込の上限は「細工・破損データを弾く」ためのもので、端末のメモリ保護のためではない。
// 監査（2026-08-01 4巡目）でより小さい上限が提案されたが、動画入りのフルバックアップは正当に
// 数百MBになり得て、上限を下げると機種変時の復元が失敗する。取込は利用者自身のバックアップを
// 選ぶ操作（信頼済み）であり、復元を壊さないことを優先してこの値を維持する（設計判断）
const IMPORT_FILE_MAX = 1073741824;   // 手動取込ファイルの上限（1GB）
const MEDIA_B64_MAX = 400000000;      // メディア1件のbase64上限文字数（実体約300MB。これを超える1件は細工か破損とみなす）
// 1レコードの共通検査（取込・同期で同じものを使う）
function okRecord(name, x){ return recordIssues(name, x).length===0; }
// マイ図鑑の1件（ID＋管理用日時。両側で同じ条件にする）
function okGuideItem(g){ return g==null || (g && typeof g==='object' && !Array.isArray(g)
  && safeId(g.id) && safeId(g.ref_id)
  && okTime(g.created_at) && okTime(g.updated_at) && okTime(g.deleted_at)); }
// レコード種別ごとの業務日時項目（created_at 等の管理用日時は別途 okTime で検査）
const STAMP_FIELDS = {
  surveys:      ['survey_date','start_datetime','end_datetime'],
  observations: ['observed_at'],
  notes:        ['recorded_at'],
  hypotheses:   [],
  hyp_results:  ['verified_at'],
  flights:      ['start_time','end_time'],
};
// 日付表示。日付だけの項目はそのまま、日時はローカル時刻に直してから日付を取る。
// UTCのまま切り出すと、夜明け前後の記録が前日として表示されてしまうため。
// 日時と判別できない文字列は日付に変換しない（別物を日付として見せないため）。
function fmtDate(s){ if(!s) return '—'; s=String(s);
  if(DATE_ONLY_RE.test(s)) return s;
  if(!NAIVE_DT_RE.test(s) && !ZONED_DT_RE.test(s)) return s.slice(0,10);
  const d=new Date(s.replace(' ','T')); return isNaN(d) ? s.slice(0,10) : dateValue(d); }
// 書き出し用の日時。調査地は日本国内を前提とし、書き出す端末の地域設定に関わらず
// 日本標準時（+09:00）で固定して出す。端末依存にすると、同じ記録を別地域の端末から
// 書き出したときに日時が変わってしまうため（例 2026-08-01T05:00:00.000+09:00）。
// 日付だけの項目はそのまま返す（日時に化けさせない）。
const EXPORT_TZ_MIN = 9*60;   // 日本標準時。海外調査に使うなら記録時の時差を保存する設計が必要
function isoLocal(s){ if(!s) return ''; s=String(s);
  if(DATE_ONLY_RE.test(s)) return s;
  let v=s.replace(' ','T');
  // 時差なしの日時（飛翔経路）は国内での記録とみなす。端末ローカルとして読むと書き出す端末で値が変わる
  if(NAIVE_DT_RE.test(s)) v+='+09:00';
  else if(!ZONED_DT_RE.test(s)) return s;   // 日時と判別できないものはそのまま返す
  const d=new Date(v); if(isNaN(d)) return s;
  const t=new Date(d.getTime()+EXPORT_TZ_MIN*60000);   // getUTC* で読むとJSTの値になる
  const p=n=>String(n).padStart(2,'0');
  return `${t.getUTCFullYear()}-${p(t.getUTCMonth()+1)}-${p(t.getUTCDate())}`
    +`T${p(t.getUTCHours())}:${p(t.getUTCMinutes())}:${p(t.getUTCSeconds())}`
    +`.${String(t.getUTCMilliseconds()).padStart(3,'0')}+09:00`; }
function fmtTime(s){ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return '—';
  const p=n=>String(n).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,ms){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms||1800); }

/* ---------- データ層（localStorage） ---------- */
const DB = {
  key:{sv:'bs_surveys', ob:'bs_observations', nt:'bs_notes', hy:'bs_hypotheses', hr:'bs_hyp_results', fl:'bs_flights', recent:'bs_recent_species', fav:'bs_fav_species'},
  load(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } },
  // 読取・JSON解析に失敗したら例外を投げる（「本当に空」と「読めない」を区別する版）。
  // GCやバックアップなど、空を鵜呑みにするとデータ喪失につながる処理はこちらを使う。
  loadRaw(k){ const s=localStorage.getItem(k); if(s==null||s==='') return []; return JSON.parse(s); },
  // 保存に失敗（多くは端末の空き容量不足）したら黙って失わせず、必ず警告する。成功時のみtrue。
  save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }
    catch(e){ try{ toast('⚠ 空き容量不足で保存できませんでした。写真・動画を整理するかバックアップ後に空けてください'); }catch(_){}
      try{ console.error('localStorage save failed', e); }catch(_){}
      return false; }
    if(typeof scheduleCloud==='function') scheduleCloud(); return true; },
  surveys(){ return this.load(this.key.sv).filter(s=>!s.deleted_at); },
  allSurveys(){ return this.load(this.key.sv); },
  observations(){ return this.load(this.key.ob).filter(o=>!o.deleted_at); },
  notes(){ return this.load(this.key.nt).filter(n=>!n.deleted_at); },
  hypotheses(){ return this.load(this.key.hy).filter(h=>!h.deleted_at); },
  hypResults(){ return this.load(this.key.hr).filter(r=>!r.deleted_at); },
  obsOf(svUuid){ return this.observations().filter(o=>o.survey_uuid===svUuid); },
  notesOf(svUuid){ return this.notes().filter(n=>n.survey_uuid===svUuid); },
  hypOf(svUuid){ return this.hypotheses().filter(h=>h.survey_uuid===svUuid); },
  flights(){ return this.load(this.key.fl).filter(f=>!f.deleted_at); },
  flightsOf(svUuid){ return this.flights().filter(f=>f.survey_uuid===svUuid); },
  flight(u){ return this.load(this.key.fl).find(f=>f.uuid===u); },
  upsertFlight(rec){ const a=this.load(this.key.fl); const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.fl,a); },
  hypothesis(u){ return this.load(this.key.hy).find(h=>h.uuid===u); },
  resultsOf(hyUuid){ return this.hypResults().filter(r=>r.hypothesis_uuid===hyUuid); },
  survey(u){ return this.allSurveys().find(s=>s.uuid===u); },
  upsertSurvey(rec){ const a=this.load(this.key.sv); const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.sv,a); },
  upsertObs(rec){ const a=this.load(this.key.ob); const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.ob,a); },
  upsertNote(rec){ const a=this.load(this.key.nt); const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.nt,a); },
  upsertHyp(rec){ const a=this.load(this.key.hy); const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.hy,a); },
  upsertHypResult(rec){ const a=this.load(this.key.hr); const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.hr,a); },
  // updated_at も更新する（端末間同期は updated_at の新しい方を残すため、これが無いと削除・復元が他端末に伝わらない）。
  // 保存の成否を返す（容量不足で削除できていないのに「削除しました」と表示しないため）
  softDelete(k,u){ const a=this.load(k); const i=a.findIndex(x=>x.uuid===u);
    if(i>=0){ a[i].deleted_at=nowISO(); a[i].updated_at=nowISO(); return this.save(k,a); } return false; },
  restore(k,u){ const a=this.load(k); const i=a.findIndex(x=>x.uuid===u);
    if(i>=0){ delete a[i].deleted_at; a[i].updated_at=nowISO(); return this.save(k,a); } return false; },
  // 完全削除は「削除記録（墓標）」を残す。端末間同期で他端末にも完全削除を伝え、古いデータからの復活を防ぐため。
  // 墓標が保存できなければ本体も消さず、本体が消せなければ墓標も戻す（片方だけの中途半端な状態を残さない）。
  // 原本の読み取りは厳格版（読めない状態で寛容版の[]を保存すると、全記録を空で上書きしてしまうため）
  hardDelete(k,u){ if(!tombstoneAdd(u)){ try{ toast('空き容量不足のため完全削除できませんでした'); }catch(e){} return false; }
    let a; try{ a=this.loadRaw(k); }catch(e){ this._untomb(u);
      try{ toast('データを読み取れないため完全削除を中止しました'); }catch(_){} return false; }
    if(!this.save(k, a.filter(x=>x.uuid!==u))){ this._untomb(u); return false; }
    return true; },
  _untomb(u){ if(!tombstoneRemove(u)){   // 墓標を戻せないと、消していない記録が同期で消される恐れがあるため強く警告
    try{ toast('⚠ 削除記録の取り消しに失敗しました。空き容量を確保し、この記録を開いて保存し直してください', 5000); }catch(e){} } },
  deleted(k){ return this.load(k).filter(x=>x.deleted_at); },
  recentSpecies(){ return this.load(this.key.recent); },
  pushRecent(name){ if(!name) return; let a=this.load(this.key.recent).filter(x=>x!==name);
    a.unshift(name); a=a.slice(0,12); this.save(this.key.recent,a); },
};

/* ---------- 完全削除の記録（墓標） ----------
   ごみ箱から完全削除したuuidを残し、同期時に他端末へも削除を伝える。
   期限は設けない（使われなくなった端末の古い同期ファイルがドライブに残っている限り、
   墓標が失効すると削除済み記録が復活しうるため）。1件あたり数十バイトなので残し続けて実害はない */
function tombstonesList(){ try{
  return (JSON.parse(localStorage.getItem('bs_tombstones')||'[]')||[])
    .filter(t=>t&&typeof t.uuid==='string'&&t.uuid&&typeof t.at==='string'&&t.at);
}catch(e){ return []; } }
function tombstonesSave(a){ try{ localStorage.setItem('bs_tombstones', JSON.stringify(a)); return true; }catch(e){ return false; } }
// 保存の成否を返す。falseのときは呼び出し側が完全削除を中止する（墓標なしで消すと他端末から復活してしまうため）
function tombstoneAdd(uuid){ if(!uuid) return false; const a=tombstonesList();
  if(!a.some(t=>t.uuid===uuid)) a.push({uuid, at:nowISO()});
  return tombstonesSave(a); }
// 完全削除の巻き戻し用（本体の削除保存に失敗したとき、墓標だけ残さない）。成否を返す
function tombstoneRemove(uuid){ return tombstonesSave(tombstonesList().filter(t=>t.uuid!==uuid)); }

/* ---------- 録音・写真・動画の保存（IndexedDB：サイズが大きいためlocalStorageと分離） ---------- */
/* ストア 'audio' = 録音 / 'media' = 写真・動画 */
let _mediaDbPromise=null;
function openMediaDB(){
  if(_mediaDbPromise) return _mediaDbPromise;
  // open失敗時は拒否Promiseをキャッシュに残さず、次回呼び出しでやり直せるようにする（一過性の失敗から回復するため）
  const fail=(err,rej)=>{ _mediaDbPromise=null; rej(err); };
  _mediaDbPromise=new Promise((res,rej)=>{
    if(!window.indexedDB){ fail(new Error('no-indexeddb'),rej); return; }
    let r; try{ r=indexedDB.open('bird_survey_audio',5); }catch(e){ fail(e,rej); return; }
    r.onupgradeneeded=()=>{ const db=r.result;
      if(!db.objectStoreNames.contains('audio')) db.createObjectStore('audio',{keyPath:'id'});
      if(!db.objectStoreNames.contains('media')) db.createObjectStore('media',{keyPath:'id'});
      if(!db.objectStoreNames.contains('refdoc')) db.createObjectStore('refdoc',{keyPath:'id'});
      if(!db.objectStoreNames.contains('call')) db.createObjectStore('call',{keyPath:'jp'});
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv',{keyPath:'key'}); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>fail(r.error,rej);
    r.onblocked=()=>fail(new Error('indexeddb blocked'),rej);
  });
  return _mediaDbPromise;
}
// requestの成功だけでなく transaction 全体の完了(commit)を待って解決する。
// これにより await store.put(...) が「確実に保存された」ことを意味し、途中でabortしたのに成功扱いする事故を防ぐ。
function idbDo(store, mode, fn){ return openMediaDB().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(store,mode); const st=tx.objectStore(store); const q=fn(st);
  let result;
  q.onsuccess=()=>{ result=q.result; };
  tx.oncomplete=()=>res(result);
  tx.onabort=()=>rej(tx.error||(q&&q.error)||new Error('IndexedDB transaction aborted'));
  tx.onerror=()=>rej(tx.error||(q&&q.error)||new Error('IndexedDB transaction error'));
})); }
function makeBlobStore(store, refField){
  return {
    put(rec){ return idbDo(store,'readwrite', st=>st.put(rec)); },
    get(id){ return idbDo(store,'readonly', st=>st.get(id)); },
    del(id){ return idbDo(store,'readwrite', st=>st.delete(id)); },
    all(){ return idbDo(store,'readonly', st=>st.getAll()).then(r=>r||[]); },
    // どの観察にも参照されていない残骸（保存されなかった・完全削除済み）を掃除
    // ただしマイ図鑑に登録済みのものは保護する
    gc(){ const valid=new Set();
      // 参照元(観察・飛翔・マイ図鑑)が1つでも読めない時は、孤児判定が誤るので一切削除しない（原本保護）
      try{
        DB.loadRaw(DB.key.ob).forEach(o=>(o[refField]||[]).forEach(a=>a&&a.id&&valid.add(a.id)));
        DB.loadRaw(DB.key.fl).forEach(f=>(f[refField]||[]).forEach(a=>a&&a.id&&valid.add(a.id)));
        const mg=localStorage.getItem('bs_myguide');
        if(mg) JSON.parse(mg).forEach(g=>{
          if((store==='audio'&&g.kind==='audio')||(store==='media'&&(g.kind==='photo'||g.kind==='video'))) valid.add(g.ref_id);
        });
      }catch(e){ return Promise.resolve(); }
      return this.all().then(list=>Promise.all(list.filter(a=>!valid.has(a.id)).map(a=>this.del(a.id)))); }
  };
}
const AudioDB = makeBlobStore('audio','audio');   // 観察の o.audio[] が参照
const PhotoDB = makeBlobStore('media','media');   // 観察の o.media[] が参照
function mediaGcAll(){ return Promise.all([AudioDB.gc().catch(()=>{}), PhotoDB.gc().catch(()=>{})]); }

// 資料PDF（図鑑など）。公開URL・自動同期・バックアップには含めない（手動の図鑑・資料同期でのみ自分のドライブと受け渡す）
const RefDB = {
  put(rec){ return idbDo('refdoc','readwrite', st=>st.put(rec)); },
  get(id){ return idbDo('refdoc','readonly', st=>st.get(id)); },
  del(id){ return idbDo('refdoc','readwrite', st=>st.delete(id)); },
};
function refdocList(){ try{ return JSON.parse(localStorage.getItem('bs_refdocs')||'[]'); }catch(e){ return []; } }
function refdocSave(list){ localStorage.setItem('bs_refdocs', JSON.stringify(list)); }

// オフライン鳴き声（同梱CC音源を端末に保存）。store 'call' に 和名→blob
const CallDB = {
  put(rec){ return idbDo('call','readwrite', st=>st.put(rec)); },
  get(jp){ return idbDo('call','readonly', st=>st.get(jp)); },
  keys(){ return idbDo('call','readonly', st=>st.getAllKeys()).then(r=>r||[]); },
  all(){ return idbDo('call','readonly', st=>st.getAll()).then(r=>r||[]); },
  clear(){ return idbDo('call','readwrite', st=>st.clear()); },
};
// 端末に保存済みの鳴き声が「今の録音(ファイル)と一致」している種数を数える。
// 差し替え(ファイル変更)された種は未一致＝再保存対象として扱う。
// 保存済みの種数と、まだ落としていない分の実バイト数を返す。
// 音源は1種あたり0.2〜18MBと差が大きいので、件数×平均では通信量の目安にならない。
function countUpToDateCalls(){
  return CallDB.all().then(list=>{ const byJp={}; list.forEach(r=>{ if(r&&r.blob) byJp[r.jp]=r; });
    let n=0, restBytes=0;
    for(const jp in CALLS){ const r=byJp[jp];
      if(r && r.f===CALLS[jp].f) n++; else restBytes+=(CALLS[jp].sz||0); }
    return {n, restBytes}; }).catch(()=>({n:0, restBytes:callsTotalBytes()}));
}
function callsTotalBytes(){ let t=0; for(const jp in CALLS) t+=(CALLS[jp].sz||0); return t; }

const TEN_LABEL={'特':'特別天然記念物','天':'天然記念物'};
/* 種名から保全指定を取得（なければnull）。注目種判定にも使う */
function conservOf(name){ return (name && CONSERV[name]) || null; }
/* 保全指定を短いラベル配列で返す（バッジ・出力用） */
function conservTags(name){ const c=conservOf(name); if(!c) return [];
  const t=[];
  if(c.e) t.push('環境省RL '+RL_LABEL[c.e]+'（'+c.e+'）');
  if(c.k) t.push('北海道RL '+HRL_LABEL[c.k]+'（'+c.k+'）');
  if(c.h) t.push('種の保存法（国内希少種）');
  if(c.t) t.push(TEN_LABEL[c.t]);
  return t;
}
/* 保全区分を色分けの小バッジで表示（環VU / 北Vu / 天 など）。カード表示用 */
function sevColor(code){ const c=String(code||'').toUpperCase();
  if(c==='CR'||c==='EN'||c==='EX') return '#b03030';   // 絶滅危惧が高い＝赤
  if(c==='VU'||c==='NT') return '#8a5a00';             // やや高い＝橙
  return '#5a6a72'; }                                  // 情報不足・留意など＝灰
function conservBadges(name){ const c=conservOf(name); if(!c) return '';
  const b=[];
  if(c.e) b.push(`<span class="badge" style="background:${sevColor(c.e)};color:#fff;" title="環境省レッドリスト ${RL_LABEL[c.e]}（${c.e}）">環${c.e}</span>`);
  if(c.k) b.push(`<span class="badge" style="background:${sevColor(c.k)};color:#fff;" title="北海道レッドリスト ${HRL_LABEL[c.k]}（${c.k}）">北${c.k}</span>`);
  if(c.t) b.push(`<span class="badge" style="background:#2f7d5b;color:#fff;" title="${TEN_LABEL[c.t]}">${c.t==='特'?'特天':'天'}</span>`);
  return b.join('');
}
/* CSV/報告書の1列用に、指定を短い文字列で返す（該当なしは空） */
function csvConserv(name,field){ const c=conservOf(name); if(!c) return '';
  if(field==='e') return c.e? RL_LABEL[c.e]+'（'+c.e+'）':'';
  if(field==='k') return c.k? HRL_LABEL[c.k]+'（'+c.k+'）':'';
  if(field==='h') return c.h? '国内希少種':'';
  if(field==='t') return c.t? TEN_LABEL[c.t]:'';
  return '';
}

/* ---------- 繁殖ランク（観察コード）の自動判定 ----------
   全国鳥類繁殖分布調査に準拠。行動タグから A:繁殖確認 > B:繁殖の可能性 > C:生息を確認 を推定。
   あくまで自動推定のため、報告書では要確認（画面には出さず出力時のみ算出） */
const BREED_A=['巣立ち雛','給餌','餌運び'];                                   // 繁殖を確認
const BREED_B=['さえずり','繁殖行動','巣材運搬','威嚇','警戒','餌渡し','dF(ディスプレイ飛翔)']; // 繁殖の可能性
const BREED_LABEL={A:'A 繁殖を確認',B:'B 繁殖の可能性',C:'C 生息を確認'};
/* 行動文字列（「・」区切り）から繁殖ランクを返す。種名があれば最低でもC */
function breedingRank(behaviorStr, hasSpecies){
  const set=String(behaviorStr||'').split('・').filter(Boolean);
  if(set.some(b=>BREED_A.includes(b))) return 'A';
  if(set.some(b=>BREED_B.includes(b))) return 'B';
  return hasSpecies? 'C':'';
}

/* 図鑑・鳴き声の参照リンク（📖=Wikipedia日本語 / 🔊=Xeno-canto。学名があれば鳴き声検索が正確） */
function speciesByName(name){ return SPECIES.find(s=>s.japanese_name===name); }
// 個体数の読み方をアプリ全体で1つにする。空欄・未入力は「1」＝記録が存在する以上、最低1個体はいる
// （入力欄の初期値も1）。以前は集計が0、報告書と地図が1、飛翔GeoJSONが空欄と読み手ごとに割れていて、
// 同じ調査の合計が画面によって違った（2026-08-04 全体監査）
// 位置の確からしさ（m）。書き出し用。空欄・数値でないもの・負の値は空にする
function accuracyM(v){
  const s=String(v==null?'':v).trim(); if(s==='') return '';
  const n=Number(s);
  return (Number.isFinite(n) && n>=0) ? n : '';
}
function indCount(v){
  const s=String(v==null?'':v).trim();
  if(s==='') return 1;
  const n=Number(s);
  return (Number.isFinite(n) && n>=0) ? Math.trunc(n) : 1;
}

function brCallUrlFor(s){ return 'https://db3.bird-research.jp/saezuri/birdsong/list;name='+encodeURIComponent((s&&s.japanese_name)||''); }
function guideLinksByName(name){ const s=speciesByName(name)||{japanese_name:name, scientific_name:''};

/* ---------- 画面遷移 ---------- */
let STACK = [];               // {name, arg}
let currentSurveyUuid = null; // 調査中コンテキスト
let mapObj = null;
let _mapTimer = null;   // 地図初期化の保留タイマー（画面を離れたら取り消す）
let _recGen = 0, _mediaGen = 0;   // 録音/写真パネルの世代。再描画・画面遷移で+1し、古い非同期処理のURL割当を無効化する
let mapCurMarker = null, mapCurCircle = null; // 地図上の現在地マーカー・精度円

// 破棄を選んだ新規記録のuuid。後から完了する写真・録音の保存処理が仮記録を作り直さないための名簿（セッション内のみ）
const DISCARDED=new Set();
// 画面を離れる前の確認。録音中と、編集画面の未保存入力を無警告で捨てないための関門。
// 保存フローは保存成功時に SCREENS._dirty=false にしてから遷移するので、ここには引っかからない
// 未保存の入力を守る画面の一覧。ここに入れ忘れると、書きかけが警告なく消える
// （まとめて記録・仮説・検証結果・振り返りが対象外になっていた＝2026-08-04の全体監査 Critical）
const GUARD_SCREENS=['obsEdit','noteEdit','flightEdit','routeEdit','voiceObs',
  'obsBatch','hypEdit','hypVerify','surveyEnd'];
// 入力があった時点で「いまが保護対象の画面か」を見る。画面ごとに見張りを張り替えないための判定
function markDirtyIfGuarded(){
  const cur=STACK[STACK.length-1]||{};
  if(GUARD_SCREENS.indexOf(cur.name)>=0 || (cur.name==='surveyEdit' && SCREENS._editing)) SCREENS._dirty=true;
}
function leaveGuardOk(){
  const cur=STACK[STACK.length-1]||{};
  const editScreen=(GUARD_SCREENS.indexOf(cur.name)>=0
    ||(cur.name==='surveyEdit' && SCREENS._editing));   // 既存調査の途中編集も保護（新規は下書き自動保存があるので対象外）
  const dirty=editScreen && SCREENS._dirty;
  const ghost=dirty ? SCREENS._ghost : null;   // 写真・録音を先に付けてDBに仮保存された未保存の新規記録
  if(!REC && !dirty) return true;
  let msg;
  if(REC && dirty) msg='録音中で、入力内容もまだ保存されていません。両方とも破棄して離れますか？';
  else if(REC) msg='録音中です。この画面を離れると録音は保存されずに破棄されます。離れますか？';
  else if(ghost) msg='写真・録音を付けた書きかけの記録があります。保存せずに破棄しますか？';
  else msg='入力内容がまだ保存されていません。保存せずに戻りますか？';
  if(!confirm(msg)) return false;
  if(dirty){
    if(ghost){
      // 仮保存済みの幽霊記録を片付ける（墓標が付くので同期でも復活しない）。消せなければ離脱させない
      if(!DB.hardDelete(ghost.key, ghost.uuid)){
        toast('空き容量不足のため破棄できませんでした。空きを確保してからもう一度お試しください', 4000); return false; }
      mediaGcAll().catch(()=>{});
    }
    // 未保存の新規記録は破棄済み名簿へ（保存待ちの写真・録音が完了しても、もう記録を作らせない）
    const newUuid = (cur.name==='obsEdit' && !SCREENS._obsEditing) ? (SCREENS._obs&&SCREENS._obs.uuid)
                  : (cur.name==='flightEdit' && !SCREENS._flightEditing) ? SCREENS._flightSelf : null;
    // 複数トレースの途中保存で保存済みになったトラックが表示中のこともある＝保存済みは名簿に入れない
    if(newUuid && !(SCREENS._ftSaved && SCREENS._ftSaved.has(newUuid))) DISCARDED.add(newUuid);
    // 複数羽トレース中の破棄は全トラック分を名簿へ（保存に成功した分は除く＝保存済みレコードを無効化しない）。
    // トラック状態もここで片付ける（残すと次に開いた画面で古い未保存扱いが復活する）
    if(cur.name==='flightEdit' && !SCREENS._flightEditing && SCREENS._ftracks){
      SCREENS._ftracks.forEach(tr=>{ if(tr&&tr.uuid && !(SCREENS._ftSaved&&SCREENS._ftSaved.has(tr.uuid))) DISCARDED.add(tr.uuid); });
      SCREENS._ftracks=null; SCREENS._ftDirty=false; SCREENS._ftSaved=null;
    }
  }
  return true;
}
function nav(name, arg){ if(!leaveGuardOk()) return; SCREENS._sel=null; STACK.push({name,arg}); render(); }
function goBack(){ if(STACK.length>1){ if(!leaveGuardOk()) return; SCREENS._sel=null; STACK.pop(); render(); } }
function reset(name,arg){ SCREENS._sel=null; STACK=[{name,arg}]; render(); }

const SCREENS = {}; // name -> function(arg) -> returns {title, sub[], html, onMount}

let _navGen=0;   // 画面世代。マイク許可待ち中に画面が変わったら録音を開始させないための照合番号
function render(){
  _navGen++;
  if(REC) recAbort(); // 画面を離れたら録音を中断（保存はしない。離脱前の確認は leaveGuardOk が担当）
  if(typeof voiceRecAbort==='function') voiceRecAbort();   // 音声認識も同様（残すと別画面でマイクが動き続ける）
  if(typeof voiceDockClose==='function' && document.getElementById('voiceDock')) voiceDockClose();   // 音声ドックは#mainの外なのでここで片付ける
  SCREENS._dirty=false; SCREENS._ghost=null;   // 新しい画面は未編集状態から始まる（編集画面の操作でtrueになる）
  if(PDFCTX){ try{ PDFCTX.doc.destroy(); }catch(e){} PDFCTX=null; } // PDF閲覧の後始末
  if(_mapTimer){ clearTimeout(_mapTimer); _mapTimer=null; }   // 前画面の地図初期化予約を取り消す
  if(typeof destroyMap==='function') destroyMap();   // 地図＋コンパス監視＋許可待ちをまとめて破棄
  routeLayer=null; routeLine=null; routeEndMarker=null;   // 破棄済み地図のルート描画層への参照を残さない
  // GPSインジケータ監視は画面ごとに張り直す（出しっぱなし＝電池消耗の防止）。
  // ただし調査画面内の再描画（さらに表示等）では止めない（瞬断と測位再起動の負荷を避ける）
  if(typeof stopGps==='function' && (STACK[STACK.length-1]||{}).name!=='survey') stopGps();
  // 歩行ルート記録（WALK）はここでは止めない＝観察入力などに移っても記録は継続する。停止は⏹/保存/調査終了のみ。
  // ただし記録中の調査そのものが消えていたら（同期の完全削除など）止める
  if(WALK && !DB.survey(WALK.sv)){ stopWalk(true); try{ toast('記録中の調査が削除されたためルート記録を停止しました', 4000); }catch(e){} }
  if(document.getElementById('lightbox')) galClose();   // メディア拡大表示の閉じ忘れを解放（#mainの外なのでここで面倒を見る）
  const cur = STACK[STACK.length-1] || {name:'home'};
  const scr = SCREENS[cur.name] || SCREENS.home;
  const out = scr(cur.arg) || {};
  $('#hTitle').textContent = out.title || '鳥類調査記録';
  $('#backBtn').classList.toggle('hidden', STACK.length<=1);
  const sub = $('#hSub'); sub.innerHTML = (out.sub||[]).join('');
  if(typeof renderWalkPill==='function') renderWalkPill();   // 歩行記録中の常設表示（全画面）
  const main = $('#main');
  _recGen++; _mediaGen++;   // 保留中のメディア非同期処理を無効化（切り離されたDOMへURLを付けない）
  revokePanelUrls(main, 'audio, .mediael');   // 画面差し替え前に音声・写真のObject URLを解放（リーク防止）
  main.innerHTML = out.html || '';
  if(out.onMount) out.onMount();
  // 入力を検知して未保存扱いにする。個々の欄に oninput を書き足す方式は書き漏れが起きるため、
  // 画面ごとまとめて見張る。#main は画面を変えても入れ替わらないので、見張りは**起動時に1度だけ**張り、
  // 対象画面かどうかは発火した時点で見る（renderのたびに張ると、画面を開くたびに際限なく積み上がる）
  if(!SCREENS._inputHooked){
    SCREENS._inputHooked=true;
    main.addEventListener('input', markDirtyIfGuarded);
    main.addEventListener('change', markDirtyIfGuarded);
  }
  window.scrollTo(0,0);
}

SCREENS.home = ()=>{
  const surveys = DB.surveys().sort((a,b)=>(b.survey_date||'').localeCompare(a.survey_date||''));
  const active = surveys.filter(s=>s.status==='調査中');
  const others = surveys.filter(s=>s.status!=='調査中');

  const selMode = !!(SCREENS._sel && SCREENS._sel.scope==='home');
  // 調査ごとの観察を1回の走査でまとめる（調査数×全観察の読み直しを避ける）。
  // Object.create(null)＝取込データのIDが __proto__ 等でも安全に扱う
  const obsBySv = Object.create(null);
  DB.observations().forEach(o=>{ (obsBySv[o.survey_uuid] || (obsBySv[o.survey_uuid]=[])).push(o); });
  const svCard = s=>{
    const obs = obsBySv[s.uuid] || [];
    const spCount = new Set(obs.filter(o=>o.species_name_snapshot).map(o=>o.species_name_snapshot)).size;
    const review = obs.filter(o=>o.needs_review).length;
    const body = `
      <div class="row">
        ${selMode?`<span class="selcb">${SCREENS._sel.set.has(s.uuid)?'☑':'☐'}</span>`:''}
        <div class="grow">
          <div style="font-weight:700; font-size:17px;">${esc(s.name||'(無題の調査)')}</div>
          <div class="small muted">${fmtDate(s.survey_date)} ・ ${esc(s.location_name||'場所未設定')} ・ ${esc(s.survey_method||'')}</div>
        </div>
        <span class="badge status-${esc(s.status||'未開始')}">${esc(s.status||'未開始')}</span>
      </div>
      <div class="chips" style="margin-top:10px;">
        <span class="c">確認種数 ${spCount}</span>
        <span class="c">観察 ${obs.length}件</span>
        ${review?`<span class="c" style="color:var(--warn)">要確認 ${review}</span>`:''}
      </div>`;
    return selMode
      ? `<div class="card tap selcard ${SCREENS._sel.set.has(s.uuid)?'selected':''}" onclick="toggleSel('${s.uuid}',this)">${body}</div>`
      : `<div class="card tap" onclick="nav('survey','${s.uuid}')">${body}</div>`;
  };

  const selBar = selMode
    ? `<div class="sp"></div><button class="btn danger big" id="selDelBtn" ${SCREENS._sel.set.size?'':'disabled'} onclick="deleteSelected()">選択した${SCREENS._sel.set.size}件を削除</button>`
    : '';
  const listHeader = `<div class="row" style="align-items:center; margin-top:14px;">
      <h3 class="muted small grow" style="margin:0;">調査一覧</h3>
      ${surveys.length? (selMode
        ? `<button class="btn ghost" style="width:auto; padding:6px 12px;" onclick="endSelect()">キャンセル</button>`
        : `<button class="btn ghost" style="width:auto; padding:6px 12px;" onclick="startSelect('home')">☑ 選択して削除</button>`):''}
    </div>`;

  const gLast=gdriveLast();
  const gAgo=gLast?Math.max(0,Math.round((Date.now()-new Date(gLast))/60000)):null;
  return {
    title:'鳥類調査記録',
    html:`
      ${!isStandalone()?`<div class="note" style="border-color:var(--warn);">
        <b>⚠ データ保護のため「ホーム画面に追加」を</b><br>
        ブラウザのタブのまま使うと、iPhoneでは<b>約1週間使わないと記録・写真・録音が自動で消される</b>ことがあります。共有ボタンから<b>「ホーム画面に追加」</b>して、そのアイコンから使うと消えなくなります。<br>
        さらに念のため、ときどき下の<b>「⤓ エクスポート → JSONバックアップ」</b>で保存しておくと安心です。
      </div><div class="sp"></div>`:''}
      ${repairProblemCount()?`<div class="note" style="border-color:var(--warn);">
        <b>⚠ 保存済みデータに壊れた記録があります（${repairProblemCount()}件）</b><br>
        そのままだと他の端末への同期が止まり、書き出しにも不正な値が出ます。壊れた記録はドライブ同期から除外されています。
        <div class="sp"></div><button class="btn" onclick="nav('repair',null)">🩺 点検・修復を開く</button>
      </div><div class="sp"></div>`:''}
      <button class="btn primary big" onclick="nav('surveyEdit',null)">＋ 新しい調査を作成</button>
      <div class="sp"></div>
      <div class="btn-grid">
        <button class="btn" onclick="nav('search',null)">🔍 記録を検索</button>
        <button class="btn" onclick="nav('guide',null)">📖 図鑑・鳴き声</button>
      </div>
      <div class="sp"></div>
      <button class="btn" onclick="nav('refdocs',null)">📚 資料・図鑑（PDF取り込み）</button>
      <div class="sp"></div>
      <button class="btn" onclick="SCREENS._galPage=0; nav('gallery',null)">🖼 メディア一覧（写真・動画・録音）</button>
      <div class="sp"></div>
      ${active.length?`<h3 class="muted small">継続中の調査</h3>${active.map(svCard).join('')}`:''}

      <button class="btn ghost" onclick="nav('repair',null)">🩺 データ点検・修復</button>
      ${(gdriveSignedIn()||GUSER)?`<div class="tiny muted" style="margin-top:6px;">☁ 前回のドライブ保存: ${gAgo!=null?(gAgo+'分前'):'まだ'}<span id="homePending"></span></div>`:''}
      ${(gdriveCfg().clientId && GUSER && !gdriveSignedIn())?`<div class="tiny muted" style="margin-top:6px;">☁ ドライブ同期を続けるにはサインインが必要です（上の「クラウド保存」から）</div>`:''}
      <div class="sp"></div>
      <div class="note">観察記録の合計個体数は延べ数です。同一個体を重複して数えている可能性があるため、生息個体数とは限りません。</div>
      <div class="sp"></div>

    `,

      syncPendingCounts().then(c=>{
        if(!el||!el.isConnected) return;
        if(!c){ el.textContent=' ／ 未送信件数を確認できません'; return; }
        const parts=[]; if(c.photo) parts.push('写真'+c.photo); if(c.audio) parts.push('録音'+c.audio); if(c.video) parts.push('動画'+c.video+'(手動)');
        if(parts.length) el.textContent=' ／ 未送信: '+parts.join('・');
      }).catch(()=>{});
    } }
  };
};
// アプリ本体のプログラムだけを最新に読み込み直す（記録データは消さない）
function forceUpdate(){
  if(!confirm('保存した記録（調査・観察・録音）はそのままで、アプリのプログラムだけを最新に読み込み直します。よろしいですか？')) return;
  const reload=()=>location.reload();
  const tasks=[];
  // このアプリのSW・キャッシュだけを対象にする（同一オリジンの別アプリを壊さない）
  if('serviceWorker' in navigator){ tasks.push(navigator.serviceWorker.getRegistration()
    .then(r=>r?r.unregister():null).catch(()=>{})); }
  // bird-map-pack-*（オフライン地図の保存分）は意図的に消さない。利用者が明示的に保存した地図で、
  // アプリの更新とは無関係のため（消すのは保存画面の「削除」からのみ）
  if(window.caches){ tasks.push(caches.keys()
    .then(ks=>Promise.all(ks.filter(k=>k.startsWith('bird-survey-')||k.startsWith('bird-map-tiles-')).map(k=>caches.delete(k)))).catch(()=>{})); }
  Promise.all(tasks).then(reload, reload);
}

function saveSurvey(u, editing){

// 調査を関連データごとソフト削除（ごみ箱から戻せる）
function softDeleteSurveyCascade(u){
  const walkingHere = WALK && WALK.sv===u;
  if(walkingHere && !stopWalk(true)){
    // ルート本保存ができない状態。削除自体が成功することを確かめてから、下書きに残して強制停止する
    if(!DB.softDelete(DB.key.sv,u)) return false;   // 削除も失敗（容量不足）→記録は継続（DB.saveが警告済み）
    routeDraftSave(); forceStopWalk();
  } else {
    if(!DB.softDelete(DB.key.sv,u)) return false;
  }
  DB.obsOf(u).forEach(o=>DB.softDelete(DB.key.ob,o.uuid));
  DB.notesOf(u).forEach(n=>DB.softDelete(DB.key.nt,n.uuid));
  DB.hypOf(u).forEach(h=>DB.softDelete(DB.key.hy,h.uuid));
  DB.flightsOf(u).forEach(f=>DB.softDelete(DB.key.fl,f.uuid));
  return true;
}
function deleteSurvey(u){
  if(!confirm('この調査と、ひも付く観察記録を削除します。よろしいですか？（あとで「ごみ箱」から戻せます）')) return;
  if(!softDeleteSurveyCascade(u)) return;
  toast('削除しました'); reset('home');
}

let QUICKREC=null;   // すぐ録音セッション中の観察uuid
async function quickRec(svUuid){
  if(REC){ recStop(); return; }   // 録音中に押したら停止＝保存
  if(_recStarting) return;        // マイク許可待ち中の連打は無視（空レコードの量産・録音先の取り違え防止）
  if(!recSupported()){ toast('この端末では録音を利用できません（ホーム画面のアイコンから起動してください）'); return; }
  const fx=freshFix();
  const rec={ uuid:uuid(), survey_uuid:svUuid, observed_at:nowISO(),
    latitude:fx?fx.lat.toFixed(6):'', longitude:fx?fx.lon.toFixed(6):'', gps_accuracy:fx?Math.round(fx.acc):'',
    species_id:'', species_name_snapshot:'', count:1, detection_method:'鳴き声',
    behavior:'', habitat:'', age_class:'不明', sex:'不明', distance_band:'', direction:'',
    target_latitude:'', target_longitude:'', perch_size:'', perch_class:'',
    nest_tree_species:'', nest_tree_height:'', nest_state:'',
    identification_status:'未同定', confidence:'中', needs_review:true,
    note:'', external_photo_reference:'', audio:[], media:[] };
  if(!DB.upsertObs(rec)) return;
  SCREENS._mediaCtx={ kind:'obs', uuid:rec.uuid, sv:svUuid };
  QUICKREC=rec.uuid;
  await recToggle();
  if(REC && REC.target && REC.target.uuid===rec.uuid){ quickRecUi(true); }
  else{ // マイク不可・許可待ち中の画面移動などで開始できなかった→空レコードを片付け
    if(QUICKREC===rec.uuid) QUICKREC=null;
    if(SCREENS._mediaCtx && SCREENS._mediaCtx.uuid===rec.uuid) SCREENS._mediaCtx=null;   // 別画面が設定したctxは触らない
    DB.hardDelete(DB.key.ob, rec.uuid);
  }
}
function quickRecUi(on){
  const b=document.getElementById('quickRecBtn'); if(!b) return;
  if(on){ b.classList.add('recing'); b.innerHTML='<span class="ic"><span class="recdot"></span></span>録音中… タップで停止 <span id="recTime">0:00</span>'; }
  else{ b.classList.remove('recing'); b.innerHTML='<span class="ic">🎤</span>すぐ録音（種名はあとで）'; }
}
// 録音の停止処理（recToggleのonstop）から呼ばれる。すぐ録音セッションの後始末。
// finは音声保存のPromise（成功=true）。保存が終わってから成功表示と一覧更新を行う
function quickRecEnded(wasAbort, fin){
  if(!QUICKREC) return;
  const u=QUICKREC; QUICKREC=null;
  if(SCREENS._mediaCtx && SCREENS._mediaCtx.uuid===u) SCREENS._mediaCtx=null;   // 別画面が設定し直したctxは触らない
  quickRecUi(false);
  if(wasAbort) return;   // 画面遷移で破棄（レコードは音声なし・要確認付きで残るので後から見つけられる）
  const done=(ok)=>{
    if(!ok) return;   // 失敗トーストはrecFinalize側で表示済み（レコード自体は残る）
    toast('録音を記録として保存しました。一覧から開いて種名を書けます', 3000);
    const cur=STACK[STACK.length-1]||{};
    if(cur.name==='survey' && !REC) render();   // 一覧に今の記録を🎤付きで出す
  };
  if(fin && fin.then) fin.then(done).catch(()=>{});
  else done(false);
}
// 終了した調査を再開する（終了ボタンの押し間違い・帰り際の追加観察に対応）。振り返りはそのまま残る。
// 「終了〜再開」の中断時間は paused_ms に積み、経過時間の表示から差し引く（翌日再開でも水増しされない）
function resumeSurvey(u){ const s=DB.survey(u); if(!s) return;
  if(!confirm('この調査を再開しますか？\n終了時刻はいったん消え、もう一度終了したときに記録し直されます（振り返りは残ります）')) return;
  if(s.end_datetime){ const pause=Date.now()-new Date(s.end_datetime).getTime();
    if(isFinite(pause) && pause>0) s.paused_ms=(s.paused_ms||0)+pause; }
  s.status='調査中'; s.end_datetime='';
  if(!DB.upsertSurvey(s)) return;

/* GPS状態インジケータ（ヘッダの pill を更新） */
let gpsWatchId=null, lastFix=null;
// 位置の自動入力に使ってよい鮮度。これより古い測位は「前の地点・前日の位置」の恐れがあるため自動では使わない
const FIX_FRESH_MS=5*60*1000;
function freshFix(maxMs){ return (lastFix && (Date.now()-(lastFix.t||0))<=(maxMs||FIX_FRESH_MS)) ? lastFix : null; }
function startGpsIndicator(){
  stopGps();
  if(WALK) return;   // 歩行記録中はルートのwatchがlastFixと#pGpsを更新するので二重監視しない（電池対策）

  }, e=>{ const el=$('#pGps'); if(el){ el.textContent='GPS 取得不可'; el.className='pill off'; } },
  {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
}
function stopGps(){ if(gpsWatchId!=null && navigator.geolocation){ navigator.geolocation.clearWatch(gpsWatchId); } gpsWatchId=null; }

/* ============================================================
   観察記録 追加/編集
   ============================================================ */
/* ---------- 音声で観察を追加（話す→自動振り分け→確認して保存） ----------
   認識テキストの入口は2つ: アプリ内の音声認識（電波必須・非対応端末あり）と、
   テキスト欄＋キーボードの音声入力（iPhone標準・圏外OK）。どちらも parseVoiceObs で
   同じ解析に流し、結果は「観察を追加」画面の下書きにする（自動保存はしない＝誤記録防止）。
   発話の原文は必ず観察メモに残す（解析を誤っても情報が失われない） */
const VOICE_DIRS=['北東','北西','南東','南西','北','東','南','西'];   // 2文字方位を先に判定（「北東」を「北」と誤らない）
const VOICE_KNUM={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
// 「二」「十」「二十」「二十三」程度の漢数字を数値に（音声認識が漢数字で書くことがある）
function voiceKanjiNum(s){
  const m=String(s||'').match(/^([一二三四五六七八九]?)(十?)([一二三四五六七八九]?)$/);
  if(!m || (!m[1]&&!m[2]&&!m[3])) return null;
  if(!m[2] && m[3]) return null;   // 「二三」のような十なしの2桁は解釈しない
  const tens=m[2]?(m[1]?VOICE_KNUM[m[1]]:1)*10:(m[1]?VOICE_KNUM[m[1]]:0);
  return tens+(m[3]?VOICE_KNUM[m[3]]:0);
}
const VOICE_KATA=/[ァ-ヶー]/;
// 音声認識が鳥名を漢字（当て字）で書き出したときの変換辞書。値がマスタに実在するときだけ置換する。
// 「沢山鳥」のような一般語を巻き込む恐れのある表記（山鳥・烏 等の1〜2字の汎用語）は入れない
const VOICE_SPECIES_ALIASES={
  '熊鷹':'クマタカ','大鷹':'オオタカ','鳶':'トビ','鵟':'ノスリ','大鷲':'オオワシ',
  '尾白鷲':'オジロワシ','隼':'ハヤブサ','長元坊':'チョウゲンボウ','鶚':'ミサゴ','鷂':'ハイタカ',
  '真鴨':'マガモ','小鴨':'コガモ','尾長鴨':'オナガガモ','鴛鴦':'オシドリ','大白鳥':'オオハクチョウ','小白鳥':'コハクチョウ',
  '川鵜':'カワウ','海鵜':'ウミウ','鳰':'カイツブリ','青鷺':'アオサギ','五位鷺':'ゴイサギ',
  '鶯':'ウグイス','雲雀':'ヒバリ','燕':'ツバメ','雨燕':'アマツバメ','岩燕':'イワツバメ','腰赤燕':'コシアカツバメ',
  '雀':'スズメ','鵯':'ヒヨドリ','椋鳥':'ムクドリ','目白':'メジロ',
  '四十雀':'シジュウカラ','山雀':'ヤマガラ','日雀':'ヒガラ','小雀':'コガラ','五十雀':'ゴジュウカラ',
  '鶫':'ツグミ','白腹':'シロハラ','赤腹':'アカハラ','駒鳥':'コマドリ','瑠璃鶲':'ルリビタキ','尉鶲':'ジョウビタキ',
  '野鶲':'ノビタキ','大瑠璃':'オオルリ','黄鶲':'キビタキ',
  '白鶺鴒':'ハクセキレイ','黄鶺鴒':'キセキレイ','背黒鶺鴒':'セグロセキレイ',
  '河烏':'カワガラス','川烏':'カワガラス','鷦鷯':'ミソサザイ','菊戴':'キクイタダキ','翡翠':'カワセミ','山翡翠':'ヤマセミ',
  '赤啄木鳥':'アカゲラ','小啄木鳥':'コゲラ','熊啄木鳥':'クマゲラ','山啄木鳥':'ヤマゲラ',
  '懸巣':'カケス','星鴉':'ホシガラス','頬白':'ホオジロ','頬赤':'ホオアカ','青鵐':'アオジ',
  '雉鳩':'キジバト','雉':'キジ','郭公':'カッコウ','筒鳥':'ツツドリ','時鳥':'ホトトギス','不如帰':'ホトトギス',
  '鶉':'ウズラ','梟':'フクロウ','青葉木菟':'アオバズク','縞梟':'シマフクロウ','夜鷹':'ヨタカ',
  '田鴫':'タシギ','山鴫':'ヤマシギ','丹頂':'タンチョウ',
  '三砂':'ミサゴ',   // 音声認識の実誤変換（実機報告 2026-08-03）。増えたらここに追記していく
  '大葦切':'オオヨシキリ','小葦切':'コヨシキリ','鵙':'モズ','百舌鳥':'モズ','百舌':'モズ',
};
const VOICE_ALIAS_KEYS=Object.keys(VOICE_SPECIES_ALIASES).sort((a,b)=>b.length-a.length);   // 長い表記を先に（「四十雀」を「雀」より先）
const VOICE_KANJI=/[一-鿿々]/;
const VOICE_PARTICLE='がはをのにともでへやかだ';
// 鳥名の直後がこれらの語で始まるなら、区切り文字が無くても単語の切れ目とみなす。
// 現場では「鶯さえずり」「鳶飛翔」「鶯二羽」のように助詞を挟まず話すため、これが無いと拾えない
// 「見」「鳴」「飛」のような1文字では地名・熟語を巻き込むため、活用形まで含めて並べる
const VOICE_NEXT_OK=[...OPT.behavior.filter(b=>b!=='その他'), ...OPT.detection.filter(d=>d!=='不明'),
  ...VOICE_DIRS, '羽','匹','個体','メートル','メーター','声','痕跡','糞','羽毛','って',
  '見た','見え','見つけ','鳴い','鳴き','鳴く','飛ん','飛び'];
// 漢数字も単独では地名を巻き込む（燕三条）ので、助数詞まで続く場合だけ切れ目として認める
const VOICE_NEXT_NUM=/^[一二三四五六七八九十]+\s*(?:羽|匹|個体)/;
function voiceNextKnown(str,pos){ const rest=str.slice(pos);
  return VOICE_NEXT_NUM.test(rest) || VOICE_NEXT_OK.some(w=>rest.startsWith(w)); }
// 右境界の共通判定。allowKanji=true は「原文にカタカナで書かれている」経路用（種名の確度が高いので
// 漢字が続いても切れ目とみなす）。どちらの経路でも、続きが既知の観察用語なら切れ目として認める
function voiceBoundR(str,pos,allowKanji){
  const nc=(pos<str.length)?str.charAt(pos):'';
  if(!nc) return true;
  if(!VOICE_KATA.test(nc) && (allowKanji || !VOICE_KANJI.test(nc))
    && (!/[ぁ-ゖ]/.test(nc) || VOICE_PARTICLE.includes(nc))) return true;
  return voiceNextKnown(str,pos);
}
// 当て字→カタカナの置換。単語境界つき: 前後が漢字・カタカナなら熟語の一部（麻雀・鳶職・鶯谷駅・翡翠色）
// とみなして変換しない。後ろのひらがなは助詞類だけを切れ目として認める（「鶯が」は変換・「夜鷹そば」は不変換）
function voiceAliasApply(s){
  let out=String(s||'');
  for(const k of VOICE_ALIAS_KEYS){
    if(!out.includes(k)) continue;
    const v=VOICE_SPECIES_ALIASES[k];
    if(!speciesByName(v)) continue;   // マスタに無い名前には変換しない（誤確定防止）
    let res='', i=0;
    while(i<out.length){
      const j=out.indexOf(k,i);
      if(j<0){ res+=out.slice(i); break; }
      const prev=j>0?out.charAt(j-1):'';
      const okL=!prev || (!VOICE_KANJI.test(prev) && !VOICE_KATA.test(prev));
      const okR=voiceBoundR(out, j+k.length, false);
      res+=out.slice(i,j)+((okL&&okR)?v:k);
      i=j+k.length;
    }
    out=res;
  }
  return out;
}
/* ---------- 「もしかして」候補（聞き間違いの受け止め） ----------
   音声認識は「ウグイズ」「シジュカラ」のように1〜2文字だけ外すことがある。
   ぴったり当たる種が1つも無いときだけ、近い名前を候補として出す。
   ここで出したものは自動では選ばない（黙って違う種を入れないため。選ぶのは利用者のタップ） */
// 上限つきの編集距離。上限を超えた時点で打ち切るので、候補にならない種の計算は早く終わる
function voiceEditDist(a,b,max){
  const la=a.length, lb=b.length;
  if(Math.abs(la-lb)>max) return max+1;
  let prev=[], cur=[];
  for(let j=0;j<=lb;j++) prev[j]=j;
  for(let i=1;i<=la;i++){
    cur[0]=i; let row=i;
    for(let j=1;j<=lb;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
      if(cur[j]<row) row=cur[j];
    }
    if(row>max) return max+1;   // この行が全部上限超え＝これ以上縮まらない
    const tmp=prev; prev=cur; cur=tmp;
  }
  return prev[lb];
}
// カタカナのかたまりの「先頭」を種名と比べる（発話は「種名→数→行動」の順で始まることが多い）
function voiceNearSpecies(t){
  const runs=(String(t||'').match(/[ァ-ヶー]{3,}/g)||[]).slice(0,4);
  if(!runs.length) return [];
  const out=[];
  for(const s of SPECIES){
    const n=toKata(s.japanese_name); if(n.length<3) continue;
    const lim=(n.length>=6)?2:1;   // 長い名前ほど1文字の取り違えが起きやすいので許容を広げる
    let d=lim+1;
    for(const run of runs){
      for(let L=n.length-1; L<=n.length+1 && d>0; L++){
        if(L<3 || L>run.length) continue;
        const dd=voiceEditDist(run.slice(0,L), n, lim);
        if(dd<d) d=dd;
      }
    }
    if(d<=lim) out.push({s,d,n});
  }
  out.sort((a,b)=>a.d-b.d || b.n.length-a.n.length);
  return out.slice(0,3).map(x=>x.s);
}
function parseVoiceObs(text){
  const raw=String(text||'').trim();
  // 当て字変換 → 正規化: ひらがな→カタカナ（種名マスタはカタカナ）・全角数字→半角・数字内の桁区切りカンマ除去
  const rawM=voiceAliasApply(raw);
  const t=toKata(rawM).replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/(\d)[,，](?=\d)/g,'$1');
  const r={ species_name:'', species_id:'', species_cands:[], count:'', behavior:'', detection_method:'',
    distance_band:'', direction:'', note: raw?('🎙 '+raw):'' };
  if(!raw) return r;
  // 種名の2段判定（「とびけら」→トビ、「うそみたい」→ウソ のような一般文への誤ヒットを防ぐ）:
  // 1) 原文にカタカナのまま現れ、前後がカタカナ以外（＝単語の切れ目）なら採用
  // 2) それが無ければ、かな正規化後の包含。ただし短い名前は誤ヒットしやすいので3文字以上のみ
  // 候補の中では最長を採用（「カラス」より「ハシブトガラス」を優先）
  const hits=[];
  for(const s of SPECIES){ const n=toKata(s.japanese_name);
    let hit=false, i=rawM.indexOf(n);
    while(i>=0){
      const okL=(i===0)||!VOICE_KATA.test(rawM.charAt(i-1));
      // 右境界: カタカナが続けば単語の途中（「トビが飛んだ」は採用、「トビけらがいた」は不採用）
      if(okL && voiceBoundR(rawM, i+n.length, true)){ hit=true; break; }
      i=rawM.indexOf(n,i+1);
    }
    // 2段目: ひらがなで話された場合。t は全体がカタカナ化されるので t 上では切れ目を判定できない。
    // toKata は文字数を変えないため、同じ位置の原文(rawM)の前後で境界を見る
    // （「うぐいすがないた」は採用・「うぐいす谷駅」「めじろ台駅」「かわせみ色」は不採用）
    if(!hit && n.length>=3){
      let k=t.indexOf(n);
      while(k>=0){
        const pc=k>0?rawM.charAt(k-1):'';
        const okL2=!pc || (!VOICE_KATA.test(pc) && !VOICE_KANJI.test(pc)
          && (!/[ぁ-ゖ]/.test(pc) || VOICE_PARTICLE.includes(pc)));
        if(okL2 && voiceBoundR(rawM, k+n.length, false)){ hit=true; break; }
        k=t.indexOf(n,k+1);
      }
    }
    if(hit) hits.push({s,n});
  }
  hits.sort((a,b)=>b.n.length-a.n.length);   // 長い名前を優先（「カラス」より「ハシブトガラス」）
  const best=hits[0]||null;
  if(best){ r.species_name=best.s.japanese_name; r.species_id=best.s.species_id; }
  // 候補: 当たった種を最大3件。1件も当たらなかったときだけ「もしかして」を出す（聞き間違い対策）。
  // もしかしては決して自動で選ばない＝黙って違う種が入ることが構造的に起きない
  r.species_cands = hits.length
    ? hits.slice(0,3).map(h=>({name:h.s.japanese_name, id:h.s.species_id, sure:true}))
    : voiceNearSpecies(t).map(s=>({name:s.japanese_name, id:s.species_id, sure:false}));
  // 距離帯: 「30メートル」「30m」「30.5m」→ 区分に丸める。「30mm」等の別単位は除外。
  // 先に取り、マッチ部分を文面から除いてから個体数を見る（距離の数字を個体数に誤取り込みしない）
  let t2=t;
  const dm=t.match(/(\d+(?:\.\d+)?)\s*(?:メートル|メーター|[mMｍ](?![a-zA-Zｍ]))/);
  if(dm){ const n=parseFloat(dm[1]); r.distance_band = n<=25?'〜25m' : (n<=50?'〜50m':'50m超');
    t2=t.replace(dm[0],' '); }
  // 個体数: 「2羽」「3匹」「2個体」（漢数字「二羽」「十羽」も可）。無ければ種名直後の裸の整数
  let count='';
  const cm=t2.match(/(?:^|[^\d.])(\d+)\s*(?:羽|匹|個体|ワ)/);
  if(cm) count=cm[1];
  if(!count){ const km=t2.match(/([一二三四五六七八九十]{1,3})\s*(?:羽|匹|個体|ワ)/);
    if(km){ const n=voiceKanjiNum(km[1]); if(n!=null) count=String(n); } }
  if(!count && best){ const after=t2.slice(t2.indexOf(best.n)+best.n.length);
    // 数字の直後に英字が続くもの（30mm 等の単位付き）は個体数と見なさない
    const m2=after.match(/^\s*(\d+)(?![\d.a-zA-Zａ-ｚＡ-Ｚ])/); if(m2) count=m2[1]; }
  r.count=count;
  // 行動: 選択肢の語が含まれるか（複数可。「その他」は対象外）
  const beh=OPT.behavior.filter(b=>b!=='その他' && t.includes(toKata(b)));
  r.behavior=beh.join('・');
  // 確認方法: キーワードから推定（無ければ空のまま＝入力画面の既定「目視」に従う）
  const hasEye=/目視|見エ|見タ/.test(t);
  const hasVoice=/声|鳴キ|サエズリ/.test(t);
  const hasTrace=/痕跡|糞|フン|羽毛/.test(t);
  const hasFly=/飛翔|飛ン/.test(t) || beh.includes('飛翔');
  if(hasEye&&hasVoice) r.detection_method='目視および鳴き声';
  else if(hasVoice) r.detection_method='鳴き声';
  else if(hasEye) r.detection_method='目視';
  else if(hasTrace) r.detection_method='痕跡';
  else if(hasFly) r.detection_method='飛翔';
  // 方向: 8方位の語（2文字を先に）
  for(const d of VOICE_DIRS){ if(t.includes(d)){ r.direction=d; break; } }
  return r;
}
SCREENS.voiceObs = (u)=>{

        ?'🎙ボタンは<b>電波が必要</b>です。圏外のときは下の欄をタップして、キーボードのマイクで話してください（圏外でも使えます）。'
        :'この端末ではアプリ内の音声認識が使えないため、下の欄をタップして<b>キーボードのマイク🎙</b>で話してください（圏外でも使えます）。'}</div>

let VREC=null;   // 音声認識セッション（多重起動防止）
// 認識セッションの強制破棄。画面遷移時（render）と遷移前（voiceToObs）に必ず呼ぶ。
// 先に VREC を外してからハンドラを切る＝以降どのコールバックが遅れて届いても何もしない
function voiceRecAbort(){
  const rec=VREC; VREC=null; if(!rec) return;
  try{ rec.onresult=null; rec.onerror=null; rec.onend=null;
    (rec.abort||rec.stop||function(){}).call(rec); }catch(e){}
  const b=$('#voiceBtn'); if(b) b.textContent='🎙 話す';
}
function voiceListen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
  if(VREC){ const cur=VREC;   // 聞き取り中にもう一度押したら停止（結果は onend 経由で確定）
    if(cur._stopping){ voiceRecAbort(); return; }   // 停止が効かない実装の脱出口（2度目で強制破棄）
    cur._stopping=true;
    try{ cur.stop(); }catch(e){ voiceRecAbort(); }
    return; }
  // continuous=true: 区切って話しても一呼吸の沈黙で認識が終わらないようにする（それでも
  // OS側の都合で終わることはある→その場合は追記方式が受け止める）
  const rec=new SR(); rec.lang='ja-JP'; rec.interimResults=true; rec.continuous=true;
  // 開始時点の欄の内容を覚えておき、認識結果はその後ろに足す（途切れて話し直しても前の内容が消えない）
  const base=(($('#voiceText')||{}).value||'').trim();
  // 各コールバックは「今も自分が現役か」を確認する（破棄済みセッションの遅延通知でDOMを触らない）
  rec.onresult=e=>{ if(VREC!==rec) return;
    let fin='', inter='';
    for(const res of e.results){ if(res.isFinal) fin+=res[0].transcript; else inter+=res[0].transcript; }
    // continuous=true では確定分と認識途中が同時に存在する。両方つなぐ（確定が出た瞬間に
    // 認識途中の言葉が画面から消えないように）
    const ta=$('#voiceText'); if(ta){ ta.value=(base?base+' ':'')+fin+inter; SCREENS._dirty=true; voicePreview(); } };
  rec.onerror=e=>{ if(VREC!==rec) return;
    toast(e.error==='network'
    ?'音声認識には電波が必要です。下の欄からキーボードのマイクで話してください'
    :'音声を認識できませんでした。下の欄からも入力できます', 4000); };
  rec.onend=()=>{ if(VREC!==rec) return;
    VREC=null; const b=$('#voiceBtn'); if(b) b.textContent='🎙 話す'; };
  try{ rec.start(); VREC=rec; const b=$('#voiceBtn'); if(b) b.textContent='⏹ 聞き取り中…（タップで停止）'; }
  catch(e){ VREC=null; toast('音声認識を開始できませんでした'); }
}
/* ---------- 種名は「決め打ち」ではなく「候補から選ぶ」 ----------
   話した内容から1種を黙って決めると、違う種が入っていても気づかれない。
   候補をボタンで並べ、押されたものを採用する。押されていなければ先頭（＝確かに当たった種）を使う */
let VOICE_PICK={txt:'', name:'', id:''};   // 話した内容が変わったら捨てる＝別の文の選択を持ち越さない
// 一致しないときに「使わない」だけでは足りない。文をX→Y→Xと戻したときや、別の観察で同じ文を
// 打ち直したときに、タップしていない選択が復活してしまうため、中身そのものを捨てる
function voicePickClear(){ VOICE_PICK={txt:'', name:'', id:''}; }
function voicePickSet(name,id){
  const ta=$('#voiceText');
  VOICE_PICK={txt:(ta&&ta.value)||'', name:name||'', id:id||''};
  SCREENS._dirty=true; voicePreview();
}
// 実際に使う種名。txt は textarea の値そのまま（trimしない）で揃えること
function voicePickFor(txt,p){
  if(VOICE_PICK.name && VOICE_PICK.txt===txt) return {name:VOICE_PICK.name, id:VOICE_PICK.id};
  return {name:p.species_name, id:p.species_id};
}
function voiceCandHtml(p,txt){
  if(!p.species_cands.length) return txt.trim()?'<span class="muted">見つかりません（あとで選べます）</span>':'';
  const cur=voicePickFor(txt,p);
  const maybe=!p.species_cands[0].sure;
  return (maybe?'<span class="tiny muted" style="margin-right:4px;">もしかして</span>':'')
    + p.species_cands.map(c=>{
      const on=(c.name===cur.name);
      // 種名は自分たちのマスタの値だが、方針どおり onclick には埋め込まずdata属性から読む
      return `<button type="button" class="voice-chip${on?' on':''}" data-n="${esc(c.name)}" data-i="${esc(c.id)}"
        onclick="voicePickSet(this.dataset.n, this.dataset.i)">${on?'✓ ':''}${esc(c.name)}</button>`;
    }).join('');
}
function voicePreview(){
  const box=$('#voicePrev'); if(!box) return;
  const txt=(($('#voiceText')||{}).value||'');
  if(VOICE_PICK.txt!==txt) voicePickClear();   // 文が変わった時点で選択を捨てる（戻しても復活させない）
  const p=parseVoiceObs(txt);
  const cands=voiceCandHtml(p,txt);
  if(box.classList.contains('compact')){
    // ドック用の省スペース表示（メモは原文そのままなので省略）
    const parts=[ p.count?(p.count+'羽'):'', p.behavior, p.detection_method, p.distance_band, p.direction ]
      .filter(Boolean).map(esc);
    const rest=parts.length?`<span class="tiny muted">${parts.join(' ・ ')}</span>`:'';
    box.innerHTML = (cands||rest) ? (cands+(cands&&rest?'<br>':'')+rest) : '—';
    return;
  }
  const row=(k,v)=>`<div class="row" style="padding:2px 0;"><div class="small muted" style="width:80px; flex:none;">${k}</div><div class="grow small">${v||'<span class="muted">—</span>'}</div></div>`;
  box.innerHTML = row('種名', cands)
    + row('個体数', esc(p.count)) + row('行動', esc(p.behavior)) + row('確認方法', esc(p.detection_method))
    + row('距離帯', esc(p.distance_band)) + row('方向', esc(p.direction)) + row('メモ', esc(p.note));
}
function voiceToObs(u){
  const rawTxt=(($('#voiceText')||{}).value||'');
  const txt=rawTxt.trim();
  if(!txt){ toast('先に話すか、内容を入力してください'); return; }
  voiceRecAbort();
  const p=parseVoiceObs(txt);
  const pick=voicePickFor(rawTxt,p);   // 候補をタップして選び直していればそれを使う
  p.species_name=pick.name; p.species_id=pick.id;
  voicePickClear();   // 引き継いだので、この選択は次の入力へ持ち越さない
  SCREENS._dirty=false;   // 内容は observation の下書きへ引き継ぐので、この画面の離脱確認は不要
  goBack(); nav('obsEdit', JSON.stringify({sv:u, voice:p}));
}
/* 観察入力画面の音声入力ドック: 画面下に固定表示し、フォームをスクロールして各項目を
   見ながら「話す→反映」できる。保存バーの上に載せる（保存ボタンは隠さない）。
   部品IDは voiceObs と共通（#voiceBtn/#voiceText/#voicePrev）＝ voiceListen/voicePreview を使い回す */
function voiceDockToggle(){
  // 開いている時にもう一度押した場合も「閉じる」＝未反映の発話があれば確認を挟む
  // （確認なしの voiceDockClose は render() の後始末など内部用途だけに使う）
  if(document.getElementById('voiceDock')){ voiceDockDismiss(); return; }
  if(!$('#obForm')) return;
  const hasSR=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  const d=document.createElement('div');
  d.id='voiceDock';
  d.style.cssText='position:fixed; left:50%; transform:translateX(-50%); width:min(100%,900px); '
    +'bottom:calc(70px + env(safe-area-inset-bottom, 0px)); z-index:70; box-sizing:border-box; '
    +'background:var(--panel); border-top:1px solid var(--line); border-radius:12px 12px 0 0; '
    +'padding:8px 12px; box-shadow:0 -4px 16px rgba(0,0,0,.45);';
  d.innerHTML=`
    <div style="display:flex; gap:8px; align-items:flex-start;">
      ${hasSR?`<button type="button" class="btn" id="voiceBtn" style="width:auto; padding:10px 12px; flex:none;" onclick="voiceListen()">🎙 話す</button>`:''}
      <textarea id="voiceText" rows="2" style="min-height:44px; flex:1;" placeholder="${hasSR?'ここに話した内容が入ります（手修正可）':'キーボードのマイク🎙で話してください（圏外OK）'}" oninput="SCREENS._dirty=true; voicePreview()"></textarea>
      <button type="button" class="btn ghost" style="width:auto; padding:10px 12px; flex:none;" onclick="voiceDockDismiss()">✕</button>
    </div>
    <div id="voicePrev" class="tiny muted compact" style="margin:6px 2px;">—</div>
    <button type="button" class="btn" style="padding:10px;" onclick="voiceApplyToForm()">↑ 上の入力欄に反映</button>`;
  document.body.appendChild(d);
  // ドックに隠れないよう、フォーム側の下端に余白を足す（閉じたら戻す）
  const m=$('#main'); if(m) m.style.paddingBottom='210px';
  voicePreview();
}
function voiceDockClose(){
  voiceRecAbort();
  voicePickClear();   // 入力を終えたので選択も捨てる（次に開いたとき前の選択が残らない）
  const d=document.getElementById('voiceDock'); if(d) d.remove();
  const m=$('#main'); if(m) m.style.paddingBottom='';
}
// ✕ボタン用: 未反映の発話が残っていれば確認してから閉じる（render()からの後始末は確認なしの voiceDockClose を使う）
function voiceDockDismiss(){
  const txt=(($('#voiceText')||{}).value||'').trim();
  if(txt && !confirm('話した内容がまだ反映されていません。破棄して閉じますか？')) return;
  voiceDockClose();
}
// 観察入力画面の中の音声入力: 解析結果を「開いているフォーム」にそのまま反映する。
// 解析できた項目だけ書き込み、行動は既存の選択に追加、メモは原文を追記（消さない・失わない）
function voiceApplyToForm(){
  const rawTxt=(($('#voiceText')||{}).value||'');
  const txt=rawTxt.trim();
  if(!txt){ toast('先に話すか、内容を入力してください'); return; }
  if(!$('#obForm')){ return; }   // 観察入力画面以外では何もしない
  voiceRecAbort();   // 認識中に押されても、遅れて届く認識結果が空にした欄へ戻らないように先に破棄
  const p=parseVoiceObs(txt);
  const pick=voicePickFor(rawTxt,p);   // 候補をタップして選び直していればそれを使う
  if(pick.name) chooseSpecies((speciesByName(pick.name)||{}).species_id||'', pick.name);
  if(p.count){ const el=$('#obForm [name="count"]'); if(el) el.value=p.count; }
  if(p.detection_method){ const el=document.querySelector('[data-seg="detection_method"]'); if(el) el.value=p.detection_method; }
  if(p.distance_band){ const el=document.querySelector('[data-seg="distance_band"]'); if(el) el.value=p.distance_band; }
  if(p.direction){ const b=[...document.querySelectorAll('[data-seg="direction"] button')].find(x=>x.textContent===p.direction);
    if(b && !b.classList.contains('on')) b.click(); }
  if(p.behavior){ p.behavior.split('・').forEach(v=>{
    const b=[...document.querySelectorAll('[data-seg="behavior"] button')].find(x=>x.textContent===v);
    if(b && !b.classList.contains('on')) b.click(); }); }   // click経由＝繁殖ヒント・見出し更新も従来どおり動く
  if(p.note){ const el=$('#obForm [name="note"]'); if(el) el.value=(el.value?el.value+'\n':'')+p.note; }
  SCREENS._dirty=true;
  voicePickClear();   // 反映済みなので、この選択は次の発話へ持ち越さない
  const ta=$('#voiceText'); if(ta) ta.value='';
  voicePreview();
  toast('入力欄に反映しました。内容を確認して保存してください');
}

function pickObs(btn,field,val){
  const before=btn.classList.contains('on');   // 同じ値を押し直しただけなら未保存扱いにしない（無用な離脱確認を出さない）
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); syncOther(field);
