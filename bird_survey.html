function repairNoteAdd(prev, msg){
  const t=(typeof prev==='string'&&prev ? prev+' / ' : '')+msg;
  if(t.length<=REPAIR_NOTE_MAX) return t;
  const m=msg.length>REPAIR_NOTE_MAX-1 ? msg.slice(0,REPAIR_NOTE_MAX-1)+'…' : msg;
  const room=REPAIR_NOTE_MAX-m.length-4;
  return (room>0 && typeof prev==='string' && prev) ? ('…'+prev.slice(-(room))+' / '+m) : m;
}

function flStoreInto(seg){

// 経路の高度・行動を画面へ読み込む。
// 「その他（記入内容）」は標準の「その他」ボタン＋記入欄に分解して出す。
// 選択肢に無いそれ以外の値は、印付きのボタンをその場で足して見せる（読み込み前に前回の分は片付ける）
function flLoadFrom(seg){
  SCREENS._flLoading=true;
  try{
    const fl=(seg&&seg.fl)||{height:'',behavior:''};
    segSet('fl_height', fl.height||'');
    const segEl=document.querySelector('[data-seg="fl_behavior"]');
    if(segEl){
      [...segEl.querySelectorAll('button[data-dyn]')].forEach(b=>b.remove());   // 前の経路で足したボタンを片付ける
      const parsed=otherParse(fl.behavior||'');
      const want=String(parsed.v||'').split('・').filter(Boolean);
      const inp=document.querySelector('[data-other="fl_behavior"]');
      if(inp) inp.value=parsed.other||'';   // 記入欄は経路ごとに入れ替える（前の経路の記入を持ち越さない）
      // まず今の選択を全部外す
      [...segEl.querySelectorAll('button.on')].forEach(b=>b.click());
      want.forEach(vv=>{
        let b=[...segEl.querySelectorAll('button')].find(x=>x.textContent===vv);
        if(!b){
          const sample=segEl.querySelector('button');
          if(sample){ b=sample.cloneNode(false); b.textContent=vv; b.classList.remove('on');
            b.setAttribute('data-dyn','1'); segEl.appendChild(b); }
        }
        if(b && !b.classList.contains('on')) b.click();
      });
      syncOther('fl_behavior');
    }

}
function pfSyncFlightFields(){

  const selSeg=(PF_SEL>=0)?PF_SEGS[PF_SEL]:null;

  const prev=SCREENS._flSeg||null;
  if(prev && prev!==one && PF_SEGS.includes(prev)) flStoreInto(prev);   // 隠す前に、いままでの経路へ控える

  const h=$('#flHeightWrap'); if(h) h.style.display=on?'':'none';
  const b=$('#flBehWrap'); if(b) b.style.display=on?'':'none';

  if(te) te.value = one ? (('end'   in (one.ov||{})) ? one.ov.end   : (one.times[one.times.length-1]||'')) : '';

function pfDrop(lat,lon){
  if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY) return;   // 保存の後処理中は地図も触らせない
  pfSnap();   // 「↶」で戻せるように、変える前の状態を控える
  const now=localDatetimeValue();
  // 「直す」で対象が選ばれているときは、新しく落とさずその対象を動かす／描き足す
  if(PF_SEL===-2){
    PF_NEST=[lat,lon];
    nestTouch(); nestSync();
    SCREENS._dirty=true; pfRedraw(); pfInfo(); segChips(); return;
  }
  if(PF_SEL>=0){
    const sg=PF_SEGS[PF_SEL];
    if(sg){
      // 位置を変えたら「もとの記録のP」ではなくなる。距離帯も新しい位置から決め直す
      if(sg.t==='P'){
        sg.pt=[lat,lon]; sg.fromExisting=false;
        // 古い記録の案内は「開いたときに読み込んだその位置」だけが対象。動かしたら終わりにする
        if(sg.id===PF_LEGACY_ID){ PF_LEGACY_ID=null; }
      }
      else { sg.pts.push([lat,lon]); sg.times.push(now); sg.edited=true; }
      SCREENS._dirty=true; pfRedraw(); pfInfo(); pfSyncFlightFields(); segChips(); return;
    }
  }
  if(PF_MODE==='N'){
    PF_NEST=[lat,lon];
    nestTouch(); nestSync();
    SCREENS._dirty=true; pfRedraw(); pfInfo(); segChips(); return;
  }
  if(PF_MODE==='P'){
    // 位置が無かった古い記録から引き継ぐ止まり木情報があれば、最初の P に移す
    let _pk=perchNew();
    if(SCREENS._pendingPerch){ _pk=SCREENS._pendingPerch; SCREENS._pendingPerch=null; }
    PF_SEGS.push({t:'P', id:pfId(), pt:[lat,lon], time:now, perch:_pk});
    PERCH_IDX=pfPoints().length-1;   // 落としたばかりの P を編集対象にする
    perchTabs(); perchLoad();
  } else {
    const last=PF_SEGS[PF_SEGS.length-1];
    if(PF_NEWLINE || !last || last.t!=='F'){ PF_SEGS.push({t:'F', id:pfId(), pts:[[lat,lon]], times:[now], fl:{height:'',behavior:''}}); PF_NEWLINE=false; }
    else { last.pts.push([lat,lon]); last.times.push(now); last.edited=true; }
  }
  SCREENS._dirty=true; pfRedraw(); pfInfo(); pfSyncFlightFields(); segChips();
}
function obsMapUndo(){

  // 飛翔の時刻まで巻き戻すと、気づかないうちに入力が消える（2026-08-06 監査）

// 観察者の位置と鳥の位置から距離帯を決める（区分は既存のまま）
function distBandFrom(obsLat,obsLon,tLat,tLon){
  if(!validLatLon(String(obsLat),String(obsLon)) || !validLatLon(String(tLat),String(tLon))) return '';
  let d=null;
  try{ d=(mapObj?mapObj.distance([+obsLat,+obsLon],[+tLat,+tLon]):null); }catch(e){}
  if(d==null){
    // 地図が無いときの簡易計算（緯度1度=111320m、経度は緯度で縮む）
    const R=Math.PI/180, dy=(+tLat-+obsLat)*111320, dx=(+tLon-+obsLon)*111320*Math.cos(+obsLat*R);
    d=Math.hypot(dx,dy);
  }
  if(!Number.isFinite(d)) return '';
  return d<=25?'〜25m':(d<=50?'〜50m':'50m超');
}

// 経路1本から飛翔レコードを作る。検査に落ちたら null を返す（保存は始めない）
function buildFlightRec(seg, svUuid, name, count, ageCls, indKey, memo, needsReview, override, useForm, indLabel){
  // 2点未満は原則保存しないが、既存で触っていない経路は元のままの姿で書き戻す（共有項目だけそろえる）
  if(!seg || (seg.pts.length<2 && !(seg.srcUuid && !seg.edited))) return null;
  const ov=override||{};
  // 手で空にしたのも「空という指定」として扱う（||で判定すると自動の時刻に戻ってしまう）
  const st=('start' in ov) ? ov.start : (seg.times[0] || localDatetimeValue());
  const en=('end'   in ov) ? ov.end   : (seg.times[seg.times.length-1] || '');
  for(const pair of [[st,'開始時刻'],[en,'終了時刻']]){
    if(pair[0] && !okStamp(pair[0])){ toast('飛翔の'+pair[1]+'が正しくありません'); return null; }
  }
  if(st && en && en<st){ toast('飛翔の終了時刻が開始時刻より前です'); return null; }
  const spId = name ? (SCREENS._chosenId||(speciesByName(name)||{}).species_id||'') : '';
  // 高度・行動は経路そのもの（seg.fl）から。画面の欄は写しにすぎない
  const heightRaw = (seg.fl&&seg.fl.height)||'';
  const behaviorNew = (seg.fl&&seg.fl.behavior)||'';
  // まとめ読みした既存の経路（srcUuid）は、その記録を基底にして、
  // 共有の項目（種名・個体数・齢・結び付け）と経路・時刻だけを上書きする。
  // 高度・行動は、経路が1本だけで画面に出ているとき（＝開いたとき読み込んである）だけ画面の値。
  // メモ・要確認・添付・個体ラベル・作成日時などは、その記録のまま
  const cur = seg.srcUuid ? (DB.load(DB.key.fl)||[]).find(x=>x&&x.uuid===seg.srcUuid) : null;
  if(cur){
    return Object.assign({}, cur, {
      survey_uuid:svUuid,
      species_id:spId, species_name_snapshot:name,
      // 経路を触っていなければ、元の点をそのまま残す（検査で除いた点を黙って消さない）
      path:(seg.srcUuid && !seg.edited) ? ((cur.path||[]).slice()) : seg.pts.slice(),
      start_time:st, end_time:en,
      // 既存の記録では、空は空のまま残す（触っていない項目を「不明」に化けさせない）。
      // 齢は画面で触ったときだけそろえる（触っていないのに観察の齢で埋めない）
      age_class:(SCREENS._ageTouched ? ageCls : (cur.age_class||'')), count:count, individual_key:indKey||'',
      individual_label:String(indLabel||''),   // 同じ鳥の呼び名は観察と飛翔でそろえる
      height_class: heightRaw,
      behavior: behaviorNew,
    });
  }
  return { uuid:uuid(), survey_uuid:svUuid,
    species_id:spId,
    species_name_snapshot:name,
    path:seg.pts.slice(), start_time:st, end_time:en,
    height_class:heightRaw||'不明',
    age_class:ageCls||'不明', individual_label:String(indLabel||''),
    behavior:behaviorNew,
    count:count, memo:String(memo||'').trim(), needs_review:!!needsReview,
    individual_key:indKey||'',
    audio:[], media:[] };
}

// 自動バックアップの門: 取引中・復旧中・停止中は予約も発火もしない。
// 遮断中の要求は保留し、確定点（取引の完了）で一度だけ予約し直す

// 鍵の並び順に依存しない全文比較（保存された値と「書こうとした値」の照合用）
function stableJson(v){
  // JSON.stringify と同じ規則に合わせる: オブジェクトの undefined 項目は無いものとして扱い、
  // 配列の undefined は null にする（保存前の値と保存後の読み直しを比べるため）
  if(v===undefined) return 'null';
  if(Array.isArray(v)) return '['+v.map(x=>(x===undefined)?'null':stableJson(x)).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined)
    .map(k=>JSON.stringify(k)+':'+stableJson(v[k])).join(',')+'}';
  return JSON.stringify(v);
}

// 控え（ジャーナル）の形の検証。壊れた控えを受理すると、未知の途中状態のまま
// 通常保存やバックアップへ進んでしまう
function saveJournalValid(j){
  try{
    if(!j || typeof j!=='object' || Array.isArray(j) || !Array.isArray(j.undo)) return false;
    // 現行形式は phase と tx が必須。phase の無いものだけを旧形式（v160相当）として許す
    if(j.phase!==undefined){
      if(j.phase!=='writing' && j.phase!=='written') return false;
      if(!(typeof j.tx==='string' && j.tx)) return false;
    } else {
      if(j.tx!==undefined && !(typeof j.tx==='string' && j.tx)) return false;
    }
    const KEYS=new Set([DB.key.sv,DB.key.ob,DB.key.nt,DB.key.hy,DB.key.hr,DB.key.fl,DB.key.recent,DB.key.fav]);
    const plainObj=v=>v!=null && typeof v==='object' && !Array.isArray(v);
    for(const e of j.undo){
      if(!plainObj(e)) return false;
      if(typeof e.key!=='string' || !KEYS.has(e.key)) return false;
      if(typeof e.uuid!=='string' || !e.uuid) return false;
      if(!(e.prev===null || e.prev===undefined || plainObj(e.prev))) return false;   // 配列などは不可
      if(typeof e.wroteRec!=='string') return false;
      if(j.phase==='written' && !e.wroteRec) return false;   // 完了段は「書いた控え」必須
      if(e.expectedRec!==undefined && typeof e.expectedRec!=='string') return false;
    }
    if(!(j.fl==null || (plainObj(j.fl) && typeof j.fl.flId==='string' && j.fl.flId && Array.isArray(j.fl.items)
      && j.fl.items.every(it=>plainObj(it) && (it.kind==='audio'||it.kind==='media')
        && typeof it.id==='string' && it.id
        && ((it.prevObs===undefined && it.prevFl===undefined)
          || (typeof it.prevObs==='string' && typeof it.prevFl==='string')))))) return false;
    if(!(j.ghost==null || (plainObj(j.ghost) && typeof j.ghost.key==='string' && KEYS.has(j.ghost.key)
      && typeof j.ghost.uuid==='string' && j.ghost.uuid
      && ((j.phase==='written') ? (typeof j.ghost.rec==='string')            // 現行形式は全文必須
                                 : (j.ghost.rec===undefined || typeof j.ghost.rec==='string'))))) return false;
    return true;
  }catch(e){ return false; }
}
function saveJournalSet(j){
  try{
    const txt=JSON.stringify(j);
    localStorage.setItem('bs_save_journal', txt);
    return localStorage.getItem('bs_save_journal')===txt;   // 読み直しまで確かめる
  }catch(e){ return false; }

let CUR_TX=null;   // いま進行中の取引の番号（控えの取り違え防止）
function saveJournalClear(tx){
  try{

    if(raw===null) return true;
    const t=(tx!==undefined)?tx:CUR_TX;
    if(t){

      if(!cur || cur.tx!==t) return false;   // 自分の取引の控えでなければ消さない
    }
    localStorage.removeItem('bs_save_journal');
    if(localStorage.getItem('bs_save_journal')!==null) return false;   // 消えたことまで確かめる
    // 取引が確定した（控えを消せた）ときに一度だけ自動バックアップを予約する
    _backupPending=true; _folderPending=true; backupConfirmPoint();
    return true;
  }catch(e){ return false; }

      toast('別のタブの書き込みを検知しています。そのタブを閉じてからお試しください', 6000); return;
    }
    const raw=localStorage.getItem('bs_save_journal');
    let qk=null;
    if(raw!=null){
      // 以前の隔離を上書きしない鍵（衝突したら枝番を足す）
      qk='bs_save_journal_quarantine_'+Date.now();
      let n=0;
      while(localStorage.getItem(qk)!==null && n<100){ n++; qk='bs_save_journal_quarantine_'+Date.now()+'_'+n; }
      if(localStorage.getItem(qk)!==null){ toast('隔離先の鍵を確保できませんでした'); return; }
      localStorage.setItem(qk, raw);
      if(localStorage.getItem(qk)!==raw){ toast('隔離の書き込みを確認できませんでした'); return; }
      // 一拍おいて、別のタブの書き込み通知を受け取ってから最終確認する
      await new Promise(r=>setTimeout(r,0));
      if(typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT){
        toast('別のタブの書き込みを検知しました。そのタブを閉じてからお試しください', 6000); return;   // 元鍵も隔離コピーも消さない
      }
      if(localStorage.getItem('bs_save_journal')!==raw || localStorage.getItem(qk)!==raw){
        toast('控えが書き換わっています。もう一度お試しください', 6000); return;   // 差し替え検知
      }
    }
    localStorage.removeItem('bs_save_journal');
    if(localStorage.getItem('bs_save_journal')!==null){ toast('控えを消せませんでした'); return; }
    if(qk!=null && localStorage.getItem(qk)!==raw){ toast('隔離コピーを確認できませんでした', 6000); return; }
    location.reload();
  }catch(e){ toast('隔離できませんでした（空き容量を確認してください）'); }
}
// 復旧用の基準配列: 競合で控えた相手の最新の姿があればそれを正本、無ければ厳格読み込み。
// 相手の姿が壊れていれば null（触らず停止）
// 仮記録の削除（全文照合つき）。'deleted'=消した / 'gone'=元から無い /
// 'changed'=別の書き手が正式な記録に変えている（消さない） / 'fail'=削除・確認に失敗
// 墓標を外し、外れたことまで確かめる（確かめられなければ false）
function untombVerified(uuidV){
  try{ DB._untomb(uuidV); }catch(e){}
  try{ return !tombstonesList().some(t=>t && (t===uuidV || t.uuid===uuidV)); }catch(e){ return false; }
}
function ghostDeleteVerified(key, uuidV, recJson){
  const arr=loadStrict(key);
  if(!arr) return 'fail';
  const cur=arr.find(x=>x&&x.uuid===uuidV);
  if(!cur) return 'gone';
  // 全文の控えが無い（旧形式）場合は、証明できないので消さない
  if(recJson==null) return 'changed';
  if(JSON.stringify(cur)!==recJson) return 'changed';
  DISCARDED.add(uuidV);
  if(!DB.hardDelete(key, uuidV)){
    // 失敗経路でも墓標が残っていないことを確かめる（hardDelete内の墓標戻しが失敗し得る）
    DISCARDED.delete(uuidV);
    return untombVerified(uuidV) ? 'fail' : 'fatal';
  }
  const a2=loadStrict(key);
  if(a2===null) return 'fatal';   // 消えたことを確認できない（読めない）＝墓標が付いたまま。致命停止へ
  const back=a2.find(x=>x&&x.uuid===uuidV);
  if(back){
    // 競合で同じ番号が再出現した。付けた墓標を外し、外れたことまで確かめる
    //（墓標が残ると、残した記録が後日の同期で消される）
    if(!untombVerified(uuidV)) return 'fatal';
    DISCARDED.delete(uuidV);
    return (JSON.stringify(back)!==recJson) ? 'changed' : 'fail';
  }
  return 'deleted';
}
// 復旧の書き戻しをキー単位でまとめて適用する。
// 1件ごとに基準を取り直すと、同じキーの後の保存が先の補償を上書きしてしまう。
// strict=true: 自分の書き込みと確かめられない姿があれば全体を失敗にする（writing段）
// strict=false: そうした姿は相手の更新として残す（written段の巻き戻し・合成）
function recoverApply(entries, strict){
  const byKey=new Map();
  entries.forEach(e=>{ if(!byKey.has(e.key)) byKey.set(e.key, []); byKey.get(e.key).push(e); });
  for(const kv of byKey){
    const key=kv[0], list=kv[1];
    const arr=recoverBase(key);
    if(!arr) return false;   // 読めない・相手の姿が壊れている＝触らない
    let changed=false;
    for(const e of list){
      const idx=arr.findIndex(x=>x&&x.uuid===e.uuid);
      const curJson= idx>=0 ? JSON.stringify(arr[idx]) : '';
      const prevJson= e.prev ? JSON.stringify(e.prev) : '';
      if((idx<0 && !e.prev) || (idx>=0 && e.prev && curJson===prevJson)) continue;   // すでに書く前の姿
      if((e.wroteRec && idx>=0 && curJson===e.wroteRec)
        || (e.expectedRec && idx>=0 && stableJson(arr[idx])===e.expectedRec)){
        if(e.prev) arr[idx]=e.prev; else arr.splice(idx,1);
        changed=true;
      } else if(strict){
        return false;   // 自分の控えと違う姿＝別の書き手かもしれない。触らず停止
      }
      // strict=false: 相手の姿のまま＝相手の更新が正。触らない
    }
    if(changed || Object.prototype.hasOwnProperty.call(GUARD_SNAP||{}, key)){
      if(!DB.save(key, arr)) return false;
      const a2=loadStrict(key);
      if(!a2 || JSON.stringify(a2)!==JSON.stringify(arr)) return false;   // 全文の再読込一致まで確認
    }
  }
  return true;
}
function recoverBase(key){
  try{
    if(typeof GUARD_SNAP!=='undefined' && Object.prototype.hasOwnProperty.call(GUARD_SNAP, key)){
      const v=JSON.parse(GUARD_SNAP[key]);
      return Array.isArray(v)?v:null;
    }
  }catch(e){ return null; }
  return loadStrict(key);
}
async function saveJournalRecover(){
  const raw=localStorage.getItem('bs_save_journal');
  if(raw===null){ return true; }   // ジャーナル無し＝復旧不要（不在は null だけ）
  let j=null;
  try{ j=JSON.parse(raw); }catch(e){}
  if(!saveJournalValid(j)){
    // 壊れた控えは消さない（何の取引だったかの唯一の手掛かり）。停止して点検を案内する
    try{ clearTimeout(_cloudTimer); }catch(e){}
    toast('保存の控えが壊れています。ページを再読み込みし、データ点検・修復画面で確認してください', 10000);
    return false;
  }
  window.RECOVERY_OK=true;   // 復旧専用の内部書き込み権限（WRITE_OK はまだ開放しない）
  if(typeof GUARD_CONFLICT!=='undefined'){ GUARD_CONFLICT=false; GUARD_SNAP={}; }   // この復旧の間の競合だけを見る
  if(typeof BACKUP_GEN!=='undefined') BACKUP_GEN++;
  try{
    // 先に対象の記録がすべて読めることを確かめる（読めない状態で書くと全記録を失う）
    {
      const keysNeeded=new Set(j.undo.map(e=>e.key));
      keysNeeded.add(DB.key.fl);
      if(j.ghost) keysNeeded.add(j.ghost.key);
      for(const kk of keysNeeded){
        if(!loadStrict(kk)){
          try{ clearTimeout(_cloudTimer); }catch(e){}
          toast('記録の読み込みに失敗したため、復旧を行えません。データ点検・修復画面で確認してください', 10000);
          return false;
        }
      }
    }
    if(j.phase==='writing'){
      // 書き込みの途中で終了した＝取引は確定していない。
      // 「自分が書いたと確かめられる記録」だけを書く前の姿へ戻す。
      // 姿が違う記録は別の書き手の正当な更新かもしれないので触らず、控えを残して停止する
      const normW=new Map();
      j.undo.forEach(e=>{ const k=e.key+'|'+e.uuid; if(!normW.has(k)) normW.set(k, e); });
      let okW=recoverApply(Array.from(normW.values()), true);
      await new Promise(r=>setTimeout(r,0));   // 別の書き手の書き込み通知（storage）を受け取る一拍
      if(okW && typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT){
        // 相手の書き込みが先に反映され、こちらの書き戻しが相手の更新を消したかもしれない。
        // 相手の最新の姿を正本に、自分の分だけをもう一度戻して合成し直す
        okW=false;
        const merged=recoverApply(Array.from(normW.values()), false);
        if(merged){
          GUARD_SNAP={}; GUARD_CONFLICT=false;
          await new Promise(r=>setTimeout(r,0));
          okW = !(typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT);   // 合成中にまた来たら停止
        }
      }
      if(okW && localStorage.getItem('bs_save_journal')!==raw) okW=false;   // 復旧中に控えが差し替わった
      if(okW){ if(!saveJournalClear(j.tx||null)) okW=false; }
      if(okW){ toast('前回の保存が途中で止まっていたため、書く前の状態に戻しました。内容を確認してください', 8000); }
      else { try{ clearTimeout(_cloudTimer); }catch(e){} }
      return okW;
    }
    const dbOf=k=>(k==='audio')?AudioDB:PhotoDB;
    const items=(j.fl && Array.isArray(j.fl.items))?j.fl.items:[];
    const didWork=items.length>0 || !!j.ghost;
    // （記録の種類×番号）ごとに「最初のprev」と「最後の控え」へ正規化する
    const norm=new Map();
    j.undo.forEach(e=>{ const k=e.key+'|'+e.uuid;
      if(!norm.has(k)) norm.set(k,{key:e.key,uuid:e.uuid,prev:e.prev,wroteRec:e.wroteRec});
      else norm.get(k).wroteRec=e.wroteRec; });
    const normArr=Array.from(norm.values());
    let readBad=false;
    const intact=normArr.every(e=>{
      const a=loadStrict(e.key);
      if(!a){ readBad=true; return false; }
      const cur=a.find(x=>x&&x.uuid===e.uuid);
      return !!cur && JSON.stringify(cur)===e.wroteRec;
    });
    if(readBad){
      try{ clearTimeout(_cloudTimer); }catch(e){}
      toast('記録の読み込みに失敗したため、復旧を行えません。データ点検・修復画面で確認してください', 10000);
      return false;
    }
    let ok=true;
    if(intact){
      // 記録は書いた直後の姿のまま → 完了処理をやり直す（何度やっても同じ結果になる操作だけ）
      for(const it of items){
        try{
          const r0=await ownerCas(it.kind, it.id, r=>{
            if(r.obs_uuid==='' && r.flight_uuid===j.fl.flId) return null;   // すでに付け替え済み
            // 「控えた前の持ち主」または（控えが無ければ）仮記録・持ち主なしからだけ付け替える。
            // それ以外は別の書き手が動かした添付＝奪わない
            const fromOk=(it.prevObs!==undefined)
              ? (r.obs_uuid===(it.prevObs||'') && (r.flight_uuid||'')===(it.prevFl||''))
              : ((r.flight_uuid||'')==='' && (r.obs_uuid==='' || r.obs_uuid===((j.ghost&&j.ghost.uuid)||'')));
            if(!fromOk) return false;
            return { obs_uuid:'', flight_uuid:j.fl.flId };
          });
          if(!r0.ok){ ok=false; continue; }
          const chk=await dbOf(it.kind).get(it.id);
          if(!chk || chk.obs_uuid!=='' || chk.flight_uuid!==j.fl.flId) ok=false;
        }catch(e){ ok=false; }
      }
      // 仮記録を消す直前に、全添付の持ち主をもう一度読み直して確かめる
      if(ok){
        for(const it of items){
          try{
            const rF=await dbOf(it.kind).get(it.id);
            if(!rF || rF.obs_uuid!=='' || rF.flight_uuid!==j.fl.flId){ ok=false; break; }
          }catch(e){ ok=false; break; }
        }
        if(!items.length){ /* 添付なしの取引 */ }
      }
      if(ok && typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT) ok=false;   // 仮記録を消す前に競合を確かめる（消してからでは戻せない）
      let ghostDeleted=false;
      if(ok && j.ghost){
        // 完了済みの生きた記録（undoに控えがある）は仮記録ではない。誤って消さない
        const isReal=normArr.some(e=>e.key===j.ghost.key && e.uuid===j.ghost.uuid);
        const gArr=recoverBase(j.ghost.key);
        if(!gArr){ ok=false; }
        else if(!isReal){
          const st=ghostDeleteVerified(j.ghost.key, j.ghost.uuid, j.ghost.rec);
          if(st==='deleted') ghostDeleted=true;
          else if(st!=='gone') ok=false;   // changed/fail/fatal: 消さず（または確認できず）停止
        }
      }
      await new Promise(r=>setTimeout(r,0));   // 別の書き手の書き込み通知（storage）を受け取る一拍
      if(ok && typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT){
        // 相手の最新の姿を正本に、仮記録の削除だけを再適用して合成し直す
        ok=false;
        let merged=true;
        if(ghostDeleted && j.ghost){
          const gArr2=recoverBase(j.ghost.key);
          if(!gArr2){ merged=false; }
          else {
            const gi=gArr2.findIndex(x=>x&&x.uuid===j.ghost.uuid);
            if(gi>=0){
              // 相手が正式な記録に変えていたら消さない（合成を諦めて停止）。
              // 先に付けた墓標も外す（残すと、残した正式記録が同期で消される）
              if(j.ghost.rec!==undefined && JSON.stringify(gArr2[gi])!==j.ghost.rec){
                merged=false;
                untombVerified(j.ghost.uuid);   // 外れたことまで確認（できなくても merged=false で停止済み）
              }
              else { gArr2.splice(gi,1);
                if(!DB.save(j.ghost.key, gArr2)) merged=false;
                else { const a2=loadStrict(j.ghost.key);
                  if(!a2 || JSON.stringify(a2)!==JSON.stringify(gArr2)) merged=false; }
              }
            }
          }
        }
        // 合成後の最終的な姿から、添付の持ち主が正しいか（飛翔が生きていて参照しているか）を確かめ直す
        if(merged && j.fl){
          const fl3=loadStrict(DB.key.fl);
          const flCur3=fl3?fl3.find(x=>x&&x.uuid===j.fl.flId && !x.deleted_at):null;
          if(!flCur3){ merged=false; }
          else {
            for(const it of items){
              try{
                const chk3=await dbOf(it.kind).get(it.id);
                if(!chk3 || chk3.obs_uuid!=='' || chk3.flight_uuid!==j.fl.flId){ merged=false; break; }
              }catch(e){ merged=false; break; }
            }
          }
        }
        if(merged){
          GUARD_SNAP={}; GUARD_CONFLICT=false;
          await new Promise(r=>setTimeout(r,0));
          ok = !(typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT);
        }
      }
      if(ok && localStorage.getItem('bs_save_journal')!==raw) ok=false;   // 復旧中に控えが差し替わった
      if(ok){ ok=saveJournalClear(j.tx||null); }
      if(ok){ if(didWork) toast('前回の保存の後片付けを完了しました'); }
    } else {
      // 記録が変わっている（別のタブの書き込みなど）。
      // 「最後の控えのまま」の記録だけ「最初のprev」へ戻す（キー単位でまとめて適用）
      if(!recoverApply(normArr, false)) ok=false;
      // 巻き戻しの後に生き残っている飛翔（競合版）を読み直し、
      // それが実際に参照する添付だけ持ち主を維持。それ以外は仮記録へ戻す
      let keepK=new Set(), keepBad=false;
      try{
        const flArr2=loadStrict(DB.key.fl);
        if(!flArr2){ keepBad=true; }
        else {
          const flCur=flArr2.find(x=>x&&x.uuid===((j.fl&&j.fl.flId)||'') && !x.deleted_at);
          if(flCur) keepK=new Set((flCur.audio||[]).filter(a=>a&&a.id).map(a=>'audio:'+a.id)
            .concat((flCur.media||[]).filter(m=>m&&m.id).map(m=>'media:'+m.id)));
        }
      }catch(e){ keepBad=true; }
      if(keepBad){
        // 参照を確かめられない状態では、添付の持ち主を一切変えない
        try{ clearTimeout(_cloudTimer); }catch(e){}
        toast('記録の読み込みに失敗したため、復旧を行えません。データ点検・修復画面で確認してください', 10000);
        return false;
      }
      for(const it of items){
        try{
          // 戻り先: 控えた前の持ち主（無い旧形式だけ仮記録へ）
          const toObs=(it.prevObs!==undefined)?(it.prevObs||''):((j.ghost&&j.ghost.uuid)||'');
          const toFl=(it.prevObs!==undefined)?(it.prevFl||''):'';
          const r0=await ownerCas(it.kind, it.id, r=>{
            if(keepK.has(it.kind+':'+it.id)){
              // 参照が生きている添付は持ち主もその飛翔でなければおかしい
              return (r.obs_uuid==='' && r.flight_uuid===j.fl.flId) ? null : false;
            }
            if(r.obs_uuid===toObs && (r.flight_uuid||'')===toFl) return null;   // すでに戻っている
            // 「今回の付け替え先（'', flId）」のままの場合だけ戻す。それ以外は別の書き手の姿＝触らない
            if(!(r.obs_uuid==='' && r.flight_uuid===((j.fl&&j.fl.flId)||''))) return false;
            return { obs_uuid:toObs, flight_uuid:toFl };
          });
          if(!r0.ok){ ok=false; continue; }
          const chk=await dbOf(it.kind).get(it.id);
          if(!chk) { ok=false; continue; }
          if(keepK.has(it.kind+':'+it.id)){
            if(chk.obs_uuid!=='' || chk.flight_uuid!==j.fl.flId) ok=false;
          } else if(chk.obs_uuid!==toObs || (chk.flight_uuid||'')!==toFl) ok=false;
        }catch(e){ ok=false; }
      }
      await new Promise(r=>setTimeout(r,0));   // 別の書き手の書き込み通知（storage）を受け取る一拍
      if(ok && typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT){
        // 相手の最新の姿を正本に、自分の分だけをもう一度戻して合成し直す
        ok=false;
        let merged=recoverApply(normArr, false);
        // 合成後の最終的な姿から、添付の持ち主が正しいかを照合し直す
        //（合成で飛翔の参照一覧が変わっていることがある）
        if(merged && j.fl){
          const fl4=loadStrict(DB.key.fl);
          if(!fl4){ merged=false; }
          else {
            const flCur4=fl4.find(x=>x&&x.uuid===j.fl.flId && !x.deleted_at);
            const keep4=new Set(flCur4?(flCur4.audio||[]).filter(a=>a&&a.id).map(a=>'audio:'+a.id)
              .concat((flCur4.media||[]).filter(m=>m&&m.id).map(m=>'media:'+m.id)):[]);
            for(const it of items){
              try{
                const chk4=await dbOf(it.kind).get(it.id);
                if(!chk4){ merged=false; break; }
                if(keep4.has(it.kind+':'+it.id)){
                  if(chk4.obs_uuid!=='' || chk4.flight_uuid!==j.fl.flId){ merged=false; break; }
                } else {
                  const toObs4=(it.prevObs!==undefined)?(it.prevObs||''):((j.ghost&&j.ghost.uuid)||'');
                  const toFl4=(it.prevObs!==undefined)?(it.prevFl||''):'';
                  if(chk4.obs_uuid!==toObs4 || (chk4.flight_uuid||'')!==toFl4){ merged=false; break; }
                }
              }catch(e){ merged=false; break; }
            }
          }
        }
        if(merged){
          GUARD_SNAP={}; GUARD_CONFLICT=false;
          await new Promise(r=>setTimeout(r,0));
          ok = !(typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT);
        }
      }
      if(ok && localStorage.getItem('bs_save_journal')!==raw) ok=false;   // 復旧中に控えが差し替わった
      if(ok){ ok=saveJournalClear(j.tx||null); }
      if(ok){ toast('前回の保存が完了していなかったため、途中の変更を戻しました。内容を確認してください', 8000); }
    }
    // 失敗したらジャーナルは残す（次回の起動でもう一度試せる）
    if(!ok){ try{ clearTimeout(_cloudTimer); }catch(e){} }   // 不完全な途中状態を自動バックアップしない
    return ok;
  } finally { window.RECOVERY_OK=false; }
}
// 保存の後処理中は、画面全体を覆って操作を止める（録音・写真・地図・入力が
// 後処理と重なると、保存済みの記録が存在しない実体を参照するなどの食い違いが生まれる）
function saveBusyShow(on){
  let el=document.getElementById('saveBusyOverlay');
  if(!on){
    if(el) el.remove();
    [...document.body.children].forEach(c=>{ try{ c.inert=false; }catch(e){} });
    try{ backupConfirmPoint(); }catch(e){}   // 取引の全終了経路（中止含む）でバックアップの保留を確認する
    return;
  }
  if(el) return;
  try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(e){}

  if(!paths.length && (segVal('fl_height') || segVals('fl_behavior'))){

    ? indKeyLbl

  rec.individual_key = indKey;   // 位置なしの記録に経路だけ足したときも同じ目印で結ぶ

  // 飛翔の「要確認」は、飛翔に残るもの（種名・個体数）と、利用者が自分で付けた印だけで決める。

  const flReview = (!name) || (!!name && !speciesByName(name)) || (indCount(rec.count)===0)

  const flRecs=[];

  const OBS_SHARED_F=['species_id','species_name_snapshot','count','age_class','sex',

  const obRecs=[];
  // 軸の経路から観察を作る場合、添付・メモは軸の経路が持つ（観察に写すと二重参照になる）
  if(anchorFlId){ rec.audio=[]; rec.media=[]; rec.note=''; }
  if(!pts.length && nObs>0){

    const PK=['perch_type','perch_size','perch_class','perch_species','perch_height','perch_artificial','perch_note'];
    if(SCREENS._hadP){

  else { const uClaimed = pts.some(sg=>sg.srcUuid===u); let assignedU=false; let sibMissing=false;
  // 編集中に足した新しいPの観察者位置は、開いた記録の古い位置ではなく、保存した今の測位を使う

  pts.forEach((sg,i)=>{

    const sibSrc = (editing && sg.srcUuid && sg.srcUuid!==u)

    const srcPerchRec=(editing && !sg.perchEdited)

      r2.perch_class = (pc.type==='木') ? (pc.cls||'') : '';
      r2.perch_species = (pc.type==='木') ? (pc.species||'') : '';
      r2.perch_height = (pc.type==='木') ? (pc.height||'') : '';

    if(sibSrc){ r2.observed_at = sibSrc.observed_at; }

    else if(!((editing || SCREENS._obsAtTouched) && r2===rec) && sg.time && okStamp(sg.time)) r2.observed_at = new Date(sg.time).toISOString();

    if(!SCREENS._bandTouched){

        r2.distance_band = srcR.distance_band || '';

        // 観察者の位置が取れていないときは、当てずっぽうの距離帯を入れずに空のままにする
        const band=(r2.latitude&&r2.longitude)
          ? distBandFrom(r2.latitude, r2.longitude, r2.target_latitude, r2.target_longitude) : '';
        r2.distance_band = band || '';

  if(sibMissing){

    return;

  if(anchorFlId){

    if(fr){
      fr.audio=(SCREENS._audio||[]).slice();
      fr.media=(SCREENS._media||[]).slice();

      fr.needs_review=!!($('#needsReview') && $('#needsReview').checked);

    }
  }
  // 飛翔だけの保存で写真・録音があれば、書き込む前に、その1本の経路の記録へ付ける。

  let flOwnerJobs=null;

  if(!obRecs.length && flRecs.length===1 && !anchorFlId){

    if((SCREENS._audio||[]).length) flTgt.audio=(SCREENS._audio||[]).slice();
    if((SCREENS._media||[]).length) flTgt.media=(SCREENS._media||[]).slice();
    // 実体の持ち主の控えの付け替え。実行は記録の書き込みが済んでから（下の完了処理で待つ）
    flOwnerJobs={ flId, items:[] };
    (SCREENS._audio||[]).forEach(a=>flOwnerJobs.items.push({db:AudioDB, kind:'audio', id:a.id}));
    (SCREENS._media||[]).forEach(m=>flOwnerJobs.items.push({db:PhotoDB, kind:'media', id:m.id}));
  }
  // 巻き戻しは「今回書いた記録」だけを対象にする。
  // 配列全体を控えて丸ごと戻すと、その間に別のタブで保存された記録まで消してしまう
  const undoLog=[];   // {key, uuid, prev（書く前の記録。無ければnull）, wrote（書いた直後のupdated_at）}
  let txJournal=null;   // 第1段ジャーナル（書き込みの進み具合を逐次控える）
  const writeOne=(key, rec, upsert, expect)=>{
    const arr0=loadStrict(key);
    if(!arr0) return false;   // 読めない状態で書くと全記録を失う
    const cur=arr0.find(x=>x&&x.uuid===rec.uuid);
    const prev=cur?JSON.parse(JSON.stringify(cur)):null;
    if(!expect){
      // 予定値（時刻印含む）を先に確定して控える。書いた後では
      // 「これは自分の書き込みだ」と復旧が証明できない
      rec.updated_at=nowISO();
      if(!cur && !rec.created_at) rec.created_at=nowISO();
      if(txJournal){
        const pe=txJournal.map.get(key+'|'+rec.uuid);
        if(pe){
          // 計画時から今までに入った他の正当な更新を失わないよう、
          // 「書く直前の姿」を戻り先として控え直す（この取引で未書き込みの場合だけ）
          if(!pe.wroteRec && !pe.expectedRec) pe.prev=prev;
          pe.expectedRec=stableJson(rec);
          if(!saveJournalSet(txJournal.j)) return false; }
      }
      const iS=arr0.findIndex(x=>x&&x.uuid===rec.uuid);
      if(iS<0) arr0.push(rec); else arr0[iS]=rec;
      if(!DB.save(key, arr0)) return false;
    } else {
      if(!upsert(rec)) return false;
    }
    const arr1=loadStrict(key);
    if(!arr1) return false;
    const now=arr1.find(x=>x&&x.uuid===rec.uuid);
    if(!now) return false;   // 書いたはずの記録が見つからない＝成功とは言えない
    // 書けたのが「自分の書こうとした値」であることを照合する。直後に別のタブが
    // 同じ番号を上書きした場合、その値を自分の控えとして採用してはならない
    const expOk = expect ? expect(now, prev) : (stableJson(now)===stableJson(rec));

    undoLog.push({key, uuid:rec.uuid, prev,

    if(txJournal){

      if(pe){ pe.wroteRec=JSON.stringify(now);
        if(!saveJournalSet(txJournal.j)) return false; }   // 進み具合を控えられなければ成功扱いにしない
    }
    return true;
  };
  const rollback = ()=>{
    let okAll=true;

    const norm=new Map();

          try{ const v=JSON.parse(GUARD_SNAP[e.key]); if(Array.isArray(v)) base=v; }catch(_){ }

      const idx=arr.findIndex(x=>x&&x.uuid===e.uuid);

        okAll=false;   // 別の書き手の更新が残っている＝「取り消した」とは言えない
      }
    }

    for(const e of restored){
      const a2=loadStrict(e.key);
      if(!a2){ okAll=false; continue; }

  // 今回書いた記録がすべて「書いた直後の姿のまま」残っているかを確かめる

  const undoStillOk=()=>{

      const last=new Map();
      undoLog.forEach(e2=>last.set(e2.key+'|'+e2.uuid, e2));

  const indMergeIds=new Set((indR && indR.mode==='merge') ? indR.fixObs.map(o=>o.uuid) : []);

  const nestWiping = !rec.nest_id;
  if(indKey && obRecs.length && nestTouched() && !(nestWiping && !SCREENS._hadNestAtOpen)){
    const mine=new Set(obRecs.map(r=>r.uuid));

    // このまとまりにある巣の目印。1つだけなら、目印の無い記録も同じ巣とみなす

    const liveGroup=snapObsLive.filter(o=>o.individual_key===indKey || indMergeIds.has(o.uuid));

    const ON=SCREENS._openNest||null;

    if(!myNid && ON){
      // 開いた巣が無印なら、「開いた巣と位置か内容が一致する目印」が1つに定まるときだけ、

      const gPos=new Map(), gFp=new Map();

      const cands=[...idsInGroup].filter(tid=>
        (nestPosValid(ON.pos) && (gPos.get(tid)||new Set()).has(ON.pos))
        || (gFp.get(tid)||new Set()).has(ON.fp));
      if(cands.length===1) myNid=cands[0];
    }

    // 別の巣（目印が違う・位置が違う）には手を出さない。
    // 目印の無い相手は「内容が完全に一致（写し）」または「同じ位置」だけを同じ巣とみなす。
    // 開いたとき巣が無く、この画面で初めて巣を付けた場合は、巣を何も持たない記録にだけ配る
    const nestSameRec=o=>{
      const oid=nestId(o);
      return oid ? (!!myNid && oid===myNid)
        : (ON ? (nestFpKey(o)===ON.fp
              || (nestPosValid(nestPosKey(o)) && nestPosKey(o)===ON.pos))
              : !nestHasInfo(o));
    };
    // まとめ読みで obRecs に入っている兄弟にも、同じ照合で巣を配る（合わなければその記録の巣のまま）
    obRecs.forEach(r2=>{
      if(r2===rec) return;
      const src=DB.observations().find(x=>x.uuid===r2.uuid) || r2;
      if(!nestSameRec(src)) return;
      NEST_F.forEach(k=>{ r2[k]=rec[k]||''; });
    });
    // ごみ箱の中の記録にも配る。配らないと、あとで復元したときに古い巣が戻ってくる
    all.forEach(o=>{
      if(!o || mine.has(o.uuid) || o.survey_uuid!==svUuid) return;
      if(indUnnameIds.has(o.uuid)) return;   // 名前を外す相手の巣には手を出さない
      if(o.individual_key!==indKey && !indMergeIds.has(o.uuid)) return;
      if(!nestSameRec(o)) return;
      const cp=Object.assign({}, o);
      // 相手の巣座標が壊れていたら、その記録自身に元の値を控えてから置き換える
      const a=coordStr(cp.nest_latitude), b=coordStr(cp.nest_longitude);
      if(!(a==='' && b==='') && !validLatLon(a,b)){
        cp.repair_note = repairNoteAdd(cp.repair_note, '巣の位置が不正だったため置き換えました（元の値: '+a+','+b+'）');
      }
      let diff=(cp.repair_note!==o.repair_note);
      // 統合される記録は、目印と名前もここでそろえる（あとで足すと巣・共有項目が反映されない）
      if(indMergeIds.has(o.uuid)){
        if(cp.individual_key!==indKey){ cp.individual_key=indKey; diff=true; }
        if(String(cp.individual_label||'')!==indLabel){ cp.individual_label=indLabel; diff=true; }
      }
      NEST_F.forEach(k=>{ const v=rec[k]||''; if(String(cp[k]||'')!==String(v)){ cp[k]=v; diff=true; } });
      // 生きている兄弟なら、共有項目もここでそろえる（ごみ箱の記録の中身までは変えない）
      if(!o.deleted_at) OBS_SHARED_F.forEach(k=>{ if(String(cp[k]??'')!==String(rec[k]??'')){ cp[k]=rec[k]; diff=true; } });
      if(diff) sibs.push(cp);
    });
  }
  // まとめる／名前を外す相手は、ここで一度だけ最新の姿を確かめる。
  // 見つけたときの写しのまま書き戻すと、その間に別のタブがした削除・復元・修正を消してしまう。
  // 以降の組み立ては、ここで確かめた最新版だけを基底にする
  if(indR){
    const nowObs=loadStrict(DB.key.ob), nowFl=loadStrict(DB.key.fl);
    if(!nowObs || !nowFl){
      toast('記録の読み込みに失敗したため、保存を中止しました。データ点検・修復画面で確認してください', 8000); return;
    }
    const moved=(was, now)=> !now
      || String(was.updated_at||'')!==String(now.updated_at||'')
      || String(was.deleted_at||'')!==String(now.deleted_at||'');
    let stale=false;
    const freshObs=[], freshFl=[];
    indR.fixObs.forEach(o=>{ const cur=nowObs.find(x=>x&&x.uuid===o.uuid);
      if(moved(o, cur)) stale=true; else freshObs.push(cur); });
    indR.fixFl.forEach(f=>{ const cur=nowFl.find(x=>x&&x.uuid===f.uuid);
      if(moved(f, cur)) stale=true; else freshFl.push(cur); });
    if(stale){
      toast('まとめる相手の記録が別の端末・タブで変わりました。画面を開き直してから保存してください', 8000); return;
    }
    indR.fixObs=freshObs; indR.fixFl=freshFl;
  }
  // 個体名でまとめる相手には、新しい記録からの保存でも共有項目をそろえる
  //（目印と名前だけ移して、種名・個体数・齢などが食い違うのを防ぐ）
  if(indMergeIds.size){
    const mineM=new Set(obRecs.map(r=>r.uuid).concat(sibs.map(r=>r.uuid)));
    snapObsLive.forEach(o2=>{
      if(mineM.has(o2.uuid) || !indMergeIds.has(o2.uuid)) return;
      const cp=Object.assign({}, o2, { individual_key:indKey, individual_label:indLabel });
      OBS_SHARED_F.forEach(k=>{ cp[k]=rec[k]; });
      sibs.push(cp);
    });
  }
  // 巣の照合に入らなかった「生きている兄弟」（位置なしで画面に載らない記録など）にも共有項目をそろえる
  if(editing && indKey){
    const mine=new Set(obRecs.map(r=>r.uuid).concat(sibs.map(r=>r.uuid)));
    snapObsLive.forEach(o2=>{
      if(mine.has(o2.uuid) || indUnnameIds.has(o2.uuid)) return;   // 名前を外す相手の中身には手を出さない
      if(o2.individual_key!==indKey && !indMergeIds.has(o2.uuid)) return;
      const cp=Object.assign({}, o2);
      let diff=false;
      // 統合される記録は目印と名前もそろえる
      if(indMergeIds.has(o2.uuid)){
        if(cp.individual_key!==indKey){ cp.individual_key=indKey; diff=true; }
        if(String(cp.individual_label||'')!==indLabel){ cp.individual_label=indLabel; diff=true; }
      }
      OBS_SHARED_F.forEach(k=>{ if(String(cp[k]??'')!==String(rec[k]??'')){ cp[k]=rec[k]; diff=true; } });
      if(diff) sibs.push(cp);
    });
  }
  // ここからは一続きの保存。書き終えて検証するまで、新しい操作は覆いで止める
  SAVE_BUSY=true; saveBusyShow(true);
  if(typeof GUARD_CONFLICT!=='undefined'){ GUARD_CONFLICT=false; GUARD_SNAP={}; }   // この保存の間の競合だけを見る
  if(typeof BACKUP_GEN!=='undefined'){ BACKUP_GEN++; _backupPending=true; _folderPending=true; }   // 作成中のバックアップを無効化し、確定点で予約し直す
  const saveAbort=()=>{ SAVE_BUSY=false; saveBusyShow(false); };
  // 仮記録（ghost）の全文はこの時点（自分の書き込みだけが済んでいる状態）で固定する。
  // 記録を書き終えた後に読み直すと、その間に別のタブが正式化した記録を
  // 「消してよい仮記録」として控えてしまう
  let ghostRecFixed;
  if(!obRecs.length && SCREENS._ghost){
    const gA=loadStrict(SCREENS._ghost.key);
    if(!gA){
      toast('記録の読み込みに失敗したため、保存を中止しました。データ点検・修復画面で確認してください', 8000);
      SAVE_BUSY=false; saveBusyShow(false); return;
    }
    const gC=gA.find(x=>x&&x.uuid===SCREENS._ghost.uuid);
    if(!gC){
      // 仮記録が見つからない＝この取引で消してよい対象を証明できない。開始しない
      toast('保存の準備に失敗しました（仮記録を確認できません）。もう一度お試しください', 8000);
      SAVE_BUSY=false; saveBusyShow(false); return;
    }
    ghostRecFixed=JSON.stringify(gC);
  }
  // 個体名でまとめた分の書き直し（同じ名前の記録を、決めた目印へ揃える）。
  // 同じ保存の取引の中で書くので、途中で失敗すればまとめて元へ戻る。
  // 書き戻すのは「いま読み直した最新の姿」に必要な項目だけを載せたもの。
  // 見つけたときの写しをそのまま書くと、その間に別のタブがした削除・復元・修正を消してしまう
  // 名前を外す相手は、他の伝播から外してあるので、ここで「名前だけ」を消す
  if(indUnnameIds.size){
    const mineU=new Set(obRecs.map(r=>r.uuid).concat(sibs.map(r=>r.uuid)));
    indR.fixObs.forEach(o=>{
      if(mineU.has(o.uuid)) return;
      sibs.push(Object.assign({}, o, { individual_label:'' }));
    });
  }
  // 上で最新版を確かめてあるので、ここでは組み立てるだけ（二重に書かないものは飛ばす）
  const indFixFl=[];
  if(indR && indR.mode==='merge'){
    indR.fixObs.forEach(o=>{
      if(obRecs.some(r=>r.uuid===o.uuid) || sibs.some(r=>r.uuid===o.uuid)) return;
      sibs.push(Object.assign({}, o, { individual_key:indKey, individual_label:indLabel }));
    });
  }
  if(indR){
    indR.fixFl.forEach(f=>{
      if(flRecs.some(r=>r.uuid===f.uuid)) return;
      indFixFl.push(indR.mode==='unname'
        ? Object.assign({}, f, { individual_label:'' })
        : Object.assign({}, f, { individual_key:indKey, individual_label:indLabel }));
    });
  }
  // 取引の第1段: これから書く全記録（削除対象も含む）の「書く前の姿」を先に控える。
  // 各記録を書くたびに「書いた直後の控え」も書き足す（writeOne 内）。
  // 途中で終了しても、起動時に「自分が書いた分だけ」を安全に元へ戻せる
  {
    const plannedMap=new Map();
    let planBad=false;
    const addPlan=(key,uuid)=>{ if(!uuid) return;
      const k=key+'|'+uuid;
      if(plannedMap.has(k)) return;
      const arr=loadStrict(key);
      if(!arr){ planBad=true; return; }
      const cur=arr.find(x=>x&&x.uuid===uuid);
      plannedMap.set(k, {key, uuid, prev: cur?JSON.parse(JSON.stringify(cur)):null, wroteRec:''}); };
    flRecs.forEach(fr=>addPlan(DB.key.fl, fr.uuid));
    indFixFl.forEach(fr=>addPlan(DB.key.fl, fr.uuid));
    obRecs.forEach(r2=>addPlan(DB.key.ob, r2.uuid));
    sibs.forEach(sb=>addPlan(DB.key.ob, sb.uuid));
    if(editing || (SCREENS._loadedFl||[]).length || (SCREENS._loadedObs||[]).length){
      const keptObsP=new Set(pts.map(sg=>sg.srcUuid).filter(Boolean));
      (SCREENS._loadedObs||[]).forEach(id=>{ if(!keptObsP.has(id)) addPlan(DB.key.ob, id); });
      const keptFlP=new Set(PF_SEGS.filter(sg=>sg.t==='F' && sg.srcUuid).map(sg=>sg.srcUuid));
      (SCREENS._loadedFl||[]).forEach(id=>{ if(!keptFlP.has(id)) addPlan(DB.key.fl, id); });
    }
    if(planBad){
      toast('記録の読み込みに失敗したため、保存を中止しました。データ点検・修復画面で確認してください', 8000);
      saveAbort(); return;
    }
    const j0={ t: nowISO(), tx: uuid(), phase:'writing', undo: Array.from(plannedMap.values()), fl:null, ghost:null };
    CUR_TX=j0.tx;
    if(!saveJournalSet(j0)){
      toast('空き容量が足りず、保存を開始できませんでした。空き容量を確保してからやり直してください', 8000);
      saveAbort(); return;
    }
    txJournal={ j: j0, map: plannedMap };
  }
  const saveHalt=()=>saveFatalHalt();
  // 取り消しの共通処理。控え（ジャーナル）を消し、消えたことまで確かめてから操作を再開する。
  // 控えが残ったまま再開すると、別経路の正当な更新を次回起動の復旧が古い姿へ戻してしまう
  const saveCancel=(msg)=>{
    if(rollback() && saveJournalClear()){
      saveAbort(); if(msg) toast(msg, 8000);
    } else saveHalt();
  };
  // 書き込み直前の生存再確認（入口確認からここまでの間に別の書き手が消していないか）。
  // 消えた対象へ書くと、削除の取り消しや新しい番号での復活＝取り違いになる
  {
    let goneLate=false;
    if(editing && !DB.observations().some(x=>x&&x.uuid===u)) goneLate=true;
    if(!goneLate && SCREENS._flAnchorUuid && !DB.flights().some(f=>f.uuid===SCREENS._flAnchorUuid)) goneLate=true;
    if(!goneLate) PF_SEGS.forEach(sg=>{
      if(sg.t==='F' && sg.srcUuid && !DB.flights().some(f=>f.uuid===sg.srcUuid)) goneLate=true;
      if(sg.t==='P' && sg.srcUuid && !DB.observations().some(o2=>o2&&o2.uuid===sg.srcUuid)) goneLate=true;
    });
    if(goneLate){
      saveJournalClear();
      saveAbort();
      toast('読み込んだ記録が別の端末・タブで削除されています。画面を開き直してから保存してください', 7000);
      return;
    }
  }
  for(const fr of flRecs){ if(!writeOne(DB.key.fl, fr, r=>DB.upsertFlight(r))){ saveCancel(); return; } }
  for(const fr of indFixFl){ if(!writeOne(DB.key.fl, fr, r=>DB.upsertFlight(r))){ saveCancel(); return; } }
  for(const r2 of obRecs){ if(!writeOne(DB.key.ob, r2, r=>DB.upsertObs(r))){ saveCancel(); return; } }
  for(const sb of sibs){ if(!writeOne(DB.key.ob, sb, r=>DB.upsertObs(r))){ saveCancel(); return; } }
  // まとめ読みした記録のうち、画面の一覧で「✕ 消す」されたものは削除する（明示的に消したものだけ）。
  // 経路のカードから開いた（editingでない）場合も、読み込んだ経路は同じ扱い
  if(editing || (SCREENS._loadedFl||[]).length || (SCREENS._loadedObs||[]).length){
    const keptObs=new Set(pts.map(sg=>sg.srcUuid).filter(Boolean));
    for(const id of (SCREENS._loadedObs||[])){
      if(keptObs.has(id)) continue;
      // P を消しても記録そのものは消さない（開いた記録と同じ扱い）。
      // 位置と、位置に付く情報（止まり木・距離帯）だけを外す。
      // 記録ごと消すのは記録の削除ボタンの仕事（メモ・添付まで一緒に消えるため）
      const sib0=DB.observations().find(x=>x.uuid===id);
      if(!sib0) continue;
      const cp=Object.assign({}, sib0, { target_latitude:'', target_longitude:'',
        perch_type:'', perch_size:'', perch_class:'', perch_species:'', perch_height:'',
        perch_artificial:'', perch_note:'' });
      cp.distance_band='';   // 距離帯は位置に付く情報。位置を外したら必ず外す
      if(!writeOne(DB.key.ob, cp, r=>DB.upsertObs(r))){ saveCancel(); return; }
    }
    const keptFl=new Set(PF_SEGS.filter(sg=>sg.t==='F' && sg.srcUuid).map(sg=>sg.srcUuid));
    for(const id of (SCREENS._loadedFl||[])){
      if(keptFl.has(id)) continue;
      {
        // 削除も「削除印を付けた全文」を予定値として、通常の厳格書き込みで行う
        const delArr=loadStrict(DB.key.fl);
        if(!delArr){ saveCancel(); return; }
        const delCur=delArr.find(x=>x&&x.uuid===id);
        if(delCur){
          const cpDel=Object.assign({}, JSON.parse(JSON.stringify(delCur)), { deleted_at: nowISO() });
          if(!writeOne(DB.key.fl, cpDel)){ saveCancel(); return; }
        }
      }
    }
  }
  PF_NEST_ID = resolvedNestId;   // 保存が成功したので、決めた目印を画面の状態にも反映する

  // 完了処理は非同期に進むため、途中でアプリが終了しても復旧できるように控えを残す。
  // 仮記録（ghost）は「観察を作らない＝本当に消す」場合だけ載せる。
  // 観察を作る保存では仮記録が完成した観察そのものになるため、載せると復旧が誤って消す
  const writtenJ={ t: nowISO(), tx: (txJournal&&txJournal.j&&txJournal.j.tx)||undefined, phase:'written', undo: undoLog,
    fl: flOwnerJobs ? { flId: flOwnerJobs.flId, items: flOwnerJobs.items.map(it=>({kind:it.kind, id:it.id})) } : null,
    ghost: (!obRecs.length && SCREENS._ghost) ? { key: SCREENS._ghost.key, uuid: SCREENS._ghost.uuid,
      rec: ghostRecFixed } : null };   // 取引開始時に固定した全文（DBから再取得しない）
  if(!saveJournalSet(writtenJ)){
    // 復旧の控えを残せない状態で後処理へ進まない（途中終了すると回収できなくなる）
    saveCancel('空き容量が足りず、保存を安全に完了できませんでした。空き容量を確保してからやり直してください');
    return;
  }

  // ここから先（仮記録の削除・掃除・成功表示・画面遷移）は finalize にまとめ、
  // 一度イベントループへ制御を返してから実行する。別のタブの書き込みは storage
  // イベントとして次のタスクで届くため、同期のまま完了扱いにすると取りこぼす
  const finalize=()=>{

  if(!obRecs.length){
    const finish=()=>{
      // 観察を作らないので、写真・録音の都合で作られた仮記録を片付ける。
      // 片付けに失敗したら false を返す（巻き戻すかは呼び出し側が決める——
      // 添付の付け替えを先に戻さないと、実体が消えた飛翔を指したままになる）
      // 仮記録を消す前に、競合と記録の生存をもう一度確かめる（消してからでは戻せない）
      if((typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT) || !undoStillOk()) return false;
      const gh=SCREENS._ghost;
      if(gh){
        const st=ghostDeleteVerified(gh.key, gh.uuid, (writtenJ&&writtenJ.ghost)?writtenJ.ghost.rec:undefined);
        if(st==='fatal'){ saveFatalHalt('仮記録の片付けを確認できませんでした。'); return true; }   // 補償へ進まず停止（控えは残る）
        if(st==='changed' || st==='fail') return false;   // 相手の正式な記録は消さない／確認できなければ補償へ
        SCREENS._ghost=null; mediaGcAll().catch(function(){});
      }
      // 仮記録を消した後は巻き戻さない（添付の持ち主が消えた記録を指してしまう）。
      // 控えを消せなければ完成した状態のまま停止し、次回起動の復旧に確定させてもらう
      if(!saveJournalClear()){ saveFatalHalt('保存の控えを片付けられませんでした。'); return true; }
      if(name) DB.pushRecent(name);
      SCREENS._chosenId=null; SCREENS._audio=null; SCREENS._media=null;
      SCREENS._dirty=false; SCREENS._ghost=null;
      PF_SEGS=[]; PF_NEWLINE=true;
      toast(flRecs.length ? ('飛翔経路を'+flRecs.length+'本保存しました') : '経路を削除しました');
      // 複数個体: 飛翔だけの保存でも画面に留まる
      if(typeof birdAfterSave==='function' && (cont==='addBird' || (BIRDS.length>1 && cont!==true))){
        const flU0=((flRecs[0]&&flRecs[0].uuid) || anchorFlId || null);   // 今回書けた生存の経路を優先
        if(birdAfterSave(null, cont==='addBird', flU0)) return true;
      }
      if(cont===true){ goBack(); nav('obsEdit', JSON.stringify({sv:svUuid})); } else goBack();
      return true;
    };
    if(flOwnerJobs && flOwnerJobs.items.length){
      // 付け替えは1件ずつ行い、途中で失敗したら付け替え済みの分を「戻せたことを確かめながら」全部戻す。
      // 全部戻せたときだけ記録も巻き戻す（戻せないのに記録だけ消すと、実体が宙に浮く）。
      // 終わるまで保存・離脱は SAVE_BUSY で止め、画面遷移は解除後に行う
      SAVE_BUSY=true; saveBusyShow(true);
      (async ()=>{
        try{
        const doneUndo=[];
        // 付け替え済みの分を戻す。1件ずつ書いて読み直し、戻ったことを確かめる
        const restoreOwners=async (keepKeys)=>{
          let allOk=true;
          for(const u2 of doneUndo.slice().reverse()){
            if(keepKeys && keepKeys.has(u2.kind+':'+u2.id)){
              // 生存記録が参照している添付は持ち主を変えない。ただし持ち主が
              // 本当にその飛翔になっていることを読み直して確かめる
              try{
                const rk=await u2.db.get(u2.id);
                if(!rk || rk.obs_uuid!=='' || rk.flight_uuid!==flOwnerJobs.flId) allOk=false;
              }catch(_){ allOk=false; }
              continue;
            }
            try{
              const casR=await ownerCas(u2.kind, u2.id, r=>{
                if(r.obs_uuid===u2.prev.obs_uuid && r.flight_uuid===u2.prev.flight_uuid) return null;   // すでに元の持ち主
                if(!(r.obs_uuid==='' && r.flight_uuid===flOwnerJobs.flId)) return false;   // 別の書き手が動かした＝触らない
                return { obs_uuid:u2.prev.obs_uuid, flight_uuid:u2.prev.flight_uuid };
              });
              if(!casR.ok){ allOk=false; continue; }
              const chk=await u2.db.get(u2.id);
              if(!chk || chk.obs_uuid!==u2.prev.obs_uuid || chk.flight_uuid!==u2.prev.flight_uuid) allOk=false;
            }catch(_){ allOk=false; }
          }
          return allOk;
        };
        let swapped=false;
        try{
          for(const j of flOwnerJobs.items){
            const r=await j.db.get(j.id);
            // 実体が見つからない＝参照だけの添付になる。成功扱いにせず止める
            if(!r) throw new Error('missing media entity: '+j.id);
            const prev={obs_uuid:r.obs_uuid, flight_uuid:r.flight_uuid};
            // 想定内の持ち主（仮記録・持ち主なし）でなければ付け替えない
            {
              const ghostU=(SCREENS._ghost&&SCREENS._ghost.uuid)||'';
              if((prev.flight_uuid||'')!=='' || !(prev.obs_uuid==='' || prev.obs_uuid===ghostU || prev.obs_uuid===((SCREENS._obs&&SCREENS._obs.uuid)||'')))
                throw new Error('unexpected owner: '+j.id);
            }
            // 前の持ち主を控えへ書き足してから付け替える（復旧が同じ判断をできるように）
            const peJ=(writtenJ.fl&&writtenJ.fl.items||[]).find(x=>x.kind===j.kind && x.id===j.id);
            if(peJ){ peJ.prevObs=prev.obs_uuid||''; peJ.prevFl=prev.flight_uuid||'';
              if(!saveJournalSet(writtenJ)) throw new Error('journal update failed'); }
            // 読取→判定→更新を1つのトランザクションで（間に別の書き手が入れないように）。
            // 想定内の持ち主（仮記録・持ち主なし）からだけ付け替え、
            // すでに付け替え済み（自分の飛翔所有）はこの取引の仕事ではない＝競合として止める
            const casR=await ownerCas(j.kind, j.id, rr=>{
              // 控えに書いた「前の持ち主」と完全に一致する場合だけ付け替える。
              // 読取（prev取得）とこの取引の間に別の書き手が動かしていたら奪わない
              if(rr.obs_uuid!==prev.obs_uuid || (rr.flight_uuid||'')!==(prev.flight_uuid||'')) return false;
              return { obs_uuid:'', flight_uuid:flOwnerJobs.flId };
            });
            if(!casR.ok) throw new Error('unexpected owner: '+j.id);
            // 実際に変更した添付だけを戻し名簿へ入れる
            doneUndo.push({db:j.db, kind:j.kind, id:j.id, prev});
            // 付け替わったことを読み直して確かめる（書けたつもりで進まない）
            const chkO=await j.db.get(j.id);
            if(!chkO || chkO.obs_uuid!=='' || chkO.flight_uuid!==flOwnerJobs.flId)
              throw new Error('owner verify failed: '+j.id);
          }
          swapped=true;
        }catch(e){
          if(await restoreOwners() && rollback() && saveJournalClear()){
            SAVE_BUSY=false;
            toast('写真・録音の付け替えに失敗しました。もう一度保存してください', 6000);
          }
          else {
            // 戻せなかった。この画面での保存・離脱を止めたまま、再読み込みで仕切り直してもらう
            //（このまま再保存すると、同じ添付を別の記録が参照する二重状態になる）
            toast('付け替えを完全に戻せませんでした。ページを再読み込みし、データ点検・修復画面で確認してください', 10000);
          }
        }
        if(swapped && ((typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT) || !undoStillOk())){
          // 付け替えの間に別の書き手（旧版タブなど）を検知した。
          // 先に「記録側」の補償（巻き戻し）を行い、そのあとで補償後も生き残っている
          // 飛翔を読み直して、それが実際に参照する添付だけを飛翔所有のまま維持する。
          //（維持を先に決めると、直後の巻き戻しで飛翔が消え、持ち主だけが残る）
          const undone=rollback();
          let keepKeys=null, keepBad2=false;
          try{
            const flArrK=loadStrict(DB.key.fl);
            if(!flArrK){ keepBad2=true; }
            else {
              const flCur=flArrK.find(x=>x&&x.uuid===flOwnerJobs.flId && !x.deleted_at);
              if(flCur) keepKeys=new Set(
                (flCur.audio||[]).filter(a=>a&&a.id).map(a=>'audio:'+a.id)
                .concat((flCur.media||[]).filter(m=>m&&m.id).map(m=>'media:'+m.id)));
            }
          }catch(_){ keepBad2=true; }
          if(!keepBad2 && await restoreOwners(keepKeys) && undone && saveJournalClear()){
            SAVE_BUSY=false;
            toast('別のタブによる書き換えを検知したため、この保存を取り消しました。内容を確認してから保存し直してください', 9000);
          }
          else {
            // SAVE_BUSY を維持したまま finally で読み直し案内に切り替わる
            toast('取り消しを完全には行えませんでした。ページを再読み込みし、データ点検・修復画面で確認してください', 10000);
          }
        }
        else if(swapped){
          // 仮記録を消す直前に、全添付の持ち主をもう一度読み直して確かめる
          let ownersOk=true;
          for(const j2 of flOwnerJobs.items){
            try{
              const r2=await j2.db.get(j2.id);
              if(!r2 || r2.obs_uuid!=='' || r2.flight_uuid!==flOwnerJobs.flId){ ownersOk=false; break; }
            }catch(_){ ownersOk=false; break; }
          }
          if(!ownersOk){
            if(await restoreOwners() && rollback() && saveJournalClear()){
              SAVE_BUSY=false;
              toast('写真・録音の付け替えを確認できなかったため、この保存を取り消しました。もう一度保存してください', 8000);
            } else {
              toast('付け替えを完全に戻せませんでした。ページを再読み込みし、データ点検・修復画面で確認してください', 10000);
            }
          }
          else {
          SAVE_BUSY=false;
          if(finish()===false){
            // 仮記録を片付けられなかった。補償が終わるまで保存・離脱を再び止める
            SAVE_BUSY=true;
            if(await restoreOwners() && rollback() && saveJournalClear()){
              SAVE_BUSY=false;
              toast('保存をやり直してください（空き容量を確認してください）', 6000);
            }
            else {
              toast('片付けに失敗しました。ページを再読み込みし、データ点検・修復画面で確認してください', 10000);
            }
          }
          }
        }
        } finally {
          if(!SAVE_BUSY) saveBusyShow(false);
          else saveFatalHalt('保存の後片付けに失敗しました。');   // 共通の停止（書き込みの門も閉じる）
        }
      })();
    } else { if(finish()===false){ if(!(rollback() && saveJournalClear())) saveHalt(); } }
    return;
  }
  if(!saveJournalClear()){ saveFatalHalt('保存の控えを片付けられませんでした。'); return; }
  SAVE_BUSY=false; saveBusyShow(false); backupConfirmPoint();
  PF_SEGS=[]; PF_NEWLINE=true;
  { const nSaved=obRecs.length+flRecs.length;
    if(nSaved>1) toast('記録を'+nSaved+'件（観察'+obRecs.length+'・経路'+flRecs.length+'）保存しました', 3000); }
  if(name) DB.pushRecent(name);
  const keep={ lat:rec.latitude, lon:rec.longitude, acc:rec.gps_accuracy };   // 「続けて」用に、保存した位置と精度をそのまま引き継ぐ
  SCREENS._acc=null; SCREENS._chosenId=null; SCREENS._audio=null; SCREENS._media=null;
  SCREENS._dirty=false; SCREENS._ghost=null;   // 保存済みなので離脱ガード対象から外す
  if(reasons.length) toast((rec.needs_review?'保存しました ⚠ 要確認を付けました: ':'保存しました（⚠ ')+reasons.join('・')+(rec.needs_review?'':'）'), 4000);
  else toast('保存しました');
  // 複数個体: 保存後は画面に留まり、この個体を「保存済み」として読み直す
  if(typeof birdAfterSave==='function' && (cont==='addBird' || (BIRDS.length>1 && !cont))){
    if(birdAfterSave(rec.uuid, cont==='addBird', null)) return;
  }
  if(cont==='flight'){
    // 同じ鳥の飛翔経路へ。目印を付けておくと、集計で二重に数えられない
    goBack();
    nav('flightEdit', JSON.stringify({sv:svUuid, keep:{
      species_id:rec.species_id, species_name:rec.species_name_snapshot, count:rec.count,
      age_class:rec.age_class, individual_key:rec.individual_key,
      individual_label:rec.individual_label||'' }}));
  }
  else if(cont){ goBack(); nav('obsEdit', JSON.stringify({sv:svUuid, keep})); } // 位置を引き継いで次の種へ
  else goBack();
  };
  (async ()=>{
    await new Promise(r=>setTimeout(r,0));   // storage イベントが届くのを一拍待つ
    // 検証はフラグに頼らず毎回行う（イベントの届く順序は書き込みの反映順と一致するとは限らない）
    if((typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT) || !undoStillOk()){
      // 別の書き手を検知したら、自分の記録が無事に見えても完了扱いにしない
      //（後勝ち保存の配列では、自分の書き込みが相手の更新を上書きした可能性がある）
      saveCancel('別のタブによる書き換えを検知したため、この保存を取り消しました。内容を確認してから保存し直してください');
      return;
    }
    SAVE_BUSY=false; saveBusyShow(false);
    finalize();
  })();
}

function addObsToGuide(){

// 図鑑の切り抜き画像を取り込む（ファイル名＝和名で種に紐付け・端末内のみ）
function importGuideImages(input){
  const files=Array.from(input.files||[]); input.value=''; if(!files.length) return;
  toast('図鑑画像を取り込み中…');
  const adds=[];
  const jobs=files.map(f=>{
    const name=(f.name||'').replace(/\.[^.]+$/,'').replace(/[\s_]*[（(]?\d+[）)]?\s*$/,'').trim();
    const kind=(f.type||'').startsWith('video')?'video':'photo';
    const ext=fileExt(f.name,f.type), mid=uuid();
    return PhotoDB.put({ id:mid, kind, mime:f.type||'', ext, size:f.size, name:f.name||'', obs_uuid:'', created_at:nowISO(), blob:f })
      .then(()=>{ adds.push({ id:uuid(), species_name:name, kind, ref_id:mid, ext, mime:f.type||'', size:f.size, source:'guide', created_at:nowISO() }); });
  });
  Promise.all(jobs).then(()=>{
    let l=myguideList().concat(adds);
    // 図鑑取り込みは種ごとに最新1枚だけ残す（再取り込みで更新）
    const seen={}; const keep=[];
    for(let i=l.length-1;i>=0;i--){ const g=l[i];
      if(g.source==='guide'){ if(seen[g.species_name]) continue; seen[g.species_name]=1; }
      keep.unshift(g);
    }
    myguideSave(keep); mediaGcAll(); scheduleFolderFull();
    const matched=adds.filter(a=>speciesByName(a.species_name)).length;
    toast(`図鑑画像 ${adds.length}枚を取り込みました（和名一致 ${matched}種）`); render();
  }).catch(()=>toast('取り込みに失敗しました'));
}
// 無圧縮(格納)ZIPを解く。ローカルファイルヘッダを順に読む（このアプリで配る図鑑ZIPは無圧縮・UTF-8名で作る）
function parseStoredZip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf); const dec=new TextDecoder('utf-8');
  const entries=[]; let i=0;
  while(i+30<=u8.length){
    if(dv.getUint32(i,true)!==0x04034b50) break;   // ローカルヘッダ以外（中央ディレクトリ等）に来たら終了
    const method=dv.getUint16(i+8,true);
    const compSize=dv.getUint32(i+18,true);
    const nameLen=dv.getUint16(i+26,true), extraLen=dv.getUint16(i+28,true);
    const name=dec.decode(u8.subarray(i+30, i+30+nameLen));
    const dataStart=i+30+nameLen+extraLen;
    if(method===0 && !name.endsWith('/')) entries.push({ name, data:u8.subarray(dataStart, dataStart+compSize) });
    i=dataStart+compSize;
  }
  return entries;
}
// 種図鑑ZIP（和名.png を多数まとめたもの）を1ファイルで一括取り込み。端末内のみ保存・公開URLには出さない
async function importGuideZip(input){
  const f=(input.files||[])[0]; input.value=''; if(!f) return;
  if(!/\.zip$/i.test(f.name||'')){ toast('ZIPファイルを選んでください'); return; }
  toast('図鑑ZIPを読み込み中…（初回は少し時間がかかります）');
  let buf; try{ buf=await f.arrayBuffer(); }catch(e){ toast('ファイルを読めませんでした'); return; }
  let entries=[]; try{ entries=parseStoredZip(buf); }catch(e){ entries=[]; }
  const imgs=entries.filter(e=>/\.(png|jpe?g|webp|gif)$/i.test(e.name));
  if(!imgs.length){ toast('ZIP内に画像が見つかりません（無圧縮ZIPをお使いください）'); return; }
  const adds=[]; let done=0;
  for(const e of imgs){
    const base=e.name.replace(/^.*\//,'');
    const name=base.replace(/\.[^.]+$/,'').replace(/[\s_]*[（(]?\d+[）)]?\s*$/,'').trim();
    const ext=((base.match(/\.([a-z0-9]+)$/i)||[])[1]||'png').toLowerCase();
    const mime=ext==='png'?'image/png':(/^jpe?g$/.test(ext)?'image/jpeg':(ext==='webp'?'image/webp':'image/'+ext));
    const blob=new Blob([e.data],{type:mime}); const mid=uuid();
    try{ await PhotoDB.put({ id:mid, kind:'photo', mime, ext, size:blob.size, name:base, obs_uuid:'', created_at:nowISO(), blob });
      adds.push({ id:uuid(), species_name:name, kind:'photo', ref_id:mid, ext, mime, size:blob.size, source:'guide', created_at:nowISO() });
    }catch(err){}
    if(++done%20===0) toast(`取り込み中… ${done}/${imgs.length}`);
  }
  // 種ごとに最新1枚だけ残す（再取り込みで更新）
  let l=myguideList().concat(adds); const seen={}; const keep=[];
  for(let i=l.length-1;i>=0;i--){ const g=l[i];
    if(g.source==='guide'){ if(seen[g.species_name]) continue; seen[g.species_name]=1; }
    keep.unshift(g); }
  myguideSave(keep); scheduleFolderFull();
  const matched=adds.filter(a=>speciesByName(a.species_name)).length;
  toast(`図鑑ZIP：${adds.length}種を取り込みました（和名一致 ${matched}種）`); render();
}

function batchAdd(){
  const inp=$('#batchSp'), cnt=$('#batchCnt');
  const name=((inp&&inp.value)||'').trim(); if(!name){ toast('種名を入れてください'); return; }
  if(cnt && cnt.validity && cnt.validity.badInput){ toast('個体数は数値で入力してください'); return; }
  // 「||1」で補完すると 0 が黙って 1 に化けるため、空欄の補完と数値検査を分ける
  const rawB=(cnt&&cnt.value||'').trim();
  const count = rawB==='' ? 1 : Number(rawB);
  if(!Number.isInteger(count) || count<1){ toast('個体数は1以上の整数で入力してください'); return; }
  SCREENS._batchItems=SCREENS._batchItems||[]; SCREENS._batchItems.push({name, count});
  if(inp) inp.value=''; if(cnt) cnt.value='1'; renderBatchList(); if(inp) inp.focus();
}
function batchRemove(i){ (SCREENS._batchItems||[]).splice(i,1); renderBatchList(); }
function renderBatchList(){
  const box=$('#batchList'); if(!box) return; const items=SCREENS._batchItems||[];
  // マスタ外の種名は追加時点で⚠を見せる（保存後に気付くより、その場で打ち直せる方が早い。保存自体は止めない）
  box.innerHTML = items.length ? items.map((it,i)=>`<div class="card"><div class="row">
    <div class="grow"><b>${esc(it.name)}</b> <span class="muted small">${esc(it.count)}個体</span>
      ${speciesByName(it.name)?'':'<span class="small" style="color:var(--warn)">⚠ マスタにない種名（要確認が付きます）</span>'}</div>
    <button type="button" class="btn ghost danger" style="width:auto; padding:4px 10px;" onclick="batchRemove(${i})">×</button></div></div>`).join('')
    : '<div class="empty small">まだ追加されていません。上で種名と個体数を入れて「＋ この種を追加」。</div>';

/* ---------- 録音 ---------- */
let REC = null; // 録音中コンテキスト { mr, stream, t0, chunks, timer, abort }
function recSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function pickRecMime(){
  const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac','audio/ogg'];
  for(const m of c){ try{ if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}
function mimeExt(m){ m=m||''; if(m.includes('webm'))return 'webm'; if(m.includes('mp4'))return 'm4a';
  if(m.includes('aac'))return 'aac'; if(m.includes('ogg'))return 'ogg'; return 'bin'; }
function fmtDur(s){ s=Math.max(0,Math.round(+s||0)); const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; }

let _recStarting=false;   // マイク許可待ち中の連打・並行開始を防ぐ（複数の録音が走ると停止できないものが残る）
async function recToggle(){
  if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY){ toast('保存の処理中です。少し待ってください'); return; }
  if(REC){ recStop(); return; }
  if(_recStarting) return;
  if(!recSupported()){ toast('この端末では録音を利用できません（httpsで開いてください）'); return; }
  const targetAtCall=mediaTarget();   // 呼び出し時点の対象を固定（許可待ち中に画面が変わったら開始しない）
  const genAtCall=_navGen;            // 呼び出し時点の画面世代（_mediaCtxが残っていても画面が変わっていれば開始しない）
  _recStarting=true;
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ _recStarting=false; toast('マイクを使えません（許可を確認してください）'); return; }
  // 許可待ちの間に別の録音が始まった／画面が変わった／対象が変わった場合は開始しない
  //（停止ボタンの無い画面で録音が始まるのを防ぐ。プライバシー保護のため世代照合は必須）
  const now=mediaTarget();
  if(REC || genAtCall!==_navGen || now.kind!==targetAtCall.kind || now.uuid!==targetAtCall.uuid){
    stream.getTracks().forEach(t=>t.stop()); _recStarting=false; return; }
  const mime=pickRecMime();
  let mr;
  try{ mr=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); }
  catch(e){ stream.getTracks().forEach(t=>t.stop()); _recStarting=false; toast('録音を開始できませんでした'); return; }
  const ctx={ mr, stream, t0:Date.now(), chunks:[], timer:null, abort:false,
    target:targetAtCall };
  // 未保存の新規記録なら、保存完了を待たずこの時点で離脱ガード対象にする（写真の取り込みと同じ扱い）
  if((ctx.target.kind==='obs' && SCREENS._obsEditing===false && SCREENS._obs && SCREENS._obs.uuid===ctx.target.uuid) ||
     (ctx.target.kind==='flight' && SCREENS._flightEditing===false && SCREENS._flightSelf===ctx.target.uuid)){
    SCREENS._dirty=true;
    SCREENS._ghost={ key:(ctx.target.kind==='flight'?DB.key.fl:DB.key.ob), uuid:ctx.target.uuid };
  }
  mr.ondataavailable=e=>{ if(e.data && e.data.size) ctx.chunks.push(e.data); };
  mr.onstop=()=>{ clearInterval(ctx.timer); stream.getTracks().forEach(t=>t.stop());
    const wasAbort=ctx.abort; REC=null; renderRecPanel();
    let fin=null;
    if(!wasAbort){
      AUDIO_PENDING++;
      // 呼び出しごと Promise の中に入れる。直接呼んで .finally を付ける形だと、
      // Promise が返る前の同期処理（Blob生成など）で例外が出たときに数が戻らず、
      // 「保存中」のまま固まって操作できなくなる（2026-08-05 監査 Major）
      fin = Promise.resolve()
        .then(()=>recFinalize(ctx.chunks, mr.mimeType||mime, ctx.t0, ctx.target))
        .finally(()=>{ AUDIO_PENDING=Math.max(0, AUDIO_PENDING-1); });
    }
    if(typeof quickRecEnded==='function') quickRecEnded(wasAbort, fin); };   // すぐ録音の後始末（通常録音では何もしない）
  REC=ctx; _recStarting=false;
  try{ mr.start(); }
  catch(e){ REC=null; stream.getTracks().forEach(t=>t.stop()); toast('録音を開始できませんでした'); return; }
  ctx.timer=setInterval(updateRecTimer,250); renderRecPanel();
}
function recStop(){ if(REC){ clearInterval(REC.timer); try{ REC.mr.stop(); }catch(e){} } }
function recAbort(){ if(REC){ REC.abort=true; clearInterval(REC.timer); try{ REC.mr.stop(); }catch(e){} } }
function updateRecTimer(){ const el=$('#recTime'); if(el && REC) el.textContent=fmtDur((Date.now()-REC.t0)/1000); }

function recFinalize(chunks, mime, t0, targetAtStart){
  const dur=Math.round((Date.now()-t0)/1000);
  const blob=new Blob(chunks,{type:mime}); if(!blob.size){ toast('録音が空でした'); return Promise.resolve(false); }
  const meta={ id:uuid(), dur, size:blob.size, mime, ext:mimeExt(mime), created_at:nowISO() };
  const target=targetAtStart||mediaTarget();   // 録音開始時点の対象（引数）を優先
  if(target.uuid && DISCARDED.has(target.uuid)){ return Promise.resolve(false); }   // 破棄済みの記録の分は保存しない
  const owner = target.kind==='flight' ? { flight_uuid:target.uuid, obs_uuid:'' } : { obs_uuid:target.uuid };
  // 成否をPromiseで返す（すぐ録音が「保存できてから」成功表示・一覧更新するため）
  return AudioDB.put(Object.assign({}, meta, { blob }, owner)).then(()=>{
    if(!attachMediaMeta(target,'audio',meta)){   // 紐付け失敗（容量不足等）を成功扱いにしない
      toast('録音の保存に失敗しました（空き容量を確認してください）'); return false; }
    scheduleFolderFull(); toast('録音を保存しました'); return true;
  }).catch(()=>{ toast('録音の保存に失敗しました'); return false; });
}
function delAudio(id){
  if(!writeAllowed()) return;
  if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY){ toast('保存の処理中です。少し待ってください'); return; }
  const target=mediaTarget();
  // 参照を先に外す（実体を先に消すと、参照の保存に失敗したとき「開けない添付」が残る）
  if(!detachMediaMeta(target,'audio',id)){ toast('削除できませんでした（空き容量を確認してください）'); return; }
  // 実体は直接消さない。同じ実体をマイ図鑑などが参照していることがあるため、
  // 「どこからも参照されていないものだけ消す」掃除に任せる
  AudioDB.gc().catch(()=>{}).then(()=>scheduleFolderFull());
  toast('この記録から録音を外しました');

// メディアの持ち主（観察 or 飛翔）。飛翔画面では SCREENS._mediaCtx を設定する
function mediaCtx(){ return SCREENS._mediaCtx || { kind:'obs', uuid:(SCREENS._obs&&SCREENS._obs.uuid)||'', sv:(SCREENS._obs&&SCREENS._obs.survey_uuid)||currentSurveyUuid }; }
function mediaTarget(){ const c=mediaCtx(); return { kind:c.kind, uuid:c.uuid, sv:c.sv||currentSurveyUuid }; }
// 対象レコード(target)へメディアmetaを追記。保存済みならDBへ直接反映し、
// 現在画面が同じ対象の時だけ編集中配列とパネルを更新する（別記録への誤添付・誤表示を防ぐ）
function attachMediaMeta(target, field, meta){
  if(target.uuid && DISCARDED.has(target.uuid)) return false;   // ユーザーが破棄した新規記録には、後から完了した保存分も付けない
  let ok=true;   // 記録への紐付け保存の成否を返す（失敗を成功表示すると、音声・写真が一覧から参照できなくなるため）
  if(target.uuid){ const recKey=target.kind==='flight'?DB.key.fl:DB.key.ob;
    const list=DB.load(recKey); const i=list.findIndex(x=>x.uuid===target.uuid);
    if(i>=0){ list[i][field]=(list[i][field]||[]).concat([meta]);
      ok = target.kind==='flight' ? DB.upsertFlight(list[i]) : DB.upsertObs(list[i]); }
    else{
      // まだ保存されていない新規記録。参照を失わないよう、この場で仮保存する（後で本保存が上書き）
      const sv=target.sv||currentSurveyUuid;
      if(target.kind==='flight') ok=DB.upsertFlight({ uuid:target.uuid, survey_uuid:sv, path:[], species_name_snapshot:'',
        start_time:'', end_time:'', height_class:'不明', age_class:'不明', individual_label:'', behavior:'', count:1, memo:'', needs_review:false, audio:[], media:[], [field]:[meta] });
      else ok=DB.upsertObs({ uuid:target.uuid, survey_uuid:sv, observed_at:nowISO(), latitude:'', longitude:'',
        species_id:'', species_name_snapshot:'', count:1, detection_method:'', behavior:'', habitat:'',
        identification_status:'未同定', confidence:'中', needs_review:false, note:'', external_photo_reference:'', audio:[], media:[], [field]:[meta] });
    } }
  // 仮記録（ghost）への書き込みが成功したら、その全文を控える。
  // 破棄はこの控えと完全一致する場合だけ行う（別の書き手が正式化した記録を仮記録と誤認して消さない）
  if(ok && SCREENS._ghost && SCREENS._ghost.uuid===target.uuid){
    try{
      const gA=loadStrict(SCREENS._ghost.key);
      const gC=gA?gA.find(x=>x&&x.uuid===target.uuid):null;
      if(gC) SCREENS._ghost.rec=JSON.stringify(gC);
    }catch(e){}
  }
  // 複数羽トレースの退避済みトラックに遅れてメディアが完成した場合、トラック側にも反映する
  //（反映しないと一括保存が空のメディア配列で仮レコードを上書きし、参照を失う）
  if(ok && target.kind==='flight' && SCREENS._ftracks){
    const ftr=SCREENS._ftracks.find(t=>t&&t.uuid===target.uuid);
    if(ftr && ftr.fields) ftr.fields[field]=(ftr.fields[field]||[]).concat([meta]);
  }
  const cur=mediaCtx();
  if(ok && cur.kind===target.kind && cur.uuid===target.uuid){
    // 「未保存の新規記録」への追加だけを離脱ガード対象にする（既存記録へのメディアは即DB保存済み＝離脱しても消えないため）
    const isNew = target.kind==='flight' ? (SCREENS._flightEditing===false && SCREENS._flightSelf===target.uuid)
                                         : (SCREENS._obsEditing===false && SCREENS._obs && SCREENS._obs.uuid===target.uuid);
    if(isNew){ SCREENS._dirty=true;
      SCREENS._ghost={ key:(target.kind==='flight'?DB.key.fl:DB.key.ob), uuid:target.uuid }; }
    if(field==='audio'){ SCREENS._audio=(SCREENS._audio||[]).concat([meta]); renderRecPanel(); }
    else { SCREENS._media=(SCREENS._media||[]).concat([meta]); renderMediaPanel(); } }
  return ok;
}
function detachMediaMeta(target, field, id){
  // 保存の成否を返す（失敗を成功扱いにすると、参照が画面からだけ消えて実体が掃除で失われる）
  let saved=true;
  if(target.uuid){ const recKey=target.kind==='flight'?DB.key.fl:DB.key.ob;
    const list=DB.load(recKey); const i=list.findIndex(x=>x.uuid===target.uuid);
    if(i>=0){ list[i][field]=(list[i][field]||[]).filter(x=>x.id!==id);
      saved = target.kind==='flight' ? !!DB.upsertFlight(list[i]) : !!DB.upsertObs(list[i]);
      if(!saved) return false; } }
  const cur=mediaCtx();
  if(cur.kind===target.kind && cur.uuid===target.uuid){
    if(field==='audio'){ SCREENS._audio=(SCREENS._audio||[]).filter(x=>x.id!==id); renderRecPanel(); }
    else { SCREENS._media=(SCREENS._media||[]).filter(x=>x.id!==id); renderMediaPanel(); } }
  return saved;
}
// パネル再構築や画面遷移の前に、割り当て済みのObject URLをまとめて解放する（メモリリーク防止）
function revokePanelUrls(root, selector){ if(!root) return;

function renderRecPanel(){

  box.innerHTML=`
    <button type="button" class="btn ${active?'danger':''}" onclick="recToggle()">
      ${active?'<span class="recdot"></span>録音を停止 <span id="recTime">0:00</span>':'🎤 録音する'}</button>
    ${list.length?`<div class="reclist">${list.map((a,i)=>`
      <div class="recitem" data-id="${a.id}">

          <button type="button" class="btn danger" style="width:auto; padding:6px 12px;" onclick="delAudio('${a.id}')">削除</button></div>
        <audio controls preload="none" class="recaudio"></audio>
      </div>`).join('')}</div>`:''}`;
  // 各プレーヤーにIndexedDBの音声を割り当て（取得完了までに再描画・画面遷移していたら割り当てない）
  const gen=++_recGen;
  list.forEach(a=>{ AudioDB.get(a.id).then(r=>{ if(!r||!r.blob) return;
    if(gen!==_recGen) return;
    const el=box.querySelector(`.recitem[data-id="${a.id}"] audio`); if(!el||!el.isConnected) return;
    if(el._url) URL.revokeObjectURL(el._url);
    el._url=URL.createObjectURL(r.blob); el.src=el._url;
  }).catch(()=>{}); });
}

/* ---------- 写真・動画（カメラ／ライブラリ） ---------- */
function fileExt(name, mime){
  const m=String(name||'').match(/\.([a-z0-9]{1,5})$/i); if(m) return m[1].toLowerCase();
  mime=mime||''; const map={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic',
    'image/heif':'heif','image/gif':'gif','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm','video/3gpp':'3gp'};
  return map[mime] || (mime.startsWith('video')?'mp4':'jpg');
}
// 写真・動画の取り込みが進行中の本数。取り込み中に記録の種類を変えると、
// 遅れて完了した分の持ち主が居なくなるため、その間は切り替え・保存を止める
let MEDIA_PENDING=0;
function mediaBusy(){ return MEDIA_PENDING>0; }
function pickMedia(input){
  if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY){ toast('保存の処理中です。少し待ってください'); input.value=''; return; }
  const files=Array.from(input.files||[]); input.value='';
  if(!files.length) return;
  const target=mediaTarget();   // 取り込み開始時点の対象を固定
  // 未保存の新規記録なら、保存完了を待たずこの時点でガード対象にする（完了前に離脱してもすり抜けない）
  if((target.kind==='obs' && SCREENS._obsEditing===false && SCREENS._obs && SCREENS._obs.uuid===target.uuid) ||
     (target.kind==='flight' && SCREENS._flightEditing===false && SCREENS._flightSelf===target.uuid)){
    SCREENS._dirty=true;
    SCREENS._ghost={ key:(target.kind==='flight'?DB.key.fl:DB.key.ob), uuid:target.uuid };
  }
  const owner = target.kind==='flight' ? { flight_uuid:target.uuid, obs_uuid:'' } : { obs_uuid:target.uuid };
  toast('取り込み中…');
  let ok=0, fail=0;
  const jobs=files.map(f=>{
    const kind=(f.type||'').startsWith('video')?'video':'photo';
    const meta={ id:uuid(), kind, mime:f.type||'', ext:fileExt(f.name,f.type), size:f.size, name:f.name||'', created_at:nowISO() };
    // 1件ずつ、成功したものだけ確実に反映（1件失敗しても成功分は残る）
    return PhotoDB.put(Object.assign({}, meta, { blob:f }, owner))
      .then(()=>{ if(attachMediaMeta(target,'media',meta)) ok++; else fail++; })   // 紐付け失敗も失敗として数える
      .catch(()=>{ fail++; });
  });
  MEDIA_PENDING++;
  Promise.all(jobs).then(()=>{
    MEDIA_PENDING=Math.max(0, MEDIA_PENDING-1);
    if(DISCARDED.has(target.uuid)){ mediaGcAll().catch(()=>{}); return; }   // 取り込み中に破棄された→結果は捨てて実体も掃除
    scheduleFolderFull();
    if(fail) toast(`写真・動画：${ok}件追加・${fail}件失敗`); else toast('写真・動画を追加しました'); });
}
function delMedia(id){

  const target=mediaTarget();
  if(!detachMediaMeta(target,'media',id)){ toast('削除できませんでした（空き容量を確認してください）'); return; }
  PhotoDB.gc().catch(()=>{}).then(()=>scheduleFolderFull());
  toast('この記録から外しました');
}

          : '<img class="mediael" alt="写真">'}</div>
        <button type="button" class="mediadel" onclick="delMedia('${m.id}')">×</button>
        <div class="tiny muted mediacap">${m.kind==='video'?'🎬 動画':'📷 写真'} ・ ${Math.max(1,Math.round(m.size/1024))}KB</div>
      </div>`).join('')}</div>`:''}`;
  const gen=++_mediaGen;
  list.forEach(m=>{ PhotoDB.get(m.id).then(r=>{ if(!r||!r.blob) return;
    if(gen!==_mediaGen) return;
    const el=box.querySelector(`.mediaitem[data-id="${m.id}"] .mediael`); if(!el||!el.isConnected) return;
    if(el._url) URL.revokeObjectURL(el._url); el._url=URL.createObjectURL(r.blob); el.src=el._url;
  }).catch(()=>{}); });
}
