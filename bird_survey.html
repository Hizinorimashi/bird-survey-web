    html:`<div id="map"></div>
      <div class="sp"></div>
      <div class="note">丸＝観察地点 / ?＝未同定 / △＝要確認 / ◆赤＝鳥がいた場所 / 巣＝巣の位置 / ノート＝メモ / 色つき曲線＝飛翔経路（向きは<b>矢印</b>。左下のボタンで始まり・終わりの印も出せます）。左下の凡例で線の色分けを 種／齢／個体 に切り替えられます。青丸＝現在地（開くと自動で表示範囲に含めます）。右上の📍で現在地へ。右上の重ねアイコンで、背景（標準／淡色／航空写真）を選び、さらに「陰影」「傾斜」を重ねられます。選択は次回も保持。</div>`,
    onMount:()=>{ _mapTimer=setTimeout(()=>drawMap(obs,notes,flights,targets,route,nests),50); }
  };
};
function drawMap(obs,notes,flights,targets,route,nests){
  const el=$('#map'); if(!el) return;
  let center=[35.68,139.77], zoom=13;
  const pts=obs.filter(o=>validLatLon(o.latitude,o.longitude));
  if(pts.length){ center=[parseFloat(pts[0].latitude), parseFloat(pts[0].longitude)]; zoom=15; }
  else if(lastFix){ center=[lastFix.lat,lastFix.lon]; zoom=15; }
  mapObj=createBaseMap('map', center, zoom, {overlays:true});
  const mk=(lat,lon,html,color)=>L.marker([lat,lon],{icon:L.divIcon({className:'',
    html:`<div style="background:${color};border:2px solid #fff;border-radius:50%;width:22px;height:22px;
      display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;
      box-shadow:0 1px 4px rgba(0,0,0,.5)">${html}</div>`, iconSize:[22,22], iconAnchor:[11,11]})});
  const group=[];
  pts.forEach(o=>{ const lat=parseFloat(o.latitude), lon=parseFloat(o.longitude);
    let sym='●', col='#3fb984';
    if(o.needs_review){ sym='▲'; col='#e0a030'; }
    else if(o.identification_status==='未同定'||!o.species_name_snapshot){ sym='?'; col='#8a9a93'; }
    const m=mk(lat,lon,sym,col).addTo(mapObj);
    m.bindPopup(`<b>${esc(o.species_name_snapshot||'（未同定）')}</b><br>${esc(indCount(o.count))}個体 ・ ${esc(o.detection_method||'')}<br>${fmtTime(o.observed_at)}`);
    group.push([lat,lon]);
  });
  notes.forEach(n=>{ const lat=parseFloat(n.latitude), lon=parseFloat(n.longitude);
    const m=mk(lat,lon,'✎','#5a7de0').addTo(mapObj);
    m.bindPopup(`<b>メモ:${esc(n.category||'')}</b><br>${esc((n.content||'').slice(0,80))}`); group.push([lat,lon]); });
  // 鳥がいた場所を赤の◆で表示
  (targets||[]).forEach(o=>{ const lat=parseFloat(o.target_latitude), lon=parseFloat(o.target_longitude);
    const m=mk(lat,lon,'◆','#b03030').addTo(mapObj);
    const perch=[o.perch_type,o.perch_size,o.perch_class,o.perch_artificial,o.perch_species,
      o.perch_height?('樹高'+o.perch_height+'m'):'',o.perch_note].filter(Boolean).join('・');
    m.bindPopup(`<b>${esc(o.species_name_snapshot||'（未同定）')}</b> 鳥がいた場所${perch?'<br>止まっていたもの:'+esc(perch):''}`);
    group.push([lat,lon]); });
  // 巣の位置は別に出す（止まった場所とは限らないため）
  (nests||[]).forEach(o=>{ const lat=parseFloat(o.nest_latitude), lon=parseFloat(o.nest_longitude);
    const m=mk(lat,lon,'巣','#8a6fd0').addTo(mapObj);
    m.bindPopup(`<b>${esc(o.species_name_snapshot||'（未同定）')}</b> 巣の位置<br>${esc(o.nest_state||'')}${o.nest_tree_species?'<br>樹種:'+esc(o.nest_tree_species)+(o.nest_tree_height?'（'+esc(o.nest_tree_height)+'m）':''):''}`);
    group.push([lat,lon]); });
  // 調査ルート（青い線）
  const rp=(route||[]).filter(validPathPt);
  if(rp.length>1){ L.polyline(rp,{color:'#2f6fd0',weight:4,opacity:.8}).addTo(mapObj).bindPopup('調査ルート 約'+fmtDist(pathLength(rp)));
    rp.forEach(p=>group.push(p)); }
  // 飛翔経路（滑らかな曲線＋始点/終点。色は種／齢／個体で切替）
  const fMode=flightColorMode();
  // 値ごとに固定の色番号（初回登場順・保存）を使う。別種が同色になったり、分類追加で色がずれるのを防ぐ
  const fKeys=[...new Set((flights||[]).map(f=>flightColorKey(f,fMode)))];
  const colorOf={}; fKeys.forEach(k=>colorOf[k]=FLIGHT_PALETTE[flightColorIndex(fMode,k)%FLIGHT_PALETTE.length]);
  const legend={};   // 凡例用：値→色
  // 表示切り替え: トレースが混んできたら始終マーカーを消して線だけにできる。向きは等間隔の細い矢印で補える
  const endsOn=flightEndsOn(), arrowsOn=flightArrowsOn();
  // 歩行の**線**が1本でもあるか。あるときだけ、飛翔を点線にして歩行と分ける。
  // 面は数えない（面に「歩行」が付いていても、線の描き方は変えない）。
  // 数えると、QGIS（線の層だけを見る）と食い違う
  const hasWalk=(flights||[]).some(x=>!isArea(x) && traceDrawable(x) && lineKind(x)===LINE_WALK);
  (flights||[]).forEach(f=>{ const path=(f.path||[]).filter(validPathPt);
    const area=isArea(f);
    if(path.length < minPointsFor(shapeOf(f))) return;
    const col=colorOf[flightColorKey(f,fMode)]; legend[flightColorKey(f,fMode)]=col;
    const m=traceMetric(f);
    const head=`<b>${area?'⬠':'🛩'} ${esc(f.species_name_snapshot||'（未同定）')}</b>${f.age_class&&ageNorm(f.age_class)!=='不明'?' ・ '+esc(ageNorm(f.age_class)):''}${f.individual_label?' ・ '+esc(f.individual_label):''}`;
    if(area){
      // 面は閉じて描く。**塗らない・滑らかにしない・始終の印と矢印は出さない**。
      // 報告書の結果図に合わせる（面は輪郭だけ・色は種ごと。2026-08-12 に6業務の図で確認）。
      // 旋回上昇だけは ◎（内側にもう1本の輪）にする——凡例で他と区別されている記号
      // 旋回上昇は ◎（きれいな二重丸）。**囲った形は薄い点線で残す**
      //（データベースの地図・編集の地図と同じ見え方にそろえる）。
      // それ以外は囲った形のまま輪郭だけ
      let pg;
      if(isSoaring(f)){
        pg=drawSoar(mapObj, path, {color:col, interactive:true});
        if(pg) L.polygon(path,{color:col,weight:1,opacity:.35,fill:false,
          dashArray:'4,4',interactive:false}).addTo(mapObj);
        // 前後の飛翔経路と線で結ぶ（飛んできて・旋回して・飛び去る、のひと続き）
        soarJoinsForRecords(flights||[], (flights||[]).indexOf(f)).forEach(j=>{
          L.polyline(j,{color:col,weight:3,opacity:.85,interactive:false}).addTo(mapObj);
          if(arrowsOn){
            const mid=[(j[0][0]+j[1][0])/2, (j[0][1]+j[1][1])/2];
            L.marker(mid,{icon:flightArrowIcon(bearingDeg(j[0],j[1]),col),
              interactive:false, rotateWithView:true}).addTo(mapObj);
          }
        });
      } else {
        pg=L.polygon(path,{color:col,weight:2.5,opacity:.95,fill:false}).addTo(mapObj);
      }
      if(pg) pg.bindPopup(`${head}<br>${esc(f.area_type||'面')} ・ 面積 約${m.text}<br>${esc(indCount(f.count))}個体<br>${esc(f.behavior||'')}<br>${fmtTime(f.start_time)}`);
    } else {
      const disp=smoothPath(path);   // 線・矢印とも表示用の滑らか経路に載せる（ズレると矢印が線から浮く）
      soarSpotsOf(f).forEach(sp=>drawSoarSpot(mapObj, sp, col));   // 線の途中の◎
      const kind=lineKind(f);
      // 同じ図に歩行があるときだけ、飛翔を点線にして分ける（タンチョウの図の流儀）。
      // 常に点線にすると、猛禽だけの図（飛翔が実線）と食い違う
      const dashed = hasWalk && kind!==LINE_WALK;
      const pl=L.polyline(disp,{color:col,weight:4,opacity:.85,
        dashArray: dashed?'7,5':null}).addTo(mapObj);
      pl.bindPopup(`${head}<br>${esc(indCount(f.count))}個体 ・ ${esc(f.height_class||'')}<br>${esc(f.behavior||'')}<br>${fmtTime(f.start_time)}`);
      // 攻撃は →×→（線の中ほどに ×）。**長さの半分の位置**に置く。
      // 点の番号の真ん中だと、点が片側に密集した経路で端に寄る（QGISとも食い違う）
      if(kind===LINE_ATTACK && disp.length>1){
        const mid=pointAtHalf(disp);
        if(mid) L.marker(mid,{icon:attackIcon(col), interactive:false}).addTo(mapObj);
      }
      // 威嚇行動はギザギザ（線の中ほど）。攻撃の × と同じ置き方
      if(kind===LINE_THREAT && disp.length>1){
        const mid=pointAtHalf(disp);
        if(mid) L.marker(mid,{icon:threatIcon(bearingAtHalf(disp), col),
          interactive:false, rotateWithView:true}).addTo(mapObj);
      }
      if(endsOn){
        const badge=(txt,bg)=>L.divIcon({className:'',html:`<div style="background:${bg};border:2px solid #fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5)">${txt}</div>`,iconSize:[20,20],iconAnchor:[10,10]});
        L.marker(path[0],{icon:badge('始','#3fb984')}).addTo(mapObj);
        // 急降下は終わりに ↠ を置くので、「終」の印は重ねない（記号が隠れる）
        if(!(arrowsOn && kind===LINE_DIVE))
          L.marker(path[path.length-1],{icon:badge('終','#d05555')}).addTo(mapObj);
      }
      // 急降下（ハンティング）の ↠ は**終わりに1つだけ**。報告書の凡例と同じ
      //（途中に何度も出すと、飛翔経路の矢印と見分けがつかない）
      if(arrowsOn && isDive(f) && disp.length>1){
        const end=disp[disp.length-1], b=bearingDeg(disp[disp.length-2], end);
        L.marker(end,{icon:flightArrowIcon(b,col,true), interactive:false, rotateWithView:true}).addTo(mapObj);
      } else if(arrowsOn){ flightArrowPts(disp).forEach(a=>
        // rotateWithView: 地図を回転させたとき矢印も地面に追随させる（leaflet-rotate。未対応環境では無視される）
        L.marker(a.p,{icon:flightArrowIcon(a.b,col), interactive:false, rotateWithView:true}).addTo(mapObj)); }
    }
    path.forEach(p=>group.push(p));
  });
  if(Object.keys(legend).length) addFlightLegend(legend, fMode);
  mapCurMarker=null; mapCurCircle=null;
  if(lastFix){ addCurrentPos(lastFix.lat,lastFix.lon,lastFix.acc); }
  if(group.length>1){ try{ mapObj.fitBounds(group,{padding:[40,40], maxZoom:FIT_MAX_ZOOM}); }catch(e){} }
  else if(group.length===1 && !lastFix){ mapObj.setView(group[0],15); }
  addLocateControl();   // 右上に「現在地へ」ボタンを設置
  locateOnMap(group);   // 現在地を取得し、自動で表示範囲に含める
}
// 飛翔経路の表示切り替え（始終マーカー／向き矢印）。設定は端末に記憶。
// **既定を入れ替えた**（2026-08-13 指摘）。報告書の結果図は矢印と点だけで、
// 始・終の丸い印は無い。続けて描いた線では終と始が並んで「この間は何？」と
// 見えてしまうので、既定では出さない（見たい人は下のボタンで戻せる）
function flightEndsOn(){ return localStorage.getItem('bs_flight_ends')==='1'; }   // 既定は非表示
function flightArrowsOn(){ return localStorage.getItem('bs_flight_arrows')!=='0'; }   // 既定は表示
function toggleFlightEnds(){ try{ localStorage.setItem('bs_flight_ends', flightEndsOn()?'0':'1'); }catch(e){} render(); }
function toggleFlightArrows(){ try{ localStorage.setItem('bs_flight_arrows', flightArrowsOn()?'0':'1'); }catch(e){} render(); }
// 2点間の方位角（北=0・時計回り。矢印の回転用）
function bearingDeg(a,b){ const toR=Math.PI/180;
  const y=Math.sin((b[1]-a[1])*toR)*Math.cos(b[0]*toR);
  const x=Math.cos(a[0]*toR)*Math.sin(b[0]*toR)-Math.sin(a[0]*toR)*Math.cos(b[0]*toR)*Math.cos((b[1]-a[1])*toR);
  return (Math.atan2(y,x)*180/Math.PI+360)%360; }
// 経路上に等間隔で置く矢印の位置と向き（始点・終点は除く。本数は長さに応じて2〜6本）
function flightArrowPts(path){
  const p=(path||[]).filter(validPathPt);
  const total=pathLength(p); if(total<=0 || p.length<2) return [];
  const n=Math.min(6, Math.max(2, Math.round(total/150)));
  const step=total/(n+1);
  const out=[]; let acc=0, target=step;
  for(let i=1;i<p.length && out.length<n;i++){
    const segLen=distMeters(p[i-1],p[i]);
    while(segLen>0 && acc+segLen>=target && out.length<n){
      const t=(target-acc)/segLen;
      out.push({ p:[ p[i-1][0]+(p[i][0]-p[i-1][0])*t, p[i-1][1]+(p[i][1]-p[i-1][1])*t ],
        b:bearingDeg(p[i-1],p[i]) });
      target+=step;
    }
    acc+=segLen;
  }
  return out;
}
// 細い線のV字矢印（白フチ付き・線の色に合わせる。位置指定の十字と同じ描法）。
// 回転はCSSでなくSVG内部の rotate(角度 中心x 中心y) で行う——iOS SafariはSVG要素へのCSS回転の
// 基準点が左上になることがあり、中心で回らず「線の横にずれた変な向きの矢印」になるため
function flightArrowIcon(bearing, col, double2){
  // 急降下（ハンティング）は**矢じり2つ**（→→）。報告書の凡例をそのまま数えて確かめた
  //（→＝飛翔経路 / →→＝急降下。3つにしていたのを直した。2026-08-13）
  const one='M4 12 L9 5 L14 12';
  const d=double2 ? ['M4 14 L9 7 L14 14','M4 9 L9 2 L14 9'] : [one];
  const line=(w,c)=>d.map(p=>`<path d="${p}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  return L.divIcon({className:'', iconSize:[18,18], iconAnchor:[9,9],
    html:`<svg width="18" height="18" viewBox="0 0 18 18" style="display:block;">
      <g transform="rotate(${Math.round(bearing*10)/10} 9 9)">
        ${line(3.6,'#fff')}
        ${line(1.6,col)}
      </g>
    </svg>`});
}
/* ---------- 線の描き分け（報告書の結果図の凡例に合わせる） ----------
   →    飛翔経路（ふつう）
   ↠    急降下（ハンティング）… 終わりに1つだけ
   →×→  攻撃 … 線の中ほどに ×
   ∿→   威嚇行動 … 線の中ほどにギザギザ（藻琴川・東農大資料の凡例。2026-08-14 追加）
   →    歩行経路 … 実線。**同じ図に歩行があるときは、飛翔を点線にして分ける**
        （タンチョウの図の流儀。猛禽だけの図では飛翔が実線なので、常に点線にはしない）

   **飛翔の行動は「狩り」**（観察側の「Ht(狩り)」とは別の言い方。どちらも「狩り」を
   含むので、これで両方に当たる）。2026-08-12、Ht(狩り) だけを見ていて当たらなかった。
   1本の線に複数の行動が付くことがあるので、**強い順に1つだけ**選ぶ。 */
const DIVE_BEHAVIORS=['急降下','狩り'];
const LINE_DIVE='急降下', LINE_ATTACK='攻撃', LINE_THREAT='威嚇', LINE_WALK='歩行';
function lineKind(f){
  const b=String((f&&f.behavior)||'');
  if(DIVE_BEHAVIORS.some(x=>b.includes(x))) return LINE_DIVE;
  if(b.includes(LINE_ATTACK)) return LINE_ATTACK;
  if(b.includes(LINE_THREAT)) return LINE_THREAT;
  if(b.includes(LINE_WALK)) return LINE_WALK;
  return '';
}
function isDive(f){ return lineKind(f)===LINE_DIVE; }
// 線の「長さの半分」の位置。攻撃の × を置くのに使う。
// 点の番号の真ん中では、点が片側に密集した経路で端に寄ってしまう
// （データベース側 map_helpers.point_at_half() と同じ計算）
function pointAtHalf(path){
  const p=(path||[]).filter(validPathPt);
  if(p.length<2) return null;
  const total=pathLength(p);
  if(!(total>0)) return p[0];
  let acc=0;
  for(let i=1;i<p.length;i++){
    const seg=distMeters(p[i-1],p[i]);
    if(acc+seg>=total/2){
      const t=seg>0?((total/2-acc)/seg):0;
      return [p[i-1][0]+(p[i][0]-p[i-1][0])*t, p[i-1][1]+(p[i][1]-p[i-1][1])*t];
    }
    acc+=seg;
  }
  return p[p.length-1];
}
/* 線の「長さの半分」の位置での**進む向き**。威嚇のギザギザを線に沿わせるのに使う。
   ギザギザは横向きの絵なので、回さないと南北の線で横倒しになる */
function bearingAtHalf(path){
  const p=(path||[]).filter(validPathPt);
  if(p.length<2) return 90;
  const total=pathLength(p);
  if(!(total>0)) return bearingDeg(p[0],p[p.length-1]);
  let acc=0;
  for(let i=1;i<p.length;i++){
    const seg=distMeters(p[i-1],p[i]);
    if(acc+seg>=total/2) return bearingDeg(p[i-1],p[i]);
    acc+=seg;
  }
  return bearingDeg(p[p.length-2],p[p.length-1]);
}
// 攻撃の × の印（線の中ほどに置く）
function attackIcon(col){
  return L.divIcon({className:'', iconSize:[16,16], iconAnchor:[8,8],
    html:`<svg width="16" height="16" viewBox="0 0 16 16" style="display:block;">
      <path d="M3 3 L13 13 M13 3 L3 13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path d="M3 3 L13 13 M13 3 L3 13" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/>
    </svg>`});
}
/* 威嚇行動のギザギザ（線の中ほどに置く）。藻琴川・東農大資料の凡例に合わせた。
   **線に沿って回す**。回さないと、南北に飛んだ線でギザギザが横倒しになる。
   回し方は矢印と同じ流儀（SVGの中で回す。iOS Safari で中心がずれないため） */
function threatIcon(bearing, col){
  // **横長にして山を3つ**（2026-08-14）。小さいと線の飾りに埋もれて、
  // 報告書の凡例の「威嚇行動」に見えない。回すぶんの余白を見て、
  // 描く箱は正方形（28×28）にし、その中に横長の記号を置く
  const d='M2 14 L6 8 L10 20 L14 8 L18 20 L22 8 L26 14';
  const line=(w,c)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  return L.divIcon({className:'', iconSize:[28,28], iconAnchor:[14,14],
    html:`<svg width="28" height="28" viewBox="0 0 28 28" style="display:block;">
      <g transform="rotate(${Math.round((bearing-90)*10)/10} 14 14)">
        ${line(5,'#fff')}
        ${line(2.2,col)}
      </g>
    </svg>`});
}
// ◎（旋回上昇）の内側の輪の割合
const SOAR_INNER=0.45;
/* ◎ は**きれいな円**で描く。報告書の記号がそうなっているため。
   囲った形をそのまま二重にすると、いびつな二重丸になって記号に見えない。
   中心は囲った形の重心、大きさは**囲った面積と同じ円の半径**にするので、
   描いた広がりの情報は失わない（記録そのものは囲った形のまま持っている）。 */
// 囲った形の中心。**頂点の平均ではなく「面積の重心」**を使う。
// 平均だと、点を細かく打った側へ中心が寄る（凹んだ形ではもっとずれる）。
// 閉じ点は外してから数える（残すと始点だけ二重に効く）。
// データベース側 map_helpers.area_centroid() と同じ計算
function areaCentroid(path){
  let p=(path||[]).filter(validPathPt);
  if(p.length>1 && p[0][0]===p[p.length-1][0] && p[0][1]===p[p.length-1][1]) p=p.slice(0,-1);
  if(p.length<3) return null;
  // **1点目を原点にずらしてから計算する。**
  // 緯度経度（43度・141度）のまま掛け算すると、数十mの小さな面では
  // 桁が足りずに中心がずれる（2026-08-13 監査）。最後に足し戻す
  const oy=p[0][0], ox=p[0][1];
  let a2=0, cy=0, cx=0;
  for(let i=0;i<p.length;i++){
    const qy=p[i][0]-oy, qx=p[i][1]-ox;
    const ry=p[(i+1)%p.length][0]-oy, rx=p[(i+1)%p.length][1]-ox;
    const cross=qx*ry-rx*qy;
    a2+=cross; cy+=(qy+ry)*cross; cx+=(qx+rx)*cross;
  }
  if(Math.abs(a2)<1e-18){   // つぶれた形は平均で代用する
    return [p.reduce((s,q)=>s+q[0],0)/p.length, p.reduce((s,q)=>s+q[1],0)/p.length];
  }
  return [oy+cy/(3*a2), ox+cx/(3*a2)];
}
function soarCircle(path){
  const c=areaCentroid(path);
  if(!c) return null;
  const a=pathArea((path||[]).filter(validPathPt));
  if(!(a>0)) return null;
  return { c, r:Math.sqrt(a/Math.PI) };
}
// 線の途中の◎（中心と半径m）。保存の項目 soar_spots を読む。壊れた値は捨てる
function soarSpotsOf(f){
  const a=Array.isArray(f&&f.soar_spots) ? f.soar_spots : [];
  return a.filter(x=>x && validPathPt([Number(x.lat), Number(x.lon)]) && Number(x.r)>0)
    .map(x=>({lat:Number(x.lat), lon:Number(x.lon), r:Number(x.r)}));
}
function drawSoarSpot(layer, sp, color, sel){
  try{
    L.circle([sp.lat, sp.lon],{radius:sp.r, color, weight:sel?4:2.5, opacity:.95, fill:false, interactive:false}).addTo(layer);
    L.circle([sp.lat, sp.lon],{radius:sp.r*0.55, color, weight:sel?3:2, opacity:.95, fill:false, interactive:false}).addTo(layer);
  }catch(e){}
}
// 地図に ◎ を描く（外側と内側の2本）。描けたら true
function drawSoar(layer, path, opt){
  const s=soarCircle(path); if(!s) return false;
  const o=opt||{};
  const base={color:o.color||'#9b59b6', weight:o.weight||2.5, opacity:o.opacity==null?.95:o.opacity,
    fill:false, interactive:!!o.interactive};
  const outer=L.circle(s.c,Object.assign({radius:s.r},base)).addTo(layer);
  L.circle(s.c,Object.assign({radius:s.r*SOAR_INNER},base,{weight:(o.weight||2.5)*0.8,interactive:false})).addTo(layer);
  return outer;
}
// 旋回上昇か（◎で描く）
function isSoaring(f){ return isArea(f) && String((f&&f.area_type)||'')==='旋回上昇'; }

/* ---------- 旋回上昇（◎）と飛翔経路（L）をつなぐ ----------
   実際は「飛んできて → その場で旋回上昇して → また飛び去る」ひと続きなのに、
   ◎だけ離れて浮いて見えていた（2026-08-13 指摘）。

   **◎の形も大きさも位置も変えない。** 前後の線の端と、◎のいちばん近いところを
   結ぶ線を1本引くだけ。◎の点を経路に混ぜると、旋回の広さが変わってしまう。

   つなぎ目は**記録に持たない**。描いた順番から毎回引き直せるので、持つと
   本体と控えがずれる元になる（順番はデータベース側にも時刻として残る）。 */
function soarRing(seg){
  return (seg && seg.t==='F' && isSoaring(seg.fl||{}) && (seg.pts||[]).length>2)
    ? soarCircle(seg.pts) : null;
}
// ◎の縁のうち、点 p にいちばん近いところ。p が◎の中なら null（もう届いている）
function soarEdgeToward(ring, p){
  if(!ring || !validPathPt(p)) return null;
  const k=Math.cos(ring.c[0]*Math.PI/180) || 1e-9;
  const dy=(p[0]-ring.c[0])*111320, dx=(p[1]-ring.c[1])*111320*k;
  const d=Math.hypot(dx,dy);
  if(!(d>ring.r)) return null;
  return [ring.c[0]+(dy/d*ring.r)/111320, ring.c[1]+(dx/d*ring.r)/(111320*k)];
}
// 隣の飛翔経路（線）を探す。止まり（P）は飛ばす。面に当たったらそこで止める
function soarNeighborLine(segs, i, dir){
  for(let j=i+dir; j>=0 && j<segs.length; j+=dir){
    const s=segs[j];
    if(!s || s.t==='P') continue;
    if(segShape(s)===SHAPE_AREA) return null;
    return ((s.pts||[]).filter(validPathPt).length>=1) ? s : null;
  }
  return null;
}
/* 記録（保存済みの飛翔経路）どうしをつなぐとき用。
   **同じ鳥どうしだけ**を結ぶ。種も個体も違う記録を結ぶと、飛んでいない線を
   引いてしまう。

   個体の結び付け（individual_key）は**両方にあるときだけ**使う。片方にしか
   無いと「絶対に一致しない」ことになり、古い記録と新しい記録が混ざったときに
   ◎がつながらない（2026-08-13 監査 Major） */
function sameBird(a, b){
  const ka=String((a&&a.individual_key)||'').trim();
  const kb=String((b&&b.individual_key)||'').trim();
  if(ka && kb) return ka===kb;
  const sp=x=>String((x&&x.species_name_snapshot)||'').trim();
  const lb=x=>String((x&&x.individual_label)||'').trim();
  return sp(a)===sp(b) && lb(a)===lb(b);
}
/* 並べ替え用の時刻。**文字のまま比べない**。
   飛び始めの時刻は端末の時計（2026-08-13T05:10）、作った時刻は世界時
   （2026-08-12T20:10Z）で書き方が違う。文字で比べると9時間ずれて前後が
   入れ替わり、つなぎ線が逆を向く（2026-08-13 監査2巡目 Critical）。
   数にしてから比べる。読めないものは最後に回す */
function whenNum(v){
  const t=v ? Date.parse(v) : NaN;
  return isNaN(t) ? Infinity : t;
}
/* 並べ替えの手がかり。まず飛び始めの時刻（無ければ作った時刻）、
   それが同じなら作った時刻で決める。
   飛び始めは分までしか無いので、続けて記録すると同じになりうる */
function flightWhen(f){
  return [whenNum((f && (f.start_time || f.created_at)) || ''),
          whenNum(f && f.created_at)];
}
/* 2つの記録の前後。決められないときは 0 を返す。
   飛び始めが分までしか無いので、続けて記録すると同じ時刻になりうる。
   そのとき**渡された順で決めつけない**——まとめの画面は新しい順に渡してくるので、
   決めつけると入口と出口が入れ替わる（2026-08-13 監査3巡目 Critical） */
function flightOrder(a, b){
  const x=flightWhen(a), y=flightWhen(b);
  for(let i=0;i<x.length;i++){
    if(x[i]===y[i]) continue;
    if(!isFinite(x[i]) || !isFinite(y[i])) return 0;   // 片方が不明なら決められない
    return x[i]<y[i] ? -1 : 1;
  }
  return 0;
}
/* 並べ替え専用の比べ方。**必ず一列に並ぶ**ようにする。
   「決められない＝0」を並べ替えに使うと、A<B・B<C なのに A と C は同じ、
   のような矛盾した比べ方になり、時刻の分かっている記録まで順番が狂う
   （2026-08-13 監査4巡目 Critical）。
   ここでは不明（Infinity）を必ず最後に回し、同じときだけ元の並び順を使う。
   **つないでよいかの判断には使わない**（そちらは flightOrder のまま）。 */
function flightSortCmp(a, b){
  const x=flightWhen(a.f), y=flightWhen(b.f);
  for(let i=0;i<x.length;i++){
    if(x[i]!==y[i]) return x[i]<y[i] ? -1 : 1;   // Infinity は自然に最後へ
  }
  return a.k-b.k;
}
/* 記録の並びの中で、◎の前後にある「同じ鳥の線」を探して結ぶ。

   **並び順は当てにしない。** まとめの画面は新しい順に並べて渡してくるので、
   渡された順のまま前後を見ると「進入線→◎→退出線」が逆になり、
   飛んでいない向きの線を引いてしまう（2026-08-13 監査 Critical）。
   ここで時刻の古い順に並べ直してから前後を探す。 */
function soarJoinsForRecords(list, i){
  const cur=(list||[])[i];
  if(!cur || !isSoaring(cur)) return [];
  const ring=soarCircle((cur.path||[]).filter(validPathPt));
  if(!ring) return [];

  const 順=(list||[]).map((f,k)=>({f,k})).sort(flightSortCmp);
  const here=順.findIndex(o=>o.f===cur);
  if(here<0) return [];

  const pick=dir=>{
    for(let j=here+dir; j>=0 && j<順.length; j+=dir){
      const f=順[j].f;
      if(!f || !sameBird(f, cur)) continue;        // 別の鳥は飛ばす
      // **前後を決められないなら結ばない。** 決めつけると逆向きの線を引く
      if(flightOrder(f, cur)!==dir) return null;
      if(isArea(f)) return null;                   // 面が続くならそこで止める
      const pts=(f.path||[]).filter(validPathPt);
      return pts.length ? pts : null;
    }
    return null;
  };
  const out=[];
  const prev=pick(-1);
  if(prev){ const e=soarEdgeToward(ring, prev[prev.length-1]);
    if(e) out.push([prev[prev.length-1], e]); }
  const next=pick(+1);
  if(next){ const e=soarEdgeToward(ring, next[0]);
    if(e) out.push([e, next[0]]); }
  return out;
}

// ◎と前後の線を結ぶ線を返す（[[端, ◎の縁], …]）
function soarJoins(segs, i){
  const ring=soarRing(segs[i]);
  if(!ring) return [];
  const out=[];
  const prev=soarNeighborLine(segs, i, -1);
  if(prev){
    const pts=(prev.pts||[]).filter(validPathPt);
    const end=pts[pts.length-1], edge=soarEdgeToward(ring, end);
    if(edge) out.push([end, edge]);
  }
  const next=soarNeighborLine(segs, i, +1);
  if(next){
    const pts=(next.pts||[]).filter(validPathPt);
    const start=pts[0], edge=soarEdgeToward(ring, start);
    if(edge) out.push([edge, start]);
  }
  return out;
}
// 飛翔経路の凡例＋色モード切替（種→齢→個体）を地図左下に置く

// 地図上の現在地マーカー（青丸）と精度円を更新
function addCurrentPos(lat,lon,acc){
  if(!mapObj) return;
  if(mapCurMarker){ try{ mapObj.removeLayer(mapCurMarker); }catch(e){} }
  if(mapCurCircle){ try{ mapObj.removeLayer(mapCurCircle); }catch(e){} }
  if(acc && acc>0 && acc<3000){
    mapCurCircle=L.circle([lat,lon],{radius:acc,color:'#3f7de0',fillColor:'#3f7de0',fillOpacity:.08,weight:1}).addTo(mapObj);
  }
  mapCurMarker=L.circleMarker([lat,lon],{radius:7,color:'#fff',weight:2,fillColor:'#3f7de0',fillOpacity:1}).addTo(mapObj).bindPopup('現在地');
}
// 現在地を取得して表示範囲を自動調整（観察地点があれば両方が収まるように）
function locateOnMap(group){
  if(!navigator.geolocation) return;
  const targetMap=mapObj;   // この地図に対する取得。画面を切り替えたら新しい地図を触らない
  // 取得を待つ間に利用者が地図を動かしたら、視点の自動移動はしない
  //（十字モードで狙いを合わせている最中に、遅れて届いた現在地へ勝手に飛ぶと誤指定になるため。現在地マーカーは出す）
  let userMoved=false;
  try{ targetMap.once('dragstart zoomstart', ()=>{ userMoved=true; }); }catch(e){}
  toast('現在地を取得中…');
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude, lon=p.coords.longitude, acc=p.coords.accuracy;
    lastFix={lat,lon,acc,t:Date.now()};
    if(!mapObj || mapObj!==targetMap) return;
    addCurrentPos(lat,lon,acc);
    if(userMoved) return;
    const all=(group||[]).concat([[lat,lon]]);
    if(all.length>1){ try{ mapObj.fitBounds(all,{padding:[40,40], maxZoom:17}); }catch(e){} }
    else { mapObj.setView([lat,lon],16); }
  }, e=>{ /* 取得失敗時は既存の表示のまま */ }, {enableHighAccuracy:true, timeout:15000, maximumAge:10000});
}
// 右上の「現在地へ」ボタン（自分中心に寄せ直す）
function addLocateControl(){
  if(!mapObj || !navigator.geolocation) return;
  const targetMap=mapObj;   // このボタンが属する地図
  const Ctl=L.Control.extend({ options:{position:'topright'},
    onAdd:function(){
      const b=L.DomUtil.create('button','locate-btn'); b.type='button'; b.innerHTML='📍'; b.title='現在地へ';
      L.DomEvent.disableClickPropagation(b); L.DomEvent.on(b,'click',L.DomEvent.stop);
      b.onclick=()=>{ toast('現在地を取得中…');
        navigator.geolocation.getCurrentPosition(p=>{
          const lat=p.coords.latitude, lon=p.coords.longitude, acc=p.coords.accuracy;
          lastFix={lat,lon,acc,t:Date.now()}; if(!mapObj || mapObj!==targetMap) return; addCurrentPos(lat,lon,acc); mapObj.setView([lat,lon],16);
        }, ()=>toast('現在地を取得できませんでした'), {enableHighAccuracy:true, timeout:15000}); };
      return b;
    } });
  mapObj.addControl(new Ctl());
}

SCREENS.search = ()=>({
  title:'検索',
  html:`

      <input id="searchBox" autocomplete="off" placeholder="例）カワセミ ／ 採餌 ／ 川の名前" oninput="searchInput(this.value)"></label>
    <div id="searchResults"></div>`,
  onMount:()=>{ SCREENS._searchIdx=null; SCREENS._searchShow=100;
    const b=$('#searchBox'); if(b) b.value=SCREENS._searchQ||''; runSearch(SCREENS._searchQ||''); if(b) b.focus(); }
});
let searchTimer=null;
function searchInput(q){   // 1文字ごとに全記録を走査しない（入力が250ms止まってから検索）
  SCREENS._searchQ=q; SCREENS._searchShow=100;
  clearTimeout(searchTimer);
  if(!(q||'').trim()){ runSearch(q); return; }   // 空にしたら即時に案内表示へ
  const box=$('#searchResults'); if(box) box.innerHTML='<div class="empty small">検索中…</div>';   // 待ち時間に古い結果を触れないように
  searchTimer=setTimeout(()=>runSearch(q), 250);
}
// 検索対象の正規化（カタカナ化・小文字化）を先に1回だけ済ませた索引。
// 画面を開くたびに作り直す（onMountでnull化）ので、同期で増えた記録も開き直せば反映される
function buildSearchIndex(){
  const norm=t=>toKata(String(t||'').toLowerCase());
  const svMap={}; DB.surveys().forEach(s=>svMap[s.uuid]=s); // 削除されていない調査のみ
  const idx=[];
  DB.observations().forEach(o=>{ const s=svMap[o.survey_uuid]; if(!s) return;
    idx.push({ kind:'obs', s, o, t:o.observed_at||'',
      norm:[o.species_name_snapshot,o.note,o.behavior,o.habitat,o.detection_method,o.identification_status,s.name,s.location_name].map(norm).join('\n'),
      title:o.species_name_snapshot||'（未同定）',
      sub:`${esc(s.name||'')} ・ ${fmtDate(o.observed_at)} ・ ${esc(o.detection_method||'')}${o.behavior?' ・ '+esc(o.behavior):''}`,
      snippet:o.note||'', marks:`${(o.audio&&o.audio.length)?'🎤':''}${(o.media&&o.media.length)?'📷':''}${o.latitude?'📍':''}` });
  });
  DB.notes().forEach(n=>{ const s=svMap[n.survey_uuid]; if(!s) return;
    idx.push({ kind:'note', s, n, t:n.recorded_at||'',
      norm:[n.content,n.category,s.name,s.location_name].map(norm).join('\n'),
      title:'📝 メモ: '+esc(n.category||''), sub:`${esc(s.name||'')} ・ ${fmtDate(n.recorded_at)}`,
      snippet:n.content||'', marks:'' });
  });
  idx.sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  return idx;
}
function searchMore(){ SCREENS._searchShow=(SCREENS._searchShow||100)+100; runSearch(SCREENS._searchQ||''); }
function runSearch(q){
  SCREENS._searchQ=q; const box=$('#searchResults'); if(!box) return;
  q=(q||'').trim();
  if(!q){ box.innerHTML='<div class="empty small">種名・メモ・場所などを入力すると、すべての調査から探します。</div>'; return; }
  if(!SCREENS._searchIdx) SCREENS._searchIdx=buildSearchIndex();
  const qk=toKata(q.toLowerCase());
  const results=SCREENS._searchIdx.filter(r=>r.norm.includes(qk));
  if(!results.length){ box.innerHTML=`<div class="empty small">「${esc(q)}」に一致する記録はありませんでした。</div>`; return; }
  const show=Math.max(100, SCREENS._searchShow||100);
  box.innerHTML=`<div class="small muted" style="margin-bottom:8px;">${results.length}件見つかりました</div>`+
    results.slice(0,show).map(r=>{
      const act=r.kind==='obs'
        ? `nav('obsEdit', JSON.stringify({sv:'${r.s.uuid}',id:'${r.o.uuid}'}))`
        : `nav('noteEdit', JSON.stringify({sv:'${r.s.uuid}',id:'${r.n.uuid}'}))`;
      return `<div class="card tap" onclick="${act}">
        <div class="row"><div class="grow">
          <div style="font-weight:700;">${esc(r.title)} <span class="tiny muted">${r.marks}</span></div>
          <div class="small muted">${r.sub}</div>
          ${r.snippet?`<div class="small" style="margin-top:4px;">${esc(String(r.snippet).slice(0,80))}</div>`:''}
        </div><span class="muted">›</span></div></div>`;
    }).join('')+
    (results.length>show?`<button class="btn" onclick="searchMore()">さらに表示（残り ${results.length-show}件）</button>`:'');
}

   メディア一覧（全調査の写真・動画・録音を新しい順に一覧）

// 一覧の元データ。生きている観察・飛翔レコードから直接メディア参照を集める
//（同期用のcollectMediaRefsは削除済みレコードを含み、重複排除の順序次第で生存側の参照が欠落しうるため使わない）
function galleryItems(){
  const svMap=Object.create(null); DB.surveys().forEach(s=>{ svMap[s.uuid]=s; });
  const items=[]; const seen=new Set();
  const take=(owner, ownerType)=>{
    const s=svMap[owner.survey_uuid]; if(!s) return;   // 削除済み調査のものは出さない
    const when=(ownerType==='obs' ? owner.observed_at : owner.start_time)||'';
    const add=(m, store, 欄)=>{
      if(!m||!m.id) return; const key=store+':'+m.id;
      if(seen.has(key)) return; seen.add(key);
      const w=when || m.created_at || '';
      const t=Date.parse(w);   // 保存形式（UTC/端末時刻）が混在しても正しく並ぶよう数値化して比較する
      items.push({ store, id:m.id, kind:(store==='audio'?'audio':(m.kind||'photo')),
        when:w, t:isNaN(t)?0:t, dur:m.dur, field:欄||'media',
        species:owner.species_name_snapshot||'', svUuid:s.uuid, svName:s.name||'',
        ownerType, ownerUuid:owner.uuid });
    };
    (owner.audio||[]).forEach(m=>add(m,'audio','audio'));
    (owner.media||[]).forEach(m=>add(m,'media','media'));
    // 環境・営巣木の写真も一覧に出す。出さないと「撮ったのに見当たらない」になる
    if(ownerType==='obs'){
      (owner.env_media||[]).forEach(m=>add(m,'media','env_media'));
      (owner.nest_media||[]).forEach(m=>add(m,'media','nest_media'));
    }
  };
  DB.observations().forEach(o=>take(o,'obs'));
  DB.flights().forEach(f=>take(f,'flight'));
  items.sort((a,b)=>b.t-a.t);
  return items;
}
function galFmtWhen(w, withTime){ if(!w) return ''; const d=new Date(w); if(isNaN(d)) return '';
  const md=(d.getMonth()+1)+'/'+d.getDate();
  return withTime ? md+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2) : md;
}

// 表示中ページのタイルにIndexedDBのblobを割り当てる（画面遷移していたら中止＝既存メディアパネルと同じ作法）。
// 録音は一覧では読み込まない（拡大表示で初めて読む＝一覧が軽い）
function galLoadThumbs(shown, start){
  const main=$('#main'); if(!main) return;
  const gen=++_mediaGen;
  shown.forEach((it,i)=>{
    if(it.store==='audio') return;
    PhotoDB.get(it.id).then(r=>{
      if(gen!==_mediaGen) return;
      const el=main.querySelector(`.mediaitem[data-gid="${start+i}"] .mediael`); if(!el||!el.isConnected) return;
      if(!r||!r.blob){   // 実体がまだこの端末に無い（同期待ち・動画の手動DL前）
        const th=el.closest('.mediathumb');
        if(th) th.innerHTML='<div class="tiny muted" style="display:flex; align-items:center; justify-content:center; height:100%; text-align:center;">☁ 未取得</div>';
        return;
      }
      if(el._url) URL.revokeObjectURL(el._url);
      el._url=URL.createObjectURL(r.blob); el.src=el._url;
    }).catch(()=>{});
  });
}

function restoreItem(k,u){
  if(!writeAllowed()) return;
  if(!DB.restore(k,u)){ toast('復元できませんでした（空き容量を確認してください）'); return; }
  // 付随する記録の復元も、全部の成否を集めてから結果を言う（一部だけ残ったのに成功と言わない）
  let fails=0;
  const tryRestore=(kk,uu)=>{ const ok=DB.restore(kk,uu); if(!ok) fails++; return ok; };
  // 仮説と一緒に消えた検証結果(deleted_with_hyp)を戻す。失敗したら対象の件数ぶん数える
  const restoreHypResults=(hyUuid)=>{ const arr=DB.load(DB.key.hr); let n=0;
    arr.forEach(r=>{ if(r.hypothesis_uuid===hyUuid && r.deleted_at && r.deleted_with_hyp){ delete r.deleted_at; delete r.deleted_with_hyp; n++; } });
    if(n && !DB.save(DB.key.hr,arr)) fails+=n; };
  if(k===DB.key.hy){ restoreHypResults(u); }
  if(k===DB.key.sv){
    DB.deleted(DB.key.ob).filter(o=>o.survey_uuid===u).forEach(o=>tryRestore(DB.key.ob,o.uuid));
    DB.deleted(DB.key.nt).filter(n=>n.survey_uuid===u).forEach(n=>tryRestore(DB.key.nt,n.uuid));
    // 親（仮説）が戻せたときだけ、子（検証結果）を戻す（子だけ戻る不整合を作らない）
    DB.deleted(DB.key.hy).filter(h=>h.survey_uuid===u).forEach(h=>{ if(tryRestore(DB.key.hy,h.uuid)) restoreHypResults(h.uuid); });
    DB.deleted(DB.key.fl).filter(f=>f.survey_uuid===u).forEach(f=>tryRestore(DB.key.fl,f.uuid));
  }
  if(fails) toast('一部（'+fails+'件）を復元できませんでした。ごみ箱を確認してください（空き容量も確認）', 6000);
  else toast('復元しました');
  render();
}
function purgeItem(k,u){
  if(!writeAllowed()) return;
  if(!confirm('完全に削除すると元に戻せません。'+(k===DB.key.sv?'この調査の「聞こえた鳥」（鳴き声AI）の記録と声も消えます。':'')+'よろしいですか？')) return;
  if(k===DB.key.sv){
    DB.load(DB.key.ob).filter(o=>o.survey_uuid===u).forEach(o=>DB.hardDelete(DB.key.ob,o.uuid));
    DB.load(DB.key.nt).filter(n=>n.survey_uuid===u).forEach(n=>DB.hardDelete(DB.key.nt,n.uuid));
    DB.load(DB.key.hy).filter(h=>h.survey_uuid===u).forEach(h=>{
      DB.load(DB.key.hr).filter(r=>r.hypothesis_uuid===h.uuid).forEach(r=>DB.hardDelete(DB.key.hr,r.uuid));
      DB.hardDelete(DB.key.hy,h.uuid); });
    DB.load(DB.key.fl).filter(f=>f.survey_uuid===u).forEach(f=>DB.hardDelete(DB.key.fl,f.uuid));
  }
  if(k===DB.key.hy){   // 仮説単体の完全削除でも、子の検証結果を残骸にしない
    DB.load(DB.key.hr).filter(r=>r.hypothesis_uuid===u).forEach(r=>DB.hardDelete(DB.key.hr,r.uuid));
  }
  const okDel=DB.hardDelete(k,u); mediaGcAll(); render();
  // 調査を消せたときは、その調査の聞こえた鳥（端末内だけの記録と声）も消す。消し終わったのを確かめてから「完全に削除しました」と言う
  if(k===DB.key.sv && okDel){ aiDeleteSurveys([u]).then(ok=>toast(ok?'完全に削除しました'
    :'調査は削除しましたが、「聞こえた鳥」の記録が残っています。ホームの「資料・データの管理」→「鳴き声AI」から消せます', ok?2000:8000)); return; }
  toast('完全に削除しました');
}
function purgeAll(){
  if(!writeAllowed()) return;
  if(!confirm('ごみ箱の中身をすべて完全に削除します。元に戻せません。調査の「聞こえた鳥」（鳴き声AI）の記録と声も消えます。よろしいですか？')) return;
  const svs=DB.deleted(DB.key.sv).map(x=>x.uuid);
  [DB.key.sv,DB.key.ob,DB.key.nt,DB.key.hy,DB.key.hr,DB.key.fl].forEach(k=>
    DB.deleted(k).forEach(x=>DB.hardDelete(k,x.uuid)));
  mediaGcAll(); render();
  const gone=svs.filter(u=>!DB.survey(u));   // 実際に消せた調査の分だけ
  if(!gone.length){ toast('ごみ箱を空にしました'); return; }
  aiDeleteSurveys(gone).then(ok=>toast(ok?'ごみ箱を空にしました'
    :'ごみ箱は空にしましたが、「聞こえた鳥」の記録が残っています。ホームの「資料・データの管理」→「鳴き声AI」から消せます', ok?2000:8000));
}

   localStorage直書き＝テーマと同じく端末ごとの状態（同期対象にしない）。
   値は音源一覧の署名（種名＋ファイル名から算出）。音源の追加・差し替えで署名が変わるため、
   旧版で保存した「済み」を信用せず、誤って「全種保存済み」と畳んだままにしない */
let _callsSig=null;
function callsSig(){
  if(_callsSig===null){ let h=0;
    for(const jp in CALLS){ const s=jp+':'+CALLS[jp].f+';'; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; }
    _callsSig='s'+(h>>>0).toString(36)+'-'+Object.keys(CALLS).length; }
  return _callsSig;
}
function callsAllSavedFlag(){ try{ return localStorage.getItem('bs_calls_allsaved')===callsSig(); }catch(e){ return false; } }
// 通信量の目安。CALLS に持たせた実バイト数から出すので、音源を差し替えても自動で追従する。
function callsMB(bytes){ return Math.max(1, Math.round(bytes/1024/1024)); }
function updateCallSaved(){
  const total=Object.keys(CALLS).length;
  countUpToDateCalls().then(({n, restBytes})=>{
    // 開閉フラグは画面表示の有無に関係なく更新（別画面でDL完了しても次回表示に反映）。
    // 表示中のopen状態は触らない（見ている最中に勝手に閉じない。次回表示から反映）
    try{ if(n>=total) localStorage.setItem('bs_calls_allsaved',callsSig()); else localStorage.removeItem('bs_calls_allsaved'); }catch(e){}
    const rest=Math.max(0,total-n);   // 未保存＋差し替えで古くなった種
    const sv=$('#callSaved');
    if(sv) sv.textContent = n>=total ? `✅ 全${total}種を端末に保存済み（圏外でも再生できます）` : `端末に保存済み: ${n} / ${total} 種`;
    const b=$('#dlCallsBtn');
    if(b && !_dlCallsRunning){ if(n>=total){ b.disabled=true; b.classList.add('ghost'); b.textContent='✅ 鳴き声は保存済み'; }
      else { b.disabled=false; b.classList.remove('ghost'); b.textContent=`⬇ 鳴き声を端末に保存（残り${rest}種・約${callsMB(restBytes)}MB・Wi-Fi推奨）`; } }
  }).catch(()=>{});
}

function playCall(btn, jp){

    a.style.display='block'; a.src=src;
    if(isBlob){ a._url=src; a.addEventListener('ended',()=>{ if(a._url){ try{ URL.revokeObjectURL(a._url); }catch(e){} a._url=null; } }); } // 再生後・画面遷移(render)で解放
    if(btn.parentNode) btn.replaceWith(a); try{ a.play&&a.play().catch(()=>{}); }catch(e){} };
  CallDB.get(jp).then(r=>{
    if(r&&r.blob) show(URL.createObjectURL(r.blob), true); // 端末保存済み＝圏外でも再生
    else show('./assets/calls/'+c.f, false);               // 未保存＝ネットから
  }).catch(()=>show('./assets/calls/'+c.f, false));
}

let _dlCallsRunning=false;
async function downloadCalls(){
  if(!writeAllowed()) return;
  if(_dlCallsRunning) return; _dlCallsRunning=true;
  const entries=Object.keys(CALLS); const btn=$('#dlCallsBtn'); if(btn){ btn.disabled=true; btn.textContent='ダウンロード中…'; }
  toast('鳴き声をダウンロード中…（Wi-Fi推奨）');
  let done=0, failn=0;
  for(const jp of entries){
    try{
      const f=CALLS[jp].f;
      const ex=await CallDB.get(jp); if(ex&&ex.blob&&ex.f===f){ done++; continue; }  // 今の録音と一致していれば再DLしない（差し替え分だけ更新）
      const res=await fetch('./assets/calls/'+f); if(!res.ok) throw 0;
      const blob=await res.blob(); await CallDB.put({jp, f, blob}); done++;
    }catch(e){ failn++; }
    if((done+failn)%10===0){ toast(`ダウンロード中… ${done+failn}/${entries.length}`); updateCallSaved(); }
  }
  _dlCallsRunning=false;
  toast(failn?`保存しました（${done}種／失敗${failn}）`:`保存しました（${done}種・圏外でも再生できます）`);
  updateCallSaved(); renderGuideList(SCREENS._guideQ||'');
}

function importRefdoc(input){
  const f=(input.files||[])[0]; input.value=''; if(!f) return;
  if(!writeAllowed()) return;
  if(f.type && f.type.indexOf('pdf')<0 && !/\.pdf$/i.test(f.name||'')){ toast('PDFファイルを選んでください'); return; }
  const meta={ id:uuid(), name:f.name||'図鑑.pdf', size:f.size, created_at:nowISO() };
  toast('取り込み中…（大きいPDFは少し時間がかかります）');
  RefDB.put({ id:meta.id, blob:f }).then(()=>{
    const l=refdocList(); l.unshift(meta);
    if(!refdocSave(l)){
      // 目録に載せられなかったら、入れた本体も回収する（見えない残骸を残さない）
      RefDB.del(meta.id).catch(()=>{});
      toast('取り込みに失敗しました'); return;
    }
    toast('取り込みました'); render();
  }).catch(()=>toast('取り込みに失敗しました'));
}
let REFDOC_BUSY=false;   // 資料の削除は1件ずつ（重ねると、古い控えで別の削除の結果を上書きしてしまう）
function delRefdoc(id){
  if(REFDOC_BUSY){ toast('前の削除が終わるまでお待ちください'); return; }
  if(!confirm('この資料を削除しますか？')) return;
  // 先に目録から外す（本体を先に消すと、失敗したとき「開けない資料」が一覧に残る）
  const item=refdocList().find(r=>r.id===id); if(!item) return;
  if(!refdocSave(refdocList().filter(r=>r.id!==id))) return;
  REFDOC_BUSY=true;
  RefDB.del(id).then(()=>{ toast('削除しました'); render(); })
    .catch(()=>{
      // 本体を消せなかったら、対象の1件だけを今の目録に戻す（配列ごと戻すと他の変更を潰す）
      const cur=refdocList();
      if(!cur.some(r=>r.id===id)){ cur.unshift(item);
        if(!refdocSave(cur)){ toast('目録を戻せませんでした。データ点検・修復画面で確認してください', 6000); } }
      toast('削除に失敗しました'); render();
    })
    .finally(()=>{ REFDOC_BUSY=false; });
}

/* PDF.js は使う時だけ読み込む（起動を軽く保つ） */
let _pdfjsLoading=null;
function ensurePdfjs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(_pdfjsLoading) return _pdfjsLoading;
  _pdfjsLoading=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='./vendor/pdf.min.js';
    s.onload=()=>{ if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='./vendor/pdf.worker.min.js'; res(); } else rej(new Error('pdfjs')); };
    s.onerror=()=>rej(new Error('pdfjs load')); document.head.appendChild(s);
  });
  return _pdfjsLoading;
}
let PDFCTX=null; // { doc, page, total }
let _pdfLoadSeq=0; // PDF読込の連番。新しい読込が始まったら古い読込結果は破棄する
SCREENS.pdfView = (id)=>{
  const meta=refdocList().find(r=>r.id===id);
  if(!meta) return SCREENS.refdocs();
  return { title: meta.name, sub:[`<span class="pill" id="pdfPill">読み込み中…</span>`],
    html:`
      <div class="row" style="align-items:center; gap:8px;">
        <button class="btn" style="width:auto; padding:10px 14px;" onclick="pdfPage(-1)">‹ 前</button>
        <span class="grow" style="text-align:center;"><span id="pdfPageNum">-</span> / <span id="pdfPageTot">-</span></span>
        <button class="btn" style="width:auto; padding:10px 14px;" onclick="pdfPage(1)">次 ›</button>
      </div>
      <div class="row" style="margin-top:8px; gap:8px;">
        <input id="pdfJump" type="number" inputmode="numeric" placeholder="ページ番号へ移動" style="flex:1;">
        <button class="btn" style="width:auto; padding:10px 14px;" onclick="pdfJump()">移動</button>
      </div>
      <div id="pdfWrap" style="margin-top:12px; overflow:auto; -webkit-overflow-scrolling:touch; text-align:center;">
        <canvas id="pdfCanvas" style="max-width:100%; border:1px solid var(--line); border-radius:8px; background:#fff;"></canvas>
      </div>`,
    onMount:()=>{ loadPdf(id); }
  };
};
async function loadPdf(id){
  const seq=++_pdfLoadSeq;   // この読込の番号。以降に別の読込が始まったら、この結果は破棄する
  try{
    await ensurePdfjs();
    const rec=await RefDB.get(id); if(!rec||!rec.blob){ toast('PDFが見つかりません'); return; }
    const buf=await rec.blob.arrayBuffer();
    // 細工PDFによる任意JavaScript実行(CVE-2024-4367系)を防ぐため eval を無効化
    const doc=await pdfjsLib.getDocument({data:buf, isEvalSupported:false}).promise;
    if(seq!==_pdfLoadSeq || !$('#pdfCanvas')){ try{ doc.destroy(); }catch(e){} return; }   // 別PDFに移った/画面を離れたら破棄
    PDFCTX={ doc, page:1, total:doc.numPages };
    const tot=$('#pdfPageTot'); if(tot) tot.textContent=doc.numPages;
    const pill=$('#pdfPill'); if(pill) pill.textContent=`全 ${doc.numPages} ページ`;
    renderPdfPage();
  }catch(e){ toast('PDFを開けませんでした'); }
}
async function renderPdfPage(){
  if(!PDFCTX) return;
  const page=PDFCTX.page;
  try{
    const p=await PDFCTX.doc.getPage(page);
    const canvas=$('#pdfCanvas'); if(!canvas || !PDFCTX) return;
    const wrap=$('#pdfWrap'); const wrapW=Math.min((wrap&&wrap.clientWidth)||900, 1400);
    const vp0=p.getViewport({scale:1});
    const scale=Math.max(0.3, Math.min(3, (wrapW-4)/vp0.width));
    const vp=p.getViewport({scale});
    const ctx=canvas.getContext('2d');
    canvas.width=vp.width; canvas.height=vp.height;
    await p.render({canvasContext:ctx, viewport:vp}).promise;
    const num=$('#pdfPageNum'); if(num) num.textContent=page;
  }catch(e){}
}
function pdfPage(d){ if(!PDFCTX) return; const n=PDFCTX.page+d; if(n<1||n>PDFCTX.total) return; PDFCTX.page=n; renderPdfPage(); }
function pdfJump(){ if(!PDFCTX) return; const el=$('#pdfJump'); const v=parseInt(el&&el.value,10);
  if(v>=1 && v<=PDFCTX.total){ PDFCTX.page=v; renderPdfPage(); } else toast('1〜'+PDFCTX.total+' のページ番号を入れてください'); }

/* ============================================================
   オフライン地図の保存（範囲を囲って先に落としておく）
   スクロール任せの受動キャッシュだと「どこまで保存できたか」が分からないので、
   多角形で範囲を決めて、その中のタイルをまとめて Service Worker の PACK_CACHE へ保存する。
   保存分は自動では消えない（版の掃除・「最新に更新」からも保護）。産卵床調査アプリからの移植。
   ============================================================ */
const PACK_MAXZOOM = 16;     // これ以上は落とさない（枚数が急増するため）
const PACK_MINZOOM = 12;     // 全体像が分かる粗さから
// URLは createBaseMap の生成URLと文字列完全一致であること（キャッシュ照合はURL一致のため）
const PACK_BASEMAPS = {
  '標準地図':          { url:'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png' },
  '淡色地図':          { url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png' },
  '写真（航空・衛星）': { url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg' },
};
const PACK_TILE_KB = { '標準地図':12, '淡色地図':10, '写真（航空・衛星）':20 };   // 見積り用の1枚あたりKB
const PACK_WARN_TILES = 12000;   // これを超えたら強く警告（40000で拒否）

// 緯度経度 → タイル番号
function lon2tx(lon,z){ return Math.floor((lon+180)/360*Math.pow(2,z)); }
function lat2ty(lat,z){ const r=lat*Math.PI/180;
  return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z)); }
// タイル番号 → そのタイルの北西角の緯度経度
function tx2lon(x,z){ return x/Math.pow(2,z)*360-180; }
function ty2lat(y,z){ const n=Math.PI-2*Math.PI*y/Math.pow(2,z);
  return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); }

function polyBounds(poly){
  let s=90,n=-90,w=180,e=-180;
  poly.forEach(p=>{ s=Math.min(s,p[0]); n=Math.max(n,p[0]); w=Math.min(w,p[1]); e=Math.max(e,p[1]); });
  return {s,n,w,e};
}
function pointInPoly(lat, lon, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0], xi=poly[i][1], yj=poly[j][0], xj=poly[j][1];
    if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function tileHitsPoly(x,y,z,poly){
  const latN=ty2lat(y,z), latS=ty2lat(y+1,z), lonW=tx2lon(x,z), lonE=tx2lon(x+1,z);
  // タイルの4隅・中心のどれかが多角形内なら採用
  const pts=[[latN,lonW],[latN,lonE],[latS,lonW],[latS,lonE],[(latN+latS)/2,(lonW+lonE)/2]];
  if(pts.some(p=>pointInPoly(p[0],p[1],poly))) return true;
  // 多角形の頂点がタイルの中に入る場合も採用
  if(poly.some(p=>p[0]<=latN && p[0]>=latS && p[1]>=lonW && p[1]<=lonE)) return true;
  // 細長い多角形が「隅も中心も外のままタイルを横切る」場合の取りこぼし防止:
  // 多角形の辺がタイルと交差していれば採用（保存範囲の中に穴を作らない）
  for(let i=0;i<poly.length;i++){
    if(segIntersectsRect(poly[i], poly[(i+1)%poly.length], latS, latN, lonW, lonE)) return true;
  }
  return false;
}
// 線分p1-p2がタイル矩形と交わるか（端点が中、または矩形の4辺と交差）
function segIntersectsRect(p1,p2,latS,latN,lonW,lonE){
  const inR=p=>p[0]<=latN && p[0]>=latS && p[1]>=lonW && p[1]<=lonE;
  if(inR(p1)||inR(p2)) return true;
  const o=(a,b,c)=>Math.sign((b[1]-a[1])*(c[0]-a[0])-(b[0]-a[0])*(c[1]-a[1]));
  const x=(a,b,c,d)=>o(a,b,c)!==o(a,b,d) && o(c,d,a)!==o(c,d,b);
  const c1=[latS,lonW],c2=[latS,lonE],c3=[latN,lonE],c4=[latN,lonW];
  return x(p1,p2,c1,c2)||x(p1,p2,c2,c3)||x(p1,p2,c3,c4)||x(p1,p2,c4,c1);
}

// 一覧の読み出しは型を検査し、壊れた項目は捨てる（v73点検の対象外キーのため自前で守る。画面が開けなくなるのを防ぐ）
function packStore(){ try{ const a=JSON.parse(localStorage.getItem('bs_map_packs')||'[]');
  if(!Array.isArray(a)) return [];
  return a.filter(p=>p && typeof p==='object' && !Array.isArray(p)
    && Array.isArray(p.poly) && p.poly.every(q=>Array.isArray(q) && q.length===2
      && typeof q[0]==='number' && Number.isFinite(q[0]) && typeof q[1]==='number' && Number.isFinite(q[1]))
    && Array.isArray(p.layers) && p.layers.every(s=>typeof s==='string')
    && Number.isFinite(+p.count) && Number.isFinite(+p.mb));
}catch(e){ return []; } }
// 成否を返す（失敗を握りつぶすと「タイルは保存されたのに一覧に無い」隠れデータになるため）
function packSave(list){ if(!writeAllowed()) return false;
  try{ localStorage.setItem('bs_map_packs', JSON.stringify(list)); return true; }catch(e){ return false; } }

// 保存するタイルの (z,x,y) 一覧。poly の形にかかるマスだけを選ぶ
// cap を渡すと、その枚数に達した時点で数えるのをやめる（どうせ拒否されるため）
function packTiles(area, zmax, cap){
  const zTop = Math.min(zmax, PACK_MAXZOOM);
  const poly = (area && area.poly && area.poly.length>=3) ? area.poly : null;
  const bb = poly ? polyBounds(poly) : area;
  const out=[];
  for(let z=PACK_MINZOOM; z<=zTop; z++){
    const x0=lon2tx(bb.w,z), x1=lon2tx(bb.e,z);
    const y0=lat2ty(bb.n,z), y1=lat2ty(bb.s,z);
    for(let x=Math.min(x0,x1); x<=Math.max(x0,x1); x++)
      for(let y=Math.min(y0,y1); y<=Math.max(y0,y1); y++)
        if(!poly || tileHitsPoly(x,y,z,poly)){ out.push([z,x,y]);
          if(cap && out.length>=cap) return out; }
  }
  return out;
}
function packTileUrls(area, zmax, layers){
  const tiles = packTiles(area, zmax);
  const urls=[];
  layers.forEach(name=>{
    const b=PACK_BASEMAPS[name]; if(!b) return;
    tiles.forEach(([z,x,y])=>urls.push(b.url.replace('{z}',z).replace('{x}',x).replace('{y}',y)));
  });
  return urls;
}
// 先に**四角のまま枚数だけ**を数える。多角形の当たり判定は1枚ずつで重いので、
// 明らかに多すぎる範囲では、列挙そのものを始めない（画面が固まる・メモリ不足になる）
function packTileCountRough(area, zmax){
  const zTop = Math.min(zmax, PACK_MAXZOOM);
  const poly = (area && area.poly && area.poly.length>=3) ? area.poly : null;
  const bb = poly ? polyBounds(poly) : area;
  let n=0;
  for(let z=PACK_MINZOOM; z<=zTop; z++){
    const x0=lon2tx(bb.w,z), x1=lon2tx(bb.e,z);
    const y0=lat2ty(bb.n,z), y1=lat2ty(bb.s,z);
    n += (Math.abs(x1-x0)+1)*(Math.abs(y1-y0)+1);
  }
  return n;
}
// 見積り（枚数と、種類ごとの重みで概算したMB）
function packEstimate(area, zmax, layers){
  // 四角の枚数は**暴走止めだけ**に使う。斜めや細長い範囲は四角より実際はずっと少ないので、
  // これで拒否すると、正当な範囲まで保存できなくなる（監査1巡目 Major）
  const rough = packTileCountRough(area, zmax) * Math.max(1, (layers||[]).length);
  if(rough > 2000000) return { count: rough, mb: rough*15/1024, urls: [], tooMany: true };
  // 実際に重なる枚数で数える。上限を超えた時点で打ち切る（それ以上は拒否されるだけ）
  const 上限 = Math.ceil(40001 / Math.max(1, (layers||[]).length));
  const tiles = packTiles(area, zmax, 上限);
  const urls = [];
  (layers||[]).forEach(name=>{ const b=PACK_BASEMAPS[name]; if(!b) return;
    tiles.forEach(([z,x,y])=>urls.push(b.url.replace('{z}',z).replace('{x}',x).replace('{y}',y))); });
  const perZoom={};
  tiles.forEach(([z])=>{ perZoom[z]=(perZoom[z]||0)+1; });
  let kb=0;
  layers.forEach(name=>{ const w=PACK_TILE_KB[name]||15;
    Object.keys(perZoom).forEach(z=>{ kb += perZoom[z]*w; }); });
  return { count:urls.length, mb: kb/1024, urls };
}

// Service Worker への依頼（保存・計測・削除・疎通確認）。返事を待つ。
// SWが応答しない場合に永久に固まらないよう時間で打ち切る（既定120秒。低速回線の30枚直列でも収まる粒度）
function swAsk(msg, timeoutMs){
  return new Promise((res,rej)=>{
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if(!sw){ rej(new Error('no-sw')); return; }
    const ch = new MessageChannel();
    const tm = setTimeout(()=>rej(new Error('sw-timeout')), timeoutMs||120000);
    ch.port1.onmessage = e => { clearTimeout(tm); res(e.data); };
    sw.postMessage(msg, [ch.port2]);
  });
}

      <div class="btn-grid" style="margin-top:8px">
        <button class="btn" onclick="offlineUndoCorner()">↶ 1つ戻す</button>
        <button class="btn ghost" onclick="offlineClearRect()">囲みを消す</button>
      </div>
      <button class="btn ghost" style="margin-top:8px" onclick="offlineUseView()">今の表示範囲をそのまま使う</button>
      <div class="tiny muted" style="margin:6px 0;">3点以上打つと範囲になります。谷筋・海岸線に沿ってL字などの自由な形で囲むと無駄が減ります。</div>

      <label class="field"><span class="lab">保存する地図の種類（複数可）</span>
        <div class="seg" data-seg="packLayers">
          ${Object.keys(PACK_BASEMAPS).map(n=>`<button type="button" class="${n===curBase?'on':''}" onclick="togglePackLayer(this)">${esc(n)}</button>`).join('')}
        </div></label>
      <label class="field"><span class="lab">細かさ（拡大の上限。上げるほど枚数が増えます）</span>
        <div class="seg" data-seg="packZoom">
          ${['z14（広域）','z15（標準）','z16（詳細）'].map(v=>`<button type="button" class="${v.startsWith('z16')?'on':''}" onclick="pickPackZoom(this)">${esc(v)}</button>`).join('')}
        </div></label>

      <div class="card" id="omapEst"><div class="small muted">3点以上囲むと、枚数と容量の見積りが出ます。</div></div>
      <button class="btn primary big" id="omapSaveBtn" onclick="offlineSave('${sv}')">💾 この範囲を保存</button>
      <div class="sp"></div>
      <div id="omapProg"></div>

      ${ packs.length ? `<h3 class="muted small">保存済み（${packs.length}）</h3>${packCards}
        <button class="btn ghost" onclick="offlineStats()">実際の保存量を確認</button>
        <div class="tiny muted" id="omapStats" style="margin-top:6px"></div>` : '' }
    `,
    onMount:()=>initOfflineMap(sv)
  };
};

function initOfflineMap(sv){
  PK_PTS=[]; PK_SHAPE=null; PK_DOTS=[];   // 再入場時に前回の角が復活しないよう必ずリセット
  if(typeof L==='undefined' || !$('#omap')) return;
  // 記録済みの観察位置を薄く出して、どこを保存すればよいか分かるように
  const pts=DB.obsOf(sv).map(o=>[parseFloat(o.latitude),parseFloat(o.longitude)])
    .filter(p=>isFinite(p[0])&&isFinite(p[1]));
  let center=[43.06,141.35], zoom=10;
  if(pts.length){ const bb=polyBounds(pts); center=[(bb.s+bb.n)/2,(bb.w+bb.e)/2]; zoom=13; }
  else if(lastFix){ center=[lastFix.lat,lastFix.lon]; zoom=13; }
  mapObj=createBaseMap('omap', center, zoom, {});
  pts.forEach(p=>L.circleMarker(p,{radius:4,color:'#9aa8b4',weight:1,fillOpacity:.4}).addTo(mapObj));
  // 既に保存済みの範囲を緑の破線で見せる
  packStore().forEach(p=>{
    if(p.poly && p.poly.length>=3)
      L.polygon(p.poly, {color:'#4ec38a',weight:1,fillOpacity:.05,dashArray:'4,4'}).addTo(mapObj);
  });
  mapObj.on('click', e=>offlineAddCorner(e.latlng.lat, e.latlng.lng));
  addCrosshairControl(mapObj, (la,lo)=>offlineAddCorner(la,lo), '◎ 十字の位置に角を打つ');
  // 保存の途中で画面を離れて戻ってきた場合は、進捗と「保存中」の状態を復元する
  if(PACK_DL){ const btn=$('#omapSaveBtn'); if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
    const prog=$('#omapProg');
    if(prog) prog.innerHTML=`<div class="card"><div class="small" id="omapProgTxt">保存中…（進捗は次の区切りで更新されます）</div>
      <button class="btn ghost" style="margin-top:8px; width:auto; padding:6px 12px;" onclick="offlineAbort()">中断</button></div>`; }
}
function offlineAddCorner(lat, lon){
  PK_PTS.push([lat,lon]);
  offlineRedrawShape();
  if(PK_PTS.length>=3) offlineEstimate();
}
function offlineUndoCorner(){ PK_PTS.pop(); offlineRedrawShape();
  if(PK_PTS.length>=3) offlineEstimate(); else offlineClearEst(); }
function currentPoly(){ return PK_PTS.length>=3 ? PK_PTS.slice() : null; }
function offlineRedrawShape(){
  if(!mapObj) return;
  if(PK_SHAPE){ try{ mapObj.removeLayer(PK_SHAPE); }catch(e){} PK_SHAPE=null; }
  PK_DOTS.forEach(d=>{ try{ mapObj.removeLayer(d); }catch(e){} }); PK_DOTS=[];
  PK_PTS.forEach(p=>{ PK_DOTS.push(
    L.circleMarker(p,{radius:5,color:'#e0a030',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(mapObj)); });
  if(PK_PTS.length>=3)
    PK_SHAPE=L.polygon(PK_PTS,{color:'#e0a030',weight:2,fillOpacity:.12}).addTo(mapObj);
  else if(PK_PTS.length===2)
    PK_SHAPE=L.polyline(PK_PTS,{color:'#e0a030',weight:2,dashArray:'5,5'}).addTo(mapObj);
}
function offlineUseView(){
  if(!mapObj) return;
  const b=mapObj.getBounds();
  PK_PTS=[[b.getNorth(),b.getWest()],[b.getNorth(),b.getEast()],
          [b.getSouth(),b.getEast()],[b.getSouth(),b.getWest()]];
  offlineRedrawShape(); offlineEstimate();
}
function offlineClearEst(){ const el=$('#omapEst');
  if(el) el.innerHTML='<div class="small muted">3点以上囲むと、枚数と容量の見積りが出ます。</div>'; }
function offlineClearRect(){ PK_PTS=[]; offlineRedrawShape(); offlineClearEst(); }
// ズーム・種類の選択（選び直したら即・見積りし直す）
function pickPackZoom(btn){ btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); offlineEstimate(); }
function togglePackLayer(btn){ btn.classList.toggle('on'); offlineEstimate(); }
function offlineZoomMax(){ const v=segVal('packZoom')||''; const m=v.match(/z(\d+)/); return m?+m[1]:PACK_MAXZOOM; }
function offlineLayers(){ const l=segVals('packLayers').split('・').filter(Boolean);
  return l.length?l:['標準地図']; }
function offlineEstimate(){
  const el=$('#omapEst'); if(!el) return;
  const poly=currentPoly();
  if(!poly){ offlineClearEst(); return; }
  const est = packEstimate({poly}, offlineZoomMax(), offlineLayers());
  const min = Math.max(1, Math.round(est.count/300));
  const warn = est.count>PACK_WARN_TILES;
  el.innerHTML = `<div class="small"><b>約 ${est.count.toLocaleString()} 枚 ／ 約 ${est.mb.toFixed(0)} MB</b>
    <span class="muted">（ダウンロード目安 ${min}分前後）</span></div>
    ${ warn ? `<div class="small" style="color:var(--warn); margin-top:6px">
      範囲が広い／細かすぎます。囲みを小さくするか、細かさを下げると軽くなります。</div>` : '' }
    <div class="tiny muted" style="margin-top:6px">${esc(offlineLayers().join('・'))}／z${PACK_MINZOOM}〜${offlineZoomMax()}</div>`;
}
async function offlineSave(sv){
  if(!writeAllowed()) return;
  if(PACK_DL){ toast('別の保存が進行中です'); return; }   // 二重起動防止
  const poly=currentPoly();
  if(!poly){ toast('先に地図で3点以上囲んでください'); return; }
  if(!(navigator.serviceWorker && navigator.serviceWorker.controller)){
    toast('この環境では保存できません（公開URLをホーム画面に追加して使ってください）'); return; }
  const layers=offlineLayers(), zmax=offlineZoomMax();
  const est=packEstimate({poly}, zmax, layers);
  if(est.count > 40000){ alert('範囲が大きすぎます（約'+est.count.toLocaleString()+'枚）。囲みを小さくするか、細かさを下げてください。'); return; }
  // 「実際に増える容量」を先に求める（新規範囲のうち保存済みタイルは増えない）。
  // 空き容量・累積上限の両方の判定にこの差分を使う——全数保存済みの補完・再保存を誤って拒否しないため
  let newMb=est.mb;
  try{ const hc=await swAsk({type:'countPack', urls:est.urls}, 60000);
    if(hc && typeof hc.count==='number' && hc.count>=0 && est.count>0)
      newMb = est.mb * Math.max(0, est.count-hc.count) / est.count; }catch(e){}
  // 端末の空き容量を確認する。タイルと写真・録音（IndexedDB）は同じ保存枠を使うため、
  // 写真・録音のための余裕（300MB）を差し引いても収まるときだけ保存する
  try{
    if(navigator.storage && navigator.storage.estimate){
      const es=await navigator.storage.estimate();
      const free=(es.quota||0)-(es.usage||0);
      if(free>0 && free < newMb*1024*1024 + 300*1024*1024){
        alert(`端末の空き保存領域が足りません（この保存で増える約${newMb.toFixed(0)}MB＋写真・録音用の余裕300MBが必要）。\n囲みを小さくするか、古い保存範囲・不要な写真を整理してください。`); return; }
    }
  }catch(e){}
  // 保存済みパックの累積上限（合計2GBまで）。1回の上限だけでは繰り返し保存で膨らむため。
  // 合計は原則キャッシュの実測（範囲が重なって共有されるタイルを二重に数えない）。
  // 実測できないとき（SW未制御など）だけメタ情報の合算で概算する（同一sig＝置き換え分は除外）
  const sigKey=JSON.stringify({p:poly, z:zmax, l:layers});
  const packSig=x=>JSON.stringify({p:x.poly, z:x.zmax, l:x.layers});
  let totalMb;
  try{
    const st=await swAsk({type:'packStats'}, 60000);
    if(!st || st.error || typeof st.bytes!=='number') throw new Error('stats-fail');
    totalMb = st.bytes/1048576 + newMb;   // 実測＋実際に増える分（重なる範囲を二重に数えない）
  }
  // 実測できないときの代替は安全側（全量計上＝過大寄り）。newMbを使うと同一範囲の既存分が漏れて過少計上になり得る
  catch(e){ totalMb = packStore().filter(x=>packSig(x)!==sigKey).reduce((a,p)=>a+(+p.mb||0), 0) + est.mb; }
  if(totalMb > 2048){
    alert(`オフライン地図の合計が約${Math.round(totalMb)}MBになり、上限（2GB）を超えます。先に使っていない保存範囲を削除してください。`); return; }
  if(est.count > PACK_WARN_TILES && !confirm(`約 ${est.count.toLocaleString()} 枚（${est.mb.toFixed(0)}MB）を保存します。時間がかかり、端末の空きも使います。続けますか？`)) return;

  // アプリ更新直後は旧SWが残っていて新しい依頼に応答できないことがある。先に疎通と対応版を確認する
  try{ const pg=await swAsk({type:'ping'}, 3000);
    if(!pg || !(+pg.v>=78) || !(+pg.feat>=2)) throw new Error('old-sw'); }
  catch(e){ toast('地図保存の準備ができていません。アプリを一度閉じて、開き直してからお試しください', 5000); return; }

  // ダウンロードを始める前に、まず「一部のみ・0枚」として一覧に登録しておく。
  // こうすると (1)一覧に記録できない状態なら1枚も落とす前に止まる（隠れタイルの取り消し処理が不要）
  // (2)保存中に再読み込み・アプリ終了しても、落ちた分は「一部のみ」カードから見えて削除・補完できる
  const mine={ id:uuid(), name:(DB.survey(sv)||{}).name||'保存範囲',
    poly, bbox:polyBounds(poly),
    zmin:PACK_MINZOOM, zmax, layers, count:est.count,
    mb:0, ok:0, status:'partial', saved_at:nowISO() };
  {
    // 仮登録の時点では同じ範囲の既存カードを消さない（保存中に落ちても、完全保存済みの記録を
    // 「一部のみ・0枚」に後退させないため）。既存分の整理は完了確定のときに行う
    const list=packStore();
    list.unshift(mine);
    if(!packSave(list)){
      toast('端末の記録領域が足りず、保存の記録が作れません。空き容量を確保してからお試しください', 5000); return; }
  }

  const btn=$('#omapSaveBtn'); if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
  const prog=$('#omapProg');
  PACK_DL={ abort:false };
  // 7枚ずつ: SW側は1枚15秒打ち切りのため、1依頼は最悪でも 7×15=105秒 ＜ 応答待ち120秒。
  // 「画面が打ち切ったのにSW側の処理が長く残って待ち行列が伸びる」状態を構造的に作らない
  const urls=est.urls, CH=7; let done=0, ok=0, fail=0;
  if(prog) prog.innerHTML=`<div class="card"><div class="small" id="omapProgTxt">準備中…</div>
    <button class="btn ghost" style="margin-top:8px; width:auto; padding:6px 12px;" onclick="offlineAbort()">中断</button></div>`;
  for(let i=0;i<urls.length && !PACK_DL.abort;i+=CH){
    const chunk=urls.slice(i,i+CH);
    try{ const r=await swAsk({type:'savePackTiles', urls:chunk}); ok+=r.ok||0; fail+=r.fail||0; }
    catch(e){ fail+=chunk.length; }
    done+=chunk.length;
    const t=$('#omapProgTxt');
    if(t) t.textContent=`${Math.min(done,urls.length).toLocaleString()} / ${urls.length.toLocaleString()} 枚`
      + (fail?`（取れなかった ${fail} 枚）`:'');
  }
  const aborted=PACK_DL.abort; PACK_DL=null;
  // 実際に保存できた枚数をキャッシュから数え直す。応答待ちを打ち切ったチャンクの分も
  // SW側では保存が続いているため、途中経過の数字ではなく実態を最終結果にする。
  // SWのタイル通信は1枚15秒で打ち切られるため待ち行列は必ず掃ける。5分×最大3回まで待つ
  for(let attempt=0; attempt<3; attempt++){
    try{ const rc=await swAsk({type:'countPack', urls}, 300000);
      if(rc && typeof rc.count==='number' && rc.count>=0){ ok=rc.count; fail=urls.length-ok; }
      break;
    }catch(e){ /* 時間切れ→キューが掃けるのを待ってもう一度 */ }
  }
  if(btn){ btn.disabled=false; btn.textContent='💾 この範囲を保存'; }

  // 事前登録した項目を最終結果で確定する（0枚なら登録ごと取り下げ）
  {
    let list=packStore();
    const idx=list.findIndex(x=>x.id===mine.id);
    if(ok<=0){
      if(idx>=0){ list.splice(idx,1);
        if(!packSave(list)) toast('⚠ 一覧の整理に失敗しました。「0枚」のカードが残った場合は削除してください', 5000); }
      toast('保存できませんでした（電波状況と端末の空き容量を確認してください）', 4000);
    }else{
      // 中断しても実枚数が全数そろっていれば「完全」（既存full範囲の再保存を中断してもカードを後退させない）
      const partial = fail>0 || (aborted && ok<urls.length);
      const fin=Object.assign({}, mine, {
        ok, status: partial?'partial':'full',
        mb: est.count ? est.mb*ok/est.count : est.mb,   // 容量は実枚数比で補正
        saved_at: nowISO() });
      // 確定のタイミングで、同じ範囲・設定の古いカードを整理して置き換える（仮登録時は消していない）
      list=list.filter(x=> x.id===mine.id || packSig(x)!==sigKey);
      const idx2=list.findIndex(x=>x.id===mine.id);
      if(idx2>=0) list[idx2]=fin; else list.unshift(fin);
      if(!packSave(list)){
        // 確定の書き込みに失敗しても、事前登録（一部のみ・0枚）が残っているので隠れタイルにはならない
        toast('⚠ 保存はできましたが一覧の更新に失敗しました。一覧の枚数表示が実際より少ないことがあります（保存し直すと直ります）', 6000);
      }else if(aborted && partial){
        toast('中断しました（そこまでの分は「一部のみ」として一覧に残しました。保存し直すと続きから再開します）', 4000);
      }else if(aborted){
        toast(`保存しました（${ok.toLocaleString()}枚。中断前にすべて揃っていました）`, 3000);
      }else if(fail>0){
        toast(`一部のみ保存しました（${ok.toLocaleString()} / ${urls.length.toLocaleString()}枚）。電波の良い場所で同じ範囲を保存し直すと補完されます`, 5000);
      }else{
        toast(`保存しました（${ok.toLocaleString()}枚）`, 3000);
      }
    }
  }
  // 完了時の画面更新は、この画面を見ているときだけ（他画面で入力中に画面を作り直すと入力が消えるため）
  if((STACK[STACK.length-1]||{}).name==='offlineMap') render();
}
function offlineAbort(){ if(PACK_DL) PACK_DL.abort=true; }
// 保存済みカードの範囲・設定を画面に呼び出す（「一部のみ」の補完や設定を変えた保存し直しを、囲みを手で再現せずにできるように）
function recallPack(id){
  const p=packStore().find(x=>x.id===id); if(!p || !mapObj) return;
  PK_PTS=(p.poly||[]).map(q=>[+q[0],+q[1]]);
  document.querySelectorAll('[data-seg="packZoom"] button').forEach(b=>{
    b.classList.toggle('on', b.textContent.startsWith('z'+p.zmax)); });
  document.querySelectorAll('[data-seg="packLayers"] button').forEach(b=>{
    b.classList.toggle('on', (p.layers||[]).includes(b.textContent)); });
  offlineRedrawShape(); offlineEstimate();
  try{ mapObj.fitBounds(p.poly, {padding:[30,30], maxZoom:FIT_MAX_ZOOM}); }catch(e){}
  toast('保存済みの範囲を呼び出しました。「💾 この範囲を保存」で補完・更新できます', 3500);
}
async function deleteMapPack(id){
  if(!writeAllowed()) return;
  const list=packStore(); const p=list.find(x=>x.id===id); if(!p) return;
  if(!confirm(`「${p.name||'保存範囲'}」の地図（約${(+p.mb).toFixed(0)}MB）を消しますか？\n※他の保存範囲でも使っている分は残します`)) return;
  const area = (p.poly && p.poly.length>=3) ? {poly:p.poly} : p.bbox;
  // **他の保存範囲と重なっている分は消さない。**
  // 一緒に消すと、残した方の地図に穴が開くのに、一覧は「保存済み」のままになる
  // （圏外の現場で初めて気づくことになる。2026-08-28 全体監査 Major）
  const 残す=new Set();
  list.filter(x=>x.id!==id).forEach(o=>{
    const oa=(o.poly && o.poly.length>=3) ? {poly:o.poly} : o.bbox;
    try{ packTileUrls(oa, o.zmax, o.layers||[]).forEach(u=>残す.add(u)); }catch(e){}
  });
  // タイルの削除が成功したときだけ一覧から外す（失敗時に一覧だけ消すと、消せない隠れタイルが残るため）
  let okDel=false;
  try{ const r=await swAsk({type:'deletePack', urls:packTileUrls(area, p.zmax, p.layers).filter(u=>!残す.has(u))});
    okDel = !!(r && typeof r.deleted==='number'); }catch(e){}
  if(!okDel){ toast('削除に失敗しました（処理が混み合っている可能性）。少し待ってからもう一度お試しください', 4000); return; }
  if(!packSave(list.filter(x=>x.id!==id))){
    toast('⚠ タイルは削除しましたが一覧の更新に失敗しました。もう一度「削除」を押してください', 5000); return; }
  toast('消しました');
  if((STACK[STACK.length-1]||{}).name==='offlineMap') render();
}
async function offlineStats(){
  const el=$('#omapStats'); if(el) el.textContent='確認中…';
  try{ const r=await swAsk({type:'packStats'});
    if(!r || r.error || typeof r.count!=='number') throw new Error('stats-fail');   // 計測失敗を0枚と誤表示しない
    if(el) el.textContent=`実際の保存量：${r.count.toLocaleString()}枚 ／ 約${((r.bytes||0)/1024/1024).toFixed(0)}MB`;
  }catch(e){ if(el) el.textContent='確認できませんでした'; }
}

/* ============================================================
   書き出し（CSV / GeoJSON / JSONバックアップ）
   ============================================================ */
function download(filename, text, mime){
  downloadBlob(filename, new Blob([text],{type:mime||'text/plain;charset=utf-8'}));
}
function downloadBlob(filename, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function audioFilename(o,i,a){ return `${o.uuid}_${i+1}.${(a&&a.ext)||'webm'}`; }

/* ---------- 録音ZIP（無圧縮・追加ライブラリ不要） ---------- */
function crc32(u8){ let c=~0>>>0; for(let i=0;i<u8.length;i++){ c^=u8[i];
  for(let k=0;k<8;k++) c=(c>>>1)^(0xEDB88320 & -(c&1)); } return (~c)>>>0; }
function buildZip(files){
  const enc=new TextEncoder(); const parts=[]; const central=[]; let offset=0;
  const u16=n=>[n&255,(n>>8)&255]; const u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{
    const name=enc.encode(f.name); const data=f.u8; const crc=crc32(data);
    const lh=[].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0x0800), u16(0), u16(0), u16(0),

  if(totalBytes >= 0.8*GB && !confirm('約'+(totalBytes/GB).toFixed(1)+'GBあります。ZIP作成に時間がかかり、端末によっては失敗します。続けますか？')) return;

  if(tl.length) files.push({ name:'training_labels.csv', u8:new TextEncoder().encode('﻿# training-labels v1\r\n'

    // 面のうち行動範囲・営巣範囲などは、確認種には載せるが羽数には数えない
    DB.flightsOf(s.uuid).forEach(f=>{ if(!traceDrawable(f)) return;
      addRec(s, f.species_name_snapshot, {individual_key:f.individual_key||'', count:f.count},
        '飛翔', f.behavior, !!f.species_name_snapshot, countsAsIndividuals(f)); });
  });
  const names=Object.keys(bySp);
  // AIだけで出た種（目視・飛翔の記録が無い）。確認種には数えず、表の末尾に「AIのみ」として並べる
  const aiOnly=Object.keys(aiCnt).filter(n=>!bySp[n]).sort((a,b)=>{ const sa=speciesByName(a), sb=speciesByName(b);
    return (sa?sa.species_id:99999)-(sb?sb.species_id:99999) || a.localeCompare(b); });
  if(!names.length && !aiOnly.length){ toast('書き出す観察記録がありません'); return; }
  // 目印が同じ記録は「同じ1羽」。いちばん多い個体数を、その記録の種に1回だけ足す
  svRecs.forEach((list, su)=>{
    const best=new Map();
    list.forEach(r=>{
      if(!r.key){ const m=bySp[r.sp]; m.bySurvey[su]=(m.bySurvey[su]||0)+r.c; return; }
      const cur=best.get(r.key);
      // 種は最初に出てきたものに固定し、個体数だけ多い方を採る（集計画面と同じ扱い）
      if(cur==null) best.set(r.key, {sp:r.sp, c:r.c});
      else if(r.c>cur.c) best.set(r.key, {sp:cur.sp, c:r.c});
    });
    best.forEach(v=>{ const m=bySp[v.sp]; m.bySurvey[su]=(m.bySurvey[su]||0)+v.c; });
  });
  names.forEach(nm=>{ const m=bySp[nm];
    m.total=Object.keys(m.bySurvey).reduce((n,su)=>n+m.bySurvey[su], 0);
  });
  // 種の分類順（種名マスタの並び）でソート。未同定・マスタ外は末尾
  const ord=nm=>{ const sp=speciesByName(nm); return sp? sp.species_id : 99999; };
  names.sort((a,b)=>ord(a)-ord(b)||a.localeCompare(b));

  // 1) 種一覧表
  // 「延べ個体数」＝記録された数の単純合計、「実数」＝同じ鳥（目印が同じ記録）を1羽と数えた値。
  // 集計画面と同じ分け方。1つの数字だけ出すと、どちらの意味か取り違えられる
  // 「鳴き声AI（回数）」は末尾に足す（列の順番で読む外部の表をずらさない）。AIの候補なので聞き違いを含む
  const listCols=['和名','学名','延べ個体数','実数（同一個体の重複除外）','記録件数','確認方法','繁殖ランク','環境省RL','北海道RL','種の保存法','天然記念物','鳴き声AI（回数）'];
  const listRows=names.map(nm=>{ const m=bySp[nm]; const sp=speciesByName(nm);
    return [nm, sp?sp.scientific_name:'', m.totalRaw, m.total, m.records, [...m.methods].join('・'),
      (BREED_LABEL[m.rank]||''), csvConserv(nm,'e'), csvConserv(nm,'k'), csvConserv(nm,'h'), csvConserv(nm,'t'), aiCnt[nm]||''];
  }).concat(aiOnly.map(nm=>{ const sp=speciesByName(nm);
    return [nm, sp?sp.scientific_name:'', '', '', '', '鳴き声AIのみ（確認種には数えない）', '', csvConserv(nm,'e'), csvConserv(nm,'k'), csvConserv(nm,'h'), csvConserv(nm,'t'), aiCnt[nm]]; }));
  const listCsv='﻿'+[listCols.join(',')].concat(listRows.map(r=>r.map(csvCell).join(','))).join('\r\n');
  download(`${base}_species_list.csv`, listCsv, 'text/csv;charset=utf-8');

  // 2) 地点×種マトリクス（行=種, 列=調査（一意）, 値=実数＝同一個体の重複除外）。同名の別回次でも列を分ける
  const matCols=['和名（値は実数＝同一個体の重複除外）'].concat(svCols.map(c=>c.label));
  const matRows=names.map(nm=>{ const m=bySp[nm];
    return [nm].concat(svCols.map(c=>m.bySurvey[c.uuid]||0)); });
  const matCsv='﻿'+[matCols.map(csvCell).join(',')].concat(matRows.map(r=>r.map(csvCell).join(','))).join('\r\n');
  download(`${base}_site_species_matrix.csv`, matCsv, 'text/csv;charset=utf-8');

  // 3) 止まり・巣の明細（新しく記録できるようになった項目を、報告書でも使えるように出す）
  const detCols=['調査','記録ID','同一個体の目印','和名','観察日時',
    '鳥の緯度','鳥の経度','止まっていたもの','高さ・サイズ','樹種の分類','樹種名','樹高(m)','人工物','メモ',
    '巣の緯度','巣の経度','営巣木の樹種','営巣木の樹高(m)','巣の状態'];
  const detRows=[];
  // 巣の代表を先に決める（地図・書き出しと同じ見分け方）。代表以外は巣の列を空にする。
  // 代表の行には、同じ巣の他の記録から補った内容（位置だけ・状態だけの分）を重ねて出す
  const nestRepMap=new Map(nestGroups(surveys.reduce((a,s)=>a.concat(DB.obsOf(s.uuid)),[])).map(o=>[o.uuid,o]));
  const nestRep=new Set(nestRepMap.keys());
  surveys.forEach(s=>{ DB.obsOf(s.uuid).forEach(o=>{
    const hasPerch=[o.perch_type,o.perch_size,o.perch_class,o.perch_species,o.perch_height,o.perch_artificial,o.perch_note].some(Boolean);
    const tp=coordPair(o.target_latitude,o.target_longitude);
    const np=coordPair(o.nest_latitude,o.nest_longitude);
    const hasTarget=!!tp[0];
    const hasNest=!!np[0]||o.nest_state||o.nest_tree_species||o.nest_tree_height;
    if(!hasPerch && !hasTarget && !hasNest) return;
    // 同じ巣が複数の記録に写されている分は、巣の列だけ空にして二重に数えないようにする
    const dup = hasNest && !nestRep.has(o.uuid);
    detRows.push([svLabel(s), o.uuid, o.individual_key||'', o.species_name_snapshot||'（未同定）', isoLocal(o.observed_at),
      tp[0], tp[1],
      o.perch_type||'', o.perch_size||'', o.perch_class||'', o.perch_species||'', o.perch_height||'',
      o.perch_artificial||'', o.perch_note||'',
      dup?'':coordPair((nestRepMap.get(o.uuid)||o).nest_latitude,(nestRepMap.get(o.uuid)||o).nest_longitude)[0],
      dup?'':coordPair((nestRepMap.get(o.uuid)||o).nest_latitude,(nestRepMap.get(o.uuid)||o).nest_longitude)[1],
      dup?'':((nestRepMap.get(o.uuid)||o).nest_tree_species||''),
      dup?'':((nestRepMap.get(o.uuid)||o).nest_tree_height||''),
      dup?'':((nestRepMap.get(o.uuid)||o).nest_state||'')]);
  }); });
  if(detRows.length){
    const detCsv='\ufeff'+[detCols.map(csvCell).join(',')].concat(detRows.map(r=>r.map(csvCell).join(','))).join('\r\n');
    download(`${base}_perch_nest.csv`, detCsv, 'text/csv;charset=utf-8');
  }
  toast('報告書用（種一覧・地点×種'+(detRows.length?'・止まり/巣':'')+'）を書き出しました');
}
function exportGeoJSON(surveys, base){
  // 観察者の位置・鳥がいた場所・巣の位置は別々の点として出す。
  // 観察者の位置だけで絞ると、測位が取れなかった記録の鳥や巣が丸ごと落ちてしまう
  const rows=buildRows(surveys);
  // 有効かどうかの判定は地図・案内と同じ validLatLon を使う。
  // 別々に判定すると「緯度91」のような値が書き出しにだけ出て、件数も食い違う
  const has=(r,la,lo)=>validLatLon(String(r[la]||''), String(r[lo]||''));
  const fcOf=(list,la,lo)=>({ type:'FeatureCollection', features:list.map(r=>({
    type:'Feature',
    geometry:{ type:'Point', coordinates:[parseFloat(r[lo]), parseFloat(r[la])] },
    properties: CSV_COLS.reduce((p,c)=>{ p[c]=r[c]; return p; }, {})
  }))});
  let n=0;
  const put=(list,la,lo,name)=>{ if(!list.length) return;
    download(`${base}_${name}.geojson`, JSON.stringify(fcOf(list,la,lo),null,1), 'application/geo+json'); n++; };
  put(rows.filter(r=>has(r,'latitude','longitude')), 'latitude','longitude', 'observations');
  put(rows.filter(r=>has(r,'target_latitude','target_longitude')), 'target_latitude','target_longitude', 'bird_positions');
  // 同じ巣が複数の記録に写されているので、1件にまとめる
  // 巣は生の記録から代表を決める（buildRows の行には updated_at が無く、「最新を基準」が働かないため）。
  // 代表の補完済みの内容を、その記録の書き出し行に重ねて出す
  const nestReps=uniqNests(surveys.reduce((a,sv)=>a.concat(DB.obsOf(sv.uuid)),[]));
  const rowByObs=new Map(rows.map(r=>[r.observation_id, r]));
  const nestRows=nestReps.map(o=>{
    const r=Object.assign({}, rowByObs.get(o.uuid)||{});
    ['nest_id','nest_tree_species','nest_tree_height','nest_state'].forEach(k=>{ r[k]=o[k]||''; });
    // 座標は数値の0を落とさない書き方で写す
    r.nest_latitude=coordStr(o.nest_latitude); r.nest_longitude=coordStr(o.nest_longitude);
    return r;
  }).filter(r=>r.observation_id);
  put(nestRows, 'nest_latitude','nest_longitude', 'nests');
  if(!n){ toast('位置付きの記録がありません'); return; }
  toast('GeoJSONを書き出しました（'+n+'ファイル）');
}
// 飛翔経路をGeoJSON出力（QGISで使える）。
// 線は LineString、面（旋回上昇・行動範囲・営巣範囲）は Polygon。
// 線は生データ版（タップ点そのまま）と曲線版（滑らかにした線）の2ファイル、
// 面は**滑らかにしない**ので1ファイル（丸めると囲った範囲が変わってしまう）
function flightFeature(s,f,path){
  const area=isArea(f);
  // 面は始点で閉じた輪にする（GeoJSONのPolygonは最初と最後が同じ点である決まり）
  const first=path[0], last=path[path.length-1];
  const ring=(area && first && last && (first[0]!==last[0] || first[1]!==last[1]))
    ? path.concat([first]) : path;
  // 大きさの読み方は traceMetric に一本化する（線は長さ・面は面積）。
  // 渡された経路（曲線版もある）で測る
  const m=traceMetric({shape:shapeOf(f), path});
  return { type:'Feature',
    geometry: area
      ? { type:'Polygon', coordinates:[ ring.map(p=>[p[1],p[0]]) ] }   // [lon,lat]
      : { type:'LineString', coordinates: path.map(p=>[p[1],p[0]]) },
    properties:{ survey_id:s.uuid, survey_name:s.name, flight_id:f.uuid,
      species_name:f.species_name_snapshot||'', age_class:ageNorm(f.age_class), individual_label:f.individual_label||'',
      start_time:isoLocal(f.start_time), end_time:isoLocal(f.end_time),
      height_class:f.height_class||'', behavior:f.behavior||'', count:indCount(f.count),
      individual_key:f.individual_key||'',
      // 形と面の種類。線のときは面の種類・面積を空にする（読む側が形で分けられるように）
      shape:shapeOf(f), area_type:area?(f.area_type||''):'',
      // 1点目が前の経路の終点から続けて描いた点か（つなぎ目の「終」を出すかの判断に使う）
      continued_start: (!area && isTrueFlag(f.continued_start)) ? 'TRUE' : 'FALSE',
      // 線の途中の◎（旋回上昇）。[{lat,lon,r_m}] を文字にしたもの。無ければ空
      soar_spots: area ? '' : (soarSpotsOf(f).length ? JSON.stringify(soarSpotsOf(f).map(x=>({lat:x.lat, lon:x.lon, r_m:x.r}))) : ''),
      length_m: area?'':m.length_m,
      area_m2: area?m.area_m2:'',
      audio_file:(f.audio||[]).map((a,i)=>flightAudioFilename(f,i,a)).join(';'),
      media_file:(f.media||[]).map((m2,i)=>flightMediaFilename(f,i,m2)).join(';'),
      memo:f.memo||'' } };
}
function exportFlightsGeoJSON(surveys, base){
  const raw=[], smooth=[], areas=[];
  surveys.forEach(s=>{ DB.flightsOf(s.uuid).forEach(f=>{
    const path=(f.path||[]).filter(validPathPt);
    if(!traceDrawable(f)) return;   // 点数の判定は1か所（線2点・面3点）
    if(isArea(f)){ areas.push(flightFeature(s,f,path)); return; }   // 面は滑らかにしない
    raw.push(flightFeature(s,f,path));
    smooth.push(flightFeature(s,f,smoothPath(path)));
  });});
  if(!raw.length && !areas.length){ toast('書き出す飛翔経路がありません'); return; }
  const done=[];
  if(raw.length){
    download(`${base}_flights.geojson`, JSON.stringify({type:'FeatureCollection', features:raw}, null, 1), 'application/geo+json');
    download(`${base}_flights_smooth.geojson`, JSON.stringify({type:'FeatureCollection', features:smooth}, null, 1), 'application/geo+json');
    done.push('経路（生・曲線）');
  }
  if(areas.length){
    download(`${base}_areas.geojson`, JSON.stringify({type:'FeatureCollection', features:areas}, null, 1), 'application/geo+json');
    done.push('範囲（面）');
  }
  toast('GeoJSONを書き出しました：'+done.join('・'));
}

function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(r.error||new Error('base64変換失敗')); r.readAsDataURL(blob); }); }
function b64ToBlob(b64,mime){ const bin=atob(b64||''); const u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return new Blob([u8],{type:mime||'application/octet-stream'}); }
// 全コレクションを厳格読取（1つでも破損・読取失敗なら例外）。空データでlatestを上書きする事故を防ぐ
function coreCollectionsRaw(){
  return { surveys:DB.loadRaw(DB.key.sv), observations:DB.loadRaw(DB.key.ob), notes:DB.loadRaw(DB.key.nt),
    hypotheses:DB.loadRaw(DB.key.hy), hyp_results:DB.loadRaw(DB.key.hr), flights:DB.loadRaw(DB.key.fl) };
}
// 記録のみ（軽い・base64なし）。頻繁な自動バックアップ用。読取失敗時は例外を投げて中止させる。
// opts.onlyValid: ドライブ同期用。壊れた記録・削除記録・図鑑項目を含めない。
// 受信側（validateBackupData）は1件でも不正だと全体を拒否するため、壊れたデータを配ると
// 他端末の同期を丸ごと止めてしまう。除外した分はホームの警告カードで知らせ、修復すれば次回から同期に載る。
// フォルダ自動保存・手動バックアップは全件のまま（壊れたデータの救出経路を塞がない）
function buildRecordsBackup(opts){
  opts=opts||{};
  const c=coreCollectionsRaw();
  let recent=DB.recentSpecies(), guide=myguideList(), tombs=tombstonesList();
  if(opts.onlyValid){
    // 除外した親のuuid。親の種類別に持つ（共通の集合にすると、偶然同じIDを持つ別種類の記録が
    // 除外されただけで、正常な親を参照する子まで巻き添えで除外されるため）。
    // 数値uuidの親（旧データ）は文字列化した値で登録する（子の参照は文字列で残っていることがある）
    const dropped={ surveys:new Set(), hypotheses:new Set() };
    const idOf=x=>{ if(!x || typeof x!=='object') return null;
      if(typeof x.uuid==='string' && x.uuid) return x.uuid;
      if(typeof x.uuid==='number' && isFinite(x.uuid)) return String(x.uuid);
      return null; };
    for(const name of ['surveys','observations','notes','hypotheses','hyp_results','flights']){
      // 入れ物ごと壊れている場合は部分的に配らず中止（点検・修復へ誘導）
      if(!Array.isArray(c[name])) throw new Error('「'+name+'」のデータが壊れています。ホームの「データ点検・修復」で直してください');
      c[name]=c[name].filter(x=>{ if(okRecord(name,x)) return true;
        const iv=idOf(x); if(iv && dropped[name]) dropped[name].add(iv);
        return false; });
    }
    // 親が除外された子は一緒に除外する。子だけ配ると、受け取り側に「どの一覧からも
    // たどれない記録」が固定化されるため。親を修復すれば次回から親子そろって同期される
    for(const n of ['observations','notes','hypotheses','flights']){
      c[n]=c[n].filter(x=>{ if(x.survey_uuid && dropped.surveys.has(x.survey_uuid)){
        if(n==='hypotheses'){ const iv=idOf(x); if(iv) dropped.hypotheses.add(iv); }   // 仮説の道連れは検証結果へ連鎖
        return false; } return true; });
    }
    c.hyp_results=c.hyp_results.filter(x=>!(x.hypothesis_uuid && dropped.hypotheses.has(x.hypothesis_uuid)));
    // tombstonesListは型しか検査しないため、日時が壊れた削除記録（受信側が拒否する）をここで確実に除く
    tombs=tombs.filter(okTombstone);
    guide=Array.isArray(guide)?guide.filter(g=>g!=null && okGuideItem(g)):[];
    recent=Array.isArray(recent)?recent.filter(s=>typeof s==='string'):[];
  }
  return { app:'bird_survey', kind:'records', version:6, exported_at:nowISO(),
    surveys:c.surveys, observations:c.observations, notes:c.notes,
    hypotheses:c.hypotheses, hyp_results:c.hyp_results, flights:c.flights,
    recent, myguide:guide, tombstones:tombs };
}
// 全部（録音・写真をbase64同梱）。重い。メディア読取や記録読取に失敗したら例外を投げて中止（空上書き防止）

// AI を読めなければ例外で中止する（AI が欠けた控えを「全部」として書かない）
async function buildFullBackup(opts){
  opts=opts||{};

  const audio=[], media=[];
  const metasA=await AudioDB.all();   // 失敗時は reject が伝播し buildFullBackup 全体が失敗する
  for(const a of metasA){ if(!a||!a.blob) continue;
    audio.push({ id:a.id, mime:a.mime, ext:a.ext, dur:a.dur, size:a.size, obs_uuid:a.obs_uuid, flight_uuid:a.flight_uuid,
      created_at:a.created_at, b64:await blobToB64(a.blob) }); }
  const metasM=await PhotoDB.all();
  for(const m of metasM){ if(!m||!m.blob) continue;
    media.push({ id:m.id, kind:m.kind, mime:m.mime, ext:m.ext, size:m.size, name:m.name, obs_uuid:m.obs_uuid, flight_uuid:m.flight_uuid,
      created_at:m.created_at, b64:await blobToB64(m.blob) }); }
  const out={ app:'bird_survey', version:6, exported_at:nowISO(),
    surveys:c.surveys, observations:c.observations, notes:c.notes,
    hypotheses:c.hypotheses, hyp_results:c.hyp_results, flights:c.flights,
    recent:DB.recentSpecies(), myguide:myguideList(), tombstones:tombstonesList(), audio, media };
  if(opts.withAi) out.ai=await aiBackupPart();
  return out;
}

function cloudCfg(){ try{ return JSON.parse(localStorage.getItem('bs_cloud')||'{}'); }catch(e){ return {}; } }

// 注意: no-cors では応答(HTTPステータス・本文)を一切読めないため、fetchが解決しても「相手が保存できたか」は確認できない。
// よって「送信した時刻」だけを記録し、UIでも「保存確認済み」とは表示しない。
function cloudPost(kind, dataObj, opts){
  const c=cloudCfg(); if(!c.url) return Promise.reject(new Error('未設定'));
  return fetch(c.url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},

    .then(()=>{
      // 自動経路では、送信中に取引が始まった古い世代の内容を「最新保存済み」と表示しない
      if(opts && opts.noStamp) return;
      localStorage.setItem('bs_cloud_sent', nowISO()); localStorage.setItem('bs_cloud_last_kind', kind);
    });
}
// 戻り値の sent で「本当に送ったか」を伝える。送っていないのに成功表示を出さないため
function cloudBackupRecords(){ if(!cloudCfg().url) return Promise.resolve({sent:false, why:'未設定'});
  const gen0=BACKUP_GEN;

  return cloudPost('records', data, {noStamp:true}).then(()=>{
    if(gen0!==BACKUP_GEN){ _backupPending=true; return {sent:true, stale:true}; }   // 送信中に取引が始まった＝最新内容の再送を予約（時刻は更新しない）
    localStorage.setItem('bs_cloud_sent', nowISO()); localStorage.setItem('bs_cloud_last_kind', 'records');

let _backupChain=Promise.resolve();

// （2026-08-28 全体監査 Critical）。列は止めずに、本当の結果だけ呼び出し側へ返す
function backupRunStrict(fn){
  const p=_backupChain.then(()=>fn());
  _backupChain=p.catch(()=>{});

}

// 上の「URLで送る」との違い:
//  ・応答をきちんと読む。相手は自宅PCの受け口で、このアプリからの通信を許可してあるため
//    no-cors にする必要がなく、「届いたか」を受領証で確かめられる（従来方式は確認できない）

function dbSendCfg(){ try{ return JSON.parse(localStorage.getItem('bs_dbsend')||'{}'); }catch(e){ return {}; } }

// 宛先の確かめ方。ここを緩くすると、打ち間違いや誘導で「よそのサイト」へ
// 調査記録と位置情報と合言葉をまとめて送ってしまう
function dbSendCheckUrl(raw){
  let u;
  try{ u=new URL(raw); }catch(e){ return {ok:false, why:'アドレスの形になっていません'}; }
  if(u.protocol!=='https:') return {ok:false, why:'https:// で始まるアドレスにしてください'};
  if(u.username||u.password) return {ok:false, why:'アドレスに利用者名・合言葉は入れられません'};
  if(u.search||u.hash) return {ok:false, why:'アドレスに ? や # は付けられません'};
  if(u.pathname!=='/'&&u.pathname!=='') return {ok:false, why:'アドレスの末尾に余計な文字が付いています'};
  // 自分のPC（Tailscale）宛てだけを既定で許す。それ以外は明示的に確かめる
  const home=/\.ts\.net$/i.test(u.hostname);
  return {ok:true, origin:u.origin, home};
}

function dbSendRecords(){

  // 日本語の合言葉は通信の決まりで送れない。ここで止めないと、意味の分からない
