let REC = null; // 録音中コンテキスト { mr, stream, t0, chunks, timer, abort }
function recSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function pickRecMime(){
  const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac','audio/ogg'];
  for(const m of c){ try{ if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}
function mimeExt(m){ m=m||''; if(m.includes('webm'))return 'webm'; if(m.includes('mp4'))return 'm4a';
  if(m.includes('aac'))return 'aac'; if(m.includes('ogg'))return 'ogg'; return 'bin'; }
function fmtDur(s){ s=Math.max(0,Math.round(+s||0)); const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; }

  const genAtCall=_navGen;            // 呼び出し時点の画面世代（_mediaCtxが残っていても画面が変わっていれば開始しない）

    stream.getTracks().forEach(t=>t.stop()); _recStarting=false; aiResume('rec'); return; }
  const mime=pickRecMime();

  const ctx={ mr, stream, t0:Date.now(), chunks:[], timer:null, abort:false,
    target:targetAtCall };

  if((ctx.target.kind==='obs' && SCREENS._obsEditing===false && SCREENS._obs && SCREENS._obs.uuid===ctx.target.uuid) ||

  mr.onstop=()=>{ clearInterval(ctx.timer); stream.getTracks().forEach(t=>t.stop()); aiResume('rec');
    const wasAbort=ctx.abort; REC=null; renderRecPanel();
    let fin=null;
    if(!wasAbort){
      AUDIO_PENDING++;
      // 呼び出しごと Promise の中に入れる。直接呼んで .finally を付ける形だと、
      // Promise が返る前の同期処理（Blob生成など）で例外が出たときに数が戻らず、
      // 「保存中」のまま固まって操作できなくなる（2026-08-05 監査 Major）
      fin = Promise.resolve()
        .then(()=>recFinalize(ctx.chunks, mr.mimeType||mime, ctx.t0, ctx.target))
        .finally(()=>{ AUDIO_PENDING=Math.max(0, AUDIO_PENDING-1); });
    }
    if(typeof quickRecEnded==='function') quickRecEnded(wasAbort, fin); };   // すぐ録音の後始末（通常録音では何もしない）
  REC=ctx; _recStarting=false;
  try{ mr.start(); }
  catch(e){ REC=null; stream.getTracks().forEach(t=>t.stop()); aiResume('rec'); toast('録音を開始できませんでした'); return; }
  ctx.timer=setInterval(updateRecTimer,250); renderRecPanel();
}
function recStop(){ if(REC){ clearInterval(REC.timer); try{ REC.mr.stop(); }catch(e){} } }
function recAbort(){ if(REC){ REC.abort=true; clearInterval(REC.timer); try{ REC.mr.stop(); }catch(e){} } }
function updateRecTimer(){ const el=$('#recTime'); if(el && REC) el.textContent=fmtDur((Date.now()-REC.t0)/1000); }

function recFinalize(chunks, mime, t0, targetAtStart){
  const dur=Math.round((Date.now()-t0)/1000);
  const blob=new Blob(chunks,{type:mime}); if(!blob.size){ toast('録音が空でした'); return Promise.resolve(false); }
  const meta={ id:uuid(), dur, size:blob.size, mime, ext:mimeExt(mime), created_at:nowISO() };
  const target=targetAtStart||mediaTarget();   // 録音開始時点の対象（引数）を優先
  if(target.uuid && DISCARDED.has(target.uuid)){ return Promise.resolve(false); }   // 破棄済みの記録の分は保存しない
  const owner = target.kind==='flight' ? { flight_uuid:target.uuid, obs_uuid:'' } : { obs_uuid:target.uuid };
  // 成否をPromiseで返す（すぐ録音が「保存できてから」成功表示・一覧更新するため）
  return AudioDB.put(Object.assign({}, meta, { blob }, owner)).then(()=>{
    if(!attachMediaMeta(target,'audio',meta)){   // 紐付け失敗（容量不足等）を成功扱いにしない
      toast('録音の保存に失敗しました（空き容量を確認してください）'); return false; }
    scheduleFolderFull(); toast('録音を保存しました'); return true;
  }).catch(()=>{ toast('録音の保存に失敗しました'); return false; });
}
function delAudio(id){
  if(!writeAllowed()) return;
  if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY){ toast('保存の処理中です。少し待ってください'); return; }
  const target=mediaTarget();
  // 参照を先に外す（実体を先に消すと、参照の保存に失敗したとき「開けない添付」が残る）
  if(!detachMediaMeta(target,'audio',id)){ toast('削除できませんでした（空き容量を確認してください）'); return; }
  // 実体は直接消さない。同じ実体をマイ図鑑などが参照していることがあるため、
  // 「どこからも参照されていないものだけ消す」掃除に任せる
  AudioDB.gc().catch(()=>{}).then(()=>scheduleFolderFull());
  toast('この記録から録音を外しました');
}
// メディアの持ち主（観察 or 飛翔）。飛翔画面では SCREENS._mediaCtx を設定する
function mediaCtx(){ return SCREENS._mediaCtx || { kind:'obs', uuid:(SCREENS._obs&&SCREENS._obs.uuid)||'', sv:(SCREENS._obs&&SCREENS._obs.survey_uuid)||currentSurveyUuid }; }
/* 写真をどの記録に付けるか。
   **環境・営巣木の写真は必ず「観察」に付ける**（2026-08-14 監査4巡目 Critical）。
   飛翔経路を軸に開いた画面では持ち主が飛翔になるが、飛翔の記録には
   環境・営巣木の欄が無く、掃除・同期・一覧もそこを見ないので、
   実体が「どこからも使われていない」と判断されて消える */
function mediaTarget(field){
  const c=mediaCtx();
  if(field==='env_media' || field==='nest_media'){
    return { kind:'obs', uuid:(SCREENS._obs&&SCREENS._obs.uuid)||'',
             sv:(SCREENS._obs&&SCREENS._obs.survey_uuid)||currentSurveyUuid };
  }
  return { kind:c.kind, uuid:c.uuid, sv:c.sv||currentSurveyUuid };
}
/* いま画面に出ている相手かどうか。**欄によって見る相手が違う**
   （2026-08-14 監査5巡目 Critical）。
   環境・営巣木の写真は必ず観察に付く（mediaTarget 参照）ので、
   飛翔を軸に開いた画面でも「画面の観察」と比べる。ここを mediaCtx のままにすると、
   データベースには入るのに画面の控えに入らず、次の保存で参照が消える */
function mediaOnScreen(target, field){
  if(field==='env_media' || field==='nest_media'){
    return target.kind==='obs' && !!target.uuid
      && target.uuid===((SCREENS._obs&&SCREENS._obs.uuid)||'');
  }
  const cur=mediaCtx();
  return cur.kind===target.kind && cur.uuid===target.uuid;
}
// 対象レコード(target)へメディアmetaを追記。保存済みならDBへ直接反映し、
// 現在画面が同じ対象の時だけ編集中配列とパネルを更新する（別記録への誤添付・誤表示を防ぐ）
function attachMediaMeta(target, field, meta){
  if(target.uuid && DISCARDED.has(target.uuid)) return false;   // ユーザーが破棄した新規記録には、後から完了した保存分も付けない
  let ok=true;   // 記録への紐付け保存の成否を返す（失敗を成功表示すると、音声・写真が一覧から参照できなくなるため）
  if(target.uuid){ const recKey=target.kind==='flight'?DB.key.fl:DB.key.ob;
    const list=DB.loadForWrite(recKey); if(!list) return false;
    const i=list.findIndex(x=>x.uuid===target.uuid);
    if(i>=0){ list[i][field]=(list[i][field]||[]).concat([meta]);
      ok = target.kind==='flight' ? DB.upsertFlight(list[i]) : DB.upsertObs(list[i]); }
    else{
      // まだ保存されていない新規記録。参照を失わないよう、この場で仮保存する（後で本保存が上書き）
      const sv=target.sv||currentSurveyUuid;
      if(target.kind==='flight') ok=DB.upsertFlight({ uuid:target.uuid, survey_uuid:sv, path:[], species_name_snapshot:'',
        start_time:'', end_time:'', height_class:'不明', age_class:'不明', individual_label:'', behavior:'', count:1, memo:'', needs_review:false, audio:[], media:[], [field]:[meta] });
      else ok=DB.upsertObs({ uuid:target.uuid, survey_uuid:sv, observed_at:nowISO(), latitude:'', longitude:'',
        species_id:'', species_name_snapshot:'', count:1, detection_method:'', behavior:'', habitat:'',
        identification_status:'未同定', confidence:'中', needs_review:false, note:'', external_photo_reference:'', audio:[], media:[], [field]:[meta] });
    } }
  // 仮記録（ghost）への書き込みが成功したら、その全文を控える。
  // 破棄はこの控えと完全一致する場合だけ行う（別の書き手が正式化した記録を仮記録と誤認して消さない）
  if(ok && SCREENS._ghost && SCREENS._ghost.uuid===target.uuid){
    try{
      const gA=loadStrict(SCREENS._ghost.key);
      const gC=gA?gA.find(x=>x&&x.uuid===target.uuid):null;
      if(gC) SCREENS._ghost.rec=JSON.stringify(gC);
    }catch(e){}
  }
  // 複数羽トレースの退避済みトラックに遅れてメディアが完成した場合、トラック側にも反映する
  //（反映しないと一括保存が空のメディア配列で仮レコードを上書きし、参照を失う）
  if(ok && target.kind==='flight' && SCREENS._ftracks){
    const ftr=SCREENS._ftracks.find(t=>t&&t.uuid===target.uuid);
    if(ftr && ftr.fields) ftr.fields[field]=(ftr.fields[field]||[]).concat([meta]);
  }
  if(ok && mediaOnScreen(target, field)){
    // 「未保存の新規記録」への追加だけを離脱ガード対象にする（既存記録へのメディアは即DB保存済み＝離脱しても消えないため）
    const isNew = target.kind==='flight' ? (SCREENS._flightEditing===false && SCREENS._flightSelf===target.uuid)
                                         : (SCREENS._obsEditing===false && SCREENS._obs && SCREENS._obs.uuid===target.uuid);
    if(isNew){ SCREENS._dirty=true;
      SCREENS._ghost={ key:(target.kind==='flight'?DB.key.fl:DB.key.ob), uuid:target.uuid }; }
    if(field==='audio'){ SCREENS._audio=(SCREENS._audio||[]).concat([meta]); renderRecPanel(); }
    else { const spec=MEDIA_FIELDS[field]||MEDIA_FIELDS.media;
      SCREENS[spec.arr]=(SCREENS[spec.arr]||[]).concat([meta]);
      renderMediaPanel(MEDIA_FIELDS[field]?field:'media'); } }
  return ok;
}
function detachMediaMeta(target, field, id){
  // 保存の成否を返す（失敗を成功扱いにすると、参照が画面からだけ消えて実体が掃除で失われる）
  let saved=true;
  if(target.uuid){ const recKey=target.kind==='flight'?DB.key.fl:DB.key.ob;
    const list=DB.loadForWrite(recKey); if(!list) return false;
    const i=list.findIndex(x=>x.uuid===target.uuid);
    if(i>=0){ list[i][field]=(list[i][field]||[]).filter(x=>x.id!==id);
      saved = target.kind==='flight' ? !!DB.upsertFlight(list[i]) : !!DB.upsertObs(list[i]);
      if(!saved) return false; } }
  if(mediaOnScreen(target, field)){
    if(field==='audio'){ SCREENS._audio=(SCREENS._audio||[]).filter(x=>x.id!==id); renderRecPanel(); }
    else { const spec=MEDIA_FIELDS[field]||MEDIA_FIELDS.media;
      SCREENS[spec.arr]=(SCREENS[spec.arr]||[]).filter(x=>x.id!==id);
      renderMediaPanel(MEDIA_FIELDS[field]?field:'media'); } }
  return saved;
}
// パネル再構築や画面遷移の前に、割り当て済みのObject URLをまとめて解放する（メモリリーク防止）
function revokePanelUrls(root, selector){ if(!root) return;
  root.querySelectorAll(selector).forEach(el=>{ if(el._url){ try{ URL.revokeObjectURL(el._url); }catch(e){} el._url=null; } }); }
function renderRecPanel(){
  const box=$('#recPanel'); if(!box) return;
  revokePanelUrls(box, 'audio');   // 再構築前に古いObject URLを解放（リーク防止）
  if(!recSupported()){ box.innerHTML='<div class="note">この端末・接続では録音を利用できません（httpsまたはホーム画面から起動すると使えます）。</div>'; return; }
  const list=SCREENS._audio||[]; const active=!!REC;
  box.innerHTML=`
    <button type="button" class="btn ${active?'danger':''}" onclick="recToggle()">
      ${active?'<span class="recdot"></span>録音を停止 <span id="recTime">0:00</span>':'🎤 録音する'}</button>
    ${list.length?`<div class="reclist">${list.map((a,i)=>`
      <div class="recitem" data-id="${a.id}">
        <div class="row"><span class="small muted grow">録音${i+1} ・ ${fmtDur(a.dur)} ・ ${Math.max(1,Math.round(a.size/1024))}KB</span>
          <button type="button" class="btn" style="width:auto; padding:6px 10px;" data-a="${esc(a.id)}" onclick="specOpen({kind:'audio', id:this.dataset.a})">〰 声紋</button>
          <button type="button" class="btn danger" style="width:auto; padding:6px 12px;" onclick="delAudio('${a.id}')">削除</button></div>
        <audio controls preload="none" class="recaudio"></audio>
      </div>`).join('')}</div>`:''}`;
  // 各プレーヤーにIndexedDBの音声を割り当て（取得完了までに再描画・画面遷移していたら割り当てない）
  const gen=++_recGen;
  list.forEach(a=>{ AudioDB.get(a.id).then(r=>{ if(!r||!r.blob) return;
    if(gen!==_recGen) return;
    const el=box.querySelector(`.recitem[data-id="${a.id}"] audio`); if(!el||!el.isConnected) return;
    if(el._url) URL.revokeObjectURL(el._url);
    el._url=URL.createObjectURL(r.blob); el.src=el._url;
  }).catch(()=>{}); });
}

/* ---------- 写真・動画（カメラ／ライブラリ） ---------- */
function fileExt(name, mime){
  const m=String(name||'').match(/\.([a-z0-9]{1,5})$/i); if(m) return m[1].toLowerCase();
  mime=mime||''; const map={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic',
    'image/heif':'heif','image/gif':'gif','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm','video/3gpp':'3gp'};
  return map[mime] || (mime.startsWith('video')?'mp4':'jpg');
}
// 写真・動画の取り込みが進行中の本数。取り込み中に記録の種類を変えると、
// 遅れて完了した分の持ち主が居なくなるため、その間は切り替え・保存を止める
let MEDIA_PENDING=0;
function mediaBusy(){ return MEDIA_PENDING>0; }
/* 写真・動画をどの欄に付けるか。
   'media'      … 観察のメディア記録（今までどおり）
   'env_media'  … 環境の写真（2026-08-14 追加）
   'nest_media' … 営巣木・巣の写真（同）
   **欄ごとに分けて持つ**。ひとまとめにすると、後から「どれが営巣木の写真か」が
   分からなくなる（報告書では別々に使う） */
const MEDIA_FIELDS={
  media:      { arr:'_media',     panel:'mediaPanel',     label:'写真・動画' },
  env_media:  { arr:'_envMedia',  panel:'envMediaPanel',  label:'環境の写真' },
  nest_media: { arr:'_nestMedia', panel:'nestMediaPanel', label:'営巣木の写真' },
};
function mediaFieldOf(input){
  const f=(input && input.dataset && input.dataset.field) || 'media';
  return MEDIA_FIELDS[f] ? f : 'media';
}
function pickMedia(input){
  if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY){ toast('保存の処理中です。少し待ってください'); input.value=''; return; }
  const files=Array.from(input.files||[]); input.value='';
  if(!files.length) return;
  const field=mediaFieldOf(input);          // どの欄の写真か（取り込み開始時点で固定）
  const target=mediaTarget(field);   // 取り込み開始時点の対象を固定
  // 未保存の新規記録なら、保存完了を待たずこの時点でガード対象にする（完了前に離脱してもすり抜けない）
  if((target.kind==='obs' && SCREENS._obsEditing===false && SCREENS._obs && SCREENS._obs.uuid===target.uuid) ||
     (target.kind==='flight' && SCREENS._flightEditing===false && SCREENS._flightSelf===target.uuid)){
    SCREENS._dirty=true;
    SCREENS._ghost={ key:(target.kind==='flight'?DB.key.fl:DB.key.ob), uuid:target.uuid };
  }
  const owner = target.kind==='flight' ? { flight_uuid:target.uuid, obs_uuid:'' } : { obs_uuid:target.uuid };
  toast('取り込み中…');
  let ok=0, fail=0;
  const jobs=files.map(f=>{
    // 中身が空のまま保存すると、参照だけが残って開けない写真になる。
    // しかも実体があるように見えるので、欠けていることに気づけない（監査 Major）
    if(!(f.size>0)){ fail++; return Promise.resolve(); }
    const kind=(f.type||'').startsWith('video')?'video':'photo';
    const meta={ id:uuid(), kind, mime:f.type||'', ext:fileExt(f.name,f.type), size:f.size, name:f.name||'', created_at:nowISO() };
    // 1件ずつ、成功したものだけ確実に反映（1件失敗しても成功分は残る）
    return PhotoDB.put(Object.assign({}, meta, { blob:f }, owner))
      .then(()=>{ if(attachMediaMeta(target,field,meta)) ok++; else fail++; })   // 紐付け失敗も失敗として数える
      .catch(()=>{ fail++; });
  });
  MEDIA_PENDING++;
  Promise.all(jobs).then(()=>{
    MEDIA_PENDING=Math.max(0, MEDIA_PENDING-1);
    if(DISCARDED.has(target.uuid)){ mediaGcAll().catch(()=>{}); return; }   // 取り込み中に破棄された→結果は捨てて実体も掃除
    scheduleFolderFull();
    const 名=MEDIA_FIELDS[field].label;
    if(fail) toast(`${名}：${ok}件追加・${fail}件失敗`); else toast(`${名}を追加しました`); });
}
function delMedia(id, field){
  if(!writeAllowed()) return;
  if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY){ toast('保存の処理中です。少し待ってください'); return; }
  field=MEDIA_FIELDS[field]?field:'media';
  const target=mediaTarget(field);
  if(!detachMediaMeta(target,field,id)){ toast('削除できませんでした（空き容量を確認してください）'); return; }
  PhotoDB.gc().catch(()=>{}).then(()=>scheduleFolderFull());
  toast('この記録から外しました');
}
function renderMediaPanel(field){
  // 欄を指定しなければ、ある欄をぜんぶ描き直す
  if(!field){ Object.keys(MEDIA_FIELDS).forEach(f=>renderMediaPanel(f)); return; }
  const spec=MEDIA_FIELDS[field]; if(!spec) return;
  const box=$('#'+spec.panel); if(!box) return;
  revokePanelUrls(box, '.mediael');   // 再構築前に古いObject URLを解放（リーク防止）
  const list=SCREENS[spec.arr]||[];
  const 動画あり=(field==='media');   // 環境・営巣木は写真だけ（動画は観察側にまとめる）
  // ラベル直結＋capture属性で、端末のカメラを確実に起動（撮影と選択を分離）
  const HID='position:absolute; width:1px; height:1px; opacity:0; overflow:hidden;';
  const id=n=>field==='media'?n:field+'_'+n;
  box.innerHTML=`
    <input type="file" id="${id('mediaCamPhoto')}" data-field="${field}" accept="image/*" capture="environment" style="${HID}" onchange="pickMedia(this)">
    ${動画あり?`<input type="file" id="${id('mediaCamVideo')}" data-field="${field}" accept="video/*" capture="environment" style="${HID}" onchange="pickMedia(this)">`:''}
    <input type="file" id="${id('mediaLib')}" data-field="${field}" accept="${動画あり?'image/*,video/*':'image/*'}" multiple style="${HID}" onchange="pickMedia(this)">
    <div class="btn-grid">
      <label class="btn" for="${id('mediaCamPhoto')}">📷 写真を撮る</label>
      ${動画あり?`<label class="btn" for="${id('mediaCamVideo')}">🎬 動画を撮る</label>`:''}
      <label class="btn" for="${id('mediaLib')}">🖼 ライブラリから選ぶ</label>
    </div>
    ${list.length?`<div class="mediagrid">${list.map(m=>`
      <div class="mediaitem" data-id="${m.id}">
        <div class="mediathumb">${m.kind==='video'
          ? '<video class="mediael" controls preload="metadata"></video>'
          : '<img class="mediael" alt="写真">'}</div>
        <button type="button" class="mediadel" onclick="delMedia('${m.id}','${field}')">×</button>
        <div class="tiny muted mediacap">${m.kind==='video'?'🎬 動画':'📷 写真'} ・ ${Math.max(1,Math.round(m.size/1024))}KB</div>
      </div>`).join('')}</div>`:''}`;
  const gen=++_mediaGenBy[field];
  list.forEach(m=>{ PhotoDB.get(m.id).then(r=>{ if(!r||!r.blob) return;
    if(gen!==_mediaGenBy[field]) return;
    const el=box.querySelector(`.mediaitem[data-id="${m.id}"] .mediael`); if(!el||!el.isConnected) return;
    if(el._url) URL.revokeObjectURL(el._url); el._url=URL.createObjectURL(r.blob); el.src=el._url;
  }).catch(()=>{}); });
}

/* ============================================================
   鳴き声AI（BirdNET）— 調査中ずっと聞いて、鳥の声を「候補」として知らせる（v229）
   試作 prototype/survey_mode.js（Codex監査済み）を本体向けに移したもの。
   決まり（計画: tasks/todo.md「鳴き声AIの組み込み」改訂版 V1〜V9。Codex 計画レビュー済み）:
   - 観察の記録は自動で作らない（ポップアップの「★ 残す」で印を付けるだけ）
   - AI本体は人が「取り込む」を押したときだけ取り込む。普段は端末の保存分からだけ読む（勝手に通信しない）
   - 聞き取りは開始した調査に固定。別の調査を開いた・調査を終えた・消した・閲覧だけになったら止める
   - 「人が聞きたい（AIL.want）」と「一時停止の理由（AIL.reasons）」を分ける。
     マイクを使うのは、理由が空で・人が聞きたくて・同じ調査が有効で・画面が見えていて・保存できるときだけ（aiCanRun）
   - 保存済みの声を自動で消したり入れ替えたりしない。消すのは人が押したときだけ
   - AIが人の声と判定した区間を含む声は保存しない（AIが聞き逃すことはある）
   - 画面の組み直し（render）は呼ばない（入力中の値・離脱確認を壊さない）
   ============================================================ */
const AI_SR=48000, AI_WIN=144000;            // 3秒区間（重ねずに順に判別）
const AI_RING_SEC=45;                         // 直近45秒の音を持っておく（切り出し用）
const AI_BATCH=4;                             // 一度にAIへ渡す区間の数
const AI_GAP_MERGE=5;                         // 同じ種をまとめる間隔（区間数＝15秒）

const AI={ state:'unknown', err:'', progress:'', prep:null, worker:null, workerP:null, reqId:0, pending:{} };

/* ---------- 取り込み・確認・消去 ---------- */
async function aiCheck(){
  if(AI.state==='installing') return AI.state;
  if(!('caches' in window) || !window.AudioWorkletNode || !(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) || !window.indexedDB){
    AI.state='nosupport'; aiFabUpdate(); return AI.state; }
  try{
    const f=aiFiles(); const ca=await caches.open(AI_CACHE_APP), cm=await caches.open(AI_CACHE_MODEL);
    let have=0;
    for(const u of f.app) if(await ca.match(u)) have++;
    for(const u of f.model) if(await cm.match(u)) have++;
    const all=f.app.length+f.model.length;
    if(have===all){
      try{ AI.prep=await aiPrepare(); AI.state='ready'; AI.err=''; await aiHeadCheck(); }
      catch(e){ AI.state='failed'; AI.err=String(e&&e.message||e); }
    } else AI.state = have? 'broken' : 'none';
  }catch(e){ AI.state='failed'; AI.err=String(e&&e.message||e); }
  aiFabUpdate(); aiSettingsRefresh();
  return AI.state;
}
async function aiInstall(){
  if(AI.state==='installing') return;
  if(!('caches' in window)){ toast('この端末では鳴き声AIを使えません'); return; }
  AI.state='installing'; AI.err=''; AI.progress='準備中'; aiSettingsRefresh();
  try{
    // 古い版の保存分（このアプリの鳴き声AIのものだけ）を片付ける。利用者の記録や試作の保存分には触らない
    for(const k of await caches.keys()){
      if((k.startsWith('birdnet-ai-app-') && k!==AI_CACHE_APP) || (k.startsWith('birdnet-ai-model-') && k!==AI_CACHE_MODEL)
        || (k.startsWith('birdnet-ai-head-') && k!==AI_CACHE_HEAD)) await caches.delete(k);
    }
    const f=aiFiles(); const ca=await caches.open(AI_CACHE_APP), cm=await caches.open(AI_CACHE_MODEL);
    const jobs=f.app.map(u=>[ca,u]).concat(f.model.map(u=>[cm,u]));
    let i=0;
    for(const [c,u] of jobs){
      i++; AI.progress=`${i}/${jobs.length}`; aiSettingsRefresh();
      if(await c.match(u)) continue;   // 前回の途中まで入っている分は取り直さない
      const res=await fetch(u, { cache:'no-store' });
      if(!res.ok) throw new Error(`取り込みに失敗しました（${u.split('/').pop()}・${res.status}）`);
      const body=await res.clone().arrayBuffer();
      if(!body.byteLength) throw new Error(`中身が空でした（${u.split('/').pop()}）`);
      if(/\.html?$/i.test(u) || (res.headers.get('content-type')||'').includes('text/html')) throw new Error('想定と違う中身でした');
      await c.put(u, res);
    }
    AI.state='unknown';
    const st=await aiCheck();   // 全部そろったか・一覧が壊れていないかを確かめてから「使える」にする
    if(st!=='ready') throw new Error(AI.err||'取り込んだ中身を確かめられませんでした');
    toast('鳴き声AIを取り込みました。圏外でも使えます', 4000);
    // 「しっかり」の部品も一緒に取り込む（失敗しても本体は使える。設定欄に理由が出る）
    if(AI_HEAD_ENABLED && AIH.state!=='ready') await aiHeadInstall();
  }catch(e){
    AI.state='failed'; AI.err=String(e&&e.message||e);
    toast('鳴き声AIを取り込めませんでした。電波の良い所で「もう一度」を押してください', 6000);
  }
  AI.progress=''; aiFabUpdate(); aiSettingsRefresh();
}
async function aiUninstall(){
  if(AI.state==='installing') return;
  if(!confirm('鳴き声AI（約64MB）を端末から消します。聞こえた鳥の記録と声は消えません。よろしいですか？')) return;
  if(AIL.want) aiListenStop('鳴き声AIを消したため、聞き取りを止めました');
  aiWorkerKill();
  try{ await caches.delete(AI_CACHE_APP); await caches.delete(AI_CACHE_MODEL); }catch(e){}
  await aiHeadRemove();
  AI.prep=null; AI.state='unknown'; await aiCheck();
  toast('鳴き声AIを端末から消しました');
}
async function aiCacheText(cacheName, url){
  const c=await caches.open(cacheName); const r=await c.match(url);
  if(!r) throw new Error('AIのファイルが端末にありません: '+url.split('/').pop());
  return r.text();
}
// 種名ラベルと北海道の一覧を読み、検査する（試作と同じ検査。おかしければ AI を使わせない）
async function aiPrepare(){
  const f=aiFiles(); const at=n=>f.app.find(u=>u.endsWith('/'+n));
  const [en, ja, hkT, alT]=await Promise.all(['labels_en_us.txt','labels_ja.txt','hokkaido_list.json','hokkaido_alias.json']
    .map(n=>aiCacheText(AI_CACHE_APP, at(n))));
  const bad=m=>{ throw new Error('北海道の種の一覧が壊れています: '+m); };
  let hk, al; try{ hk=JSON.parse(hkT); al=JSON.parse(alT); }catch(e){ bad('読み取れません'); }
  const enL=en.split('\n'), jaL=ja.split('\n');
  const labels=enL.filter(l=>l.trim()).map((l,i)=>{ const [sci,enName]=l.trim().split('_');
    return { sci, en:enName, ja:((jaL[i]||'').trim().split('_')[1]||enName) }; });
  const sciIndex=Object.create(null); labels.forEach((b,i)=>{ sciIndex[b.sci]=i; });
  const isLabel=x=>typeof x==='string' && Object.prototype.hasOwnProperty.call(sciIndex,x);
  if(!hk || hk.format!=='hokkaido-list' || hk.version!==1 || !Array.isArray(hk.species)) bad('形式');
  if(!al || al.format!=='hokkaido-alias' || al.version!==1 || !al.alias || typeof al.alias!=='object' || Array.isArray(al.alias)) bad('対応表の形式');
  const ids=new Set(); const okStr=(v,n)=>typeof v==='string' && v.length>0 && v.length<=n;
  for(const sp of hk.species){
    if(!sp || !okStr(sp.id,60) || !okStr(sp.list_ja,60) || !okStr(sp.master_ja,60) || !okStr(sp.sci,60) || ids.has(sp.id)) bad('種の行');
    if(!Array.isArray(sp.birdnet) || !sp.birdnet.every(isLabel)) bad('対応先 '+sp.id);
    ids.add(sp.id);
  }
  if(hk.species.length!==505) bad('種数');
  for(const [id,arr] of Object.entries(al.alias)) if(!ids.has(id) || !Array.isArray(arr) || !arr.length || !arr.every(isLabel)) bad('承認済み対応 '+id);
  const extra = al.extra===undefined ? [] : al.extra;
  if(!Array.isArray(extra) || extra.length>50) bad('追加種の形式');
  for(const x of extra){
    if(!x || !okStr(x.id,200) || ids.has(x.id) || !okStr(x.list_ja,200) || !okStr(x.master_ja,200) || !okStr(x.sci,200)) bad('追加種の行');
    if(!Array.isArray(x.birdnet) || !x.birdnet.length || !x.birdnet.every(isLabel)) bad('追加種の対応先 '+x.id);
    ids.add(x.id);
  }
  const hkIdx=new Set(), idxName=new Map(), idxMaster=new Map();
  for(const sp of hk.species.concat(extra)){
    const targets=sp.birdnet.length? sp.birdnet : (al.alias[sp.id]||[]);
    for(const s of targets){ const i=sciIndex[s];
      if(idxName.has(i) && idxName.get(i)!==sp.list_ja) bad('同じ分類に2つの種が対応しています '+s);
      hkIdx.add(i); idxName.set(i, sp.list_ja); idxMaster.set(i, sp.master_ja); }
  }
  const nonBird=new Set(AI_NONBIRD_SCI.filter(s=>sciIndex[s]!==undefined).map(s=>sciIndex[s]));
  const hkById=new Map(hk.species.concat(extra).map(sp=>[sp.id, sp.list_ja]));
  return { labels, hkIdx, idxName, idxMaster, nonBird, humanIdx:sciIndex['Human vocal'], nLabels:labels.length, hkById };
}

/* ---------- 判別ワーカー ---------- */
function aiWorkerKill(){
  if(AI.worker){ try{ AI.worker.terminate(); }catch(e){} }
  AI.worker=null; AI.workerP=null; AI.workerExt=false;
  if(typeof SPEC!=='undefined') SPEC.inflight=false;   // 処理役が止まれば、出ていた声紋の依頼も終わり
  Object.values(AI.pending).forEach(p=>p.rej(new Error('AIを止めました'))); AI.pending={};
}
// ms を付けると、その時間を過ぎても返事が無いとき失敗にする（v241: 「しっかり」の依頼・判定し直し）
function aiAsk(msg, transfer, ms){
  return new Promise((res,rej)=>{
    if(!AI.worker){ rej(new Error('AIが動いていません')); return; }
    const id=++AI.reqId; let tm=null;
    AI.pending[id]={ res:v=>{ clearTimeout(tm); res(v); }, rej:e=>{ clearTimeout(tm); rej(e); } };
    if(ms) tm=setTimeout(()=>{ if(AI.pending[id]){ delete AI.pending[id]; rej(new Error('AIの返事がありませんでした')); } }, ms);
    AI.worker.postMessage(Object.assign({}, msg, {id}), transfer||[]);
  });
}
// ワーカーを起動して AI を読み込む（1回だけ。失敗したら次に押したときにやり直す）
// opt.ext … 「しっかり」の追加部品をつなげて起動する。追加なしで起動済みなら作り直す（人が「聞く」を押したときだけ呼ばれる）
function aiWorkerEnsure(opt){
  const wantExt=!!(opt && opt.ext);
  if(AI.workerP && (AI.workerExt || !wantExt)) return AI.workerP;
  if(AI.workerP) aiWorkerKill();
  AI.workerExt=wantExt;
  const p=AI.workerP=(async()=>{
    if(AI.state!=='ready') throw new Error('鳴き声AIがまだ取り込まれていません');
    const f=aiFiles(); const at=n=>f.app.find(u=>u.endsWith('/'+n));
    const [tfT, wT]=await Promise.all([aiCacheText(AI_CACHE_APP, at('tf.min.js')), aiCacheText(AI_CACHE_APP, at('birdnet-worker.js'))]);
    const parts=[tfT, '\n;\n', wT];
    if(wantExt){ if(!AIH.extText) throw new Error('「しっかり」の部品がありません'); parts.push('\n;\n', AIH.extText); }
    const url=URL.createObjectURL(new Blob(parts, {type:'text/javascript'}));
    const w=new Worker(url); AI.worker=w;
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    w.onmessage=({data})=>{
      const p=data && AI.pending[data.id];
      if(data.message==='progress'){ AI.progress='AIを準備中 '+data.progress+'%'; aiFabUpdate(); return; }
      if(!p){ if(typeof SPEC!=='undefined' && SPEC.inflight && data.id===SPEC.reqId) SPEC.inflight=false; return; }
      delete AI.pending[data.id];
      if(data.message==='error') p.rej(new Error(data.text)); else p.res(data);
    };
    w.onerror=e=>{ const err=new Error('AIの処理で問題が起きました'); Object.values(AI.pending).forEach(p=>p.rej(err)); AI.pending={}; };
    await aiAsk({ message:'init', modelUrl:f.model[0], cacheName:AI_CACHE_MODEL }, null, AIH.initMs);   // v241: 起動が返事をしないまま待ち続けない
    if(wantExt){   // 追加部品が使えるか確かめる（返事が無い・失敗 → 呼び出し側が追加なしで作り直す）
      const r=await aiAsk({ message:'head_ping' }, null, AIH.pingMs);
      if(!r || r.message!=='head_pong' || r.dim!==AIH.head.D) throw new Error('「しっかり」の部品が使えませんでした');
    }
    AI.progress='';
  })();
  p.catch(()=>{ if(AI.workerP===p){ aiWorkerKill(); AI.progress=''; aiFabUpdate(); } });
  return p;
}

// 利用条件の確認が済むまで公開版では出さない（tasks/todo.md H11。2026-11-09 ユーザー決定「しっかりを隠して公開」）。

const AI_HEAD_MAX_BYTES=2*1024*1024;
function aiHeadFiles(){ return ['ai/head-ext.js','ai/hk_head.json','ai/hk_head_credits.json'].map(f=>new URL(f, location.href).href); }
// 待ち時間（ms）: pingMs … 起動後の「使えるか」の返事 / reqMs … 判定＋指紋の依頼 / retryMs … 標準に戻して判定し直すとき

const AIH={ state:'unknown', err:'', runErr:'', head:null, extText:'', gen:0, pingMs:5000, reqMs:20000, retryMs:30000, initMs:120000 };
// state: unknown / none（無い）/ installing / ready / bad（壊れている）/ failed（取り込み失敗）
function aiHeadUsable(){ return AI_HEAD_ENABLED && AIH.state==='ready' && !!AIH.head && !!AIH.extText && !AIH.runErr; }

// 半精度（リトルエンディアン）の並び → Float32Array
function aiF16(bytes){
  const n=bytes.length>>1, out=new Float32Array(n), dv=new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  for(let i=0;i<n;i++){
    const h=dv.getUint16(i*2, true), sg=(h>>15)?-1:1, e=(h>>10)&31, m=h&1023;
    out[i]= e===0 ? sg*m*Math.pow(2,-24) : e===31 ? (m?NaN:sg*Infinity) : sg*(1+m/1024)*Math.pow(2,e-15);
  }
  return out;
}
function aiB64Bytes(b64){
  if(typeof b64!=='string' || !/^[A-Za-z0-9+/]*={0,2}$/.test(b64)) throw new Error('base64 ではありません');
  const t=atob(b64), u=new Uint8Array(t.length); for(let i=0;i<t.length;i++) u[i]=t.charCodeAt(i); return u;
}
// 学習結果を読み、検査する。おかしければ投げる（呼び出し側が「しっかり」を使わせない）
function aiHeadParse(text, P){
  const bad=m=>{ throw new Error('「しっかり」の学習結果が使えません: '+m); };
  if(!P) bad('AIの準備がまだです');
  if(typeof text!=='string' || text.length>AI_HEAD_MAX_BYTES) bad('大きさ');
  let h; try{ h=JSON.parse(text); }catch(e){ bad('読み取れません'); }
  if(!h || h.format!=='bird-head' || h.version!==1) bad('形式');
  if(typeof h.name!=='string' || !h.name || h.name.length>40) bad('名前');
  const bn=h.birdnet||{};
  if(bn.commit!==AI_MODEL_COMMIT) bad('BirdNET の版が違います');
  if(bn.layer!=='GLOBAL_AVG_POOL' || bn.dim!==1024 || bn.norm!=='l2') bad('声の指紋の定義が違います');
  const D=1024, cls=h.classes;
  if(!Array.isArray(cls) || cls.length<2 || cls.length>200) bad('種の数');
  const K=cls.length;
  if(h.noise!==K-1 || !cls[K-1] || cls[K-1].id!=='noise') bad('雑音の位置');
  const seen=new Set(), idx=[];
  for(let k=0;k<K-1;k++){
    const c=cls[k];
    if(!c || typeof c.id!=='string' || typeof c.ja!=='string' || seen.has(c.id) || seen.has('ja:'+c.ja)) bad('種の行 '+k);
    if(P.hkById.get(c.id)!==c.ja) bad('北海道の一覧に無い種 '+c.ja);
    const ii=[]; for(const [i,ja] of P.idxName) if(ja===c.ja) ii.push(i);
    if(!ii.length) bad('BirdNET 側に対応の無い種 '+c.ja);
    seen.add(c.id); seen.add('ja:'+c.ja); idx.push(ii);
  }
  if(!Array.isArray(h.W_shape) || h.W_shape[0]!==K || h.W_shape[1]!==D || h.W_dtype!=='float16-le') bad('重みの形');
  const wb=aiB64Bytes(h.W); if(wb.length!==K*D*2) bad('重みの要素数');
  const W=aiF16(wb); for(let i=0;i<W.length;i++) if(!Number.isFinite(W[i])) bad('重みの数値');
  if(!Array.isArray(h.b) || h.b.length!==K || !h.b.every(Number.isFinite)) bad('偏り');
  const f=h.fuse||{};
  if(f.how!=='mean' || !(typeof f.floor==='number' && f.floor>=0 && f.floor<1)) bad('上乗せの決まり');
  const H={ name:h.name, K, D, W, b:Float64Array.from(h.b), floor:f.floor, idx, classes:cls };
  // 確かめ用の入力で、PC で計算した答えと一致するか（差 0.001 以内）
  if(!Array.isArray(h.checks) || h.checks.length<1) bad('確かめ用の答えがありません');
  for(const c of h.checks){
    const eb=aiB64Bytes(c && c.e); if(eb.length!==D*2 || !Array.isArray(c.p) || c.p.length!==K) bad('確かめ用の形');
    const p=aiHeadProbs(aiF16(eb), H);
    for(let k=0;k<K;k++) if(!(Math.abs(p[k]-c.p[k])<=1e-3)) bad('確かめ用の答えが合いません');
  }
  return H;
}
// 声の指紋（1024個）→ 覚えさせた種＋雑音の確からしさ（長さを1にそろえ、重み×指紋＋偏り → 最大値を引いてから指数）
function aiHeadProbs(e, H){
  H=H||AIH.head; const D=H.D, K=H.K;
  let n=0; for(let j=0;j<D;j++) n+=e[j]*e[j]; n=Math.sqrt(n)+1e-9;
  const z=new Float64Array(K); let mx=-Infinity;
  for(let k=0;k<K;k++){ let s=0; const o=k*D; for(let j=0;j<D;j++) s+=H.W[o+j]*e[j]; z[k]=H.b[k]+s/n; if(z[k]>mx) mx=z[k]; }
  let sum=0; for(let k=0;k<K;k++){ z[k]=Math.exp(z[k]-mx); sum+=z[k]; }
  for(let k=0;k<K;k++) z[k]/=sum;
  return z;
}
// 覚えさせた種の上乗せ後の値（BirdNET の番号 → 値）。BirdNET が floor 未満の種は上乗せしない
function aiHeadAdjust(row, emb){
  const H=AIH.head, p=aiHeadProbs(emb, H), out=new Map();
  for(let k=0;k<H.K-1;k++){
    let bi=-1, bv=-1; for(const i of H.idx[k]) if(row[i]>bv){ bv=row[i]; bi=i; }
    if(bi>=0 && bv>=Math.fround(H.floor)) out.set(bi, (bv+p[k])/2);   // AI の値は単精度で届くので、境目も単精度で比べる
  }
  return out;
}
async function aiHeadCheck(){
  if(AIH.state==='installing') return AIH.state;
  if(!AI_HEAD_ENABLED || !AI.prep || !('caches' in window)){ AIH.state='none'; AIH.head=null; AIH.extText=''; return AIH.state; }
  const gen=AIH.gen;   // 確かめている間に消された・取り込み直された → 結果を書き戻さない
  try{
    const c=await caches.open(AI_CACHE_HEAD), fs=aiHeadFiles();
    const rs=await Promise.all(fs.map(u=>c.match(u)));
    if(gen!==AIH.gen) return AIH.state;
    if(rs.some(r=>!r)){ AIH.state='none'; AIH.head=null; AIH.extText=''; return AIH.state; }
    const [ext, headT, credT]=await Promise.all(rs.map(r=>r.text()));
    const H=aiHeadParse(headT, AI.prep);
    let cr=null; try{ cr=JSON.parse(credT); }catch(e){}
    if(!cr || cr.format!=='bird-head-credits' || !Array.isArray(cr.recordings)) throw new Error('出典一覧が読めません');
    if(!ext || ext.length>200000) throw new Error('部品が読めません');
    if(gen!==AIH.gen) return AIH.state;
    AIH.head=H; AIH.extText=ext; AIH.state='ready'; AIH.err='';
  }catch(e){ if(gen===AIH.gen){ AIH.state='bad'; AIH.err=String(e&&e.message||e); AIH.head=null; AIH.extText=''; } }
  return AIH.state;
}
// 部品を取り込む。世代番号で、途中で消された・やり直された取り込みは保存しない（保存後に世代が変わっていたら消す）
async function aiHeadInstall(){
  if(!AI_HEAD_ENABLED || AIH.state==='installing') return false;
  if(AI.state!=='ready' || !AI.prep){ toast('先に鳴き声AIを取り込んでください'); return false; }
  const gen=++AIH.gen; AIH.state='installing'; AIH.err=''; aiSettingsRefresh();
  try{
    const c=await caches.open(AI_CACHE_HEAD);
    for(const u of aiHeadFiles()){
      const res=await fetch(u, { cache:'no-store' });
      if(!res.ok) throw new Error(`取り込みに失敗しました（${u.split('/').pop()}・${res.status}）`);
      if((res.headers.get('content-type')||'').includes('text/html')) throw new Error('想定と違う中身でした');
      const t=await res.clone().text();
      if(!t.length) throw new Error(`中身が空でした（${u.split('/').pop()}）`);
      if(u.endsWith('/hk_head.json')) aiHeadParse(t, AI.prep);   // 中身を確かめてから保存する
      if(gen!==AIH.gen) return false;
      await c.put(u, res);
      if(gen!==AIH.gen){ try{ await caches.delete(AI_CACHE_HEAD); }catch(e){} return false; }
    }
    AIH.state='unknown';
    await aiHeadCheck();
    if(gen!==AIH.gen) return false;
    if(AIH.state!=='ready') throw new Error(AIH.err||'取り込んだ中身を確かめられませんでした');
    AIH.runErr='';
    return true;
  }catch(e){
    if(gen===AIH.gen){ AIH.state='failed'; AIH.err=String(e&&e.message||e); }
    return false;
  }finally{ aiSettingsRefresh(); }
}
async function aiHeadRemove(){
  AIH.gen++; AIH.head=null; AIH.extText=''; AIH.state='none'; AIH.err='';
  try{ await caches.delete(AI_CACHE_HEAD); }catch(e){}
}

/* ---------- 保存（端末内だけ。同期・自動保存には含めない） ----------
   v235 から持ち出せる: 検出CSV・録音ZIP（声のWAV）・手動の全部のバックアップ（検出＋声）・DBへ送る（検出の一覧）。
   版2で「消した印」gone を足した（消した検出を、古いバックアップの読み込みで戻さないため。計画レビュー Major 2）。
   gone は検出・声の削除と**同じ取引**で書く */
let _aiDbP=null;
function aiDb(){
  if(!_aiDbP) _aiDbP=new Promise((res,rej)=>{
    const r=indexedDB.open('bird-ai', 2);
    r.onupgradeneeded=()=>{ const db=r.result;
      if(!db.objectStoreNames.contains('det')) db.createObjectStore('det',{keyPath:'id'}).createIndex('sv','sv');
      if(!db.objectStoreNames.contains('clip')) db.createObjectStore('clip',{keyPath:'id'}).createIndex('sv','sv');
      if(!db.objectStoreNames.contains('gone')) db.createObjectStore('gone',{keyPath:'id'}).createIndex('sv','sv'); };
    r.onsuccess=()=>{ const db=r.result; db.onversionchange=()=>{ db.close(); _aiDbP=null; }; res(db); };
    r.onerror=()=>{ _aiDbP=null; rej(r.error); };
    r.onblocked=()=>{ _aiDbP=null; rej(new Error('bird-ai blocked')); };
  });
  return _aiDbP;
}
function aiTxDone(tx){ return new Promise((res,rej)=>{ tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error('abort')); }); }
function aiReq(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function aiDetsOf(sv){ const db=await aiDb(); return aiReq(db.transaction('det').objectStore('det').index('sv').getAll(sv)); }
async function aiDetsAll(){ const db=await aiDb(); return aiReq(db.transaction('det').objectStore('det').getAll()); }
async function aiClipGet(id){ const db=await aiDb(); return aiReq(db.transaction('clip').objectStore('clip').get(id)); }
// 書き込みは1本の列で順に行う。消す処理と追い越し合わないように、調査ごとの「消した回数」を控えて照合する
const AI_DGEN=Object.create(null);
let _aiQ=Promise.resolve();
// tok を渡したとき（記録が作られた時点の「消した回数」）はそれで照合する。消す前に作られた記録の書き込みは、
// 消した後に届いても捨てる（遅れた書き込みで消した記録を復活させない）
function aiQ(sv, fn, tok){
  if(tok===undefined) tok=AI_DGEN[sv]||0;
  const p=_aiQ.then(()=>{ if((AI_DGEN[sv]||0)!==tok || !window.WRITE_OK) return false; return fn(); });
  _aiQ=p.catch(err=>{ console.warn('鳴き声AIの保存に失敗', err); });
  return p;
}
const AI_CLIP_KEYS=['clip','clip_sec','clip_bytes','clip_note','clip_off0','clip_off1'];
const AI_LABEL_KEYS=['label_kind','label_ja','labeled_at','label_t0','label_t1','label_f0','label_f1'];
function aiPutDet(rec){
  // 作られた時点の「消した回数」（このページの中だけで使う。記録には保存しない＝開き直すと数え直しになるため。監査 Major）
  if(rec._dg===undefined) rec._dg=AI_DGEN[rec.sv]||0;
  // DB へ送る項目（回数・時刻・確からしさ・★・声の有無）が変わる書き込みは、いつも更新日時を一緒に書く（rereview2 Major）
  rec.updated_at=nowISO();
  const snap=Object.assign({}, rec); delete snap._dg; delete snap._clipSaving;
  return aiQ(rec.sv, async()=>{
    const db=await aiDb(); const tx=db.transaction('det','readwrite'); const st=tx.objectStore('det');
    const cur=await aiReq(st.get(snap.id));
    // 声の保存が先に済んでいれば、その結び付きは古い複製で消さない（監査 Major）
    if(cur && cur.clip && !snap.clip) AI_CLIP_KEYS.forEach(k=>{ snap[k]=cur[k]; });
    // 一覧で付けた名前は、聞き取り中の古い複製で消さない（v242 計画 補足 M2）
    if(cur && cur.labeled_at && !(snap.labeled_at && snap.labeled_at>=cur.labeled_at)) AI_LABEL_KEYS.forEach(k=>{ snap[k]=cur[k]; });
    st.put(snap); return aiTxDone(tx); }, rec._dg);
}
// その調査の聞こえた鳥（検出と声）を消す。聞いていれば止め、処理待ちの保存を無効にし、列が空くのを待ってから消す。
// 消し終わったのを確かめて true を返す（失敗は false。成功と言わない）。ほかの調査・本体の録音・試作のデータには触らない
async function aiDeleteSurveys(svs){
  svs=[...new Set((svs||[]).filter(Boolean))];
  if(!svs.length) return true;
  if(AIL.want && svs.includes(AIL.sv)) aiListenStop();
  svs.forEach(sv=>{ AI_DGEN[sv]=(AI_DGEN[sv]||0)+1; });
  try{ await _aiQ; }catch(e){}
  if(!window.WRITE_OK) return false;
  try{
    const db=await aiDb();
    const tx=db.transaction(['det','clip','gone'],'readwrite');
    const at=nowISO();
    for(const sv of svs){
      for(const st of ['det','clip']){
        const keys=await aiReq(tx.objectStore(st).index('sv').getAllKeys(sv));
        keys.forEach(k=>tx.objectStore(st).delete(k));
        // 消した検出の id を同じ取引で控える（どちらかだけ確定することはない。v235 計画レビュー Major 2）
        if(st==='det') keys.forEach(k=>tx.objectStore('gone').put({id:k, sv, at}));
      }
    }
    await aiTxDone(tx);
    await aiTotalsReload();
    return true;
  }catch(e){ console.warn(e); return false; }
}
// 端末全体の声の量（上限の判定用）
const AI_TOT={ devBytes:0, sv:null, det:0, clipSec:0, clipSp:Object.create(null), warned:false };
async function aiTotalsReload(sv){
  const all=await aiDetsAll();
  AI_TOT.devBytes=all.reduce((a,d)=>a+(d.clip?(d.clip_bytes||0):0),0);
  if(sv!==undefined){ AI_TOT.sv=sv; AI_TOT.warned=false; }
  const mine=all.filter(d=>d.sv===AI_TOT.sv);
  AI_TOT.det=mine.filter(d=>d.kind==='det').length;
  AI_TOT.clipSec=mine.reduce((a,d)=>a+(d.clip?(d.clip_sec||0):0),0);
  AI_TOT.clipSp=Object.create(null);
  mine.forEach(d=>{ if(d.clip) AI_TOT.clipSp[d.ja]=(AI_TOT.clipSp[d.ja]||0)+1; });
}

/* ---------- 鳴き声AIの持ち出しと読み戻し（v235・2026-11-08 ユーザー決定「音も含めて全部。同期には乗せない」） ----------
   計画: tasks/todo.md「v235」補足・補足2（Codex 計画レビュー済み）。
   - 読むときは det・clip を1つの読み取りの取引で読み、その時点の一貫した写しを使う
   - 書き出す項目は AI_DET_KEYS だけ（内部の印 _dg などを出さない）
   - 読み戻しは「足りないものを足すだけ」。既にある検出は変えない（★・回数・更新日時も上書きしない）
     既に正常な声がある検出は声も変えない。声が無い・読めない検出だけ、読み込んだ正常な声で補う
   - 消した印（gone）のある検出・調査が無い/削除済みの検出は入れない。1件ずつ aiQ（削除と同じ列）で、
     同じ取引の中で gone と det を確かめてから書く（削除と重なっても消したものは戻らない）
   - 上限（1調査500件・声は1種10件〈自分で残した音は対象外〉・1調査30分・端末200MB）を超える分は入れない */
const AI_DET_KEYS=['id','kind','manual','sv','ja','sci','species_id','max','count','t0','t1','lat','lng','acc','pos_t',
  'model','clip','clip_sec','clip_bytes','clip_note','marked','reason','created_at','updated_at',
  // v242 学習用: 人が付けた名前（label_kind: ok/other/nonbird/unknown/空＝取り消し・未）と、聞き取り区間の出どころ
  'label_kind','label_ja','labeled_at','seg_id','seg_t0','clip_off0','clip_off1',
  // v243 声紋で選んだ区間（名前と一組。声の中の秒・高さ Hz。null は区間なし＝声全体）
  'label_t0','label_t1','label_f0','label_f1'];
function aiDetPlain(d){ const o={}; AI_DET_KEYS.forEach(k=>{ if(d && d[k]!==undefined) o[k]=d[k]; }); return o; }
// svs: 調査の uuid の並び（null なら全部）。withClips: 声の中身も読む
async function aiSnapshot(svs, withClips){
  const db=await aiDb();
  const tx=db.transaction(withClips?['det','clip']:['det'], 'readonly');
  const set=svs?new Set(svs):null;
  const all=(await aiReq(tx.objectStore('det').getAll()))||[];
  const dets=all.filter(d=>d && typeof d.id==='string' && (!set || set.has(d.sv)));
  const clips=[];
  if(withClips){
    const st=tx.objectStore('clip');
    for(const d of dets){ if(!d.clip) continue;
      const c=await aiReq(st.get(d.clip));
      if(c && c.pcm && c.pcm.length) clips.push(c); }
  }
  return { dets, clips };
}
function aiWavName(d){ return `ai_${d.id}.wav`; }
// WAV（16bit・モノラル・PCM）を { pcm:Int16Array, sr } に戻す。形式が違えば null
function aiWavParse(u8){
  try{
    if(!u8 || u8.length<44) return null;
    const v=new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const tag=o=>String.fromCharCode(u8[o],u8[o+1],u8[o+2],u8[o+3]);
    if(tag(0)!=='RIFF' || tag(8)!=='WAVE') return null;
    let o=12, fmt=null, data=null;
    while(o+8<=u8.length){
      const id=tag(o), len=v.getUint32(o+4,true), body=o+8;
      if(body+len>u8.length) break;
      if(id==='fmt ' && len>=16) fmt={ af:v.getUint16(body,true), ch:v.getUint16(body+2,true), sr:v.getUint32(body+4,true), bits:v.getUint16(body+14,true) };
      else if(id==='data') data={ at:body, len };
      o=body+len+(len&1);
    }
    if(!fmt || !data || fmt.af!==1 || fmt.ch!==1 || fmt.bits!==16 || !(fmt.sr>=8000 && fmt.sr<=192000)) return null;
    const n=Math.floor(data.len/2); if(n<1) return null;
    const pcm=new Int16Array(n);
    for(let i=0;i<n;i++) pcm[i]=v.getInt16(data.at+i*2,true);
    return { pcm, sr:fmt.sr };
  }catch(e){ return null; }
}
// 手動の全部のバックアップに入れる形。声は WAV の base64
async function aiBackupPart(){

  const clips=[];
  for(const c of snap.clips){
    clips.push({ id:c.id, sv:c.sv, det:c.det, sr:c.sr||AI_SR, t0:c.t0, wav_b64:await blobToB64(aiWav(c.pcm, c.sr||AI_SR)) });

function aiDetOk(d){
  if(!d || typeof d!=='object' || typeof d.id!=='string' || !d.id || !safeId(d.id)) return false;
  if(typeof d.sv!=='string' || !d.sv || !safeId(d.sv)) return false;
  if(d.kind!=='det' && d.kind!=='gap') return false;
  const num=x=>x==null || (typeof x==='number' && isFinite(x));
  if(!(typeof d.t0==='number' && isFinite(d.t0))) return false;
  if(!num(d.t1) || !num(d.max) || !num(d.count) || !num(d.lat) || !num(d.lng) || !num(d.acc)) return false;
  if(d.lat!=null && d.lng!=null && !validPathPt([d.lat, d.lng])) return false;
  if(d.kind==='det' && (typeof d.ja!=='string' || (d.count!=null && d.count<0))) return false;
  if(d.clip!=null && typeof d.clip!=='string') return false;
  return true;
}
function aiTallyNew(){ return { det:{ added:0, existed:0, gone:0, nosurvey:0, limit:0, broken:0 },
  clip:{ filled:0, ok:0, limit:0, broken:0 }, failed:0 }; }
function aiTallyText(t){
  const d=t.det, c=t.clip, parts=[];
  parts.push(`足した ${d.added}件`);
  if(d.existed) parts.push(`既にあった ${d.existed}件`);
  if(d.gone) parts.push(`この端末で消した ${d.gone}件は戻さず`);
  if(d.nosurvey) parts.push(`調査が無い ${d.nosurvey}件は入れず`);
  if(d.limit) parts.push(`上限（1調査${AI_CAP_DET}件）で ${d.limit}件は入れず`);
  if(d.broken) parts.push(`壊れていた ${d.broken}件`);
  const cp=[];
  if(c.filled) cp.push(`入れた・補った ${c.filled}件`);
  if(c.ok) cp.push(`既に正常 ${c.ok}件`);
  if(c.limit) cp.push(`上限で入れず ${c.limit}件`);
  if(c.broken) cp.push(`壊れていた ${c.broken}件`);
  return '鳴き声AIの検出: '+parts.join('・')+(cp.length?'\n声: '+cp.join('・'):'')+(t.failed?`\n書き込みに失敗 ${t.failed}件（確定していません）`:'');
}
// 全部のバックアップの ai を読み戻す。記録（調査）の読み込みが確定した後に呼ぶ
async function aiRestore(part){
  const t=aiTallyNew();
  if(!part || typeof part!=='object' || !Array.isArray(part.dets)) return t;
  const clipsIn=new Map();
  (Array.isArray(part.clips)?part.clips:[]).forEach(c=>{ if(c && typeof c.det==='string' && typeof c.id==='string' && safeId(c.id)
    && typeof c.wav_b64==='string' && c.wav_b64.length<=MEDIA_B64_MAX) clipsIn.set(c.det, c); });
  // いまの量（上限の判定用）。足すたびに数え足す
  let all=[]; try{ all=await aiDetsAll(); }catch(e){ t.failed=part.dets.length; return t; }
  const svDet=Object.create(null), svSec=Object.create(null), svSp=Object.create(null);
  let dev=0;
  const spKey=(sv,ja)=>sv+'\u0000'+ja;
  all.forEach(d=>{ if(!d) return;
    if(d.kind==='det') svDet[d.sv]=(svDet[d.sv]||0)+1;
    if(d.clip){ dev+=(d.clip_bytes||0); svSec[d.sv]=(svSec[d.sv]||0)+(d.clip_sec||0);
      if(!d.manual) svSp[spKey(d.sv,d.ja)]=(svSp[spKey(d.sv,d.ja)]||0)+1; } });
  const dets=part.dets.slice().sort((a,b)=>String(a&&a.created_at||'').localeCompare(String(b&&b.created_at||'')));
  for(const raw of dets){
    if(!aiDetOk(raw)){ t.det.broken++; continue; }
    const s=DB.survey(raw.sv);
    if(!s || s.deleted_at){ t.det.nosurvey++; continue; }
    // 声を先に読む（取引の外で。取引の中で時間のかかる処理をすると取引が閉じる）
    const cin=raw.kind==='det' ? clipsIn.get(raw.id) : null;
    let wav=null, clipBroken=false;
    if(cin){ try{ wav=aiWavParse(new Uint8Array(await b64ToBlob(cin.wav_b64||'','audio/wav').arrayBuffer())); }catch(e){ wav=null; }
      if(!wav) clipBroken=true; }
    const sec=wav?wav.pcm.length/wav.sr:0, bytes=wav?wav.pcm.length*2:0;
    // prev: 声を補う検出の今の姿。実体が失われた声も参照・容量・秒数が残って数えられているので、
    // その分を差し引いてから判定する（上限ちょうどから1件欠けた声を、正常な控えから戻せるように。差分監査 Major 2）
    const clipRoom=(prev)=>{
      if(!wav) return false;
      const had=!!(prev && prev.clip);
      const pSp=had && !prev.manual ? 1 : 0, pSec=had ? (prev.clip_sec||0) : 0, pBytes=had ? (prev.clip_bytes||0) : 0;
      if(!raw.manual && (svSp[spKey(raw.sv,raw.ja)]||0)-pSp>=AI_CAP_CLIP_SP) return false;
      if((svSec[raw.sv]||0)-pSec+sec>AI_CAP_CLIP_SEC) return false;
      if(dev-pBytes+bytes>AI_CAP_DEV_BYTES) return false;
      return true; };
    let prevClip=null;   // 補った検出の、補う前の勘定（数え直しで二重に足さない）
    let r=null;
    try{
      r=await aiQ(raw.sv, async()=>{
        // 取引の直前にもう一度、調査が残っているかを見る（読み込みの間に調査を消したとき）
        const s2=DB.survey(raw.sv); if(!s2 || s2.deleted_at) return {res:'nosurvey'};
        const db=await aiDb(); const tx=db.transaction(['det','clip','gone'],'readwrite');
        const gone=await aiReq(tx.objectStore('gone').get(raw.id));
        if(gone){ await aiTxDone(tx); return {res:'gone'}; }
        const cur=await aiReq(tx.objectStore('det').get(raw.id));
        if(cur){
          // 既にある検出は変えない。声が無い・読めないときだけ補う
          if(cur.kind!=='det' || !cin){ await aiTxDone(tx); return {res:'existed', clip:cin?'ok':null}; }
          let have=null; if(cur.clip) have=await aiReq(tx.objectStore('clip').get(cur.clip));
          if(have && have.pcm && have.pcm.length){ await aiTxDone(tx); return {res:'existed', clip:'ok'}; }
          if(!wav){ await aiTxDone(tx); return {res:'existed', clip:'broken'}; }
          if(!clipRoom(cur)){ await aiTxDone(tx); return {res:'existed', clip:'limit'}; }
          const cid=uuid();
          tx.objectStore('clip').put({ id:cid, sv:cur.sv, det:cur.id, pcm:wav.pcm, sr:wav.sr, t0:(typeof cin.t0==='number'?cin.t0:cur.t0) });
          if(cur.clip) tx.objectStore('clip').delete(cur.clip);   // 読めなかった古い声の片付け（同じ取引）
          const next=Object.assign({}, cur, { clip:cid, clip_sec:sec, clip_bytes:bytes, clip_note:'' });
          // DB へ送る項目（声の有無・秒数・声のメモ）が変わるなら、内容と更新日時を一緒に書く（差分監査 Major 1）。
          // 実体を直しただけで送る項目が同じなら、元の日時のまま
          if(!cur.clip !== !next.clip || (cur.clip_sec||0)!==next.clip_sec || (cur.clip_note||'')!==next.clip_note) next.updated_at=nowISO();
          tx.objectStore('det').put(next);
          await aiTxDone(tx);
          prevClip=cur.clip ? { sec:cur.clip_sec||0, bytes:cur.clip_bytes||0, sp:cur.manual?0:1 } : null;
          return {res:'existed', clip:'filled'};
        }
        if(raw.kind==='det' && (svDet[raw.sv]||0)>=AI_CAP_DET){ await aiTxDone(tx); return {res:'limit'}; }
        const rec=aiDetPlain(raw);
        let clipRes=null;
        rec.clip=null; rec.clip_sec=0; rec.clip_bytes=0;
        if(raw.kind==='det'){
          if(wav && clipRoom()){
            const cid=uuid();
            tx.objectStore('clip').put({ id:cid, sv:rec.sv, det:rec.id, pcm:wav.pcm, sr:wav.sr, t0:(typeof cin.t0==='number'?cin.t0:rec.t0) });
            Object.assign(rec, { clip:cid, clip_sec:sec, clip_bytes:bytes, clip_note:raw.clip_note||'' });
            clipRes='filled';
          }else if(cin){
            clipRes=clipBroken?'broken':'limit';
            rec.clip_note=clipBroken?'バックアップの声が壊れていたため声なし':'バックアップから戻すときに上限のため声なし';
          }
        }
        tx.objectStore('det').put(rec);
        await aiTxDone(tx);
        return {res:'added', clip:clipRes, kind:raw.kind};
      });
    }catch(e){ console.warn('鳴き声AIの読み戻しに失敗', e); r=null; }
    if(!r || r===false){ t.failed++; continue; }
    if(r.res==='added'){ t.det.added++; if(r.kind==='det') svDet[raw.sv]=(svDet[raw.sv]||0)+1; }
    else if(r.res==='existed') t.det.existed++;
    else if(r.res==='gone') t.det.gone++;
    else if(r.res==='nosurvey') t.det.nosurvey++;
    else if(r.res==='limit') t.det.limit++;
    if(r.clip==='filled'){ t.clip.filled++;
      const pv=prevClip||{sec:0, bytes:0, sp:0};   // 欠けていた声の勘定は差し替える（二重に数えない）
      dev+=bytes-pv.bytes; svSec[raw.sv]=(svSec[raw.sv]||0)+sec-pv.sec;
      if(!raw.manual) svSp[spKey(raw.sv,raw.ja)]=(svSp[spKey(raw.sv,raw.ja)]||0)+1-pv.sp; }
    else if(r.clip==='ok') t.clip.ok++;
    else if(r.clip==='limit') t.clip.limit++;
    else if(r.clip==='broken') t.clip.broken++;
  }
  try{ await aiTotalsReload(); }catch(e){}
  return t;
}

/* ---------- 聞き取りの状態 ---------- */
const AIL={ want:false, sv:null, reasons:new Set(), cap:false, starting:false, gen:0, needResume:false,
  ctx:null, stream:null, node:null, wake:null, geoId:null, pos:null, lastPcm:0, t0:0,
  ring:new Float32Array(AI_SR*AI_RING_SEC), written:0, next:0, judged:0, busy:null, seg:null, segId:0,
  events:[], pendingClips:[], humanWins:new Set(), lost:[], gap:null, pops:[], popOpen:false, lagSec:0, tick:null,
  how:'std' };   // how … 今回の聞き取りで実際に使う聞き方（開始時に決めて固定。途中で標準に戻ることはある）
const AI_REASON={ hidden:'画面が消えた・別アプリ', rec:'録音メモ・すぐ録音', cam:'写真・動画の撮影', play:'声の再生', fail:'マイクを使えなかった' };

function aiCanRun(){
  return AIL.want && AIL.reasons.size===0 && !AIL.needResume && !document.hidden && aiSvOk(AIL.sv)
    && !!window.WRITE_OK && !window.READ_ONLY && AI.state==='ready' && !!AI.worker;
}
function aiSync(){
  if(aiCanRun()){ if(!AIL.cap && !AIL.starting) aiCaptureStart(); }
  else if(AIL.cap || AIL.starting) aiCaptureStop();

}
function aiPause(r){ AIL.reasons.add(r); aiSync(); }
function aiResume(r){ if(!AIL.reasons.has(r)) return; AIL.reasons.delete(r); aiSync(); }

async function aiListenStart(){
  if(AIL.want) return;
  if(AI.state!=='ready'){ toast(AI.state==='nosupport'?'この端末では鳴き声AIを使えません':'先に鳴き声AIを取り込んでください（約64MB・Wi-Fi 推奨）', 5000);
    if(AI.state!=='nosupport') nav('aiSettings', null); return; }
  const sv=currentSurveyUuid;
  if(!aiSvOk(sv)){ toast('調査中の調査を開いてから押してください'); return; }
  if(!writeAllowed()) return;
  try{ await aiTotalsReload(sv); }catch(e){ toast('聞こえた鳥の記録を読めませんでした'); return; }
  if(AI_TOT.det>=AI_CAP_DET){ toast(`この調査の聞こえた鳥が上限（${AI_CAP_DET}件）に達しています。一覧を整理すると続けられます`, 6000); return; }
  AIL.want=true; AIL.sv=sv; AIL.t0=Date.now(); AIL.events=[]; AIL.needResume=false; AIL.reasons.delete('fail');
  aiFabUpdate();
  let how='std';
  try{
    if(AICFG.how==='head' && aiHeadUsable()){
      try{ await aiWorkerEnsure({ ext:true }); how='head'; }
      catch(e){
        console.warn(e);
        AIH.runErr='「しっかり」の部品を起動できませんでした（'+(e&&e.message||e)+'）';
        aiWorkerKill(); await aiWorkerEnsure();
        toast('「しっかり」を起動できなかったため、標準の聞き方で聞きます', 5000);
      }

function aiListenStop(msg){

function aiTick(){

// 画面が変わるたびに呼ぶ（render の最後）。聞き取りの対象と違う調査を開いたら止める
function aiOnRender(){
  if(currentSurveyUuid && AIL._popSv && AIL._popSv!==currentSurveyUuid) AIL.popOpen=false;   // 別の調査では一覧を開いたまま持ち越さない
  if(currentSurveyUuid) AIL._popSv=currentSurveyUuid;
  if(_aiPopRec.size && currentSurveyUuid && [..._aiPopRec.values()].some(r=>r.sv!==currentSurveyUuid)){
    [..._aiPopRec.keys()].forEach(id=>{ if(_aiPopRec.get(id).sv!==currentSurveyUuid) _aiPopRec.delete(id); });
    AIL.pops=AIL.pops.filter(id=>_aiPopRec.has(id));
  }
  if(AIL.want){
    if(!aiSvOk(AIL.sv)) aiListenStop('調査が終了・削除されたため、聞き取りを止めました');
    else if(currentSurveyUuid && currentSurveyUuid!==AIL.sv) aiListenStop('別の調査を開いたため、聞き取りを止めました');
    else if(window.READ_ONLY) aiListenStop('保存できない状態になったため、聞き取りを止めました');
  }
  aiFabUpdate();
}

/* ---------- マイク ---------- */
async function aiAddWorklet(ctx){
  const f=aiFiles(); const u=f.app.find(x=>x.endsWith('/pcm-recorder.js'));
  const t=await aiCacheText(AI_CACHE_APP, u);
  const bu=URL.createObjectURL(new Blob([t], {type:'text/javascript'}));
  // 保存分（Blob）だけで読む。読めなければ通信には戻らず失敗にする（呼び出し側が「再開」を出す。監査 Minor）
  try{ await ctx.audioWorklet.addModule(bu); }
  finally{ URL.revokeObjectURL(bu); }
}
function aiRelease(o){
  try{ o.node && (o.node.port.onmessage=null, o.node.disconnect()); }catch(e){}
  try{ o.stream && o.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ o.ctx && o.ctx.close(); }catch(e){}
}
async function aiCaptureStart(){
  const gen=++AIL.gen; AIL.starting=true; aiFabUpdate();

  const stale=()=>gen!==AIL.gen || !aiCanRun();
  try{
    o.stream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:!!AICFG.agc } });
    if(stale()) throw 'stale';   // 許可待ちの間に止めた・調査が変わった → すぐ放す
    o.ctx=new (window.AudioContext||window.webkitAudioContext)({ sampleRate:AI_SR });
    await aiAddWorklet(o.ctx);
    if(stale()) throw 'stale';
    if(o.ctx.state==='suspended'){ try{ await o.ctx.resume(); }catch(e){} }
    if(stale()) throw 'stale';   // 待っている間に止めた・画面が隠れた・録音が始まった → マイクをつながずに放す（監査 Major）
    const src=o.ctx.createMediaStreamSource(o.stream);
    o.node=new AudioWorkletNode(o.ctx, 'pcm-recorder');
    AIL.ring.fill(0); AIL.written=0; AIL.next=0; AIL.judged=0; AIL.busy=null;
    AIL.humanWins.clear(); AIL.lost=[]; AIL.pendingClips=[];
    for(const e of AIL.events) e.closed=true;
    AIL.seg={ t0:Date.now(), id:++AIL.segId, uid:uuid() };   // uid: 開き直しても変わらない区間の ID（v242 学習用の出どころ）
    o.node.port.onmessage=e=>{ if(gen===AIL.gen) aiOnPcm(e.data); };

/* ---------- 判別 ---------- */
function aiOnPcm(chunk){
  const R=AIL.ring.length;
  for(let i=0;i<chunk.length;i++) AIL.ring[(AIL.written+i)%R]=chunk[i];
  AIL.written+=chunk.length; AIL.lastPcm=Date.now();
  aiPump();
}
function aiRingGet(a,b){
  const R=AIL.ring.length;
  if(a<0 || a<AIL.written-R || b>AIL.written) return null;
  const out=new Float32Array(b-a);
  for(let s=a;s<b;s++) out[s-a]=AIL.ring[s%R];
  return out;
}
const aiTOf=(seg,s)=>seg.t0+s/AI_SR*1000;
async function aiPump(){
  if(AIL.busy!==null || !AIL.cap || !AIL.seg) return;
  const gen=AIL.gen, seg=AIL.seg, R=AIL.ring.length;
  if(AIL.next < AIL.written-R){   // 処理が遅れて消えた音は欠測（判別にも保存にも使わない）
    const nn=Math.ceil((AIL.written-R)/AI_WIN)*AI_WIN;
    AIL.lost.push([AIL.next, nn]); AIL.next=nn; AIL.judged=nn;
  }
  const avail=Math.floor((AIL.written-AIL.next)/AI_WIN);
  if(avail<1){ aiQueueFlush(); return; }
  const n=Math.min(AI_BATCH, avail), start=AIL.next, end=start+n*AI_WIN;
  const pcm=aiRingGet(start,end); if(!pcm) return;
  AIL.next=end; AIL.busy=gen;
  let fellBack=false;
  try{
    let r, used=AIL.how;
    if(used==='head'){
      const keep=pcm.slice();   // 判定し直しに使う写し（依頼で音を手放すため）
      try{
        r=await aiAsk({ message:'scores_emb', pcm }, [pcm.buffer], AIH.reqMs);
        if(!r.emb || r.D!==AIH.head.D || r.emb.length!==r.n*r.D) throw new Error('声の指紋が返りませんでした');
      }catch(err){
        if(gen!==AIL.gen) return;
        console.warn(err);
        used='std'; fellBack=true;
        r=await aiHeadFallback(keep, gen);   // 標準に切り替えて同じ区間を判定し直す（失敗したら欠測）
      }
    } else r=await aiAsk({ message:'scores', pcm }, [pcm.buffer]);
    if(gen!==AIL.gen) return;   // 途中で止めた・再開した → 古い結果は捨てる
    for(let f=0; f<r.n; f++) aiHandleWindow(start+f*AI_WIN, r.scores.subarray(f*r.C,(f+1)*r.C), seg,
      used, used==='head' ? r.emb.subarray(f*r.D,(f+1)*r.D) : null);
    AIL.judged=end; AIL.lagSec=(AIL.written-AIL.next)/AI_SR;
    aiQueueFlush();
  }catch(err){
    console.warn(err);
    if(gen===AIL.gen){
      AIL.lost.push([start,end]); AIL.judged=end;
      if(fellBack){   // 「しっかり」から標準に戻しても判定できなかった → 一覧に残し、聞き取りを止める（「聞く」でやり直せる）
        aiPutDet({ id:uuid(), kind:'gap', sv:AIL.sv, t0:aiTOf(seg,start), t1:aiTOf(seg,end),
          reason:'鳴き声AIが応答せず判定できなかった', created_at:nowISO() });
        setTimeout(()=>aiListenStop('鳴き声AIが応答しなくなったため、聞き取りを止めました。もう一度「聞く」を押してください'), 0);
      }
    }
  }finally{
    if(AIL.busy===gen) AIL.busy=null;
  }
  if(AIL.cap && gen===AIL.gen) setTimeout(aiPump, 0);
}
// how … この区間を判定した方法（'std' | 'head'）。emb … 'head' のときの声の指紋
function aiHandleWindow(ws, row, seg, how='std', emb=null){
  const P=AI.prep; if(!P) return;
  if(P.humanIdx!==undefined && row[P.humanIdx]>=AI_HUMAN_THR) AIL.humanWins.add(ws);   // 人の声は BirdNET の値のまま
  if(how==='head' && !(emb && AIH.head)) how='std';
  const adj = how==='head' ? aiHeadAdjust(row, emb) : null;   // 覚えさせた種だけ上乗せした値
  const hits=[];
  const cand = AICFG.hk ? P.hkIdx : row.keys();   // 北海道に絞らないときは全種から
  for(const i of cand){ const s=(adj && adj.has(i)) ? adj.get(i) : row[i];
    if(!P.nonBird.has(i) && s>=AICFG.thr) hits.push({i, s}); }
  hits.sort((a,b)=>b.s-a.s); hits.length=Math.min(hits.length, AICFG.maxPer);
  const tw=aiTOf(seg,ws);
  for(const h of hits){
    const ja=P.idxName.get(h.i) || (P.labels[h.i]&&P.labels[h.i].ja) || '';   // 北海道に絞らないときは BirdNET の和名
    // 違う方法で判定した検出は同じ記録にまとめない（記録の model と実際の判定をそろえる）
    let ev=AIL.events.find(e=>e.ja===ja && e.how===how && !e.closed && e.segId===seg.id && ws-e.endS<=AI_GAP_MERGE*AI_WIN);
    if(!ev){
      if(AI_TOT.det>=AI_CAP_DET){ aiListenStop(`この調査の聞こえた鳥が上限（${AI_CAP_DET}件）に達したため、聞き取りを止めました。一覧を整理すると続けられます`); return; }
      const pos=aiPosNow(), posOk=pos && Math.abs(pos.t-tw)<=AI_POS_MAX_AGE;
      const sp=speciesByName(ja) || speciesByName(P.idxMaster.get(h.i)||'');
      const rec={ id:uuid(), kind:'det', sv:AIL.sv, ja, sci:P.labels[h.i].sci, species_id:sp?sp.species_id:'',
        max:0, count:0, t0:tw, t1:aiTOf(seg,ws+AI_WIN),
        lat:posOk?pos.lat:null, lng:posOk?pos.lng:null, acc:posOk?pos.acc:null, pos_t:posOk?pos.t:null,
        seg_id:seg.uid||'', seg_t0:seg.t0,
        model:how==='head' ? AI_MODEL_VER+'＋'+AIH.head.name : AI_MODEL_VER, clip:null, clip_sec:0, clip_bytes:0, clip_note:'', marked:false, obs_uuid:null, created_at:nowISO() };
      ev={ rec, ja, how, segId:seg.id, startS:ws, endS:ws+AI_WIN, closed:false };
      AIL.events.push(ev); AI_TOT.det++;
      aiPopAdd(rec);
    }
    ev.rec.count++; ev.endS=ws+AI_WIN; ev.rec.t1=aiTOf(seg,ws+AI_WIN);
    if(h.s>ev.rec.max){
      ev.rec.max=h.s;
      // いちばんよく聞こえた区間の前後を、その範囲がすべて判別し終わった時点で切り出す（保存前なら差し替える）
      // 声の保存を始めた検出（_clipSaving）は差し替えない（二重に保存して勘定がずれるため。再監査 Major）
      if(!ev.rec.clip && !ev.rec._clipSaving){
        const a=Math.max(0, ws-AICFG.pad*AI_SR), b=ws+AI_WIN+AICFG.pad*AI_SR;
        AIL.pendingClips=AIL.pendingClips.filter(p=>p.ev!==ev);
        AIL.pendingClips.push({ ev, a, b, need:Math.ceil(b/AI_WIN)*AI_WIN, seg, gen:AIL.gen });
      }
    }
    aiPutDet(ev.rec);
    aiPopUpdate(ev.rec);
  }
  for(const e of AIL.events) if(!e.closed && e.segId===seg.id && ws-e.endS>AI_GAP_MERGE*AI_WIN) e.closed=true;
  AIL.events=AIL.events.filter(e=>!e.closed || AIL.pendingClips.some(p=>p.ev===e));
  aiListLive();
}
function aiQueueFlush(){
  const ready=AIL.pendingClips.filter(p=>p.gen===AIL.gen && AIL.judged>=p.need);
  if(!ready.length) return;
  AIL.pendingClips=AIL.pendingClips.filter(p=>!ready.includes(p));
  for(const p of ready){
    const rec=p.ev.rec;
    let human=false;
    for(let s=Math.floor(p.a/AI_WIN)*AI_WIN; s<p.b; s+=AI_WIN) if(AIL.humanWins.has(s)){ human=true; break; }
    const lost=AIL.lost.some(([x,y])=>p.a<y && x<p.b);
    const pcm=(!human && !lost)? aiRingGet(p.a,p.b) : null;
    const sec=(p.b-p.a)/AI_SR, bytes=(p.b-p.a)*2;
    let note='';
    if(human) note='AIが人の声と判定した区間を含むため声の保存なし';
    else if(lost) note='判別できなかった区間を含むため声の保存なし';
    else if(!pcm) note='処理が遅れ音が残っていないため声の保存なし';
    else if((AI_TOT.clipSp[rec.ja]||0)>=AI_CAP_CLIP_SP) note=`この種の声は${AI_CAP_CLIP_SP}件まで保存済み（上限のため声なし）`;
    else if(AI_TOT.clipSec+sec>AI_CAP_CLIP_SEC) note='この調査の声が上限（合計30分）のため声なし';
    else if(AI_TOT.devBytes+bytes>AI_CAP_DEV_BYTES) note='端末の声の保存量が上限（200MB）のため声なし';
    if(note){
      rec.clip_note=note; aiPutDet(rec);
      if(/上限/.test(note) && !AI_TOT.warned){ AI_TOT.warned=true; toast('聞こえた鳥の声が上限に達したため、これからの声は保存しません（検出は続けて記録します）', 6000); }
      continue;
    }
    const i16=new Int16Array(pcm.length);
    for(let i=0;i<pcm.length;i++) i16[i]=Math.max(-32768, Math.min(32767, Math.round(pcm[i]*32767)));
    const clip={ id:uuid(), sv:rec.sv, det:rec.id, pcm:i16, sr:AI_SR, t0:aiTOf(p.seg,p.a) };
    // 上限の勘定は先に押さえる（続けて来た分が同時に上限を越えないように）。失敗したら戻す
    if(rec.clip || rec._clipSaving) continue;   // 念のため: すでに声がある・保存中
    rec._clipSaving=true;
    AI_TOT.clipSp[rec.ja]=(AI_TOT.clipSp[rec.ja]||0)+1; AI_TOT.clipSec+=sec; AI_TOT.devBytes+=bytes;
    aiQ(rec.sv, async()=>{
      const db=await aiDb();
      const tx=db.transaction(['det','clip'],'readwrite');
      const cur=await aiReq(tx.objectStore('det').get(rec.id));
      if(cur && cur.clip) return false;   // 保存済みの声があれば足さない（予約した勘定は呼び出し側で戻す）
      const off={ clip_off0:p.a/AI_SR, clip_off1:p.b/AI_SR };   // 聞き取り区間の中での声の位置（秒）
      const next=Object.assign({}, cur||rec, off, { clip:clip.id, clip_sec:sec, clip_bytes:bytes, clip_note:'', updated_at:nowISO() }); delete next._dg; delete next._clipSaving;
      tx.objectStore('clip').put(clip); tx.objectStore('det').put(next);   // 声と検出は同じ処理で一緒に確定する
      await aiTxDone(tx);
      Object.assign(rec, off, { clip:clip.id, clip_sec:sec, clip_bytes:bytes, clip_note:'', updated_at:next.updated_at });
      return true;
    }, rec._dg).then(ok=>{
      if(ok) return;
      AI_TOT.clipSp[rec.ja]--; AI_TOT.clipSec-=sec; AI_TOT.devBytes-=bytes;
    }).catch(()=>{
      AI_TOT.clipSp[rec.ja]--; AI_TOT.clipSec-=sec; AI_TOT.devBytes-=bytes;
      rec.clip_note='声の保存に失敗（端末の空き容量など）'; aiPutDet(rec);
    }).finally(()=>{ rec._clipSaving=false; aiPopUpdate(rec); aiListLive(); });
  }
}
function aiAbandonPending(note){
  for(const p of AIL.pendingClips) if(!p.ev.rec.clip){ p.ev.rec.clip_note=note; aiPutDet(p.ev.rec); aiPopUpdate(p.ev.rec); }
  AIL.pendingClips=[];
}

/* ---------- 声の再生（再生中は聞き取りを止め、AI が再生音を拾わないようにする） ---------- */
let _aiPlayer=null;
function aiWav(i16, sr){
  const buf=new ArrayBuffer(44+i16.length*2), v=new DataView(buf);
  const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+i16.length*2,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,i16.length*2,true);
  new Int16Array(buf,44).set(i16);
  return new Blob([buf], {type:'audio/wav'});
}
let _aiPlayGen=0;
function aiPlayStop(){
  _aiPlayGen++;   // 読み込み中の再生要求も無効にする
  if(_aiPlayer){ const p=_aiPlayer; _aiPlayer=null; try{ p.onended=p.onpause=p.onerror=null; p.pause(); }catch(e){} try{ URL.revokeObjectURL(p.src); }catch(e){} }
  aiResume('play');
}
async function aiPlay(clipId){
  aiPlayStop();
  const g=_aiPlayGen;
  let c=null; try{ c=await aiClipGet(clipId); }catch(e){}
  if(g!==_aiPlayGen) return;   // 読み込みの間に別の再生・停止が押された（音を重ねない。監査 Major）
  if(!c || !c.pcm){ toast('声が見つかりませんでした'); return; }
  aiPause('play');
  const a=new Audio(URL.createObjectURL(aiWav(c.pcm, c.sr||AI_SR)));
  _aiPlayer=a;
  const end=()=>{ if(_aiPlayer===a) aiPlayStop(); };
  a.onended=end; a.onpause=end; a.onerror=end;
  a.play().catch(end);
}


/* ---------- 声紋（スペクトログラム）を見て、選んだ部分を判別する（v243） ----------
   計画: tasks/todo.md「声紋（スペクトログラム）を見て、選んだ部分を判別する」P1〜P7・補足・補足2・補足3（Codex 計画レビュー済み）
   - 今の画面の上に重ねて開く（画面を離れない＝書きかけの観察・聞き取りはそのまま）。閉じても共有の処理役は止めない
   - 展開する前に見出しで長さ・チャンネル数を確かめる（20MB・5分・2チャンネル・見込み120MB まで。分からない形式は断る）
   - 判別は聞き取りを優先し、1件ずつ3秒単位で聞き取りの合間に依頼する。閉じる・切り替える・選び直すで世代を進め、遅れた結果は捨てる
   - 録音メモの録音中は再生しない（録音に入るため）。再生中は聞き取りを止める（今の ▶ と同じ）
   - 鳴き声AIの声に名前を付けるときは、選んだ区間も一緒に保存する（aiLabelSet の region） */
const SPEC_MAX_BYTES=20*1024*1024, SPEC_MAX_SEC=300, SPEC_MAX_CH=2, SPEC_MAX_EXPAND=120*1024*1024, SPEC_MAX_COLS=6000;
const SPEC_H=256, SPEC_N=1024;
const SPEC={ gen:0, job:0, pcm:null, sr:AI_SR, hop:256, cols:0, fmax:12000, sel:null, src:null, det:null, res:null, resSel:null, band:false,
  inflight:false, reqId:0, reqMs:30000 };
  // inflight: 声紋の判別の依頼が処理役に出ている（同時に1件だけ）。reqId: その依頼の番号。
  // 待ち時間（reqMs）が切れても処理役はまだ計算中のことがあるので、返事が届くか処理役が止まるまで inflight は下ろさない

// ---- 見出しから長さとチャンネル数を読む（展開しない。DB の training_clips.audio_probe と同じ考え方） ----
function specVint(u8, pos, keep){
  if(pos>=u8.length) return null;
  const b=u8[pos]; let n=1, mask=0x80;
  while(n<=8 && !(b&mask)){ n++; mask>>=1; }
  if(n>8 || pos+n>u8.length) return null;
  let v=keep ? b : (b&(mask-1));
  for(let k=1;k<n;k++) v=v*256+u8[pos+k];
  return { v, n, unknown: !keep && v===Math.pow(2, 7*n)-1 };
}
function audioProbe(u8){
  const dv=new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const tag=(o,l=4)=>String.fromCharCode(...u8.subarray(o,o+l));
  try{
    if(u8.length>=12 && tag(0)==='RIFF' && tag(8)==='WAVE'){
      let o=12, ch=0, sr=0, bits=0, bytes=0;
      while(o+8<=u8.length){ const id=tag(o), len=dv.getUint32(o+4,true), body=o+8;
        if(id==='fmt ' && len>=16){ ch=dv.getUint16(body+2,true); sr=dv.getUint32(body+4,true); bits=dv.getUint16(body+14,true); }
        else if(id==='data'){ if(body+len>u8.length) return { err:'WAV が途中で切れています' }; bytes=len; }
        o=body+len+(len&1); }
      if(!ch || !sr || !bits || !bytes) return { err:'WAV の作りが読めません' };
      return { fmt:'wav', sec:bytes/(sr*ch*(bits/8)), ch };
    }
    if(u8.length>=12 && tag(4)==='ftyp'){
      const C=new Set(['moov','trak','mdia','minf','stbl','moof','traf','mvex','edts']);
      let mvhd=0, ts=0, dur=0, ch=0;
      const walk=(s,e)=>{ let p=s; while(p+8<=e){ let size=dv.getUint32(p), hdr=8; const t=tag(p+4);
          if(size===1){ size=Number(dv.getBigUint64(p+8)); hdr=16; } else if(size===0) size=e-p;
          if(size<hdr || p+size>e) throw new Error('box');
          const b=p+hdr;
          if(t==='mvhd'){ const v=u8[b]; const t2=v===1?dv.getUint32(b+20):dv.getUint32(b+12), d2=v===1?Number(dv.getBigUint64(b+24)):dv.getUint32(b+16); mvhd=t2?d2/t2:0; }
          else if(t==='mdhd'){ ts=dv.getUint32(b+(u8[b]===1?20:12)); }
          else if(t==='stsd' && !ch){ ch=dv.getUint16(b+8+24); }
          else if(t==='trun'){ const fl=(u8[b+1]<<16)|(u8[b+2]<<8)|u8[b+3], cnt=dv.getUint32(b+4);

          if(C.has(t)) walk(b, p+size);

      walk(0, u8.length);
      const sec=mvhd || (ts?dur/ts:0);
      if(!sec || !ch) return { err:'M4A の長さかチャンネル数が分かりません' };
      return { fmt:'m4a', sec, ch };
    }
    if(u8[0]===0x1a && u8[1]===0x45 && u8[2]===0xdf && u8[3]===0xa3){
      const M=new Set([0x18538067,0x1F43B675,0xA0,0x1654AE6B,0xAE,0xE1]);
      let p=0, scale=1e6, ctc=0, last=0, ch=0, audio=false;
      while(p<u8.length){ const id=specVint(u8,p,true); if(!id) return { err:'WebM の作りが読めません' };
        const sz=specVint(u8,p+id.n,false); if(!sz) return { err:'WebM の作りが読めません' };
        const b=p+id.n+sz.n;
        if(M.has(id.v)){ if(id.v===0xE1){ audio=true; ch=ch||1; } p=b; continue; }
        if(sz.unknown || b+sz.v>u8.length) return { err:'WebM が途中で切れています' };

        else if(id.v===0xA3 || id.v===0xA1){ const tn=specVint(u8,b,false); if(tn){ const rel=dv.getInt16(b+tn.n); last=Math.max(last, ctc+rel); } }

      const sec=last*scale/1e9;

      return { fmt:'webm', sec, ch };
    }

      const oh=(function(){ for(let i=0;i<Math.min(u8.length-8,512);i++) if(tag(i,8)==='OpusHead') return i; return -1; })();

      else { for(let i=0;i<Math.min(u8.length-16,512);i++) if(u8[i]===1 && tag(i+1,6)==='vorbis'){ ch=u8[i+11]; rate=dv.getUint32(i+12,true); break; } }
      while(p<u8.length){ if(tag(p)!=='OggS' || p+27>u8.length) return { err:'Ogg が途中で切れています' };

      if(!rate || !ch || !gran) return { err:'Ogg の長さかチャンネル数が分かりません' };
      return { fmt:'ogg', sec:gran/rate, ch };
    }
  }catch(e){ return { err:'音声の作りが読めません' }; }
  return { err:'この形式の音声は開けません（WAV・M4A・WebM・Ogg のみ）' };
}
function specLimitProblem(sec, ch, bytes){
  if(bytes>SPEC_MAX_BYTES) return 'ファイルが 20MB を超えています';
  if(!(sec>0)) return '長さが分かりません';
  if(sec>SPEC_MAX_SEC) return `長さが5分を超えています（${Math.round(sec)}秒）。長い録音は長時間録音の道具で開いてください`;
  if(!(ch>=1)) return 'チャンネル数が分かりません';
  if(ch>SPEC_MAX_CH) return `チャンネルが ${ch} あります（2 まで）`;
  if(sec*AI_SR*4*ch>SPEC_MAX_EXPAND) return '展開すると大きくなりすぎます';
  return '';
}
async function specDecode(u8){
  const pr=audioProbe(u8);
  if(pr.err) throw new Error(pr.err);
  const bad=specLimitProblem(pr.sec, pr.ch, u8.length); if(bad) throw new Error(bad);
  const ac=new (window.AudioContext||window.webkitAudioContext)({ sampleRate:AI_SR });
  let buf; try{ buf=await ac.decodeAudioData(u8.buffer.slice(u8.byteOffset, u8.byteOffset+u8.byteLength)); } finally{ try{ ac.close(); }catch(e){} }
  const bad2=specLimitProblem(buf.duration, buf.numberOfChannels, 0); if(bad2) throw new Error(bad2);   // 展開した後にも確かめ直す
  const n=buf.length, out=new Float32Array(n);
  for(let c=0;c<buf.numberOfChannels;c++){ const d=buf.getChannelData(c); for(let i=0;i<n;i++) out[i]+=d[i]/buf.numberOfChannels; }
  return out;
}

async function specOpen(src){
  specClose();
  const gen=++SPEC.gen;
  SPEC.src=src; SPEC.fmax=12000; SPEC.band=false;
  const ov=document.createElement('div'); ov.id='specOv'; ov.className='spec-ov';
  const title=src.kind==='clip' ? '声紋（聞こえた鳥の声）' : src.kind==='audio' ? '声紋（録音メモ）' : '声紋（端末の音声ファイル）';
  ov.innerHTML=specOverlayHtml(title); document.body.appendChild(ov);
  const msg=t=>{ const m=document.getElementById('specMsg'); if(m && gen===SPEC.gen) m.textContent=t; };
  try{
    let pcm=null, det=null;
    if(src.kind==='clip'){
      const c=await aiClipGet(src.clip); if(!c || !c.pcm) throw new Error('声が見つかりませんでした');
      if((c.sr||AI_SR)!==AI_SR) throw new Error('この声は開けません（標本化周波数が違います）');
      pcm=new Float32Array(c.pcm.length); for(let i=0;i<pcm.length;i++) pcm[i]=c.pcm[i]/32768;
      if(src.det){ try{ det=await aiReq((await aiDb()).transaction('det').objectStore('det').get(src.det)); }catch(e){} }
    } else if(src.kind==='audio'){
      const r=await AudioDB.get(src.id); if(!r || !r.blob) throw new Error('録音が見つかりませんでした');
      if(r.blob.size>SPEC_MAX_BYTES) throw new Error('ファイルが 20MB を超えています');
      if(Number(r.dur)>SPEC_MAX_SEC) throw new Error('長さが5分を超えています');
      pcm=await specDecode(new Uint8Array(await r.blob.arrayBuffer()));
    } else {
      const f=await new Promise(res=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='audio/*';
        inp.onchange=()=>res(inp.files&&inp.files[0]||null); inp.addEventListener('cancel', ()=>res(null)); inp.click(); });
      if(gen!==SPEC.gen) return;
      if(!f){ specClose(); return; }
      if(f.size>SPEC_MAX_BYTES) throw new Error('ファイルが 20MB を超えています');
      pcm=await specDecode(new Uint8Array(await f.arrayBuffer()));
    }
    if(gen!==SPEC.gen) return;   // 読み込みの間に閉じた・別の声を開いた → 何も反映しない（名前の保存先を取り違えない）
    SPEC.pcm=pcm; SPEC.det=det;
    await specDraw(gen);
  }catch(e){ msg('この音は開けませんでした: '+(e&&e.message||e)); }
}
async function specDraw(gen){
  const pcm=SPEC.pcm; if(!pcm) return;
  const n=pcm.length, hop=Math.max(256, Math.ceil(n/SPEC_MAX_COLS)), cols=Math.max(1, Math.floor(Math.max(0, n-SPEC_N)/hop)+1);
  SPEC.hop=hop; SPEC.cols=cols;
  const cv=document.getElementById('specCv'), sc=document.getElementById('specSel'); if(!cv) return;
  cv.width=cols; sc.width=cols;
  const ctx=cv.getContext('2d'), bins=Math.floor(SPEC.fmax/(AI_SR/SPEC_N));
  const win=new Float32Array(SPEC_N); for(let i=0;i<SPEC_N;i++) win[i]=0.5-0.5*Math.cos(2*Math.PI*i/SPEC_N);
  const db=new Float32Array(cols*bins); let mx=-1e9;
  for(let c=0;c<cols;c++){
    if(c%300===0){ await new Promise(r=>setTimeout(r,0)); if(gen!==SPEC.gen) return; }   // 画面を固めない
    const re=new Float64Array(SPEC_N), im=new Float64Array(SPEC_N), o=c*hop;
    for(let i=0;i<SPEC_N;i++) re[i]=(pcm[o+i]||0)*win[i];
    specFft(re, im);
    for(let k=0;k<bins;k++){ const v=10*Math.log10(re[k]*re[k]+im[k]*im[k]+1e-12); db[c*bins+k]=v; if(v>mx) mx=v; }
  }
  const img=ctx.createImageData(cols, SPEC_H), lo=mx-80;
  for(let c=0;c<cols;c++) for(let y=0;y<SPEC_H;y++){
    const k=Math.min(bins-1, Math.floor((SPEC_H-1-y)/SPEC_H*bins)), v=Math.max(0, Math.min(1, (db[c*bins+k]-lo)/80)), p=(y*cols+c)*4;
    img.data[p]=Math.min(255, 510*v)|0; img.data[p+1]=Math.max(0, Math.min(255, 460*(v-0.4)))|0; img.data[p+2]=Math.max(0, Math.min(255, 255*(0.6-Math.abs(v-0.3))))|0; img.data[p+3]=255;
  }
  ctx.putImageData(img, 0, 0);
  const sec=n/AI_SR;
  const m=document.getElementById('specMsg'); if(m) m.textContent='';
  const ax=document.getElementById('specAx'); if(ax) ax.textContent=`横: 0〜${sec.toFixed(2)}秒 ／ 縦: 0〜${SPEC.fmax/1000}kHz`;
  const fm=document.getElementById('specFm'); if(fm) fm.textContent=`0〜${SPEC.fmax/1000}kHz`;
  specSelBind(); specSelDraw();
}
function specFft(re, im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){ let b=n>>1; for(;j&b;b>>=1) j^=b; j^=b; if(i<j){ let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; } }
  for(let len=2;len<=n;len<<=1){ const a=-2*Math.PI/len, wr=Math.cos(a), wi=Math.sin(a);
    for(let i=0;i<n;i+=len){ let cr=1, ci=0;
      for(let j=0;j<len/2;j++){ const ur=re[i+j], ui=im[i+j], xr=re[i+j+len/2], xi=im[i+j+len/2];
        const vr=xr*cr-xi*ci, vi=xr*ci+xi*cr; re[i+j]=ur+vr; im[i+j]=ui+vi; re[i+j+len/2]=ur-vr; im[i+j+len/2]=ui-vi;
        const t=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=t; } } }
}
function specFmax(){ if(!SPEC.pcm) return; SPEC.fmax=SPEC.fmax===12000?24000:12000; SPEC.sel=null; specResClear(); specDraw(SPEC.gen); }
function specResClear(){ SPEC.job++; SPEC.res=null; SPEC.resSel=null; const b=document.getElementById('specRes'); if(b) b.innerHTML=''; }
function specSelClear(){ SPEC.sel=null; specResClear(); specSelDraw(); }
function specSelBind(){
  const sc=document.getElementById('specSel'); if(!sc || sc._bound) return; sc._bound=true;
  let start=null;
  const pt=e=>{ const r=sc.getBoundingClientRect(); return { x:Math.max(0, Math.min(sc.width, (e.clientX-r.left)*sc.width/r.width)), y:Math.max(0, Math.min(SPEC_H, (e.clientY-r.top)*SPEC_H/r.height)) }; };
  sc.addEventListener('pointerdown', e=>{ start=pt(e); sc.setPointerCapture(e.pointerId); e.preventDefault(); });
  sc.addEventListener('pointermove', e=>{ if(!start) return; specSetSel(start, pt(e)); });
  sc.addEventListener('pointerup', e=>{ if(!start) return; const p=pt(e); if(Math.abs(p.x-start.x)>2) specSetSel(start, p); start=null; });
}
function specSetSel(a, b){
  const sec=SPEC.pcm.length/AI_SR, toT=x=>Math.min(sec, x*SPEC.hop/AI_SR), toF=y=>Math.max(0, Math.min(SPEC.fmax, (SPEC_H-y)/SPEC_H*SPEC.fmax));
  const t0=toT(Math.min(a.x,b.x)), t1=toT(Math.max(a.x,b.x)), f0=toF(Math.max(a.y,b.y)), f1=toF(Math.min(a.y,b.y));
  SPEC.sel={ t0, t1, f0, f1 };
  specResClear(); specSelDraw();
}
function specSelDraw(){
  const sc=document.getElementById('specSel'); if(!sc) return;
  const c=sc.getContext('2d'); c.clearRect(0,0,sc.width,sc.height);
  const s=SPEC.sel; if(!s) return;
  const x0=s.t0*AI_SR/SPEC.hop, x1=s.t1*AI_SR/SPEC.hop, y0=SPEC_H-s.f1/SPEC.fmax*SPEC_H, y1=SPEC_H-s.f0/SPEC.fmax*SPEC_H;
  c.strokeStyle='#0f0'; c.lineWidth=2; c.strokeRect(x0, y0, Math.max(2,x1-x0), Math.max(2,y1-y0));
}
function specSelPcm(){
  const p=SPEC.pcm, s=SPEC.sel; if(!p) return null;
  if(!s) return p;
  return p.subarray(Math.floor(s.t0*AI_SR), Math.max(Math.floor(s.t0*AI_SR)+1, Math.ceil(s.t1*AI_SR)));
}
function specPlay(){
  if(REC){ toast('録音中は再生できません（再生した音が録音に入るため）'); return; }
  const p=specSelPcm(); if(!p || !p.length) return;
  aiPlayStop();
  const i16=new Int16Array(p.length); for(let i=0;i<p.length;i++) i16[i]=Math.max(-32768, Math.min(32767, Math.round(p[i]*32767)));
  aiPause('play');
  const a=new Audio(URL.createObjectURL(aiWav(i16, AI_SR))); _aiPlayer=a;
  const end=()=>{ if(_aiPlayer===a) aiPlayStop(); };
  a.onended=end; a.onpause=end; a.onerror=end; a.play().catch(end);
}
// 選んだ部分の3秒区間の作り方: 3秒未満は前後を無音で足して3秒、それ以上は1.5秒ずつずらし、最後の余りは終わりから3秒
function specWindows(p){
  const W=AI_WIN, out=[];
  if(p.length<W){ const w=new Float32Array(W); w.set(p, Math.floor((W-p.length)/2)); return { wins:[w], padded:true }; }
  const step=W/2; let s=0;
  for(; s+W<=p.length; s+=step) out.push(p.slice(s, s+W));
  if(s-step+W<p.length) out.push(p.slice(p.length-W));
  return { wins:out, padded:false };
}
async function specBand(p, f0, f1){
  const ctx=new OfflineAudioContext(1, p.length, AI_SR), b=ctx.createBuffer(1, p.length, AI_SR); b.copyToChannel(p, 0);
  const src=ctx.createBufferSource(); src.buffer=b; let node=src;
  for(const [type, f] of [['highpass', Math.max(20, f0)], ['highpass', Math.max(20, f0)], ['lowpass', Math.min(AI_SR/2-100, f1)], ['lowpass', Math.min(AI_SR/2-100, f1)]]){
    const q=ctx.createBiquadFilter(); q.type=type; q.frequency.value=f; q.Q.value=0.707; node.connect(q); node=q; }
  node.connect(ctx.destination); src.start();
  return (await ctx.startRendering()).getChannelData(0).slice();
}
async function specAskWin(w, job){
  // 聞き取りを優先し、声紋の判別は同時に1件だけ: 聞き取りの判定・前の声紋の依頼が処理中なら終わるまで待つ
  while(AIL.busy!==null || SPEC.inflight){ await new Promise(r=>setTimeout(r, 50)); if(job!==SPEC.job) return null; }
  if(job!==SPEC.job) return null;   // 送る直前にも確かめる（中止・押し直し・閉じた後は送らない）
  SPEC.inflight=true;
  const pr=aiAsk({ message:'scores', pcm:w }, [w.buffer], SPEC.reqMs);
  SPEC.reqId=AI.reqId;   // aiAsk はその場で番号を付けて送る
  try{ const r=await pr; SPEC.inflight=false; return job===SPEC.job ? r : null; }
  catch(e){
    // 返事が無いまま待ち時間が切れた: 処理役がまだ計算中かもしれないので印は残す（遅れて届いた返事か、処理役の停止で下ろす）

    throw e;
  }
}
async function specJudge(){

        ${canLabel?`<button type="button" class="btn" style="width:auto;padding:4px 8px;" data-n="${esc(n)}" onclick="specLabel('name', this.dataset.n)">これにする</button>`:''}</div>`).join(''):'<div class="small muted">候補はありませんでした</div>'}
      ${human>=AI_HUMAN_THR?'<div class="tiny" style="color:#b45309;">人の声が入っている疑いがあります</div>':''}
      ${notes.map(t=>`<div class="tiny muted">${esc(t)}</div>`).join('')}
      <div class="tiny muted">確からしさは、選んだ範囲の3秒区間ごとの判定の最大値です（正解の確率ではありません）。</div>
      ${canLabel?`<div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap;"><span class="tiny muted">この区間を「本当は」:</span>

        <button type="button" class="btn" style="width:auto;padding:4px 8px;" onclick="specLabel('nonbird')">鳥ではない</button>
        <button type="button" class="btn" style="width:auto;padding:4px 8px;" onclick="specLabel('unknown')">? 分からない</button></div>`:''}</div>`);
  }catch(e){ show(`<div class="small" style="color:#b91c1c;">判別できませんでした: ${esc(e&&e.message||e)}</div>`); }
}
// 名前を付ける: いま表示している結果の区間（resSel）にだけ効く。高さが表示の全体なら高さは付けない
async function specLabel(what, name){
  const det=SPEC.det, gen=SPEC.gen, res=SPEC.res; if(!det || !res) return;
  const s=SPEC.resSel, sec=SPEC.pcm.length/AI_SR;
  const r3=x=>Math.round(x*1000)/1000;
  let region=null;
  if(s){ const fullF=s.f0<=SPEC.fmax*0.01 && s.f1>=SPEC.fmax*0.99;
    region={ t0:r3(s.t0), t1:r3(Math.min(s.t1, sec)), f0:fullF?null:Math.round(s.f0), f1:fullF?null:Math.round(s.f1) }; }
  let kind, ja='';
  if(what==='name'){ ja=name; kind = (det.ja===name && !det.manual) ? 'ok' : 'other'; }
  else if(what==='other'){ const v=prompt('本当は何の鳥でしたか？（種名）'); if(v==null) return; kind='other'; ja=v; }
  else kind=what;
  // 聞いている間に閉じた・別の声を開いた・結果が変わった → 付けない
  if(gen!==SPEC.gen || SPEC.det!==det || SPEC.res!==res) return;
  const ok=await aiLabelSet(det.id, kind, kind==='other'?ja:'', region);
  if(ok){ toast('この区間に名前を付けました', 2500);
    let fresh=null; try{ fresh=await aiReq((await aiDb()).transaction('det').objectStore('det').get(det.id)); }catch(e){}
    if(fresh && gen===SPEC.gen && SPEC.det && SPEC.det.id===det.id) SPEC.det=fresh; }
}
