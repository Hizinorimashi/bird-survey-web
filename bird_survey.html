  '大葦切':'オオヨシキリ','小葦切':'コヨシキリ','鵙':'モズ','百舌鳥':'モズ','百舌':'モズ',
};
const VOICE_ALIAS_KEYS=Object.keys(VOICE_SPECIES_ALIASES).sort((a,b)=>b.length-a.length);   // 長い表記を先に（「四十雀」を「雀」より先）
const VOICE_KANJI=/[一-鿿々]/;
const VOICE_PARTICLE='がはをのにともでへやかだ';
// 鳥名の直後がこれらの語で始まるなら、区切り文字が無くても単語の切れ目とみなす。
// 現場では「鶯さえずり」「鳶飛翔」「鶯二羽」のように助詞を挟まず話すため、これが無いと拾えない
// 「見」「鳴」「飛」のような1文字では地名・熟語を巻き込むため、活用形まで含めて並べる
const VOICE_NEXT_OK=[...OPT.behavior.filter(b=>b!=='その他'), ...OPT.detection.filter(d=>d!=='不明'),
  ...VOICE_DIRS, '羽','匹','個体','メートル','メーター','声','痕跡','糞','羽毛','って',
  '見た','見え','見つけ','鳴い','鳴き','鳴く','飛ん','飛び'];
// 漢数字も単独では地名を巻き込む（燕三条）ので、助数詞まで続く場合だけ切れ目として認める
const VOICE_NEXT_NUM=/^[一二三四五六七八九十]+\s*(?:羽|匹|個体)/;
function voiceNextKnown(str,pos){ const rest=str.slice(pos);
  return VOICE_NEXT_NUM.test(rest) || VOICE_NEXT_OK.some(w=>rest.startsWith(w)); }
// 右境界の共通判定。allowKanji=true は「原文にカタカナで書かれている」経路用（種名の確度が高いので
// 漢字が続いても切れ目とみなす）。どちらの経路でも、続きが既知の観察用語なら切れ目として認める
function voiceBoundR(str,pos,allowKanji){
  const nc=(pos<str.length)?str.charAt(pos):'';
  if(!nc) return true;
  if(!VOICE_KATA.test(nc) && (allowKanji || !VOICE_KANJI.test(nc))
    && (!/[ぁ-ゖ]/.test(nc) || VOICE_PARTICLE.includes(nc))) return true;
  return voiceNextKnown(str,pos);
}
// 当て字→カタカナの置換。単語境界つき: 前後が漢字・カタカナなら熟語の一部（麻雀・鳶職・鶯谷駅・翡翠色）
// とみなして変換しない。後ろのひらがなは助詞類だけを切れ目として認める（「鶯が」は変換・「夜鷹そば」は不変換）
function voiceAliasApply(s){
  let out=String(s||'');
  for(const k of VOICE_ALIAS_KEYS){
    if(!out.includes(k)) continue;
    const v=VOICE_SPECIES_ALIASES[k];
    if(!speciesByName(v)) continue;   // マスタに無い名前には変換しない（誤確定防止）
    let res='', i=0;
    while(i<out.length){
      const j=out.indexOf(k,i);
      if(j<0){ res+=out.slice(i); break; }
      const prev=j>0?out.charAt(j-1):'';
      const okL=!prev || (!VOICE_KANJI.test(prev) && !VOICE_KATA.test(prev));
      const okR=voiceBoundR(out, j+k.length, false);
      res+=out.slice(i,j)+((okL&&okR)?v:k);
      i=j+k.length;
    }
    out=res;
  }
  return out;
}
/* ---------- 「もしかして」候補（聞き間違いの受け止め） ----------
   音声認識は「ウグイズ」「シジュカラ」のように1〜2文字だけ外すことがある。
   ぴったり当たる種が1つも無いときだけ、近い名前を候補として出す。
   ここで出したものは自動では選ばない（黙って違う種を入れないため。選ぶのは利用者のタップ） */
// 上限つきの編集距離。上限を超えた時点で打ち切るので、候補にならない種の計算は早く終わる
function voiceEditDist(a,b,max){
  const la=a.length, lb=b.length;
  if(Math.abs(la-lb)>max) return max+1;
  let prev=[], cur=[];
  for(let j=0;j<=lb;j++) prev[j]=j;
  for(let i=1;i<=la;i++){
    cur[0]=i; let row=i;
    for(let j=1;j<=lb;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
      if(cur[j]<row) row=cur[j];
    }
    if(row>max) return max+1;   // この行が全部上限超え＝これ以上縮まらない
    const tmp=prev; prev=cur; cur=tmp;
  }
  return prev[lb];
}
// カタカナのかたまりの「先頭」を種名と比べる（発話は「種名→数→行動」の順で始まることが多い）
function voiceNearSpecies(t){
  const runs=(String(t||'').match(/[ァ-ヶー]{3,}/g)||[]).slice(0,4);
  if(!runs.length) return [];
  const out=[];
  for(const s of SPECIES){
    const n=toKata(s.japanese_name); if(n.length<3) continue;
    const lim=(n.length>=6)?2:1;   // 長い名前ほど1文字の取り違えが起きやすいので許容を広げる
    let d=lim+1;
    for(const run of runs){
      for(let L=n.length-1; L<=n.length+1 && d>0; L++){
        if(L<3 || L>run.length) continue;
        const dd=voiceEditDist(run.slice(0,L), n, lim);
        if(dd<d) d=dd;
      }
    }
    if(d<=lim) out.push({s,d,n});
  }
  out.sort((a,b)=>a.d-b.d || b.n.length-a.n.length);
  return out.slice(0,3).map(x=>x.s);
}
function parseVoiceObs(text){
  const raw=String(text||'').trim();
  // 当て字変換 → 正規化: ひらがな→カタカナ（種名マスタはカタカナ）・全角数字→半角・数字内の桁区切りカンマ除去
  const rawM=voiceAliasApply(raw);
  const t=toKata(rawM).replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/(\d)[,，](?=\d)/g,'$1');
  const r={ species_name:'', species_id:'', species_cands:[], count:'', behavior:'', detection_method:'',
    distance_band:'', direction:'', note: raw?('🎙 '+raw):'' };
  if(!raw) return r;
  // 種名の2段判定（「とびけら」→トビ、「うそみたい」→ウソ のような一般文への誤ヒットを防ぐ）:
  // 1) 原文にカタカナのまま現れ、前後がカタカナ以外（＝単語の切れ目）なら採用
  // 2) それが無ければ、かな正規化後の包含。ただし短い名前は誤ヒットしやすいので3文字以上のみ
  // 候補の中では最長を採用（「カラス」より「ハシブトガラス」を優先）
  const hits=[];
  for(const s of SPECIES){ const n=toKata(s.japanese_name);
    let hit=false, i=rawM.indexOf(n);
    while(i>=0){
      const okL=(i===0)||!VOICE_KATA.test(rawM.charAt(i-1));
      // 右境界: カタカナが続けば単語の途中（「トビが飛んだ」は採用、「トビけらがいた」は不採用）
      if(okL && voiceBoundR(rawM, i+n.length, true)){ hit=true; break; }
      i=rawM.indexOf(n,i+1);
    }
    // 2段目: ひらがなで話された場合。t は全体がカタカナ化されるので t 上では切れ目を判定できない。
    // toKata は文字数を変えないため、同じ位置の原文(rawM)の前後で境界を見る
    // （「うぐいすがないた」は採用・「うぐいす谷駅」「めじろ台駅」「かわせみ色」は不採用）
    if(!hit && n.length>=3){
      let k=t.indexOf(n);
      while(k>=0){
        const pc=k>0?rawM.charAt(k-1):'';
        const okL2=!pc || (!VOICE_KATA.test(pc) && !VOICE_KANJI.test(pc)
          && (!/[ぁ-ゖ]/.test(pc) || VOICE_PARTICLE.includes(pc)));
        if(okL2 && voiceBoundR(rawM, k+n.length, false)){ hit=true; break; }
        k=t.indexOf(n,k+1);
      }
    }
    if(hit) hits.push({s,n});
  }
  hits.sort((a,b)=>b.n.length-a.n.length);   // 長い名前を優先（「カラス」より「ハシブトガラス」）
  const best=hits[0]||null;
  if(best){ r.species_name=best.s.japanese_name; r.species_id=best.s.species_id; }
  // 候補: 当たった種を最大3件。1件も当たらなかったときだけ「もしかして」を出す（聞き間違い対策）。
  // もしかしては決して自動で選ばない＝黙って違う種が入ることが構造的に起きない
  r.species_cands = hits.length
    ? hits.slice(0,3).map(h=>({name:h.s.japanese_name, id:h.s.species_id, sure:true}))
    : voiceNearSpecies(t).map(s=>({name:s.japanese_name, id:s.species_id, sure:false}));
  // 距離帯: 「30メートル」「30m」「30.5m」→ 区分に丸める。「30mm」等の別単位は除外。
  // 先に取り、マッチ部分を文面から除いてから個体数を見る（距離の数字を個体数に誤取り込みしない）
  let t2=t;
  const dm=t.match(/(\d+(?:\.\d+)?)\s*(?:メートル|メーター|[mMｍ](?![a-zA-Zｍ]))/);
  if(dm){ const n=parseFloat(dm[1]); r.distance_band = n<=25?'〜25m' : (n<=50?'〜50m':'50m超');
    t2=t.replace(dm[0],' '); }
  // 個体数: 「2羽」「3匹」「2個体」（漢数字「二羽」「十羽」も可）。無ければ種名直後の裸の整数
  let count='';
  const cm=t2.match(/(?:^|[^\d.])(\d+)\s*(?:羽|匹|個体|ワ)/);
  if(cm) count=cm[1];
  if(!count){ const km=t2.match(/([一二三四五六七八九十]{1,3})\s*(?:羽|匹|個体|ワ)/);
    if(km){ const n=voiceKanjiNum(km[1]); if(n!=null) count=String(n); } }
  if(!count && best){ const after=t2.slice(t2.indexOf(best.n)+best.n.length);
    // 数字の直後に英字が続くもの（30mm 等の単位付き）は個体数と見なさない
    const m2=after.match(/^\s*(\d+)(?![\d.a-zA-Zａ-ｚＡ-Ｚ])/); if(m2) count=m2[1]; }
  r.count=count;
  // 行動: 選択肢の語が含まれるか（複数可。「その他」は対象外）
  const beh=OPT.behavior.filter(b=>b!=='その他' && t.includes(toKata(b)));
  r.behavior=beh.join('・');
  // 確認方法: キーワードから推定（無ければ空のまま＝入力画面の既定「目視」に従う）
  const hasEye=/目視|見エ|見タ/.test(t);
  const hasVoice=/声|鳴キ|サエズリ/.test(t);
  const hasTrace=/痕跡|糞|フン|羽毛/.test(t);
  const hasFly=/飛翔|飛ン/.test(t) || beh.includes('飛翔');
  if(hasEye&&hasVoice) r.detection_method='目視および鳴き声';
  else if(hasVoice) r.detection_method='鳴き声';
  else if(hasEye) r.detection_method='目視';
  else if(hasTrace) r.detection_method='痕跡';
  else if(hasFly) r.detection_method='飛翔';
  // 方向: 8方位の語（2文字を先に）
  for(const d of VOICE_DIRS){ if(t.includes(d)){ r.direction=d; break; } }
  return r;
}
SCREENS.voiceObs = (u)=>{
  const s=DB.survey(u); if(!s) return SCREENS.home();
  const hasSR=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  return {
    title:'音声で観察を追加',
    sub:[`<span class="pill">${esc(s.name||'調査')}</span>`],
    html:`
      <div class="note">「ウグイス 2羽 さえずり」のように話すと、種名・数・行動などに自動で振り分けます。内容は次の「観察を追加」画面で確認してから保存します。<br>${hasSR
        ?'🎙ボタンは<b>電波が必要</b>です。圏外のときは下の欄をタップして、キーボードのマイクで話してください（圏外でも使えます）。'
        :'この端末ではアプリ内の音声認識が使えないため、下の欄をタップして<b>キーボードのマイク🎙</b>で話してください（圏外でも使えます）。'}</div>
      ${hasSR?`<button class="btn primary big" id="voiceBtn" onclick="voiceListen()">🎙 話す</button><div class="sp"></div>`:''}
      <label class="field"><span class="lab">話した内容（手で修正できます）</span>
        <textarea id="voiceText" placeholder="例：ウグイス 2羽 さえずり 北東 30メートル" oninput="SCREENS._dirty=true; voicePreview()"></textarea></label>
      <div class="field"><span class="lab">読み取り結果</span>
        <div class="card" id="voicePrev" style="background:var(--panel2);">—</div></div>
      <button class="btn primary big" onclick="voiceToObs('${u}')">この内容で観察を追加</button>
    `,
    onMount:()=>{ voicePreview(); }
  };
};
let VREC=null;   // 音声認識セッション（多重起動防止）
// 認識セッションの強制破棄。画面遷移時（render）と遷移前（voiceToObs）に必ず呼ぶ。
// 先に VREC を外してからハンドラを切る＝以降どのコールバックが遅れて届いても何もしない
function voiceRecAbort(){
  const rec=VREC; VREC=null; if(!rec) return;
  try{ rec.onresult=null; rec.onerror=null; rec.onend=null;
    (rec.abort||rec.stop||function(){}).call(rec); }catch(e){}
  const b=$('#voiceBtn'); if(b) b.textContent='🎙 話す';
}
function voiceListen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
  if(VREC){ const cur=VREC;   // 聞き取り中にもう一度押したら停止（結果は onend 経由で確定）
    if(cur._stopping){ voiceRecAbort(); return; }   // 停止が効かない実装の脱出口（2度目で強制破棄）
    cur._stopping=true;
    try{ cur.stop(); }catch(e){ voiceRecAbort(); }
    return; }
  // continuous=true: 区切って話しても一呼吸の沈黙で認識が終わらないようにする（それでも
  // OS側の都合で終わることはある→その場合は追記方式が受け止める）
  const rec=new SR(); rec.lang='ja-JP'; rec.interimResults=true; rec.continuous=true;
  // 開始時点の欄の内容を覚えておき、認識結果はその後ろに足す（途切れて話し直しても前の内容が消えない）
  const base=(($('#voiceText')||{}).value||'').trim();
  // 各コールバックは「今も自分が現役か」を確認する（破棄済みセッションの遅延通知でDOMを触らない）
  rec.onresult=e=>{ if(VREC!==rec) return;
    let fin='', inter='';
    for(const res of e.results){ if(res.isFinal) fin+=res[0].transcript; else inter+=res[0].transcript; }
    // continuous=true では確定分と認識途中が同時に存在する。両方つなぐ（確定が出た瞬間に
    // 認識途中の言葉が画面から消えないように）
    const ta=$('#voiceText'); if(ta){ ta.value=(base?base+' ':'')+fin+inter; SCREENS._dirty=true; voicePreview(); } };
  rec.onerror=e=>{ if(VREC!==rec) return;
    toast(e.error==='network'
    ?'音声認識には電波が必要です。下の欄からキーボードのマイクで話してください'
    :'音声を認識できませんでした。下の欄からも入力できます', 4000); };
  rec.onend=()=>{ if(VREC!==rec) return;
    VREC=null; const b=$('#voiceBtn'); if(b) b.textContent='🎙 話す'; };
  try{ rec.start(); VREC=rec; const b=$('#voiceBtn'); if(b) b.textContent='⏹ 聞き取り中…（タップで停止）'; }
  catch(e){ VREC=null; toast('音声認識を開始できませんでした'); }
}
/* ---------- 種名は「決め打ち」ではなく「候補から選ぶ」 ----------
   話した内容から1種を黙って決めると、違う種が入っていても気づかれない。
   候補をボタンで並べ、押されたものを採用する。押されていなければ先頭（＝確かに当たった種）を使う */
let VOICE_PICK={txt:'', name:'', id:''};   // 話した内容が変わったら捨てる＝別の文の選択を持ち越さない
// 一致しないときに「使わない」だけでは足りない。文をX→Y→Xと戻したときや、別の観察で同じ文を
// 打ち直したときに、タップしていない選択が復活してしまうため、中身そのものを捨てる
function voicePickClear(){ VOICE_PICK={txt:'', name:'', id:''}; }
function voicePickSet(name,id){
  const ta=$('#voiceText');
  VOICE_PICK={txt:(ta&&ta.value)||'', name:name||'', id:id||''};
  SCREENS._dirty=true; voicePreview();
}
// 実際に使う種名。txt は textarea の値そのまま（trimしない）で揃えること
function voicePickFor(txt,p){
  if(VOICE_PICK.name && VOICE_PICK.txt===txt) return {name:VOICE_PICK.name, id:VOICE_PICK.id};
  return {name:p.species_name, id:p.species_id};
}
function voiceCandHtml(p,txt){
  if(!p.species_cands.length) return txt.trim()?'<span class="muted">見つかりません（あとで選べます）</span>':'';
  const cur=voicePickFor(txt,p);
  const maybe=!p.species_cands[0].sure;
  return (maybe?'<span class="tiny muted" style="margin-right:4px;">もしかして</span>':'')
    + p.species_cands.map(c=>{
      const on=(c.name===cur.name);
      // 種名は自分たちのマスタの値だが、方針どおり onclick には埋め込まずdata属性から読む
      return `<button type="button" class="voice-chip${on?' on':''}" data-n="${esc(c.name)}" data-i="${esc(c.id)}"
        onclick="voicePickSet(this.dataset.n, this.dataset.i)">${on?'✓ ':''}${esc(c.name)}</button>`;
    }).join('');
}
function voicePreview(){
  const box=$('#voicePrev'); if(!box) return;
  const txt=(($('#voiceText')||{}).value||'');
  if(VOICE_PICK.txt!==txt) voicePickClear();   // 文が変わった時点で選択を捨てる（戻しても復活させない）
  const p=parseVoiceObs(txt);
  const cands=voiceCandHtml(p,txt);
  if(box.classList.contains('compact')){
    // ドック用の省スペース表示（メモは原文そのままなので省略）
    const parts=[ p.count?(p.count+'羽'):'', p.behavior, p.detection_method, p.distance_band, p.direction ]
      .filter(Boolean).map(esc);
    const rest=parts.length?`<span class="tiny muted">${parts.join(' ・ ')}</span>`:'';
    box.innerHTML = (cands||rest) ? (cands+(cands&&rest?'<br>':'')+rest) : '—';
    return;
  }
  const row=(k,v)=>`<div class="row" style="padding:2px 0;"><div class="small muted" style="width:80px; flex:none;">${k}</div><div class="grow small">${v||'<span class="muted">—</span>'}</div></div>`;
  box.innerHTML = row('種名', cands)
    + row('個体数', esc(p.count)) + row('行動', esc(p.behavior)) + row('確認方法', esc(p.detection_method))
    + row('距離帯', esc(p.distance_band)) + row('方向', esc(p.direction)) + row('メモ', esc(p.note));
}
function voiceToObs(u){
  const rawTxt=(($('#voiceText')||{}).value||'');
  const txt=rawTxt.trim();
  if(!txt){ toast('先に話すか、内容を入力してください'); return; }
  voiceRecAbort();
  const p=parseVoiceObs(txt);
  const pick=voicePickFor(rawTxt,p);   // 候補をタップして選び直していればそれを使う
  p.species_name=pick.name; p.species_id=pick.id;
  voicePickClear();   // 引き継いだので、この選択は次の入力へ持ち越さない
  SCREENS._dirty=false;   // 内容は observation の下書きへ引き継ぐので、この画面の離脱確認は不要
  goBack(); nav('obsEdit', JSON.stringify({sv:u, voice:p}));
}
/* 観察入力画面の音声入力ドック: 画面下に固定表示し、フォームをスクロールして各項目を
   見ながら「話す→反映」できる。保存バーの上に載せる（保存ボタンは隠さない）。
   部品IDは voiceObs と共通（#voiceBtn/#voiceText/#voicePrev）＝ voiceListen/voicePreview を使い回す */
function voiceDockToggle(){
  // 開いている時にもう一度押した場合も「閉じる」＝未反映の発話があれば確認を挟む
  // （確認なしの voiceDockClose は render() の後始末など内部用途だけに使う）
  if(document.getElementById('voiceDock')){ voiceDockDismiss(); return; }
  if(!$('#obForm')) return;
  const hasSR=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  const d=document.createElement('div');
  d.id='voiceDock';
  d.style.cssText='position:fixed; left:50%; transform:translateX(-50%); width:min(100%,900px); '
    +'bottom:calc(70px + env(safe-area-inset-bottom, 0px)); z-index:70; box-sizing:border-box; '
    +'background:var(--panel); border-top:1px solid var(--line); border-radius:12px 12px 0 0; '
    +'padding:8px 12px; box-shadow:0 -4px 16px rgba(0,0,0,.45);';
  d.innerHTML=`
    <div style="display:flex; gap:8px; align-items:flex-start;">
      ${hasSR?`<button type="button" class="btn" id="voiceBtn" style="width:auto; padding:10px 12px; flex:none;" onclick="voiceListen()">🎙 話す</button>`:''}
      <textarea id="voiceText" rows="2" style="min-height:44px; flex:1;" placeholder="${hasSR?'ここに話した内容が入ります（手修正可）':'キーボードのマイク🎙で話してください（圏外OK）'}" oninput="SCREENS._dirty=true; voicePreview()"></textarea>
      <button type="button" class="btn ghost" style="width:auto; padding:10px 12px; flex:none;" onclick="voiceDockDismiss()">✕</button>
    </div>
    <div id="voicePrev" class="tiny muted compact" style="margin:6px 2px;">—</div>
    <button type="button" class="btn" style="padding:10px;" onclick="voiceApplyToForm()">↑ 上の入力欄に反映</button>`;
  document.body.appendChild(d);
  // ドックに隠れないよう、フォーム側の下端に余白を足す（閉じたら戻す）
  const m=$('#main'); if(m) m.style.paddingBottom='210px';
  voicePreview();
}
function voiceDockClose(){
  voiceRecAbort();
  voicePickClear();   // 入力を終えたので選択も捨てる（次に開いたとき前の選択が残らない）
  const d=document.getElementById('voiceDock'); if(d) d.remove();
  const m=$('#main'); if(m) m.style.paddingBottom='';
}
// ✕ボタン用: 未反映の発話が残っていれば確認してから閉じる（render()からの後始末は確認なしの voiceDockClose を使う）
function voiceDockDismiss(){
  const txt=(($('#voiceText')||{}).value||'').trim();
  if(txt && !confirm('話した内容がまだ反映されていません。破棄して閉じますか？')) return;
  voiceDockClose();
}
// 観察入力画面の中の音声入力: 解析結果を「開いているフォーム」にそのまま反映する。
// 解析できた項目だけ書き込み、行動は既存の選択に追加、メモは原文を追記（消さない・失わない）
function voiceApplyToForm(){
  const rawTxt=(($('#voiceText')||{}).value||'');
  const txt=rawTxt.trim();
  if(!txt){ toast('先に話すか、内容を入力してください'); return; }
  if(!$('#obForm')){ return; }   // 観察入力画面以外では何もしない
  voiceRecAbort();   // 認識中に押されても、遅れて届く認識結果が空にした欄へ戻らないように先に破棄
  const p=parseVoiceObs(txt);
  const pick=voicePickFor(rawTxt,p);   // 候補をタップして選び直していればそれを使う
  if(pick.name) chooseSpecies((speciesByName(pick.name)||{}).species_id||'', pick.name);
  if(p.count){ const el=$('#obForm [name="count"]');
    if(el){ el.value=p.count; el.dispatchEvent(new Event('input',{bubbles:true})); } }   // 手入力と同じ扱いにする
  // 飛翔だけの画面では、観察にしか残せない項目（確認方法・距離帯・方向・通常の行動）は反映しない
  //（反映しても保存先が無く、保存時に止められて手戻りになる）
  const floNow = (typeof isFlightOnly==='function') && isFlightOnly();
  if(!floNow && p.detection_method) segSet('detection_method', p.detection_method);
  if(!floNow && p.distance_band) segSet('distance_band', p.distance_band);   // 話して入れた指定は守る（changeで指定済みになる）
  if(!floNow && p.direction) segSet('direction', p.direction);
  if(!floNow && p.behavior){ p.behavior.split('・').forEach(v=>{
    const b=[...document.querySelectorAll('[data-seg="behavior"] button')].find(x=>x.textContent===v);
    if(b && !b.classList.contains('on')) b.click(); }); }   // click経由＝繁殖ヒント・見出し更新も従来どおり動く
  if(p.note){ const el=$('#obForm [name="note"]'); if(el) el.value=(el.value?el.value+'\n':'')+p.note; }
  SCREENS._dirty=true;
  voicePickClear();   // 反映済みなので、この選択は次の発話へ持ち越さない
  const ta=$('#voiceText'); if(ta) ta.value='';
  voicePreview();
  toast('入力欄に反映しました。内容を確認して保存してください');
}

SCREENS.obsEdit = (argStr)=>{
  const arg = JSON.parse(argStr||'{}');
  const svUuid = arg.sv || currentSurveyUuid;
  // 複数個体: 内部の組み直し（切替・追加・保存後）は BIRDS を保つ。外から開いたら仕切り直す
  let revisit = SCREENS._birdKeep===true; SCREENS._birdKeep=false;
  if(!revisit && typeof BIRDS!=='undefined' && BIRDS.some(b=>b&&b.dirty)){
    // 内部フラグの無い再描画（同期後の render など）が書きかけの最中に走っても、
    // 個体一覧を初期化して入力・仮記録の管理を失わない（切替と同じ復元の道を通す）
    revisit=true;
  }
  if(!revisit){ BIRDS=[newBird()]; BIRD_IDX=0; }
  let editing = !!arg.id;
  let revisitBird=null;
  if(revisit){
    const b=CUR();
    if(b.reinitId){ editing=true; }
    else if(b.reinitFl){ editing=false; }
    else if(b.st.obs){ editing=!!b.st.obsEditing; revisitBird=b; }
    else { editing=false; }   // 追加されたばかりの個体
  }
  // 経路のカードから開いたとき（観察の記録がまだ無い鳥）。経路を軸に統合画面を開く。
  // 飛翔だけを保存した個体の読み直し（reinitFl）も同じ道を通る
  const _flId = revisit ? (CUR().reinitFl || (CUR().st&&CUR().st.flAnchorUuid) || '') : (arg.fl||'');
  // 音声の下書き・前の記録からの引き継ぎは「最初の表示」だけで使う。
  // 内部の再表示（個体の追加・切替・保存後）で再利用すると、元の内容が新しい個体へ複製される
  const initVoice = revisit ? null : (arg.voice||null);
  const initKeep  = revisit ? null : (arg.keep||null);
  const flAnchor = (!editing && _flId) ? DB.flightsOf(svUuid).find(f=>f.uuid===_flId) : null;
  let o=null;
  if(editing){
    // 編集対象の番号: 保存後の読み直し（reinitId）→ 退避中の個体自身 → 外から渡された id の順。
    //（切替の再表示で arg.id を使うと、追加個体などで id が無く、保存済みが新規扱いに落ちて
    //  作成日時や画面に無い既存項目が失われる）
    const editId=(revisit && CUR().reinitId) ? CUR().reinitId
      : (revisitBird ? ((revisitBird.st.obs&&revisitBird.st.obs.uuid)||'') : (revisit ? '' : (arg.id||'')));
    const live=editId ? DB.observations().find(x=>x&&x.uuid===editId) : null;
    if(!live){
      if(revisitBird && revisitBird.st.obsEditing){
        // 退避中に別の書き手が削除した。新規扱いへ落とすと削除を取り消す上書きになるため、
        // 表示は退避内容のまま保ち、保存は入り口の生存確認で止める
        o=revisitBird.st.obs;
      } else {
        editing=false;   // 外から渡された存在しない番号は新規の空として開く
      }
    }
    else o = revisitBird ? revisitBird.st.obs : Object.assign({}, live);
  }
  if(revisit){ delete CUR().reinitId; delete CUR().reinitFl; }
  if(revisitBird && !o) o=revisitBird.st.obs;   // 未保存の退避個体（editing=false のまま内容を保つ）
  if(!o){
    o = { uuid:uuid(), survey_uuid:svUuid, observed_at:localDatetimeValue(), latitude:'', longitude:'',
      gps_accuracy:'', species_id:'', species_name_snapshot:'', count:1, detection_method:'目視',
      behavior:'', habitat:'', age_class:'不明', sex:'不明', distance_band:'', direction:'',
      target_latitude:'', target_longitude:'', perch_size:'', perch_class:'',
      nest_tree_species:'', nest_tree_height:'', nest_state:'',
      perch_type:'', perch_artificial:'', perch_note:'', nest_latitude:'', nest_longitude:'',
      individual_label:'',
      note:'', identification_status:'確定', confidence:'中',
      needs_review:false, external_photo_reference:'' };
    // 「保存して続けて」からは前の記録の位置をそのまま引き継ぐ（位置を消して保存したなら空のまま＝GPSで上書きしない）。
    // keepが無いときだけ、新鮮なGPSを初期値にする（古い測位は使わない）
    if(initKeep){ const k=initKeep;
      if(validLatLon(String(k.lat||''), String(k.lon||''))){ o.latitude=String(k.lat); o.longitude=String(k.lon); o.gps_accuracy=(k.acc==null)?'':k.acc; }
      // 飛翔経路から「止まった」で来たとき: 種名・数・齢と、同一個体の目印を引き継ぐ
      if(k.species_name){ o.species_name_snapshot=k.species_name;
        o.species_id=(speciesByName(k.species_name)||{}).species_id||''; }
      if(k.count!=null && k.count!=='') o.count=k.count;   // 0羽もそのまま引き継ぐ（0は未指定ではない）
      if(k.age_class) o.age_class=k.age_class;
      if(k.individual_label) o.individual_label=k.individual_label;   // 同じ鳥の続きなら呼び名も引き継ぐ
      if(k.individual_key){
        o.individual_key=k.individual_key;
        // その鳥にすでに巣があるなら、画面にも読み込む。
        // 読み込まないと、見えていない巣をこの画面の操作で知らずに消してしまう
        const ng=nestGroups(DB.obsOf(svUuid).filter(x=>x.individual_key===k.individual_key));
        if(ng.length===1){ const n0=ng[0];
          o.nest_id=nestId(n0);
          o.nest_latitude=coordStr(n0.nest_latitude); o.nest_longitude=coordStr(n0.nest_longitude);
          o.nest_tree_species=n0.nest_tree_species||''; o.nest_tree_height=n0.nest_tree_height||'';
          o.nest_state=n0.nest_state||'';
        }
      }
    }
    else { const fx=freshFix(); if(fx){ o.latitude=fx.lat.toFixed(6); o.longitude=fx.lon.toFixed(6); o.gps_accuracy=Math.round(fx.acc); } }
    // 経路のカードから開いたとき: 種名・個体数・齢・結び付けの目印に加え、
    // 添付・メモ・要確認も経路から読み込む（読み込まないと、保存で空に置き換わって消える）
    if(flAnchor){
      if(flAnchor.species_name_snapshot){ o.species_name_snapshot=flAnchor.species_name_snapshot;
        o.species_id=flAnchor.species_id||(speciesByName(flAnchor.species_name_snapshot)||{}).species_id||''; }
      if(flAnchor.count!=null && flAnchor.count!=='') o.count=flAnchor.count;
      if(flAnchor.age_class) o.age_class=flAnchor.age_class;
      if(flAnchor.individual_key) o.individual_key=flAnchor.individual_key;
      if(flAnchor.individual_label) o.individual_label=flAnchor.individual_label;
      o.audio=(flAnchor.audio||[]).slice(); o.media=(flAnchor.media||[]).slice();
      o.note=flAnchor.memo||''; o.needs_review=!!flAnchor.needs_review;
    }
    // 音声入力（voiceObs）からの下書き。解析できた項目だけ初期値を上書き（保存は利用者の確認後）
    if(initVoice){ const v=initVoice;
      if(v.species_name){ o.species_name_snapshot=v.species_name;
        o.species_id=(speciesByName(v.species_name)||{}).species_id||''; }
      if(v.count) o.count=v.count;
      if(v.note) o.note=v.note;
      // 行動・確認方法・距離帯・確認方向は観察にしか置き場所が無い。
      // ここで入れると「最初からそうだった」ことになり、経路だけで保存したとき黙って消える。
      // 画面を組んだあと（初期状態を控えたあと）に入れる（onMount 参照）
    }
  } else if(o.observed_at && o.observed_at.length>16){ o.observed_at=localDatetimeValue(new Date(o.observed_at)); }

  // 「その他（記入内容）」をボタン一致用の値と記入欄の初期値に分解
  // 「その他（記入内容）」の分解は、記入欄を持つ項目だけに行う。
  // 止まり木は記入欄が無いので分解すると記入内容が消える（選択肢に無い値はそのまま残す作りになっている）
  const oOther={}; ['behavior','habitat'].forEach(f=>{ const p=otherParse(o[f]); o[f]=p.v; oOther[f]=p.other; });
  // 齢は語彙をそろえた（成→成鳥 等）。古い値のままだとどのボタンにも当たらず未選択に見えるので、
  // 画面を組む前に写しておく。ここで写せば、保存し直したときに新しい語彙で書かれる
  o.age_class=ageNorm(o.age_class);
  const seg=(field,opts,allowEmpty)=>`<div class="seg" data-seg="${field}">
    ${allowEmpty?`<button type="button" class="${!o[field]?'on':''}" onclick="pickObs(this,'${field}','')">なし</button>`:''}
    ${opts.map(x=>`<button type="button" class="${o[field]===x?'on':''}" onclick="pickObs(this,'${field}','${esc(x)}')">${esc(x)}</button>`).join('')}</div>`;
  // 行動・生息環境などは複数選択（「・」区切りで保存。タップでON/OFF切替）
  const segMulti=(field,opts)=>{ const set=new Set(String(o[field]||'').split('・').filter(Boolean));
    return `<div class="seg" data-seg="${field}">${opts.map(x=>
      `<button type="button" class="${set.has(x)?'on':''}" onclick="toggleMulti(this)">${esc(x)}</button>`).join('')}</div>${
      opts.includes('その他')?otherBox(field,oOther[field],set.has('その他')):''}`; };
  // 単一選択のプルダウン版（画面をすっきりさせたい項目用）。値の読み取りは segVal が SELECT にも対応
  // 保存済みの値が選択肢に無い場合（旧データ等）はその値の選択肢を足して黙って変わるのを防ぐ。
  // 必須項目でも既存値が空なら「未設定」を足す（先頭の選択肢が黙って選ばれて保存が変わるのを防ぐ。監査Major対応）
  const segSelect=(field,opts,allowEmpty)=>`<select data-seg="${field}">
    ${allowEmpty?`<option value="" ${!o[field]?'selected':''}>なし</option>`:''}
    ${(!allowEmpty && !o[field])?`<option value="" selected>未設定</option>`:''}
    ${(o[field]&&!opts.includes(o[field]))?`<option value="${esc(o[field])}" selected>${esc(o[field])}</option>`:''}
    ${opts.map(x=>`<option value="${esc(x)}" ${o[field]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  // 複数選択の折りたたみ版。閉じたままでも選択中の内容が見える（toggleMulti が segsum-* を更新）
  const segFold=(field,label,opts)=>`<div class="field"><details class="fold">
    <summary><span class="lab" style="display:inline; margin:0;">${esc(label)}</span>
      <span class="small muted" id="segsum-${field}">${esc(String(o[field]||'').split('・').filter(Boolean).join('・')||'未選択')}</span></summary>
    ${segMulti(field,opts)}
  </details></div>`;

  return {
    title: editing?'観察を編集':'観察を追加',
    html:`
      <!-- 地図が主役。P=鳥がいた場所（点）、F=飛翔経路（線）。何を保存するかは地図の中身で決まる -->
      <div class="card" style="background:var(--panel2); padding:8px;">
        <div id="obsPosMap" style="height:300px; border-radius:var(--radius); border:1px solid var(--line);"></div>
        <div class="row" style="margin-top:6px; gap:8px; align-items:center;">
          <span class="tiny muted grow" id="mapInfo"></span>
          <button type="button" class="btn ghost" style="width:auto; padding:6px 10px;" onclick="obsMapUndo()" title="1つ戻す">↶</button>
          <button type="button" class="btn ghost" style="width:auto; padding:6px 10px;" onclick="obsMapClear()" title="全部消す">🗑</button>
        </div>
        <div class="note" id="obsOnlyNote" style="display:none;">飛翔経路だけの記録です。観察にしか残せない項目（性別・確認方法・生息環境・巣など）は入力できません。止まった場所を記録するなら <b>P</b> を落としてください。
          <div class="sp"></div><button type="button" class="btn ghost" style="width:auto; padding:6px 10px;" onclick="obsOnlyReset()">観察の項目を最初の状態に戻す</button></div>
        <div class="note" id="legacyPosNote" style="display:none;">この記録の位置は、以前の画面では「止まり木・巣など」の位置でした。巣の位置なら下のボタンで移せます。
          <div class="sp"></div><button type="button" class="btn ghost" style="width:auto; padding:6px 10px;" onclick="legacyPosToNest()">この位置を巣にする</button></div>
        <!-- 落としたものの一覧。選ぶと地図で光り、位置直しや削除ができる（P=止まり／L=経路） -->
        <div class="chips" id="segChips" style="margin-top:6px;"></div>
        <div class="row" id="segEditBar" style="display:none; margin-top:6px; gap:8px; align-items:center;">
          <span class="tiny grow" id="segEditMsg"></span>
          <button type="button" class="btn ghost" id="segFlMore" style="display:none; width:auto; padding:6px 10px;" onclick="segFlOpen()">🎤📷 この経路の添付・メモ</button>
          <button type="button" class="btn ghost" style="width:auto; padding:6px 10px;" onclick="segEditDone()">やめる</button>
          <button type="button" class="btn danger" style="width:auto; padding:6px 10px;" onclick="segEditDelete()">✕ 消す</button>
        </div>
      </div>
      <div id="birdList" style="display:none; margin-bottom:8px;"></div>
      <form id="obForm">
        <details class="fold" id="foldMedia" open>
          <summary><span class="lab" style="display:inline; margin:0;">📷 メディア記録</span>
            <span class="small muted">写真・録音・動画・メモ</span></summary>
          <div class="field"><span class="lab">録音メモ（鳴き声など）</span><div id="recPanel"></div></div>
          <div class="field"><span class="lab">写真・動画</span><div id="mediaPanel"></div></div>
          <button type="button" class="btn ghost" id="voiceBtnWrap" style="margin-bottom:10px;" onclick="voiceDockToggle()">🎙 音声でまとめて入力</button>
          <label class="field"><span class="lab">観察メモ</span>
            <textarea name="note" placeholder="行動・環境・気づいたこと">${esc(o.note)}</textarea></label>
        </details>

        <details class="fold" id="foldSpecies">
          <summary><span class="lab" style="display:inline; margin:0;">🐦 種情報</span>
            <span class="small muted">種名・数・齢・行動など</span></summary>
          <label class="field"><span class="lab">種名（未入力でも保存可）</span>
            <input id="spInput" autocomplete="off" value="${esc(o.species_name_snapshot)}"
              placeholder="和名で検索…" oninput="spSearch(this.value); indLabelChips()">
            <div id="spSuggest"></div>
            <div class="chips" id="spQuick"></div>
            <div class="chips" id="spRefLinks"></div>
          </label>
          <label class="field"><span class="lab">個体名（任意・同じ鳥を追うとき）</span>
            <input id="indLabel" autocomplete="off" value="${esc(o.individual_label||'')}"
              placeholder="例：クマタカA／左翼損傷" oninput="indLabelChips()">
            <div class="chips" id="indLabelChips"></div>
            <div class="tiny muted">同じ名前を付けた記録は、集計で1羽として数えます</div>
          </label>
          <div class="two">
            <label class="field"><span class="lab">個体数</span>
              <input type="number" name="count" inputmode="numeric" min="0" value="${esc(o.count!=null?o.count:1)}"></label>
            <label class="field"><span class="lab">齢</span>${segSelect('age_class',OPT.obsAge)}</label>
          </div>
          <div class="two obs-only">
            <label class="field"><span class="lab">性別</span>${segSelect('sex',OPT.sex)}</label>
            <label class="field"><span class="lab">同定状態</span>${segSelect('identification_status',OPT.idStatus)}</label>
          </div>
          <div id="idHint" class="note" style="display:none; margin:2px 0 10px;"></div>
          <div class="obs-only">${segFold('behavior','行動（複数選択可）',OPT.behavior)}</div>
          <div id="flBehWrap" style="display:none;">${segFold('fl_behavior','飛翔の行動（複数選択可）',OPT.flightBehavior)}</div>
          <div id="breedHint" class="note" style="display:none; margin:2px 0 10px;"></div>
          <div class="two obs-only">
            <label class="field"><span class="lab">確認方法</span>${segSelect('detection_method',OPT.detection)}</label>
            <label class="field"><span class="lab">確認方向（任意）</span>${segSelect('direction',OPT.direction,true)}</label>
          </div>
          <label class="field" id="flHeightWrap" style="display:none;"><span class="lab">飛翔高度</span>${segSelect('fl_height',OPT.flightHeight)}</label>
          <label class="field obs-only"><span class="lab">信頼度</span>${segSelect('confidence',OPT.confidence)}</label>
          <label class="field row" style="gap:12px; align-items:center;">
            <input type="checkbox" id="needsReview" style="width:auto;" ${o.needs_review?'checked':''}>
            <span class="lab" style="margin:0;">要確認フラグ（あとで見直す）</span></label>
          <!-- 時刻と距離帯は地図の操作から自動で入る。新規では隠し、保存後の編集でだけ直せるようにする -->
          <div id="autoWrap" style="display:${(editing||flAnchor)?'':'none'};">
            <div class="two">
              <label class="field obs-only"><span class="lab">観察日時</span>
                <input type="datetime-local" name="observed_at" value="${esc(o.observed_at)}"></label>
              <label class="field obs-only"><span class="lab">距離帯</span>${segSelect('distance_band',OPT.distBand,true)}</label>
            </div>
            <div class="two" id="flTimeWrap" style="display:none;">
              <label class="field"><span class="lab">飛翔の開始時刻</span>
                <input type="datetime-local" id="flStart" value="" oninput="flTimeEdit('start')"></label>
              <label class="field"><span class="lab">終了時刻</span>
                <input type="datetime-local" id="flEnd" value="" oninput="flTimeEdit('end')"></label>
            </div>
          </div>
        </details>

        <details class="fold obs-only" id="foldEnv">
          <summary><span class="lab" style="display:inline; margin:0;">🌿 環境</span>
            <span class="small muted">生息環境・止まり木・巣</span></summary>
          <div class="lab" style="margin-top:4px;">まわりの環境（どんな場所か・複数選択可）</div>
          <label class="field">${segMulti('habitat',OPT.habitat)}</label>
          <div class="divider"></div>
          <div class="row" style="align-items:center; gap:8px;">
            <span class="lab grow" style="margin:0;">止まっていたもの</span>
            <span class="chips" id="perchTabs"></span>
          </div>
          <div class="tiny muted" id="perchWhich" style="margin:2px 0 6px;"></div>
          <label class="field"><span class="lab">種類</span>
            <select id="perchType" onchange="perchTypeChanged()">
              <option value="">未選択</option>
              ${OPT.perchType.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
            </select></label>
          <div id="perchTree" style="display:none;">
            <label class="field"><span class="lab">高さ・サイズ</span>
              <select id="perchSize" onchange="perchStore()">
                <option value="">未選択</option>
                ${OPT.perchSize.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
              </select></label>
            <label class="field"><span class="lab">樹種の分類</span>
              <select id="perchClass" onchange="perchStore()">
                <option value="">未選択</option>
                ${OPT.perchClass.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
              </select></label>
            <div class="two">
              <label class="field"><span class="lab">樹種名</span>
                <input id="perchSpecies" placeholder="例：アカエゾマツ" oninput="perchStore()"></label>
              <label class="field"><span class="lab">樹高(m)</span>
                <input id="perchHeight" inputmode="decimal" placeholder="任意" oninput="perchStore()"></label>
            </div>
          </div>
          <div id="perchArt" style="display:none;">
            <label class="field"><span class="lab">人工物の種類</span>
              <select id="perchArtSel" onchange="perchStore()">
                <option value="">未選択</option>
                ${OPT.perchArtificial.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
              </select></label>
          </div>
          <label class="field" id="perchNoteWrap" style="display:none;"><span class="lab">メモ（任意）</span>
            <input id="perchNote" placeholder="どんなものに止まっていたか" oninput="perchStore()"></label>
        </details>

        <details class="fold obs-only" id="foldNest">
          <summary><span class="lab" style="display:inline; margin:0;">🪺 営巣木・巣</span>
            <span class="small muted" id="sumNest">地図のNで位置を指定</span></summary>
          <div class="note">営巣木は「止まっていた場所」とは限りません。地図の <b>N</b> に切り替えてタップすると、巣の位置を指定できます。</div>
          <div class="small muted" id="nestPosLabel" style="margin:6px 0;">巣の位置：未指定</div>
          <div class="two">
            <label class="field"><span class="lab">営巣木の樹種</span>
              <input name="nest_tree_species" value="${esc(o.nest_tree_species||'')}" placeholder="例：アカエゾマツ"></label>
            <label class="field"><span class="lab">樹高(m)</span>
              <input name="nest_tree_height" inputmode="decimal" value="${esc(o.nest_tree_height||'')}" placeholder="任意"></label>
          </div>
          <label class="field"><span class="lab">巣の状態（記入）</span>
            <input name="nest_state" value="${esc(o.nest_state||'')}" list="nestStateList" placeholder="例：抱卵、育雛、巣立ち後"
              oninput="syncDisabledStates()">
            <datalist id="nestStateList">${OPT.nestState.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
          <input type="hidden" id="nestLat" value="${esc(o.nest_latitude||'')}">
          <input type="hidden" id="nestLon" value="${esc(o.nest_longitude||'')}">
        </details>

        <details class="fold obs-only" id="foldReg">
          <summary><span class="lab" style="display:inline; margin:0;">🕮 登録</span>
            <span class="small muted">図鑑登録・別カメラの番号</span></summary>
          <button type="button" class="btn ghost" style="margin-bottom:10px;" onclick="addObsToGuide()">🕮 この鳴き声・写真を図鑑に登録（確定種）</button>
          <label class="field"><span class="lab">外部写真番号・ファイル名</span>
            <input name="external_photo_reference" value="${esc(o.external_photo_reference)}" placeholder="別カメラの写真番号など"></label>
        </details>

        <!-- 観察者の位置は画面に出さず保存時にGPSから入れる。otLat/otLon が P（鳥がいた場所） -->
        <input type="hidden" id="latIn" value="${esc(o.latitude)}">
        <input type="hidden" id="lonIn" value="${esc(o.longitude)}">
        <input type="hidden" id="otLat" value="${esc(o.target_latitude||'')}">
        <input type="hidden" id="otLon" value="${esc(o.target_longitude||'')}">
      </form>
      ${(!editing && BIRDS.length<=1)?`<div class="sp"></div><button class="btn" onclick="saveObs('${o.uuid}','${svUuid}',${editing},true)">＋ 保存して続けて次の記録へ</button>`:''}
      ${editing?`<div class="sp"></div><button class="btn danger" onclick="deleteObs('${o.uuid}')">この記録を削除</button>`:''}
      <div class="sp"></div>
      <div class="note">地図の <b>P</b> で鳥がいた場所、<b>F</b> で飛んだ経路を記録します。落とした内容に応じて記録が作られ、時刻と距離帯は自動で入ります。</div>
      <div class="savebar"><button class="btn primary big" onclick="saveObs('${o.uuid}','${svUuid}',${editing},false)">保存する</button></div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button type="button" class="btn" style="flex:1;" onclick="saveObs('${o.uuid}','${svUuid}',${editing},'addBird')">💾 保存して追加</button>
        <button type="button" class="btn ghost" style="flex:1;" onclick="birdAdd()">＋ 個体を追加</button>
        ${BIRDS.length>1?`<button type="button" class="btn danger" style="flex:1;" onclick="birdDrop()">この個体を消す</button>`:''}
      </div>
      ${(!editing && BIRDS.length<=1)?`<div class="sp"></div>
      <button type="button" class="btn ghost" onclick="openMultiTrace('${svUuid}')">🛩 複数羽を同時に追う（タブで色分けして一度に描く）</button>`:''}
    `,
    onMount:()=>{ SCREENS._obs=o;
      if(revisitBird){
        // 個体の切替: 状態は入れ物に生きているので読み直さない。
        // 画面（入力欄・添付・地図）だけを入れ物の内容へ「その場で」合わせ直す。
        //（後回しにすると、その隙の保存・離脱が復元前の空の値を使ってしまう）
        try{ formRestore(document.getElementById('obForm'), revisitBird.form||null); }catch(e){}
        // 復元した選択の「その他」欄・折りたたみ見出しの要約も表示へ反映する
        try{
          document.querySelectorAll('#obForm [data-seg]').forEach(sg=>{
            const f2=sg.getAttribute('data-seg');
            try{ if(typeof syncOther==='function') syncOther(f2); }catch(e){}
            try{ if(typeof segSumUpdate==='function') segSumUpdate(f2); }catch(e){}
          });
        }catch(e){}
        obsBindFormWatch();   // 組み直したフォームに変更監視を掛け直す
        obsOnlyInitReapply();  // 「最初の状態に戻す」の基準も新しいDOMへ掛け直す
        try{ renderRecPanel(); renderMediaPanel(); }catch(e){}
        SCREENS._flSeg=null;   // 組み直したDOMへ必ず flLoadFrom させる（取込データの未知の行動の選択肢を再生成）
        try{ perchTabs(); perchLoad(); segChips(); nestSync(); pfInfo(); pfSyncFlightFields(); legacyPosNoteSync(); }catch(e){}
        try{ if(typeof updateIdHint==='function') updateIdHint(); }catch(e){}
        try{ if(typeof updateBreedHint==='function') updateBreedHint(); }catch(e){}
        try{ indLabelChips(); }catch(e){}
        try{ if(typeof startGpsIndicator==='function') startGpsIndicator(); }catch(e){}
        SCREENS._dirty=!!revisitBird.dirty;
        birdListSync();
        _mapTimer=setTimeout(()=>{ initObsPosMap(); }, 60);
        return;
      }
      // 経路を軸に開いたときは、録音・写真の持ち主も最初から経路にする
      //（観察名義で撮ってから付け替える方式は、途中で失敗すると持ち主が食い違う）
      SCREENS._mediaCtx = flAnchor
        ? {kind:'flight', uuid:flAnchor.uuid, sv:o.survey_uuid}
        : {kind:'obs', uuid:o.uuid, sv:o.survey_uuid};
      SCREENS._audio=(o.audio||[]).slice(); SCREENS._media=(o.media||[]).slice();
      // 記録モードは毎回「止まっている」から始める（前の画面の経路を持ち越さない）
      // 地図の状態は毎回まっさらから始める（前の画面の内容を持ち越さない）
      PF_MODE='P'; PF_SEGS=[]; PF_NEWLINE=true; flightPath=[]; flightLayer=null; pfLayer=null;
      PF_NEST=null; PF_NEST_ID=nestId(o); PERCH_IDX=0; PF_SEL=-1;
      SCREENS._flSeg=null; PF_HIST=[]; PF_SEQ=0;
      // 「保存して続けて」で位置を引き継いだときは、その位置を守る（空のまま引き継いだ場合も）
      SCREENS._keepPos = !!(initKeep && ('lat' in initKeep));
      // 位置が無いために P を出せない古い記録でも、止まり木の情報は持っている。
      // あとから P を足したとき、その P に引き継ぐ（空で上書きして失わないように）
      SCREENS._pendingPerch=null; SCREENS._hadP=false;
      // 「この画面で指定した」だけを指定済みとする。新規で最初から値がある＝音声や引き継ぎでの指定
      //（編集で開いただけの既存値は、そのままでは他のPにまで配られてしまうので別扱いにする）
      SCREENS._bandTouched=(!editing) && !!o.distance_band;
      if(validLatLon(coordStr(o.nest_latitude), coordStr(o.nest_longitude))){
        PF_NEST=[parseFloat(o.nest_latitude), parseFloat(o.nest_longitude)];
      }
      if(editing && validLatLon(coordStr(o.target_latitude), coordStr(o.target_longitude))){
        // 既存記録を開いたとき: 鳥の位置は P として地図に出す。
        // 「止まっていたもの」も一緒に読み込む（読み込まないと、開いて保存し直すだけで消える）
        PF_SEGS.push({t:'P', id:pfId(), fromExisting:true, srcUuid:o.uuid, pt:[parseFloat(o.target_latitude), parseFloat(o.target_longitude)], time:o.observed_at||'',
          perch:{ // 古い記録には「種類」が無い。木の項目だけが入っていれば木として読み替える。
                  // 人工物・メモも混ざっているときは推定しない（推定すると木以外の項目が保存で削られる）
                  type:o.perch_type||((!o.perch_artificial && !o.perch_note
                    && (o.perch_size||o.perch_class||o.perch_species||o.perch_height))?'木':''),
                  size:o.perch_size||'', cls:o.perch_class||'',
                  species:o.perch_species||'', height:o.perch_height||'',
                  art:o.perch_artificial||'', note:o.perch_note||'' }});
      }
      // 同じ鳥（individual_key）の他の記録もまとめて読み込む。
      // 1羽を「止まり2か所＋経路1本」と分けて保存した記録を、開き直したときも1画面で扱えるように
      SCREENS._loadedObs=[]; SCREENS._loadedFl=[];
      SCREENS._flAnchorUuid = flAnchor ? flAnchor.uuid : '';
      // 経路のカードから開いたときは、その経路（と同じ鳥の経路）を読み込む
      if(flAnchor){
        const flKey=flAnchor.individual_key||'';
        DB.flightsOf(svUuid)
          .filter(f=>flKey ? f.individual_key===flKey : f.uuid===flAnchor.uuid)
          .sort((a,b)=>String(a.start_time||'').localeCompare(String(b.start_time||'')))
          .forEach(f=>{
            // 2点未満（壊れた・作りかけの経路）も読み込む。読み込まないと直すことも消すこともできない
            const path=(f.path||[]).filter(validPathPt);
            SCREENS._loadedFl.push(f.uuid);
            PF_SEGS.push({t:'F', id:pfId(), fromExisting:true, srcUuid:f.uuid,
              pts:path.map(pt=>pt.slice()), times:path.map(()=>''),
              fl:{height:f.height_class||'', behavior:f.behavior||''},
              ov:{start:f.start_time||'', end:f.end_time||''}});
          });
      }
      if(editing && o.individual_key){
        const perchOf=x=>({ type:x.perch_type||((!x.perch_artificial && !x.perch_note
            && (x.perch_size||x.perch_class||x.perch_species||x.perch_height))?'木':''),
          size:x.perch_size||'', cls:x.perch_class||'', species:x.perch_species||'', height:x.perch_height||'',
          art:x.perch_artificial||'', note:x.perch_note||'' });
        DB.obsOf(svUuid).filter(x=>x.individual_key===o.individual_key && x.uuid!==o.uuid)
          .sort((a,b)=>String(a.observed_at||'').localeCompare(String(b.observed_at||'')))
          .forEach(x=>{
            if(!validLatLon(coordStr(x.target_latitude), coordStr(x.target_longitude))) return;
            SCREENS._loadedObs.push(x.uuid);
            PF_SEGS.push({t:'P', id:pfId(), fromExisting:true, srcUuid:x.uuid,
              pt:[parseFloat(x.target_latitude), parseFloat(x.target_longitude)], time:x.observed_at||'',
              perch:perchOf(x)});
          });
        DB.flightsOf(svUuid).filter(f=>f.individual_key===o.individual_key)
          .sort((a,b)=>String(a.start_time||'').localeCompare(String(b.start_time||'')))
          .forEach(f=>{
            const path=(f.path||[]).filter(validPathPt);
            SCREENS._loadedFl.push(f.uuid);
            PF_SEGS.push({t:'F', id:pfId(), fromExisting:true, srcUuid:f.uuid,
              pts:path.map(pt=>pt.slice()), times:path.map(()=>''),
              fl:{height:f.height_class||'', behavior:f.behavior||''},
              ov:{start:f.start_time||'', end:f.end_time||''}});
          });
      }
      // 飛翔経路から「止まったところを記録」で来たとき、終点を P として置く
      if(!editing && initKeep && validLatLon(String(initKeep.plat||''), String(initKeep.plon||''))){
        PF_SEGS.push({t:'P', id:pfId(), pt:[parseFloat(initKeep.plat), parseFloat(initKeep.plon)],
          time:localDatetimeValue(), perch:perchNew()});
      }
      // 兄弟から読み込んだPを混ぜない。「開いた記録自身にPがあったか」だけで判定する
      //（混ぜると、位置なしの開いた記録の止まり木情報が、兄弟のPのせいで空にされる）
      SCREENS._hadP = editing && validLatLon(coordStr(o.target_latitude), coordStr(o.target_longitude));
      if(editing && !SCREENS._hadP){
        const pk={ type:o.perch_type||((!o.perch_artificial && !o.perch_note
          && (o.perch_size||o.perch_class||o.perch_species||o.perch_height))?'木':''),
          size:o.perch_size||'', cls:o.perch_class||'', species:o.perch_species||'',
          height:o.perch_height||'', art:o.perch_artificial||'', note:o.perch_note||'' };
        // 表示用の引き継ぎ。保存時の元値の保持は「受け持つPが未編集なら元記録から逐語コピー」
        // の規則が受け持つ（画面に出せない数値の0やfalseもそちらで保たれる）
        const hasAnyPerch=['perch_type','perch_size','perch_class','perch_species','perch_height','perch_artificial','perch_note']
          .some(k=>o[k]!==undefined && o[k]!==null && o[k]!=='');
        if(hasAnyPerch){ SCREENS._pendingPerch=pk; }
      }
      SCREENS._chosenId=o.species_id||''; SCREENS._obsEditing=editing;
      // 精度の扱い: null=保存時に既存値を維持 / ''=不明（手入力座標） / 数値=確定値。初期値は画面に表示している精度と一致させる
      SCREENS._acc=(o.gps_accuracy===''||o.gps_accuracy==null)?null:o.gps_accuracy;
      // 距離帯・日時・齢・個体数・巣などの変更監視は共通関数で登録する（個体切替後の組み直しでも使う）
      SCREENS._obsAtTouched=false;   // 観察日時を触ったか。触った指定を、Pを落とした時刻で上書きしないため
      SCREENS._ageTouched=false;     // 齢を触ったか。触っていない保存では既存の飛翔の齢（空含む）を残す
      obsBindFormWatch();
      if(initVoice) SCREENS._dirty=true;   // 音声の下書きが入っている＝未保存の入力として離脱時に確認する
      renderQuickSpecies(); renderRecPanel(); renderMediaPanel(); updateSpRefLinks(o.species_name_snapshot);
      indLabelChips();   // その調査で使った個体名をすぐ選べるように
      updateBreedHint(); updateIdHint();
      if(typeof startGpsIndicator==='function') startGpsIndicator();   // 観察者の位置は保存時に使う
      // 入力欄への読み込みは今すぐ行う。地図の用意（60ms待ち）を待つと、
      // その前に保存された場合に空の入力欄で既存の値を上書きしてしまう
      SCREENS._obsOnlyInit=null;
      pfSyncFlightFields(); perchTabs(); perchLoad(); segChips(); nestLabelSync();
      obsOnlyCapture();   // ここまでが「最初の状態」
      // 個体数を利用者が触ったかを見分ける（巣だけの記録で、初期値の1羽を勝手に数えないため）。
      // 値の比較ではなく操作で見分ける——一度変えて元に戻した「1羽」は利用者の指定なので守る
      SCREENS._countTouched=false; SCREENS._nestTouchedMap=false; SCREENS._nestTouchedForm=false;
      // この画面を開いたとき、巣が見えていたか。見えていなかった画面からの「巣を空にする」は
      // 他の記録に配らない（見えないものは消せない、が原則）
      SCREENS._hadNestAtOpen = !!(nestId(o)
        || validLatLon(coordStr(o.nest_latitude), coordStr(o.nest_longitude))
        || o.nest_state || o.nest_tree_species || o.nest_tree_height);
      // 開いたとき見えていた巣の目印・位置・内容。伝播の照合はこれを基準にする
      //（editing の元記録でも、引き継ぎで読み込んだ巣でも同じ扱いになる）
      SCREENS._openNest = SCREENS._hadNestAtOpen
        ? { id:nestId(o), pos:nestPosKey(o), fp:nestFpKey(o) } : null;
      // 話して入れた個体数も、利用者が指定したものとして扱う（勝手に0羽へ書き換えない）
      if(initVoice && initVoice.count) SCREENS._countTouched=true;
      //（個体数・巣の記入欄の監視は obsBindFormWatch で登録済み）
      // 音声の下書きのうち観察にしか置き場所が無い項目は、ここで入れる。
      // こうすると「利用者が入れたもの」として扱われ、経路だけで保存しようとしたときに気づける
      if(initVoice){ const vd=initVoice;
        if(vd.detection_method) segSet('detection_method', vd.detection_method);
        if(vd.distance_band) segSet('distance_band', vd.distance_band);
        if(vd.direction) segSet('direction', vd.direction);
        if(vd.behavior) String(vd.behavior).split('・').filter(Boolean).forEach(x=>{
          const b=[...document.querySelectorAll('[data-seg="behavior"] button')].find(y=>y.textContent===x);
          if(b && !b.classList.contains('on')) b.click(); });
        updateBreedHint(); updateIdHint();
      }
      // 古い記録の位置は「止まり木・巣など」の共通の位置だった。巣の情報があるのに巣の位置が無いなら、
      // その位置は巣かもしれない。勝手に決めず、移せるように案内だけ出す
      PF_LEGACY_ID=null;
      if(editing && pfPoints().length && !validLatLon(coordStr(o.nest_latitude), coordStr(o.nest_longitude))
        && (o.nest_state||o.nest_tree_species||o.nest_tree_height)){
        const ownP=PF_SEGS.find(sg=>sg.t==='P' && sg.srcUuid===o.uuid);
        PF_LEGACY_ID=ownP?ownP.id:null;
      }
      legacyPosNoteSync();
      birdListSync();
      _mapTimer=setTimeout(()=>{ initObsPosMap(); }, 60);   // 地図は画面の主役なので最初から出す   // 編集で開いたときも選択済みの内容に合わせてヒントを出す
    }
  };
};
// 複数羽の同時トレース（タブで色分けして何羽ぶんも線を引く専用画面）。
// 記録の入口は統合画面に一本化したので、ここだけがこの画面への道になる
function openMultiTrace(svUuid){
  if(typeof birdBusy==='function' && birdBusy()) return;
  const name=(($('#spInput')&&$('#spInput').value)||'').trim();
  const keep={ species_id:SCREENS._chosenId||'', species_name:name,

function pickObs(btn,field,val){
  const before=btn.classList.contains('on');   // 同じ値を押し直しただけなら未保存扱いにしない（無用な離脱確認を出さない）
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); syncOther(field);
  if(!before) SCREENS._dirty=true;

function segVal(field){ const root=document.querySelector(`[data-seg="${field}"]`); if(!root) return '';
  if(root.tagName==='SELECT') return root.value;   // プルダウン版（「なし」は value="" なのでそのまま空）
  const on=root.querySelector('button.on'); return on? (on.textContent==='なし'?'':on.textContent):''; }
// 選択欄に値を入れる。プルダウンでもボタン群でも同じ書き方で使えるようにする
//（プルダウンに作り替えた項目にボタン向けの処理が残ると、音声や種名の選び直しが効かなくなる）
function segSet(field, value){
  const root=document.querySelector(`[data-seg="${field}"]`); if(!root) return false;
  if(root.tagName==='SELECT'){
    if(value && !Array.from(root.options).some(op=>op.value===value)){
      const op=document.createElement('option'); op.value=value; op.textContent=value; root.appendChild(op);
    }
    root.value=value||'';
    root.dispatchEvent(new Event('change',{bubbles:true}));

  }
  const b=[...root.querySelectorAll('button')].find(x=>x.textContent===(value||'なし'));
  if(b && !b.classList.contains('on')) b.click();

function segVals(field){ return [...document.querySelectorAll(`[data-seg="${field}"] button.on`)].map(b=>b.textContent).filter(t=>t!=='なし').join('・'); }

/* ---------- 入力中のライブガイド（Survey123の「条件つき質問」に相当） ----------
   render()は使わない（画面を作り直すと編集中の入力が全部消え、新規なら記録IDまで変わるため）。
   HTMLに置いた非表示のヒント欄の文言と表示だけを書き換える。

const NEST_BEHAVIORS=['巣立ち雛','給餌','餌運び','餌渡し','巣材運搬'];   // 巣・対象位置の欄を自動で開く行動
function updateBreedHint(){

  }else el.style.display='none';
  // 巣に関わる行動なら、巣・対象位置の入力欄を自動で開く（開くだけで閉じない——入力済みかもしれないため）。
  // 「さえずり」等のB該当だけでは開かない（最頻タグのため毎回開くと邪魔になる）
  const fold=$('#foldNest');

function updateIdHint(){

/* ---------- 「その他」の記入欄 ----------
   「その他」ボタンを選ぶと記入欄が現れ、保存時は値の「その他」を「その他（記入内容）」に

function otherParse(v){ v=String(v||''); const m=v.match(/その他（([^）]*)）/);

// 折りたたみ式の複数選択で、閉じたままでも選択中の内容が見えるように見出しの表示を更新する

/* 種名検索（ひらがな・カタカナどちらの入力でもヒット） */
function toKata(s){ return String(s||'').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)); }
function spSearch(q){
  const box=$('#spSuggest'); q=(q||'').trim();
  updateSpRefLinks(q);
  if(!q){ box.innerHTML='';
    // キーボードで種名を消した場合も、候補からの解除（chooseSpecies）と同じ扱いにする。
    // 保存時は種名空＝未同定に強制されるため、画面の同定状態表示をそれに一致させる。
    // 同定状態のボタン群は観察入力にしかないので、飛翔経路の種名入力では何も起きない
    SCREENS._chosenId='';   // 内部に保持している種IDも消す（残すと「種名は空なのに前の鳥のIDが保存される」）
    segSet('identification_status','未同定'); updateIdHint();
    return; }
  // 内部の種IDを入力中の名前に常に追随させる（候補を選ばず別の種名へ直接書き換えたとき、
  // 前の鳥のIDが残って「新しい種名＋旧ID」の不整合データになるのを防ぐ。候補選択時は chooseSpecies が上書きする）
  SCREENS._chosenId=(speciesByName(q)||{}).species_id||'';
  const qk=toKata(q);
  const pre = SPECIES.filter(s=>toKata(s.japanese_name).startsWith(qk));
  const part = SPECIES.filter(s=>!toKata(s.japanese_name).startsWith(qk) && toKata(s.japanese_name).includes(qk));
  const list=[...pre,...part].slice(0,12);
  box.innerHTML = list.length ? `<div class="suggest">${list.map(s=>
    `<div class="item" onclick="chooseSpecies(${s.species_id},'${esc(s.japanese_name)}')">${esc(s.japanese_name)}</div>`).join('')}
    <div class="item" style="color:var(--muted)" onclick="chooseSpecies('','')">「${esc(q)}」は候補になし → 未同定で保存</div></div>`
    : `<div class="suggest"><div class="item" style="color:var(--muted)" onclick="chooseSpecies('','')">候補なし → 未同定で保存</div></div>`;

function chooseSpecies(id,name){ $('#spInput').value=name; $('#spSuggest').innerHTML=''; updateSpRefLinks(name);

  SCREENS._chosenId=id; }

function grabGps(){
  if(!navigator.geolocation){ toast('位置情報を利用できません'); return; }

/* 観察の対象位置（止まり木・巣など）を地図タップで指定 */
/* ---------- 地図の共通生成（タイル・レイヤ切替・回転・方位） ----------
   4画面（対象位置・ルート・飛翔・全体図）で同じタイル設定を使うため一本化。
   回転は leaflet-rotate 読み込み時のみ有効（読めない場合は従来どおり北固定で動く） */
let mapBearing=0;         // 地図の向き（度）。mapObjはrender()で毎回破棄されるため独立変数で画面をまたいで保持
let _compassOn=false;     // コンパス追従（自分の向きが上）の状態
let _compassHandler=null; // 方位センサーリスナー（解除用）
let _compassEvName='deviceorientation';   // 登録したイベント名（同じ名前で確実に解除するため保持）
let _compassReq=0;        // 許可待ちの世代番号。地図破棄で++して、遅れて届いた許可が古い地図を回すのを防ぐ
// 地図の破棄はこの1本に集約（render・対象位置地図の開閉から使う）。コンパス監視・許可待ちも道連れで無効化
function destroyMap(){
  if(typeof mapFullOff==='function') mapFullOff(true);   // 全画面のまま破棄すると固定表示が画面に残るので先に戻す
  if(mapObj){ try{ mapObj.remove(); }catch(e){} mapObj=null; }
  // 地図上のマーカー参照もここでまとめて破棄する（古い参照が残ると、次に開いた別の地図と取り違える温床になる）
  obsTargetMarker=null; obsPosMarker=null;
  compassStop(); _compassReq++;
}
function createBaseMap(elId, center, zoom, opts){
  opts=opts||{};
  const rotatable=!!(L.Map && L.Map.prototype.setBearing);
  const m=L.map(elId, rotatable?{ rotate:true, rotateControl:false, touchRotate:true, shiftKeyRotate:true, bearing:mapBearing }:{}).setView(center, zoom);
  const gsiAttr='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>';
  // crossOrigin必須: 無指定だとタイル取得がno-cors＝応答がopaqueになり、Service Workerがキャッシュできず
  // 圏外表示（受動キャッシュ・オフライン地図の保存）が全く効かない
  const gsi=(name,ext,mx,opt)=>L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/'+name+'/{z}/{x}/{y}.'+ext, Object.assign({maxZoom:18, maxNativeZoom:mx||18, attribution:gsiAttr, crossOrigin:'anonymous'}, opt||{}));
  const bases={ '標準地図':gsi('std','png',18), '淡色地図':gsi('pale','png',18), '写真（航空・衛星）':gsi('seamlessphoto','jpg',18) };
  let savedBase=localStorage.getItem('bs_basemap'); if(!bases[savedBase]) savedBase='標準地図';
  bases[savedBase].addTo(m);
  const overlays=opts.overlays?{
    '陰影を重ねる（起伏）': gsi('hillshademap','png',16,{opacity:0.5}),
    '傾斜を重ねる（急斜面）': gsi('slopemap','png',15,{opacity:0.45}),
  }:{};
  if(opts.overlays){
    let savedOv=[]; try{ savedOv=JSON.parse(localStorage.getItem('bs_overlays')||'[]'); }catch(e){}
    savedOv.forEach(n=>{ if(overlays[n]) overlays[n].addTo(m); });
    m.on('overlayadd overlayremove', ()=>{ try{
      localStorage.setItem('bs_overlays', JSON.stringify(Object.keys(overlays).filter(n=>m.hasLayer(overlays[n]))));
    }catch(err){} });
  }
  L.control.layers(bases, overlays, {position:'topright', collapsed:true}).addTo(m);
  m.on('baselayerchange', e=>{ try{ localStorage.setItem('bs_basemap', e.name); }catch(err){} });
  if(rotatable) addCompassControls(m);
  addFullscreenControl(m);
  setTimeout(()=>{ try{ m.invalidateSize(); }catch(e){} },200);
  return m;
}
/* ---------- 地図を画面いっぱいに広げる（右下のボタン） ----------
   フォームに埋め込んだ地図は狭くて見づらいので、その場で全画面に広げられるようにする。
   position:fixed に切り替えるだけだと瞬間移動して「どこが広がったのか」が分からないため、
   いまの枠から画面の四隅へ 0.28秒かけて伸ばす（戻すときは逆再生）。
   Leafletは器の大きさの変化を自分では見ないので、伸びる途中と伸び終わりに invalidateSize() する。
   iOS Safari は動画以外の全画面API（requestFullscreen）が使えないため、CSSで広げる方式にしている */
let _mapFull=null;   // 全画面中の情報 {el, ph, prev, m, btn, esc}。同時に1枚しか開かない（mapObjが1本のため）
const MAPFULL_MS=280;
// 全画面で書き換える指定だけを覚えて戻す（cssText丸ごとの退避・復元にすると、その間に
// 他の処理が変えた display などを古い値に巻き戻してしまう＝閉じた地図が再び現れる）
// margin は shorthand で退避・復元すると個別指定（margin-top:8px など）を消してしまい、
// 戻したときに地図の上下の余白が失われる（実測で8pxずれた）。必ず4辺それぞれで持つ
const MAPFULL_PROPS=['position','marginTop','marginRight','marginBottom','marginLeft',
  'width','height','zIndex','top','left','right','bottom','transition','borderRadius','border'];
function addFullscreenControl(m){
  const C=L.Control.extend({ onAdd:function(){
    const b=L.DomUtil.create('button','map-full-btn');
    b.type='button'; b.textContent='⛶ 大きく'; b.title='地図を画面いっぱいに広げる';
    L.DomEvent.disableClickPropagation(b);
    L.DomEvent.on(b,'click',L.DomEvent.stop).on(b,'click',()=>mapFullToggle(m,b));
    return b; }});
  new C({position:'bottomright'}).addTo(m);
}
// 予約した後始末は必ず「今もこの全画面が現役か」を確かめてから動く（連打・画面遷移で世代が変わるため）
function mapFullTimer(f, fn, ms){ const id=setTimeout(()=>{ if(_mapFull===f) fn(); }, ms); f.timers.push(id); return id; }
function mapFullClear(f){ f.timers.forEach(clearTimeout); f.timers=[]; }
function mapFullToggle(m,btn){
  if(!_mapFull){ mapFullOn(m,btn); return; }
  // 縮小の途中でもう一度押されたら、閉じるのをやめて広げ直す（連打で状態が二重に作られるのを防ぐ）
  if(_mapFull.closing) mapFullExpand(_mapFull); else mapFullOff();
}
// 現在の枠 → 画面いっぱい
function mapFullOn(m,btn){
  if(_mapFull){ if(_mapFull.closing) mapFullExpand(_mapFull); return; }
  let el=null; try{ el=m.getContainer(); }catch(e){}
  if(!el || !el.parentNode) return;
  const r=el.getBoundingClientRect();
  // 元の場所に同じ高さの場所取りを置く（全画面の間、下のフォームが詰まって動かないように）
  // 元の場所に同じ大きさ・同じ余白の場所取りを置く（余白まで写さないと、戻り先を測る位置が
  // 余白のぶんずれて、縮小し終わった瞬間にカクッと跳ねる）
  const cs=getComputedStyle(el);
  const ph=document.createElement('div');
  ph.className='map-full-ph';   // 片付け漏れを見つけやすくするため名前を付ける
  ph.style.cssText='height:'+r.height+'px; flex:none; margin:'
    +cs.marginTop+' '+cs.marginRight+' '+cs.marginBottom+' '+cs.marginLeft+';';
  el.parentNode.insertBefore(ph, el);
  const esc=(e)=>{ if(e.key==='Escape') mapFullOff(); };
  const prev={}; MAPFULL_PROPS.forEach(p=>prev[p]=el.style[p]);
  // 後ろのページを止めると読み位置が先頭に飛ぶ端末があるので、戻すときのために覚えておく
  const f={el, ph, prev, m, btn, esc, sy:window.scrollY||0, timers:[], closing:false, onres:null};
  _mapFull=f;
  mapFullBox(el, r);   // まず「いまと同じ見た目」で position:fixed にする
  el.classList.add('map-full');
  el.offsetHeight;     // ここで一度確定させないと、次の指定とまとめて適用されて動きにならない
  window.addEventListener('keydown', esc);
  mapFullExpand(f);
}
// 画面の四隅へ広げる（新規に開くときと、閉じ途中の取り消しの両方から使う）
function mapFullExpand(f){
  mapFullClear(f); mapFullResizeWatch(f, false); f.closing=false;
  const el=f.el;
  el.style.transition='top '+MAPFULL_MS+'ms ease, left '+MAPFULL_MS+'ms ease, right '+MAPFULL_MS+'ms ease, bottom '+MAPFULL_MS+'ms ease';
  el.style.top='0px'; el.style.left='0px'; el.style.right='0px'; el.style.bottom='0px';
  document.body.classList.add('map-full-lock');   // 後ろのページが一緒に動かないように
  if(f.btn){ try{ f.btn.textContent='⤡ 小さく'; f.btn.title='元の大きさに戻す'; }catch(e){} }
  // 伸びる途中と伸び終わりに作り直す（途中の1回で地図の中身が追いついて見える）
  mapFullTimer(f, ()=>{ try{ f.m.invalidateSize({animate:false}); }catch(e){} }, Math.round(MAPFULL_MS/2));
  mapFullTimer(f, ()=>{ try{ f.m.invalidateSize({animate:false}); }catch(e){} }, MAPFULL_MS+30);
}
// 画面いっぱい → 元の枠。now=true は動きを付けずに即戻す（地図の破棄・画面遷移から呼ぶとき用）
function mapFullOff(now){
  const f=_mapFull; if(!f) return;
  if(f.closing && !now) return;   // すでに閉じ中（二度押しは無視）
  mapFullClear(f);

  if(f.btn){ try{ f.btn.textContent='⛶ 大きく'; f.btn.title='地図を画面いっぱいに広げる'; }catch(e){} }
  // 先にページの固定を解いて読み位置を戻す（戻り先の枠は、その状態で測らないとずれる）
  document.body.classList.remove('map-full-lock');
  if(Math.abs((window.scrollY||0)-f.sy)>2){ try{ window.scrollTo(0, f.sy); }catch(e){} }
  let r=null; try{ r=f.ph.getBoundingClientRect(); }catch(e){}
  if(now || !f.el.parentNode || !r || !r.height){ mapFullFinish(f); return; }
  mapFullBox(f.el, r);
  mapFullTimer(f, ()=>mapFullFinish(f), MAPFULL_MS+30);

// 後始末の本体。ここを通るまで _mapFull は空にしない（空にすると即時解除が効かなくなる）
function mapFullFinish(f){
  if(_mapFull!==f) return;
  _mapFull=null;
  mapFullClear(f); mapFullResizeWatch(f, false);
  window.removeEventListener('keydown', f.esc);
  document.body.classList.remove('map-full-lock');
  try{ MAPFULL_PROPS.forEach(p=>{ f.el.style[p]=f.prev[p]||''; }); f.el.classList.remove('map-full'); }catch(e){}
  try{ if(f.ph.parentNode) f.ph.parentNode.removeChild(f.ph); }catch(e){}
  try{ f.m.invalidateSize({animate:false}); }catch(e){}
}
function mapFullResizeWatch(f, on){
  if(on){ if(f.onres) return;
    f.onres=()=>mapFullFinish(f);
    window.addEventListener('resize', f.onres); window.addEventListener('orientationchange', f.onres); return; }
  if(!f.onres) return;
  window.removeEventListener('resize', f.onres); window.removeEventListener('orientationchange', f.onres);

function compassStop(){
  if(_compassHandler){ window.removeEventListener(_compassEvName, _compassHandler); _compassHandler=null; }

// 方位（磁北から時計回りの度）を算出。iOSはwebkitCompassHeading、その他は3軸（alpha/beta/gamma）から算出。
// 水平に持ったときは「端末の上端が向く方向」、立てて持ったときは「画面の裏＝自分が見ている方向」を使う
//（どちらか一方だけだと、持ち方によって計算不能・大ズレになるため切り替える）
function headingFromOrientation(e){
  if(typeof e.webkitCompassHeading==='number' && isFinite(e.webkitCompassHeading)) return e.webkitCompassHeading;
  if(!(e.absolute===true || _compassEvName==='deviceorientationabsolute')) return null;
  const a=e.alpha, b=e.beta, g=e.gamma;
  if(!Number.isFinite(a)) return null;
  if(!Number.isFinite(b) || !Number.isFinite(g)) return (360-a)%360;   // 3軸が揃わない端末は簡易計算
  const d=Math.PI/180;
  const cA=Math.cos(a*d), sA=Math.sin(a*d), cB=Math.cos(b*d), sB=Math.sin(b*d), cG=Math.cos(g*d), sG=Math.sin(g*d);
  const Ey=-sA*cB, Ny=cA*cB;                       // 端末の上端（y軸）の東・北成分
  if(Math.hypot(Ey,Ny)>0.15) return (Math.atan2(Ey,Ny)/d+360)%360;
  const Ez=sG*cA + sB*cG*sA, Nz=sG*sA - sB*cG*cA;  // ほぼ立てて持っている場合: 画面の裏（-z軸）の向き
  return (Math.atan2(-Ez,-Nz)/d+360)%360;
}
function compassToggle(btn){
  if(_compassOn || _compassHandler){ compassStop(); toast('向き追従をやめました（地図の向きはそのまま）'); return; }
  const req=++_compassReq;   // この操作の世代番号（許可待ち中に画面が変わったら無効化される）
  const start=()=>{
    if(req!==_compassReq){ return; }   // 待っている間に地図が破棄された（別画面へ移動した）
    let last=null, got=false;
    _compassEvName=('ondeviceorientationabsolute' in window)?'deviceorientationabsolute':'deviceorientation';
    _compassHandler=(e)=>{
      const h=headingFromOrientation(e);
      if(h==null) return;
      if(!got){ got=true;   // 最初の有効な値を受け取ってから「動作中」の表示にする
        const bb=document.getElementById('compassBtn'); if(bb){ bb.style.background='var(--accent)'; bb.disabled=false; }
        toast('自分の向きが画面の上になります（🧭をもう一度押すと解除）');
      }
      if(last!=null && Math.abs(((h-last+540)%360)-180)<2) return;   // 2度未満の揺れは無視（チラつき防止）
      last=h;
      if(mapObj && typeof mapObj.setBearing==='function'){ try{ mapObj.setBearing(-h); }catch(err){} }
    };
    window.addEventListener(_compassEvName, _compassHandler);
    _compassOn=true;
    toast('方位を確認中…');
  };
  if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function'){
    // iPhone/iPadは初回にユーザー許可が必要（ボタン押下の流れの中でしか要求できない）。許可待ち中はボタンを無効化
    if(btn) btn.disabled=true;
    DeviceOrientationEvent.requestPermission(true).then(res=>{
      const bb=document.getElementById('compassBtn'); if(bb) bb.disabled=false;
      if(res==='granted') start(); else toast('方位センサーの利用が許可されませんでした');
    }).catch(()=>{ const bb=document.getElementById('compassBtn'); if(bb) bb.disabled=false; toast('方位センサーを利用できません'); });
  }else if(window.DeviceOrientationEvent){ start(); }
  else toast('この端末では方位センサーを利用できません');
}

function formSnapshot(root){

  if(!root) return snap;
  root.querySelectorAll('input,select,textarea').forEach((el,i)=>{
    const key=(el.name||el.id||(el.getAttribute&&el.getAttribute('data-seg'))||('#'+i));
    if(el.type==='checkbox' || el.type==='radio') snap.fields[key]={c:el.checked};
    else snap.fields[key]={v:el.value};
  });
  root.querySelectorAll('[data-seg]').forEach(sg=>{
    snap.segs[sg.getAttribute('data-seg')]=
      [...sg.querySelectorAll('button.on')].map(b=>b.textContent);
  });
  return snap;
}
function formRestore(root, snap){
  if(!root || !snap) return;
  root.querySelectorAll('input,select,textarea').forEach((el,i)=>{
    const key=(el.name||el.id||(el.getAttribute&&el.getAttribute('data-seg'))||('#'+i));
    const f=snap.fields[key];
    if(!f) return;
    if(el.type==='checkbox' || el.type==='radio') el.checked=!!f.c;
    else el.value=(f.v!=null?f.v:'');
  });
  root.querySelectorAll('[data-seg]').forEach(sg=>{
    const on=new Set(snap.segs[sg.getAttribute('data-seg')]||[]);
    [...sg.querySelectorAll('button')].forEach(b=>b.classList.toggle('on', on.has(b.textContent)));
  });

        if(b.st.obs) sp=b.st.obs.species_name_snapshot||'';
        if(!sp && b.reinitId){ const r=DB.observations().find(x=>x.uuid===b.reinitId); sp=(r&&r.species_name_snapshot)||''; }
        if(!sp && b.reinitFl){ const f=DB.flight(b.reinitFl); sp=(f&&f.species_name_snapshot)||''; }
      }
    }
    const segs=b.map.segs||[];
    const nP=segs.filter(x=>x.t==='P').length, nF=segs.filter(x=>x.t==='F').length;
    const saved=(b.st.obsEditing || b.reinitId || b.reinitFl || (b.st && b.st.flAnchorUuid))
      ? ' <span class="small" style="opacity:.85">✓保存済み</span>' : '';
    return '<div onclick="birdSwitch('+i+')" style="padding:9px 12px; border-radius:10px; margin-bottom:4px; cursor:pointer;'
      +(cu?'background:#2f6f4f; color:#fff; font-weight:700;':'background:rgba(127,127,127,.16);')+'">'
      +(cu?'▼':'▶')+' '+(i+1)+'. '+(sp?esc(sp):'<span style="opacity:.7">（種名未入力）</span>')
      +' <span class="small" style="opacity:.85">止まり'+nP+'・経路'+nF+'</span>'+saved+'</div>';
  }).join('');
}
// 仮記録の一括破棄。'ok'=全部消せた（または対象なし） / 'abort'=読めないため何も消していない /
// 'restored'=途中失敗したが全部戻せた / 'broken'=戻しきれなかった（点検が必要）
function birdGhostPurge(ghosts){
  const live=[];
  for(const g of ghosts){
    const arr=loadStrict(g.key);
    if(!arr) return 'abort';
    const cur=arr.find(x=>x&&x.uuid===g.uuid);
    if(!cur) continue;   // 本体が無い＝消すものが無い（墓標だけ付ける事故を防ぐため対象外）
    g.prev=JSON.stringify(cur);
    // 「自分が書いた仮記録のまま」を証明できる場合だけ消す。控え（exp）が無い・
    // 一致しない場合は、別の書き手が正式化した可能性があるため触らない（残す）
    if(!g.exp || g.exp!==g.prev){ g.keptReal=true; continue; }
    // 事前の墓標の有無を控える（補償で外してよいのは自分が付けた墓標だけ）
    try{ g.hadTomb=tombstonesList().some(t=>t && (t===g.uuid || t.uuid===g.uuid)); }catch(e){ g.hadTomb=true; }
    live.push(g);
  }
  const attempted=[]; let fail=false;
  for(const g of live){
    // 削除の直前にもう一度読み、本体が控えと全文一致するときだけ消す。
    // 一致しない・消えている場合はその対象に一切触れない（別の書き手の削除・更新を尊重）
    const aD=loadStrict(g.key);
    const cD=aD?aD.find(x=>x&&x.uuid===g.uuid):null;
    if(!aD || !cD || JSON.stringify(cD)!==g.prev){ fail=true; break; }
    // 削除後にあるべき「残りの全文」を先に確定しておく。
    // 削除の読み書きの隙に別の書き手が他の記録を更新していたら、この照合で検知して補償へ回す
    //（検知せず進むと、古い配列の後勝ち保存で相手の更新を消してしまう）
    const expectRest=JSON.stringify(aD.filter(x=>!(x&&x.uuid===g.uuid)));
    attempted.push(g);   // 削除を実行する対象だけを補償の対象にする（触っていない対象を復活させない）
    let okD=false;
    try{
      okD=DB.hardDelete(g.key, g.uuid);
      if(okD){
        const aP=loadStrict(g.key);
        if(!aP || JSON.stringify(aP)!==expectRest) okD=false;   // 消えたこと＋他の記録が無傷なことまで確認
      }
    }catch(e){ okD=false; }
    if(!okD){ fail=true; break; }
  }
  if(!fail) return 'ok';
  let restoredAll=true;
  for(const d of attempted.slice().reverse()){
    // 先に「自分が付けた墓標」だけを外す（事前から墓標があった対象は他者の削除＝外さない）
    let tombLeft=true;
    if(!d.hadTomb){
      if(untombVerified(d.uuid)) tombLeft=false;
      else restoredAll=false;
    }
    try{
      // 墓標がまだ残っている（他者の削除・外せなかった）なら、本体を戻さない
      //（戻すと他者の削除の取り消しになり、墓標との食い違いも生む）
      if(tombLeft){ if(!d.hadTomb) restoredAll=false; continue; }
      const arr=loadStrict(d.key);
      if(!arr){ restoredAll=false; }
      else {
        const idx=arr.findIndex(x=>x&&x.uuid===d.uuid);
        if(idx<0){
          // 本体が無い場合だけ控えを戻す
          arr.push(JSON.parse(d.prev));
          if(!DB.save(d.key, arr)){ restoredAll=false; }
          else {
            const aV=loadStrict(d.key);
            const cV=aV?aV.find(x=>x&&x.uuid===d.uuid):null;
            if(!cV || JSON.stringify(cV)!==d.prev) restoredAll=false;
          }
        } else if(JSON.stringify(arr[idx])!==d.prev){
          // 別の書き手の本体が既にある＝絶対に上書きしない
          restoredAll=false;
        }
      }
    }catch(e){ restoredAll=false; }
  }
  return restoredAll?'restored':'broken';
}
function birdGhostPurgeToast(res){
  toast(res==='abort' ? '記録の読み込みに失敗したため破棄できません。データ点検・修復画面で確認してください'
    : res==='restored' ? '空き容量不足のため破棄できませんでした。空きを確保してからもう一度お試しください'
    : '破棄の途中で失敗しました。データ点検・修復画面で確認してください', 5000);
}
// 今の入力（欄・書きかけの印）を自分の入れ物へ写し取る
function birdStash(){
  if(typeof flStoreInto==='function' && SCREENS._flSeg) flStoreInto(SCREENS._flSeg);
  CUR().form=formSnapshot(document.getElementById('obForm'));
  CUR().dirty=!!SCREENS._dirty;
}
// 音声入力の認識中・未反映の発話があるか。切替・保存で画面が組み直されると失われるため、
// 個体の切替・追加・削除・保存の全入り口で確かめる
function voiceBusy(){
  if(typeof VREC!=='undefined' && VREC){ toast('音声入力の聞き取り中です。停止してから操作してください', 5000); return true; }
  const vt=document.getElementById('voiceText');
  if(vt && String(vt.value||'').trim()){
    toast('音声入力の内容がまだ反映されていません。「上の入力欄に反映」するか消してからにしてください', 5000); return true; }
  return false;
}
function birdBusy(){
  if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY){ toast('保存の処理中です。少し待ってください'); return true; }
  if(typeof recBusy==='function' && recBusy()){ toast('録音を停止してから操作してください'); return true; }
  if(typeof mediaBusy==='function' && mediaBusy()){ toast('写真・動画の取り込みが終わってから操作してください'); return true; }
  if(voiceBusy()) return true;
  return false;
}
function birdSwitch(i){
  if(i===BIRD_IDX || !BIRDS[i]) return;
  if(birdBusy()) return;
  birdStash();
  BIRD_IDX=i;
  SCREENS._birdKeep=true;
  render();
}
function birdAdd(){
  if(birdBusy()) return;
  birdStash();
  BIRDS.push(newBird());
  BIRD_IDX=BIRDS.length-1;
  SCREENS._birdKeep=true;
  render();
  SCREENS._dirty=false;   // 追加したばかりの個体はまだ書きかけではない
}
function birdDrop(){
  if(BIRDS.length<=1) return;
  if(birdBusy()) return;
  if(!confirm('この個体の入力を消しますか？（保存済みの記録は消えません）')) return;
  const b=CUR();
  const gh=b.media && b.media.ghost;
  let keptRealD=false;
  if(gh){
    const gJob={b, key:gh.key, uuid:gh.uuid, exp:gh.rec};
    const resD=birdGhostPurge([gJob]);
    if(resD!=='ok'){ birdGhostPurgeToast(resD); return; }
    keptRealD=!!gJob.keptReal;
    b.media.ghost=undefined;
    mediaGcAll().catch(()=>{});
  }
  if(!keptRealD && b.st && b.st.obs && !b.st.obsEditing) DISCARDED.add(b.st.obs.uuid);   // 正式化された記録は名簿に入れない
  BIRDS.splice(BIRD_IDX,1);
  if(BIRD_IDX>=BIRDS.length) BIRD_IDX=BIRDS.length-1;
  SCREENS._birdKeep=true;
  render();
  SCREENS._dirty=!!CUR().dirty;
}
// 保存が成功したあとの受け皿。複数個体のときは画面に留まり、
// この個体を「保存済みの記録の編集」として読み直す（追加なら新しい個体も開く）
function birdAfterSave(u2, add, flU){
  if(!add && BIRDS.length<=1) return false;
  const nb=newBird();
  const b=CUR();
  b.dirty=false; b.form=null; b.st=nb.st; b.map=nb.map; b.media=nb.media;
  // 読み直し先は「生存している記録」だけ（削除だけの保存では未保存の空欄として残す）
  const obsLive = u2 ? DB.observations().find(x=>x&&x.uuid===u2) : null;
  const flLive = flU ? DB.flights().find(f=>f.uuid===flU) : null;
  if(obsLive) b.reinitId=u2; else if(flLive) b.reinitFl=flU;
  // 保存した内容の位置を薄描き用に入れ物へ再構築する（次にこの個体を開くと
  // reinit の全読み込みで置き換わる。ここは他の個体の地図に見せるためだけの写し）。
  // 生存レコード全件（同じ鳥の複数P・複数F・巣）から作る
  try{
    const segs=[];
    const pushP=o2=>{ if(validLatLon(coordStr(o2.target_latitude), coordStr(o2.target_longitude)))
      segs.push({t:'P', id:0, pt:[parseFloat(o2.target_latitude), parseFloat(o2.target_longitude)], time:'', perch:perchNew()}); };
    const pushF=f2=>{ const pth=(f2.path||[]).filter(validPathPt);
      if(pth.length>1) segs.push({t:'F', id:0, pts:pth, times:[], fl:{height:'',behavior:''}}); };
    const baseRec=obsLive||flLive;
    if(baseRec){
      const sv2=baseRec.survey_uuid, key2=baseRec.individual_key||'';
      const obsList = key2 ? DB.obsOf(sv2).filter(o2=>o2.individual_key===key2) : (obsLive?[obsLive]:[]);
      const flList  = key2 ? DB.flightsOf(sv2).filter(f=>f.individual_key===key2) : (flLive?[flLive]:[]);
      obsList.forEach(pushP);
      flList.forEach(pushF);
      const nestSrc=obsList.find(o2=>validLatLon(coordStr(o2.nest_latitude), coordStr(o2.nest_longitude)))||null;
      if(nestSrc) b.map.nest=[parseFloat(nestSrc.nest_latitude), parseFloat(nestSrc.nest_longitude)];
    }
    if(segs.length) b.map.segs=segs;
  }catch(e){}
  if(add){ BIRDS.push(newBird()); BIRD_IDX=BIRDS.length-1; }
  SCREENS._birdKeep=true;
  render();
  SCREENS._dirty=false;
  return true;
}
/* ---------- ここまで 段A・段B ---------- */
function pfSet(mode){
  // P/F/N を押したら必ず「次は新しく始める」。同じボタンをもう一度押したときも同じ
  //（押し直しても前の線が伸びる、という取り違えを防ぐ）
  PF_NEWLINE=true;
  PF_MODE=mode;
  PF_SEL=-1;   // モードを選び直したら「新しく落とす」に戻す
  if(typeof segChips==='function') segChips();
  ['P','F','N'].forEach(m=>{ const b=$('#pf'+m); if(b) b.classList.toggle('on', mode===m); });
  pfInfo(); pfSyncFlightFields();
}
function pfPoints(){ return PF_SEGS.filter(x=>x.t==='P'); }
// PF_NEST=巣の位置 [lat,lon]（1つだけ） / PF_NEST_ID=巣そのものの目印 /
// PF_SEL=直している対象（PF_SEGSの番号。-1 は「新しく落とす」）。実体は CUR().map（段A）
// 「↶」用の履歴。この画面でした操作の直前の状態を積む。
// 末尾を削る作りだと、既存記録を開いただけで保存済みの位置を消せてしまうため（2026-08-06 監査）
// PF_HIST / PF_SEQ の実体は CUR().map（段A）
function pfId(){ return ++PF_SEQ; }   // 戻すときに同じものだと分かるように、落としたものに番号を振る
function pfSnap(){
  if(typeof flStoreInto==='function' && SCREENS._flSeg) flStoreInto(SCREENS._flSeg);   // 画面の値を経路へ控えてから状態を残す
  PF_HIST.push(JSON.stringify({segs:PF_SEGS, nest:PF_NEST, newline:PF_NEWLINE, sel:PF_SEL, perch:PERCH_IDX,
    pending:(SCREENS._pendingPerch||null), legacy:PF_LEGACY_ID,
    nestTouched:!!SCREENS._nestTouchedMap}));   // 引き継ぎ待ちの情報・「地図で巣を触ったか」も一緒に戻す
  if(PF_HIST.length>60) PF_HIST.shift();
}
// 落としたものの一覧を作る。P=止まり、L=経路（利用者の言い方に合わせる）
function segLabel(i){
  let np=0, nl=0;
  for(let k=0;k<=i;k++){ if(PF_SEGS[k].t==='P') np++; else nl++; }
  return (PF_SEGS[i].t==='P') ? ('P'+np) : ('L'+nl);
}
function segChips(){
  const box=$('#segChips'); if(!box) return;
  if(!PF_SEGS.length && !PF_NEST){ box.innerHTML=''; segEditBar(); return; }
  const items=PF_SEGS.map((sg,i)=>
    `<span class="c${i===PF_SEL?' on':''}" data-i="${i}" onclick="segPick(Number(this.getAttribute('data-i')))">${segLabel(i)}</span>`);
  if(PF_NEST) items.push(`<span class="c${PF_SEL===-2?' on':''}" data-i="-2" onclick="segPick(-2)">巣</span>`);
  box.innerHTML='<span class="tiny muted" style="align-self:center; margin-right:4px;">直す：</span>'+items.join('');
  segEditBar();
}
// 観察にしか置き場所が無い入力のまとまり（class="obs-only"）をひとまとめに扱う。
// 項目名を並べて覚えさせる作りは、追加のたびに数え漏れる（前の版で何度も起きた）
function obsOnlyEls(){
  const out=[];
  document.querySelectorAll('.obs-only').forEach(box=>{
    box.querySelectorAll('input,select,textarea,button').forEach(el=>out.push(el));
  });
  return out;
}
function obsOnlyVals(){
  const parts=[];
  document.querySelectorAll('.obs-only').forEach(box=>{
    box.querySelectorAll('input,select,textarea').forEach(el=>{
      parts.push(el.type==='checkbox' ? (el.checked?'1':'0') : String(el.value||''));
    });
    box.querySelectorAll('[data-seg]').forEach(seg=>{
      parts.push([...seg.querySelectorAll('button.on')].map(b=>b.textContent).join('・'));
    });
  });
  return parts.join('\u0001');
}
function obsOnlyChanged(){ return SCREENS._obsOnlyInit!=null && obsOnlyVals()!==SCREENS._obsOnlyInit; }
// 入力を触れなくする理由は2つ（経路だけ／Pが無い）。別々に書くと互いに解除し合うので1か所にまとめる
// 巣の情報があるか（位置でも、樹種・樹高・状態でも）。巣は止まった場所とは限らないので単独で記録できる
function nestFilled(){
  if(PF_NEST) return true;
  const f=$('#obForm'); if(!f) return false;
  return ['nest_tree_species','nest_tree_height','nest_state'].some(n=>{
    const el=f.querySelector('[name="'+n+'"]'); return !!(el && String(el.value||'').trim());
  });
}
// 観察の記録を作るかどうか。編集中は必ず作る（Pを消しても記録そのものは残すため）
function willSaveObs(){ return !!SCREENS._obsEditing || pfPoints().length>0 || nestFilled(); }
function pfSaveableFls(){ return PF_SEGS.filter(sg=>sg.t==='F' && (sg.pts.length>=2 || (sg.srcUuid && !sg.edited))); }
function isFlightOnly(){ return pfSaveableFls().length>0 && !willSaveObs(); }
function syncDisabledStates(){
  const ps=pfPoints();
  const flightOnly = isFlightOnly();
  obsOnlyEls().forEach(el=>{ el.disabled=flightOnly; });
  // 止まり木は P が無ければ置き場所が無い（この指定が後に来るように書く）

    PERCH_FIELDS.forEach(id=>{ const el=$('#'+id); if(el) el.disabled = flightOnly || ps.length===0; });
  const note=$('#obsOnlyNote'); if(note) note.style.display=flightOnly?'':'none';
}
// 最初の状態を覚えておく（「触られたか」を見比べるため／戻すため）
function obsOnlyCapture(){
  // 「最初の状態」は DOM の印（_initVal/_initOn）に加えて、個体の入れ物にも控える。
  // 個体切替で画面を組み直すと DOM の印は失われるため、入れ物から掛け直す
  const snap={ f:{}, s:{} };
  let gi=0;
  document.querySelectorAll('.obs-only').forEach(box=>{
    box.querySelectorAll('input,select,textarea').forEach(el=>{
      el._initVal=(el.type==='checkbox')?el.checked:el.value;
      const key=(el.name||el.id||(el.getAttribute&&el.getAttribute('data-seg'))||('#'+gi)); gi++;
      snap.f[key]=el._initVal;
    });
    box.querySelectorAll('[data-seg]').forEach(seg=>{
      seg._initOn=[...seg.querySelectorAll('button.on')].map(b=>b.textContent).join('・');
      snap.s[seg.getAttribute('data-seg')]=seg._initOn;
    });
  });
  CUR().st.obsOnlyInitSnap=snap;
  SCREENS._obsOnlyInit=obsOnlyVals();
  // 画面の入力欄だけでなく、地図に置いた巣と「距離帯を指定したか」も一緒に控える
  SCREENS._obsOnlyInitNest = PF_NEST ? PF_NEST.slice() : null;
  SCREENS._obsOnlyInitBand = !!SCREENS._bandTouched;
}
// 個体切替で組み直した DOM へ、「最初の状態」の印を入れ物から掛け直す
function obsOnlyInitReapply(){
  const snap=CUR().st.obsOnlyInitSnap; if(!snap) return;
  let gi=0;
  document.querySelectorAll('.obs-only').forEach(box=>{
    box.querySelectorAll('input,select,textarea').forEach(el=>{
      const key=(el.name||el.id||(el.getAttribute&&el.getAttribute('data-seg'))||('#'+gi)); gi++;
      if(Object.prototype.hasOwnProperty.call(snap.f, key)) el._initVal=snap.f[key];
    });
    box.querySelectorAll('[data-seg]').forEach(seg=>{
      const k2=seg.getAttribute('data-seg');
      if(Object.prototype.hasOwnProperty.call(snap.s, k2)) seg._initOn=snap.s[k2];
    });
  });
}
// 触れない状態でも戻せるように、最初の状態へ戻す手段を用意する
function obsOnlyReset(){
  if(!confirm('観察にしか残せない項目の入力を、最初の状態に戻しますか？')) return;
  document.querySelectorAll('.obs-only').forEach(box=>{
    box.querySelectorAll('input,select,textarea').forEach(el=>{
      const was=el.disabled; el.disabled=false;
      if(el.type==='checkbox') el.checked=!!el._initVal;
      else el.value=(el._initVal!=null?el._initVal:'');
      el.disabled=was;
    });
    box.querySelectorAll('[data-seg]').forEach(seg=>{
      const want=String(seg._initOn||'').split('・').filter(Boolean);
      seg.querySelectorAll('button').forEach(b=>{
        if(b.classList.contains('on')!==want.includes(b.textContent)){
          const was=b.disabled; b.disabled=false; b.click(); b.disabled=was; }
      });
    });
  });
  const _nestChanged = JSON.stringify(PF_NEST) !== JSON.stringify(SCREENS._obsOnlyInitNest||null);
  PF_NEST = SCREENS._obsOnlyInitNest ? SCREENS._obsOnlyInitNest.slice() : null;
  SCREENS._bandTouched = !!SCREENS._obsOnlyInitBand;
  if(PF_SEL===-2 && !PF_NEST) PF_SEL=-1;   // 消えたものを「直しています」と言わない
  PF_NEWLINE=true;                          // 戻したあとは「新しく落とす」状態に
  if(_nestChanged) nestTouch();             // 巣が実際に動いたときだけ「触った」にする
  nestSync();
  if(typeof updateBreedHint==='function') updateBreedHint();
  if(typeof updateIdHint==='function') updateIdHint();
  pfRedraw(); pfInfo(); segChips();
  toast('観察の項目を最初の状態に戻しました');
}
// 古い記録の「止まり木・巣など」の位置を、巣の位置として移す。
// 対象は「開いたときに読み込んだその位置」だけ。あとから落とした P を巻き込まない
// PF_LEGACY_ID の実体は CUR().map（段A）
function legacyPosNoteSync(){
  const lp=$('#legacyPosNote'); if(!lp) return;
  const alive = PF_LEGACY_ID!=null && PF_SEGS.some(x=>x.id===PF_LEGACY_ID && x.t==='P');
  lp.style.display = (alive && !PF_NEST) ? '' : 'none';
}
function legacyPosToNest(){
  const sg=PF_SEGS.find(x=>x.id===PF_LEGACY_ID && x.t==='P');
  if(!sg){ legacyPosNoteSync(); return; }
  // 開いた記録自身のPだけが対象。兄弟のPを巣に移すと、その兄弟の記録ごと消えてしまう
  if(sg.srcUuid && SCREENS._obs && sg.srcUuid!==SCREENS._obs.uuid){ PF_LEGACY_ID=null; legacyPosNoteSync(); return; }
  if(PF_NEST && !confirm('すでに指定した巣の位置を置き換えますか？')) return;
  if(!confirm('この位置を「巣の位置」に移しますか？')) return;
  pfSnap();
  PF_NEST=[sg.pt[0], sg.pt[1]];
  PF_SEGS.splice(PF_SEGS.indexOf(sg),1);
  PF_SEL=-1; PERCH_IDX=0;
  PF_LEGACY_ID=null;
  nestTouch(); nestSync();
