  if(field==='identification_status') updateIdHint(); }
function segVal(field){ const root=document.querySelector(`[data-seg="${field}"]`); if(!root) return '';
  if(root.tagName==='SELECT') return root.value;   // プルダウン版（「なし」は value="" なのでそのまま空）
  const on=root.querySelector('button.on'); return on? (on.textContent==='なし'?'':on.textContent):''; }
function segVals(field){ return [...document.querySelectorAll(`[data-seg="${field}"] button.on`)].map(b=>b.textContent).filter(t=>t!=='なし').join('・'); }

/* ---------- 入力中のライブガイド（Survey123の「条件つき質問」に相当） ----------
   render()は使わない（画面を作り直すと編集中の入力が全部消え、新規なら記録IDまで変わるため）。
   HTMLに置いた非表示のヒント欄の文言と表示だけを書き換える。
   各関数は冒頭の要素ガードが必須: 行動segは飛翔経路の入力画面にもあり、そこで誤動作させないため */
const NEST_BEHAVIORS=['巣立ち雛','給餌','餌運び','餌渡し','巣材運搬'];   // 巣・対象位置の欄を自動で開く行動
function updateBreedHint(){
  const el=$('#breedHint'); if(!el) return;
  const bs=segVals('behavior');
  const rank=breedingRank(bs, true);
  if(rank==='A' || rank==='B'){
    el.style.display='';
    el.textContent = rank==='A' ? '🐣 この行動は繁殖ランクA（繁殖を確認）に相当します'
                                : '🐣 この行動は繁殖ランクB（繁殖の可能性）に相当します';
  }else el.style.display='none';
  // 巣に関わる行動なら、巣・対象位置の入力欄を自動で開く（開くだけで閉じない——入力済みかもしれないため）。
  // 「さえずり」等のB該当だけでは開かない（最頻タグのため毎回開くと邪魔になる）
  const fold=$('#nestFold');
  if(fold && bs.split('・').some(b=>NEST_BEHAVIORS.includes(b))) fold.open=true;
}
function updateIdHint(){
  const el=$('#idHint'); if(!el) return;
  const v=segVal('identification_status');
  if(v==='未同定' || v==='仮同定'){
    el.style.display='';
    // 自動付与は新規保存のみのため、断定しない文言にする（編集時は付かない——利用者の判断を尊重する仕様）
    el.textContent='💡 録音・写真や根拠メモを残しておくと、あとで同定できます（新規の記録には保存時に「要確認」が自動で付きます）';
  }else el.style.display='none';
}

/* ---------- 「その他」の記入欄 ----------
   「その他」ボタンを選ぶと記入欄が現れ、保存時は値の「その他」を「その他（記入内容）」に
   置き換えて同じ項目に格納する（列を増やさずCSV・検索・表示にそのまま出る）。
   編集時は otherParse で「その他」と記入内容に分解して、ボタン一致と記入欄の初期値に使う */
function otherParse(v){ v=String(v||''); const m=v.match(/その他（([^）]*)）/);
  return m? {v:v.replace(m[0],'その他'), other:m[1]} : {v, other:''}; }
function otherBox(field, other, show){
  return `<input data-other="${field}" value="${esc(other||'')}" placeholder="「その他」の内容を記入（任意）"
    style="margin-top:6px;${show?'':'display:none;'}">`; }
function otherMerge(val, field){
  const inp=document.querySelector(`[data-other="${field}"]`);
  const t=inp?inp.value.trim():''; if(!t) return val;
  return String(val||'').split('・').map(x=>x==='その他'?`その他（${t}）`:x).join('・'); }
function syncOther(field){
  const inp=document.querySelector(`[data-other="${field}"]`); if(!inp) return;
  const on=[...document.querySelectorAll(`[data-seg="${field}"] button.on`)].some(b=>b.textContent==='その他');
  inp.style.display=on?'':'none'; }
function toggleMulti(btn){ btn.classList.toggle('on');
  const seg=btn.closest('[data-seg]'); if(seg){ syncOther(seg.dataset.seg); segSumUpdate(seg.dataset.seg); } SCREENS._dirty=true;
  if(seg && seg.dataset.seg==='behavior') updateBreedHint(); }
// 折りたたみ式の複数選択で、閉じたままでも選択中の内容が見えるように見出しの表示を更新する
//（要素が無い画面＝飛翔経路の行動・とまり木の項目では何もしない）
function segSumUpdate(field){ const el=document.getElementById('segsum-'+field); if(el) el.textContent=segVals(field)||'未選択'; }

/* 種名検索（ひらがな・カタカナどちらの入力でもヒット） */
function toKata(s){ return String(s||'').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)); }
function spSearch(q){
  const box=$('#spSuggest'); q=(q||'').trim();
  updateSpRefLinks(q);
  if(!q){ box.innerHTML='';
    // キーボードで種名を消した場合も、候補からの解除（chooseSpecies）と同じ扱いにする。
    // 保存時は種名空＝未同定に強制されるため、画面の同定状態表示をそれに一致させる。
    // 同定状態のボタン群は観察入力にしかないので、飛翔経路の種名入力では何も起きない
    SCREENS._chosenId='';   // 内部に保持している種IDも消す（残すと「種名は空なのに前の鳥のIDが保存される」）
    const seg=document.querySelector('[data-seg="identification_status"]');
    if(seg){ [...seg.querySelectorAll('button')].forEach(b=>b.classList.toggle('on', b.textContent==='未同定')); updateIdHint(); }
    return; }
  // 内部の種IDを入力中の名前に常に追随させる（候補を選ばず別の種名へ直接書き換えたとき、
  // 前の鳥のIDが残って「新しい種名＋旧ID」の不整合データになるのを防ぐ。候補選択時は chooseSpecies が上書きする）
  SCREENS._chosenId=(speciesByName(q)||{}).species_id||'';
  const qk=toKata(q);
  const pre = SPECIES.filter(s=>toKata(s.japanese_name).startsWith(qk));
  const part = SPECIES.filter(s=>!toKata(s.japanese_name).startsWith(qk) && toKata(s.japanese_name).includes(qk));
  const list=[...pre,...part].slice(0,12);
  box.innerHTML = list.length ? `<div class="suggest">${list.map(s=>
    `<div class="item" onclick="chooseSpecies(${s.species_id},'${esc(s.japanese_name)}')">${esc(s.japanese_name)}</div>`).join('')}
    <div class="item" style="color:var(--muted)" onclick="chooseSpecies('','')">「${esc(q)}」は候補になし → 未同定で保存</div></div>`
    : `<div class="suggest"><div class="item" style="color:var(--muted)" onclick="chooseSpecies('','')">候補なし → 未同定で保存</div></div>`;
}
function chooseSpecies(id,name){ $('#spInput').value=name; $('#spSuggest').innerHTML=''; updateSpRefLinks(name);
  SCREENS._dirty=true;
  if(!name){ document.querySelectorAll('[data-seg="identification_status"] button').forEach(b=>{
    b.classList.toggle('on', b.textContent==='未同定'); }); }
  else if(segVal('identification_status')==='未同定'){
    // 「候補になし→未同定」の後に種を選び直したら「確定」へ戻す（「仮同定」等の手動選択は上書きしない）
    document.querySelectorAll('[data-seg="identification_status"] button').forEach(b=>{
      b.classList.toggle('on', b.textContent==='確定'); });
  }
  updateIdHint();   // 種名クリア→未同定など、ボタンをプログラムで書き換えた場合もヒントを追随させる
  SCREENS._chosenId=id; }
function renderQuickSpecies(){
  const box=$('#spQuick'); const recent=DB.recentSpecies();
  const svUuid=(SCREENS._obs&&SCREENS._obs.survey_uuid)||currentSurveyUuid;   // 編集中の記録が属する調査を参照
  const inSurvey=[...new Set(DB.obsOf(svUuid).map(o=>o.species_name_snapshot).filter(Boolean))];
  const set=[...new Set([...inSurvey.slice(0,6),...recent])].slice(0,10);
  box.innerHTML = set.map(n=>`<span class="c" data-sp="${esc(n)}" onclick="pickQuickSpecies(this)">${esc(n)}</span>`).join('');
}
// data属性から値を読む（onclickのJS文字列にユーザー入力を埋め込まない＝XSS対策）
function pickQuickSpecies(el){ const n=(el&&el.getAttribute('data-sp'))||''; chooseSpecies('',n); }
// 緯度・経度を手入力したとき: 手入力座標にGPS精度は付けられないため「不明」にし、表示からも±を消す
function posManualEdit(){
  SCREENS._acc=''; SCREENS._dirty=true;
  const la=$('#latIn')?$('#latIn').value.trim():'', lo=$('#lonIn')?$('#lonIn').value.trim():'';
  const pl=$('#posLabel'); if(pl) pl.textContent=(la||lo)?(la+', '+lo):'未取得';
  if(validLatLon(la,lo)) obsPosMarkerUpdate(parseFloat(la),parseFloat(lo));   // 観察位置マップが開いていれば追随
}
function grabGps(){
  if(!navigator.geolocation){ toast('位置情報を利用できません'); return; }
  const own=(SCREENS._obs&&SCREENS._obs.uuid); toast('位置を取得中…');
  navigator.geolocation.getCurrentPosition(p=>{
    lastFix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};
    // 取得完了前に別の記録へ移っていたら、その画面に書き込まない（非同期結果の混入防止）
    if(!$('#latIn') || (SCREENS._obs&&SCREENS._obs.uuid)!==own) return;
    $('#latIn').value=p.coords.latitude.toFixed(6); $('#lonIn').value=p.coords.longitude.toFixed(6);
    $('#posLabel').textContent=`${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)} (±${Math.round(p.coords.accuracy)}m)`;
    SCREENS._acc=Math.round(p.coords.accuracy); SCREENS._dirty=true;   // プログラムによる値変更はinput監視に乗らないため明示
    // 観察位置マップが開いていればマーカーと表示位置を追随（精度は上で設定済みなので触らない）
    obsPosMarkerUpdate(p.coords.latitude, p.coords.longitude);
    if(mapObj && $('#obsPosMap') && $('#obsPosMap').style.display!=='none'){ try{ mapObj.setView([p.coords.latitude,p.coords.longitude],16); }catch(e){} }
    toast('位置を取得しました');
  }, e=>toast('位置を取得できませんでした'), {enableHighAccuracy:true, timeout:15000});
}
/* 観察の対象位置（止まり木・巣など）を地図タップで指定 */
/* ---------- 地図の共通生成（タイル・レイヤ切替・回転・方位） ----------
   4画面（対象位置・ルート・飛翔・全体図）で同じタイル設定を使うため一本化。
   回転は leaflet-rotate 読み込み時のみ有効（読めない場合は従来どおり北固定で動く） */
let mapBearing=0;         // 地図の向き（度）。mapObjはrender()で毎回破棄されるため独立変数で画面をまたいで保持
let _compassOn=false;     // コンパス追従（自分の向きが上）の状態
let _compassHandler=null; // 方位センサーリスナー（解除用）
let _compassEvName='deviceorientation';   // 登録したイベント名（同じ名前で確実に解除するため保持）
let _compassReq=0;        // 許可待ちの世代番号。地図破棄で++して、遅れて届いた許可が古い地図を回すのを防ぐ
// 地図の破棄はこの1本に集約（render・対象位置地図の開閉から使う）。コンパス監視・許可待ちも道連れで無効化
function destroyMap(){
  if(typeof mapFullOff==='function') mapFullOff(true);   // 全画面のまま破棄すると固定表示が画面に残るので先に戻す
  if(mapObj){ try{ mapObj.remove(); }catch(e){} mapObj=null; }
  // 地図上のマーカー参照もここでまとめて破棄する（古い参照が残ると、次に開いた別の地図と取り違える温床になる）
  obsTargetMarker=null; obsPosMarker=null;
  compassStop(); _compassReq++;
}
function createBaseMap(elId, center, zoom, opts){
  opts=opts||{};
  const rotatable=!!(L.Map && L.Map.prototype.setBearing);
  const m=L.map(elId, rotatable?{ rotate:true, rotateControl:false, touchRotate:true, shiftKeyRotate:true, bearing:mapBearing }:{}).setView(center, zoom);
  const gsiAttr='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>';
  // crossOrigin必須: 無指定だとタイル取得がno-cors＝応答がopaqueになり、Service Workerがキャッシュできず
  // 圏外表示（受動キャッシュ・オフライン地図の保存）が全く効かない
  const gsi=(name,ext,mx,opt)=>L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/'+name+'/{z}/{x}/{y}.'+ext, Object.assign({maxZoom:18, maxNativeZoom:mx||18, attribution:gsiAttr, crossOrigin:'anonymous'}, opt||{}));
  const bases={ '標準地図':gsi('std','png',18), '淡色地図':gsi('pale','png',18), '写真（航空・衛星）':gsi('seamlessphoto','jpg',18) };
  let savedBase=localStorage.getItem('bs_basemap'); if(!bases[savedBase]) savedBase='標準地図';
  bases[savedBase].addTo(m);
  const overlays=opts.overlays?{
    '陰影を重ねる（起伏）': gsi('hillshademap','png',16,{opacity:0.5}),
    '傾斜を重ねる（急斜面）': gsi('slopemap','png',15,{opacity:0.45}),
  }:{};
  if(opts.overlays){
    let savedOv=[]; try{ savedOv=JSON.parse(localStorage.getItem('bs_overlays')||'[]'); }catch(e){}
    savedOv.forEach(n=>{ if(overlays[n]) overlays[n].addTo(m); });
    m.on('overlayadd overlayremove', ()=>{ try{
      localStorage.setItem('bs_overlays', JSON.stringify(Object.keys(overlays).filter(n=>m.hasLayer(overlays[n]))));
    }catch(err){} });
  }
  L.control.layers(bases, overlays, {position:'topright', collapsed:true}).addTo(m);
  m.on('baselayerchange', e=>{ try{ localStorage.setItem('bs_basemap', e.name); }catch(err){} });
  if(rotatable) addCompassControls(m);
  addFullscreenControl(m);
  setTimeout(()=>{ try{ m.invalidateSize(); }catch(e){} },200);
  return m;
}
/* ---------- 地図を画面いっぱいに広げる（右下のボタン） ----------
   フォームに埋め込んだ地図は狭くて見づらいので、その場で全画面に広げられるようにする。
   position:fixed に切り替えるだけだと瞬間移動して「どこが広がったのか」が分からないため、
   いまの枠から画面の四隅へ 0.28秒かけて伸ばす（戻すときは逆再生）。
   Leafletは器の大きさの変化を自分では見ないので、伸びる途中と伸び終わりに invalidateSize() する。
   iOS Safari は動画以外の全画面API（requestFullscreen）が使えないため、CSSで広げる方式にしている */
let _mapFull=null;   // 全画面中の情報 {el, ph, prev, m, btn, esc}。同時に1枚しか開かない（mapObjが1本のため）
const MAPFULL_MS=280;
// 全画面で書き換える指定だけを覚えて戻す（cssText丸ごとの退避・復元にすると、その間に
// 他の処理が変えた display などを古い値に巻き戻してしまう＝閉じた地図が再び現れる）
// margin は shorthand で退避・復元すると個別指定（margin-top:8px など）を消してしまい、
// 戻したときに地図の上下の余白が失われる（実測で8pxずれた）。必ず4辺それぞれで持つ
const MAPFULL_PROPS=['position','marginTop','marginRight','marginBottom','marginLeft',
  'width','height','zIndex','top','left','right','bottom','transition','borderRadius','border'];
function addFullscreenControl(m){
  const C=L.Control.extend({ onAdd:function(){
    const b=L.DomUtil.create('button','map-full-btn');
    b.type='button'; b.textContent='⛶ 大きく'; b.title='地図を画面いっぱいに広げる';
    L.DomEvent.disableClickPropagation(b);
    L.DomEvent.on(b,'click',L.DomEvent.stop).on(b,'click',()=>mapFullToggle(m,b));
    return b; }});
  new C({position:'bottomright'}).addTo(m);
}
// 予約した後始末は必ず「今もこの全画面が現役か」を確かめてから動く（連打・画面遷移で世代が変わるため）
function mapFullTimer(f, fn, ms){ const id=setTimeout(()=>{ if(_mapFull===f) fn(); }, ms); f.timers.push(id); return id; }
function mapFullClear(f){ f.timers.forEach(clearTimeout); f.timers=[]; }
function mapFullToggle(m,btn){
  if(!_mapFull){ mapFullOn(m,btn); return; }
  // 縮小の途中でもう一度押されたら、閉じるのをやめて広げ直す（連打で状態が二重に作られるのを防ぐ）
  if(_mapFull.closing) mapFullExpand(_mapFull); else mapFullOff();
}
// 現在の枠 → 画面いっぱい
function mapFullOn(m,btn){
  if(_mapFull){ if(_mapFull.closing) mapFullExpand(_mapFull); return; }
  let el=null; try{ el=m.getContainer(); }catch(e){}
  if(!el || !el.parentNode) return;
  const r=el.getBoundingClientRect();
  // 元の場所に同じ高さの場所取りを置く（全画面の間、下のフォームが詰まって動かないように）
  // 元の場所に同じ大きさ・同じ余白の場所取りを置く（余白まで写さないと、戻り先を測る位置が
  // 余白のぶんずれて、縮小し終わった瞬間にカクッと跳ねる）
  const cs=getComputedStyle(el);
  const ph=document.createElement('div');
  ph.className='map-full-ph';   // 片付け漏れを見つけやすくするため名前を付ける
  ph.style.cssText='height:'+r.height+'px; flex:none; margin:'
    +cs.marginTop+' '+cs.marginRight+' '+cs.marginBottom+' '+cs.marginLeft+';';
  el.parentNode.insertBefore(ph, el);
  const esc=(e)=>{ if(e.key==='Escape') mapFullOff(); };
  const prev={}; MAPFULL_PROPS.forEach(p=>prev[p]=el.style[p]);
  // 後ろのページを止めると読み位置が先頭に飛ぶ端末があるので、戻すときのために覚えておく
  const f={el, ph, prev, m, btn, esc, sy:window.scrollY||0, timers:[], closing:false, onres:null};
  _mapFull=f;
  mapFullBox(el, r);   // まず「いまと同じ見た目」で position:fixed にする
  el.classList.add('map-full');
  el.offsetHeight;     // ここで一度確定させないと、次の指定とまとめて適用されて動きにならない
  window.addEventListener('keydown', esc);
  mapFullExpand(f);
}
// 画面の四隅へ広げる（新規に開くときと、閉じ途中の取り消しの両方から使う）
function mapFullExpand(f){
  mapFullClear(f); mapFullResizeWatch(f, false); f.closing=false;
  const el=f.el;
  el.style.transition='top '+MAPFULL_MS+'ms ease, left '+MAPFULL_MS+'ms ease, right '+MAPFULL_MS+'ms ease, bottom '+MAPFULL_MS+'ms ease';
  el.style.top='0px'; el.style.left='0px'; el.style.right='0px'; el.style.bottom='0px';
  document.body.classList.add('map-full-lock');   // 後ろのページが一緒に動かないように
  if(f.btn){ try{ f.btn.textContent='⤡ 小さく'; f.btn.title='元の大きさに戻す'; }catch(e){} }
  // 伸びる途中と伸び終わりに作り直す（途中の1回で地図の中身が追いついて見える）
  mapFullTimer(f, ()=>{ try{ f.m.invalidateSize({animate:false}); }catch(e){} }, Math.round(MAPFULL_MS/2));
  mapFullTimer(f, ()=>{ try{ f.m.invalidateSize({animate:false}); }catch(e){} }, MAPFULL_MS+30);
}
// 画面いっぱい → 元の枠。now=true は動きを付けずに即戻す（地図の破棄・画面遷移から呼ぶとき用）
function mapFullOff(now){
  const f=_mapFull; if(!f) return;
  if(f.closing && !now) return;   // すでに閉じ中（二度押しは無視）
  mapFullClear(f);
  f.closing=true;
  if(f.btn){ try{ f.btn.textContent='⛶ 大きく'; f.btn.title='地図を画面いっぱいに広げる'; }catch(e){} }
  // 先にページの固定を解いて読み位置を戻す（戻り先の枠は、その状態で測らないとずれる）
  document.body.classList.remove('map-full-lock');
  if(Math.abs((window.scrollY||0)-f.sy)>2){ try{ window.scrollTo(0, f.sy); }catch(e){} }
  let r=null; try{ r=f.ph.getBoundingClientRect(); }catch(e){}
  if(now || !f.el.parentNode || !r || !r.height){ mapFullFinish(f); return; }
  mapFullBox(f.el, r);
  mapFullTimer(f, ()=>mapFullFinish(f), MAPFULL_MS+30);
  mapFullResizeWatch(f, true);   // 縮小中の画面回転は戻り先が変わるので、動きを諦めて即座に片付ける
}
// 後始末の本体。ここを通るまで _mapFull は空にしない（空にすると即時解除が効かなくなる）
function mapFullFinish(f){
  if(_mapFull!==f) return;
  _mapFull=null;
  mapFullClear(f); mapFullResizeWatch(f, false);
  window.removeEventListener('keydown', f.esc);
  document.body.classList.remove('map-full-lock');
  try{ MAPFULL_PROPS.forEach(p=>{ f.el.style[p]=f.prev[p]||''; }); f.el.classList.remove('map-full'); }catch(e){}
  try{ if(f.ph.parentNode) f.ph.parentNode.removeChild(f.ph); }catch(e){}
  try{ f.m.invalidateSize({animate:false}); }catch(e){}
}
function mapFullResizeWatch(f, on){
  if(on){ if(f.onres) return;
    f.onres=()=>mapFullFinish(f);
    window.addEventListener('resize', f.onres); window.addEventListener('orientationchange', f.onres); return; }
  if(!f.onres) return;
  window.removeEventListener('resize', f.onres); window.removeEventListener('orientationchange', f.onres);
  f.onres=null;
}
// 指定した枠に position:fixed で重ねる（上下左右の距離で指定するので、iOSの画面高さの癖に左右されない）
function mapFullBox(el, r){
  el.style.position='fixed'; el.style.width='auto'; el.style.height='auto';
  el.style.marginTop='0'; el.style.marginRight='0'; el.style.marginBottom='0'; el.style.marginLeft='0';
  el.style.zIndex='1400';   // ヘッダー(500)より上・写真の拡大表示(1500)とお知らせ(2000)より下
  el.style.borderRadius='0'; el.style.border='none';
  el.style.top=r.top+'px'; el.style.left=r.left+'px';
  el.style.right=(window.innerWidth-r.right)+'px'; el.style.bottom=(window.innerHeight-r.bottom)+'px';
}
/* 北マーク（常に実際の北を指す・タップで北を上に戻す）＋ コンパス追従ボタン */
function addCompassControls(m){
  const C=L.Control.extend({ onAdd:function(){
    const box=L.DomUtil.create('div','');
    box.style.cssText='display:flex; flex-direction:column; gap:6px;';
    const nb=L.DomUtil.create('button','locate-btn',box);
    nb.type='button'; nb.title='北を上に戻す';
    nb.innerHTML='<span class="north-needle">▲<br>N</span>';
    const needle=nb.firstChild;
    const upd=()=>{ const b=(typeof m.getBearing==='function')?m.getBearing():0;
      needle.style.transform='rotate('+b+'deg)'; };   // 地図がb度回れば、北もb度回った先にある
    m.on('rotate', ()=>{ mapBearing=(typeof m.getBearing==='function')?m.getBearing():0; upd(); });
    upd();
    L.DomEvent.disableClickPropagation(nb);
    L.DomEvent.on(nb,'click',L.DomEvent.stop).on(nb,'click',()=>{ compassStop(); try{ m.setBearing(0); }catch(e){} mapBearing=0; upd(); });
    const cb=L.DomUtil.create('button','locate-btn',box);
    cb.type='button'; cb.title='自分の向きを上にする'; cb.textContent='🧭'; cb.id='compassBtn';
    if(_compassOn) cb.style.background='var(--accent)';
    L.DomEvent.disableClickPropagation(cb);
    L.DomEvent.on(cb,'click',L.DomEvent.stop).on(cb,'click',()=>compassToggle(cb));
    return box;
  }});
  new C({position:'topright'}).addTo(m);
}
function compassStop(){
  if(_compassHandler){ window.removeEventListener(_compassEvName, _compassHandler); _compassHandler=null; }
  _compassOn=false;
  const b=document.getElementById('compassBtn'); if(b){ b.style.background=''; b.disabled=false; }
}
// 方位（磁北から時計回りの度）を算出。iOSはwebkitCompassHeading、その他は3軸（alpha/beta/gamma）から算出。
// 水平に持ったときは「端末の上端が向く方向」、立てて持ったときは「画面の裏＝自分が見ている方向」を使う
//（どちらか一方だけだと、持ち方によって計算不能・大ズレになるため切り替える）
function headingFromOrientation(e){
  if(typeof e.webkitCompassHeading==='number' && isFinite(e.webkitCompassHeading)) return e.webkitCompassHeading;
  if(!(e.absolute===true || _compassEvName==='deviceorientationabsolute')) return null;
  const a=e.alpha, b=e.beta, g=e.gamma;
  if(!Number.isFinite(a)) return null;
  if(!Number.isFinite(b) || !Number.isFinite(g)) return (360-a)%360;   // 3軸が揃わない端末は簡易計算
  const d=Math.PI/180;
  const cA=Math.cos(a*d), sA=Math.sin(a*d), cB=Math.cos(b*d), sB=Math.sin(b*d), cG=Math.cos(g*d), sG=Math.sin(g*d);
  const Ey=-sA*cB, Ny=cA*cB;                       // 端末の上端（y軸）の東・北成分
  if(Math.hypot(Ey,Ny)>0.15) return (Math.atan2(Ey,Ny)/d+360)%360;
  const Ez=sG*cA + sB*cG*sA, Nz=sG*sA - sB*cG*cA;  // ほぼ立てて持っている場合: 画面の裏（-z軸）の向き
  return (Math.atan2(-Ez,-Nz)/d+360)%360;
}
function compassToggle(btn){
  if(_compassOn || _compassHandler){ compassStop(); toast('向き追従をやめました（地図の向きはそのまま）'); return; }
  const req=++_compassReq;   // この操作の世代番号（許可待ち中に画面が変わったら無効化される）
  const start=()=>{
    if(req!==_compassReq){ return; }   // 待っている間に地図が破棄された（別画面へ移動した）
    let last=null, got=false;
    _compassEvName=('ondeviceorientationabsolute' in window)?'deviceorientationabsolute':'deviceorientation';
    _compassHandler=(e)=>{
      const h=headingFromOrientation(e);
      if(h==null) return;
      if(!got){ got=true;   // 最初の有効な値を受け取ってから「動作中」の表示にする
        const bb=document.getElementById('compassBtn'); if(bb){ bb.style.background='var(--accent)'; bb.disabled=false; }
        toast('自分の向きが画面の上になります（🧭をもう一度押すと解除）');
      }
      if(last!=null && Math.abs(((h-last+540)%360)-180)<2) return;   // 2度未満の揺れは無視（チラつき防止）
      last=h;
      if(mapObj && typeof mapObj.setBearing==='function'){ try{ mapObj.setBearing(-h); }catch(err){} }
    };
    window.addEventListener(_compassEvName, _compassHandler);
    _compassOn=true;
    toast('方位を確認中…');
  };
  if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function'){
    // iPhone/iPadは初回にユーザー許可が必要（ボタン押下の流れの中でしか要求できない）。許可待ち中はボタンを無効化
    if(btn) btn.disabled=true;
    DeviceOrientationEvent.requestPermission(true).then(res=>{
      const bb=document.getElementById('compassBtn'); if(bb) bb.disabled=false;
      if(res==='granted') start(); else toast('方位センサーの利用が許可されませんでした');
    }).catch(()=>{ const bb=document.getElementById('compassBtn'); if(bb) bb.disabled=false; toast('方位センサーを利用できません'); });
  }else if(window.DeviceOrientationEvent){ start(); }
  else toast('この端末では方位センサーを利用できません');
}

/* 位置指定マップ共通: 地図中心の十字＋「この位置に印」ボタン。
   タップ指定だと指で目標地点が隠れるため、「地図を動かして十字を合わせ→ボタンで落とす」置き方を用意する。
   従来のタップ指定もそのまま使える（Leafletはドラッグ後にclickを発火しないため誤発火しない） */
// 中心十字の実体（細い黒線＋白フチのSVG。中心はわずかに空けて目標を隠さない）
const CROSS_SVG='<svg width="33" height="33" viewBox="0 0 33 33">'
  +'<g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M16.5 3v9.5M16.5 20.5V30M3 16.5h9.5M20.5 16.5H30"/></g>'
  +'<g fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"><path d="M16.5 3v9.5M16.5 20.5V30M3 16.5h9.5M20.5 16.5H30"/></g></svg>';
function makeCrossEl(m){
  const cross=L.DomUtil.create('div','map-cross', m.getContainer());
  cross.innerHTML=CROSS_SVG;
  m.once('unload', ()=>{ try{ cross.remove(); }catch(e){} });   // 十字はLeaflet管理外のため、地図破棄時に自分で片付ける
  return cross;
}
function addCrosshairControl(m, onDrop, label){
  makeCrossEl(m);
  const C=L.Control.extend({ onAdd:function(){
    const b=L.DomUtil.create('button','map-drop-btn');
    b.type='button'; b.textContent=label||'◎ 十字の位置に印';
    L.DomEvent.disableClickPropagation(b);
    L.DomEvent.on(b,'click',L.DomEvent.stop).on(b,'click',()=>{
      try{ m.stop(); }catch(e){}   // 慣性移動を止めてから中心を読む（動いている最中に押すと十字とズレた座標が入るため）
      const c=m.getCenter(); onDrop(c.lat,c.lng); });
    return b; }});
  new C({position:'bottomleft'}).addTo(m);
}

let obsTargetMarker=null;
function toggleObsTargetMap(){ const el=$('#otMap'); if(!el) return;
  if(el.style.display==='none'){
    const op=$('#obsPosMap');
    if(op && op.style.display!=='none'){ op.style.display='none'; obsPosMarker=null; }   // 観察位置側を閉じる（地図は同時に1枚）
    el.style.display='block'; initObsTargetMap();
  }
  else { el.style.display='none'; destroyMap(); obsTargetMarker=null; }
}
function initObsTargetMap(){
  const el=$('#otMap'); if(!el) return;
  destroyMap(); obsTargetMarker=null;
  let lat=parseFloat($('#otLat').value), lon=parseFloat($('#otLon').value);
  const ola=parseFloat($('#latIn').value), olo=parseFloat($('#lonIn').value);
  let center=[43.06,141.35], zoom=13;
  if(!isNaN(lat)&&!isNaN(lon)){ center=[lat,lon]; zoom=16; }
  else if(!isNaN(ola)&&!isNaN(olo)){ center=[ola,olo]; zoom=16; }
  else if(lastFix){ center=[lastFix.lat,lastFix.lon]; zoom=16; }
  mapObj=createBaseMap('otMap', center, zoom, {});
  // 観察者の位置を緑丸で薄く表示（対象位置の目安）
  if(!isNaN(ola)&&!isNaN(olo)) L.circleMarker([ola,olo],{radius:5,color:'#fff',weight:1,fillColor:'#3fb984',fillOpacity:.9}).addTo(mapObj).bindPopup('観察者の位置');
  if(!isNaN(lat)&&!isNaN(lon)) setObsTarget(lat,lon,true);   // 既存値の初期表示は変更扱いにしない
  mapObj.on('click', e=>setObsTarget(e.latlng.lat, e.latlng.lng));
  addCrosshairControl(mapObj, (la,lo)=>setObsTarget(la,lo));
}
function setObsTarget(lat,lon,silent){
  $('#otLat').value=lat.toFixed(6); $('#otLon').value=lon.toFixed(6);
  $('#otLabel').textContent=lat.toFixed(6)+', '+lon.toFixed(6);
  if(!silent) SCREENS._dirty=true;   // 地図タップ・GPS取得はinput監視に乗らないため明示（初期表示はsilent）
  const mapShown=$('#otMap') && $('#otMap').style.display!=='none';
  if(mapObj && mapShown){ if(obsTargetMarker){ try{ mapObj.removeLayer(obsTargetMarker); }catch(e){} }
    // 標準ピン画像はオフライン非同梱のため自作アイコン（divIcon）を使う
    const icon=L.divIcon({className:'',html:`<div style="background:#b03030;border:2px solid #fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5)">◆</div>`,iconSize:[24,24],iconAnchor:[12,12]});
    obsTargetMarker=L.marker([lat,lon],{icon}).addTo(mapObj); }
}
function obsTargetFromGps(){
  const fx=freshFix();
  if(fx){ setObsTarget(fx.lat,fx.lon); if(mapObj && $('#otMap').style.display!=='none') mapObj.setView([fx.lat,fx.lon],16); toast('現在地を対象位置にしました'); return; }
  if(!navigator.geolocation){ toast('位置情報を利用できません'); return; }
  const own=(SCREENS._obs&&SCREENS._obs.uuid); toast('位置を取得中…');
  navigator.geolocation.getCurrentPosition(p=>{ lastFix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};
    // 取得完了前に別の記録へ移っていたら書き込まない（非同期結果の混入防止）
    if(!$('#otLat') || (SCREENS._obs&&SCREENS._obs.uuid)!==own) return;
    setObsTarget(p.coords.latitude,p.coords.longitude); toast('現在地を対象位置にしました'); },
    e=>toast('位置を取得できませんでした'), {enableHighAccuracy:true,timeout:15000});
}
function clearObsTarget(){
  if($('#otLat').value || $('#otLon').value) SCREENS._dirty=true;   // 値が実際に消えるときだけ「未保存の変更」扱い
  $('#otLat').value=''; $('#otLon').value=''; $('#otLabel').textContent='未指定';
  if(mapObj&&obsTargetMarker){ try{ mapObj.removeLayer(obsTargetMarker); }catch(e){} obsTargetMarker=null; } }

/* ---------- 観察者の位置を地図タップで指定（開閉式） ----------
   対象位置マップと同じ型。地図インスタンスは mapObj 1本＝同時に開けるのは1枚のため、
   対象位置マップとは相互排他にする（片方を開くともう片方は閉じる） */
let obsPosMarker=null;
function toggleObsPosMap(){
  const el=$('#obsPosMap'); if(!el) return;
  if(el.style.display==='none'){
    const ot=$('#otMap');
    if(ot && ot.style.display!=='none'){ ot.style.display='none'; obsTargetMarker=null; }   // 対象位置側を閉じる
    el.style.display='block'; initObsPosMap();
  } else { el.style.display='none'; destroyMap(); obsPosMarker=null; }
}
function initObsPosMap(){
  const el=$('#obsPosMap'); if(!el) return;
  destroyMap(); obsPosMarker=null;
  // 初期表示も保存時と同じ validLatLon で判定する（parseFloatだけだと "43x" の部分読みや Infinity が通り、
  // 入力値と違う地点の表示や地図初期化エラーになり得るため）
  const laT=$('#latIn').value.trim(), loT=$('#lonIn').value.trim();
  const okPos=validLatLon(laT,loT);
  const la=okPos?parseFloat(laT):NaN, lo=okPos?parseFloat(loT):NaN;
  let center=[43.06,141.35], zoom=13;
  if(okPos){ center=[la,lo]; zoom=16; }
  else if(lastFix){ center=[lastFix.lat,lastFix.lon]; zoom=16; }
  mapObj=createBaseMap('obsPosMap', center, zoom, {});
  if(okPos) obsPosMarkerUpdate(la,lo);   // 既存値の初期表示
  mapObj.on('click', e=>setObsPos(e.latlng.lat, e.latlng.lng));
  addCrosshairControl(mapObj, (la2,lo2)=>setObsPos(la2,lo2));
}
// 観察者位置マーカー（緑丸）の再描画のみ。値は書き換えない（GPS取得時の精度を消さないため分離）
function obsPosMarkerUpdate(lat,lon){
  const shown=$('#obsPosMap') && $('#obsPosMap').style.display!=='none';
  if(!mapObj || !shown) return;
  if(obsPosMarker){ try{ mapObj.removeLayer(obsPosMarker); }catch(e){} }
  const icon=L.divIcon({className:'',html:`<div style="background:#3fb984;border:2px solid #fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5)">●</div>`,iconSize:[24,24],iconAnchor:[12,12]});
  obsPosMarker=L.marker([lat,lon],{icon}).addTo(mapObj);
}
function setObsPos(lat,lon){
  $('#latIn').value=lat.toFixed(6); $('#lonIn').value=lon.toFixed(6);
  SCREENS._acc='';                     // 地図タップにGPS精度は無い（手入力と同じ「不明」扱い）
  const pl=$('#posLabel'); if(pl) pl.textContent=lat.toFixed(6)+', '+lon.toFixed(6);
  SCREENS._dirty=true;                 // 地図タップはinput監視に乗らないため明示
  obsPosMarkerUpdate(lat,lon);
}
function saveObs(u, svUuid, editing, cont){
  const f=$('#obForm'); const g=n=>{const el=f.querySelector(`[name="${n}"]`); return el?el.value:'';};
  const name=$('#spInput').value.trim();
  const idStatus = segVal('identification_status') || (name?'確定':'未同定');
  const base = editing ? DB.observations().find(x=>x.uuid===u) : null;

  /* --- 保存を止める検査（現地でもすぐ直せる最小限だけ） --- */
  // 個体数: number入力は数値でない文字を入れると value が '' になり空欄と区別できないため validity.badInput で検知する
  const cntEl=f.querySelector('[name="count"]');
  if(cntEl && cntEl.validity && cntEl.validity.badInput){ toast('個体数は数値で入力してください'); return; }
  const rawCnt=g('count').trim();
  const count = rawCnt==='' ? 1 : Number(rawCnt);   // 空は1（入力欄の初期値と同じ。以前は黙って0になっていた）
  // 切り捨てる前の値で検査する（Math.trunc(-0.5)は-0になり負数検査をすり抜け、9999.9は確認を回避するため）
  if(!Number.isInteger(count) || count<0){ toast('個体数は0以上の整数で入力してください'); return; }
  if(count>9999 && !confirm(`個体数が${count}と非常に大きいですが、このまま保存しますか？`)) return;
  // 座標: 黙って捨てず、位置なしで保存してよいか確認する（キャンセルすれば戻って直せる）
  let lat=$('#latIn').value.trim(), lon=$('#lonIn').value.trim();
  if((lat||lon) && !validLatLon(lat,lon)){
    if(!confirm('位置の数値が正しくありません。位置なしで保存しますか？\n（キャンセルすると入力に戻ります）')) return;
    lat=''; lon='';
  }
  // 対象位置（止まり木・巣など）も同様
  let tlat=(($('#otLat')&&$('#otLat').value)||'').trim(), tlon=(($('#otLon')&&$('#otLon').value)||'').trim();
  if((tlat||tlon) && !validLatLon(tlat,tlon)){
    if(!confirm('対象位置（止まり木・巣）の数値が正しくありません。対象位置なしで保存しますか？')) return;
    tlat=''; tlon='';
  }

  const rec = Object.assign({}, base||{uuid:u}, {
    uuid:u, survey_uuid:svUuid,
    observed_at: g('observed_at')? new Date(g('observed_at')).toISOString() : nowISO(),
    latitude: lat, longitude: lon,
    // 精度: 座標なしなら必ず空 / _acc===null は「この画面で位置に触れていない」＝既存値を維持 / ''や数値はその値
    gps_accuracy: (!lat && !lon) ? '' : (SCREENS._acc===null ? ((base||{}).gps_accuracy||'') : SCREENS._acc),
    // 種名が空なら種IDも必ず空にする（入力経路によらず「名無しなのに前の鳥のID」を残さない保証）
    species_id: name ? ((speciesByName(name)||{}).species_id || SCREENS._chosenId || '') : '', species_name_snapshot: name,
    count: count, detection_method: segVal('detection_method'),
    behavior: otherMerge(segVals('behavior'),'behavior'), habitat: otherMerge(segVals('habitat'),'habitat'),
    age_class: segVal('age_class'), sex: segVal('sex'),
    distance_band: segVal('distance_band'), direction: segVal('direction'),
    target_latitude: tlat, target_longitude: tlon,
    perch_size: otherMerge(segVals('perch_size'),'perch_size'), perch_class: otherMerge(segVals('perch_class'),'perch_class'),
    nest_tree_species: g('nest_tree_species'), nest_tree_height: g('nest_tree_height'), nest_state: segVal('nest_state'),
    identification_status: name? idStatus : '未同定',
    confidence: segVal('confidence'), needs_review: $('#needsReview').checked,
    note: g('note'), external_photo_reference: g('external_photo_reference'),
    audio: SCREENS._audio||[], media: SCREENS._media||[],
  });

  /* --- 警告して通す検査（怪しい入力は「要確認」を自動で付けて、記録自体は残す。鳥は待ってくれない） --- */
  const reasons=[];
  if(!name) reasons.push('種名なし');
  else{
    if(!speciesByName(name)) reasons.push('種名がマスタにありません');
    if(rec.identification_status==='未同定' || rec.identification_status==='仮同定') reasons.push(rec.identification_status+'です');
  }
  // 日時の検査は変換前のローカル日時文字列（"YYYY-MM-DDTHH:mm"）で行う。
  // ISO化した後の先頭10文字で比べると、日本時間の夜の記録がUTCで前日にずれて誤判定するため
  const oa=g('observed_at');
  if(oa){
    if(oa > localDatetimeValue()) reasons.push('観察日時が未来です');
    else{
      const sv=DB.survey(svUuid);
      if(sv && sv.survey_date && DATE_ONLY_RE.test(sv.survey_date)){
        const d=(Date.parse(oa.slice(0,10))-Date.parse(sv.survey_date))/86400000;
        if(!(d===0 || d===1)) reasons.push('観察日時が調査日と合いません');   // 翌日は夜間調査（日付またぎ）として許容
      }
    }
  }
  if(count===0 && rec.detection_method!=='痕跡') reasons.push('個体数が0です');   // 痕跡（羽毛・糞）は0でもあり得る
  if(lat && lon && !inJapanBounds(lat,lon)) reasons.push('位置が日本の範囲外です');
  // 自動付与は新規作成時のみ。編集時はチェックボックスの状態＝利用者の判断をそのまま尊重する
  //（編集のたびに付け直すと「仮同定のまま様子見にしたいのに、開いて保存するたび要確認が復活して
  //   永遠に外せない」ループになる。編集時も理由の警告トーストは出すので、見落としにはならない）
  if(reasons.length && !rec.needs_review && !editing) rec.needs_review=true;

  if(!DB.upsertObs(rec)) return;   // 保存失敗(DB.saveが警告済み)。成功表示も画面遷移もしない
  if(name) DB.pushRecent(name);
  const keep={ lat:rec.latitude, lon:rec.longitude, acc:rec.gps_accuracy };   // 「続けて」用に、保存した位置と精度をそのまま引き継ぐ
  SCREENS._acc=null; SCREENS._chosenId=null; SCREENS._audio=null; SCREENS._media=null;
  SCREENS._dirty=false; SCREENS._ghost=null;   // 保存済みなので離脱ガード対象から外す
  if(reasons.length) toast((rec.needs_review?'保存しました ⚠ 要確認を付けました: ':'保存しました（⚠ ')+reasons.join('・')+(rec.needs_review?'':'）'), 4000);
  else toast('保存しました');
  if(cont){ goBack(); nav('obsEdit', JSON.stringify({sv:svUuid, keep})); } // 位置を引き継いで次の種へ
  else goBack();
}

// 図鑑の切り抜き画像を取り込む（ファイル名＝和名で種に紐付け・端末内のみ）
function importGuideImages(input){
  const files=Array.from(input.files||[]); input.value=''; if(!files.length) return;
  toast('図鑑画像を取り込み中…');
  const adds=[];
  const jobs=files.map(f=>{
    const name=(f.name||'').replace(/\.[^.]+$/,'').replace(/[\s_]*[（(]?\d+[）)]?\s*$/,'').trim();
    const kind=(f.type||'').startsWith('video')?'video':'photo';
    const ext=fileExt(f.name,f.type), mid=uuid();
    return PhotoDB.put({ id:mid, kind, mime:f.type||'', ext, size:f.size, name:f.name||'', obs_uuid:'', created_at:nowISO(), blob:f })
      .then(()=>{ adds.push({ id:uuid(), species_name:name, kind, ref_id:mid, ext, mime:f.type||'', size:f.size, source:'guide', created_at:nowISO() }); });
  });
  Promise.all(jobs).then(()=>{
    let l=myguideList().concat(adds);
    // 図鑑取り込みは種ごとに最新1枚だけ残す（再取り込みで更新）
    const seen={}; const keep=[];
    for(let i=l.length-1;i>=0;i--){ const g=l[i];
      if(g.source==='guide'){ if(seen[g.species_name]) continue; seen[g.species_name]=1; }
      keep.unshift(g);
    }
    myguideSave(keep); mediaGcAll(); scheduleFolderFull();
    const matched=adds.filter(a=>speciesByName(a.species_name)).length;
    toast(`図鑑画像 ${adds.length}枚を取り込みました（和名一致 ${matched}種）`); render();
  }).catch(()=>toast('取り込みに失敗しました'));
}
// 無圧縮(格納)ZIPを解く。ローカルファイルヘッダを順に読む（このアプリで配る図鑑ZIPは無圧縮・UTF-8名で作る）
function parseStoredZip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf); const dec=new TextDecoder('utf-8');
  const entries=[]; let i=0;
  while(i+30<=u8.length){
    if(dv.getUint32(i,true)!==0x04034b50) break;   // ローカルヘッダ以外（中央ディレクトリ等）に来たら終了
    const method=dv.getUint16(i+8,true);
    const compSize=dv.getUint32(i+18,true);
    const nameLen=dv.getUint16(i+26,true), extraLen=dv.getUint16(i+28,true);
    const name=dec.decode(u8.subarray(i+30, i+30+nameLen));
    const dataStart=i+30+nameLen+extraLen;
    if(method===0 && !name.endsWith('/')) entries.push({ name, data:u8.subarray(dataStart, dataStart+compSize) });
    i=dataStart+compSize;
  }
  return entries;
}
// 種図鑑ZIP（和名.png を多数まとめたもの）を1ファイルで一括取り込み。端末内のみ保存・公開URLには出さない
async function importGuideZip(input){
  const f=(input.files||[])[0]; input.value=''; if(!f) return;
  if(!/\.zip$/i.test(f.name||'')){ toast('ZIPファイルを選んでください'); return; }
  toast('図鑑ZIPを読み込み中…（初回は少し時間がかかります）');
  let buf; try{ buf=await f.arrayBuffer(); }catch(e){ toast('ファイルを読めませんでした'); return; }
  let entries=[]; try{ entries=parseStoredZip(buf); }catch(e){ entries=[]; }
  const imgs=entries.filter(e=>/\.(png|jpe?g|webp|gif)$/i.test(e.name));
  if(!imgs.length){ toast('ZIP内に画像が見つかりません（無圧縮ZIPをお使いください）'); return; }
  const adds=[]; let done=0;
  for(const e of imgs){
    const base=e.name.replace(/^.*\//,'');
    const name=base.replace(/\.[^.]+$/,'').replace(/[\s_]*[（(]?\d+[）)]?\s*$/,'').trim();
    const ext=((base.match(/\.([a-z0-9]+)$/i)||[])[1]||'png').toLowerCase();
    const mime=ext==='png'?'image/png':(/^jpe?g$/.test(ext)?'image/jpeg':(ext==='webp'?'image/webp':'image/'+ext));
    const blob=new Blob([e.data],{type:mime}); const mid=uuid();
    try{ await PhotoDB.put({ id:mid, kind:'photo', mime, ext, size:blob.size, name:base, obs_uuid:'', created_at:nowISO(), blob });
      adds.push({ id:uuid(), species_name:name, kind:'photo', ref_id:mid, ext, mime, size:blob.size, source:'guide', created_at:nowISO() });
    }catch(err){}
    if(++done%20===0) toast(`取り込み中… ${done}/${imgs.length}`);
  }
  // 種ごとに最新1枚だけ残す（再取り込みで更新）
  let l=myguideList().concat(adds); const seen={}; const keep=[];
  for(let i=l.length-1;i>=0;i--){ const g=l[i];
    if(g.source==='guide'){ if(seen[g.species_name]) continue; seen[g.species_name]=1; }
    keep.unshift(g); }
  myguideSave(keep); scheduleFolderFull();
  const matched=adds.filter(a=>speciesByName(a.species_name)).length;
  toast(`図鑑ZIP：${adds.length}種を取り込みました（和名一致 ${matched}種）`); render();
}

        <div class="two" style="margin-top:8px;">
          <input id="batchLat" inputmode="decimal" placeholder="緯度" value="${esc(lat)}" oninput="SCREENS._batchAcc=''">
          <input id="batchLon" inputmode="decimal" placeholder="経度" value="${esc(lon)}" oninput="SCREENS._batchAcc=''">
        </div>

      <label class="field"><span class="lab">確認方法（共通）</span>${seg('detection_method',OPT.detection,false,'目視')}</label>
      <label class="field"><span class="lab">生息環境（共通・任意・複数選択可）</span><div class="seg" data-seg="habitat">${OPT.habitat.map(x=>

      <button class="btn primary big" id="batchSaveBtn" onclick="batchSave('${svUuid}')" disabled>0種をまとめて保存</button>
    `,

function batchAdd(){
  const inp=$('#batchSp'), cnt=$('#batchCnt');
  const name=((inp&&inp.value)||'').trim(); if(!name){ toast('種名を入れてください'); return; }
  if(cnt && cnt.validity && cnt.validity.badInput){ toast('個体数は数値で入力してください'); return; }
  // 「||1」で補完すると 0 が黙って 1 に化けるため、空欄の補完と数値検査を分ける
  const rawB=(cnt&&cnt.value||'').trim();
  const count = rawB==='' ? 1 : Number(rawB);
  if(!Number.isInteger(count) || count<1){ toast('個体数は1以上の整数で入力してください'); return; }
  SCREENS._batchItems=SCREENS._batchItems||[]; SCREENS._batchItems.push({name, count});
  if(inp) inp.value=''; if(cnt) cnt.value='1'; renderBatchList(); if(inp) inp.focus();
}
function batchRemove(i){ (SCREENS._batchItems||[]).splice(i,1); renderBatchList(); }
function renderBatchList(){
  const box=$('#batchList'); if(!box) return; const items=SCREENS._batchItems||[];
  // マスタ外の種名は追加時点で⚠を見せる（保存後に気付くより、その場で打ち直せる方が早い。保存自体は止めない）
  box.innerHTML = items.length ? items.map((it,i)=>`<div class="card"><div class="row">
    <div class="grow"><b>${esc(it.name)}</b> <span class="muted small">${esc(it.count)}個体</span>

    <button type="button" class="btn ghost danger" style="width:auto; padding:4px 10px;" onclick="batchRemove(${i})">×</button></div></div>`).join('')
    : '<div class="empty small">まだ追加されていません。上で種名と個体数を入れて「＋ この種を追加」。</div>';

function batchGps(){
  if(!navigator.geolocation){ toast('位置情報を利用できません'); return; }
  toast('位置を取得中…');
  navigator.geolocation.getCurrentPosition(p=>{
    if($('#batchLat')) $('#batchLat').value=p.coords.latitude.toFixed(6);
    if($('#batchLon')) $('#batchLon').value=p.coords.longitude.toFixed(6);
    SCREENS._batchAcc=Math.round(p.coords.accuracy);
    lastFix={lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy, t:Date.now()};
    toast('位置を取得しました');
  }, ()=>toast('位置を取得できませんでした'), {enableHighAccuracy:true, timeout:15000});

function batchSave(svUuid){
  const items=SCREENS._batchItems||[]; if(!items.length) return;
  let lat=(($('#batchLat')&&$('#batchLat').value)||'').trim(), lon=(($('#batchLon')&&$('#batchLon').value)||'').trim();
  // 観察入力と同じ扱い: 黙って捨てず、位置なしで保存してよいか確認する
  if((lat||lon) && !validLatLon(lat,lon)){
    if(!confirm('位置の数値が正しくありません。全件を位置なしで保存しますか？\n（キャンセルすると入力に戻ります）')) return;
    lat=''; lon='';
  }
  const method=segVal('detection_method')||'目視'; const habitat=otherMerge(segVals('habitat'),'habitat'); const when=nowISO();
  // 配列を一度だけ更新して一括保存する（途中まで保存＝部分保存を避け、全件成功か中止かにする）
  const arr=DB.load(DB.key.ob);
  let flagged=0;
  items.forEach(it=>{ const sp=speciesByName(it.name);
    if(!sp) flagged++;
    arr.push({ uuid:uuid(), survey_uuid:svUuid, observed_at:when, latitude:lat, longitude:lon,
      gps_accuracy: (!lat && !lon) ? '' : (SCREENS._batchAcc||''), species_id: sp?sp.species_id:'', species_name_snapshot:it.name,
      count: it.count, detection_method:method, behavior:'', habitat:habitat,
      // マスタ外の種名だけ行単位で「要確認」を付ける（同定状態は変えない。珍鳥・亜種名は正しくてもマスタ外のため）
      identification_status:'確定', confidence:'中', needs_review:!sp, note:'', external_photo_reference:'', audio:[], media:[],
      created_at:when, updated_at:when });
  });
  if(!DB.save(DB.key.ob, arr)) return;   // 保存失敗なら成功表示も遷移もしない（DB.saveが警告済み）
  items.forEach(it=>DB.pushRecent(it.name));
  toast(`${items.length}種を保存しました`+(flagged?`（うち${flagged}件はマスタにない種名のため要確認を付けました）`:''), flagged?4000:1800);
  SCREENS._batchItems=null; SCREENS._batchAcc=null;
  SCREENS._dirty=false;   // 保存済み＝離脱確認の対象から外す
  goBack();
}
function deleteObs(u){ if(!confirm('この観察記録を削除しますか？')) return;
  if(!DB.softDelete(DB.key.ob,u)) return;   // 保存失敗（容量不足）はDB.saveが警告済み。成功表示も遷移もしない
  SCREENS._dirty=false; SCREENS._ghost=null;   // 削除確定後に離脱ガードが二重に確認しないように
  toast('削除しました'); goBack(); }

/* ---------- 録音 ---------- */
let REC = null; // 録音中コンテキスト { mr, stream, t0, chunks, timer, abort }
function recSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function pickRecMime(){
  const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac','audio/ogg'];
  for(const m of c){ try{ if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}
function mimeExt(m){ m=m||''; if(m.includes('webm'))return 'webm'; if(m.includes('mp4'))return 'm4a';
  if(m.includes('aac'))return 'aac'; if(m.includes('ogg'))return 'ogg'; return 'bin'; }
function fmtDur(s){ s=Math.max(0,Math.round(+s||0)); const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; }

let _recStarting=false;   // マイク許可待ち中の連打・並行開始を防ぐ（複数の録音が走ると停止できないものが残る）
async function recToggle(){
  if(REC){ recStop(); return; }
  if(_recStarting) return;
  if(!recSupported()){ toast('この端末では録音を利用できません（httpsで開いてください）'); return; }
  const targetAtCall=mediaTarget();   // 呼び出し時点の対象を固定（許可待ち中に画面が変わったら開始しない）
  const genAtCall=_navGen;            // 呼び出し時点の画面世代（_mediaCtxが残っていても画面が変わっていれば開始しない）
  _recStarting=true;
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ _recStarting=false; toast('マイクを使えません（許可を確認してください）'); return; }
  // 許可待ちの間に別の録音が始まった／画面が変わった／対象が変わった場合は開始しない
  //（停止ボタンの無い画面で録音が始まるのを防ぐ。プライバシー保護のため世代照合は必須）
  const now=mediaTarget();
  if(REC || genAtCall!==_navGen || now.kind!==targetAtCall.kind || now.uuid!==targetAtCall.uuid){
    stream.getTracks().forEach(t=>t.stop()); _recStarting=false; return; }
  const mime=pickRecMime();
  let mr;
  try{ mr=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); }
  catch(e){ stream.getTracks().forEach(t=>t.stop()); _recStarting=false; toast('録音を開始できませんでした'); return; }
  const ctx={ mr, stream, t0:Date.now(), chunks:[], timer:null, abort:false,
    target:targetAtCall };
  // 未保存の新規記録なら、保存完了を待たずこの時点で離脱ガード対象にする（写真の取り込みと同じ扱い）
  if((ctx.target.kind==='obs' && SCREENS._obsEditing===false && SCREENS._obs && SCREENS._obs.uuid===ctx.target.uuid) ||
     (ctx.target.kind==='flight' && SCREENS._flightEditing===false && SCREENS._flightSelf===ctx.target.uuid)){
    SCREENS._dirty=true;
    SCREENS._ghost={ key:(ctx.target.kind==='flight'?DB.key.fl:DB.key.ob), uuid:ctx.target.uuid };
  }
  mr.ondataavailable=e=>{ if(e.data && e.data.size) ctx.chunks.push(e.data); };
  mr.onstop=()=>{ clearInterval(ctx.timer); stream.getTracks().forEach(t=>t.stop());
    const wasAbort=ctx.abort; REC=null; renderRecPanel();
    const fin = wasAbort ? null : recFinalize(ctx.chunks, mr.mimeType||mime, ctx.t0, ctx.target);
    if(typeof quickRecEnded==='function') quickRecEnded(wasAbort, fin); };   // すぐ録音の後始末（通常録音では何もしない）
  REC=ctx; _recStarting=false;
  try{ mr.start(); }
  catch(e){ REC=null; stream.getTracks().forEach(t=>t.stop()); toast('録音を開始できませんでした'); return; }
  ctx.timer=setInterval(updateRecTimer,250); renderRecPanel();
}
function recStop(){ if(REC){ clearInterval(REC.timer); try{ REC.mr.stop(); }catch(e){} } }
function recAbort(){ if(REC){ REC.abort=true; clearInterval(REC.timer); try{ REC.mr.stop(); }catch(e){} } }
function updateRecTimer(){ const el=$('#recTime'); if(el && REC) el.textContent=fmtDur((Date.now()-REC.t0)/1000); }

function recFinalize(chunks, mime, t0, targetAtStart){
  const dur=Math.round((Date.now()-t0)/1000);
  const blob=new Blob(chunks,{type:mime}); if(!blob.size){ toast('録音が空でした'); return Promise.resolve(false); }
  const meta={ id:uuid(), dur, size:blob.size, mime, ext:mimeExt(mime), created_at:nowISO() };
  const target=targetAtStart||mediaTarget();   // 録音開始時点の対象（引数）を優先
  if(target.uuid && DISCARDED.has(target.uuid)){ return Promise.resolve(false); }   // 破棄済みの記録の分は保存しない
  const owner = target.kind==='flight' ? { flight_uuid:target.uuid, obs_uuid:'' } : { obs_uuid:target.uuid };
  // 成否をPromiseで返す（すぐ録音が「保存できてから」成功表示・一覧更新するため）
  return AudioDB.put(Object.assign({}, meta, { blob }, owner)).then(()=>{
    if(!attachMediaMeta(target,'audio',meta)){   // 紐付け失敗（容量不足等）を成功扱いにしない
      toast('録音の保存に失敗しました（空き容量を確認してください）'); return false; }
    scheduleFolderFull(); toast('録音を保存しました'); return true;
  }).catch(()=>{ toast('録音の保存に失敗しました'); return false; });
}
function delAudio(id){ const target=mediaTarget();
  AudioDB.del(id).catch(()=>{}).then(()=>{
    detachMediaMeta(target,'audio',id); scheduleFolderFull(); toast('録音を削除しました');
  });
}
// メディアの持ち主（観察 or 飛翔）。飛翔画面では SCREENS._mediaCtx を設定する
function mediaCtx(){ return SCREENS._mediaCtx || { kind:'obs', uuid:(SCREENS._obs&&SCREENS._obs.uuid)||'', sv:(SCREENS._obs&&SCREENS._obs.survey_uuid)||currentSurveyUuid }; }
function mediaTarget(){ const c=mediaCtx(); return { kind:c.kind, uuid:c.uuid, sv:c.sv||currentSurveyUuid }; }
// 対象レコード(target)へメディアmetaを追記。保存済みならDBへ直接反映し、
// 現在画面が同じ対象の時だけ編集中配列とパネルを更新する（別記録への誤添付・誤表示を防ぐ）
function attachMediaMeta(target, field, meta){
  if(target.uuid && DISCARDED.has(target.uuid)) return false;   // ユーザーが破棄した新規記録には、後から完了した保存分も付けない
  let ok=true;   // 記録への紐付け保存の成否を返す（失敗を成功表示すると、音声・写真が一覧から参照できなくなるため）
  if(target.uuid){ const recKey=target.kind==='flight'?DB.key.fl:DB.key.ob;
    const list=DB.load(recKey); const i=list.findIndex(x=>x.uuid===target.uuid);
    if(i>=0){ list[i][field]=(list[i][field]||[]).concat([meta]);
      ok = target.kind==='flight' ? DB.upsertFlight(list[i]) : DB.upsertObs(list[i]); }
    else{
      // まだ保存されていない新規記録。参照を失わないよう、この場で仮保存する（後で本保存が上書き）
      const sv=target.sv||currentSurveyUuid;
      if(target.kind==='flight') ok=DB.upsertFlight({ uuid:target.uuid, survey_uuid:sv, path:[], species_name_snapshot:'',
        start_time:'', end_time:'', height_class:'不明', age_class:'不明', individual_label:'', behavior:'', count:1, memo:'', needs_review:false, audio:[], media:[], [field]:[meta] });
      else ok=DB.upsertObs({ uuid:target.uuid, survey_uuid:sv, observed_at:nowISO(), latitude:'', longitude:'',
        species_id:'', species_name_snapshot:'', count:1, detection_method:'', behavior:'', habitat:'',
        identification_status:'未同定', confidence:'中', needs_review:false, note:'', external_photo_reference:'', audio:[], media:[], [field]:[meta] });
    } }
  // 複数羽トレースの退避済みトラックに遅れてメディアが完成した場合、トラック側にも反映する
  //（反映しないと一括保存が空のメディア配列で仮レコードを上書きし、参照を失う）
  if(ok && target.kind==='flight' && SCREENS._ftracks){
    const ftr=SCREENS._ftracks.find(t=>t&&t.uuid===target.uuid);
    if(ftr && ftr.fields) ftr.fields[field]=(ftr.fields[field]||[]).concat([meta]);
  }
  const cur=mediaCtx();
  if(ok && cur.kind===target.kind && cur.uuid===target.uuid){
    // 「未保存の新規記録」への追加だけを離脱ガード対象にする（既存記録へのメディアは即DB保存済み＝離脱しても消えないため）
    const isNew = target.kind==='flight' ? (SCREENS._flightEditing===false && SCREENS._flightSelf===target.uuid)
                                         : (SCREENS._obsEditing===false && SCREENS._obs && SCREENS._obs.uuid===target.uuid);
    if(isNew){ SCREENS._dirty=true;
      SCREENS._ghost={ key:(target.kind==='flight'?DB.key.fl:DB.key.ob), uuid:target.uuid }; }
    if(field==='audio'){ SCREENS._audio=(SCREENS._audio||[]).concat([meta]); renderRecPanel(); }
    else { SCREENS._media=(SCREENS._media||[]).concat([meta]); renderMediaPanel(); } }
  return ok;
}
function detachMediaMeta(target, field, id){
  if(target.uuid){ const recKey=target.kind==='flight'?DB.key.fl:DB.key.ob;
    const list=DB.load(recKey); const i=list.findIndex(x=>x.uuid===target.uuid);
    if(i>=0){ list[i][field]=(list[i][field]||[]).filter(x=>x.id!==id);
      if(target.kind==='flight') DB.upsertFlight(list[i]); else DB.upsertObs(list[i]); } }
  const cur=mediaCtx();
  if(cur.kind===target.kind && cur.uuid===target.uuid){
    if(field==='audio'){ SCREENS._audio=(SCREENS._audio||[]).filter(x=>x.id!==id); renderRecPanel(); }
    else { SCREENS._media=(SCREENS._media||[]).filter(x=>x.id!==id); renderMediaPanel(); } }
}
// パネル再構築や画面遷移の前に、割り当て済みのObject URLをまとめて解放する（メモリリーク防止）
function revokePanelUrls(root, selector){ if(!root) return;
  root.querySelectorAll(selector).forEach(el=>{ if(el._url){ try{ URL.revokeObjectURL(el._url); }catch(e){} el._url=null; } }); }
function renderRecPanel(){
  const box=$('#recPanel'); if(!box) return;
  revokePanelUrls(box, 'audio');   // 再構築前に古いObject URLを解放（リーク防止）
  if(!recSupported()){ box.innerHTML='<div class="note">この端末・接続では録音を利用できません（httpsまたはホーム画面から起動すると使えます）。</div>'; return; }
  const list=SCREENS._audio||[]; const active=!!REC;
  box.innerHTML=`
    <button type="button" class="btn ${active?'danger':''}" onclick="recToggle()">
      ${active?'<span class="recdot"></span>録音を停止 <span id="recTime">0:00</span>':'🎤 録音する'}</button>
    ${list.length?`<div class="reclist">${list.map((a,i)=>`
      <div class="recitem" data-id="${a.id}">
        <div class="row"><span class="small muted grow">録音${i+1} ・ ${fmtDur(a.dur)} ・ ${Math.max(1,Math.round(a.size/1024))}KB</span>
          <button type="button" class="btn danger" style="width:auto; padding:6px 12px;" onclick="delAudio('${a.id}')">削除</button></div>
        <audio controls preload="none" class="recaudio"></audio>
      </div>`).join('')}</div>`:''}`;
  // 各プレーヤーにIndexedDBの音声を割り当て（取得完了までに再描画・画面遷移していたら割り当てない）
  const gen=++_recGen;
  list.forEach(a=>{ AudioDB.get(a.id).then(r=>{ if(!r||!r.blob) return;
    if(gen!==_recGen) return;
    const el=box.querySelector(`.recitem[data-id="${a.id}"] audio`); if(!el||!el.isConnected) return;
    if(el._url) URL.revokeObjectURL(el._url);
    el._url=URL.createObjectURL(r.blob); el.src=el._url;
  }).catch(()=>{}); });
}

/* ---------- 写真・動画（カメラ／ライブラリ） ---------- */
function fileExt(name, mime){
  const m=String(name||'').match(/\.([a-z0-9]{1,5})$/i); if(m) return m[1].toLowerCase();
  mime=mime||''; const map={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic',
    'image/heif':'heif','image/gif':'gif','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm','video/3gpp':'3gp'};
  return map[mime] || (mime.startsWith('video')?'mp4':'jpg');
}
function pickMedia(input){
  const files=Array.from(input.files||[]); input.value='';
  if(!files.length) return;
  const target=mediaTarget();   // 取り込み開始時点の対象を固定
  // 未保存の新規記録なら、保存完了を待たずこの時点でガード対象にする（完了前に離脱してもすり抜けない）
  if((target.kind==='obs' && SCREENS._obsEditing===false && SCREENS._obs && SCREENS._obs.uuid===target.uuid) ||
     (target.kind==='flight' && SCREENS._flightEditing===false && SCREENS._flightSelf===target.uuid)){
    SCREENS._dirty=true;
    SCREENS._ghost={ key:(target.kind==='flight'?DB.key.fl:DB.key.ob), uuid:target.uuid };
  }
  const owner = target.kind==='flight' ? { flight_uuid:target.uuid, obs_uuid:'' } : { obs_uuid:target.uuid };
  toast('取り込み中…');
  let ok=0, fail=0;
  const jobs=files.map(f=>{
    const kind=(f.type||'').startsWith('video')?'video':'photo';
    const meta={ id:uuid(), kind, mime:f.type||'', ext:fileExt(f.name,f.type), size:f.size, name:f.name||'', created_at:nowISO() };
    // 1件ずつ、成功したものだけ確実に反映（1件失敗しても成功分は残る）
    return PhotoDB.put(Object.assign({}, meta, { blob:f }, owner))
      .then(()=>{ if(attachMediaMeta(target,'media',meta)) ok++; else fail++; })   // 紐付け失敗も失敗として数える
      .catch(()=>{ fail++; });
  });
  Promise.all(jobs).then(()=>{
    if(DISCARDED.has(target.uuid)){ mediaGcAll().catch(()=>{}); return; }   // 取り込み中に破棄された→結果は捨てて実体も掃除
    scheduleFolderFull();
    if(fail) toast(`写真・動画：${ok}件追加・${fail}件失敗`); else toast('写真・動画を追加しました'); });
}
function delMedia(id){ const target=mediaTarget();
  PhotoDB.del(id).catch(()=>{}).then(()=>{
    detachMediaMeta(target,'media',id); scheduleFolderFull(); toast('削除しました');
  });
}
function renderMediaPanel(){
  const box=$('#mediaPanel'); if(!box) return;
  revokePanelUrls(box, '.mediael');   // 再構築前に古いObject URLを解放（リーク防止）
  const list=SCREENS._media||[];
  // ラベル直結＋capture属性で、端末のカメラを確実に起動（撮影と選択を分離）
  const HID='position:absolute; width:1px; height:1px; opacity:0; overflow:hidden;';
  box.innerHTML=`
    <input type="file" id="mediaCamPhoto" accept="image/*" capture="environment" style="${HID}" onchange="pickMedia(this)">
    <input type="file" id="mediaCamVideo" accept="video/*" capture="environment" style="${HID}" onchange="pickMedia(this)">
    <input type="file" id="mediaLib" accept="image/*,video/*" multiple style="${HID}" onchange="pickMedia(this)">
    <div class="btn-grid">
      <label class="btn" for="mediaCamPhoto">📷 写真を撮る</label>
      <label class="btn" for="mediaCamVideo">🎬 動画を撮る</label>
    </div>
    <div class="sp"></div>
    <label class="btn" for="mediaLib">🖼 ライブラリから選ぶ</label>
    ${list.length?`<div class="mediagrid">${list.map(m=>`
      <div class="mediaitem" data-id="${m.id}">
        <div class="mediathumb">${m.kind==='video'
          ? '<video class="mediael" controls preload="metadata"></video>'
          : '<img class="mediael" alt="写真">'}</div>
        <button type="button" class="mediadel" onclick="delMedia('${m.id}')">×</button>
        <div class="tiny muted mediacap">${m.kind==='video'?'🎬 動画':'📷 写真'} ・ ${Math.max(1,Math.round(m.size/1024))}KB</div>
      </div>`).join('')}</div>`:''}`;
  const gen=++_mediaGen;
  list.forEach(m=>{ PhotoDB.get(m.id).then(r=>{ if(!r||!r.blob) return;
    if(gen!==_mediaGen) return;
    const el=box.querySelector(`.mediaitem[data-id="${m.id}"] .mediael`); if(!el||!el.isConnected) return;
    if(el._url) URL.revokeObjectURL(el._url); el._url=URL.createObjectURL(r.blob); el.src=el._url;
  }).catch(()=>{}); });
}

/* ============================================================
   調査ルート（ラインセンサスの経路）：描く／歩いて自動記録
   ============================================================ */
let routePath=[], routeLayer=null, routeMode='draw', routeLine=null, routeEndMarker=null, _walkStarting=false;
// 歩行記録セッション。画面をまたいで継続し、停止は「⏹記録停止／ルート保存／調査終了」だけ
let WALK=null;   // { sv, watchId, wakeLock, lastSave, saveFailed }
// 歩行中の下書き保存（調査ごとの独立キー・localStorage直書き＝自動同期を発火させず電池・通信を守る）。
// 電池切れ・アプリ落ちからの復元用。baseFp＝歩行開始時点の正規ルートの指紋（同期で届いた別ルートを誤って潰さないため）
function routeDraftKey(sv){ return 'bs_route_draft_'+sv; }
// 変更検知用の軽量指紋（点数＋末尾点）。点数だけだと「1つ戻す→新しい点」で同数のまま内容が変わるのを見逃す
function routeTailFp(){ return routePath.length+':'+(routePath.length?String(routePath[routePath.length-1]):''); }
function routeDraftSave(){
  if(!WALK || WALK.saveFailed) return false;
  try{ localStorage.setItem(routeDraftKey(WALK.sv), JSON.stringify({ sv:WALK.sv, route:routePath, baseFp:WALK.baseFp, t:Date.now() }));
    WALK.lastSave=Date.now(); WALK.savedFp=routeTailFp(); return true; }
  catch(e){ WALK.saveFailed=true;
    try{ toast('空き容量不足でルートの自動保存ができません（停止時の保存は試みます）', 4000); }catch(_){} return false; }
}
function routeDraftLoad(sv){ try{ const d=JSON.parse(localStorage.getItem(routeDraftKey(sv))||'null');
  if(d && d.sv===sv && Array.isArray(d.route)) return d; }catch(e){} return null; }
function routeDraftClear(sv){ try{ localStorage.removeItem(routeDraftKey(sv)); }catch(e){} }
// 下書きの復元判定。正規ルートが下書き作成時から変わっていなければ「点数が多い方」を自動採用。
// 変わっている（同期で別端末のルートが届いた等）ときは無断で潰さず、ユーザーに選ばせる
function maybeRestoreDraft(sv){
  SCREENS._draftChecked=sv;   // 同じ画面滞在中に二重で確認しない（画面表示時と歩行開始時の二重ダイアログ防止）
  const d=routeDraftLoad(sv); if(!d) return;
  const pts=(d.route||[]).filter(validPathPt);
  const s=DB.survey(sv); const curFp=JSON.stringify((s&&s.route)||[]);

// 中断（カメラ・動画撮影・別アプリ・画面ロック等で位置が途絶えていた時間）を、位置の再取得を確認した時点で知らせる。

function walkGapNotify(ms){

  WALK.warnUntil=Date.now()+8000;
  renderWalkPill();
  setTimeout(()=>{ if(WALK && (!WALK.warnUntil || Date.now()>=WALK.warnUntil)) renderWalkPill(); }, 8200);
  toast(`⚠ 位置の記録が${dur}中断していました（カメラ・別アプリ等）。いま再開しました。中断区間の軌跡は直線になります`, 5000);

function walkWakeLock(){
  if(!WALK || !('wakeLock' in navigator)) return;
  const walk=WALK;
  const req=++walk.wlReq;
  if(walk.wakeLock){ try{ const r=walk.wakeLock.release(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} walk.wakeLock=null; }
  navigator.wakeLock.request('screen').then(w=>{
    if(WALK===walk && walk.wlReq===req){
      if(walk.wakeLock){ try{ const r=walk.wakeLock.release(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }

// 画面復帰時: 歩行記録中ならWakeLockを取り直す（バックグラウンドでOSが解放するため）。

  if(WALK.hiddenAt){ WALK.hiddenAt=null;
    if(WALK.hadFix && Date.now()-WALK.lastFixAt>=3000 && !WALK.resumeWait){ WALK.resumeWait=true; renderWalkPill(); } }
});

const _routeBadge=(txt,bg)=>L.divIcon({className:'',html:`<div style="background:${bg};border:2px solid #fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5)">${txt}</div>`,iconSize:[20,20],iconAnchor:[10,10]});
function routeInfo(){ const info=$('#rInfo'); if(info){ const d=pathLength(routePath);

function redrawRoute(){

    if(routePath.length>1) routeEndMarker=L.marker(routePath[routePath.length-1],{icon:_routeBadge('終','#d05555')}).addTo(routeLayer);

// 歩いて記録の1点追加を軽量に反映（全再描画=O(n^2)を避ける）
function routeAppend(pt){
  routePath.push(pt);
  if(!mapObj || !routeLayer){ routeInfo(); return; }
  if(routePath.length===1){ L.marker(pt,{icon:_routeBadge('始','#3fb984')}).addTo(routeLayer); }
  else {
    if(routeLine) routeLine.addLatLng(pt);
    else routeLine=L.polyline(routePath,{color:'#2f6fd0',weight:4,opacity:.9}).addTo(routeLayer);
    if(routeEndMarker) routeEndMarker.setLatLng(pt);
    else routeEndMarker=L.marker(pt,{icon:_routeBadge('終','#d05555')}).addTo(routeLayer);
  }

// 監視だけを強制停止する（保存はしない）。削除確定後など「続けても意味がない」場合の最終手段
function forceStopWalk(){

  if(walk.timer){ clearInterval(walk.timer); }

// 停止＝「保存に成功してから監視を止める」。保存できないときは記録を続けたまま false を返す（データを失わない）
function stopWalk(silent){
  if(!WALK){ if(!silent) renderRouteCtrls(); return true; }
  const walk=WALK;
  if(routePath.length>=2){
    const s=DB.survey(walk.sv);
    if(s){
      const nowFp=JSON.stringify(s.route||[]);
      if(nowFp!==walk.baseFp &&
         !confirm('歩行中に、別の端末からこの調査のルート変更が届いています。今歩いた記録で置き換えますか？\n（キャンセル＝届いた内容を残す。歩いた分は下書きとして保持されます）')){
        // 置き換えない: 停止前に最新の歩行分を下書きへ確定し、routePathは届いた正規ルートに合わせる
        //（この後saveRouteが呼ばれても、届いたルートを上書きしない）。下書きに残せないなら停止しない（表示との食い違い防止）
        if(!routeDraftSave()){ toast('歩いた分を下書きに残せないため停止を中止しました（空き容量を確保してください）', 4000); return false; }
        routePath=(s.route||[]).filter(validPathPt);
        if(routeLayer) redrawRoute();
      } else {
        s.route=routePath.slice(); s.route_length_m=Math.round(pathLength(routePath));
        if(!DB.upsertSurvey(s)){
          toast('保存できないため記録を続けています。空き容量を確保してからもう一度停止してください', 4000);
          return false;   // WALKを維持＝watchもWakeLockも生きたまま。下書きも残る
        }
        routeDraftClear(walk.sv);
      }
    } else {
      // 調査が見つからない（削除済み等）→ 本保存はできないが、停止前に最新分を下書きへ確定して残す。
      // 下書きにも残せないなら停止しない（「保持されます」の表示と食い違わないように）
      if(!routeDraftSave()){ toast('歩いた分を下書きに残せないため停止を中止しました（空き容量を確保してください）', 4000); return false; }
    }

  if(walk.watchId!=null && navigator.geolocation){ try{ navigator.geolocation.clearWatch(walk.watchId); }catch(e){} }
  if(walk.timer){ clearInterval(walk.timer); }
  if(walk.wakeLock){ try{ const r=walk.wakeLock.release(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }

/* ---------- 複数羽同時トレース（トラック切り替え） ----------
   1トラック＝保存時に1つの飛翔経路レコード。切り替えは「フォーム値＋経路を退避 → 再描画」で行い、
   描画・十字・undo など既存部品をそのまま使う。既存レコードの編集では使わない（単線のまま） */
function stashFlightTrack(){
  const tr=(SCREENS._ftracks||[])[SCREENS._ftIdx]; if(!tr) return;
  const g=n=>{ const el=$(`#flForm [name="${n}"]`); return el?el.value:''; };
  const name=(($('#spInput')&&$('#spInput').value)||'').trim();
  const behSet=[...document.querySelectorAll('#flForm [data-seg="behavior"] button.on')].map(b=>b.textContent);
  tr.path=flightPath.slice();
  tr.fields={
    species_id: name ? (SCREENS._chosenId||'') : '', species_name_snapshot: name,
    age_class: segVal('age_class'), individual_label:(g('individual_label')||'').trim(),
    start_time: g('start_time')||'', end_time: g('end_time')||'',
    height_class: segVal('height_class'),
    behavior: otherMerge(behSet.join('・'),'behavior'),
    count: g('count')||'', memo:(g('memo')||'').trim(),
    needs_review: $('#flReview')?$('#flReview').checked:false,
    audio:(SCREENS._audio||[]).slice(), media:(SCREENS._media||[]).slice(),
  };
}
function switchFlightTrack(i){
  if(!SCREENS._ftracks || i===SCREENS._ftIdx || !SCREENS._ftracks[i]) return;
  // 録音中（マイク許可待ち含む）の切り替えは再描画で録音が無警告に消えるため止める
  if(recBusy()){ toast('録音中はタブを切り替えられません。先に録音を停止してください'); return; }
  stashFlightTrack();
  if(SCREENS._dirty) SCREENS._ftDirty=true;   // render()が_dirtyを消すため、未保存の事実をここで覚える
  SCREENS._ftIdx=i; SCREENS._ftKeep=true; render();
}
function addFlightTrack(){
  if(!SCREENS._ftracks) return;
  // 録音・写真が絡む状態で複数トレースへ入ると、メディアの持ち主（仮レコード・ghost）と
  // トラック状態が競合する。構造的に避けるため、この場合は1羽ずつの保存へ誘導する
  if(recBusy()){ toast('録音中は個体を追加できません。先に録音を停止してください'); return; }
  if((SCREENS._audio&&SCREENS._audio.length)||(SCREENS._media&&SCREENS._media.length)||SCREENS._ghost){
    toast('録音・写真を付けた経路は複数同時トレースにできません。先にこの経路を保存してから、次の個体を記録してください', 4500); return; }
  stashFlightTrack();
  if(SCREENS._dirty) SCREENS._ftDirty=true;
  const prev=(SCREENS._ftracks[SCREENS._ftIdx]||{}).fields||{};
  const st=prev.start_time||localDatetimeValue();   // 同時観察なので開始時刻は揃える
  SCREENS._ftracks.push({ uuid:uuid(), path:[], st0:st, fields:{
    species_id:'', species_name_snapshot:'', age_class:'不明', individual_label:'',
    start_time: st, end_time:'',
    height_class:'不明', behavior:'', count:1, memo:'', needs_review:false, audio:[], media:[] } });
  SCREENS._ftIdx=SCREENS._ftracks.length-1; SCREENS._ftKeep=true; render();
}
// 複数トラックの一括保存。1件でも失敗したらそこで止める（保存済み件数は知らせる）
function saveFlightMulti(svUuid){
  stashFlightTrack();
  const tracks=SCREENS._ftracks||[];
  const act=[];
  for(let i=0;i<tracks.length;i++){ const tr=tracks[i]; const fl=tr.fields||{};
    const pts=(tr.path||[]).filter(validPathPt);
    // 「空」＝すべての入力が初期値のまま。1項目でも入力があれば空扱いにしない（黙って捨てない）
    const untouched = !pts.length && !(fl.species_name_snapshot||'').trim() && !(fl.memo||'').trim()
      && !(fl.individual_label||'').trim() && !(fl.end_time||'') && !(fl.behavior||'')
      && !fl.needs_review && (!fl.age_class||fl.age_class==='不明') && (!fl.height_class||fl.height_class==='不明')
      && (String(fl.count==null?'':fl.count).trim()===''||String(fl.count)==='1')
      && String(fl.start_time||'')===String(tr.st0||'')   // 開始時刻を初期値から変えたら「操作あり」
      && !((fl.audio&&fl.audio.length)||(fl.media&&fl.media.length));
    if(untouched) continue;   // 完全に手つかずのトラックだけ除外
    const label=(fl.species_name_snapshot||'').trim()||('個体'+(i+1));
    if(pts.length<2){ toast(`${i+1}番目のトラック（${label}）の経路が2点未満です。地図で描くか、タブを切り替えて内容を消してください`, 4500); return; }
    if(String(fl.count).trim()!==''){ const n=Number(fl.count);
      if(!Number.isInteger(n) || n<0){ toast(`${i+1}番目のトラック（${label}）の個体数は0以上の整数で入力してください`); return; } }
    act.push({i,tr});
  }
  if(!act.length){ toast('地図で2点以上の経路を描いてから保存してください'); return; }
  // 同じ種名でラベルが全て空のトラック群には 個体A/B/… を自動付与（色分け「個体」で区別できるように）。
  // 元データ（tr.fields）は書き換えず保存レコードにだけ載せる（途中失敗→再試行でラベルが片寄るのを防ぐ）
  const byName={};
  act.forEach(a=>{ const n=(a.tr.fields.species_name_snapshot||'').trim();
    (byName[n]=byName[n]||[]).push(a); });
  Object.keys(byName).forEach(n=>{ const g=byName[n];
    if(n && g.length>1 && g.every(a=>!(a.tr.fields.individual_label||'').trim()))
      g.forEach((a,j)=>{ a.autoLabel = j<26 ? '個体'+String.fromCharCode(65+j) : '個体'+(j+1); }); });
  let ok=0;
  for(const a of act){ const fl=a.tr.fields;
    const name=(fl.species_name_snapshot||'').trim();
    const rec={ uuid:a.tr.uuid, survey_uuid:svUuid,
      species_id: name?(fl.species_id||''):'', species_name_snapshot:name,
      path:(a.tr.path||[]).slice(),
      start_time:fl.start_time||'', end_time:fl.end_time||'',
      height_class:fl.height_class||'不明', age_class:fl.age_class||'不明',
      individual_label:(fl.individual_label||'').trim()||a.autoLabel||'', behavior:fl.behavior||'',
      count:fl.count||'', memo:(fl.memo||'').trim(), needs_review:!!fl.needs_review,
      audio:fl.audio||[], media:fl.media||[] };
    if(!DB.upsertFlight(rec)){ toast(`保存に失敗しました（${ok}件は保存済み）。空き容量を確保してからもう一度保存してください`, 4500); return; }
    ok++;
    // 保存できたトラックを記録（後で破棄しても保存済みレコードを破棄済み名簿に入れないため）
    (SCREENS._ftSaved=SCREENS._ftSaved||new Set()).add(a.tr.uuid);
    if(name) DB.pushRecent(name);
  }
  SCREENS._audio=null; SCREENS._media=null; SCREENS._mediaCtx=null;
  SCREENS._ftracks=null; SCREENS._ftDirty=false; SCREENS._ftSaved=null; SCREENS._dirty=false;
  toast(`${ok}本の飛翔経路を保存しました`);
  goBack();
}
// 折れ線を滑らかな曲線に（Chaikin法。始点・終点は保持。生データは変えず表示・書き出しにだけ使う）
function smoothPath(pts, iterations){
  pts=(pts||[]).filter(p=>Array.isArray(p)&&p.length===2);
  if(pts.length<3) return pts.slice();
  let cur=pts.slice();
  const n=(iterations==null)?2:iterations;
  for(let it=0; it<n; it++){
    const next=[cur[0]];
    for(let i=0;i<cur.length-1;i++){
      const a=cur[i], b=cur[i+1];
      next.push([a[0]*0.75+b[0]*0.25, a[1]*0.75+b[1]*0.25]);
      next.push([a[0]*0.25+b[0]*0.75, a[1]*0.25+b[1]*0.75]);
    }
    next.push(cur[cur.length-1]);
    cur=next;
  }
  return cur;
}
// 緯度経度が有効な数値か（不正な文字列でLeafletが例外を投げ地図全体が壊れるのを防ぐ）
// parseFloat('35abc')=35 のような部分一致は弾く（純粋な数値表記のみ許可）＋範囲チェック
const _numRe=/^[+-]?\d+(\.\d+)?$/;
function validLatLon(lat,lon){ const sa=String(lat).trim(), sb=String(lon).trim();
  if(!_numRe.test(sa)||!_numRe.test(sb)) return false;
  const a=parseFloat(sa), b=parseFloat(sb);
  return a>=-90&&a<=90&&b>=-180&&b<=180; }
// 日本のおおよその範囲（緯度20〜46・経度122〜154）。国内調査前提の常識チェック用
//（緯度と経度の取り違え・貼り付けミスの検出が目的。保存は止めず「要確認」を付けるだけ）
function inJapanBounds(lat,lon){ const a=parseFloat(lat), b=parseFloat(lon);
  return a>=20&&a<=46&&b>=122&&b<=154; }
function validPathPt(p){ if(!Array.isArray(p)||p.length!==2) return false;
  const a=+p[0], b=+p[1];
  return Number.isFinite(a)&&Number.isFinite(b)&&a>=-90&&a<=90&&b>=-180&&b<=180; }
// 2点間の距離（m）。地図が無くても使える（集計・書き出し用）
function distMeters(a,b){
  const R=6371000, toR=Math.PI/180;
  const dLat=(b[0]-a[0])*toR, dLon=(b[1]-a[1])*toR;
  const s=Math.sin(dLat/2)**2 + Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function pathLength(path){ let d=0; const p=(path||[]).filter(x=>Array.isArray(x)&&x.length===2);
  for(let i=1;i<p.length;i++) d+=distMeters(p[i-1],p[i]); return d; }
function fmtDist(d){ return d>=1000?(d/1000).toFixed(2)+'km':Math.round(d)+'m'; }
// 飛翔経路の色分け（種／齢／個体）。値ごとに安定した色を割り当てる
const FLIGHT_PALETTE=['#e0a030','#3fb984','#5a7de0','#d05555','#9b59b6','#16a3a3','#e07b39','#7a8b3f','#c94f7c','#4a6fa5'];
function flightColorMode(){ const m=localStorage.getItem('bs_flightcolor'); return (m==='齢'||m==='個体')?m:'種'; }
function flightColorKey(f,mode){ mode=mode||flightColorMode();
  if(mode==='齢') return f.age_class||'不明';
  if(mode==='個体') return f.individual_label||'（未設定）';
  return f.species_name_snapshot||'（未同定）'; }
// 値ごとに色番号を初回登場順で固定して保存する。あとから別の値が増えても既存の色がずれない。
function flightColorMap(){ try{ return JSON.parse(localStorage.getItem('bs_flightcoloridx')||'{}'); }catch(e){ return {}; } }
function flightColorIndex(mode, value){
  const all=flightColorMap(); const m=all[mode]||(all[mode]={});
  if(m[value]==null){ const used=Object.values(m); m[value]=used.length?Math.max.apply(null,used)+1:0;
    try{ localStorage.setItem('bs_flightcoloridx', JSON.stringify(all)); }catch(e){} }
  return m[value];
}
/* 飛翔経路の点の打ち方: タップ追加（速い）⇔ 十字追加（指で目標が隠れず精密）の切り替え。

      const h=$('#fHelpHow'); if(h) h.innerHTML=flightCrossMode

        :'地図を<b>タップ</b>すると、';
      const info=$('#fInfo'); if(info && !flightPath.length) redrawFlight(); };
    L.DomEvent.disableClickPropagation(box);
    L.DomEvent.on(tg,'click',L.DomEvent.stop).on(tg,'click',()=>{
      flightCrossMode=!flightCrossMode;
      try{ localStorage.setItem('bs_flight_cross', flightCrossMode?'1':'0'); }catch(e){}
      sync();
      toast(flightCrossMode?'十字モード: 地図を動かして「点を追加」で打ちます（タップでは追加されません）'
                           :'タップで点を追加するモードに戻しました', 2600); });
    L.DomEvent.on(add,'click',L.DomEvent.stop).on(add,'click',()=>{
      try{ m.stop(); }catch(e){}   // 慣性移動を止めてから中心を読む（観察位置マップと同じ）
      const c=m.getCenter(); flightPath.push([c.lat,c.lng]); SCREENS._dirty=true; redrawFlight(); });
    sync();
    return box; }});
  new C({position:'bottomleft'}).addTo(m);
}
function initFlightMap(){
  const el=$('#fmap'); if(!el) return;
  let center=[43.06,141.35], zoom=13;
  if(flightPath.length){ center=flightPath[0]; zoom=15; }
  else if(lastFix){ center=[lastFix.lat,lastFix.lon]; zoom=15; }
  mapObj=createBaseMap('fmap', center, zoom, {});
  // 十字モード中はタップでの追加を止める（地図を動かして狙う操作中の誤タップで点が増えないように）
  mapObj.on('click', e=>{ if(flightCrossMode) return;
    flightPath.push([e.latlng.lat, e.latlng.lng]); SCREENS._dirty=true; redrawFlight(); });
  addFlightCrosshair(mapObj);
  // 同じ調査の他の飛翔経路を薄く重ねる（1画面で何本も見えるように）
  if(SCREENS._flightSv){ DB.flightsOf(SCREENS._flightSv).forEach(of=>{
    if(of.uuid===SCREENS._flightSelf) return;
    const p=(of.path||[]).filter(x=>Array.isArray(x)&&x.length===2);
    if(p.length<2) return;
    L.polyline(smoothPath(p),{color:'#e0a030',weight:3,opacity:.3,dashArray:'4,4'}).addTo(mapObj);
  }); }
  redrawFlight();
  if(flightPath.length>1){ try{ mapObj.fitBounds(flightPath,{padding:[40,40]}); }catch(e){} }
  addLocateControl();
  if(!flightPath.length) locateOnMap([]);
}
function redrawFlight(){
  if(!mapObj) return;
  if(flightLayer){ try{ mapObj.removeLayer(flightLayer); }catch(e){} }
  flightLayer=L.layerGroup().addTo(mapObj);
  // 複数羽トレース: アクティブ以外のトラックを各色の実線で描く（薄い既存経路より目立ち、アクティブより控えめ）
  if(SCREENS._ftracks && SCREENS._ftracks.length>1){
    SCREENS._ftracks.forEach((tr,i)=>{ if(i===SCREENS._ftIdx) return;
      const col=FLIGHT_PALETTE[i%FLIGHT_PALETTE.length];
      const p=(tr.path||[]).filter(validPathPt);
      if(p.length>1) L.polyline(p,{color:col,weight:3,opacity:.8}).addTo(flightLayer);
      if(p.length) L.circleMarker(p[p.length-1],{radius:5,color:'#fff',weight:1,fillColor:col,fillOpacity:1}).addTo(flightLayer);
    });
  }
  if(flightPath.length){
    if(flightPath.length>1) L.polyline(flightPath,{color:'#e0a030',weight:4,opacity:.9}).addTo(flightLayer);
    const badge=(txt,bg)=>L.divIcon({className:'',html:`<div style="background:${bg};border:2px solid #fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5)">${txt}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
    L.marker(flightPath[0],{icon:badge('始','#3fb984')}).addTo(flightLayer);
    flightPath.forEach((p,i)=>{ if(i>0 && i<flightPath.length-1) L.circleMarker(p,{radius:4,color:'#fff',weight:1,fillColor:'#e0a030',fillOpacity:1}).addTo(flightLayer); });
    if(flightPath.length>1) L.marker(flightPath[flightPath.length-1],{icon:badge('終','#d05555')}).addTo(flightLayer);
  }
  const info=$('#fInfo');
  if(info){ let d=0; for(let i=1;i<flightPath.length;i++){ try{ d+=mapObj.distance(flightPath[i-1],flightPath[i]); }catch(e){} }
    const multi=(SCREENS._ftracks&&SCREENS._ftracks.length>1)?`（全${SCREENS._ftracks.length}個体・表示中のタブに点が入ります）`:'';
    info.textContent = flightPath.length? `${flightPath.length}点 ・ 全長 約${d>=1000?(d/1000).toFixed(2)+'km':Math.round(d)+'m'}${multi}`
      : (flightCrossMode?'まだ点がありません。地図を動かして「点を追加」で描いてください。':'まだ点がありません。地図をタップして描いてください。')+multi; }
}
function flightUndo(){ if(!flightPath.length) return; flightPath.pop(); SCREENS._dirty=true; redrawFlight(); }
function flightClear(){ if(!flightPath.length) return; if(!confirm('描いた線を全部消しますか？')) return; flightPath=[]; SCREENS._dirty=true; redrawFlight(); }
function saveFlight(u,svUuid,editing,cont){
  // 録音中に保存→遷移すると離脱確認と衝突して履歴・録音状態が崩れるため、先に停止してもらう
  if(REC){ toast('録音中です。録音を停止してから保存してください'); return; }
  if(!editing && SCREENS._ftracks && SCREENS._ftracks.length>1){ saveFlightMulti(svUuid); return; }   // 複数羽トレースは一括保存へ
  if(flightPath.length<2){ toast('地図で2点以上の経路を描いてから保存してください'); return; }
  const name=(($('#spInput')&&$('#spInput').value)||'').trim();
  const g=n=>{ const el=$(`#flForm [name="${n}"]`); return el?el.value:''; };
  // 個体数: 観察入力と同じ検査（従来は文字列のまま無検証で保存され、書き出しにそのまま出ていた）。
  // 切り捨てず元の値で検査する（-0.5→-0の負数すり抜けを防ぐ）
  const fcEl=$('#flForm [name="count"]');
  if(fcEl && fcEl.validity && fcEl.validity.badInput){ toast('個体数は数値で入力してください'); return; }
  if(fcEl && fcEl.value.trim()!==''){ const fcN=Number(fcEl.value);
    if(!Number.isInteger(fcN) || fcN<0){ toast('個体数は0以上の整数で入力してください'); return; } }
  const behSet=[...document.querySelectorAll('[data-seg="behavior"] button.on')].map(b=>b.textContent);
  const behavior=otherMerge(behSet.join('・'),'behavior');
  const prev=editing?DB.flight(u):{uuid:u};
  const age=segVal('age_class'), individual=(g('individual_label')||'').trim(), height=segVal('height_class');
  const rec=Object.assign({},prev,{ uuid:u, survey_uuid:svUuid,
    species_id: name ? (SCREENS._chosenId||'') : '', species_name_snapshot:name,   // 種名が空なら種IDも空（観察側と同じ保証）
    path:flightPath.slice(),
    start_time:g('start_time')||'', end_time:g('end_time')||'',
    height_class:height,
    age_class:age, individual_label:individual,
    behavior:behavior,
    count:g('count')||'',
    memo:(g('memo')||'').trim(),
    needs_review:$('#flReview').checked,
    audio:SCREENS._audio||[], media:SCREENS._media||[] });
  if(!DB.upsertFlight(rec)) return;   // 保存失敗なら成功表示も遷移もしない
  if(name) DB.pushRecent(name);
  SCREENS._audio=null; SCREENS._media=null; SCREENS._mediaCtx=null;
  SCREENS._ftracks=null; SCREENS._ftDirty=false;   // 単線保存でもトラック状態は片付ける
  SCREENS._dirty=false;   // 保存済みなので離脱ガード対象から外す
  toast('飛翔経路を保存しました');
  if(cont){ // 属性を引き継いで次の経路を同じ地図で描く
    const keep={ species_id:SCREENS._chosenId||'', species_name:name, age_class:age,
      individual_label:individual, height_class:height, behavior:behavior };
    goBack(); nav('flightEdit', JSON.stringify({sv:svUuid, keep})); }
  else goBack();
}

function deleteHyp(u){ if(!confirm('この仮説と検証結果を削除しますか？')) return;
  // 仮説と一緒に消す検証結果には印(deleted_with_hyp)を付ける。復元時にこれだけ戻す（個別に消した結果は戻さない）。
  // 子を先に保存し、成功したときだけ親を消す。逆順だと「親だけ消えて検証結果が孤立」する
  const before=DB.load(DB.key.hr);   // 巻き戻し用の控え（親の削除に失敗したとき子だけ消えた状態にしない）
  const arr=DB.load(DB.key.hr); let ch=false;
  arr.forEach(r=>{ if(r.hypothesis_uuid===u && !r.deleted_at){ r.deleted_at=nowISO(); r.deleted_with_hyp=true; ch=true; } });
  if(ch && !DB.save(DB.key.hr,arr)) return;   // 保存失敗はDB.saveが警告済み。成功表示も遷移もしない
  if(!DB.softDelete(DB.key.hy,u)){
    // 子だけ消えた状態は「仮説は残っているのに検証結果が全部消えた」ように見える。必ず戻す
    if(ch && !DB.save(DB.key.hr,before)){
      toast('削除に失敗し、検証結果を元に戻すこともできませんでした。空き容量を確保してから、データ点検・修復画面で確認してください', 8000);

    return;
  }
  SCREENS._dirty=false; toast('削除しました'); goBack(); }

        <label class="field"><span class="lab">根拠となる観察記録（タップで選択）</span>${obsPick}</label>
        <label class="field"><span class="lab">不足している情報</span>
          <textarea name="missing_information">${esc(r.missing_information)}</textarea></label>
        <label class="field"><span class="lab">別の可能性</span>

        <label class="field"><span class="lab">次回の確認事項</span>

      </form>

      ${editing?`<div class="sp"></div><button class="btn danger" onclick="deleteHypResult('${r.uuid}')">この検証結果を削除</button>`:''}
      <div class="sp"></div>
      <div class="note">判定だけでは保存できません（判定を選ぶなら理由も入力）。途中まででも、判定を空にすれば下書きとして保存できます。</div>
    `
  };
};
function saveHypResult(u,hyUuid,editing){
  const f=$('#hrForm'); const g=n=>{const el=f.querySelector(`[name="${n}"]`); return el?el.value:'';};
  const judgment=segVal('judgment');
  if(judgment && !g('judgment_reason').trim()){ toast('判定するときは判定理由を入力してください'); return; }
  const obsIds=[...document.querySelectorAll('#hrForm .chips .c.on')].map(el=>el.dataset.obs).filter(Boolean);
  const prev=editing?DB.resultsOf(hyUuid).find(x=>x.uuid===u):{uuid:u};
  const rec=Object.assign({},prev,{ uuid:u, hypothesis_uuid:hyUuid,
    verified_at:g('verified_at'), observed_result:g('observed_result'), judgment,
    judgment_reason:g('judgment_reason'), missing_information:g('missing_information'),
    alternative_explanation:g('alternative_explanation'), next_action:g('next_action'),
    next_method:g('next_method'), note:g('note'), observation_uuids:obsIds });
  if(!DB.upsertHypResult(rec)) return;   // 保存失敗なら成功表示も遷移もしない
  // 判定が付いたら仮説ステータスを検証済みへ更新（未検証のときのみ）
  const h=DB.hypothesis(hyUuid);
  if(judgment && h && (h.status==='未検証'||h.status==='検証中')){ h.status='検証済み'; DB.upsertHyp(h); }
  toast('保存しました');
  SCREENS._dirty=false;   // 保存済み＝離脱確認の対象から外す
  goBack();
}
function deleteHypResult(u){ if(!confirm('この検証結果を削除しますか？')) return;
  if(!DB.softDelete(DB.key.hr,u)) return;   // 削除できていないのに成功表示して戻ると、直前の編集内容も失われる
  SCREENS._dirty=false; toast('削除しました'); goBack(); }

SCREENS.surveyEnd = (u)=>{
  const s=DB.survey(u); if(!s) return SCREENS.home();
  const obs=DB.obsOf(u);
  // 飛翔経路も種数・個体数に含める。含めないと、飛翔だけを記録した調査で
  // 終了画面が「0種・0個体」、種別集計が「1種・2個体」と食い違う（2026-08-04 全体監査で実測）
  const flightsAll=DB.flightsOf(u).filter(f=>(f.path||[]).filter(validPathPt).length>=2);
  const spCount=new Set([...obs, ...flightsAll].filter(x=>x.species_name_snapshot)
    .map(x=>x.species_name_snapshot)).size;
  const total=obs.reduce((a,o)=>a+indCount(o.count),0)
    + flightsAll.reduce((a,f)=>a+indCount(f.count),0);
  // 未同定・要確認も飛翔を含める。種数と個体数だけ飛翔を数えると内訳が合わなくなる
  const undet=obs.filter(o=>o.identification_status==='未同定'||!o.species_name_snapshot).length
    + flightsAll.filter(f=>!f.species_name_snapshot).length;
  const review=obs.filter(o=>o.needs_review).length
    + flightsAll.filter(f=>f.needs_review).length;
  const hyps=DB.hypOf(u);
  const verified=hyps.filter(h=>h.status==='検証済み').length;
  const r=s.review||{};
  const fields=[['learned','今日分かったこと'],['unknown','今日分からなかったこと'],
    ['limits','調査条件による制約'],['missed','見落とした可能性'],
    ['next','次回確認すること'],['report','報告書に記載する事項'],['overall','全体所感']];
  return {
    title:'調査終了・振り返り',
    html:`
      <div class="card">
        <h3>自動集計</h3>
        <div class="tablewrap"><table>
          <tr><td>観察記録数</td><td class="num">${obs.length}</td><td>確認種数</td><td class="num">${spCount}</td></tr>
          <tr><td>総個体数</td><td class="num">${total}</td><td>未同定件数</td><td class="num">${undet}</td></tr>
          <tr><td>飛翔経路数</td><td class="num">${flightsAll.length}</td><td>要確認件数</td><td class="num">${review}</td></tr>
          <tr><td>メモ件数</td><td class="num">${DB.notesOf(u).length}</td><td></td><td class="num"></td></tr>
          <tr><td>仮説件数</td><td class="num">${hyps.length}</td><td>検証済み仮説</td><td class="num">${verified}</td></tr>
        </table></div>
      </div>
      <form id="rvForm">
        ${fields.map(([k,lab])=>`<label class="field"><span class="lab">${lab}</span>
          <textarea name="${k}">${esc(r[k]||'')}</textarea></label>`).join('')}
      </form>
      <button class="btn primary big" onclick="finishSurvey('${u}')">${s.status==='終了'?'振り返りを保存':'振り返りを保存して調査を終了'}</button>
      <div class="sp"></div>
      <div class="note">終了後も再編集できます。総個体数は延べ数のため、生息個体数とは限りません。</div>
    `
  };
};
function finishSurvey(u){
  if(WALK && WALK.sv===u){   // 歩行記録が残っていれば止めてルートを本保存（先に保存してからsを読む）
    if(!stopWalk(true)){ toast('ルートを保存できなかったため終了を中止しました。空き容量を確保してからもう一度お試しください', 4000); return; }
  }
  const s=DB.survey(u); const f=$('#rvForm'); const review={};
  f.querySelectorAll('textarea').forEach(t=>review[t.name]=t.value);
  s.review=review;
  if(s.status!=='終了'){ s.status='終了'; s.end_datetime=nowISO(); }
  if(!DB.upsertSurvey(s)) return; stopGps(); autoBackupRecords(); scheduleFolderFull(); toast('保存しました');
  SCREENS._dirty=false;   // 保存済み＝離脱確認の対象から外す
  reset('home'); nav('survey',u);
}
