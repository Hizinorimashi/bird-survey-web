/* DBの返事の AI の件数を確かめる。inserted+updated+unchanged が送った重複しない id の数と合い、rejected が0なら true。
   AI の件数が無い返事（古いDB）・合わない・おかしな返事は false（「AIも保存済み」と言わない。計画レビュー Major 5・補足2） */
function dbSendAiOk(body, sent){
  const a=body && body.ai;
  if(!a || typeof a!=='object') return false;
  const n=x=>(typeof x==='number' && isFinite(x) && x>=0) ? x : NaN;
  const ids=new Set((sent||[]).map(d=>d && d.id).filter(Boolean)).size;
  const got=n(a.inserted)+n(a.updated)+n(a.unchanged);
  return got===ids && n(a.received)===(sent||[]).length && n(a.rejected)===0;
}
function dbSendPost(c, data, gen0, dropped){
  // 送る直前にも確認（用意している間に記録が変わっていたら送らない）
  if(gen0!==BACKUP_GEN || backupBlocked()){
    toast('記録が変わりました。もう一度押してください', 4000); return Promise.resolve(null); }
  return fetch(c.url+'/ingest', {
    method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json',
             'Authorization':'Bearer '+(c.token||''),
             'X-Device-Id':deviceId()},
    body: JSON.stringify(data)
  }).then(async res=>{
    let body=null; try{ body=await res.json(); }catch(e){}
    if(!res.ok || !body || body.ok!==true){
      const why=(body&&body.error) ? body.error
        : (res.status===401 ? '合言葉が違います。設定を確かめてください'
        : res.status===413 ? '送るものが大きすぎます'
        : res.status===503 ? 'データベースが取り込み中です。少し待ってください'
        : 'データベースが受け取れませんでした（'+res.status+'）');
      throw new Error(why);
    }
    // 送っている間に記録が変わった＝この受領証は古い。届いた事実だけ伝えて再送を促す
    if(gen0!==BACKUP_GEN){ _backupPending=true;
      toast('送りましたが、その間に記録が変わりました。もう一度押してください', 5000);
      return body; }
    const aiSent=data.ai_detections||[];
    const aiOk=dbSendAiOk(body, aiSent);
    localStorage.setItem('bs_dbsend_sent', nowISO());
    localStorage.setItem('bs_dbsend_last', JSON.stringify({
      at:nowISO(), receipt:String(body.receipt||''),
      surveys:body.surveys|0, observations:body.observations|0, flights:body.flights|0,
      unmatched:body.unmatched|0, unchanged:body.unchanged|0,
      dropped:(dropped===null?-1:dropped),
      ai_sent:aiSent.length, ai_ok:aiOk }));
    let msg='データベースに届きました（受領証 '+(body.receipt||'—')+'）';
    if(aiSent.length) msg += aiOk ? ' ／ 鳴き声AI '+aiSent.length+'件も保存されました'
      : ((body && body.ai) ? ' ／ ⚠ 鳴き声AIの検出はDBで確認できませんでした（件数が合いません）'
                           : ' ／ ⚠ 記録は送りました。鳴き声AIの検出はDBが古く入っていません');
    if(dropped===null) msg+=' ／ ⚠ 送れなかった記録があるか確かめられませんでした。ホームの「データ点検・修復」を見てください';
    else if(dropped>0) msg+=' ／ ⚠ 壊れていて送れなかった記録が'+dropped+'件あります';
    // 届いたのに「変わらなかった」記録がある＝直したつもりが反映されていない。
    // 黙っていると、送った本人が気付けないまま報告書に古い内容が出る
    if((body.unchanged|0)>0) msg+=' ／ ⚠ '+(body.unchanged|0)+'件は変わりませんでした（端末の時計がずれていないか確かめてください）';
    else if(dropped===0 && body.unmatched>0) msg+=' ／ 名前が見つからない種が'+body.unmatched+'件';
    toast(msg, 7000);
    return body;
  }).catch(e=>{
    toast('送れませんでした: '+String(e&&e.message||e).slice(0,80), 6000);
    throw e;
  });
}

/* ---------- Googleドライブに直接保存（OAuth / drive.file・iPhone/会社アカウント対応） ---------- */
// サインインしたアカウントのマイドライブに保存する。受け皿方式と違い、保存先＝サインインしたアカウント。
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const GDRIVE_FOLDER = '鳥類調査バックアップ';
// トークンを端末内に保存し、有効期限内なら再サインイン不要にする（会社アカの2段階認証を毎回出さないため）
function gdriveTokenLoad(){ try{ const t=JSON.parse(localStorage.getItem('bs_gdrive_token')||'null'); return (t&&t.access_token&&Date.now()<t.expiry-60000)?t:null; }catch(e){ return null; } }
function gdriveTokenSave(t){ GTOKEN=t; try{ localStorage.setItem('bs_gdrive_token', JSON.stringify(t)); }catch(e){} }
function gdriveTokenClear(){ GTOKEN=null; localStorage.removeItem('bs_gdrive_token'); }
let GTOKEN = gdriveTokenLoad();                      // {access_token, expiry}（有効期限内のみ復元）
let GUSER = localStorage.getItem('bs_gdrive_user') || ''; // 前回サインインしたアカウント（表示用）
// このアプリ用のクライアントID（内蔵・固定）。ウェブ用クライアントIDは公開前提の情報で、
// 悪用防止は「承認済みのJavaScript生成元」とテストユーザー制限の側で効いているため、埋め込んでも安全性は変わらない。
// 過去に端末へ貼り付け保存されたID（コピペ事故で壊れたものを含む）は一切使わず、常にこの値を使う
const GDRIVE_DEFAULT_CLIENT_ID='39266503709-hqoe2kpd60r59dn5s1ql7ltjs7nu31h0.apps.googleusercontent.com';
function gdriveCfg(){ return { clientId: GDRIVE_DEFAULT_CLIENT_ID }; }
function gdriveLast(){ return localStorage.getItem('bs_gdrive_last')||''; }
function gisReady(){ return !!(window.google && google.accounts && google.accounts.oauth2); }
function gdriveSignedIn(){ return !!(GTOKEN && GTOKEN.access_token && Date.now() < GTOKEN.expiry-60000); }
// アクセストークン取得。interactive=trueならアカウント選択画面を出す。falseはキャッシュ済みのみ（自動保存用・勝手にポップアップさせない）
function gdriveGetToken(interactive){
  return new Promise((resolve,reject)=>{
    const cfg=gdriveCfg();
    if(!cfg.clientId) return reject(new Error('クライアントID未設定'));
    if(gdriveSignedIn()) return resolve(GTOKEN.access_token);
    if(!interactive) return reject(new Error('未サインイン'));
    if(!gisReady()) return reject(new Error('Googleの読み込み待ち。少し待って再試行してください'));
    try{
      const tc = google.accounts.oauth2.initTokenClient({
        client_id: cfg.clientId, scope: GDRIVE_SCOPE,
        prompt: 'select_account',
        callback: (resp)=>{
          if(resp && resp.access_token){
            gdriveTokenSave({ access_token:resp.access_token, expiry: Date.now()+((resp.expires_in||3600)*1000) });
            resolve(resp.access_token);
          } else reject(new Error('サインインに失敗しました'));
        },
        error_callback: (err)=>reject(new Error((err&&err.type)||'サインインが中断されました'))
      });
      tc.requestAccessToken();
    }catch(e){ reject(e); }
  });
}
async function gdriveFetch(path, opts, token){
  opts=opts||{}; opts.headers=Object.assign({Authorization:'Bearer '+token}, opts.headers||{});
  const res=await fetch('https://www.googleapis.com/'+path, opts);
  if(res.status===401){ gdriveTokenClear(); }   // 認証切れのみトークン破棄。403(権限)はトークン自体は有効なので残す
  if(!res.ok){ const t=await res.text().catch(()=>''); throw new Error('Drive '+res.status+' '+t.slice(0,140)); }
  return res.json();
}
async function gdriveEnsureFolder(token){
  // IDのキャッシュはしない（自分が作ったフォルダIDを覚え込むと、2端末が同時に作成した場合に
  // それぞれ別フォルダを使い続けて同期先が分岐するため）。毎回「作成日が最も古い同名フォルダ」を
  // 検索して採用することで、重複ができても全端末が同じフォルダへ収束する
  const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='"+GDRIVE_FOLDER+"' and trashed=false");
  const url='drive/v3/files?spaces=drive&orderBy='+encodeURIComponent('createdTime')+'&fields=files(id)&q='+q;
  const list=await gdriveFetch(url, {}, token);
  if(list.files && list.files.length) return list.files[0].id;
  const created=await gdriveFetch('drive/v3/files?fields=id', { method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ name:GDRIVE_FOLDER, mimeType:'application/vnd.google-apps.folder' }) }, token);
  // 作成直後にもう一度検索して最古を採用（同時に2端末が作成しても、以後は同じ方へ収束する）
  const again=await gdriveFetch(url, {}, token);
  return (again.files && again.files.length) ? again.files[0].id : created.id;
}
async function gdriveUpsertFile(folderId, name, contentStr, token){
  const q=encodeURIComponent("name='"+name.replace(/'/g,"\\'")+"' and '"+folderId+"' in parents and trashed=false");
  const list=await gdriveFetch('drive/v3/files?spaces=drive&fields=files(id)&q='+q, {}, token);
  let id;
  if(list.files && list.files.length){ id=list.files[0].id; }
  else{
    const created=await gdriveFetch('drive/v3/files?fields=id', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ name, parents:[folderId] }) }, token);
    id=created.id;
  }
  const up=await gdriveFetch('upload/drive/v3/files/'+id+'?uploadType=media&fields=id,modifiedTime', { method:'PATCH',
    headers:{'Content-Type':'application/json'}, body:contentStr }, token);
  return { id, modifiedTime:(up&&up.modifiedTime)||'' };
}
// Googleドライブへの保存は直列化する。自動保存と手動保存が同時に走ると
// 「検索→無い→作成」が二重に起きて同名フォルダ/ファイルを重複生成するため。
let _gdriveChain=Promise.resolve();
function gdriveSerial(fn){ const run=_gdriveChain.then(fn, fn); _gdriveChain=run.catch(()=>{}); return run; }
async function gdrivePush(kind, dataObj, token, dailyObj, opts){
  return gdriveSerial(async ()=>{
    const folderId=await gdriveEnsureFolder(token);
    const json=JSON.stringify(dataObj);
    const ymd=dateValue().replace(/-/g,'');
    if(kind==='records'){
      // 同期用: 自分専用ファイルだけを上書き（他端末の保存を消す事故を構造的に防ぐ）＋人が復元に使う日次控え
      //（日次控えも端末別の名前にして、同じ日に2台が保存し合っても互いに上書きしないようにする）
      // dailyObj指定時は日次控えだけ別内容にする（同期用は壊れた記録を除外しても、控えには全件残すため）
      const up=await gdriveUpsertFile(folderId, syncFileName(), json, token);
      await gdriveUpsertFile(folderId, 'birdsurvey_records_'+ymd+'_'+deviceId().slice(0,8)+'.json',
        dailyObj?JSON.stringify(dailyObj):json, token);
      // 自分が保存したファイルは「確認済み」にする（新着チェックが自分の保存に反応しないように）
      if(up && up.id && up.modifiedTime) syncSeenMark(up.id, up.modifiedTime);
    }else{
      await gdriveUpsertFile(folderId, 'birdsurvey_'+kind+'_latest.json', json, token);
      await gdriveUpsertFile(folderId, 'birdsurvey_'+kind+'_'+ymd+'.json', json, token);
    }
    // 自動経路では、送信中に取引が始まった古い世代の内容を「最新保存済み」と表示しない
    if(!(opts && opts.noStamp)) localStorage.setItem('bs_gdrive_last', nowISO());
  });
}
// 自動保存：サインイン済み（有効トークンあり）のときだけ動く。切れていたら黙ってスキップ
async function gdriveBackupRecords(){
  if(!gdriveCfg().clientId || !gdriveSignedIn()) return;

  // 取り込み（他端末の保存の合体）は自動バックアップでは行わない。
  // 長い通信の間に保存取引が始まると、取引中のデータを取り込みで上書きし得るため、
  // 取り込みは起動時の確認（gdriveStartupCheck）と手動同期だけに限定する（2026-08-09 監査69巡目）
  // 写真・録音を先に置き、その後で参照する記録JSONを上げる（動画は手動のみ）。失敗は黙らせず知らせる
  if(gen0!==BACKUP_GEN || backupBlocked()){ _backupPending=true; return; }

  // 同期用は壊れた記録を除外、日次控え（人が復元に使う）は全件のまま（原本を失わせない）。

  if(gen0!==BACKUP_GEN || backupBlocked()){ _backupPending=true; return; }

// 手動の一括同期：ドライブの新しいデータを取り込んでから、この端末の記録・写真・録音を保存する

    await gdrivePush('records', buildRecordsBackup({onlyValid:true}), token, buildRecordsBackup());
    const got=(pulled?pulled.media.done:0)+extra.done;

/* ---------- Googleドライブ同期（端末間の引き継ぎ：iPhone⇔iPad） ----------
   正本はドライブ上の birdsurvey_records_latest.json（既存の自動保存と同じファイル）。
   写真・録音は media サブフォルダに1件1ファイルで置き、記録は updated_at の新しい方を残して合体する。
   動画は容量が大きいため自動では送受信しない（クラウド保存画面の手動ボタンのみ）。 */

// この端末の固有ID。各端末は自分専用の同期ファイル birdsurvey_sync_<ID>.json にしか書き込まない。
// これにより「上書きで他端末の保存が消える」事故が構造的に起きない（読むのは全端末のファイル、書くのは自分のだけ）
function deviceId(){ let d=localStorage.getItem('bs_device_id');
  if(!d){ d=uuid(); try{ localStorage.setItem('bs_device_id', d); }catch(e){} } return d; }
function syncFileName(){ return 'birdsurvey_sync_'+deviceId()+'.json'; }

// 対話サインインの後は必ず「誰のドライブか」を確認し、持ち主（クライアントID×アカウント）が変わっていたら
// 同期の控え（既読・辞退・アップ済み一覧）をリセットする。前の持ち主の控えを引きずると、
// 新しいアカウントの記録を取り込み損ねたり、未送信のメディアを送信済みと誤認するため。
// ※持ち主印(bs_sync_owner)はサインアウトでは消さない（サインアウト→別アカウント、という切替も検知するため）
// 戻り値false＝確認またはリセットに失敗（呼び出し側は同期を中止すること）
async function gdriveConfirmOwner(token){
  let email='';
  try{ const about=await gdriveFetch('drive/v3/about?fields=user(emailAddress)', {}, token);
    email=(about.user&&about.user.emailAddress)||''; }catch(e){ return false; }
  if(!email) return false;
  GUSER=email; try{ localStorage.setItem('bs_gdrive_user', email); }catch(e){}
  const owner=(gdriveCfg().clientId||'')+'|'+email;
  if((localStorage.getItem('bs_sync_owner')||'')!==owner){
    localStorage.removeItem('bs_sync_seen'); localStorage.removeItem('bs_sync_declined'); localStorage.removeItem('bs_sync_invalid');
    try{ await kvPut('gdrive_media_map', {audio:{},media:{}}); }catch(e){ return false; }
    try{ localStorage.setItem('bs_sync_owner', owner); }catch(e){ return false; }
  }
  return true;
}

// 既読情報 {fileId: modifiedTime}。ドライブ上の同期ファイルがこれより新しければ「未取り込みの保存」と判断
function syncSeenLoad(){ try{ const m=JSON.parse(localStorage.getItem('bs_sync_seen')||'{}');
  return (m && typeof m==='object' && !Array.isArray(m))?m:{}; }catch(e){ return {}; } }
function syncSeenMark(fileId, modifiedTime){ try{ const m=syncSeenLoad(); m[fileId]=modifiedTime;
  localStorage.setItem('bs_sync_seen', JSON.stringify(m)); }catch(e){} }
// 検査不合格の同期ファイル {fileId: modifiedTime}。既読とは別管理（既読=取り込み済みの意味を守る）。
// 同じ版について起動のたびに確認ダイアログや再取得を繰り返さないための印。
// ファイルが更新されれば（相手端末が修復すれば）modifiedTimeが変わるので自動で再試行される。手動の「今すぐ同期」は印を無視して再試行する
function syncInvalidLoad(){ try{ const m=JSON.parse(localStorage.getItem('bs_sync_invalid')||'{}');
  return (m && typeof m==='object' && !Array.isArray(m))?m:{}; }catch(e){ return {}; } }
function syncInvalidMark(fileId, modifiedTime){ try{ const m=syncInvalidLoad(); m[fileId]=modifiedTime||'';
  localStorage.setItem('bs_sync_invalid', JSON.stringify(m)); }catch(e){} }
function syncInvalidHas(fileId, modifiedTime){ const m=syncInvalidLoad();
  return Object.prototype.hasOwnProperty.call(m, fileId) && m[fileId]===(modifiedTime||''); }

// ドライブ上の同期ファイル一覧（全端末分）。旧形式 birdsurvey_records_latest.json も取り込み対象に含める（v50以前との互換）
async function gdriveListSyncFiles(token){
  const folderId=await gdriveEnsureFolder(token);
  const q=encodeURIComponent("(name contains 'birdsurvey_sync_' or name = 'birdsurvey_records_latest.json') and '"+folderId+"' in parents and trashed=false");
  const files=[]; let pageToken='';
  do{
    const res=await gdriveFetch('drive/v3/files?spaces=drive&pageSize=100&fields=nextPageToken,files(id,name,modifiedTime)&q='+q
      +(pageToken?('&pageToken='+encodeURIComponent(pageToken)):''), {}, token);
    (res.files||[]).forEach(f=>files.push(f));
    pageToken=res.nextPageToken||'';
  }while(pageToken);
  const out=files.filter(f=>f && (f.name==='birdsurvey_records_latest.json' || /^birdsurvey_sync_[\w-]+\.json$/.test(f.name)));
  // ドライブから消えたファイルの既読情報を掃除（肥大防止）
  try{ const seen=syncSeenLoad(); const ids=new Set(out.map(f=>f.id)); let dirty=false;
    Object.keys(seen).forEach(id=>{ if(!ids.has(id)){ delete seen[id]; dirty=true; } });
    if(dirty) localStorage.setItem('bs_sync_seen', JSON.stringify(seen)); }catch(e){}
  return out;
}
// そのうち未読のもの（自分の端末のファイルは除く）
function unseenSyncFiles(files){
  const seen=syncSeenLoad(); const own=syncFileName();
  return files.filter(f=>f.name!==own && f.modifiedTime && (!seen[f.id] || String(f.modifiedTime)>String(seen[f.id])));
}

// gdriveFetch のJSON化しない版（記録JSON・メディア本体のダウンロード用）。Responseをそのまま返す
async function gdriveFetchRaw(path, token){
  const res=await fetch('https://www.googleapis.com/'+path, { headers:{Authorization:'Bearer '+token} });
  if(res.status===401){ gdriveTokenClear(); }
  if(!res.ok){ const t=await res.text().catch(()=>''); throw new Error('Drive '+res.status+' '+t.slice(0,140)); }
  return res;
}

// 同期対象のメディア一覧＝「観察・飛翔レコードが参照している録音・写真・動画」。
// 図鑑の切り抜き画像や資料PDFはレコードから参照されないため、この集め方だと自然に対象外になる。
// 読取失敗時は例外（壊れた状態で同期して他端末を巻き込まないため）
/* **古い版の端末・古い控えが持っていない項目は、こちらの値を残す**
   （2026-08-14 監査 Critical）。
   v219 で足した「環境・営巣木の写真とメモ」は、v218 以前の記録には項目そのものが
   無い。丸ごと置き換えると、古い端末で直して送る／古い控えを取り込むだけで
   写真とメモが消える（そのあと掃除で実体まで失われる）。
   **項目が有って空**なら「消した」という意思なので、そのまま尊重する。
   無い（undefined）ときだけ引き継ぐ。同期・控えの取り込みの両方で使う */
const NEW_OBS_FIELDS=['env_media','nest_media','env_note','nest_note',
  'source'];   // v232 の「鳥」ポイントの印（v235 で追加）
// 飛翔（線・面）の新しい項目（v235 で追加）。線の途中の旋回上昇◎
const NEW_FL_FIELDS=['soar_spots'];
// key: どの入れ物の記録か（DB.key.ob / DB.key.fl）。省くと観察として扱う（v234 までの呼び方）
function keepNewFields(mine, theirs, key){
  if(!mine || !theirs) return theirs;
  const fields = key===DB.key.fl ? NEW_FL_FIELDS : (key===undefined || key===DB.key.ob) ? NEW_OBS_FIELDS : [];
  let out=theirs;
  fields.forEach(f=>{
    if(theirs[f]===undefined && mine[f]!==undefined){
      if(out===theirs) out=Object.assign({}, theirs);
      out[f]=mine[f];
    }
  });
  return out;
}
function collectMediaRefs(){
  const refs=[]; const seen=new Set();
  const take=(owner, ownerType, field, store)=>{ (owner[field]||[]).forEach(m=>{
    if(m && m.id && !seen.has(store+':'+m.id)){ seen.add(store+':'+m.id);
      refs.push({ store, id:m.id, ext:m.ext||'', mime:m.mime||'',
        kind:(store==='audio'?'audio':(m.kind||'photo')), meta:m, ownerType, ownerUuid:owner.uuid }); } }); };
  // 観察は写真の欄が3つ。足し忘れると、環境・営巣木の写真だけドライブに上がらない
  DB.loadRaw(DB.key.ob).forEach(o=>{ take(o,'obs','audio','audio'); take(o,'obs','media','media');
    take(o,'obs','env_media','media'); take(o,'obs','nest_media','media'); });
  DB.loadRaw(DB.key.fl).forEach(f=>{ take(f,'flight','audio','audio'); take(f,'flight','media','media'); });
  return refs;
}
// ドライブ上のファイル名。idは英数字とハイフンのみ(safeId検証済み)なのでそのまま使える
function mediaFileName(ref){ return ref.store+'_'+ref.id+(ref.ext?('.'+String(ref.ext).replace(/^\./,'')):''); }

// アップロード済みメディアの控え {audio:{id:driveFileId}, media:{...}}。
// 正本はドライブの実ファイルで、これは通信節約用のキャッシュ（消えてもファイル名検索で復元される）
function syncMapLoad(){ return kvGet('gdrive_media_map').then(m=>{ m=(m&&typeof m==='object')?m:{};
  m.audio=m.audio||{}; m.media=m.media||{}; return m; }).catch(()=>({audio:{},media:{}})); }
function syncMapSave(m){ return kvPut('gdrive_media_map', m).catch(()=>{}); }
// idが'constructor'等でも誤判定しないよう、継承プロパティを除いた自身の項目だけで判定する
function syncMapHas(m,store,id){ return !!m[store] && Object.prototype.hasOwnProperty.call(m[store], id); }

// バックアップフォルダ内の media サブフォルダを確保（無ければ作成）。
// 親フォルダと同じ理由でキャッシュせず、常に最古の同名フォルダへ収束させる
async function gdriveEnsureMediaFolder(parentId, token){
  const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='media' and '"+parentId+"' in parents and trashed=false");
  const url='drive/v3/files?spaces=drive&orderBy='+encodeURIComponent('createdTime')+'&fields=files(id)&q='+q;
  const list=await gdriveFetch(url, {}, token);
  if(list.files && list.files.length) return list.files[0].id;
  const created=await gdriveFetch('drive/v3/files?fields=id', { method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ name:'media', mimeType:'application/vnd.google-apps.folder', parents:[parentId] }) }, token);
  const again=await gdriveFetch(url, {}, token);
  return (again.files && again.files.length) ? again.files[0].id : created.id;
}
// blob（録音・写真・動画の実体）のアップロード。gdriveUpsertFileと同じ「検索→無ければ作成→本体PATCH」方式
async function gdriveUploadBlob(folderId, name, blob, mime, token){
  const q=encodeURIComponent("name='"+name.replace(/'/g,"\\'")+"' and '"+folderId+"' in parents and trashed=false");
  const list=await gdriveFetch('drive/v3/files?spaces=drive&fields=files(id)&q='+q, {}, token);
  let id;
  if(list.files && list.files.length){ id=list.files[0].id; }
  else{
    const created=await gdriveFetch('drive/v3/files?fields=id', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ name, parents:[folderId] }) }, token);
    id=created.id;
  }
  await gdriveFetch('upload/drive/v3/files/'+id+'?uploadType=media', { method:'PATCH',
    headers:{'Content-Type': mime||'application/octet-stream'}, body:blob }, token);
  return id;
}
// 未アップロード分（レコード参照 − アップ済み控え）をドライブへ。既定は動画以外、videoOnly:trueで動画だけ。
// 失敗した分は控えに載らないため、次回の自動保存や「今すぐ同期」で自然に再試行される
async function gdrivePushMedia(token, opts){
  opts=opts||{};
  return gdriveSerial(async ()=>{
    // 不正なIDの参照はドライブのファイル名・検索クエリに使えないため除外（修復すれば次回から対象になる）
    const refs=collectMediaRefs().filter(r=>okUuid(r.id))
      .filter(r=> opts.videoOnly ? r.kind==='video' : r.kind!=='video');
    const map=await syncMapLoad();
    const todo=refs.filter(r=>!syncMapHas(map,r.store,r.id));
    if(!todo.length) return {done:0, skip:0};
    const parentId=await gdriveEnsureFolder(token);
    const folderId=await gdriveEnsureMediaFolder(parentId, token);
    let done=0, skip=0;
    for(const r of todo){
      const rec=await (r.store==='audio'?AudioDB:PhotoDB).get(r.id).catch(()=>null);
      // 中身が0バイトのものも「無い」と同じ扱い。上げてしまうと、
      // 他の端末が「取得済み」と覚えて、正しい実体を取り直せなくなる（監査1巡目 Major）
      if(!rec || !rec.blob || !(rec.blob.size>0)){ skip++; continue; }
      const fid=await gdriveUploadBlob(folderId, mediaFileName(r), rec.blob, r.mime||rec.mime, token);
      map[r.store][r.id]=fid;
      await syncMapSave(map);          // 1件成功するごとに控えを保存（途中で切れても続きから再開できる）
      done++;
      if(opts.progress){ try{ opts.progress(done, todo.length); }catch(e){} }
    }
    return {done, skip};
  });
}

// 同期で受け取ったバックアップの厳格検証。1箇所でも不正なら全体を拒否する（壊れたデータの取り込み・再配布を防ぐ）
function validateBackupData(d){
  const bad=msg=>{ throw new Error('ドライブ上のデータ形式が不正です（'+msg+'）'); };
  const isPlain=x=>x && typeof x==='object' && !Array.isArray(x);
  // レコードの検査は共通の okRecord を使う。取込側（importIdsOk）と同じ関数にすることで、
  // 「取込では通るのに同期は拒否し続ける」データが作られる余地をなくす。
  if(!isPlain(d)) bad('全体');
  if(d.app!=='bird_survey') bad('種別');
  if(d.kind!=='records') bad('種類');
  if(d.version!==6) bad('版'+d.version+'。アプリを最新に更新してください');
  for(const name of ['surveys','observations','notes','hypotheses','hyp_results','flights']){
    if(!Array.isArray(d[name])) bad(name);
    for(const x of d[name]){ if(!okRecord(name, x)) bad(name+'の要素'); }
  }
  if(d.tombstones!=null){
    if(!Array.isArray(d.tombstones)) bad('削除記録');
    for(const t of d.tombstones){ if(!okTombstone(t)) bad('削除記録の要素'); }
  }
  if(d.myguide!=null){
    if(!Array.isArray(d.myguide)) bad('マイ図鑑');
    for(const g of d.myguide){ if(!okGuideItem(g)) bad('マイ図鑑の要素'); }   // 取込側と同じ関数
  }
  return true;
}
// media サブフォルダの全ファイル一覧（名前→fileId）。件数が多い場合のページ送りにも対応
async function gdriveListMediaFiles(token){
  const parentId=await gdriveEnsureFolder(token);
  const folderId=await gdriveEnsureMediaFolder(parentId, token);
  const byName=Object.create(null); let pageToken='';
  do{
    const q=encodeURIComponent("'"+folderId+"' in parents and trashed=false");
    const res=await gdriveFetch('drive/v3/files?spaces=drive&pageSize=1000&fields=nextPageToken,files(id,name)&q='+q
      +(pageToken?('&pageToken='+encodeURIComponent(pageToken)):''), {}, token);
    (res.files||[]).forEach(f=>{ byName[f.name]=f.id; });
    pageToken=res.nextPageToken||'';
  }while(pageToken);
  return byName;
}
// 端末に実体が無い録音・写真をドライブから取り込む。既定は動画以外、videoOnly:trueで動画だけ
async function gdrivePullMedia(token, opts){
  opts=opts||{};
  const refs=collectMediaRefs().filter(r=>okUuid(r.id))   // 不正IDはファイル名を組めないため対象外（修復後に取得される）
    .filter(r=> opts.videoOnly ? r.kind==='video' : r.kind!=='video');
  const missing=[];
  for(const r of refs){
    const rec=await (r.store==='audio'?AudioDB:PhotoDB).get(r.id).catch(()=>null);
    // 中身が0バイトのものは「持っていない」と同じ扱い。持っていることにすると、
    // ドライブにある正しい実体を取り直せなくなる（監査5巡目 Major）
    if(!rec || !rec.blob || !(rec.blob.size>0)) missing.push(r);
  }
  if(!missing.length) return {done:0, miss:0};
  const byName=await gdriveListMediaFiles(token);
  const map=await syncMapLoad();
  let done=0, miss=0;
  for(const r of missing){
    const fid=byName[mediaFileName(r)];
    if(!fid){ miss++; continue; }                    // 相手の端末がまだアップロードしていない
    let blob=null;
    try{ blob=await (await gdriveFetchRaw('drive/v3/files/'+fid+'?alt=media', token)).blob(); }catch(e){ miss++; continue; }
    if(!blob || !(blob.size>0)){ miss++; continue; }   // 中身の無いファイルは取り込まない（開けない実体を正常として固定してしまう）
    const m=r.meta||{};
    const rec={ id:r.id, blob, mime:m.mime||blob.type, ext:m.ext, size:m.size||blob.size, created_at:m.created_at,
      obs_uuid: r.ownerType==='obs'?r.ownerUuid:'', flight_uuid: r.ownerType==='flight'?r.ownerUuid:'' };
    try{
      if(r.store==='audio'){ rec.dur=m.dur; await AudioDB.put(rec); }
      else{ rec.kind=m.kind||r.kind; rec.name=m.name; await PhotoDB.put(rec); }
    }catch(e){ miss++; continue; }                   // 保存失敗（容量不足など）は数えて続行
    map[r.store][r.id]=fid; await syncMapSave(map);  // 取り込めた分は「アップ済み」扱い（二重アップロード防止）
    done++;
    if(opts.progress){ try{ opts.progress(done, missing.length); }catch(e){} }
  }
  return {done, miss};
}

// 別端末のデータを合体。uuidごとに updated_at が新しい方を残す（どちらの端末の記録も消えない）。
// ローカルに無い＆削除済み(deleted_at付き)は取り込まない（完全削除したものが戻ってくるのを防ぐ）。
// 全コレクションを計算し終えてから一括保存し、途中失敗時は元に戻す（半分だけ取り込んだ状態をDriveへ再送信しないため）
function mergeRemoteRecords(d){
  // 使用権の確認が済むまで、同期の書き込みは始めない。
  // null を返すと呼び出し側が「取り込めた」と誤解して既読にしてしまうので、例外で止める
  if(!writeAllowed()) throw new Error('起動時の確認が終わるまで同期できません');
  const colKeys=[['surveys',DB.key.sv],['observations',DB.key.ob],['notes',DB.key.nt],
    ['hypotheses',DB.key.hy],['hyp_results',DB.key.hr],['flights',DB.key.fl]];
  // 形式検証: 6コレクションすべて配列であること（片方だけ取り込んで壊れた状態を作らない）
  for(const [name] of colKeys){ if(!Array.isArray(d[name])) throw new Error('ドライブ上のデータ形式が不正です（'+name+'）'); }
  let changed=0;
  // 完全削除の記録（墓標）を合体。墓標より古いレコードは両端末から取り除かれる（削除の伝搬）。
  // 墓標より新しい updated_at を持つレコード（削除後に作り直された等）は残す
  const ts=Object.create(null);
  // 読めない墓標のまま合体すると、空の墓標で原本を上書きしてしまう（監査1巡目 Critical）
  const 今の墓標=tombstonesForWrite();
  if(!今の墓標) throw new Error('この端末の削除記録を読み取れないため、同期を中止しました');
  今の墓標.forEach(t=>{ ts[t.uuid]=t.at; });
  (Array.isArray(d.tombstones)?d.tombstones:[]).forEach(t=>{
    if(t && typeof t.uuid==='string' && t.uuid && typeof t.at==='string' && t.at){
      if(!ts[t.uuid] || String(t.at)>String(ts[t.uuid])) ts[t.uuid]=t.at; } });
  const stamp=x=>String(x.updated_at||x.created_at||'');
  const newer=(mine,theirs)=>stamp(mine)>=stamp(theirs);
  const buried=x=>{ const at=ts[x.uuid]; return !!at && String(at)>=stamp(x); };
  // 1) 全コレクションの合体結果を計算だけする（保存はまだしない）
  const merged={};
  for(const [name,key] of colKeys){
    const byId=Object.create(null);
    DB.loadRaw(key).forEach(x=>{ if(x && typeof x==='object' && x.uuid) byId[x.uuid]=x; });
    d[name].forEach(x=>{ if(!x || typeof x!=='object' || !x.uuid) return;
      const mine=byId[x.uuid];
      if(!mine){ if(!x.deleted_at){ byId[x.uuid]=x; changed++; } return; }
      // **勝ち負けのどちら向きでも補う**。こちらが新しくても、相手だけが
      // 環境・営巣木を持っていることがある（相手が新しい版で入れて、
      // こちらが古い版で直した場合）。片方向だけだと、次の同期で消えていく
      //（2026-08-14 監査2巡目 Critical）
      if(!newer(mine,x)){ byId[x.uuid]=keepNewFields(mine, x, key); changed++; }
      else { const 補った=keepNewFields(x, mine, key);
        if(補った!==mine){ byId[x.uuid]=補った; changed++; } }
    });
    for(const u in byId){ if(buried(byId[u])){ delete byId[u]; changed++; } }
    merged[key]=Object.values(byId);
  }
  // マイ図鑑はid単位の追加のみ（計算だけ）。図鑑の切り抜き(source:'guide')は画像本体を同期しないため取り込まない（参照切れ防止）
  let newGuide=null;
  if(Array.isArray(d.myguide) && d.myguide.length){
    const cur=myguideList(); const byId=Object.create(null); cur.forEach(g=>{ if(g&&g.id) byId[g.id]=g; });
    d.myguide.forEach(g=>{ if(g&&g.id && g.source!=='guide' && !byId[g.id]){ byId[g.id]=g; changed++; } });
    newGuide=Object.values(byId);
  }
  // 2) 一括保存（6コレクション＋墓標＋マイ図鑑）。1つでも失敗したら全部を元へ巻き戻して中止
  const touched=colKeys.map(([,k])=>k).concat(['bs_tombstones','bs_myguide']);
  const before={}; touched.forEach(k=>{ before[k]=localStorage.getItem(k); });
  const rollback=()=>{ touched.forEach(k=>{ try{ if(before[k]==null) localStorage.removeItem(k); else localStorage.setItem(k,before[k]); }catch(e){} }); };
  for(const [,key] of colKeys){
    if(!DB.save(key, merged[key])){ rollback(); throw new Error('保存できませんでした（空き容量を確認してください）'); }
  }
  if(!tombstonesSave(Object.keys(ts).map(u=>({uuid:u, at:ts[u]}))) || (newGuide && !myguideSave(newGuide))){
    rollback(); throw new Error('保存できませんでした（空き容量を確認してください）');
  }
  // recent(最近使った種)は端末ごとでよいので同期しない
  try{ rescanLocalData(); }catch(e){}   // 取り込んだ結果でホームの警告カードを最新にする
  return changed;
}
// ドライブから未読の同期ファイルを全部取り込み、足りない写真・録音も取り込む。
// 順序は必ず「記録が先→メディアが後」（逆にすると、起動時の掃除(mediaGcAll)が
// 「どの記録も参照していないblob」と誤判定して消す恐れがある）
async function gdrivePullAll(files, token){
  if(!writeAllowed()) throw new Error('起動時の確認が終わるまで同期できません');
  return gdriveSerial(async ()=>{
    const targets=files || unseenSyncFiles(await gdriveListSyncFiles(token));
    if(!targets.length) return null;
    let changed=0, skipped=0, lastErr=null;
    for(const f of targets){
      // ファイル単位で検証・取り込み。壊れたファイル（修復前の端末が上げた等）はそのファイルだけスキップし、
      // 他の端末の正常な保存まで巻き添えで止めない。既読にはしない（相手が修復すれば次回取り込める）
      let txt;
      try{ txt=await (await gdriveFetchRaw('drive/v3/files/'+f.id+'?alt=media', token)).text(); }
      catch(e){ skipped++; lastErr=e; continue; }   // 通信の失敗は印を付けず、次回そのまま再試行
      // ここから先の失敗は「ファイルの中身の異常」なので不合格の印を付け、
      // 同じ版について確認・再取得を繰り返さない（相手が修復・更新すれば自動で再試行される）
      let d;
      try{
        // 記録のみの同期ファイルの上限（メディアは別ファイルなので正当なファイルはこの大きさに届かない）
        if(txt.length>20000000) throw new Error('同期ファイルが大きすぎます');
        d=JSON.parse(txt);
        validateBackupData(d);                      // 1ファイル内で1件でも不正ならそのファイルを拒否（例外）
      }catch(e){ skipped++; lastErr=e;
        syncInvalidMark(f.id, f.modifiedTime||'');
        continue; }
      try{
        changed+=mergeRemoteRecords(d);
        syncSeenMark(f.id, f.modifiedTime||'');     // 1ファイル取り込むごとに既読化（途中失敗でも続きから）
      }catch(e){ skipped++; lastErr=e; }            // 保存失敗（容量等）は印を付けない（データは正常なため）
    }
    if(skipped===targets.length && lastErr) throw lastErr;   // 全滅なら従来どおり失敗として知らせる
    const md=await gdrivePullMedia(token, {}).catch(()=>({done:0,miss:0}));
    return {changed, media:md, skipped};
  });
}
// 起動時：別端末からの新しい保存が無いか確認して、あれば取り込みを提案する（サインイン中だけ・失敗は静かに）。
// 新着が無くても、過去に取りこぼした写真・録音があれば静かに再取得する
async function gdriveStartupCheck(){
  try{
    if(!gdriveCfg().clientId || !gdriveSignedIn()) return;
    const token=await gdriveGetToken(false);
    const targets=unseenSyncFiles(await gdriveListSyncFiles(token))
      .filter(f=>!syncInvalidHas(f.id, f.modifiedTime));   // 検査不合格の同じ版は繰り返し聞かない（手動同期では再試行できる）
    let pulledNow=false;
    const declined=localStorage.getItem('bs_sync_declined')||'';
    const mark=targets.map(f=>f.id+'@'+f.modifiedTime).sort().join(',');
    if(targets.length && declined!==mark){   // 前回断られた同じ内容は繰り返し聞かない
      if(confirm('ドライブに新しいデータがあります（別の端末で保存された記録）。読み込みますか？\n※今の端末の記録は消えません。両方を比べて新しい方が残ります。')){
        toast('ドライブから読み込み中…');
        // ユーザーがOKした後の失敗は黙らず知らせる（確認前の通信エラー等は外側のcatchで静かに流す）
        try{
          const r=await gdrivePullAll(targets, token);
          if(r) toast(`ドライブから読み込みました：記録の取り込み${r.changed}件／写真・録音${r.media.done}件`
            +(r.skipped?`（${r.skipped}ファイルは壊れているためスキップ。保存した端末での点検・修復が必要です）`:''), r.skipped?6000:4000);
          pulledNow=true;
          // 取り込み中に入力・録音・音声認識を始めていたら画面を作り直さない（未保存の内容・聞き取りが消えるため）
          if(!hasUnsaved()) reset('home');   // 開いていない個体の書きかけも見る（監査1巡目 Critical）
        }catch(e){ toast('読み込みに失敗しました: '+(e.message||e)); }
      }else{
        // 既読にはしない（既読は「取り込み済み」の意味。断られた印だけ残す）。
        // 各端末は自分専用ファイルにしか書かないので、取り込まなくても他端末のデータが消えることはない
        try{ localStorage.setItem('bs_sync_declined', mark); }catch(e){}
      }
    }
    // 取り込みの有無にかかわらず、過去に取りこぼした写真・録音（通信失敗・相手が後からアップロードした分）を再取得
    //（直前に取り込んだ場合はその中で取得済みなので省略）
    if(!pulledNow){
      const md=await gdrivePullMedia(token, {}).catch(()=>null);
      if(md && md.done){ toast(`写真・録音${md.done}件を取り込みました`+(md.miss?`（あと${md.miss}件は相手の端末の同期待ち）`:''));
        renderQuiet(); }   // 入力・録音・音声認識中は画面を作り直さない（未保存の内容が消えるため）
    }
  }catch(e){ try{ console.error('sync check failed', e); }catch(_){} }
}

/* ---------- 図鑑・資料PDFの手動同期（libraryフォルダ） ----------
   資料PDF(RefDB)と図鑑切り抜き画像(PhotoDB＋bs_myguideのsource:'guide')は自動同期に含めない
   （容量が大きい・市販図鑑の私的利用の建付けを保つため）。手動ボタンで自分のドライブとだけ受け渡す。
   blobだけでは一覧を復元できないため、目録 birdsurvey_library_latest.json（メタ）とセットで運ぶ */
async function gdriveEnsureLibraryFolder(parentId, token){
  const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='library' and '"+parentId+"' in parents and trashed=false");
  const url='drive/v3/files?spaces=drive&orderBy='+encodeURIComponent('createdTime')+'&fields=files(id)&q='+q;
  const list=await gdriveFetch(url, {}, token);
  if(list.files && list.files.length) return list.files[0].id;
  const created=await gdriveFetch('drive/v3/files?fields=id', { method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ name:'library', mimeType:'application/vnd.google-apps.folder', parents:[parentId] }) }, token);
  const again=await gdriveFetch(url, {}, token);   // 作成直後に再検索して最古を採用（2端末同時作成でも収束）
  return (again.files && again.files.length) ? again.files[0].id : created.id;
}
// フォルダ内一覧 name→{id, size}。sizeは空ファイル（アップロード中断の残骸）の検出に使う
async function gdriveListLibraryFiles(folderId, token){
  const byName=Object.create(null); let pageToken='';
  do{
    const q=encodeURIComponent("'"+folderId+"' in parents and trashed=false");
    const res=await gdriveFetch('drive/v3/files?spaces=drive&pageSize=1000&fields=nextPageToken,files(id,name,size)&q='+q
      +(pageToken?('&pageToken='+encodeURIComponent(pageToken)):''), {}, token);
    (res.files||[]).forEach(f=>{ byName[f.name]={ id:f.id, size:Number(f.size||0) }; });
    pageToken=res.nextPageToken||'';
  }while(pageToken);
  return byName;
}
function buildLibraryManifest(){
  return { app:'bird_survey', kind:'library', version:1, exported_at:nowISO(),
    refdocs:refdocList(), guides:myguideList().filter(g=>g&&g.source==='guide') };
}
function libGuideFileName(g){ return 'guide_'+g.ref_id+(g.ext?('.'+String(g.ext).replace(/^\./,'')):''); }
// 目録の厳格検証。id/種別/拡張子/MIME/日時/サイズまで確認し、1箇所でも不正なら全体拒否
//（kindや日時の細工は図鑑表示のXSSや「常に最新扱い」による正常画像の追い出しにつながるため）
function validateLibraryManifest(d){
  const bad=msg=>{ throw new Error('ドライブ上の図鑑・資料の目録が不正です（'+msg+'）'); };
  const isPlain=x=>x && typeof x==='object' && !Array.isArray(x);
  const idOk=v=>typeof v==='string' && /^[\w-]+$/.test(v);
  const extOk=v=>v==null || (typeof v==='string' && /^[A-Za-z0-9]{1,5}$/.test(v));
  const mimeOk=v=>v==null || v==='' || (typeof v==='string' && /^[\w.+-]+\/[\w.+-]+$/.test(v));
  const timeOk=v=>v==null || (typeof v==='string' && !isNaN(Date.parse(v)));
  const sizeOk=v=>v==null || (typeof v==='number' && isFinite(v) && v>=0);
  if(!isPlain(d) || d.app!=='bird_survey' || d.kind!=='library') bad('種別');
  if(d.version!==1) bad('版');
  if(!Array.isArray(d.refdocs) || !Array.isArray(d.guides)) bad('形式');
  if(d.refdocs.length>1000 || d.guides.length>5000) bad('件数');
  for(const r of d.refdocs){ if(!isPlain(r) || !idOk(r.id) || typeof r.name!=='string' || r.name.length>300
    || !sizeOk(r.size) || !timeOk(r.created_at)) bad('資料の要素'); }
  for(const g of d.guides){ if(!isPlain(g) || !idOk(g.id) || !idOk(g.ref_id) || g.source!=='guide'
    || (g.kind!=='photo' && g.kind!=='video') || typeof (g.species_name||'')!=='string' || String(g.species_name||'').length>100
    || !extOk(g.ext) || !mimeOk(g.mime) || !sizeOk(g.size) || !timeOk(g.created_at)) bad('図鑑の要素');
    // MIMEと種別の対応（写真にvideo/等が紛れない）
    if(g.mime && g.kind==='photo' && !/^image\//.test(g.mime)) bad('図鑑のMIME');
    if(g.mime && g.kind==='video' && !/^video\//.test(g.mime)) bad('図鑑のMIME'); }
  return true;
}
// 2つの目録をid単位の和集合に（アップロード時、他端末が上げた分を目録から消さないため）。壊れた側は無視
function unionLibraryManifests(a, b){
  try{ validateLibraryManifest(b); }catch(e){ return a; }
  const out={ app:'bird_survey', kind:'library', version:1, exported_at:nowISO(),
    refdocs:a.refdocs.slice(), guides:a.guides.slice() };
  const rIds=new Set(out.refdocs.map(r=>r.id)); b.refdocs.forEach(r=>{ if(!rIds.has(r.id)) out.refdocs.push(r); });
  const gIds=new Set(out.guides.map(g=>g.id)); b.guides.forEach(g=>{ if(!gIds.has(g.id)) out.guides.push(g); });
  return out;
}
// 目録のメタを端末に追加する（追加のみ・既存は消さない）。blobより先に保存する
//（起動時の掃除mediaGcAllに、後から入れるblobが消されないため）。同一種の整理はblob取得後に別途行う
function mergeLibraryManifestAdd(d){
  validateLibraryManifest(d);
  const cur=refdocList(); const have=new Set(cur.map(r=>r.id));
  const merged=cur.slice();
  d.refdocs.forEach(r=>{ if(!have.has(r.id)) merged.push({ id:r.id, name:String(r.name), size:r.size, created_at:r.created_at }); });
  if(!refdocSave(merged)) throw new Error('保存できませんでした（空き容量を確認してください）');
  const guide=myguideList(); const gHave=new Set(guide.map(g=>g&&g.id));
  let changed=false;
  d.guides.forEach(g=>{ if(!gHave.has(g.id)){ guide.push(g); changed=true; } });
  if(changed && !myguideSave(guide)){
    refdocSave(cur);   // 片方だけ進んだ状態を残さない（戻せなかった場合は次の起動点検で拾われる）
    throw new Error('保存できませんでした（空き容量を確認してください）');
  }
}
// 同一種のsource:'guide'を「実体が端末にある最新の1件」に整理する。
// 実体の取得に失敗した種は古い画像とメタをそのまま残す（新メタだけ残して旧を消すと、掃除で旧画像まで消えて全滅するため）
async function libFinalizeGuides(){
  const guide=myguideList();
  const bySp=Object.create(null);
  guide.forEach(g=>{ if(g && g.source==='guide'){ const k=g.species_name||''; (bySp[k]=bySp[k]||[]).push(g); } });
  const drop=new Set();
  const tv=g=>{ const n=Date.parse(g.created_at||''); return isNaN(n)?0:n; };   // 表記ゆれに左右されない数値時刻で比較
  for(const sp in bySp){
    const arr=bySp[sp].slice().sort((a,b)=>tv(b)-tv(a));
    if(arr.length<2) continue;
    let keepIdx=-1;
    for(let i=0;i<arr.length;i++){ const rec=await PhotoDB.get(arr[i].ref_id).catch(()=>null);
      if(rec && rec.blob && rec.blob.size>0){ keepIdx=i; break; } }
    if(keepIdx<0) continue;   // どれも実体なし→整理せず次回の取得に賭ける
    // 実体を持つ最新の1件より「古いもの」だけ整理する。より新しい実体待ちメタは残す（次回取得で置き換わる）
    for(let i=keepIdx+1;i<arr.length;i++) drop.add(arr[i].id);
  }
  if(drop.size) myguideSave(myguideList().filter(g=>!(g && drop.has(g.id))));
}
// 手動アップロード: 目録＋ドライブに無い実体だけを送る（差分はドライブの一覧との突き合わせで判定）
async function gdriveUploadLibrary(){
  if(!gdriveCfg().clientId){ toast('先にクライアントIDを設定してください'); return; }
  if(!confirm('図鑑・資料PDFは容量が大きいことがあるため、Wi-Fi接続でのアップロードをおすすめします。続けますか？\n（送り先は自分のGoogleドライブだけで、公開はされません）')) return;
  try{
    const wasSignedIn=gdriveSignedIn();
    const token=await gdriveGetToken(true);
    if(!wasSignedIn && !await gdriveConfirmOwner(token)){ toast('アカウントの確認に失敗したため中止しました'); return; }
    const local=buildLibraryManifest();
    if(!local.refdocs.length && !local.guides.length){ toast('アップロードする図鑑・資料がありません'); return; }
    toast('図鑑・資料をアップロード中…');
    const r=await gdriveSerial(async ()=>{
      const parentId=await gdriveEnsureFolder(token);
      const folderId=await gdriveEnsureLibraryFolder(parentId, token);
      const files=await gdriveListLibraryFiles(folderId, token);
      // ドライブ上の既存目録と合体してから上げる（他端末がアップした分を目録から消さないため）。
      // 既存目録が壊れていて読めない場合は、実体だけ上げて目録の更新は見送る（他端末分を上書きで消さない）
      let man=local, manBlocked=false;
      const remote=files['birdsurvey_library_latest.json'];
      if(remote){
        try{
          const rd=await (await gdriveFetchRaw('drive/v3/files/'+remote.id+'?alt=media', token)).json();
          validateLibraryManifest(rd);
          man=unionLibraryManifests(local, rd);
        }catch(e){ manBlocked=true; }
      }
      const jobs=[];
      local.refdocs.forEach(m=>jobs.push({ name:'refdoc_'+m.id+'.pdf', size:(typeof m.size==='number'?m.size:null), get:()=>RefDB.get(m.id), mime:'application/pdf' }));
      local.guides.forEach(g=>jobs.push({ name:libGuideFileName(g), size:(typeof g.size==='number'?g.size:null), get:()=>PhotoDB.get(g.ref_id), mime:g.mime||'' }));
      // 未アップ・空ファイル（中断の残骸）・サイズ不一致は上げ直す
      const todo=jobs.filter(j=>{ const f=files[j.name];
        return !f || !(f.size>0) || (j.size!=null && f.size!==j.size); });
      let done=0, skip=0;
      for(const j of todo){
        const rec=await j.get().catch(()=>null);
        if(!rec || !rec.blob || !(rec.blob.size>0)){ skip++; continue; }   // 実体がこの端末に無い分は送れない
        await gdriveUploadBlob(folderId, j.name, rec.blob, j.mime||rec.blob.type||'application/octet-stream', token);
        done++; try{ toast(`図鑑・資料をアップロード中… ${done}/${todo.length}`); }catch(e){}
      }
      // 目録は全実体を確認でき、既存目録も正常なときだけ更新（壊れた状態や欠けた項目を固定しない）
      if(!skip && !manBlocked){ validateLibraryManifest(man); await gdriveUpsertFile(folderId, 'birdsurvey_library_latest.json', JSON.stringify(man), token); }
      return { done, already:jobs.length-todo.length, skip, manBlocked };
    });
    let msg;
    if(r.manBlocked){ msg='ドライブ上の目録が壊れているため目録は更新しませんでした'+(r.done?`（実体${r.done}件はアップロード済み）`:''); }
    else if(r.skip){ msg=`${r.skip}件の実体を確認できなかったため、目録は更新しませんでした`+(r.done?`（${r.done}件はアップロード済み）`:''); }
    else if(r.done){ msg=`図鑑・資料${r.done}件をアップロードしました`+(r.already?`（${r.already}件はアップ済み）`:''); }
    else{ msg='すべてアップロード済みです'; }
    toast(msg, 4000); renderQuiet();
  }catch(e){ toast('アップロード失敗: '+(e.message||e)); }
}
// 手動ダウンロード: 目録を取り込んでから、実体が無い分だけ受け取る
async function gdrivePullLibrary(){
  if(!writeAllowed()) return;
  if(!gdriveCfg().clientId){ toast('先にクライアントIDを設定してください'); return; }
  if(!confirm('図鑑・資料PDFは容量が大きいことがあるため、Wi-Fi接続でのダウンロードをおすすめします。続けますか？')) return;
  try{
    const wasSignedIn=gdriveSignedIn();
    const token=await gdriveGetToken(true);
    if(!wasSignedIn && !await gdriveConfirmOwner(token)){ toast('アカウントの確認に失敗したため中止しました'); return; }
    toast('図鑑・資料を確認中…');
    const r=await gdriveSerial(async ()=>{
      const parentId=await gdriveEnsureFolder(token);
      const folderId=await gdriveEnsureLibraryFolder(parentId, token);
      const files=await gdriveListLibraryFiles(folderId, token);
      const man=files['birdsurvey_library_latest.json'];
      if(!man) return null;
      const d=await (await gdriveFetchRaw('drive/v3/files/'+man.id+'?alt=media', token)).json();
      mergeLibraryManifestAdd(d);                     // 1) メタを先に「追加のみ」で保存（既存は消さない）
      const jobs=[];                                  // 2) 実体が無い分だけダウンロード
      refdocList().forEach(m=>jobs.push({ name:'refdoc_'+m.id+'.pdf', size:(typeof m.size==='number'?m.size:null),
        has:()=>RefDB.get(m.id), put:blob=>RefDB.put({ id:m.id, blob }) }));
      myguideList().filter(g=>g&&g.source==='guide').forEach(g=>jobs.push({ name:libGuideFileName(g),
        size:(typeof g.size==='number'?g.size:null),
        has:()=>PhotoDB.get(g.ref_id),
        put:blob=>PhotoDB.put({ id:g.ref_id, kind:g.kind||'photo', mime:g.mime||blob.type, ext:g.ext,
          size:blob.size, name:'', obs_uuid:'', created_at:g.created_at||nowISO(), blob }) }));
      let done=0, miss=0;
      for(const j of jobs){
        const rec=await j.has().catch(()=>null);
        if(rec && rec.blob && rec.blob.size>0) continue;
        const f=files[j.name];
        if(!f || !(f.size>0)){ miss++; continue; }    // 相手がまだ上げていない／中断の残骸（空ファイル）は取らない
        if(j.size!=null && f.size!==j.size){ miss++; continue; }   // 目録のサイズと不一致（不完全ファイル）は取らない
        let blob=null; try{ blob=await (await gdriveFetchRaw('drive/v3/files/'+f.id+'?alt=media', token)).blob(); }catch(e){ miss++; continue; }
        if(!(blob.size>0) || (j.size!=null && blob.size!==j.size)){ miss++; continue; }
        try{ await j.put(blob); }catch(e){ miss++; continue; }    // 保存失敗（容量不足等）は数えて続行
        done++; try{ toast(`図鑑・資料をダウンロード中… ${done}件`); }catch(e){}
      }
      // 3) 同一種の図鑑画像を「実体がある最新1件」に整理（実体を取れなかった種は旧画像を残す）→ 不要になった実体を掃除
      await libFinalizeGuides();
      mediaGcAll().catch(()=>{});
      return { done, miss };
    });
    if(!r){ toast('ドライブに図鑑・資料がまだありません（先に相手の端末でアップロードしてください）', 4000); return; }
    let msg=r.done?`図鑑・資料${r.done}件を取り込みました`:'新しく取り込む図鑑・資料はありません';
    if(r.miss) msg+=`（${r.miss}件は未取得。相手の端末でアップロード後にもう一度）`;
    toast(msg, 4000); renderQuiet();
  }catch(e){ toast('ダウンロード失敗: '+(e.message||e)); }
}

const APPS_SCRIPT_CODE = `// 鳥類調査記録アプリ バックアップ受け皿（Google Apps Script）
// TOKEN を好きな合言葉に変え、デプロイ→ウェブアプリ（実行:自分／アクセス:全員）→URLをアプリに貼る

// 取り込むデータのID類が安全な文字だけか検証（細工バックアップによるXSS/破壊を防ぐ）
// null/undefined（省略）は許容。値がある場合は必ず「文字列 かつ 安全な文字だけ」でなければ弾く。
// （旧実装は typeof!=='string' を無条件で安全扱いしており、配列を渡すと検査を素通りできた）
function safeId(v){ return v==null || (typeof v==='string' && /^[\w-]*$/.test(v)); }
// ID に加えて日時も検査する。ここを緩くすると、取込では保存できるのに他端末のドライブ同期
// （validateBackupData）が拒否し続ける状態を作れてしまうため、同期側と同じ厳しさで揃える。
// ・業務日時（観察日時など）: 壊れたまま取り込むと書き出し（CSV/GeoJSON）にそのまま出る
// ・管理用日時（created_at 等）: 壊れた値は文字列比較で常に最新扱いになり同期を壊す
function importIdsOk(d){
  // 6種類の記録は同期側と同じ okRecord で検査する
  for(const name of ['surveys','observations','notes','hypotheses','hyp_results','flights']){
    const a=d[name]; if(a==null) continue;
    if(!Array.isArray(a)) return false;
    for(const x of a){ if(!okRecord(name, x)) return false; }
  }
  // マイ図鑑も同期側と同じ関数で
  if(d.myguide!=null){
    if(!Array.isArray(d.myguide)) return false;
    for(const g of d.myguide){ if(!okGuideItem(g)) return false; }
  }
  // 実体（音声・写真）。IDが無い/空の要素は実体を保存できず参照だけが残るので弾く。
  // ※ここは同期用データには無く、JSONバックアップにだけある項目（同期はメディアを別ファイルで持つ）
  for(const a of [d.audio, d.media]){ if(a==null) continue;
    if(!Array.isArray(a)) return false;
    for(const m of a){

    c.total=raw.length;
    const seen=new Set();
    // 参照先の実在確認（形式は正常なのに親が見つからない記録は「情報」として知らせる。
    // 他端末にだけ親がある正常な状態もあり得るため、自動修復はしない）
    const refField = name==='hyp_results' ? 'hypothesis_uuid' : (name!=='surveys' ? 'survey_uuid' : null);
    const parentName = name==='hyp_results' ? 'hypotheses' : 'surveys';
    let dangling=0;
    for(const x of raw){
      const issues=recordIssues(name,x);
      if(issues.length){ c.bad++; issues.forEach(f=>{ c.fields[f]=(c.fields[f]||0)+1; }); }
      if(x && typeof x==='object' && typeof x.uuid==='string' && x.uuid){
        if(seen.has(x.uuid)) c.dupes++;
        else{ seen.add(x.uuid);
          if(uuidOwner[x.uuid] && uuidOwner[x.uuid]!==label)
            res.info.push(`同じ記録ID（${x.uuid.slice(0,8)}…）が「${uuidOwner[x.uuid]}」と「${label}」の両方にあります。完全削除が両方に効くため注意（自動修復はしません）`);
          else uuidOwner[x.uuid]=label; }
      }
      if(refField && uuidSets[parentName] && x && typeof x==='object'
        && typeof x[refField]==='string' && x[refField] && safeId(x[refField])
        && !uuidSets[parentName].has(x[refField])) dangling++;
    }
    uuidSets[name]=seen;
    if(dangling) res.info.push(`${label}: 参照先の${parentName==='surveys'?'調査':'仮説'}が見つからない記録が${dangling}件あります（他の端末に親の記録がある場合は同期で解消します）`);
    res.problems += c.bad + c.dupes;
  }
  for(const [name,key,label] of SCAN_AUX){
    const a={ label, key, state:'ok', bad:0 };
    res.aux[name]=a;
    let raw;
    try{ raw=DB.loadRaw(key); }
    catch(e){ a.state='unreadable'; res.problems++; continue; }
    if(!Array.isArray(raw)){ a.state='nonarray'; res.problems++; continue; }
    if(name==='tombstones') a.bad=raw.filter(t=>!okTombstone(t)).length;
    else if(name==='myguide') a.bad=raw.filter(g=>g==null || typeof g!=='object' || Array.isArray(g) || !okGuideItem(g)).length;
    else a.bad=raw.filter(s=>typeof s!=='string').length;
    res.problems+=a.bad;
  }
  return res;
}

// 修復案を計算する（この時点では何も保存しない）。メディア実体の有無を調べるため async。
// 日時は捏造しない方針: 壊れた管理用日時は「削除」して古い扱いにする。nowISO()を入れると
// 修復した劣化版が他端末に残る正常版へ文字列比較で勝ってしまい、正しいデータを潰すため。
async function buildRepairPlan(){
  const plan={ cols:{}, tombstones:null, myguide:null, recent:null,
    actions:[], buried:[], mediaMoves:[], baseline:{} };
  // 計算開始時点の生文字列を控える。適用直前に一致を確認し、計算中（メディア確認のawait中や
  // 確認ダイアログ待ちの間）に同期・保存で内容が変わっていたら適用せず中止する（古い修復案での上書き防止）
  REPAIR_KEYS.forEach(k=>{ plan.baseline[k]=localStorage.getItem(k); });
  const acts=Object.create(null);
  const act=msg=>{ acts[msg]=(acts[msg]||0)+1; };
  // 元の値を記録内に控える（同期・取込・書き出しは repair_note を見ないため安全に持ち回れる）
  const showVal=v=>{ let s; try{ s=JSON.stringify(v); }catch(e){ s=String(v); }
    s=String(s==null?'':s); return s.length>120 ? s.slice(0,120)+'…' : s; };
  const note=(x,msg)=>{ x.repair_note=repairNoteAdd(x.repair_note, msg); };   // 上限でも新しい理由を必ず残す

  // 1周目: 読める区分を集め、壊れた記録IDを振り直して旧値→新値の対応表を作る
  const data={};                        // name -> {key,label,arr,changed}
  // 対応表はコレクション別（uuidMap[コレクション名][旧値] -> [新uuid,...]）。
  // 全種類共通にすると、偶然同じ旧IDを持つ別種類の記録へ誤ってつなぎ直す恐れがある。
  // 同じ旧値が同一コレクションに複数あると一意に決められないため、つなぎ直しはしない
  const uuidMap={};
  const lowered=new Set();              // 修復で「新しさ」が下がった記録（墓標に負けて消える警告の対象）
  for(const [name,key,label] of SCAN_COLS){
    let raw;
    try{ raw=DB.loadRaw(key); }catch(e){ continue; }   // 読取不能はここでは触らない（個別の「空にする」で対応）
    if(!Array.isArray(raw)){
      if(raw && typeof raw==='object'){
        // 中身を取り出して一覧に直し、壊れた記録はこのあとの通常修復に回す
        data[name]={key,label,arr:Object.values(raw),changed:true};
        act(`${label}: 入れ物が一覧の形でなかったため直しました`);
      }
      continue;                                        // 文字列・数値など救出できない非配列は個別対応
    }
    data[name]={key,label,arr:raw,changed:false};      // loadRawは毎回新しく読むため、この配列を直接直してよい
  }
  // 上限を超える巨大な記録は、どの項目を削れば安全か機械では判断できないため最初に除去する
  //（正当な記録はこの大きさに届かない。原本は修復前の控えファイルに丸ごと残る）。
  // ID振り直し・実在親の集合（liveIds）・重複整理のどれよりも先に行う。後で除去すると、
  // 「巨大な親を実在すると判定して子をつなぎ、その後に親だけ消えて参照切れになる」不整合や、
  // 「巨大な新しい重複が正常な古い記録を潰してから自分も消える」二重消失が起こる
  for(const name in data){ const d=data[name];
    const before=d.arr.length;
    d.arr=d.arr.filter(x=>{ try{ return JSON.stringify(x).length<=REC_JSON_MAX; }catch(e){ return false; } });
    if(d.arr.length!==before){ d.changed=true;
      for(let i=0;i<before-d.arr.length;i++) act(`${d.label}: 大きすぎて保存領域を圧迫する記録を除去しました（原本は控えファイルにあります）`); }
  }
  for(const name in data){ const d=data[name];
    for(const x of d.arr){
      if(!x || typeof x!=='object' || Array.isArray(x)) continue;   // 除去は2周目で
      if(!okUuid(x.uuid)){
        const nu=uuid();
        // 旧値は文字列・数値とも対応表に載せる（数値ID時代の親子関係も参照のつなぎ直しで維持するため）。
        // キーは型付き（'s:'=文字列 / 'n:'=数値）。数値親 123 と文字列親 "123" が共存しても参照を取り違えないため
        const tk=(typeof x.uuid==='string' && x.uuid!=='') ? 's:'+x.uuid
          : (typeof x.uuid==='number' && isFinite(x.uuid)) ? 'n:'+String(x.uuid) : null;
        if(tk!=null){ const m=(uuidMap[name]||(uuidMap[name]=Object.create(null)));
          (m[tk]||(m[tk]=[])).push(nu); }
        note(x,'記録IDが不正だったため振り直し（元の値: '+showVal(x.uuid)+'）');
        x.uuid=nu; d.changed=true;
        act(`${d.label}: 記録IDを振り直しました`);
      }
    }
  }

  // つなぎ直しの前に、現時点で実在する親のuuid集合を作る。
  // 対応表より実在する親を優先することで、「正常な親 "123" と数値IDの親 123 が同じ区分に共存」した場合でも、
  // 正しい親につながっている参照を対応表の偶然一致で別の親へ付け替えない
  const liveIds={};
  for(const pn of ['surveys','hypotheses']){
    if(data[pn]) liveIds[pn]=new Set(data[pn].arr.filter(x=>x && typeof x==='object').map(x=>x.uuid));
  }

  // 2周目: 記録ごとの修復
  const canOrphan = !!data.surveys;   // 調査の区分が読めないときは受け皿を作れない
  let needOrphanParent=false;
  for(const name in data){ const d=data[name];
    const before=d.arr.length;
    d.arr=d.arr.filter(x=>x && typeof x==='object' && !Array.isArray(x));
    if(d.arr.length!==before){ d.changed=true;
      for(let i=0;i<before-d.arr.length;i++) act(`${d.label}: 記録の形をしていない要素を除去しました`); }
    for(const x of d.arr){
      // 修復メモ自体が不正（非文字列・上限超え）なら先に整える（このあと note() で追記するため）
      if(!(x.repair_note==null || (typeof x.repair_note==='string' && x.repair_note.length<=REPAIR_NOTE_MAX))){
        d.changed=true;
        x.repair_note=(typeof x.repair_note==='string' ? x.repair_note : showVal(x.repair_note)).slice(0,REPAIR_NOTE_MAX-1)+'…';
        act(`${d.label}: 長すぎる修復メモを切り詰めました`);
      }
      // 参照ID（旧ID・調査/仮説への参照・図鑑参照）
      for(const f of REF_ID_FIELDS){
        const v=x[f];
        const relational=(f==='survey_uuid' || f==='hypothesis_uuid');
        // 調査・仮説への参照のつなぎ直し。id/ref_id は記録間の参照ではないため対象外（偶然の一致で書き換えない）
        if(relational){
          const pn=(f==='survey_uuid') ? 'surveys' : 'hypotheses';
          const pm=uuidMap[pn];
          // 「候補なし(null)」「一意({id})」「複数({many})」を区別する。同じ型の候補が複数あるのに
          // 次の手段へ進むと、つなぎ先を決められない参照を偶然同じ値の別型の親へ誤接続してしまう。
          // 複数のときは未解決として扱う（受け皿・解除、または形式が正常なら現状維持）
          const pick=k=>{ const a=pm && pm[k]; if(!a || !a.length) return null;
            return a.length===1 ? {id:a[0]} : {many:true}; };
          if(typeof v==='number' && isFinite(v)){
            const s=String(v);
            // 数値参照: まず「旧IDが数値だった親」の振り直し先（型の由来が一致する方が本来の親）。
            // 候補が無い場合に限り、同じ値の文字列IDの親が実在するならそこへ（数値→文字列化のみで接続が保てる）
            const r=pick('n:'+s);
            if(r){ if(r.id){ x[f]=r.id; d.changed=true;
              act(`${d.label}: ${FIELD_LABELS[f]}を振り直し後のIDへつなぎ直しました`); continue; } }
            else if(liveIds[pn] && liveIds[pn].has(s)){ x[f]=s; d.changed=true;
              act(`${d.label}: ${FIELD_LABELS[f]}が数値だったため文字列にしました（実在する親につなぎ直し）`); continue; }
          }else if(typeof v==='string' && v!==''){
            // 文字列参照: 実在する親が最優先（正しくつながっている参照を対応表の偶然一致で書き換えない）。
            // 実在しない場合のみ対応表でつなぎ直す（旧IDが文字列だった親を先に、その候補が皆無のときだけ数値だった親）。
            // 参照の形式が正常でも旧IDと同じ値（例: 数値ID時代の親 123 を参照する "123"）はつなぎ直しの対象
            if(liveIds[pn] && liveIds[pn].has(v)) continue;   // 実在する親のIDは振り直し後の正常なIDなのでそのまま
            const rs=pick('s:'+v);
            if(rs){ if(rs.id){ if(x[f]!==rs.id){ x[f]=rs.id; d.changed=true;
              act(`${d.label}: ${FIELD_LABELS[f]}を振り直し後のIDへつなぎ直しました`); } continue; } }
            else{ const rn=pick('n:'+v);
              if(rn && rn.id){ x[f]=rn.id; d.changed=true;
                act(`${d.label}: ${FIELD_LABELS[f]}を振り直し後のIDへつなぎ直しました`); continue; } }
          }
        }
        if(safeId(v)) continue;
        d.changed=true;
        // 数値の参照でも、調査・仮説への参照でつなぎ直せなかったものは単純な文字列化をしない
        //（"123" のような「形式は正常だがどこにもつながらない」参照を作らず、受け皿・解除へ回す）
        if(typeof v==='number' && isFinite(v) && !relational){ x[f]=String(v);
          act(`${d.label}: ${FIELD_LABELS[f]}が数値だったため文字列にしました`); continue; }
        note(x, FIELD_LABELS[f]+'が不正（元の値: '+showVal(v)+'）');
        if(f==='survey_uuid' && name!=='surveys' && canOrphan){
          x.survey_uuid=REPAIR_ORPHAN_UUID; needOrphanParent=true;
          act(`${d.label}: 調査への参照が壊れていたため「（修復）元の調査が不明な記録」へ移しました`); }
        else{ x[f]=null;
          act(`${d.label}: ${FIELD_LABELS[f]}が不正だったため外しました`); }
      }
      // 管理用日時（作成・更新）: 壊れていたら削除（マージは 更新日時→作成日時→最弱 の順で自然に判断する）
      for(const f of ['created_at','updated_at']){
        if(okTime(x[f])) continue;
        d.changed=true; lowered.add(x);
        note(x, FIELD_LABELS[f]+'が不正（元の値: '+showVal(x[f])+'）');
        delete x[f];
        act(`${d.label}: ${FIELD_LABELS[f]}が不正だったため外しました`);
      }
      // 削除日時: 不正ならフィールドを外して「生きている」扱いに戻す（削除日時を捏造しない）。
      // 現在時刻を入れて削除済み扱いを保つ案は、マージ判定（updated_at基準）を更新しない限り
      // 他端末の生存版に負けて復活し「直したつもりで直っていない」状態を作る。かといって
      // updated_at まで現在時刻にすると、他端末の正しい生存版を修復側の削除が潰す。
      // どちらも危険なため復元を選び、利用者に「不要なら削除し直して」と知らせる（黙って消さない原則とも一致）
      if(!okTime(x.deleted_at)){
        d.changed=true;
        note(x,'削除日時が不正（元の値: '+showVal(x.deleted_at)+'）');
        const wasTrash=!!x.deleted_at;
        delete x.deleted_at;
        act(wasTrash ? `${d.label}: 削除日時が壊れていたため、ごみ箱の記録を復元しました（不要なら削除し直してください）`
                     : `${d.label}: 空の削除日時を外しました（記録は残ります）`);
      }
      // 座標の対（観察者・鳥がいた場所・巣）: 片方だけ・範囲外は書き出しで黙って落ちるため、
      // ここで対ごと空にそろえ、元の値は記録内に控える
      for(const [la,lo] of [['latitude','longitude'],['target_latitude','target_longitude'],['nest_latitude','nest_longitude']]){
        if(x[la]==null && x[lo]==null) continue;
        const a=coordStr(x[la]), b=coordStr(x[lo]);
        if(a==='' && b==='') continue;
        if(validLatLon(a,b)) continue;
        d.changed=true;
        note(x, '位置（'+la+'）が不正（元の値: '+showVal([x[la],x[lo]])+'）');
        x[la]=''; x[lo]='';
        act(`${d.label}: 位置が正しくなかったため空にしました（元の値は記録内に控えました）`);
      }
      // 業務日時（観察日時など）: 正しい値は推測できないため空にし、元の値は記録内に控える
      for(const f of (STAMP_FIELDS[name]||[])){
        if(okStamp(x[f])) continue;
        d.changed=true;
        note(x, FIELD_LABELS[f]+'が不正（元の値: '+showVal(x[f])+'）');
        x[f]='';
        act(`${d.label}: ${FIELD_LABELS[f]}を空にしました（元の値は記録内に控えあり）`);
      }
      // 録音・写真・動画の参照。観察は写真の欄が3つ（観察・環境・営巣木）
      for(const f of (name==='observations'
            ? ['audio','media','env_media','nest_media'] : ['audio','media'])){
        if(x[f]===undefined) continue;   // 古い記録には項目そのものが無い
        if(okMediaList(x[f])) continue;
        d.changed=true;
        if(!Array.isArray(x[f])){
          note(x, FIELD_LABELS[f]+'が一覧の形でない（元の値: '+showVal(x[f])+'）');
          delete x[f];
          act(`${d.label}: ${FIELD_LABELS[f]}が壊れていたため外しました`); continue;
        }
        const keep=[]; const seenIds=new Set();
        for(const m of x[f]){
          if(!m || typeof m!=='object' || Array.isArray(m)){
            act(`${d.label}: ${FIELD_LABELS[f]}の壊れた要素を除去しました`); continue; }
          if(!okUuid(m.id)){
            const store=(f==='audio')?'audio':'media';
            let moved=false;
            if(typeof m.id==='string' && m.id!==''){
              // 実体がこの端末にあれば、正しいIDへ付け直して実体ごと引き継ぐ（実体は消さない）
              const rec=await (store==='audio'?AudioDB:PhotoDB).get(m.id).catch(()=>null);
              if(rec && rec.blob){ const nid=uuid();
                plan.mediaMoves.push({store, oldId:m.id, newId:nid,
                  ownerType:(name==='flights'?'flight':'obs'), ownerUuid:x.uuid});
                m.id=nid; moved=true;
                act(`${d.label}: ${FIELD_LABELS[f]}のIDが不正だったため付け直しました（録音・写真の実体は保持）`); }
            }
            if(!moved){
              note(x, FIELD_LABELS[f]+'の不正な参照を除去（元の値: '+showVal(m.id)+'）');
              act(`${d.label}: 実体の無い${FIELD_LABELS[f]}を除去しました`); continue; }
          }
          for(const p of ['ext','mime','kind','name']){ if(m[p]!=null && typeof m[p]!=='string') delete m[p]; }
          if(seenIds.has(m.id)){ act(`${d.label}: 重複した${FIELD_LABELS[f]}を整理しました`); continue; }
          seenIds.add(m.id); keep.push(m);
        }
        x[f]=keep;
      }
    }
    // 同一IDの重複: 更新日時が最新の1件を残す（同期のマージと同じ収束結果になる）
    //（巨大記録は計算の最初に除去済みのため、ここで正常な記録が巨大な重複に潰されることはない）
    const byId=Object.create(null); const stamp=x=>String(x.updated_at||x.created_at||'');
    let dupCut=0, dupDiff=0;
    for(const x of d.arr){
      const cur=byId[x.uuid];
      if(!cur){ byId[x.uuid]=x; continue; }
      dupCut++; d.changed=true;
      let same=false; try{ same=JSON.stringify(cur)===JSON.stringify(x); }catch(e){}
      if(!same) dupDiff++;
      if(stamp(x)>stamp(cur)) byId[x.uuid]=x;
    }
    if(dupCut){ d.arr=Object.values(byId);
      act(`${d.label}: 同じ記録IDの重複を整理しました`+(dupDiff?`（内容が異なるものを含む。原本は控えファイルにあります）`:''));
    }
  }
  // 受け皿を使う条件: 今回の修復で孤児を移す場合に加え、過去の修復で受け皿を参照した記録が
  // 既にある場合も対象（受け皿だけが削除・墓標化されると、その孤児記録が二度と見えなくなるため）
  const usesOrphan = needOrphanParent || Object.keys(data).some(n=>
    n!=='surveys' && data[n].arr.some(x=>x.survey_uuid===REPAIR_ORPHAN_UUID));
  // 孤児記録の受け皿調査（まだ無ければ作る。削除済みで残っていたら復元する——受け皿が消えていると孤児が二度と見えなくなるため）
  if(usesOrphan && data.surveys){
    const ex=data.surveys.arr.find(s=>s.uuid===REPAIR_ORPHAN_UUID);
    if(!ex){
      data.surveys.arr.push({ uuid:REPAIR_ORPHAN_UUID, name:'（修復）元の調査が不明な記録',
        survey_date:'', status:'終了', created_at:nowISO(), updated_at:nowISO(),
        repair_note:'データ修復で元の調査が分からなくなった記録の受け皿' });
      data.surveys.changed=true;
      act('調査: 受け皿「（修復）元の調査が不明な記録」を作成しました');
    }else if(ex.deleted_at){
      delete ex.deleted_at; ex.updated_at=nowISO(); data.surveys.changed=true;
      act('調査: 削除されていた受け皿「（修復）元の調査が不明な記録」を復元しました');
    }
  }

  // 削除記録（墓標）の修復
  let liveUuids=null;
  const getLive=()=>{ if(liveUuids) return liveUuids; liveUuids=new Set();
    for(const n in data) data[n].arr.forEach(x=>liveUuids.add(x.uuid)); return liveUuids; };
  let tombsOut=null;
  try{
    const rawT=DB.loadRaw('bs_tombstones');
    const arr=Array.isArray(rawT)?rawT:[];
    let changed=!Array.isArray(rawT);
    if(changed) act('削除記録: 入れ物が壊れていたため作り直しました');
    const out=[];
    for(const t of arr){
      // 受け皿を使う修復では、受け皿宛ての削除記録を外す（残すと受け皿が同期で消され、孤児記録が見えなくなる）
      if(usesOrphan && t && t.uuid===REPAIR_ORPHAN_UUID){ changed=true;
        act('削除記録: 受け皿調査あての削除記録を解除しました'); continue; }
      if(okTombstone(t)){ out.push(t); continue; }
      changed=true;
      if(!t || typeof t!=='object' || Array.isArray(t) || !okUuid(t.uuid)){
        act('削除記録: 壊れた項目を除去しました'); continue; }
      // 日時だけが壊れている場合: 壊れた日時は文字列比較で常に「最新」となり、同じIDの生きた記録を
      // 同期のたびに消し続ける。記録が生きていれば墓標側を外し、無ければ完全削除の意図を維持する
      if(getLive().has(t.uuid)){ act('削除記録: 生きた記録を消し続ける壊れた削除記録を解除しました（記録は残ります）'); continue; }
      out.push({uuid:t.uuid, at:nowISO()});
      act('削除記録: 日時が壊れていたため現在時刻に直しました（完全削除のまま）');
    }
    if(changed) tombsOut=out;
  }catch(e){ tombsOut=[];
    act('削除記録: 読み取れなかったため空にしました（完全削除の伝達情報のみで、観察記録そのものは消えません）'); }
  plan.tombstones=tombsOut;

  // マイ図鑑の修復
  try{
    const rawG=DB.loadRaw('bs_myguide');
    const arr=Array.isArray(rawG)?rawG:[];
    let changed=!Array.isArray(rawG);
    if(changed) act('マイ図鑑: 入れ物が壊れていたため作り直しました');
    const out=[];
    for(const g of arr){
      if(g==null || typeof g!=='object' || Array.isArray(g)){ changed=true;
        act('マイ図鑑: 壊れた項目を除去しました（図鑑から再登録できます）'); continue; }
      for(const f of ['created_at','updated_at','deleted_at']){
        if(!okTime(g[f])){ delete g[f]; changed=true; act('マイ図鑑: 壊れた日時を外しました'); } }
      if(!okGuideItem(g)){ changed=true;
        act('マイ図鑑: 壊れた項目を除去しました（図鑑から再登録できます）'); continue; }
      out.push(g);
    }
    if(changed) plan.myguide=out;
  }catch(e){ plan.myguide=[];
    act('マイ図鑑: 読み取れなかったため空にしました（図鑑から再登録できます）'); }

  // 最近使った種の修復
  try{
    const rawR=DB.loadRaw(DB.key.recent);
    if(!Array.isArray(rawR)){ plan.recent=[]; act('最近使った種: 壊れていたため空にしました'); }
    else{ const out=rawR.filter(s=>typeof s==='string');
      if(out.length!==rawR.length){ plan.recent=out; act('最近使った種: 壊れた項目を除去しました'); } }
  }catch(e){ plan.recent=[]; act('最近使った種: 読み取れなかったため空にしました'); }

  // 修復で「新しさ」が下がった記録が、既存の削除記録（墓標）に負けて次回同期で消えないか事前に洗い出す。
  // 黙って消さない原則のため、該当があれば実行前の確認画面で必ず知らせる
  const ts=Object.create(null);
  (plan.tombstones || tombstonesList()).forEach(t=>{ ts[t.uuid]=t.at; });
  for(const name in data){ const d=data[name];
    for(const x of d.arr){
      if(!lowered.has(x)) continue;
      const at=ts[x.uuid];
      if(at && String(at)>=String(x.updated_at||x.created_at||'')){
        const label=(x.name||x.species_name_snapshot||'').toString().slice(0,20);
        plan.buried.push(`${d.label}: ${label || 'ID '+String(x.uuid).slice(0,8)+'…'}`);
      }
    }
  }

  for(const name in data){ const d=data[name]; if(d.changed) plan.cols[d.key]=d.arr; }
  plan.actions=Object.keys(acts).map(m=>acts[m]>1?`${m}（${acts[m]}件）`:m);
  return plan;
}

// 修復前の控え。localStorageの生文字列をそのまま保存する（JSONとして読めない状態でも原本を保全できる）
const REPAIR_KEYS = SCAN_COLS.map(c=>c[1]).concat(SCAN_AUX.map(a=>a[1]));
function downloadRepairRescue(){
  const raw={}; REPAIR_KEYS.forEach(k=>{ raw[k]=localStorage.getItem(k); });
  const d=new Date(); const p=n=>String(n).padStart(2,'0');
  download(`bird_survey_repair_backup_${dateValue().replace(/-/g,'')}_${p(d.getHours())}${p(d.getMinutes())}.json`,
    JSON.stringify({app:'bird_survey', kind:'repair_rescue', exported_at:nowISO(), app_version:APP_VERSION, raw}),
    'application/json');
}

// 修復案を実際に適用する。順序が重要:
// 1) メディア実体のコピー（先。途中で失敗したら中止——コピー済みの新実体は起動時の掃除が回収する）
// 2) localStorage一括保存（1つでも失敗したら全部巻き戻し）
// 3) 旧実体の削除と、アップ済み控えの旧ID掃除（失敗しても孤児として掃除される・実害なし）
async function applyRepairPlan(plan){
  if(!writeAllowed()) throw new Error('起動時の確認が終わるまで修復できません');
  // 点検時点から保存内容が変わっていないか確認（変わっていたら古い修復案で新しいデータを潰さない）。
  // メディアコピー後の中止では、新IDへの複製だけが残る（記録は無傷・複製は起動時の掃除が回収）ため、文言を実態に合わせる
  const assertUnchanged=(afterMedia)=>{ for(const k of REPAIR_KEYS){
    if(localStorage.getItem(k)!==plan.baseline[k])
      throw new Error('点検のあとにデータが更新されたため、修復を中止しました'
        +(afterMedia?'（記録は変更していません。作成済みの録音・写真の複製は起動時の掃除で回収されます）':'（何も変更していません）')
        +'。もう一度「修復する」を押してください'); } };
  assertUnchanged(false);
  for(const mv of plan.mediaMoves){
    const store=(mv.store==='audio')?AudioDB:PhotoDB;
    const rec=await store.get(mv.oldId);
    if(!rec || !rec.blob) throw new Error('録音・写真の実体を読み取れませんでした（修復は保存していません）');
    const copy=Object.assign({}, rec, {id:mv.newId});
    if(mv.ownerType==='flight') copy.flight_uuid=mv.ownerUuid; else copy.obs_uuid=mv.ownerUuid;
    await store.put(copy);
  }
  assertUnchanged(true);   // メディアコピー（await）の間に変わっていないか、保存直前にもう一度確認
  const touched=Object.keys(plan.cols).slice();
  if(plan.tombstones) touched.push('bs_tombstones');
  if(plan.myguide) touched.push('bs_myguide');
  if(plan.recent) touched.push(DB.key.recent);
  const before={}; touched.forEach(k=>{ before[k]=localStorage.getItem(k); });
  const rollback=()=>{ touched.forEach(k=>{ try{ if(before[k]==null) localStorage.removeItem(k); else localStorage.setItem(k,before[k]); }catch(e){} }); };
  const failSave=()=>{ rollback();
    // 巻き戻し自体が失敗していないか検証する（部分適用のまま「適用していません」と誤って断定しない）
    const broken=touched.some(k=>localStorage.getItem(k)!==before[k]);
    throw new Error(broken
      ? '⚠ 保存に失敗し、巻き戻しも完全ではありません。ダウンロード済みの「修復前の控え」ファイルを必ず保管し、空き容量を確保してからホーム「⤒ インポート」等で復元してください'
      : '保存できませんでした（空き容量を確認してください。修復は適用していません）'); };
  for(const k in plan.cols){ if(!DB.save(k, plan.cols[k])) failSave(); }
  if(plan.tombstones && !tombstonesSave(plan.tombstones)) failSave();
  if(plan.myguide && !myguideSave(plan.myguide)) failSave();
  if(plan.recent && !DB.save(DB.key.recent, plan.recent)) failSave();
  for(const mv of plan.mediaMoves){
    try{ await ((mv.store==='audio')?AudioDB:PhotoDB).del(mv.oldId); }catch(e){}
  }
  if(plan.mediaMoves.length){
    try{ const map=await syncMapLoad();
      plan.mediaMoves.forEach(mv=>{ if(map[mv.store]) delete map[mv.store][mv.oldId]; });
      await syncMapSave(map);
    }catch(e){}
  }
}

let _repairBusy=false;
async function runRepair(){
  if(_repairBusy) return; _repairBusy=true;
  try{
    const plan=await buildRepairPlan();
    if(!plan.actions.length){ toast('修復が必要な箇所はありませんでした'); rescanLocalData(); render(); return; }
    downloadRepairRescue();
    const head=plan.actions.slice(0,15);
    let msg='修復前の控えファイルをダウンロードしました。\n保存されたことを確認してからOKを押してください。\n\n【修復内容】\n・'+head.join('\n・')
      +(plan.actions.length>15?`\n…ほか${plan.actions.length-15}件`:'');
    if(plan.buried.length) msg+='\n\n⚠ 次の記録は修復後、過去の完全削除の記録に基づき同期時に消えます（原本は控えファイルにあります）:\n・'+plan.buried.slice(0,10).join('\n・')
      +(plan.buried.length>10?`\n…ほか${plan.buried.length-10}件`:'');
    if(!confirm(msg)){ toast('修復を中止しました（何も変更していません）'); return; }
    await applyRepairPlan(plan);
    _lastRepairReport=plan.actions.slice();
    rescanLocalData();
    toast('修復しました。他の端末を使っている場合は、その端末でも点検・修復を実行してください', 5000);
    render();
  }catch(e){ toast('修復に失敗しました: '+(e.message||e), 5000); }
  finally{ _repairBusy=false; }
}

// JSONとして読み取れない（＝修復もできない）区分を、控えを保存したうえで空にする。
// 空にしても削除記録（墓標）は作らないため、他の端末に同じ記録があれば次回の同期で戻る
function resetBrokenCollection(key,label){
  if(_repairBusy) return;
  downloadRepairRescue();
  if(!confirm(`「${label}」のデータは壊れていて読み取れないため、修復できません。\n控えファイルの保存を確認してからOKを押すと、この区分を空にします。\n（他の端末に同じ記録があれば、次回の同期で戻ります）`)){
    toast('中止しました（何も変更していません）'); return; }
  if(!DB.save(key,[])){ toast('空にできませんでした（空き容量を確認してください）'); return; }
  rescanLocalData(); toast(`「${label}」を空にしました`); render();
}

      : `<div class="note" style="border-color:var(--warn);"><b>⚠ ${sc.problems}件の問題が見つかりました</b><br>
          壊れた記録があると、他の端末への同期が止まったり、CSVなどの書き出しに不正な値が出たりします。下の「修復する」で直せます。</div>
        <div class="sp"></div>
        ${rows}

        <div class="sp"></div>
        <div class="note">修復の前に「修復前の控え」ファイルが自動でダウンロードされます。元の値は控えファイルと記録内のメモ（repair_note）に残るので、あとから確認できます。<br>
        <b>他の端末でも</b>この画面から点検・修復を実行してください（他の端末で保存された壊れた記録は、その端末でしか直せません）。</div>`}
    ${_lastRepairReport ? `<div class="sp"></div><div class="card"><h3>今回の修復内容</h3><div class="small">${_lastRepairReport.map(esc).join('<br>')}</div></div>` : ''}
  `};
};

function bootNoticeSet(msg){

// この版の画面であることを、SWからの問い合わせ（verCheck）に答えて名乗る。
// 前の版の画面は答えられないので、残っているタブを見分けられる
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', e=>{
    if(e.data && e.data.type==='verCheck' && e.ports && e.ports[0]){
      // 単一タブ判定の世代番号。判定の仕組みを変えたら数を上げる（SW側と一致していること）
      try{ e.ports[0].postMessage({v:3}); }catch(err){}   // 3=使用権をオリジン共通にした世代。v2以前は旧版扱い
    }
  });
}
// 旧版タブの有無をSWに尋ねる（起動時の確認と、起動後の見張りとで共用）
async function countLegacyAsk(){
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    const sw=navigator.serviceWorker.controller || (reg && reg.active) || null;
    if(!sw) return null;
    return await new Promise(res=>{
      const ch=new MessageChannel();
      const tm=setTimeout(()=>res(null), 2500);
      ch.port1.onmessage=ev=>{ clearTimeout(tm);
        const d=ev.data;
        res((d && d.ok===true && d.guardV===3 && typeof d.legacy==='number') ? d : null); };
      try{ sw.postMessage({type:'countLegacy'},[ch.port2]); }
      catch(e){ clearTimeout(tm); res(null); }
    });
  }catch(e){ return null; }
}
// 起動後に古い版のタブが開かれたときの見張り。古い版は使用権の仕組みを知らないため、
// 起動時の1回きりの確認では、あとから開かれた場合を防げない（2026-08-08 監査58巡目）
let GUARD_FROZEN=false, GUARD_CONFLICT=false, GUARD_GEN=0, FREEZE_PENDING=false;
let GUARD_SNAP={};   // 競合検知時の相手の書き込み内容（キー別の最新の姿）
// 競合からの再開＝再読み込み（テストではここを差し替えて確かめる）
let GUARD_RELOAD=()=>{ try{ location.reload(); }catch(e){} };
function guardFreezeShow(){
  if(document.getElementById('guardFreeze')) return;
  const el=document.createElement('div');
  el.id='guardFreeze';
  el.style.cssText='position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.6);'
    +'display:flex;align-items:center;justify-content:center;padding:24px;';
  el.innerHTML='<div style="background:#fff;border-radius:14px;padding:20px;max-width:340px;text-align:center;font-size:14px;line-height:1.7;color:#222;">'
    +'古い版のこのアプリが別のタブで開かれました。<br>記録が食い違わないよう、保存を一時停止しています。<br>そのタブを閉じてから、下のボタンを押してください。'
    +'<br><br><button class="btn primary" onclick="guardRecheck()">閉じたので再開する</button></div>';
  document.body.appendChild(el);
}
async function guardFreeze(){
  if(GUARD_FROZEN) return;
  GUARD_FROZEN=true; GUARD_CONFLICT=true;   // 進行中の保存の後片付けにも「別の書き手がいる」ことを知らせる
  const myGen=++GUARD_GEN;
  guardFreezeShow();   // 新しい操作は覆いで止める
  // 進行中の保存の後片付け（添付の持ち主の付け替え・失敗時の巻き戻し）が終わるのを
  // 待ってから書き込み許可を下ろす。途中で下ろすと、巻き戻しの書き込みまで拒否されて
  // 「記録は保存済みなのに添付の持ち主が中途半端」という壊れ方をする。
  // 時間で打ち切らない（大きな添付では後片付けが長引き得る。打ち切ると同じ壊れ方をする）
  FREEZE_PENDING=true;
  try{
    while(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY
      && !(typeof SAVE_FATAL!=='undefined' && SAVE_FATAL)){ await new Promise(r=>setTimeout(r,100)); }
  } finally { FREEZE_PENDING=false; }
  if(typeof SAVE_FATAL!=='undefined' && SAVE_FATAL){
    // 回復不能の停止中。凍結の覆いを外して、下の再読み込み案内を操作できるようにする
    window.WRITE_OK=false;
    const elF=document.getElementById('guardFreeze'); if(elF) elF.remove();
    return;
  }
  if(GUARD_GEN===myGen) window.WRITE_OK=false;   // 待機中に「再開」で世代が進んでいたら下ろさない
}
async function guardWatchTick(){
  if(GUARD_FROZEN || !window.WRITE_OK) return;
  const ans=await countLegacyAsk();
  if(ans && ans.legacy>0){
    await guardFreeze();   // 確実に分かったときだけ止める（通信の失敗では止めない）
  }
}
async function guardRecheck(){
  if(typeof SAVE_FATAL!=='undefined' && SAVE_FATAL){ toast('保存の後片付けに失敗しています。ページを再読み込みしてください', 6000); return; }
  // 後片付け待ちの間に再開すると、待機明けの凍結が覆いの無いまま保存だけ止めてしまう
  if(FREEZE_PENDING){ toast('保存の後片付けが終わるのを待っています。少し待ってからもう一度押してください', 5000); return; }
  const ans=await countLegacyAsk();
  if(!ans || ans.legacy>0){ toast('まだ古い版のタブが見つかります。閉じてからもう一度押してください', 5000); return; }
  ++GUARD_GEN;   // 念のため、待機中の凍結があとから書き込みを止めないよう世代を進める
  GUARD_FROZEN=false; GUARD_CONFLICT=false;
  // 競合中に開いていた画面は、別のタブの書き込みより古い内容を持っている可能性がある。
  // そのまま再開すると古い内容で上書きしてしまうため、最新の記録を読み直す（起動からやり直す）
  const el=document.getElementById('guardFreeze');
  if(el) el.textContent='確認できました。最新の記録を読み直しています…';
  GUARD_RELOAD();
}
(async function bootGuard(){
  bootNoticeSet('起動時の確認をしています…（この間は保存できません）');
  // 1) 使用権（Web Locks）を先に取る。同時に開いても勝者は必ず1つに決まり、
  //    負けたタブはここで止まる（両方止まってしまうことはない）
  if('locks' in navigator){
    let got=false;
    try{
      await new Promise(resolve=>{
        // 保存領域（localStorage / IndexedDB）はオリジン全体で共有なので、使用権もオリジンで1つにする。
        // 場所ごとに分けると、別の場所に置いた同じアプリと同時に書けてしまう
        navigator.locks.request('bird-survey-single-tab', {ifAvailable:true}, lock=>{
          if(!lock){ resolve(); return; }
          got=true; resolve();
          return new Promise(()=>{});   // 使用権を持ち続ける（タブを閉じれば自動で解放）
        }).catch(()=>resolve());
      });
    }catch(e){}
    if(!got){ multiTabBlockShow(); return; }
  } else {
    // 使用権の仕組みが無いブラウザでは、同時に開いた同じ版のタブを見分けられない。
    // 閲覧専用にする（WRITE_OK は false のまま＝どの画面からも保存できない）。
    // オフライン用のキャッシュ（SW）だけは、閲覧専用でも導入しておく
    if('serviceWorker' in navigator && location.protocol!=='file:'){
      try{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }catch(e){}
    }
    readOnlyApply('このブラウザでは閲覧のみできます（保存はできません）。最新のブラウザでお使いください');
    return;
  }
  // 2) 前の版のタブが残っていないか、SWに確かめてもらう。
  //    前の版はロックを知らないため、ロックだけでは同時書き込みを防げない。
  //    登録に失敗した・答えが得られない場合は、安全側に倒して止める
  if(!('serviceWorker' in navigator) || location.protocol==='file:'){
    // 前の版のタブが残っていないかを確かめられない開き方では、保存を許可しない
    readOnlyApply('この開き方では閲覧のみできます（保存はできません）。ホーム画面のアプリから開いてください');
    return;
  }
  {
    let reg=null;
    try{ reg=await navigator.serviceWorker.register('./sw.js'); }
    catch(e){ multiTabBlockShow(); return; }
    let ans=null;
    for(let i2=0;i2<10 && !ans;i2++){
      // 更新直後は前の版のSWが受け持っていて答えられない。
      // 試すたびに「いま有効なSW」を取り直す（新しいSWは skipWaiting/claim ですぐ切り替わる）
      // 世代番号（guardV）が一致する答えだけを受理する（countLegacyAsk 内で検査）。
      // 更新直後の前の版のSWは guardV を知らないため、その答えでは進まない
      ans=await countLegacyAsk();
      if(!ans) await new Promise(r=>setTimeout(r,500));   // 新しいSWへの切り替わりを待つ
    }
    if(!ans || ans.legacy>0){ multiTabBlockShow(); return; }
  }
  // 監視は startApp（復旧を含む）より先に据える。復旧中の別の書き手も検知できるように
  setInterval(guardWatchTick, 3000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) guardWatchTick(); });
  // このタブは使用権を持つ唯一の書き手のはずなので、他のタブがこのアプリの
  // 保存領域（bs_〜）を書き換えたら、それ自体が「旧版などの別の書き手がいる」証拠。
  // 見張りの間隔を待たず、その場で保存を止める
  window.addEventListener('storage', ev=>{
    try{
      if(!ev || typeof ev.key!=='string' || ev.key.indexOf('bs_')!==0) return;
      GUARD_CONFLICT=true;   // 進行中の保存の後片付けに競合を知らせる（凍結済みでも立てる）
      try{ GUARD_SNAP[ev.key]=ev.newValue; }catch(e){}   // 相手の最新の姿を取り消しの基準に使う
      // 別の書き手の書き込み途中の姿をバックアップしない（作成中の成果物も無効化）
      try{
        if(typeof BACKUP_GEN!=='undefined') BACKUP_GEN++;
        _backupPending=true; _folderPending=true;
        if(typeof _cloudTimer!=='undefined') clearTimeout(_cloudTimer);
        if(typeof _fullTimer!=='undefined') clearTimeout(_fullTimer);
      }catch(e){}
      if(GUARD_FROZEN || !window.WRITE_OK) return;
      guardFreeze();
    }catch(e){}
  });
  startApp();
})();
</script>
