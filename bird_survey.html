   localStorage直書き＝テーマと同じく端末ごとの状態（同期対象にしない）。
   値は音源一覧の署名（種名＋ファイル名から算出）。音源の追加・差し替えで署名が変わるため、
   旧版で保存した「済み」を信用せず、誤って「全種保存済み」と畳んだままにしない */
let _callsSig=null;
function callsSig(){
  if(_callsSig===null){ let h=0;
    for(const jp in CALLS){ const s=jp+':'+CALLS[jp].f+';'; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; }
    _callsSig='s'+(h>>>0).toString(36)+'-'+Object.keys(CALLS).length; }
  return _callsSig;
}
function callsAllSavedFlag(){ try{ return localStorage.getItem('bs_calls_allsaved')===callsSig(); }catch(e){ return false; } }
// 通信量の目安。CALLS に持たせた実バイト数から出すので、音源を差し替えても自動で追従する。
function callsMB(bytes){ return Math.max(1, Math.round(bytes/1024/1024)); }
function updateCallSaved(){
  const total=Object.keys(CALLS).length;
  countUpToDateCalls().then(({n, restBytes})=>{
    // 開閉フラグは画面表示の有無に関係なく更新（別画面でDL完了しても次回表示に反映）。
    // 表示中のopen状態は触らない（見ている最中に勝手に閉じない。次回表示から反映）
    try{ if(n>=total) localStorage.setItem('bs_calls_allsaved',callsSig()); else localStorage.removeItem('bs_calls_allsaved'); }catch(e){}
    const rest=Math.max(0,total-n);   // 未保存＋差し替えで古くなった種
    const sv=$('#callSaved');
    if(sv) sv.textContent = n>=total ? `✅ 全${total}種を端末に保存済み（圏外でも再生できます）` : `端末に保存済み: ${n} / ${total} 種`;
    const b=$('#dlCallsBtn');
    if(b && !_dlCallsRunning){ if(n>=total){ b.disabled=true; b.classList.add('ghost'); b.textContent='✅ 鳴き声は保存済み'; }
      else { b.disabled=false; b.classList.remove('ghost'); b.textContent=`⬇ 鳴き声を端末に保存（残り${rest}種・約${callsMB(restBytes)}MB・Wi-Fi推奨）`; } }
  }).catch(()=>{});
}

let _dlCallsRunning=false;
async function downloadCalls(){
  if(!writeAllowed()) return;
  if(_dlCallsRunning) return; _dlCallsRunning=true;
  const entries=Object.keys(CALLS); const btn=$('#dlCallsBtn'); if(btn){ btn.disabled=true; btn.textContent='ダウンロード中…'; }

  let done=0, failn=0;
  for(const jp of entries){
    try{
      const f=CALLS[jp].f;
      const ex=await CallDB.get(jp); if(ex&&ex.blob&&ex.f===f){ done++; continue; }  // 今の録音と一致していれば再DLしない（差し替え分だけ更新）
      const res=await fetch('./assets/calls/'+f); if(!res.ok) throw 0;
      const blob=await res.blob(); await CallDB.put({jp, f, blob}); done++;
    }catch(e){ failn++; }
    if((done+failn)%10===0){ toast(`ダウンロード中… ${done+failn}/${entries.length}`); updateCallSaved(); }
  }
  _dlCallsRunning=false;
  toast(failn?`保存しました（${done}種／失敗${failn}）`:`保存しました（${done}種・圏外でも再生できます）`);
  updateCallSaved(); renderGuideList(SCREENS._guideQ||'');
}

function importRefdoc(input){
  const f=(input.files||[])[0]; input.value=''; if(!f) return;

  if(f.type && f.type.indexOf('pdf')<0 && !/\.pdf$/i.test(f.name||'')){ toast('PDFファイルを選んでください'); return; }
  const meta={ id:uuid(), name:f.name||'図鑑.pdf', size:f.size, created_at:nowISO() };
  toast('取り込み中…（大きいPDFは少し時間がかかります）');
  RefDB.put({ id:meta.id, blob:f }).then(()=>{
    const l=refdocList(); l.unshift(meta);
    if(!refdocSave(l)){
      // 目録に載せられなかったら、入れた本体も回収する（見えない残骸を残さない）
      RefDB.del(meta.id).catch(()=>{});
      toast('取り込みに失敗しました'); return;
    }
    toast('取り込みました'); render();
  }).catch(()=>toast('取り込みに失敗しました'));
}
let REFDOC_BUSY=false;   // 資料の削除は1件ずつ（重ねると、古い控えで別の削除の結果を上書きしてしまう）
function delRefdoc(id){
  if(REFDOC_BUSY){ toast('前の削除が終わるまでお待ちください'); return; }
  if(!confirm('この資料を削除しますか？')) return;
  // 先に目録から外す（本体を先に消すと、失敗したとき「開けない資料」が一覧に残る）
  const item=refdocList().find(r=>r.id===id); if(!item) return;
  if(!refdocSave(refdocList().filter(r=>r.id!==id))) return;
  REFDOC_BUSY=true;
  RefDB.del(id).then(()=>{ toast('削除しました'); render(); })
    .catch(()=>{
      // 本体を消せなかったら、対象の1件だけを今の目録に戻す（配列ごと戻すと他の変更を潰す）
      const cur=refdocList();
      if(!cur.some(r=>r.id===id)){ cur.unshift(item);
        if(!refdocSave(cur)){ toast('目録を戻せませんでした。データ点検・修復画面で確認してください', 6000); } }
      toast('削除に失敗しました'); render();
    })
    .finally(()=>{ REFDOC_BUSY=false; });
}

/* PDF.js は使う時だけ読み込む（起動を軽く保つ） */
let _pdfjsLoading=null;
function ensurePdfjs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(_pdfjsLoading) return _pdfjsLoading;
  _pdfjsLoading=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='./vendor/pdf.min.js';
    s.onload=()=>{ if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='./vendor/pdf.worker.min.js'; res(); } else rej(new Error('pdfjs')); };
    s.onerror=()=>rej(new Error('pdfjs load')); document.head.appendChild(s);
  });
  return _pdfjsLoading;
}
let PDFCTX=null; // { doc, page, total }
let _pdfLoadSeq=0; // PDF読込の連番。新しい読込が始まったら古い読込結果は破棄する
SCREENS.pdfView = (id)=>{

        <button class="btn" style="width:auto; padding:10px 14px;" onclick="pdfPage(1)">次 ›</button>
      </div>

      </div>
      <div id="pdfWrap" style="margin-top:12px; overflow:auto; -webkit-overflow-scrolling:touch; text-align:center;">
        <canvas id="pdfCanvas" style="max-width:100%; border:1px solid var(--line); border-radius:8px; background:#fff;"></canvas>
      </div>`,

async function loadPdf(id){
  const seq=++_pdfLoadSeq;   // この読込の番号。以降に別の読込が始まったら、この結果は破棄する
  try{
    await ensurePdfjs();
    const rec=await RefDB.get(id); if(!rec||!rec.blob){ toast('PDFが見つかりません'); return; }
    const buf=await rec.blob.arrayBuffer();
    // 細工PDFによる任意JavaScript実行(CVE-2024-4367系)を防ぐため eval を無効化
    const doc=await pdfjsLib.getDocument({data:buf, isEvalSupported:false}).promise;
    if(seq!==_pdfLoadSeq || !$('#pdfCanvas')){ try{ doc.destroy(); }catch(e){} return; }   // 別PDFに移った/画面を離れたら破棄
    PDFCTX={ doc, page:1, total:doc.numPages };
    const tot=$('#pdfPageTot'); if(tot) tot.textContent=doc.numPages;
    const pill=$('#pdfPill'); if(pill) pill.textContent=`全 ${doc.numPages} ページ`;
    renderPdfPage();
  }catch(e){ toast('PDFを開けませんでした'); }
}
async function renderPdfPage(){
  if(!PDFCTX) return;
  const page=PDFCTX.page;
  try{
    const p=await PDFCTX.doc.getPage(page);
    const canvas=$('#pdfCanvas'); if(!canvas || !PDFCTX) return;
    const wrap=$('#pdfWrap'); const wrapW=Math.min((wrap&&wrap.clientWidth)||900, 1400);
    const vp0=p.getViewport({scale:1});
    const scale=Math.max(0.3, Math.min(3, (wrapW-4)/vp0.width));
    const vp=p.getViewport({scale});
    const ctx=canvas.getContext('2d');
    canvas.width=vp.width; canvas.height=vp.height;
    await p.render({canvasContext:ctx, viewport:vp}).promise;
    const num=$('#pdfPageNum'); if(num) num.textContent=page;
  }catch(e){}
}
function pdfPage(d){ if(!PDFCTX) return; const n=PDFCTX.page+d; if(n<1||n>PDFCTX.total) return; PDFCTX.page=n; renderPdfPage(); }
function pdfJump(){ if(!PDFCTX) return; const el=$('#pdfJump'); const v=parseInt(el&&el.value,10);
  if(v>=1 && v<=PDFCTX.total){ PDFCTX.page=v; renderPdfPage(); } else toast('1〜'+PDFCTX.total+' のページ番号を入れてください'); }

/* ============================================================
   オフライン地図の保存（範囲を囲って先に落としておく）
   スクロール任せの受動キャッシュだと「どこまで保存できたか」が分からないので、
   多角形で範囲を決めて、その中のタイルをまとめて Service Worker の PACK_CACHE へ保存する。
   保存分は自動では消えない（版の掃除・「最新に更新」からも保護）。産卵床調査アプリからの移植。
   ============================================================ */
const PACK_MAXZOOM = 16;     // これ以上は落とさない（枚数が急増するため）
const PACK_MINZOOM = 12;     // 全体像が分かる粗さから
// URLは createBaseMap の生成URLと文字列完全一致であること（キャッシュ照合はURL一致のため）
const PACK_BASEMAPS = {
  '標準地図':          { url:'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png' },
  '淡色地図':          { url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png' },
  '写真（航空・衛星）': { url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg' },
};
const PACK_TILE_KB = { '標準地図':12, '淡色地図':10, '写真（航空・衛星）':20 };   // 見積り用の1枚あたりKB
const PACK_WARN_TILES = 12000;   // これを超えたら強く警告（40000で拒否）

// 緯度経度 → タイル番号
function lon2tx(lon,z){ return Math.floor((lon+180)/360*Math.pow(2,z)); }
function lat2ty(lat,z){ const r=lat*Math.PI/180;
  return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z)); }
// タイル番号 → そのタイルの北西角の緯度経度
function tx2lon(x,z){ return x/Math.pow(2,z)*360-180; }
function ty2lat(y,z){ const n=Math.PI-2*Math.PI*y/Math.pow(2,z);
  return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); }

function polyBounds(poly){
  let s=90,n=-90,w=180,e=-180;
  poly.forEach(p=>{ s=Math.min(s,p[0]); n=Math.max(n,p[0]); w=Math.min(w,p[1]); e=Math.max(e,p[1]); });
  return {s,n,w,e};
}
function pointInPoly(lat, lon, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0], xi=poly[i][1], yj=poly[j][0], xj=poly[j][1];
    if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function tileHitsPoly(x,y,z,poly){
  const latN=ty2lat(y,z), latS=ty2lat(y+1,z), lonW=tx2lon(x,z), lonE=tx2lon(x+1,z);
  // タイルの4隅・中心のどれかが多角形内なら採用
  const pts=[[latN,lonW],[latN,lonE],[latS,lonW],[latS,lonE],[(latN+latS)/2,(lonW+lonE)/2]];
  if(pts.some(p=>pointInPoly(p[0],p[1],poly))) return true;
  // 多角形の頂点がタイルの中に入る場合も採用
  if(poly.some(p=>p[0]<=latN && p[0]>=latS && p[1]>=lonW && p[1]<=lonE)) return true;
  // 細長い多角形が「隅も中心も外のままタイルを横切る」場合の取りこぼし防止:
  // 多角形の辺がタイルと交差していれば採用（保存範囲の中に穴を作らない）
  for(let i=0;i<poly.length;i++){
    if(segIntersectsRect(poly[i], poly[(i+1)%poly.length], latS, latN, lonW, lonE)) return true;
  }
  return false;
}
// 線分p1-p2がタイル矩形と交わるか（端点が中、または矩形の4辺と交差）
function segIntersectsRect(p1,p2,latS,latN,lonW,lonE){
  const inR=p=>p[0]<=latN && p[0]>=latS && p[1]>=lonW && p[1]<=lonE;
  if(inR(p1)||inR(p2)) return true;
  const o=(a,b,c)=>Math.sign((b[1]-a[1])*(c[0]-a[0])-(b[0]-a[0])*(c[1]-a[1]));
  const x=(a,b,c,d)=>o(a,b,c)!==o(a,b,d) && o(c,d,a)!==o(c,d,b);
  const c1=[latS,lonW],c2=[latS,lonE],c3=[latN,lonE],c4=[latN,lonW];
  return x(p1,p2,c1,c2)||x(p1,p2,c2,c3)||x(p1,p2,c3,c4)||x(p1,p2,c4,c1);
}

// 一覧の読み出しは型を検査し、壊れた項目は捨てる（v73点検の対象外キーのため自前で守る。画面が開けなくなるのを防ぐ）
function packStore(){ try{ const a=JSON.parse(localStorage.getItem('bs_map_packs')||'[]');
  if(!Array.isArray(a)) return [];
  return a.filter(p=>p && typeof p==='object' && !Array.isArray(p)
    && Array.isArray(p.poly) && p.poly.every(q=>Array.isArray(q) && q.length===2
      && typeof q[0]==='number' && Number.isFinite(q[0]) && typeof q[1]==='number' && Number.isFinite(q[1]))
    && Array.isArray(p.layers) && p.layers.every(s=>typeof s==='string')
    && Number.isFinite(+p.count) && Number.isFinite(+p.mb));
}catch(e){ return []; } }
// 成否を返す（失敗を握りつぶすと「タイルは保存されたのに一覧に無い」隠れデータになるため）
function packSave(list){ if(!writeAllowed()) return false;
  try{ localStorage.setItem('bs_map_packs', JSON.stringify(list)); return true; }catch(e){ return false; } }

// 保存するタイルの (z,x,y) 一覧。poly の形にかかるマスだけを選ぶ
function packTiles(area, zmax){
  const zTop = Math.min(zmax, PACK_MAXZOOM);
  const poly = (area && area.poly && area.poly.length>=3) ? area.poly : null;
  const bb = poly ? polyBounds(poly) : area;
  const out=[];
  for(let z=PACK_MINZOOM; z<=zTop; z++){
    const x0=lon2tx(bb.w,z), x1=lon2tx(bb.e,z);
    const y0=lat2ty(bb.n,z), y1=lat2ty(bb.s,z);
    for(let x=Math.min(x0,x1); x<=Math.max(x0,x1); x++)
      for(let y=Math.min(y0,y1); y<=Math.max(y0,y1); y++)
        if(!poly || tileHitsPoly(x,y,z,poly)) out.push([z,x,y]);
  }
  return out;
}
function packTileUrls(area, zmax, layers){
  const tiles = packTiles(area, zmax);
  const urls=[];
  layers.forEach(name=>{
    const b=PACK_BASEMAPS[name]; if(!b) return;
    tiles.forEach(([z,x,y])=>urls.push(b.url.replace('{z}',z).replace('{x}',x).replace('{y}',y)));
  });
  return urls;
}
// 見積り（枚数と、種類ごとの重みで概算したMB）
function packEstimate(area, zmax, layers){
  const tiles = packTiles(area, zmax);
  const urls = packTileUrls(area, zmax, layers);
  const perZoom={};
  tiles.forEach(([z])=>{ perZoom[z]=(perZoom[z]||0)+1; });
  let kb=0;
  layers.forEach(name=>{ const w=PACK_TILE_KB[name]||15;
    Object.keys(perZoom).forEach(z=>{ kb += perZoom[z]*w; }); });
  return { count:urls.length, mb: kb/1024, urls };
}

// Service Worker への依頼（保存・計測・削除・疎通確認）。返事を待つ。
// SWが応答しない場合に永久に固まらないよう時間で打ち切る（既定120秒。低速回線の30枚直列でも収まる粒度）
function swAsk(msg, timeoutMs){
  return new Promise((res,rej)=>{
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if(!sw){ rej(new Error('no-sw')); return; }
    const ch = new MessageChannel();
    const tm = setTimeout(()=>rej(new Error('sw-timeout')), timeoutMs||120000);
    ch.port1.onmessage = e => { clearTimeout(tm); res(e.data); };
    sw.postMessage(msg, [ch.port2]);
  });
}
let PACK_DL = null;   // ダウンロード中の状態（中断・二重起動防止用）

/* ---------- オフライン地図の保存画面 ---------- */
let PK_PTS=[], PK_SHAPE=null, PK_DOTS=[];
SCREENS.offlineMap = (sv)=>{
  const s = DB.survey(sv); if(!s) return SCREENS.home();
  const packs = packStore();
  const curBase = (b=>PACK_BASEMAPS[b]?b:'標準地図')(localStorage.getItem('bs_basemap'));
  const packCards = packs.map(p=>`
    <div class="card">
      <div class="row"><div class="grow"><b>${esc(p.name||'保存範囲')}</b>
        <span class="small muted">${esc((p.layers||[]).join('・'))}</span></div>
        <button class="btn ghost" style="width:auto; padding:4px 10px;" onclick="recallPack('${p.id}')">範囲を呼び出す</button>
        <button class="btn ghost danger" style="width:auto; padding:4px 10px;" onclick="deleteMapPack('${p.id}')">削除</button></div>
      <div class="small muted" style="margin-top:6px">
        z${p.zmin}〜${p.zmax} ／ ${(+(p.ok!=null?p.ok:p.count)).toLocaleString()}枚 ／ 約${(+p.mb).toFixed(0)}MB ／ ${fmtDate(p.saved_at)}保存</div>
      ${p.status==='partial'?`<div class="small" style="color:var(--warn); margin-top:4px">⚠ 一部のみ保存（予定 ${(+p.count).toLocaleString()} 枚のうち上記まで）。同じ範囲を保存し直すと補完されます</div>`:''}
    </div>`).join('');
  return {
    title:'オフライン地図の保存',
    sub:[`<span class="pill">${esc(s.name)}</span>`],
    html:`
      <div class="note">
        <b>電波のあるうちに</b>、調査で使う範囲の地図を保存しておくと、圏外でも表示できます。<br>
        ① 地図をタップ（または十字ボタン）で、囲みたい範囲の角を順に打つ<br>
        ② 保存する地図の種類と細かさを選ぶ　③ 「この範囲を保存」<br>
        <span class="tiny muted">※圏外で見られるのは z16（詳細）まで。それ以上拡大するとグレーになります。</span>
      </div>
      <div id="omap" style="height:320px; border-radius:var(--radius); border:1px solid var(--line);"></div>
      <div class="btn-grid" style="margin-top:8px">
        <button class="btn" onclick="offlineUndoCorner()">↶ 1つ戻す</button>
        <button class="btn ghost" onclick="offlineClearRect()">囲みを消す</button>
      </div>
      <button class="btn ghost" style="margin-top:8px" onclick="offlineUseView()">今の表示範囲をそのまま使う</button>
      <div class="tiny muted" style="margin:6px 0;">3点以上打つと範囲になります。谷筋・海岸線に沿ってL字などの自由な形で囲むと無駄が減ります。</div>

      <label class="field"><span class="lab">保存する地図の種類（複数可）</span>
        <div class="seg" data-seg="packLayers">
          ${Object.keys(PACK_BASEMAPS).map(n=>`<button type="button" class="${n===curBase?'on':''}" onclick="togglePackLayer(this)">${esc(n)}</button>`).join('')}
        </div></label>
      <label class="field"><span class="lab">細かさ（拡大の上限。上げるほど枚数が増えます）</span>
        <div class="seg" data-seg="packZoom">
          ${['z14（広域）','z15（標準）','z16（詳細）'].map(v=>`<button type="button" class="${v.startsWith('z16')?'on':''}" onclick="pickPackZoom(this)">${esc(v)}</button>`).join('')}
        </div></label>

      <div class="card" id="omapEst"><div class="small muted">3点以上囲むと、枚数と容量の見積りが出ます。</div></div>
      <button class="btn primary big" id="omapSaveBtn" onclick="offlineSave('${sv}')">💾 この範囲を保存</button>
      <div class="sp"></div>
      <div id="omapProg"></div>

      ${ packs.length ? `<h3 class="muted small">保存済み（${packs.length}）</h3>${packCards}
        <button class="btn ghost" onclick="offlineStats()">実際の保存量を確認</button>
        <div class="tiny muted" id="omapStats" style="margin-top:6px"></div>` : '' }
    `,
    onMount:()=>initOfflineMap(sv)
  };
};

function initOfflineMap(sv){
  PK_PTS=[]; PK_SHAPE=null; PK_DOTS=[];   // 再入場時に前回の角が復活しないよう必ずリセット
  if(typeof L==='undefined' || !$('#omap')) return;
  // 記録済みの観察位置を薄く出して、どこを保存すればよいか分かるように
  const pts=DB.obsOf(sv).map(o=>[parseFloat(o.latitude),parseFloat(o.longitude)])
    .filter(p=>isFinite(p[0])&&isFinite(p[1]));
  let center=[43.06,141.35], zoom=10;
  if(pts.length){ const bb=polyBounds(pts); center=[(bb.s+bb.n)/2,(bb.w+bb.e)/2]; zoom=13; }
  else if(lastFix){ center=[lastFix.lat,lastFix.lon]; zoom=13; }
  mapObj=createBaseMap('omap', center, zoom, {});
  pts.forEach(p=>L.circleMarker(p,{radius:4,color:'#9aa8b4',weight:1,fillOpacity:.4}).addTo(mapObj));
  // 既に保存済みの範囲を緑の破線で見せる
  packStore().forEach(p=>{
    if(p.poly && p.poly.length>=3)
      L.polygon(p.poly, {color:'#4ec38a',weight:1,fillOpacity:.05,dashArray:'4,4'}).addTo(mapObj);
  });
  mapObj.on('click', e=>offlineAddCorner(e.latlng.lat, e.latlng.lng));
  addCrosshairControl(mapObj, (la,lo)=>offlineAddCorner(la,lo), '◎ 十字の位置に角を打つ');
  // 保存の途中で画面を離れて戻ってきた場合は、進捗と「保存中」の状態を復元する
  if(PACK_DL){ const btn=$('#omapSaveBtn'); if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
    const prog=$('#omapProg');
    if(prog) prog.innerHTML=`<div class="card"><div class="small" id="omapProgTxt">保存中…（進捗は次の区切りで更新されます）</div>
      <button class="btn ghost" style="margin-top:8px; width:auto; padding:6px 12px;" onclick="offlineAbort()">中断</button></div>`; }
}
function offlineAddCorner(lat, lon){
  PK_PTS.push([lat,lon]);
  offlineRedrawShape();
  if(PK_PTS.length>=3) offlineEstimate();
}
function offlineUndoCorner(){ PK_PTS.pop(); offlineRedrawShape();
  if(PK_PTS.length>=3) offlineEstimate(); else offlineClearEst(); }
function currentPoly(){ return PK_PTS.length>=3 ? PK_PTS.slice() : null; }
function offlineRedrawShape(){
  if(!mapObj) return;
  if(PK_SHAPE){ try{ mapObj.removeLayer(PK_SHAPE); }catch(e){} PK_SHAPE=null; }
  PK_DOTS.forEach(d=>{ try{ mapObj.removeLayer(d); }catch(e){} }); PK_DOTS=[];
  PK_PTS.forEach(p=>{ PK_DOTS.push(
    L.circleMarker(p,{radius:5,color:'#e0a030',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(mapObj)); });
  if(PK_PTS.length>=3)
    PK_SHAPE=L.polygon(PK_PTS,{color:'#e0a030',weight:2,fillOpacity:.12}).addTo(mapObj);
  else if(PK_PTS.length===2)
    PK_SHAPE=L.polyline(PK_PTS,{color:'#e0a030',weight:2,dashArray:'5,5'}).addTo(mapObj);
}
function offlineUseView(){
  if(!mapObj) return;
  const b=mapObj.getBounds();
  PK_PTS=[[b.getNorth(),b.getWest()],[b.getNorth(),b.getEast()],
          [b.getSouth(),b.getEast()],[b.getSouth(),b.getWest()]];
  offlineRedrawShape(); offlineEstimate();
}
function offlineClearEst(){ const el=$('#omapEst');
  if(el) el.innerHTML='<div class="small muted">3点以上囲むと、枚数と容量の見積りが出ます。</div>'; }
function offlineClearRect(){ PK_PTS=[]; offlineRedrawShape(); offlineClearEst(); }
// ズーム・種類の選択（選び直したら即・見積りし直す）
function pickPackZoom(btn){ btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); offlineEstimate(); }
function togglePackLayer(btn){ btn.classList.toggle('on'); offlineEstimate(); }
function offlineZoomMax(){ const v=segVal('packZoom')||''; const m=v.match(/z(\d+)/); return m?+m[1]:PACK_MAXZOOM; }
function offlineLayers(){ const l=segVals('packLayers').split('・').filter(Boolean);
  return l.length?l:['標準地図']; }
function offlineEstimate(){
  const el=$('#omapEst'); if(!el) return;
  const poly=currentPoly();
  if(!poly){ offlineClearEst(); return; }
  const est = packEstimate({poly}, offlineZoomMax(), offlineLayers());
  const min = Math.max(1, Math.round(est.count/300));
  const warn = est.count>PACK_WARN_TILES;
  el.innerHTML = `<div class="small"><b>約 ${est.count.toLocaleString()} 枚 ／ 約 ${est.mb.toFixed(0)} MB</b>
    <span class="muted">（ダウンロード目安 ${min}分前後）</span></div>
    ${ warn ? `<div class="small" style="color:var(--warn); margin-top:6px">
      範囲が広い／細かすぎます。囲みを小さくするか、細かさを下げると軽くなります。</div>` : '' }
    <div class="tiny muted" style="margin-top:6px">${esc(offlineLayers().join('・'))}／z${PACK_MINZOOM}〜${offlineZoomMax()}</div>`;
}
async function offlineSave(sv){
  if(!writeAllowed()) return;
  if(PACK_DL){ toast('別の保存が進行中です'); return; }   // 二重起動防止
  const poly=currentPoly();
  if(!poly){ toast('先に地図で3点以上囲んでください'); return; }
  if(!(navigator.serviceWorker && navigator.serviceWorker.controller)){
    toast('この環境では保存できません（公開URLをホーム画面に追加して使ってください）'); return; }
  const layers=offlineLayers(), zmax=offlineZoomMax();
  const est=packEstimate({poly}, zmax, layers);
  if(est.count > 40000){ alert('範囲が大きすぎます（約'+est.count.toLocaleString()+'枚）。囲みを小さくするか、細かさを下げてください。'); return; }
  // 「実際に増える容量」を先に求める（新規範囲のうち保存済みタイルは増えない）。
  // 空き容量・累積上限の両方の判定にこの差分を使う——全数保存済みの補完・再保存を誤って拒否しないため
  let newMb=est.mb;
  try{ const hc=await swAsk({type:'countPack', urls:est.urls}, 60000);
    if(hc && typeof hc.count==='number' && hc.count>=0 && est.count>0)
      newMb = est.mb * Math.max(0, est.count-hc.count) / est.count; }catch(e){}
  // 端末の空き容量を確認する。タイルと写真・録音（IndexedDB）は同じ保存枠を使うため、
  // 写真・録音のための余裕（300MB）を差し引いても収まるときだけ保存する
  try{
    if(navigator.storage && navigator.storage.estimate){
      const es=await navigator.storage.estimate();
      const free=(es.quota||0)-(es.usage||0);
      if(free>0 && free < newMb*1024*1024 + 300*1024*1024){
        alert(`端末の空き保存領域が足りません（この保存で増える約${newMb.toFixed(0)}MB＋写真・録音用の余裕300MBが必要）。\n囲みを小さくするか、古い保存範囲・不要な写真を整理してください。`); return; }
    }
  }catch(e){}
  // 保存済みパックの累積上限（合計2GBまで）。1回の上限だけでは繰り返し保存で膨らむため。
  // 合計は原則キャッシュの実測（範囲が重なって共有されるタイルを二重に数えない）。
  // 実測できないとき（SW未制御など）だけメタ情報の合算で概算する（同一sig＝置き換え分は除外）
  const sigKey=JSON.stringify({p:poly, z:zmax, l:layers});
  const packSig=x=>JSON.stringify({p:x.poly, z:x.zmax, l:x.layers});
  let totalMb;
  try{
    const st=await swAsk({type:'packStats'}, 60000);
    if(!st || st.error || typeof st.bytes!=='number') throw new Error('stats-fail');
    totalMb = st.bytes/1048576 + newMb;   // 実測＋実際に増える分（重なる範囲を二重に数えない）
  }
  // 実測できないときの代替は安全側（全量計上＝過大寄り）。newMbを使うと同一範囲の既存分が漏れて過少計上になり得る
  catch(e){ totalMb = packStore().filter(x=>packSig(x)!==sigKey).reduce((a,p)=>a+(+p.mb||0), 0) + est.mb; }
  if(totalMb > 2048){
    alert(`オフライン地図の合計が約${Math.round(totalMb)}MBになり、上限（2GB）を超えます。先に使っていない保存範囲を削除してください。`); return; }
  if(est.count > PACK_WARN_TILES && !confirm(`約 ${est.count.toLocaleString()} 枚（${est.mb.toFixed(0)}MB）を保存します。時間がかかり、端末の空きも使います。続けますか？`)) return;

  // アプリ更新直後は旧SWが残っていて新しい依頼に応答できないことがある。先に疎通と対応版を確認する
  try{ const pg=await swAsk({type:'ping'}, 3000);
    if(!pg || !(+pg.v>=78) || !(+pg.feat>=2)) throw new Error('old-sw'); }
  catch(e){ toast('地図保存の準備ができていません。アプリを一度閉じて、開き直してからお試しください', 5000); return; }

  // ダウンロードを始める前に、まず「一部のみ・0枚」として一覧に登録しておく。
  // こうすると (1)一覧に記録できない状態なら1枚も落とす前に止まる（隠れタイルの取り消し処理が不要）
  // (2)保存中に再読み込み・アプリ終了しても、落ちた分は「一部のみ」カードから見えて削除・補完できる
  const mine={ id:uuid(), name:(DB.survey(sv)||{}).name||'保存範囲',
    poly, bbox:polyBounds(poly),
    zmin:PACK_MINZOOM, zmax, layers, count:est.count,
    mb:0, ok:0, status:'partial', saved_at:nowISO() };
  {
    // 仮登録の時点では同じ範囲の既存カードを消さない（保存中に落ちても、完全保存済みの記録を
    // 「一部のみ・0枚」に後退させないため）。既存分の整理は完了確定のときに行う
    const list=packStore();
    list.unshift(mine);
    if(!packSave(list)){
      toast('端末の記録領域が足りず、保存の記録が作れません。空き容量を確保してからお試しください', 5000); return; }
  }

  const btn=$('#omapSaveBtn'); if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
  const prog=$('#omapProg');
  PACK_DL={ abort:false };
  // 7枚ずつ: SW側は1枚15秒打ち切りのため、1依頼は最悪でも 7×15=105秒 ＜ 応答待ち120秒。
  // 「画面が打ち切ったのにSW側の処理が長く残って待ち行列が伸びる」状態を構造的に作らない
  const urls=est.urls, CH=7; let done=0, ok=0, fail=0;
  if(prog) prog.innerHTML=`<div class="card"><div class="small" id="omapProgTxt">準備中…</div>
    <button class="btn ghost" style="margin-top:8px; width:auto; padding:6px 12px;" onclick="offlineAbort()">中断</button></div>`;
  for(let i=0;i<urls.length && !PACK_DL.abort;i+=CH){
    const chunk=urls.slice(i,i+CH);
    try{ const r=await swAsk({type:'savePackTiles', urls:chunk}); ok+=r.ok||0; fail+=r.fail||0; }
    catch(e){ fail+=chunk.length; }
    done+=chunk.length;
    const t=$('#omapProgTxt');
    if(t) t.textContent=`${Math.min(done,urls.length).toLocaleString()} / ${urls.length.toLocaleString()} 枚`
      + (fail?`（取れなかった ${fail} 枚）`:'');
  }
  const aborted=PACK_DL.abort; PACK_DL=null;
  // 実際に保存できた枚数をキャッシュから数え直す。応答待ちを打ち切ったチャンクの分も
  // SW側では保存が続いているため、途中経過の数字ではなく実態を最終結果にする。
  // SWのタイル通信は1枚15秒で打ち切られるため待ち行列は必ず掃ける。5分×最大3回まで待つ
  for(let attempt=0; attempt<3; attempt++){
    try{ const rc=await swAsk({type:'countPack', urls}, 300000);
      if(rc && typeof rc.count==='number' && rc.count>=0){ ok=rc.count; fail=urls.length-ok; }
      break;
    }catch(e){ /* 時間切れ→キューが掃けるのを待ってもう一度 */ }
  }
  if(btn){ btn.disabled=false; btn.textContent='💾 この範囲を保存'; }

  // 事前登録した項目を最終結果で確定する（0枚なら登録ごと取り下げ）
  {
    let list=packStore();
    const idx=list.findIndex(x=>x.id===mine.id);
    if(ok<=0){
      if(idx>=0){ list.splice(idx,1);
        if(!packSave(list)) toast('⚠ 一覧の整理に失敗しました。「0枚」のカードが残った場合は削除してください', 5000); }
      toast('保存できませんでした（電波状況と端末の空き容量を確認してください）', 4000);
    }else{
      // 中断しても実枚数が全数そろっていれば「完全」（既存full範囲の再保存を中断してもカードを後退させない）
      const partial = fail>0 || (aborted && ok<urls.length);
      const fin=Object.assign({}, mine, {
        ok, status: partial?'partial':'full',
        mb: est.count ? est.mb*ok/est.count : est.mb,   // 容量は実枚数比で補正
        saved_at: nowISO() });
      // 確定のタイミングで、同じ範囲・設定の古いカードを整理して置き換える（仮登録時は消していない）
      list=list.filter(x=> x.id===mine.id || packSig(x)!==sigKey);
      const idx2=list.findIndex(x=>x.id===mine.id);
      if(idx2>=0) list[idx2]=fin; else list.unshift(fin);
      if(!packSave(list)){
        // 確定の書き込みに失敗しても、事前登録（一部のみ・0枚）が残っているので隠れタイルにはならない
        toast('⚠ 保存はできましたが一覧の更新に失敗しました。一覧の枚数表示が実際より少ないことがあります（保存し直すと直ります）', 6000);
      }else if(aborted && partial){
        toast('中断しました（そこまでの分は「一部のみ」として一覧に残しました。保存し直すと続きから再開します）', 4000);
      }else if(aborted){
        toast(`保存しました（${ok.toLocaleString()}枚。中断前にすべて揃っていました）`, 3000);
      }else if(fail>0){
        toast(`一部のみ保存しました（${ok.toLocaleString()} / ${urls.length.toLocaleString()}枚）。電波の良い場所で同じ範囲を保存し直すと補完されます`, 5000);
      }else{
        toast(`保存しました（${ok.toLocaleString()}枚）`, 3000);
      }
    }
  }
  // 完了時の画面更新は、この画面を見ているときだけ（他画面で入力中に画面を作り直すと入力が消えるため）
  if((STACK[STACK.length-1]||{}).name==='offlineMap') render();
}

async function deleteMapPack(id){
  if(!writeAllowed()) return;
  const list=packStore(); const p=list.find(x=>x.id===id); if(!p) return;
  if(!confirm(`「${p.name||'保存範囲'}」の地図（約${(+p.mb).toFixed(0)}MB）を消しますか？\n※範囲が重なっている他の保存分のタイルも一緒に消えることがあります（保存し直せば戻せます）`)) return;
  const area = (p.poly && p.poly.length>=3) ? {poly:p.poly} : p.bbox;

    toast('⚠ タイルは削除しましたが一覧の更新に失敗しました。もう一度「削除」を押してください', 5000); return; }

function download(filename, text, mime){
  downloadBlob(filename, new Blob([text],{type:mime||'text/plain;charset=utf-8'}));
}
function downloadBlob(filename, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function audioFilename(o,i,a){ return `${o.uuid}_${i+1}.${(a&&a.ext)||'webm'}`; }

/* ---------- 録音ZIP（無圧縮・追加ライブラリ不要） ---------- */
function crc32(u8){ let c=~0>>>0; for(let i=0;i<u8.length;i++){ c^=u8[i];
  for(let k=0;k<8;k++) c=(c>>>1)^(0xEDB88320 & -(c&1)); } return (~c)>>>0; }
function buildZip(files){
  const enc=new TextEncoder(); const parts=[]; const central=[]; let offset=0;
  const u16=n=>[n&255,(n>>8)&255]; const u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{
    const name=enc.encode(f.name); const data=f.u8; const crc=crc32(data);
    const lh=[].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(lh), name, data);
    const ch=[].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset));
    central.push({ head:new Uint8Array(ch), name });
    offset += lh.length + name.length + data.length;
  });
  const cdStart=offset; let cdSize=0;
  central.forEach(c=>{ parts.push(c.head, c.name); cdSize += c.head.length + c.name.length; });
  const end=[].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0), u16(central.length), u16(central.length),
    u32(cdSize), u32(cdStart), u16(0));
  parts.push(new Uint8Array(end));
  return new Blob(parts,{type:'application/zip'});
}
function mediaFilename(o,i,m){ const k=(m&&m.kind==='video')?'video':'photo';
  return `${o.uuid}_${k}${i+1}.${(m&&m.ext)||(k==='video'?'mp4':'jpg')}`; }
function flightAudioFilename(f,i,a){ return `flight_${f.uuid}_${i+1}.${(a&&a.ext)||'webm'}`; }

// 録音・写真・動画をまとめてZIP出力（対応表 index.csv 付き）
async function exportMediaZip(surveys, base){
  const audioItems=[], mediaItems=[], flAudioItems=[], flMediaItems=[];
  surveys.forEach(s=>{ DB.obsOf(s.uuid).forEach(o=>{
    (o.audio||[]).forEach((a,i)=>audioItems.push({s,o,a,i}));
    (o.media||[]).forEach((m,i)=>mediaItems.push({s,o,m,i}));
  });
  DB.flightsOf(s.uuid).forEach(f=>{
    (f.audio||[]).forEach((a,i)=>flAudioItems.push({s,f,a,i}));
    (f.media||[]).forEach((m,i)=>flMediaItems.push({s,f,m,i}));
  }); });
  if(!audioItems.length && !mediaItems.length && !flAudioItems.length && !flMediaItems.length){ toast('書き出す録音・写真・動画がありません'); return; }
  // 全データをメモリ上でZIP化するため、大きすぎると失敗する。事前にサイズを見積り、危険域は確認・中止する
  const totalBytes=[...audioItems,...flAudioItems].reduce((n,it)=>n+((it.a&&it.a.size)||0),0)
    + [...mediaItems,...flMediaItems].reduce((n,it)=>n+((it.m&&it.m.size)||0),0);
  const GB=1024*1024*1024;
  if(totalBytes >= 3.5*GB){ toast('データが大きすぎます（約'+(totalBytes/GB).toFixed(1)+'GB）。ZIPは作れません。フォルダ保存やクラウド保存をお使いください'); return; }
  if(totalBytes >= 0.8*GB && !confirm('約'+(totalBytes/GB).toFixed(1)+'GBあります。ZIP作成に時間がかかり、端末によっては失敗します。続けますか？')) return;
  toast('まとめています…');
  const files=[]; const idxRows=[];
  for(const it of audioItems){
    let r; try{ r=await AudioDB.get(it.a.id); }catch(e){ r=null; }
    if(!r||!r.blob) continue;
    const name=audioFilename(it.o,it.i,it.a);
    files.push({ name, u8:new Uint8Array(await r.blob.arrayBuffer()) });
    idxRows.push([name,'録音',csvCell(it.s.name),isoLocal(it.o.observed_at),csvCell(it.o.species_name_snapshot),it.o.latitude,it.o.longitude].join(','));
  }
  for(const it of mediaItems){
    let r; try{ r=await PhotoDB.get(it.m.id); }catch(e){ r=null; }
    if(!r||!r.blob) continue;
    const name=mediaFilename(it.o,it.i,it.m);
    files.push({ name, u8:new Uint8Array(await r.blob.arrayBuffer()) });
    idxRows.push([name,(it.m.kind==='video'?'動画':'写真'),csvCell(it.s.name),isoLocal(it.o.observed_at),csvCell(it.o.species_name_snapshot),it.o.latitude,it.o.longitude].join(','));
  }
  for(const it of flAudioItems){
    let r; try{ r=await AudioDB.get(it.a.id); }catch(e){ r=null; }
    if(!r||!r.blob) continue;
    const name=flightAudioFilename(it.f,it.i,it.a);
    files.push({ name, u8:new Uint8Array(await r.blob.arrayBuffer()) });
    idxRows.push([name,'録音(飛翔)',csvCell(it.s.name),isoLocal(it.f.start_time),csvCell(it.f.species_name_snapshot),'',''].join(','));
  }
  for(const it of flMediaItems){
    let r; try{ r=await PhotoDB.get(it.m.id); }catch(e){ r=null; }
    if(!r||!r.blob) continue;
    const name=flightMediaFilename(it.f,it.i,it.m);
    files.push({ name, u8:new Uint8Array(await r.blob.arrayBuffer()) });
    idxRows.push([name,(it.m.kind==='video'?'動画(飛翔)':'写真(飛翔)'),csvCell(it.s.name),isoLocal(it.f.start_time),csvCell(it.f.species_name_snapshot),'',''].join(','));
  }
  if(!files.length){ toast('データが見つかりません'); return; }
  const idx=['file,type,survey_name,observed_at,species_name,latitude,longitude'].concat(idxRows).join('\r\n');
  files.push({ name:'index.csv', u8:new TextEncoder().encode('﻿'+idx) });
  downloadBlob(`${base}_media.zip`, buildZip(files));
  toast('録音・写真・動画ZIPを書き出しました');
}
const CSV_COLS=['survey_id','survey_name','survey_date','survey_method','survey_season','survey_round','observation_id','observed_at',
  'latitude','longitude','species_name','count','detection_method','distance_band','direction','behavior','habitat','age_class','sex',

  'identification_status','confidence','needs_review','note','audio_file','media_file','external_photo_reference',
  // gps_accuracy_m: 画面には「±Xm」と出るのに書き出しに無く、GISで低精度の点を見分けられなかった（2026-08-04 全体監査）。
  // **必ず末尾に足す**。途中へ挿すと、列の順番で読んでいる外部の集計表がそこから全部ずれる
  'gps_accuracy_m',
  // individual_key: 観察と飛翔経路を「同じ鳥」として結び付けた目印。
  // 同じ値の行は同一個体なので、外部の集計でも重複を除ける
  'individual_key',

  'perch_type','perch_artificial','perch_note','perch_species','perch_height',

  'nest_id',

  // individual_key も同じ値になり、集計では1羽として数える。**必ず末尾に足す**
  'individual_label'];
function csvCell(v){ v=v==null?'':String(v);
  // 数式インジェクション対策は「数値でない」文字列にだけ適用する。
  // 負の緯度経度(-73.98)や個体数を ' 付きの文字列に変えてGIS/R/Pythonの数値処理を壊さないため。
  if(/^[=+\-@\t\r]/.test(v) && !/^[+-]?\d+(\.\d+)?$/.test(v)) v="'"+v;
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }

      individual_label:o.individual_label||'',   // 同じ鳥を追ったときの呼び名（飛翔の書き出しと同じ項目名）

  });});
  return rows;
}

/* ---------- 報告書向け出力（種一覧表・地点×種マトリクス） #9 ---------- */
const BREED_ORDER={A:3,B:2,C:1,'':0};
function exportReport(surveys, base){
  // 種ごとに集計（延べ個体数・記録件数・確認方法・繁殖ランク最高・保全指定）。観察＋飛翔経路を合流
  const bySp={}; const svCols=[];   // svCols: {uuid,label} 調査ごとに一意の列
  const svLabel=s=>`${s.name||'（無題）'}${s.round_no?` 第${s.round_no}回`:''}${s.survey_date?' '+fmtDate(s.survey_date):''}`;
  // 1個体を「止まり2か所＋経路1本」のように分けて保存するので、
  // 実数は目印（individual_key）ごとに重複を除いて数える（集計画面と同じ数え方）。
  // 種で分ける前に調査ごとにまとめる——同じ目印に別の種名が付いていても二重に数えないため
  // Map / 素性のないオブジェクトを使う（調査IDが __proto__ などでも壊れないように）
  const svRecs=new Map();
  const addRec=(s,nm,rec,method,behavior,hasName)=>{
    const key=nm||'（未同定）';
    const m=bySp[key]||(bySp[key]={name:key, total:0, totalRaw:0, records:0, methods:new Set(), rank:'', bySurvey:Object.create(null)});
    m.records++;
    m.totalRaw+=indCount(rec.count);   // 延べ数（重複除外なし）も別に持つ
    if(method) m.methods.add(method);
    const r=breedingRank(behavior, hasName);
    if(BREED_ORDER[r]>BREED_ORDER[m.rank]) m.rank=r;
    if(!svRecs.has(s.uuid)) svRecs.set(s.uuid, []);
    svRecs.get(s.uuid).push({sp:key, key:String(rec.individual_key||'').trim(), c:indCount(rec.count)});
  };
  surveys.forEach(s=>{ svCols.push({uuid:s.uuid, label:svLabel(s)});
    DB.obsOf(s.uuid).forEach(o=>{
      addRec(s, o.species_name_snapshot, {individual_key:o.individual_key||'', count:o.count},
        o.detection_method, o.behavior, !!o.species_name_snapshot); });
    // 飛翔経路も種一覧に合流（集計画面と同じく2点以上の経路のみ）
    DB.flightsOf(s.uuid).forEach(f=>{ if((f.path||[]).filter(validPathPt).length<2) return;
      addRec(s, f.species_name_snapshot, {individual_key:f.individual_key||'', count:f.count},
        '飛翔', f.behavior, !!f.species_name_snapshot); });
  });
  const names=Object.keys(bySp);
  if(!names.length){ toast('書き出す観察記録がありません'); return; }
  // 目印が同じ記録は「同じ1羽」。いちばん多い個体数を、その記録の種に1回だけ足す
  svRecs.forEach((list, su)=>{
    const best=new Map();
    list.forEach(r=>{
      if(!r.key){ const m=bySp[r.sp]; m.bySurvey[su]=(m.bySurvey[su]||0)+r.c; return; }
      const cur=best.get(r.key);
      // 種は最初に出てきたものに固定し、個体数だけ多い方を採る（集計画面と同じ扱い）
      if(cur==null) best.set(r.key, {sp:r.sp, c:r.c});
      else if(r.c>cur.c) best.set(r.key, {sp:cur.sp, c:r.c});
    });
    best.forEach(v=>{ const m=bySp[v.sp]; m.bySurvey[su]=(m.bySurvey[su]||0)+v.c; });
  });
  names.forEach(nm=>{ const m=bySp[nm];
    m.total=Object.keys(m.bySurvey).reduce((n,su)=>n+m.bySurvey[su], 0);
  });
  // 種の分類順（種名マスタの並び）でソート。未同定・マスタ外は末尾
  const ord=nm=>{ const sp=speciesByName(nm); return sp? sp.species_id : 99999; };
  names.sort((a,b)=>ord(a)-ord(b)||a.localeCompare(b));

  // 1) 種一覧表
  // 「延べ個体数」＝記録された数の単純合計、「実数」＝同じ鳥（目印が同じ記録）を1羽と数えた値。
  // 集計画面と同じ分け方。1つの数字だけ出すと、どちらの意味か取り違えられる
  const listCols=['和名','学名','延べ個体数','実数（同一個体の重複除外）','記録件数','確認方法','繁殖ランク','環境省RL','北海道RL','種の保存法','天然記念物'];
  const listRows=names.map(nm=>{ const m=bySp[nm]; const sp=speciesByName(nm);
    return [nm, sp?sp.scientific_name:'', m.totalRaw, m.total, m.records, [...m.methods].join('・'),
      (BREED_LABEL[m.rank]||''), csvConserv(nm,'e'), csvConserv(nm,'k'), csvConserv(nm,'h'), csvConserv(nm,'t')]; });
  const listCsv='﻿'+[listCols.join(',')].concat(listRows.map(r=>r.map(csvCell).join(','))).join('\r\n');
  download(`${base}_species_list.csv`, listCsv, 'text/csv;charset=utf-8');

  // 2) 地点×種マトリクス（行=種, 列=調査（一意）, 値=実数＝同一個体の重複除外）。同名の別回次でも列を分ける
  const matCols=['和名（値は実数＝同一個体の重複除外）'].concat(svCols.map(c=>c.label));
  const matRows=names.map(nm=>{ const m=bySp[nm];
    return [nm].concat(svCols.map(c=>m.bySurvey[c.uuid]||0)); });
  const matCsv='﻿'+[matCols.map(csvCell).join(',')].concat(matRows.map(r=>r.map(csvCell).join(','))).join('\r\n');
  download(`${base}_site_species_matrix.csv`, matCsv, 'text/csv;charset=utf-8');

  // 3) 止まり・巣の明細（新しく記録できるようになった項目を、報告書でも使えるように出す）
  const detCols=['調査','記録ID','同一個体の目印','和名','観察日時',
    '鳥の緯度','鳥の経度','止まっていたもの','高さ・サイズ','樹種の分類','樹種名','樹高(m)','人工物','メモ',
    '巣の緯度','巣の経度','営巣木の樹種','営巣木の樹高(m)','巣の状態'];
  const detRows=[];
  // 巣の代表を先に決める（地図・書き出しと同じ見分け方）。代表以外は巣の列を空にする。
  // 代表の行には、同じ巣の他の記録から補った内容（位置だけ・状態だけの分）を重ねて出す
  const nestRepMap=new Map(nestGroups(surveys.reduce((a,s)=>a.concat(DB.obsOf(s.uuid)),[])).map(o=>[o.uuid,o]));
  const nestRep=new Set(nestRepMap.keys());
  surveys.forEach(s=>{ DB.obsOf(s.uuid).forEach(o=>{
    const hasPerch=[o.perch_type,o.perch_size,o.perch_class,o.perch_species,o.perch_height,o.perch_artificial,o.perch_note].some(Boolean);
    const tp=coordPair(o.target_latitude,o.target_longitude);
    const np=coordPair(o.nest_latitude,o.nest_longitude);
    const hasTarget=!!tp[0];
    const hasNest=!!np[0]||o.nest_state||o.nest_tree_species||o.nest_tree_height;
    if(!hasPerch && !hasTarget && !hasNest) return;
    // 同じ巣が複数の記録に写されている分は、巣の列だけ空にして二重に数えないようにする
    const dup = hasNest && !nestRep.has(o.uuid);
    detRows.push([svLabel(s), o.uuid, o.individual_key||'', o.species_name_snapshot||'（未同定）', isoLocal(o.observed_at),
      tp[0], tp[1],
      o.perch_type||'', o.perch_size||'', o.perch_class||'', o.perch_species||'', o.perch_height||'',
      o.perch_artificial||'', o.perch_note||'',
      dup?'':coordPair((nestRepMap.get(o.uuid)||o).nest_latitude,(nestRepMap.get(o.uuid)||o).nest_longitude)[0],
      dup?'':coordPair((nestRepMap.get(o.uuid)||o).nest_latitude,(nestRepMap.get(o.uuid)||o).nest_longitude)[1],
      dup?'':((nestRepMap.get(o.uuid)||o).nest_tree_species||''),
      dup?'':((nestRepMap.get(o.uuid)||o).nest_tree_height||''),
      dup?'':((nestRepMap.get(o.uuid)||o).nest_state||'')]);
  }); });
  if(detRows.length){
    const detCsv='\ufeff'+[detCols.map(csvCell).join(',')].concat(detRows.map(r=>r.map(csvCell).join(','))).join('\r\n');
    download(`${base}_perch_nest.csv`, detCsv, 'text/csv;charset=utf-8');
  }
  toast('報告書用（種一覧・地点×種'+(detRows.length?'・止まり/巣':'')+'）を書き出しました');
}
function exportGeoJSON(surveys, base){
  // 観察者の位置・鳥がいた場所・巣の位置は別々の点として出す。
  // 観察者の位置だけで絞ると、測位が取れなかった記録の鳥や巣が丸ごと落ちてしまう
  const rows=buildRows(surveys);
  // 有効かどうかの判定は地図・案内と同じ validLatLon を使う。
  // 別々に判定すると「緯度91」のような値が書き出しにだけ出て、件数も食い違う
  const has=(r,la,lo)=>validLatLon(String(r[la]||''), String(r[lo]||''));
  const fcOf=(list,la,lo)=>({ type:'FeatureCollection', features:list.map(r=>({
    type:'Feature',
    geometry:{ type:'Point', coordinates:[parseFloat(r[lo]), parseFloat(r[la])] },
    properties: CSV_COLS.reduce((p,c)=>{ p[c]=r[c]; return p; }, {})
  }))});
  let n=0;
  const put=(list,la,lo,name)=>{ if(!list.length) return;
    download(`${base}_${name}.geojson`, JSON.stringify(fcOf(list,la,lo),null,1), 'application/geo+json'); n++; };
  put(rows.filter(r=>has(r,'latitude','longitude')), 'latitude','longitude', 'observations');
  put(rows.filter(r=>has(r,'target_latitude','target_longitude')), 'target_latitude','target_longitude', 'bird_positions');
  // 同じ巣が複数の記録に写されているので、1件にまとめる
  // 巣は生の記録から代表を決める（buildRows の行には updated_at が無く、「最新を基準」が働かないため）。
  // 代表の補完済みの内容を、その記録の書き出し行に重ねて出す
  const nestReps=uniqNests(surveys.reduce((a,sv)=>a.concat(DB.obsOf(sv.uuid)),[]));
  const rowByObs=new Map(rows.map(r=>[r.observation_id, r]));
  const nestRows=nestReps.map(o=>{
    const r=Object.assign({}, rowByObs.get(o.uuid)||{});
    ['nest_id','nest_tree_species','nest_tree_height','nest_state'].forEach(k=>{ r[k]=o[k]||''; });
    // 座標は数値の0を落とさない書き方で写す
    r.nest_latitude=coordStr(o.nest_latitude); r.nest_longitude=coordStr(o.nest_longitude);
    return r;
  }).filter(r=>r.observation_id);
  put(nestRows, 'nest_latitude','nest_longitude', 'nests');
  if(!n){ toast('位置付きの記録がありません'); return; }
  toast('GeoJSONを書き出しました（'+n+'ファイル）');
}
// 飛翔経路を線データ（LineString）でGeoJSON出力（QGISで使える）
// 生データ版（タップ点そのまま）と曲線版（滑らかにした線）の2ファイルを書き出す
function flightFeature(s,f,path){
  return { type:'Feature',
    geometry:{ type:'LineString', coordinates: path.map(p=>[p[1],p[0]]) },  // [lon,lat]
    properties:{ survey_id:s.uuid, survey_name:s.name, flight_id:f.uuid,
      species_name:f.species_name_snapshot||'', age_class:ageNorm(f.age_class), individual_label:f.individual_label||'',
      start_time:isoLocal(f.start_time), end_time:isoLocal(f.end_time),
      height_class:f.height_class||'', behavior:f.behavior||'', count:indCount(f.count),
      individual_key:f.individual_key||'',
      length_m: Math.round(pathLength(path)),
      audio_file:(f.audio||[]).map((a,i)=>flightAudioFilename(f,i,a)).join(';'),
      media_file:(f.media||[]).map((m,i)=>flightMediaFilename(f,i,m)).join(';'),
      memo:f.memo||'' } };
}
function exportFlightsGeoJSON(surveys, base){
  const raw=[], smooth=[];
  surveys.forEach(s=>{ DB.flightsOf(s.uuid).forEach(f=>{
    const path=(f.path||[]).filter(validPathPt);
    if(path.length<2) return;
    raw.push(flightFeature(s,f,path));
    smooth.push(flightFeature(s,f,smoothPath(path)));
  });});
  if(!raw.length){ toast('書き出す飛翔経路がありません'); return; }
  download(`${base}_flights.geojson`, JSON.stringify({type:'FeatureCollection', features:raw}, null, 1), 'application/geo+json');
  download(`${base}_flights_smooth.geojson`, JSON.stringify({type:'FeatureCollection', features:smooth}, null, 1), 'application/geo+json');
  toast('飛翔経路GeoJSON（生・曲線）を書き出しました');
}
const HYP_COLS=['survey_id','survey_name','hypothesis_id','title','hypothesis_text','expected_result',
  'rationale','required_data','target_species','target_location','status'];
const HYPRES_COLS=['survey_id','hypothesis_id','hypothesis_title','result_id','verified_at','observed_result',
  'judgment','judgment_reason','missing_information','alternative_explanation','next_action','next_method','note'];
function exportHypCSV(surveys, base){
  const hrows=[], rrows=[];
  surveys.forEach(s=>{ DB.hypOf(s.uuid).forEach(h=>{
    hrows.push({ survey_id:s.uuid, survey_name:s.name, hypothesis_id:h.uuid, title:h.title,
      hypothesis_text:h.hypothesis_text, expected_result:h.expected_result, rationale:h.rationale,
      required_data:h.required_data, target_species:h.target_species, target_location:h.target_location, status:h.status });
    DB.resultsOf(h.uuid).forEach(r=>{
      rrows.push({ survey_id:s.uuid, hypothesis_id:h.uuid, hypothesis_title:h.title, result_id:r.uuid,
        verified_at:isoLocal(r.verified_at), observed_result:r.observed_result, judgment:r.judgment,
        judgment_reason:r.judgment_reason, missing_information:r.missing_information,
        alternative_explanation:r.alternative_explanation, next_action:r.next_action,
        next_method:r.next_method, note:r.note });
    });
  });});
  if(!hrows.length){ toast('書き出す仮説がありません'); return; }
  const mk=(cols,rows)=>'﻿'+[cols.join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\r\n');
  download(`${base}_hypotheses.csv`, mk(HYP_COLS,hrows), 'text/csv;charset=utf-8');
  if(rrows.length) download(`${base}_hypothesis_results.csv`, mk(HYPRES_COLS,rrows), 'text/csv;charset=utf-8');
  toast('仮説CSVを書き出しました');
}
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(r.error||new Error('base64変換失敗')); r.readAsDataURL(blob); }); }
function b64ToBlob(b64,mime){ const bin=atob(b64||''); const u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return new Blob([u8],{type:mime||'application/octet-stream'}); }
// 全コレクションを厳格読取（1つでも破損・読取失敗なら例外）。空データでlatestを上書きする事故を防ぐ
function coreCollectionsRaw(){
  return { surveys:DB.loadRaw(DB.key.sv), observations:DB.loadRaw(DB.key.ob), notes:DB.loadRaw(DB.key.nt),
    hypotheses:DB.loadRaw(DB.key.hy), hyp_results:DB.loadRaw(DB.key.hr), flights:DB.loadRaw(DB.key.fl) };
}
// 記録のみ（軽い・base64なし）。頻繁な自動バックアップ用。読取失敗時は例外を投げて中止させる。
// opts.onlyValid: ドライブ同期用。壊れた記録・削除記録・図鑑項目を含めない。
// 受信側（validateBackupData）は1件でも不正だと全体を拒否するため、壊れたデータを配ると
// 他端末の同期を丸ごと止めてしまう。除外した分はホームの警告カードで知らせ、修復すれば次回から同期に載る。
// フォルダ自動保存・手動バックアップは全件のまま（壊れたデータの救出経路を塞がない）
function buildRecordsBackup(opts){
  opts=opts||{};
  const c=coreCollectionsRaw();
  let recent=DB.recentSpecies(), guide=myguideList(), tombs=tombstonesList();
  if(opts.onlyValid){
    // 除外した親のuuid。親の種類別に持つ（共通の集合にすると、偶然同じIDを持つ別種類の記録が
    // 除外されただけで、正常な親を参照する子まで巻き添えで除外されるため）。
    // 数値uuidの親（旧データ）は文字列化した値で登録する（子の参照は文字列で残っていることがある）
    const dropped={ surveys:new Set(), hypotheses:new Set() };
    const idOf=x=>{ if(!x || typeof x!=='object') return null;
      if(typeof x.uuid==='string' && x.uuid) return x.uuid;
      if(typeof x.uuid==='number' && isFinite(x.uuid)) return String(x.uuid);
      return null; };
    for(const name of ['surveys','observations','notes','hypotheses','hyp_results','flights']){
      // 入れ物ごと壊れている場合は部分的に配らず中止（点検・修復へ誘導）
      if(!Array.isArray(c[name])) throw new Error('「'+name+'」のデータが壊れています。ホームの「データ点検・修復」で直してください');
      c[name]=c[name].filter(x=>{ if(okRecord(name,x)) return true;
        const iv=idOf(x); if(iv && dropped[name]) dropped[name].add(iv);
        return false; });
    }
    // 親が除外された子は一緒に除外する。子だけ配ると、受け取り側に「どの一覧からも
    // たどれない記録」が固定化されるため。親を修復すれば次回から親子そろって同期される
    for(const n of ['observations','notes','hypotheses','flights']){
      c[n]=c[n].filter(x=>{ if(x.survey_uuid && dropped.surveys.has(x.survey_uuid)){
        if(n==='hypotheses'){ const iv=idOf(x); if(iv) dropped.hypotheses.add(iv); }   // 仮説の道連れは検証結果へ連鎖
        return false; } return true; });
    }
    c.hyp_results=c.hyp_results.filter(x=>!(x.hypothesis_uuid && dropped.hypotheses.has(x.hypothesis_uuid)));
    // tombstonesListは型しか検査しないため、日時が壊れた削除記録（受信側が拒否する）をここで確実に除く
    tombs=tombs.filter(okTombstone);
    guide=Array.isArray(guide)?guide.filter(g=>g!=null && okGuideItem(g)):[];
    recent=Array.isArray(recent)?recent.filter(s=>typeof s==='string'):[];
  }
  return { app:'bird_survey', kind:'records', version:6, exported_at:nowISO(),
    surveys:c.surveys, observations:c.observations, notes:c.notes,
    hypotheses:c.hypotheses, hyp_results:c.hyp_results, flights:c.flights,
    recent, myguide:guide, tombstones:tombs };
}
// 全部（録音・写真をbase64同梱）。重い。メディア読取や記録読取に失敗したら例外を投げて中止（空上書き防止）
async function buildFullBackup(){
  const c=coreCollectionsRaw();   // 先に記録を厳格読取（失敗ならここで throw）
  const audio=[], media=[];
  const metasA=await AudioDB.all();   // 失敗時は reject が伝播し buildFullBackup 全体が失敗する
  for(const a of metasA){ if(!a||!a.blob) continue;
    audio.push({ id:a.id, mime:a.mime, ext:a.ext, dur:a.dur, size:a.size, obs_uuid:a.obs_uuid, flight_uuid:a.flight_uuid,
      created_at:a.created_at, b64:await blobToB64(a.blob) }); }
  const metasM=await PhotoDB.all();
  for(const m of metasM){ if(!m||!m.blob) continue;
    media.push({ id:m.id, kind:m.kind, mime:m.mime, ext:m.ext, size:m.size, name:m.name, obs_uuid:m.obs_uuid, flight_uuid:m.flight_uuid,
      created_at:m.created_at, b64:await blobToB64(m.blob) }); }
  return { app:'bird_survey', version:6, exported_at:nowISO(),
    surveys:c.surveys, observations:c.observations, notes:c.notes,
    hypotheses:c.hypotheses, hyp_results:c.hyp_results, flights:c.flights,
    recent:DB.recentSpecies(), myguide:myguideList(), tombstones:tombstonesList(), audio, media };
}
async function exportBackup(){
  toast('バックアップを作成中…（写真・動画が多いと時間がかかります）');
  let data; try{ data=await buildFullBackup(); }
  catch(e){ toast('バックアップを中止しました（データを読めませんでした。書き出していません）'); return; }
  download(`bird_survey_backup_${dateValue().replace(/-/g,'')}.json`, JSON.stringify(data), 'application/json');
  toast('バックアップを書き出しました');
}

/* ---------- フォルダに自動保存（PC Chrome/Edge・Android Chrome。iPhoneは非対応） ---------- */
function fsSupported(){ return typeof window!=='undefined' && 'showDirectoryPicker' in window; }
function kvPut(key,val){ return idbDo('kv','readwrite', st=>st.put({key, val})); }
function kvGet(key){ return idbDo('kv','readonly', st=>st.get(key)).then(r=>r&&r.val); }
let _fsDir=null;
function fsLoadSaved(){ if(!fsSupported()) return Promise.resolve(); return kvGet('fsdir').then(h=>{ if(h) _fsDir=h; }).catch(()=>{}); }
async function fsPerm(mode){ if(!_fsDir) return 'no';
  try{ if((await _fsDir.queryPermission({mode}))==='granted') return 'granted';
    return await _fsDir.requestPermission({mode}); }catch(e){ return 'error'; } }
async function pickBackupFolder(){
  if(!fsSupported()){ toast('この端末では使えません（PCのChrome/Edgeで）'); return; }
  try{ const h=await window.showDirectoryPicker({mode:'readwrite'}); _fsDir=h; await kvPut('fsdir',h);
    toast('保存フォルダを設定しました'); await fsBackupRecords(); render();
  }catch(e){ /* キャンセル等 */ }
}

function gdriveGetToken(interactive){

    if(gdriveSignedIn()) return resolve(GTOKEN.access_token);
    if(!interactive) return reject(new Error('未サインイン'));

    try{

        client_id: cfg.clientId, scope: GDRIVE_SCOPE,
        prompt: 'select_account',
        callback: (resp)=>{
          if(resp && resp.access_token){

            resolve(resp.access_token);

        },
        error_callback: (err)=>reject(new Error((err&&err.type)||'サインインが中断されました'))

  });

async function gdriveFetch(path, opts, token){

  if(res.status===401){ gdriveTokenClear(); }   // 認証切れのみトークン破棄。403(権限)はトークン自体は有効なので残す
  if(!res.ok){ const t=await res.text().catch(()=>''); throw new Error('Drive '+res.status+' '+t.slice(0,140)); }
  return res.json();

async function gdriveEnsureFolder(token){
  // IDのキャッシュはしない（自分が作ったフォルダIDを覚え込むと、2端末が同時に作成した場合に
  // それぞれ別フォルダを使い続けて同期先が分岐するため）。毎回「作成日が最も古い同名フォルダ」を
  // 検索して採用することで、重複ができても全端末が同じフォルダへ収束する
  const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='"+GDRIVE_FOLDER+"' and trashed=false");
  const url='drive/v3/files?spaces=drive&orderBy='+encodeURIComponent('createdTime')+'&fields=files(id)&q='+q;
  const list=await gdriveFetch(url, {}, token);
  if(list.files && list.files.length) return list.files[0].id;
  const created=await gdriveFetch('drive/v3/files?fields=id', { method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ name:GDRIVE_FOLDER, mimeType:'application/vnd.google-apps.folder' }) }, token);
  // 作成直後にもう一度検索して最古を採用（同時に2端末が作成しても、以後は同じ方へ収束する）
  const again=await gdriveFetch(url, {}, token);
  return (again.files && again.files.length) ? again.files[0].id : created.id;

async function gdriveUpsertFile(folderId, name, contentStr, token){
  const q=encodeURIComponent("name='"+name.replace(/'/g,"\\'")+"' and '"+folderId+"' in parents and trashed=false");
  const list=await gdriveFetch('drive/v3/files?spaces=drive&fields=files(id)&q='+q, {}, token);
  let id;
  if(list.files && list.files.length){ id=list.files[0].id; }
  else{
    const created=await gdriveFetch('drive/v3/files?fields=id', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ name, parents:[folderId] }) }, token);
    id=created.id;
  }
  const up=await gdriveFetch('upload/drive/v3/files/'+id+'?uploadType=media&fields=id,modifiedTime', { method:'PATCH',
    headers:{'Content-Type':'application/json'}, body:contentStr }, token);
  return { id, modifiedTime:(up&&up.modifiedTime)||'' };

      const data=await buildFullBackup(); await gdrivePush('full', data, token);
    });
    toast('Googleドライブに保存しました（録音・写真含む）'); render();
  }catch(e){ toast('保存に失敗: '+(e.message||e)); }
}

/* ---------- Googleドライブ同期（端末間の引き継ぎ：iPhone⇔iPad） ----------
   正本はドライブ上の birdsurvey_records_latest.json（既存の自動保存と同じファイル）。
   写真・録音は media サブフォルダに1件1ファイルで置き、記録は updated_at の新しい方を残して合体する。
   動画は容量が大きいため自動では送受信しない（クラウド保存画面の手動ボタンのみ）。 */

// この端末の固有ID。各端末は自分専用の同期ファイル birdsurvey_sync_<ID>.json にしか書き込まない。
// これにより「上書きで他端末の保存が消える」事故が構造的に起きない（読むのは全端末のファイル、書くのは自分のだけ）
function deviceId(){ let d=localStorage.getItem('bs_device_id');
  if(!d){ d=uuid(); try{ localStorage.setItem('bs_device_id', d); }catch(e){} } return d; }
function syncFileName(){ return 'birdsurvey_sync_'+deviceId()+'.json'; }

// 対話サインインの後は必ず「誰のドライブか」を確認し、持ち主（クライアントID×アカウント）が変わっていたら
// 同期の控え（既読・辞退・アップ済み一覧）をリセットする。前の持ち主の控えを引きずると、
// 新しいアカウントの記録を取り込み損ねたり、未送信のメディアを送信済みと誤認するため。
// ※持ち主印(bs_sync_owner)はサインアウトでは消さない（サインアウト→別アカウント、という切替も検知するため）
// 戻り値false＝確認またはリセットに失敗（呼び出し側は同期を中止すること）
async function gdriveConfirmOwner(token){
  let email='';
  try{ const about=await gdriveFetch('drive/v3/about?fields=user(emailAddress)', {}, token);
    email=(about.user&&about.user.emailAddress)||''; }catch(e){ return false; }
  if(!email) return false;
  GUSER=email; try{ localStorage.setItem('bs_gdrive_user', email); }catch(e){}
  const owner=(gdriveCfg().clientId||'')+'|'+email;
  if((localStorage.getItem('bs_sync_owner')||'')!==owner){
    localStorage.removeItem('bs_sync_seen'); localStorage.removeItem('bs_sync_declined'); localStorage.removeItem('bs_sync_invalid');
    try{ await kvPut('gdrive_media_map', {audio:{},media:{}}); }catch(e){ return false; }
    try{ localStorage.setItem('bs_sync_owner', owner); }catch(e){ return false; }
  }
  return true;
}

// 既読情報 {fileId: modifiedTime}。ドライブ上の同期ファイルがこれより新しければ「未取り込みの保存」と判断
function syncSeenLoad(){ try{ const m=JSON.parse(localStorage.getItem('bs_sync_seen')||'{}');
  return (m && typeof m==='object' && !Array.isArray(m))?m:{}; }catch(e){ return {}; } }
function syncSeenMark(fileId, modifiedTime){ try{ const m=syncSeenLoad(); m[fileId]=modifiedTime;
  localStorage.setItem('bs_sync_seen', JSON.stringify(m)); }catch(e){} }
// 検査不合格の同期ファイル {fileId: modifiedTime}。既読とは別管理（既読=取り込み済みの意味を守る）。
// 同じ版について起動のたびに確認ダイアログや再取得を繰り返さないための印。
// ファイルが更新されれば（相手端末が修復すれば）modifiedTimeが変わるので自動で再試行される。手動の「今すぐ同期」は印を無視して再試行する
function syncInvalidLoad(){ try{ const m=JSON.parse(localStorage.getItem('bs_sync_invalid')||'{}');
  return (m && typeof m==='object' && !Array.isArray(m))?m:{}; }catch(e){ return {}; } }
function syncInvalidMark(fileId, modifiedTime){ try{ const m=syncInvalidLoad(); m[fileId]=modifiedTime||'';
  localStorage.setItem('bs_sync_invalid', JSON.stringify(m)); }catch(e){} }
function syncInvalidHas(fileId, modifiedTime){ const m=syncInvalidLoad();
  return Object.prototype.hasOwnProperty.call(m, fileId) && m[fileId]===(modifiedTime||''); }

// ドライブ上の同期ファイル一覧（全端末分）。旧形式 birdsurvey_records_latest.json も取り込み対象に含める（v50以前との互換）
async function gdriveListSyncFiles(token){
  const folderId=await gdriveEnsureFolder(token);
  const q=encodeURIComponent("(name contains 'birdsurvey_sync_' or name = 'birdsurvey_records_latest.json') and '"+folderId+"' in parents and trashed=false");
  const files=[]; let pageToken='';
  do{
    const res=await gdriveFetch('drive/v3/files?spaces=drive&pageSize=100&fields=nextPageToken,files(id,name,modifiedTime)&q='+q
      +(pageToken?('&pageToken='+encodeURIComponent(pageToken)):''), {}, token);
    (res.files||[]).forEach(f=>files.push(f));
    pageToken=res.nextPageToken||'';
  }while(pageToken);
  const out=files.filter(f=>f && (f.name==='birdsurvey_records_latest.json' || /^birdsurvey_sync_[\w-]+\.json$/.test(f.name)));
  // ドライブから消えたファイルの既読情報を掃除（肥大防止）
  try{ const seen=syncSeenLoad(); const ids=new Set(out.map(f=>f.id)); let dirty=false;
    Object.keys(seen).forEach(id=>{ if(!ids.has(id)){ delete seen[id]; dirty=true; } });
    if(dirty) localStorage.setItem('bs_sync_seen', JSON.stringify(seen)); }catch(e){}
  return out;
}
// そのうち未読のもの（自分の端末のファイルは除く）
function unseenSyncFiles(files){
  const seen=syncSeenLoad(); const own=syncFileName();
  return files.filter(f=>f.name!==own && f.modifiedTime && (!seen[f.id] || String(f.modifiedTime)>String(seen[f.id])));
}

// gdriveFetch のJSON化しない版（記録JSON・メディア本体のダウンロード用）。Responseをそのまま返す
async function gdriveFetchRaw(path, token){
  const res=await fetch('https://www.googleapis.com/'+path, { headers:{Authorization:'Bearer '+token} });
  if(res.status===401){ gdriveTokenClear(); }
  if(!res.ok){ const t=await res.text().catch(()=>''); throw new Error('Drive '+res.status+' '+t.slice(0,140)); }
  return res;
}

// 同期対象のメディア一覧＝「観察・飛翔レコードが参照している録音・写真・動画」。
// 図鑑の切り抜き画像や資料PDFはレコードから参照されないため、この集め方だと自然に対象外になる。
// 読取失敗時は例外（壊れた状態で同期して他端末を巻き込まないため）
function collectMediaRefs(){
  const refs=[]; const seen=new Set();
  const take=(owner, ownerType, field, store)=>{ (owner[field]||[]).forEach(m=>{
    if(m && m.id && !seen.has(store+':'+m.id)){ seen.add(store+':'+m.id);
      refs.push({ store, id:m.id, ext:m.ext||'', mime:m.mime||'',
        kind:(store==='audio'?'audio':(m.kind||'photo')), meta:m, ownerType, ownerUuid:owner.uuid }); } }); };
  DB.loadRaw(DB.key.ob).forEach(o=>{ take(o,'obs','audio','audio'); take(o,'obs','media','media'); });
  DB.loadRaw(DB.key.fl).forEach(f=>{ take(f,'flight','audio','audio'); take(f,'flight','media','media'); });
  return refs;
}
// ドライブ上のファイル名。idは英数字とハイフンのみ(safeId検証済み)なのでそのまま使える
function mediaFileName(ref){ return ref.store+'_'+ref.id+(ref.ext?('.'+String(ref.ext).replace(/^\./,'')):''); }

// アップロード済みメディアの控え {audio:{id:driveFileId}, media:{...}}。
// 正本はドライブの実ファイルで、これは通信節約用のキャッシュ（消えてもファイル名検索で復元される）
function syncMapLoad(){ return kvGet('gdrive_media_map').then(m=>{ m=(m&&typeof m==='object')?m:{};
  m.audio=m.audio||{}; m.media=m.media||{}; return m; }).catch(()=>({audio:{},media:{}})); }
function syncMapSave(m){ return kvPut('gdrive_media_map', m).catch(()=>{}); }
// idが'constructor'等でも誤判定しないよう、継承プロパティを除いた自身の項目だけで判定する
function syncMapHas(m,store,id){ return !!m[store] && Object.prototype.hasOwnProperty.call(m[store], id); }

// バックアップフォルダ内の media サブフォルダを確保（無ければ作成）。
// 親フォルダと同じ理由でキャッシュせず、常に最古の同名フォルダへ収束させる
async function gdriveEnsureMediaFolder(parentId, token){
  const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='media' and '"+parentId+"' in parents and trashed=false");
  const url='drive/v3/files?spaces=drive&orderBy='+encodeURIComponent('createdTime')+'&fields=files(id)&q='+q;
  const list=await gdriveFetch(url, {}, token);
  if(list.files && list.files.length) return list.files[0].id;
  const created=await gdriveFetch('drive/v3/files?fields=id', { method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ name:'media', mimeType:'application/vnd.google-apps.folder', parents:[parentId] }) }, token);
  const again=await gdriveFetch(url, {}, token);
  return (again.files && again.files.length) ? again.files[0].id : created.id;
}
// blob（録音・写真・動画の実体）のアップロード。gdriveUpsertFileと同じ「検索→無ければ作成→本体PATCH」方式
async function gdriveUploadBlob(folderId, name, blob, mime, token){
  const q=encodeURIComponent("name='"+name.replace(/'/g,"\\'")+"' and '"+folderId+"' in parents and trashed=false");
  const list=await gdriveFetch('drive/v3/files?spaces=drive&fields=files(id)&q='+q, {}, token);
  let id;
  if(list.files && list.files.length){ id=list.files[0].id; }
  else{
    const created=await gdriveFetch('drive/v3/files?fields=id', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ name, parents:[folderId] }) }, token);
    id=created.id;
  }
  await gdriveFetch('upload/drive/v3/files/'+id+'?uploadType=media', { method:'PATCH',
    headers:{'Content-Type': mime||'application/octet-stream'}, body:blob }, token);
  return id;
}
// 未アップロード分（レコード参照 − アップ済み控え）をドライブへ。既定は動画以外、videoOnly:trueで動画だけ。
// 失敗した分は控えに載らないため、次回の自動保存や「今すぐ同期」で自然に再試行される
async function gdrivePushMedia(token, opts){
  opts=opts||{};
  return gdriveSerial(async ()=>{
    // 不正なIDの参照はドライブのファイル名・検索クエリに使えないため除外（修復すれば次回から対象になる）
    const refs=collectMediaRefs().filter(r=>okUuid(r.id))
      .filter(r=> opts.videoOnly ? r.kind==='video' : r.kind!=='video');
    const map=await syncMapLoad();
    const todo=refs.filter(r=>!syncMapHas(map,r.store,r.id));
    if(!todo.length) return {done:0, skip:0};
    const parentId=await gdriveEnsureFolder(token);
    const folderId=await gdriveEnsureMediaFolder(parentId, token);
    let done=0, skip=0;
    for(const r of todo){
      const rec=await (r.store==='audio'?AudioDB:PhotoDB).get(r.id).catch(()=>null);
      if(!rec || !rec.blob){ skip++; continue; }   // 実体がこの端末に無い（別端末で撮影など）は送れないのでスキップ
      const fid=await gdriveUploadBlob(folderId, mediaFileName(r), rec.blob, r.mime||rec.mime, token);
      map[r.store][r.id]=fid;
      await syncMapSave(map);          // 1件成功するごとに控えを保存（途中で切れても続きから再開できる）
      done++;
      if(opts.progress){ try{ opts.progress(done, todo.length); }catch(e){} }
    }
    return {done, skip};
  });
}

// 同期で受け取ったバックアップの厳格検証。1箇所でも不正なら全体を拒否する（壊れたデータの取り込み・再配布を防ぐ）
function validateBackupData(d){
  const bad=msg=>{ throw new Error('ドライブ上のデータ形式が不正です（'+msg+'）'); };
  const isPlain=x=>x && typeof x==='object' && !Array.isArray(x);
  // レコードの検査は共通の okRecord を使う。取込側（importIdsOk）と同じ関数にすることで、
  // 「取込では通るのに同期は拒否し続ける」データが作られる余地をなくす。
  if(!isPlain(d)) bad('全体');
  if(d.app!=='bird_survey') bad('種別');
  if(d.kind!=='records') bad('種類');
  if(d.version!==6) bad('版'+d.version+'。アプリを最新に更新してください');
  for(const name of ['surveys','observations','notes','hypotheses','hyp_results','flights']){
    if(!Array.isArray(d[name])) bad(name);
    for(const x of d[name]){ if(!okRecord(name, x)) bad(name+'の要素'); }
  }
  if(d.tombstones!=null){
    if(!Array.isArray(d.tombstones)) bad('削除記録');
    for(const t of d.tombstones){ if(!okTombstone(t)) bad('削除記録の要素'); }
  }
  if(d.myguide!=null){
    if(!Array.isArray(d.myguide)) bad('マイ図鑑');
    for(const g of d.myguide){ if(!okGuideItem(g)) bad('マイ図鑑の要素'); }   // 取込側と同じ関数
  }
  return true;
}
// media サブフォルダの全ファイル一覧（名前→fileId）。件数が多い場合のページ送りにも対応
async function gdriveListMediaFiles(token){
  const parentId=await gdriveEnsureFolder(token);
  const folderId=await gdriveEnsureMediaFolder(parentId, token);
  const byName=Object.create(null); let pageToken='';
  do{
    const q=encodeURIComponent("'"+folderId+"' in parents and trashed=false");
    const res=await gdriveFetch('drive/v3/files?spaces=drive&pageSize=1000&fields=nextPageToken,files(id,name)&q='+q
      +(pageToken?('&pageToken='+encodeURIComponent(pageToken)):''), {}, token);
    (res.files||[]).forEach(f=>{ byName[f.name]=f.id; });
    pageToken=res.nextPageToken||'';
  }while(pageToken);
  return byName;
}
// 端末に実体が無い録音・写真をドライブから取り込む。既定は動画以外、videoOnly:trueで動画だけ
async function gdrivePullMedia(token, opts){
  opts=opts||{};
  const refs=collectMediaRefs().filter(r=>okUuid(r.id))   // 不正IDはファイル名を組めないため対象外（修復後に取得される）
    .filter(r=> opts.videoOnly ? r.kind==='video' : r.kind!=='video');
  const missing=[];
  for(const r of refs){
    const rec=await (r.store==='audio'?AudioDB:PhotoDB).get(r.id).catch(()=>null);
    if(!rec || !rec.blob) missing.push(r);
  }
  if(!missing.length) return {done:0, miss:0};
  const byName=await gdriveListMediaFiles(token);
  const map=await syncMapLoad();
  let done=0, miss=0;
  for(const r of missing){
    const fid=byName[mediaFileName(r)];
    if(!fid){ miss++; continue; }                    // 相手の端末がまだアップロードしていない
    let blob=null;
    try{ blob=await (await gdriveFetchRaw('drive/v3/files/'+fid+'?alt=media', token)).blob(); }catch(e){ miss++; continue; }
    const m=r.meta||{};
    const rec={ id:r.id, blob, mime:m.mime||blob.type, ext:m.ext, size:m.size||blob.size, created_at:m.created_at,
      obs_uuid: r.ownerType==='obs'?r.ownerUuid:'', flight_uuid: r.ownerType==='flight'?r.ownerUuid:'' };
    try{
      if(r.store==='audio'){ rec.dur=m.dur; await AudioDB.put(rec); }
      else{ rec.kind=m.kind||r.kind; rec.name=m.name; await PhotoDB.put(rec); }
    }catch(e){ miss++; continue; }                   // 保存失敗（容量不足など）は数えて続行
    map[r.store][r.id]=fid; await syncMapSave(map);  // 取り込めた分は「アップ済み」扱い（二重アップロード防止）
    done++;
    if(opts.progress){ try{ opts.progress(done, missing.length); }catch(e){} }
  }
  return {done, miss};
}

// 別端末のデータを合体。uuidごとに updated_at が新しい方を残す（どちらの端末の記録も消えない）。
// ローカルに無い＆削除済み(deleted_at付き)は取り込まない（完全削除したものが戻ってくるのを防ぐ）。
// 全コレクションを計算し終えてから一括保存し、途中失敗時は元に戻す（半分だけ取り込んだ状態をDriveへ再送信しないため）
function mergeRemoteRecords(d){
  // 使用権の確認が済むまで、同期の書き込みは始めない。
  // null を返すと呼び出し側が「取り込めた」と誤解して既読にしてしまうので、例外で止める
  if(!writeAllowed()) throw new Error('起動時の確認が終わるまで同期できません');
  const colKeys=[['surveys',DB.key.sv],['observations',DB.key.ob],['notes',DB.key.nt],
    ['hypotheses',DB.key.hy],['hyp_results',DB.key.hr],['flights',DB.key.fl]];
  // 形式検証: 6コレクションすべて配列であること（片方だけ取り込んで壊れた状態を作らない）
  for(const [name] of colKeys){ if(!Array.isArray(d[name])) throw new Error('ドライブ上のデータ形式が不正です（'+name+'）'); }
  let changed=0;
  // 完全削除の記録（墓標）を合体。墓標より古いレコードは両端末から取り除かれる（削除の伝搬）。
  // 墓標より新しい updated_at を持つレコード（削除後に作り直された等）は残す
  const ts=Object.create(null);
  tombstonesList().forEach(t=>{ ts[t.uuid]=t.at; });
  (Array.isArray(d.tombstones)?d.tombstones:[]).forEach(t=>{
    if(t && typeof t.uuid==='string' && t.uuid && typeof t.at==='string' && t.at){
      if(!ts[t.uuid] || String(t.at)>String(ts[t.uuid])) ts[t.uuid]=t.at; } });
  const stamp=x=>String(x.updated_at||x.created_at||'');
  const newer=(mine,theirs)=>stamp(mine)>=stamp(theirs);
  const buried=x=>{ const at=ts[x.uuid]; return !!at && String(at)>=stamp(x); };
  // 1) 全コレクションの合体結果を計算だけする（保存はまだしない）
  const merged={};
  for(const [name,key] of colKeys){
    const byId=Object.create(null);
    DB.loadRaw(key).forEach(x=>{ if(x && typeof x==='object' && x.uuid) byId[x.uuid]=x; });
    d[name].forEach(x=>{ if(!x || typeof x!=='object' || !x.uuid) return;
      const mine=byId[x.uuid];
      if(!mine){ if(!x.deleted_at){ byId[x.uuid]=x; changed++; } return; }
      if(!newer(mine,x)){ byId[x.uuid]=x; changed++; }
    });
    for(const u in byId){ if(buried(byId[u])){ delete byId[u]; changed++; } }
    merged[key]=Object.values(byId);
  }
  // マイ図鑑はid単位の追加のみ（計算だけ）。図鑑の切り抜き(source:'guide')は画像本体を同期しないため取り込まない（参照切れ防止）
  let newGuide=null;
  if(Array.isArray(d.myguide) && d.myguide.length){
    const cur=myguideList(); const byId=Object.create(null); cur.forEach(g=>{ if(g&&g.id) byId[g.id]=g; });
    d.myguide.forEach(g=>{ if(g&&g.id && g.source!=='guide' && !byId[g.id]){ byId[g.id]=g; changed++; } });
    newGuide=Object.values(byId);
  }
  // 2) 一括保存（6コレクション＋墓標＋マイ図鑑）。1つでも失敗したら全部を元へ巻き戻して中止
  const touched=colKeys.map(([,k])=>k).concat(['bs_tombstones','bs_myguide']);
  const before={}; touched.forEach(k=>{ before[k]=localStorage.getItem(k); });
  const rollback=()=>{ touched.forEach(k=>{ try{ if(before[k]==null) localStorage.removeItem(k); else localStorage.setItem(k,before[k]); }catch(e){} }); };
  for(const [,key] of colKeys){
    if(!DB.save(key, merged[key])){ rollback(); throw new Error('保存できませんでした（空き容量を確認してください）'); }
  }
  if(!tombstonesSave(Object.keys(ts).map(u=>({uuid:u, at:ts[u]}))) || (newGuide && !myguideSave(newGuide))){
    rollback(); throw new Error('保存できませんでした（空き容量を確認してください）');
  }
  // recent(最近使った種)は端末ごとでよいので同期しない
  try{ rescanLocalData(); }catch(e){}   // 取り込んだ結果でホームの警告カードを最新にする
  return changed;
}
// ドライブから未読の同期ファイルを全部取り込み、足りない写真・録音も取り込む。
// 順序は必ず「記録が先→メディアが後」（逆にすると、起動時の掃除(mediaGcAll)が
// 「どの記録も参照していないblob」と誤判定して消す恐れがある）
async function gdrivePullAll(files, token){
  if(!writeAllowed()) throw new Error('起動時の確認が終わるまで同期できません');
  return gdriveSerial(async ()=>{
    const targets=files || unseenSyncFiles(await gdriveListSyncFiles(token));
    if(!targets.length) return null;
    let changed=0, skipped=0, lastErr=null;
    for(const f of targets){
      // ファイル単位で検証・取り込み。壊れたファイル（修復前の端末が上げた等）はそのファイルだけスキップし、
      // 他の端末の正常な保存まで巻き添えで止めない。既読にはしない（相手が修復すれば次回取り込める）
      let txt;
      try{ txt=await (await gdriveFetchRaw('drive/v3/files/'+f.id+'?alt=media', token)).text(); }
      catch(e){ skipped++; lastErr=e; continue; }   // 通信の失敗は印を付けず、次回そのまま再試行
      // ここから先の失敗は「ファイルの中身の異常」なので不合格の印を付け、
      // 同じ版について確認・再取得を繰り返さない（相手が修復・更新すれば自動で再試行される）
      let d;
      try{
        // 記録のみの同期ファイルの上限（メディアは別ファイルなので正当なファイルはこの大きさに届かない）
        if(txt.length>20000000) throw new Error('同期ファイルが大きすぎます');
        d=JSON.parse(txt);
        validateBackupData(d);                      // 1ファイル内で1件でも不正ならそのファイルを拒否（例外）
      }catch(e){ skipped++; lastErr=e;
        syncInvalidMark(f.id, f.modifiedTime||'');
        continue; }
      try{
        changed+=mergeRemoteRecords(d);
        syncSeenMark(f.id, f.modifiedTime||'');     // 1ファイル取り込むごとに既読化（途中失敗でも続きから）
      }catch(e){ skipped++; lastErr=e; }            // 保存失敗（容量等）は印を付けない（データは正常なため）
    }
    if(skipped===targets.length && lastErr) throw lastErr;   // 全滅なら従来どおり失敗として知らせる
    const md=await gdrivePullMedia(token, {}).catch(()=>({done:0,miss:0}));
    return {changed, media:md, skipped};
  });
}
// 起動時：別端末からの新しい保存が無いか確認して、あれば取り込みを提案する（サインイン中だけ・失敗は静かに）。
// 新着が無くても、過去に取りこぼした写真・録音があれば静かに再取得する
async function gdriveStartupCheck(){
  try{
    if(!gdriveCfg().clientId || !gdriveSignedIn()) return;
    const token=await gdriveGetToken(false);
    const targets=unseenSyncFiles(await gdriveListSyncFiles(token))
      .filter(f=>!syncInvalidHas(f.id, f.modifiedTime));   // 検査不合格の同じ版は繰り返し聞かない（手動同期では再試行できる）
    let pulledNow=false;
    const declined=localStorage.getItem('bs_sync_declined')||'';
    const mark=targets.map(f=>f.id+'@'+f.modifiedTime).sort().join(',');
    if(targets.length && declined!==mark){   // 前回断られた同じ内容は繰り返し聞かない
      if(confirm('ドライブに新しいデータがあります（別の端末で保存された記録）。読み込みますか？\n※今の端末の記録は消えません。両方を比べて新しい方が残ります。')){
        toast('ドライブから読み込み中…');
        // ユーザーがOKした後の失敗は黙らず知らせる（確認前の通信エラー等は外側のcatchで静かに流す）
        try{
          const r=await gdrivePullAll(targets, token);
          if(r) toast(`ドライブから読み込みました：記録の取り込み${r.changed}件／写真・録音${r.media.done}件`
            +(r.skipped?`（${r.skipped}ファイルは壊れているためスキップ。保存した端末での点検・修復が必要です）`:''), r.skipped?6000:4000);
          pulledNow=true;
          // 取り込み中に入力・録音・音声認識を始めていたら画面を作り直さない（未保存の内容・聞き取りが消えるため）
          if(!SCREENS._dirty && !REC && !VREC) reset('home');
        }catch(e){ toast('読み込みに失敗しました: '+(e.message||e)); }
      }else{
        // 既読にはしない（既読は「取り込み済み」の意味。断られた印だけ残す）。
        // 各端末は自分専用ファイルにしか書かないので、取り込まなくても他端末のデータが消えることはない
        try{ localStorage.setItem('bs_sync_declined', mark); }catch(e){}
      }
    }
    // 取り込みの有無にかかわらず、過去に取りこぼした写真・録音（通信失敗・相手が後からアップロードした分）を再取得
    //（直前に取り込んだ場合はその中で取得済みなので省略）
    if(!pulledNow){
      const md=await gdrivePullMedia(token, {}).catch(()=>null);
      if(md && md.done){ toast(`写真・録音${md.done}件を取り込みました`+(md.miss?`（あと${md.miss}件は相手の端末の同期待ち）`:''));
        if(!SCREENS._dirty && !REC && !VREC) render(); }   // 入力・録音・音声認識中は画面を作り直さない（未保存の内容が消えるため）
    }
  }catch(e){ try{ console.error('sync check failed', e); }catch(_){} }
}
