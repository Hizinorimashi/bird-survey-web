/* くるくる（旋回）を経路に入れる（2026-08-13）。
   報告書の結果図（福島川・オジロワシほか）では、飛翔経路の**線そのもの**に
   大小の輪が入っている。現場で輪のまわりを1点ずつタップするのは無理なので、
   「くるくる」を押しておくと、1タップで輪を1つ入れられるようにする。
   **本物の点として入れる**ので、アプリ地図・DB地図・QGIS書き出しの
   どこでもそのまま輪に見える（描く側の細工が要らない）。
   輪の大きさは報告書の図から見当をつけた（差し径でおよそ50m／100m／200m）。 */
// r=半径(m)。現場で言う「大きさ」は**差し径（横幅）**なので、その半分を持つ
const SPIRAL_SIZES = [
  { name:'小', r:25 }, { name:'中', r:50 }, { name:'大', r:100 },
];
const SPIRAL_STEP = 16;    // 輪1つあたりの点の数（多いと記録が重くなる）
// 「進む」ときに並べる輪の数。報告書の図（藻琴川オジロワシ）は4〜8個ほど。
// 足りなければもう一度タップして並べられるので、1回ぶんは控えめにする
const SPIRAL_MOVE_LOOPS = 3;
let PF_SPIRAL = false;     // 「くるくる」を押しているか（この画面だけの状態）
function spiralSize(){
  const v=segVal('fl_spiral_size')||'中';
  return SPIRAL_SIZES.find(s=>s.name===v) || SPIRAL_SIZES[1];
}
// 輪を描く向き。右回り（時計回り）か左回りか。**利き手ではなく鳥の回り方**
function spiralSide(){ return (segVal('fl_spiral_side')==='右') ? -1 : 1; }   // 1=左回り
// その場で1周か、旋回しながら進むか
function spiralMoves(){ return segVal('fl_spiral_move')==='進む'; }
/* 隣どうしの点で経度が飛んでいるか（＝日付変更線をまたいだか）。
   **ちょうど180度も飛びとして扱う**。またぐと、地図やQGISで世界を横断する線になる。
   判定はここ1か所（テストからも同じものを呼ぶ。2026-08-13 監査） */
function lonJump(lon1, lon2){ return Math.abs(lon2-lon1)>=180; }
/* 地球のまるみに沿って、ある地点から「向き」と「距離」で移動した先を求める。
   緯度経度をメートルに換算して足し算するやり方は、極の近くや日付変更線で壊れる */
function destPoint(lat, lon, bearing, dist){
  const R=6378137, d=dist/R, t=Math.PI/180;
  const p1=lat*t, l1=lon*t;
  const p2=Math.asin(Math.sin(p1)*Math.cos(d) + Math.cos(p1)*Math.sin(d)*Math.cos(bearing));
  const l2=l1 + Math.atan2(Math.sin(bearing)*Math.sin(d)*Math.cos(p1),
                           Math.cos(d) - Math.sin(p1)*Math.sin(p2));
  let olon=l2/t;
  if(olon>180) olon-=360; else if(olon<-180) olon+=360;
  return [p2/t, olon];
}
/* 輪の点を作る。`from` から `at` へ向かっていた鳥が、`at` で輪を描いて
   同じ向きへ抜けていく形。loops=1 なら**その場で真円を1周**して `at` へ戻る。
   loops が2以上なら、輪を数珠つなぎに並べながら進む（＝旋回しながら移動。
   報告書の図にあるばね状の線。2026-08-13）。
   side=-1 で右回り（時計回り）、それ以外は左回り。
   トロコイド（回りながら進む形）は、**1周では線が交差せず「弧」にしかならない**
   ことが分かったのでやめた（2026-08-13。数式でも1周では交差しない）。
   1点目は `at` そのものなので、呼び出し側は重なりを見て足す。
   作れないとき（極の近く・日付変更線をまたぐ）は **null** を返す（2026-08-13 監査）。 */
function spiralPoints(at, from, r, side, loops){
  const lat=at[0], lon=at[1], t=Math.PI/180;
  // 進む向き（前の点から今の点へ）の方位。**前の点は呼ぶ側で確かめてある**
  let brg=0;   // 既定は北
  if(from && validPathPt(from)){
    const p1=from[0]*t, p2=lat*t;
    let dl=(lon-from[1]);
    if(dl>180) dl-=360; else if(dl<-180) dl+=360;
    dl*=t;
    const y=Math.sin(dl)*Math.cos(p2);
    const x=Math.cos(p1)*Math.sin(p2) - Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
    if(Math.abs(y)>1e-12 || Math.abs(x)>1e-12) brg=Math.atan2(y,x);
  }
  const sd=(side===-1)?-1:1;           // 1=左回り（既定）、-1=右回り
  const n=Math.max(1, loops||1);       // 並べる輪の数（1=その場、2以上=旋回しながら進む）
  const step=r*1.4;                    // 輪と輪の間隔（少し重なって数珠つなぎに見える）
  const out=[];
  // 進む向きを前、その左を横にとって、地球のまるみに沿って置く
  const put=(along,side)=>{
    const dist=Math.hypot(along,side);
    if(dist<1e-9){ out.push([lat,lon]); return; }
    // 左を向くほど方位は小さくなる（方位は北0度で時計回り）
    out.push(destPoint(lat, lon, brg - Math.atan2(side, along), dist));
  };
  put(0,0);                            // 輪に入る点（＝タップした場所）
  for(let k=0;k<n;k++){
    const c=k*step;                    // この輪に入る位置（進む向き）
    for(let i=1;i<SPIRAL_STEP;i++){
      const a=2*Math.PI*i/SPIRAL_STEP;
      // 中心は「入る点の左（右回りなら右）へ r」。入る点から1周して戻る。
      // **反転するのは横だけ**。進む向きまで反転すると、入口で後ろへ戻ってしまう
      //（2026-08-13 監査）
      put(c + r*Math.sin(a), (r - r*Math.cos(a))*sd);
    }
    // **最後の点は計算し直さず、入口の座標をそのまま置く**。
    // sin(2π)・cos(2π) から計算すると、わずかにずれて「同じ点」に見えなくなる
    //（重なりの判定や面の検査が座標によって変わる。2026-08-13 監査）
    if(k===0 && n===1) out.push([lat, lon]);
    else put(c, 0);
    if(k<n-1) put(c+step, 0);          // 次の輪へ進む
  }
  // 使えない点（極の近く）や、日付変更線をまたいだ輪は**作らない**。
  // またぐと、隣どうしの点が 179°→-179° と飛び、地図やQGISで世界を横断する線になる
  for(let i=0;i<out.length;i++){
    if(!validPathPt(out[i])) return null;
    if(i>0 && lonJump(out[i-1][1], out[i][1])) return null;
  }
  return out;
}
/* 経路に点を足す。「くるくる」を押していれば輪ごと足す。
   足す道は pfDrop の中に2つある（直している線／描いている線）ので、ここ1か所にまとめる */
function segAddPts(sg, lat, lon, now){
  if(!sg) return;
  const prev=(sg.pts||[]).length ? sg.pts[sg.pts.length-1] : null;
  if(PF_SPIRAL && segShape(sg)!==SHAPE_AREA){ segAddSpiral(sg, lat, lon, now, prev); return; }
  sg.pts.push([lat,lon]); sg.times.push(now); sg.edited=true;
}
function segAddSpiral(sg, lat, lon, now, prev){
  // **向きが分からないうちは輪を作らない。** 前の点が無いのに向きを決め打ちすると、
  // 見てもいない経路（と、その距離）を勝手に記録することになる（2026-08-13 監査）
  if(!prev || !validPathPt(prev) || (prev[0]===lat && prev[1]===lon)){
    // 呼び出し元がすでにこの点を入れていることがある（新しい線の1点目）。
    // 確かめずに足すと同じ点が2つ並ぶ
    const last0=(sg.pts||[]).length ? sg.pts[sg.pts.length-1] : null;
    if(!last0 || last0[0]!==lat || last0[1]!==lon){ sg.pts.push([lat,lon]); sg.times.push(now); }
    sg.edited=true;
    toast('どちらへ飛んでいたか分からないので、輪は入れませんでした。'
      +'先にふつうの点を1つ置いてから押してください', 5500);
    return;
  }
  const s=spiralSize(), side=spiralSide(), moves=spiralMoves();
  const ring=spiralPoints([lat,lon], prev, s.r, side, moves?SPIRAL_MOVE_LOOPS:1);
  // 作れない場所（極の近く・日付変更線をまたぐ）ではふつうの点だけにする
  if(!ring){
    const last0=(sg.pts||[]).length ? sg.pts[sg.pts.length-1] : null;
    if(!last0 || last0[0]!==lat || last0[1]!==lon){ sg.pts.push([lat,lon]); sg.times.push(now); }
    sg.edited=true;
    toast('この場所では輪を作れませんでした（ふつうの点にしました）', 5000);
    return;
  }
  // 1点目（=タップした場所）が経路の末尾と同じなら重ねない
  const last=(sg.pts||[]).length ? sg.pts[sg.pts.length-1] : null;
  ring.forEach((p,i)=>{
    if(i===0 && last && last[0]===p[0] && last[1]===p[1]) return;
    sg.pts.push(p); sg.times.push(now);
  });
  sg.edited=true;
  toast(`旋回（${s.name}・${side===-1?'右回り':'左回り'}・${moves?'進む':'その場'}）を入れました`, 2500);
}

/* 新しい L を、前の L の終点から続けて描けるようにする（2026-08-13）。
   同じ画面で描き続けている間は同じ鳥のことがほとんどで、

function segContOffset(sg){

// 新しい線を引き継ぐ点。**いまの個体の中だけ**を後ろから見て、最初の P か線の終点（面は飛ばしてその前を見る）。
// 描きかけ（1点だけ）の線が最後なら続けない（未完成の線が残ったまま次が始まる）
function contFrom(){
  for(let i=PF_SEGS.length-1;i>=0;i--){
    const sg=PF_SEGS[i];
    if(!sg) continue;
    if(sg.t==='P'){ if(sg.pt && validPathPt(sg.pt)) return { pt:[sg.pt[0], sg.pt[1]], time:sg.time||'' }; continue; }
    if(sg.t!=='F') continue;
    if(segShape(sg)===SHAPE_AREA) continue;
    const pts=sg.pts||[];
    if(pts.filter(validPathPt).length<2) return null;
    for(let k=pts.length-1;k>=0;k--){
      if(validPathPt(pts[k])) return { pt:[pts[k][0], pts[k][1]], time:(sg.times||[])[k]||'' };
    }

// 修復メモへの追記。上限に達していても、いちばん新しい理由を必ず残す
//（末尾に足して頭から切ると、今回の元の値が丸ごと消えてしまう）
function repairNoteAdd(prev, msg){
  const t=(typeof prev==='string'&&prev ? prev+' / ' : '')+msg;
  if(t.length<=REPAIR_NOTE_MAX) return t;
  const m=msg.length>REPAIR_NOTE_MAX-1 ? msg.slice(0,REPAIR_NOTE_MAX-1)+'…' : msg;
  const room=REPAIR_NOTE_MAX-m.length-4;
  return (room>0 && typeof prev==='string' && prev) ? ('…'+prev.slice(-(room))+' / '+m) : m;
}

        const pth=(of.path||[]).filter(validPathPt);
        if(pth.length<2) return;
        if(of.shape===SHAPE_AREA && pth.length>2)
          L.polygon(pth,{color:'#9b59b6',weight:2,opacity:.35,fill:false,dashArray:'4,4',interactive:false}).addTo(pfLayer);
        else
          L.polyline(smoothPath(pth),{color:'#e0a030',weight:3,opacity:.3,dashArray:'4,4',interactive:false}).addTo(pfLayer);
      });
    }
  }catch(e){}
  // 他の個体の内容は薄く重ねる（位置関係が見えないと、同じ場所を重複して記録してしまう）
  BIRDS.forEach(function(b,bi){
    if(bi===BIRD_IDX || !b.map) return;
    (b.map.segs||[]).forEach(function(sg){
      try{
        if(sg.t==='F' && sg.pts && sg.pts.length>1)
          (segShape(sg)===SHAPE_AREA && sg.pts.length>2
            ? L.polygon(sg.pts,{color:'#8a8a8a',weight:2,opacity:.35,fillColor:'#8a8a8a',fillOpacity:.12,interactive:false})
            : L.polyline(smoothPath(sg.pts),{color:'#8a8a8a',weight:3,opacity:.35,interactive:false})).addTo(pfLayer);
        if(sg.t==='P' && sg.pt)
          L.circleMarker(sg.pt,{radius:6,color:'#fff',weight:1,fillColor:'#8a8a8a',fillOpacity:.45,interactive:false}).addTo(pfLayer);
      }catch(e){}
    });
    if(b.map.nest){ try{ L.circleMarker(b.map.nest,{radius:7,color:'#fff',weight:1,fillColor:'#a894d8',fillOpacity:.4,interactive:false}).addTo(pfLayer); }catch(e){} }
  });
  const badge=(t,bg,size)=>L.divIcon({className:'',html:'<div style="background:'+bg+';border:2px solid #fff;border-radius:50%;width:'+size+'px;height:'+size+'px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700">'+t+'</div>',iconSize:[size,size],iconAnchor:[size/2,size/2]});
  // L1・L2… の番号。**丸い印にはしない**（始・終の印をやめた趣旨に合わせる）。
  // 白フチを付けた文字だけを点の右上に置く。重なっても地図が読める
  // 始点の丸。少し大きくして狙いやすくする（押すと囲みにできる）。
  // 中身は**ただの丸**。「始」の文字は入れない（2026-08-13 指摘）
  const startDot=(col)=>L.divIcon({className:'',
    html:'<div class="pf-start" style="background:'+col+';border:2px solid #fff;'
      +'border-radius:50%;width:16px;height:16px;box-shadow:0 1px 4px rgba(0,0,0,.45)"></div>',
    iconSize:[16,16], iconAnchor:[8,8]});
  const numIcon=(t,col)=>L.divIcon({className:'',
    html:'<div style="font-size:12px;font-weight:800;color:'+col
      +';text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap">'+esc(t)+'</div>',   // 種名は自由入力。文字として出す（監査 Major）
    iconSize:[90,16], iconAnchor:[-7,17]});
  if(PF_NEST){
    L.marker(PF_NEST,{icon:badge('巣', PF_SEL===-2?'#6a4fb0':'#8a6fd0', PF_SEL===-2?34:26)}).addTo(pfLayer);   // 直し中は大きく
  }
  let np=0;
  // 線の番号はチップと同じ segLabel() で振る（数え方を別に持つと、0点の壊れた経路が
  // 混ざったときにチップと地図でずれる）。総数も segLabel と同じく非Pを全部数える
  const nLines=PF_SEGS.filter(s=>s.t!=='P').length;
  PF_SEGS.forEach((seg,segIdx)=>{
    if(seg.t==='P'){
      np++;
      // いま「止まっていたもの」を入力している P は、大きく・白い縁を太くして見分けられるようにする
      const cur=(PF_SEGS.indexOf(seg)===PF_SEL) || ((np-1)===PERCH_IDX && pfPoints().length>1);
      const ic=L.divIcon({className:'',html:'<div style="background:'+(cur?'#2c8a63':'#3fb984')+';border:'+(cur?'4px':'2px')+' solid #fff;border-radius:50%;width:'+(cur?34:26)+'px;height:'+(cur?34:26)+'px;display:flex;align-items:center;justify-content:center;font-size:'+(cur?13:11)+'px;color:#fff;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.5)">P'+(pfPoints().length>1?np:'')+'</div>',
        iconSize:[cur?34:26,cur?34:26], iconAnchor:[cur?17:13,cur?17:13]});
      L.marker(seg.pt,{icon:ic}).addTo(pfLayer);
    } else if(seg.pts.length){
      const selL=(PF_SEGS.indexOf(seg)===PF_SEL);
      const area=(seg.fl&&seg.fl.shape)===SHAPE_AREA;
      if(area){
        // 面は閉じて描く。**塗らない**（報告書の結果図に合わせる）。
        // **始点・終点の印は出さない**（どこが始まりでも同じ）。
        // 旋回上昇は ◎（内側にもう1本の輪）
        if(seg.pts.length>2){
          const col=selL?'#ffd479':'#9b59b6';
          // 旋回上昇は ◎（きれいな二重丸）。それ以外は囲った形のまま輪郭だけ
          if(((seg.fl&&seg.fl.area_type)||'')==='旋回上昇' && drawSoar(pfLayer, seg.pts, {color:col, weight:selL?3.5:2.5})){
            // 囲った形も薄く残す（どこを囲ったかが分かるように）
            L.polygon(seg.pts,{color:col,weight:1,opacity:.35,fill:false,dashArray:'4,4',interactive:false}).addTo(pfLayer);
          } else {
            L.polygon(seg.pts,{color:col,weight:selL?4:2.5,opacity:.95,fill:false,interactive:false}).addTo(pfLayer);
          }
        }
        else if(seg.pts.length>1)
          L.polyline(seg.pts,{color:'#9b59b6',weight:3,opacity:.6,dashArray:'5,4',interactive:false}).addTo(pfLayer);
        // 面がどれか分かるよう、1点目に番号（または「面」）だけ置く。
        // **丸い印にはしない**。◎（旋回上昇）の上に丸を重ねると記号が読めない
        L.marker(seg.pts[0],{icon:numIcon((nLines>1?segLabel(segIdx):'面')+((seg.fl&&seg.fl.sp_name)?(' '+seg.fl.sp_name):''),selL?'#7d3fb0':'#6b3f96'), interactive:false}).addTo(pfLayer);   // 種を指定した面は種名も添える（v233 再監査）
        seg.pts.forEach(pt=>L.circleMarker(pt,{radius:4,color:'#fff',weight:1,fillColor:'#9b59b6',fillOpacity:1,interactive:false}).addTo(pfLayer));
        // 旋回上昇（◎）は、前後の飛翔経路と線で結ぶ（2026-08-13 指摘）
        soarJoins(PF_SEGS, segIdx).forEach(j=>{
          L.polyline(j,{color:'#e0a030',weight:3,opacity:.9,interactive:false}).addTo(pfLayer);
          const b=bearingDeg(j[0], j[1]);
          const mid=[(j[0][0]+j[1][0])/2, (j[0][1]+j[1][1])/2];
          L.marker(mid,{icon:flightArrowIcon(b,'#e0a030'), interactive:false, rotateWithView:true}).addTo(pfLayer);
        });
      } else {
        const lineCol=selL?'#ffd479':'#e0a030';
        // 線・面そのものも**タップを遮らない**。押しても何も起きない飾りなのに、
        // 上を狙ったタップが地図に届かず、描き足せなくなる（2026-08-13 監査）
        // 線は**滑らかにして見せる**（フリーハンドのガタガタを目立たせない。v238・2026-11-08 ユーザー）。
        // 保存する線（seg.pts）は変えない。地図画面・書き出しの smoothPath と同じ。始点・終点は動かないので印はそのまま。
        // 直そうと選んでいる線は、元の形も細い点線で重ねる（どこに点があるか分かるように）
        const disp=seg.pts.length>2 ? smoothPath(seg.pts) : seg.pts;
        if(seg.pts.length>1) L.polyline(disp,{color:lineCol,weight:selL?7:4,opacity:.95,interactive:false}).addTo(pfLayer);
        if(selL && seg.pts.length>2) L.polyline(seg.pts,{color:'#ffffff',weight:1.5,opacity:.8,dashArray:'3,4',interactive:false}).addTo(pfLayer);
        (seg.soars||[]).forEach((sp,k)=>drawSoarSpot(pfLayer, sp, '#9b59b6',
          !!(SCREENS._soarSel && SCREENS._soarSel.seg===seg && SCREENS._soarSel.k===k)));
        // 向きは**矢印**で示す。「始」「終」の丸い印はやめた（2026-08-13 指摘）。
        // 続けて描いたLは前の終点から始まるので、終と始の印が近くに並び、
        // 「この間は何？」と見えてしまっていた。報告書の結果図も矢印と点だけ
        if(seg.pts.length>1)
          flightArrowPts(disp).forEach(a=>
            L.marker(a.p,{icon:flightArrowIcon(a.b,lineCol), interactive:false, rotateWithView:true}).addTo(pfLayer));
        // 線が2本以上あるときは、L1・L2… を小さく出して「直す」チップと見比べられるようにする
        // 前の線から引き継いだ点は「自分で描き始めた場所」ではないので、
        // 番号と「押すと閉じる点」はその次（＝最初にタップした点）に置く。
        // ここに置かないと、囲みにするとき押すべき点と印がずれる
        const sIdx=segContOffset(seg);
        const _spTag=(seg.fl&&seg.fl.sp_name)?(' '+seg.fl.sp_name):'';   // 種が違う線は種名を添える
        if(nLines>1 || _spTag)
          L.marker(seg.pts[sIdx],{icon:numIcon(segLabel(segIdx)+_spTag,selL?'#b07800':'#8a6400'), interactive:false}).addTo(pfLayer);
        // **始点の点そのものを押しても閉じられるようにする。**
        // Leaflet の印の上のタップは地図へ伝わらないので、点に付けないと
        // 「始点をもう一度タップ」がいちばん自然な操作（点を狙って押す）で効かない
        //（2026-08-12 監査で判明。テストが pfDrop を直に呼んでいて見逃していた）。
        // 丸い印をやめたので、代わりに**この点だけ少し大きく**して狙いやすくする
        // **地図の絵（SVG）ではなく印（DOM）で置く。**
        // 絵で置くと、押したときに地図にもタップが伝わり、閉じる処理と
        // 地図への点追加が**二重に**起きる（旋回中は輪が2つ入った。2026-08-13）
        const startMk=L.marker(seg.pts[sIdx],{icon:startDot(lineCol)}).addTo(pfLayer);
        startMk.on('click', ev=>{
          if(ev && ev.originalEvent) L.DomEvent.stop(ev.originalEvent);
          if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY) return;   // 保存の後処理中は触らせない
          if(drawClickBlocked()) return;   // 長押しで選んだ・なぞった直後の click では閉じない
          // **閉じられるのは「いま描いている線」だけ**にする。
          // どの線の始点でも閉じられると、止まり（P）や巣（N）を落としている最中や、
          // 別の線を直している最中に、関係のない線が面に変わる（2026-08-13 監査）
          // 「直す」で選んだ線は、**どのモードでも**閉じられる
          //（地図タップは選択中の線をモードに関係なく編集するので、印だけ動きが違うと混乱する）。
          // 選んでいないときは、L で描いている途中の線だけ。
          // PF_NEWLINE は「次のタップから新しい線を始める」状態＝描いている途中の線は無い
          //（Lを押し直した直後に、前の線が面に変わってしまう。2026-08-13 監査）
          if(pfPanBlocks()) return;   // 「✋ 移動」のときは面にしない（長押しで選んだ線は閉じられる。v231 監査 Major）
          const target=(PF_SEL>=0) ? PF_SEGS[PF_SEL]
            : ((PF_MODE==='F' && !PF_NEWLINE) ? lastDrawnFl()
              : ((PF_STROKE_SEG && PF_SEGS.includes(PF_STROKE_SEG)) ? PF_STROKE_SEG : null));   // なぞった直後の線も閉じられる
          if(target!==seg) return;
          const p=seg.pts[segContOffset(seg)];
          // 「くるくる」中は閉じずに、押した場所へ輪を入れる
          //（印の上だけ動きが違うと、狙って押したのに何も起きない）
          if(PF_SPIRAL){ pfDrop(p[0], p[1]); return; }
          pfSnap();   // 「↶」で戻せるように、変える前の状態を控える
          if(pfTryClose(seg, p[0], p[1])===true){ pfRedraw(); pfInfo(); pfSyncFlightFields(); segChips(); }
          else PF_HIST.pop();   // 閉じられなかった（'ng' も含む）ので控えも戻す
        });
        // 点の丸。**点が多い線では途中を出さない**（旋回の輪は点が細かいので、
        // 丸を出すと線が丸の帯になって形が読めない。2026-08-13）。
        // 端の点（引き継いだ点・終わりの点）は、点が多くても出す
        seg.pts.forEach((pt,i)=>{
          if(i===sIdx) return;                              // 始点はもう大きく出してある
          const 端=(i===0 || i===seg.pts.length-1);
          if(!端 && seg.pts.length>12) return;
          L.circleMarker(pt,{radius:4,color:'#fff',weight:1,fillColor:lineCol,fillOpacity:1,interactive:false}).addTo(pfLayer);
        });
      }
    }
  });
}
// 観察者の位置と鳥の位置から距離帯を決める（区分は既存のまま）
function distBandFrom(obsLat,obsLon,tLat,tLon){
  if(!validLatLon(String(obsLat),String(obsLon)) || !validLatLon(String(tLat),String(tLon))) return '';
  let d=null;
  try{ d=(mapObj?mapObj.distance([+obsLat,+obsLon],[+tLat,+tLon]):null); }catch(e){}
  if(d==null){
    // 地図が無いときの簡易計算（緯度1度=111320m、経度は緯度で縮む）
    const R=Math.PI/180, dy=(+tLat-+obsLat)*111320, dx=(+tLon-+obsLon)*111320*Math.cos(+obsLat*R);
    d=Math.hypot(dx,dy);
  }
  if(!Number.isFinite(d)) return '';
  return d<=25?'〜25m':(d<=50?'〜50m':'50m超');
}

/* なぞった線をまとめて L に加える（描くモードの確定）。**履歴は1件だけ**積み、
   pfDrop を点ごとに呼ばない＝始点付近で「面にする」判定（pfTryClose）を通さない（計画レビュー M3）。
   追加先・続ける（cont）の決まりは pfDrop の L の分岐と同じ */
let PF_STROKE_SEG=null;   // 描くモードで最後に作った線（入力の対象にする。次に何か描けば外れる）
const PF_HIT_PX=14;
// 地図の長押し（cp=地図の中の画面座標）。いまの個体の P・L・巣だけが対象（他の個体の薄い表示は選ばない）。
// 線は頂点だけでなく線分までの距離で測る。選べたら true
function pfLongPress(cp){
  if(!mapObj || (typeof SAVE_BUSY!=='undefined' && SAVE_BUSY)) return false;
  const C=ll=>mapObj.latLngToContainerPoint(L.latLng(ll[0], ll[1]));
  // 線の途中の◎を先に見る（中心から外側の輪まで、または 14px 以内）
  try{
    for(let i=0;i<PF_SEGS.length;i++){ const sg=PF_SEGS[i]; if(sg.t!=='F' || !Array.isArray(sg.soars)) continue;
      for(let k=0;k<sg.soars.length;k++){ const sp=sg.soars[k];
        const q=C([sp.lat, sp.lon]);
        const e=mapObj.latLngToContainerPoint(L.latLng(sp.lat, sp.lon).toBounds(sp.r*2).getNorthEast());
        const rpx=Math.max(PF_HIT_PX, Math.abs(e.x-q.x));
        if(Math.hypot(cp.x-q.x, cp.y-q.y)<=rpx){
          if(PF_PT){ if(!ptCloseOk()) return false; ptClose(); PF_PT=false; PF_PAN=true; }
          segPick(i, true); SCREENS._soarSel={seg:sg, k}; pfRedraw(); segEditBar();
          let at=null; try{ at=mapObj.containerPointToLatLng(cp); }catch(e2){}
          tabletPanel(true, '#segEditBar', at); return true; } } }
  }catch(e){}
  let best=null, bd=Infinity;
  const take=(i, dist)=>{ if(dist<=PF_HIT_PX && dist<bd){ bd=dist; best=i; } };
  try{
    PF_SEGS.forEach((sg,i)=>{
      if(sg.t==='P'){ if(sg.pt){ const q=C(sg.pt); take(i, Math.hypot(cp.x-q.x, cp.y-q.y)-3); } return; }   // 点は線より少し優先
      const ps=(sg.pts||[]).map(C); if(!ps.length) return;
      let dmin=Math.hypot(cp.x-ps[0].x, cp.y-ps[0].y);
      for(let k=0;k+1<ps.length;k++) dmin=Math.min(dmin, drawSegDist(cp, ps[k], ps[k+1]));
      // 線は滑らかにして見せている（v238）。見えている線の上を押しても選べるよう、滑らかな線でも測る（v238 監査 Major）
      if(segShape(sg)!==SHAPE_AREA && (sg.pts||[]).length>2){ const sp=smoothPath(sg.pts).map(C);
        for(let k=0;k+1<sp.length;k++) dmin=Math.min(dmin, drawSegDist(cp, sp[k], sp[k+1])); }
      if(segShape(sg)===SHAPE_AREA && ps.length>2) dmin=Math.min(dmin, drawSegDist(cp, ps[ps.length-1], ps[0]));
      take(i, dmin);
    });
    if(PF_NEST){ const q=C(PF_NEST); take(-2, Math.hypot(cp.x-q.x, cp.y-q.y)-3); }
  }catch(e){ return false; }
  if(best===null) return false;
  if(PF_PT){ if(!ptCloseOk()) return false; ptClose(); PF_PT=false; PF_PAN=true; }   // 長押しで選べたら「鳥」を外して直す操作へ（選ぶのをやめたら移動）
  segPick(best, true);
  let at=null; try{ at=mapObj.containerPointToLatLng(cp); }catch(e){}
  tabletPanel(true, '#segEditBar', at);   // タブレット表示なら小窓を開いて「直し中」の帯を見せる
  return true;
}
// なぞった直後の線（PF_STROKE_SEG）を、始点の近くのタップで面にする。扱ったら true（控えは呼び出し側で積む）
function pfCloseStroke(lat, lon){
  const sg=PF_STROKE_SEG;
  if(!sg || !PF_SEGS.includes(sg) || sg.t!=='F') return false;
  const r=pfTryClose(sg, lat, lon);
  if(r===true){ SCREENS._dirty=true; pfRedraw(); pfInfo(); pfSyncFlightFields(); segChips(); return true; }
  if(r==='ng'){ PF_HIST.pop(); return true; }
  return false;
}
// 描くモード中の軽いタップ。意味のあるときだけ扱い、それ以外は今までどおり何もしない

function pfDrawTap(lat, lon){

  if(PF_SEL!==-1){ pfDrop(lat, lon); return; }   // 選んでいる P・巣の移動／L の描き足し・面にする・◎を置く
  if(PF_STROKE_SEG && PF_SEGS.includes(PF_STROKE_SEG)){

// ◎を置く準備（次の線の上のタップで置く）
function soarPlaceStart(){
  const sg=PF_SEGS[PF_SEL]; if(!sg || sg.t!=='F') return;
  SCREENS._soarPlace=!SCREENS._soarPlace; segEditBar();
}
// 線の上のいちばん近い点（画面上の距離）。遠ければ null
function soarNearestOnLine(sg, cp){
  if(!mapObj || !sg.pts || sg.pts.length<2) return null;
  // 見えている（滑らかにした）線の上に置く。元の線に寄せると、表示の線から ◎ が浮く（v238 監査 Major）
  const ps=(sg.pts.length>2 ? smoothPath(sg.pts) : sg.pts).map(p=>mapObj.latLngToContainerPoint(L.latLng(p[0],p[1])));
  let best=null, bd=Infinity;
  for(let k=0;k+1<ps.length;k++){
    const a=ps[k], b=ps[k+1], dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy;
    let t=l2? ((cp.x-a.x)*dx+(cp.y-a.y)*dy)/l2 : 0; t=Math.max(0,Math.min(1,t));
    const q=L.point(a.x+t*dx, a.y+t*dy), d=Math.hypot(cp.x-q.x, cp.y-q.y);
    if(d<bd){ bd=d; best=q; }
  }
  if(!best || bd>SOAR_HIT_PX) return null;
  const ll=mapObj.containerPointToLatLng(best); return [ll.lat, ll.lng];
}
// 線の上に◎を置く（pfDrop から）。置けたら true
function soarPlaceAt(lat, lon){

  let cp=null; try{ cp=mapObj.latLngToContainerPoint(L.latLng(lat,lon)); }catch(e){ return false; }
  const at=soarNearestOnLine(sg, cp);
  if(!at){ toast('線の近くをタップしてください', 3000); return true; }   // 遠いタップでは置かない（新しい点も置かない）
  pfSnap();
  sg.soars=(Array.isArray(sg.soars)?sg.soars:[]).concat([{lat:at[0], lon:at[1], r:SOAR_R0}]);
  SCREENS._soarPlace=false; SCREENS._dirty=true;
  pfRedraw(); pfInfo(); segChips();

}
function soarSize(r){

// なぞり直しの時刻。観察した時刻を、直した時刻に変えない（元の最初と最後の時刻の間に割り振る）
function pfRedrawTimes(old, n, fresh){
  const a=old[0]||'', b=old[old.length-1]||a;
  if(!a) return fresh.slice();
  const ta=new Date(a).getTime(), tb=new Date(b).getTime();
  if(!Number.isFinite(ta) || !Number.isFinite(tb)) return Array.from({length:n}, (_,i)=>(i===n-1?b:a));
  return Array.from({length:n}, (_,i)=>localDatetimeValue(new Date(ta+(tb-ta)*(n>1?i/(n-1):0))));
}
function pfAddStroke(ll, tt){
  if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY) return;
  if(!ll || ll.length<2) return;
  const times=tt.map(d=>localDatetimeValue(d instanceof Date?d:new Date()));
  pfSnap();
  let target=null;
  if(PF_SEL>=0){ const sg=PF_SEGS[PF_SEL]; if(sg && sg.t==='F') target=sg; else PF_SEL=-1; }   // P を選んでいても、なぞりは線として扱う
  // ◎が付いた線は引き直さない（観察した◎の位置を勝手に動かしたり消したりしないため）
  if(target && Array.isArray(target.soars) && target.soars.length){
    PF_HIST.pop();   // 上で積んだ控えを戻す（何も変えない）
    toast('この線には◎（旋回上昇）があります。引き直すときは、先に◎を長押しして消してください', 5000); return; }
  if(target){
    // **選んだ線はなぞり直しで置き換える**（2026-11-07 実機の要望「描いた線を直したい」）。
    // 同じ線（id・srcUuid）のまま、高度・行動・添付・メモは残す。時刻は元の範囲のまま。
    // 全体を引き直すので前の線からの続き（cont）は外す。描き足しはタップで今までどおり
    target.times=pfRedrawTimes(target.times||[], ll.length, times);
    target.pts=ll.map(p=>[p[0],p[1]]);
    target.cont=0; target.edited=true;
    if(segShape(target)===SHAPE_AREA){
      target.fl.shape=SHAPE_LINE; target.fl.area_type='';
      if(SCREENS._flSeg===target) flLoadFrom(target);   // 欄が面のままだと、保存・個体切替で面が書き戻される（監査 Major）
      toast('面をなぞり直したので線になりました。面にするときは始点の丸を押してください', 4000);
    }
  } else {
    // **なぞるたびに新しいL、前の線とはつながない**（2026-11-07 実機での決定）。
    // フリーハンドでは、続けたいときは前の終点から描き始めればよく、自動で直線を結ぶと
    // 描いていない経路ができてしまう。続きの1点（cont）も付けない
    // ただし 🧲 マグネットがオンなら、前の線の終点か P を**先頭に足して**つなぐ（v239・2026-11-08 ユーザー）。
    // なぞった点は残す（面にするときは足した1点と時刻だけ外す＝segDropCont）。同じ点なら足さない
    const c=magnetOn()?contFrom():null;
    const p0=ll[0];
    const from=(c && !(c.pt[0]===p0[0] && c.pt[1]===p0[1]))?c:null;
    const sg={t:'F', id:pfId(), pts:(from?[[from.pt[0],from.pt[1]]]:[]).concat(ll.map(p=>[p[0],p[1]])),
      times:(from?[from.time||times[0]]:[]).concat(times), cont:from?1:0,
      fl:{height:'',behavior:'',shape:SHAPE_LINE,area_type:''}};
    PF_SEGS.push(sg);
    PF_NEWLINE=true;     // 次のタップも新しいLから（なぞった線に勝手に足さない）
    PF_STROKE_SEG=sg;    // ただし高度・行動・時刻の欄は、いまなぞった線を対象にする（監査 Major）
  }
  SCREENS._dirty=true; pfRedraw(); pfInfo(); pfSyncFlightFields(); segChips();
  tabletPanel(true, '#flAttrRow', ll[ll.length-1]);   // タブレット表示なら線の属性の欄を開く
}

// 線ごとの「どの鳥か」を決める（保存の直前）。
// 何も入れていない線・齢だけ違う線は今までどおり観察と同じ鳥。種か個体名が上と違う線は別の鳥:
//   個体名があれば「同じ調査・同じ種・同じ個体名」の目印にまとめ、名前なしは線ごとの目印
function lineWho(seg, svUuid, name, ageCls, indKey, indLabel, snapFl, memo){
  const fl=seg.fl||{};
  const nm=String(fl.sp_name||'').trim(), lb=String(fl.ind_label||'').trim();
  const age=fl.age||'';
  const diffSp=!!nm && nm!==String(name||'');
  const diffLb=!!lb && lb!==String(indLabel||'');
  if(!diffSp && !diffLb) return { separate:false, name, age:age||ageCls, ageSet:!!age, key:indKey, label:undefined, spId:null };
  const nm2=nm||name||'';
  const cur=seg.srcUuid ? ((snapFl||[]).find(x=>x&&x.uuid===seg.srcUuid)) : null;
  let key='';
  if(lb){
    const k=nm2+'\u0001'+lb;
    key=memo[k]||'';
    if(!key){
      const same=x=>x && !x.deleted_at && String(x.species_name_snapshot||'')===nm2 && String(x.individual_label||'')===lb && x.individual_key;
      const hit=DB.flightsOf(svUuid).find(same) || DB.obsOf(svUuid).find(same);
      key=hit ? hit.individual_key : uuid();
    }
    memo[k]=key;
  } else {
    // 名前なしの別の鳥: 前に保存した自分の目印があればそのまま（保存のたびに変えない）
    key=(cur && cur.individual_key && cur.individual_key!==indKey) ? cur.individual_key : uuid();
  }
  const sp=nm ? (fl.sp_id || (speciesByName(nm)||{}).species_id || '') : null;
  return { separate:true, name:nm2, age:age||ageCls, ageSet:!!age, key, label:lb, spId:sp };
}
// 経路1本から飛翔レコードを作る。検査に落ちたら null を返す（保存は始めない）
function buildFlightRec(seg, svUuid, name, count, ageCls, indKey, memo, needsReview, override, useForm, indLabel, snapFlArr){
  // 2点未満は原則保存しないが、既存で触っていない経路は元のままの姿で書き戻す（共有項目だけそろえる）
  if(!seg || (!segEnough(seg) && !segUntouched(seg))) return null;
  const ov=override||{};
  // 手で空にしたのも「空という指定」として扱う（||で判定すると自動の時刻に戻ってしまう）
  const st=('start' in ov) ? ov.start : (seg.times[0] || localDatetimeValue());
  const en=('end'   in ov) ? ov.end   : (seg.times[seg.times.length-1] || '');
  for(const pair of [[st,'開始時刻'],[en,'終了時刻']]){
    if(pair[0] && !okStamp(pair[0])){ toast('飛翔の'+pair[1]+'が正しくありません'); return null; }
  }
  if(st && en && en<st){ toast('飛翔の終了時刻が開始時刻より前です'); return null; }
  const _who=seg._who||null;   // 線ごとの種名・齢（lineWho）
  const spId = name ? ((_who && _who.spId!=null) ? _who.spId : (SCREENS._chosenId||(speciesByName(name)||{}).species_id||'')) : '';
  // 線の途中の◎（旋回上昇）。線の付属情報として持つ（独立した記録は作らない）。古い記録で未設定なら元のまま
  const soarSpots = Array.isArray(seg.soars) ? seg.soars.map(x=>({lat:x.lat, lon:x.lon, r:x.r})) : undefined;
  // 高度・行動は経路そのもの（seg.fl）から。画面の欄は写しにすぎない
  const heightRaw = (seg.fl&&seg.fl.height)||'';
  const behaviorNew = (seg.fl&&seg.fl.behavior)||'';
  // 形（線／面）と面の種類。**線のときは面の種類を空にする**
  //（形を線へ戻したのに種類が残ると、書き出しで面として扱われる）
  const shapeNew = segShape(seg);
  const areaTypeNew = shapeNew===SHAPE_AREA ? ((seg.fl&&seg.fl.area_type)||'') : '';
  // まとめ読みした既存の経路（srcUuid）は、その記録を基底にして、
  // 共有の項目（種名・個体数・齢・結び付け）と経路・時刻だけを上書きする。
  // 高度・行動は、経路が1本だけで画面に出ているとき（＝開いたとき読み込んである）だけ画面の値。
  // メモ・要確認・添付・個体ラベル・作成日時などは、その記録のまま
  // 既存の経路は、呼び出し元が取った写しから読む（読み直すと保存の中で時点が混ざる）
  const cur = seg.srcUuid ? ((snapFlArr||DB.load(DB.key.fl)||[]).find(x=>x&&x.uuid===seg.srcUuid)) : null;
  if(cur){
    return Object.assign({}, cur, {
      survey_uuid:svUuid,
      species_id:spId, species_name_snapshot:name,
      // 経路を触っていなければ、元の点をそのまま残す（検査で除いた点を黙って消さない）
      path:(seg.srcUuid && !seg.edited) ? ((cur.path||[]).slice()) : seg.pts.slice(),
      start_time:st, end_time:en,
      // 既存の記録では、空は空のまま残す（触っていない項目を「不明」に化けさせない）。
      // 齢は画面で触ったときだけそろえる（触っていないのに観察の齢で埋めない）
      age_class:((SCREENS._ageTouched || (_who && _who.ageSet)) ? ageCls : (cur.age_class||'')), count:count, individual_key:indKey||'',
      soar_spots: soarSpots!==undefined ? soarSpots : (Array.isArray(cur.soar_spots) ? cur.soar_spots : []),
      // 同じ鳥の呼び名は観察と飛翔でそろえる。ただし個体名の欄を触っていない空欄では
      // 元の名前を保つ（開いて保存しただけで経路の名前が消えるのを防ぐ）
      individual_label:(indLabel===undefined ? (cur.individual_label||'') : String(indLabel||'')),
      height_class: heightRaw,
      behavior: behaviorNew,
      shape: shapeNew,
      area_type: areaTypeNew,
      // 1点目が「前の線から引き継いだ点」かどうかも残す。
      // 残さないと、開き直したあと「始」の印の位置と、面にしたときに外す点がずれる
      continued_start: !!seg.cont,
    });
  }
  return { uuid:uuid(), survey_uuid:svUuid,
    species_id:spId,
    species_name_snapshot:name,
    path:seg.pts.slice(), start_time:st, end_time:en,
    shape:shapeNew, area_type:areaTypeNew, continued_start:!!seg.cont,
    // 面には飛翔高度の意味がないので、既定の「不明」も入れない
    height_class:heightRaw||(shapeNew===SHAPE_AREA?'':'不明'),
    age_class:ageCls||'不明', individual_label:String(indLabel===undefined?'':indLabel||''),
    behavior:behaviorNew,
    count:count, memo:String(memo||'').trim(), needs_review:!!needsReview,
    individual_key:indKey||'',

    const plainObj=v=>v!=null && typeof v==='object' && !Array.isArray(v);
    for(const e of j.undo){
      if(!plainObj(e)) return false;
      if(typeof e.key!=='string' || !KEYS.has(e.key)) return false;
      if(typeof e.uuid!=='string' || !e.uuid) return false;
      if(!(e.prev===null || e.prev===undefined || plainObj(e.prev))) return false;   // 配列などは不可
      if(typeof e.wroteRec!=='string') return false;
      if(j.phase==='written' && !e.wroteRec) return false;   // 完了段は「書いた控え」必須
      if(e.expectedRec!==undefined && typeof e.expectedRec!=='string') return false;

        && ((it.prevObs===undefined && it.prevFl===undefined)
          || (typeof it.prevObs==='string' && typeof it.prevFl==='string')))))) return false;
    if(!(j.ghost==null || (plainObj(j.ghost) && typeof j.ghost.key==='string' && KEYS.has(j.ghost.key)
      && typeof j.ghost.uuid==='string' && j.ghost.uuid

// 復旧用の基準配列: 競合で控えた相手の最新の姿があればそれを正本、無ければ厳格読み込み。
// 相手の姿が壊れていれば null（触らず停止）
// 仮記録の削除（全文照合つき）。'deleted'=消した / 'gone'=元から無い /
// 'changed'=別の書き手が正式な記録に変えている（消さない） / 'fail'=削除・確認に失敗
// 墓標を外し、外れたことまで確かめる（確かめられなければ false）
function untombVerified(uuidV){
  // **寛容な読み方で確かめない。** 壊れていると空配列が返り、外せていないのに
  // 「外れた」と判定してしまう。その結果、本体と墓標が併存し、
  // 後日の同期で生きている記録が消える（監査5巡目 Critical）
  const 前=tombstonesForWrite();
  if(!前) return false;
  if(!前.some(t=>t && t.uuid===uuidV)) return true;   // もともと無い＝外れている
  if(!tombstoneRemove(uuidV)) return false;           // 対象1件だけを外す（他は残す）
  const 後=tombstonesForWrite();
  return !!後 && !後.some(t=>t && t.uuid===uuidV);
}
function ghostDeleteVerified(key, uuidV, recJson){
  const arr=loadStrict(key);
  if(!arr) return 'fail';
  const cur=arr.find(x=>x&&x.uuid===uuidV);
  if(!cur) return 'gone';
  // 全文の控えが無い（旧形式）場合は、証明できないので消さない
  if(recJson==null) return 'changed';
  if(JSON.stringify(cur)!==recJson) return 'changed';
  DISCARDED.add(uuidV);
  if(!DB.hardDelete(key, uuidV)){
    // 失敗経路でも墓標が残っていないことを確かめる（hardDelete内の墓標戻しが失敗し得る）
    DISCARDED.delete(uuidV);
    return untombVerified(uuidV) ? 'fail' : 'fatal';
  }
  const a2=loadStrict(key);
  if(a2===null) return 'fatal';   // 消えたことを確認できない（読めない）＝墓標が付いたまま。致命停止へ
  const back=a2.find(x=>x&&x.uuid===uuidV);
  if(back){
    // 競合で同じ番号が再出現した。付けた墓標を外し、外れたことまで確かめる
    //（墓標が残ると、残した記録が後日の同期で消される）
    if(!untombVerified(uuidV)) return 'fatal';
    DISCARDED.delete(uuidV);
    return (JSON.stringify(back)!==recJson) ? 'changed' : 'fail';
  }
  return 'deleted';
}
// 復旧の書き戻しをキー単位でまとめて適用する。
// 1件ごとに基準を取り直すと、同じキーの後の保存が先の補償を上書きしてしまう。
// strict=true: 自分の書き込みと確かめられない姿があれば全体を失敗にする（writing段）
// strict=false: そうした姿は相手の更新として残す（written段の巻き戻し・合成）
function recoverApply(entries, strict){
  const byKey=new Map();
  entries.forEach(e=>{ if(!byKey.has(e.key)) byKey.set(e.key, []); byKey.get(e.key).push(e); });
  for(const kv of byKey){
    const key=kv[0], list=kv[1];
    const arr=recoverBase(key);
    if(!arr) return false;   // 読めない・相手の姿が壊れている＝触らない
    let changed=false;
    for(const e of list){
      const idx=arr.findIndex(x=>x&&x.uuid===e.uuid);
      const curJson= idx>=0 ? JSON.stringify(arr[idx]) : '';
      const prevJson= e.prev ? JSON.stringify(e.prev) : '';
      if((idx<0 && !e.prev) || (idx>=0 && e.prev && curJson===prevJson)) continue;   // すでに書く前の姿
      if((e.wroteRec && idx>=0 && curJson===e.wroteRec)
        || (e.expectedRec && idx>=0 && stableJson(arr[idx])===e.expectedRec)){
        if(e.prev) arr[idx]=e.prev; else arr.splice(idx,1);
        changed=true;
      } else if(strict){
        return false;   // 自分の控えと違う姿＝別の書き手かもしれない。触らず停止
      }
      // strict=false: 相手の姿のまま＝相手の更新が正。触らない
    }
    if(changed || Object.prototype.hasOwnProperty.call(GUARD_SNAP||{}, key)){
      if(!DB.save(key, arr)) return false;
      const a2=loadStrict(key);
      if(!a2 || JSON.stringify(a2)!==JSON.stringify(arr)) return false;   // 全文の再読込一致まで確認
    }
  }
  return true;
}
function recoverBase(key){
  try{
    if(typeof GUARD_SNAP!=='undefined' && Object.prototype.hasOwnProperty.call(GUARD_SNAP, key)){
      const v=JSON.parse(GUARD_SNAP[key]);
      return Array.isArray(v)?v:null;
    }
  }catch(e){ return null; }
  return loadStrict(key);
}

          const toFl=(it.prevObs!==undefined)?(it.prevFl||''):'';

            }

            if(!(r.obs_uuid==='' && r.flight_uuid===((j.fl&&j.fl.flId)||''))) return false;

          const chk=await dbOf(it.kind).get(it.id);
          if(!chk) { ok=false; continue; }
          if(keepK.has(it.kind+':'+it.id)){
            if(chk.obs_uuid!=='' || chk.flight_uuid!==j.fl.flId) ok=false;

        }catch(e){ ok=false; }
      }
      await new Promise(r=>setTimeout(r,0));   // 別の書き手の書き込み通知（storage）を受け取る一拍
      if(ok && typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT){

      if(ok){ ok=saveJournalClear(j.tx||null); }

// 保存の後処理中は、画面全体を覆って操作を止める（録音・写真・地図・入力が

function saveBusyShow(on){
  let el=document.getElementById('saveBusyOverlay');
  if(!on){
    if(el) el.remove();
    [...document.body.children].forEach(c=>{ try{ c.inert=false; }catch(e){} });
    try{ backupConfirmPoint(); }catch(e){}   // 取引の全終了経路（中止含む）でバックアップの保留を確認する
    return;
  }
  if(el) return;
  try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(e){}
  [...document.body.children].forEach(c=>{ try{ c.inert=true; }catch(e){} });   // キーボード操作も止める
  el=document.createElement('div');
  el.id='saveBusyOverlay';
  el.style.cssText='position:fixed;inset:0;z-index:99997;background:rgba(0,0,0,.45);'
    +'display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;padding:24px;text-align:center;';
  el.textContent='保存しています…';
  document.body.appendChild(el);
}
function saveObs(u, svUuid, editing, cont){
  if(SAVE_BUSY){ toast('保存の処理中です。少し待ってください'); return; }

  //（途中で保存が止まったのに決めかけの目印が残ると、次の保存で照合されずに別の巣と混ざる）
  const resolvedNestId = nestFilled()
    ? (PF_NEST_ID || (!nestTouched() ? '' : (function(){
        const ik=indKeyLbl||(SCREENS._obs&&SCREENS._obs.individual_key)||((base||{}).individual_key||'');
        // 個体名でまとめる保存では、統合される相手の記録も巣の候補に含める
        //（含めないと、相手側にしかない巣を見落として新しい巣を発行してしまう）
        const mergeIds=new Set((indR?indR.fixObs:[]).map(o=>o.uuid));
        if(ik){ const found=new Set(); const fPos=new Map(); const fFp=new Map();
          // 候補は画面・件数と同じ「生きている記録」だけから集める。
          // ごみ箱まで見ると、画面では1つの巣が保存時だけ複数候補になって分裂する
          snapObsLive.forEach(o=>{ if((o.individual_key===ik || mergeIds.has(o.uuid)) && nestId(o)){
            const nid0=nestId(o); found.add(nid0);
            if(!fPos.has(nid0)) fPos.set(nid0, new Set());
            fPos.get(nid0).add(nestPosKey(o));
            if(!fFp.has(nid0)) fFp.set(nid0, new Set());
            fFp.get(nid0).add(nestFpKey(o)); } });
          // 「開いたときの巣」（無ければ、いま入力している巣の位置か内容）と一致する候補を集め、
          // 1つに定まるときだけ引き継ぐ。同一性は開いたもので決まる（動かした先では決めない）
          const on=SCREENS._openNest;
          const pos=nestPosKey({nest_latitude:PF_NEST?PF_NEST[0]:'', nest_longitude:PF_NEST?PF_NEST[1]:''});
          const curFp=nestFpKey({nest_latitude:PF_NEST?PF_NEST[0]:'', nest_longitude:PF_NEST?PF_NEST[1]:'',
            nest_state:g('nest_state'), nest_tree_species:g('nest_tree_species'), nest_tree_height:g('nest_tree_height')});
          const cands=[...found].filter(tid=>{
            const ps=fPos.get(tid)||new Set(), fs=fFp.get(tid)||new Set();
            if(on) return on.id===tid || (nestPosValid(on.pos) && ps.has(on.pos)) || fs.has(on.fp);
            return (nestPosValid(pos) && ps.has(pos)) || fs.has(curFp);
          });
          if(cands.length===1) return cands[0];
        }
        return uuid();
      })()))
    // 巣の欄が空でも、この画面で巣を触っていないなら既存の目印は保持する
    //（目印だけを持つ記録が、メモを直して保存しただけで目印を失わないように）
    : (nestTouched() ? '' : (PF_NEST_ID||''));

  const rec = Object.assign({}, base||{uuid:u}, {
    uuid:u, survey_uuid:svUuid,
    observed_at: g('observed_at')? new Date(g('observed_at')).toISOString() : nowISO(),
    // 観察者の位置は画面に出さず、ここでGPSから入れる（Pは鳥がいた場所）。
    // 距離帯は観察者とPの距離から自動で決める（ユーザー仕様）
    latitude: lat, longitude: lon,
    // 精度: 座標なしなら必ず空 / _acc===null は「この画面で位置に触れていない」＝既存値を維持 / ''や数値はその値
    gps_accuracy: (!lat && !lon) ? '' : (SCREENS._acc===null ? ((base||{}).gps_accuracy||'') : SCREENS._acc),
    // 種名が空なら種IDも必ず空にする（入力経路によらず「名無しなのに前の鳥のID」を残さない保証）
    species_id: name ? ((speciesByName(name)||{}).species_id || SCREENS._chosenId || '') : '', species_name_snapshot: name,
    count: count, detection_method: segVal('detection_method'),
    behavior: behObsValue(), habitat: otherMerge(segVals('habitat'),'habitat'),
    age_class: segVal('age_class'), sex: segVal('sex'),
    distance_band: segVal('distance_band'), direction: segVal('direction'),
    target_latitude: tlat, target_longitude: tlon,
    // 止まっていたものは P ごとに持つので、ここでは空にしておき、下で各観察に入れる
    perch_type:'', perch_size:'', perch_class:'', perch_artificial:'', perch_note:'',
    perch_species:'', perch_height:'',
    // 営巣木・巣は記録に1つ（止まっていた場所とは限らないので別に持つ）
    // 巣の位置は地図の状態（PF_NEST）を正本にする。隠し欄と食い違っても取り違えない
    nest_latitude: PF_NEST? String(PF_NEST[0]) : '',
    nest_longitude: PF_NEST? String(PF_NEST[1]) : '',
    // 巣の目印。既に同じ鳥のまとまりに目印が1つだけあるなら、それを引き継ぐ
    //（新しい目印を発行すると、同じ巣が2つに分かれて数えられてしまう）
    nest_id: resolvedNestId,
    // 取込・同期で入ってきたおかしな巣座標（片方だけ・範囲外）は画面に出せない。
    // 黙って消さず、元の値を記録内に控えてから空にする
    repair_note: (function(){
      const b=base||{}; const a=coordStr(b.nest_latitude), c=coordStr(b.nest_longitude);
      if(!editing || PF_NEST || (a==='' && c==='') || validLatLon(a,c)) return b.repair_note;
      return repairNoteAdd(b.repair_note, '巣の位置が不正だったため空にしました（元の値: '+a+','+c+'）');
    })(),
    nest_tree_species: g('nest_tree_species'), nest_tree_height: g('nest_tree_height'), nest_state: g('nest_state'),
    identification_status: name? idStatus : '未同定',
    confidence: segVal('confidence'), needs_review: $('#needsReview').checked,
    note: g('note'), external_photo_reference: g('external_photo_reference'),
    audio: SCREENS._audio||[], media: SCREENS._media||[],
    // 環境・営巣木それぞれの写真とメモ（2026-08-14 追加）
    env_media: SCREENS._envMedia||[], nest_media: SCREENS._nestMedia||[],
    env_note: g('env_note'), nest_note: g('nest_note'),
    // 同一個体の目印。飛翔経路と行き来したときに引き継ぐ（画面で触れないので既存値を持ち越す）。
    // 「飛翔経路を描く」で出ていくときは、まだ目印が無ければここで発行して両方の記録に同じ値を入れる
    individual_key: (SCREENS._obs&&SCREENS._obs.individual_key)||((base||{}).individual_key||'')
      || (cont==='flight' ? uuid() : ''),
  });

  // 観察者の位置は画面に出さないので、ここでGPSの最新の測位から入れる（Pは鳥がいた場所）。
  // 新規では、画面を開いた頃の古い測位を使わない。取れなければ空にする
  //（古い位置を残すと、そこからの距離で誤った距離帯が入ってしまう）。
  // 検査より前に確定させる——実際に保存する位置で範囲を見るため
  // 新規では、保存した時点の測位をいちばん信用する（歩いて移動していても正しい位置になる）。
  // 測位が取れないときだけ、「保存して続けて」で引き継いだ位置を使う
  if(!editing){
    const fx=freshFix();
    if(fx){ rec.latitude=fx.lat.toFixed(6); rec.longitude=fx.lon.toFixed(6); rec.gps_accuracy=Math.round(fx.acc); }
    else if(!SCREENS._keepPos){ rec.latitude=''; rec.longitude=''; rec.gps_accuracy=''; }
  }

  /* --- 警告して通す検査（怪しい入力は「要確認」を自動で付けて、記録自体は残す。鳥は待ってくれない） --- */
  const reasons=[];
  if(!name) reasons.push('種名なし');
  else{
    if(!speciesByName(name)) reasons.push('種名がマスタにありません');
    if(rec.identification_status==='未同定' || rec.identification_status==='仮同定') reasons.push(rec.identification_status+'です');
  }
  // 日時の検査は変換前のローカル日時文字列（"YYYY-MM-DDTHH:mm"）で行う。
  // ISO化した後の先頭10文字で比べると、日本時間の夜の記録がUTCで前日にずれて誤判定するため
  const oa=g('observed_at');
  if(oa){
    if(oa > localDatetimeValue()) reasons.push('観察日時が未来です');
    else{
      const sv=DB.survey(svUuid);
      if(sv && sv.survey_date && DATE_ONLY_RE.test(sv.survey_date)){
        const d=(Date.parse(oa.slice(0,10))-Date.parse(sv.survey_date))/86400000;
        if(!(d===0 || d===1)) reasons.push('観察日時が調査日と合いません');   // 翌日は夜間調査（日付またぎ）として許容
      }
    }
  }
  // 痕跡（羽毛・糞）や「巣だけ」の記録は0でもあり得る
  if(count===0 && rec.detection_method!=='痕跡' && !nestOnly) reasons.push('個体数が0です');
  if(rec.latitude && rec.longitude && !inJapanBounds(rec.latitude, rec.longitude)) reasons.push('位置が日本の範囲外です');
  // 自動付与は新規作成時のみ。編集時はチェックボックスの状態＝利用者の判断をそのまま尊重する
  //（編集のたびに付け直すと「仮同定のまま様子見にしたいのに、開いて保存するたび要確認が復活して
  //   永遠に外せない」ループになる。編集時も理由の警告トーストは出すので、見落としにはならない）
  if(reasons.length && !rec.needs_review && !editing) rec.needs_review=true;

  // 観察者の位置は画面に出さないので、ここでGPSの最新の測位から入れる（Pは鳥がいた場所）
  /* --- 地図に落とした並びから記録を作る ---
     P の数だけ観察、経路の数だけ飛翔。2件以上になるときは同じ個体として結び付ける。
     検査は全部先に済ませ、書き込みは飛翔→観察の順。途中で失敗したら書いた分を全部戻す */
  const pts = pfPoints();
  // 保存対象の経路の定義は pfSaveableFls() の1か所だけ（判定のずれを作らない）
  const paths = pfSaveableFls();
  const anchorFlId=SCREENS._flAnchorUuid||'';   // 経路のカードから開いたときの、軸の経路の番号
  // 点が1つだけの経路は保存できない。黙って捨てず、直せるように知らせる
  const tooFew=PF_SEGS.find(sg=>sg.t==='F' && !segEnough(sg) && !segUntouched(sg));
  if(tooFew){
    const need=minPointsFor(segShape(tooFew));
    toast(`点が足りないトレースがあります（${segShape(tooFew)}は${need}点以上）。`
      +'点を足すか、下の一覧から選んで消してください', 6000); return; }
  // 面は「囲めていること」と「種類が選んであること」が要る。
  // 黙って保存すると、囲めていない面が図に出たり、種類で決まる数え方が定まらない
  for(const sg of paths){
    if(segShape(sg)!==SHAPE_AREA) continue;
    // 形も経路も触っていない既存の面はそのまま（種類が入っているものに限る）
    if(segUntouched(sg) && ((sg.fl&&sg.fl.area_type)||'')) continue;
    const pb=areaProblem(sg.pts);
    if(pb){ toast(`面になっていないトレースがあります（${pb}）。`
      +'点を足すか、下の一覧から選んで消してください', 6000); return; }
    if(!((sg.fl&&sg.fl.area_type)||'')){
      toast('面の種類を選んでください（旋回上昇・概略行動範囲など）。'
        +'種類によって個体数に数えるかどうかが変わります', 6000); return; }
  }
  // 経路が無いのに飛翔専用の入力（高度・飛翔の行動）が残っているときは、黙って捨てない
  if(!paths.length && (segVal('fl_height') || segVals('fl_behavior'))){
    if(!confirm('飛翔高度・飛翔の行動が入力されていますが、経路（L）がありません。\n'
      +'このまま保存するとこれらの入力は保存されません。\n\n'
      +'保存しますか？（キャンセルして L で経路を描くこともできます）')) return;
  }
  // 編集では、Pを消しても記録そのものは残す（位置だけ空になる）
  // 巣だけを記録した場合も観察を1件作る（画面で入れられるのに保存先が無い、を作らない）
  // P が無く線だけでも、観察にしか残せない欄に入力があれば、位置の無い観察を1件作って残す（線と同じ鳥として結ぶ）。
  // 以前は「観察にしか残せない項目に入力があります」で止めていたが、P が無いのは普通なので止めない（2026-11-07 ユーザー）
  const obsKeepNoP = !editing && !pts.length && !nestFilled() && paths.length>0 && obsOnlyChanged();
  const nObs = editing ? Math.max(1, pts.length) : (pts.length || (nestFilled()?1:0) || (obsKeepNoP?1:0));
  const nRec = nObs + paths.length;
  const deletingOnly = nRec===0 && ((SCREENS._loadedFl||[]).length>0 || (SCREENS._loadedObs||[]).length>0);
  if(nRec===0 && !deletingOnly){
    toast('地図で P（止まっていた場所）か F（飛翔経路）、N（巣の位置）を落としてください', 5000); return; }
  if(nObs===0){
    // 飛翔だけを保存する場合。観察にしか置き場所が無い入力は残らないので、消える前に知らせる
    if(((SCREENS._audio||[]).length + (SCREENS._media||[]).length)>0 && paths.length!==1 && !anchorFlId){
      // 経路が1本なら下でその経路に付ける。複数だと付け先が決まらないので止める
      toast('写真・録音の付け先が決まりません。地図で P を落とすか、経路を1本にしてください', 7000); return; }
    // 観察にしか置き場所が無い項目に入力があるまま経路だけ保存すると、その入力は消える。
    // 気づかず失うより、止めて選んでもらう
    if(obsOnlyChanged()){
      toast('観察にしか残せない項目に入力があります。地図で P（止まっていた場所）を落とすか、その入力を消してから保存してください', 9000); return; }
    // 「P が無いので飛翔経路だけを保存します」の確認は出さない（2026-11-07 ユーザー: 猛禽は P が無いのが普通）。
    // 入力が消えてしまうときの止め（上の2つ）だけ残す
  }
  // 個体名を付けたら、その名前の目印に合わせる（同じ調査・同じ種の同名は「同じ1羽」）。
  // 名前が無ければ従来どおり（記録が2件以上なら新しい目印で結ぶ）
  const indKey = indLabel
    ? indKeyLbl
    : ((nRec>1) ? (rec.individual_key || uuid()) : (rec.individual_key||''));
  rec.individual_key = indKey;   // 位置なしの記録に経路だけ足したときも同じ目印で結ぶ
  rec.individual_label = indLabel;
  // 飛翔の「要確認」は、飛翔に残るもの（種名・個体数）と、利用者が自分で付けた印だけで決める。
  // 観察日時や観察者の位置など、飛翔に無い項目を理由にすると身に覚えのない印が付く
  const flReview = (!name) || (!!name && !speciesByName(name)) || (indCount(rec.count)===0)
    || !!($('#needsReview') && $('#needsReview').checked);

  // 飛翔をまとめて組み立てる（1本でも検査に落ちたら何も保存しない）
  const flRecs=[];
  const _whoKeys=Object.create(null);   // 同じ保存の中で「同じ種・同じ個体名」の線は同じ目印にする
  const _whoSep=new Set();   // 線ごとの値で別の鳥になった経路（あとで上段の個体名で上書きしない）
  for(const seg of paths){
    // 個体名を触っていない空欄なら undefined を渡す＝既存の経路の名前はそのまま
    const _flLbl=(indLabel || SCREENS._indLabelTouched) ? indLabel : undefined;
    // 線ごとの種名・齢・個体名（2026-11-07）。種か個体名が上と違う線は、観察の鳥と別の鳥（目印を共有しない）
    const who=lineWho(seg, svUuid, name, rec.age_class, indKey, indLabel, snapFl, _whoKeys);
    seg._who=who;
    const fr=buildFlightRec(seg, svUuid, who.name, rec.count, who.age, who.key, g('note'),
      who.separate ? ((!who.name) || !speciesByName(who.name) || flReview) : flReview,
      seg.ov||null, paths.length===1, who.separate ? who.label : _flLbl, snapFl);
    delete seg._who;
    if(!fr) return;
    if(who.separate) _whoSep.add(fr.uuid);
    flRecs.push(fr);
  }
  // 観察をまとめて組み立てる（1つ目は rec、2つ目以降は場所と時刻だけ差し替えた写し）
  // 同じ鳥の記録で「個体全体として共有する」項目だけを兄弟にそろえる。
  // 確認方法・行動・環境・方向は観察の場面ごとに違い得るので、そろえない（各記録の値を守る）
  const OBS_SHARED_F=['species_id','species_name_snapshot','count','age_class','sex',
    'identification_status','confidence','individual_label'];
  const obRecs=[];
  // 軸の経路から観察を作る場合、添付・メモは軸の経路が持つ（観察に写すと二重参照になる）
  if(anchorFlId){ rec.audio=[]; rec.media=[]; rec.note=''; }
  if(!pts.length && nObs>0){
    // 編集中にPを消した＝位置なしの記録として残す（記録そのものは消さない）
    rec.target_latitude=''; rec.target_longitude='';
    const PK=['perch_type','perch_size','perch_class','perch_species','perch_height','perch_artificial','perch_note'];
    if(SCREENS._hadP){
      // もとはPがあって、この画面で消した → 止まっていた場所の情報も一緒に外す。
      // 距離帯は位置に付く情報なので、手で選んでいても位置が無くなれば外す
      PK.forEach(k=>{ rec[k]=''; });
      rec.distance_band='';
    } else if(!editing){
      PK.forEach(k=>{ rec[k]=''; });   // 巣だけの記録。止まっていた場所は無い
    } else if(base){
      // もともと位置が無い記録 → 画面で扱えていないので、もとの値をそのまま残す（0・false・null も変えない）
      PK.forEach(k=>{ rec[k]=base[k]; });
    }
    obRecs.push(rec);
  }
  else { const uClaimed = pts.some(sg=>sg.srcUuid===u); let assignedU=false; let sibMissing=false;
  // 編集中に足した新しいPの観察者位置は、開いた記録の古い位置ではなく、保存した今の測位を使う
  const fxNow = editing ? freshFix() : null;
  pts.forEach((sg,i)=>{
    // 写真・録音の持ち主は最初の記録だけ。写しに同じIDを入れると、片方を消したときもう片方が壊れる。
    // まとめ読みした他の記録（srcUuid）は、番号と添付・メモを保ったまま、
    // 共有の項目（種名・個体数・齢・性別など）を開いた画面の内容にそろえる
    const sibSrc = (editing && sg.srcUuid && sg.srcUuid!==u)
      ? snapObs.find(x=>x && x.uuid===sg.srcUuid && !x.deleted_at) : null;
    // 読み込んだ兄弟が消えている＝新しい番号で作り直すと削除の取り消しになる。構築を中止する
    if(editing && sg.srcUuid && sg.srcUuid!==u && !sibSrc){ sibMissing=true; return; }
    let r2;
    if(editing && sg.srcUuid===u){ r2=rec; assignedU=true; }
    else if(sibSrc){
      // 兄弟の記録は「その記録」を基底にし、共有すると決めた項目だけを開いた画面の内容にそろえる。
      // 観察者の位置・精度・日時・距離帯・メモ・添付・別カメラの番号・巣・作成日時はその記録のまま
      r2=Object.assign({}, sibSrc);
      OBS_SHARED_F.forEach(k=>{ r2[k]=rec[k]; });
    }
    else if(editing && !uClaimed && !assignedU){ r2=rec; assignedU=true; }   // 開いた記録（位置なしだった）に最初の新しいPを割り当てる
    else if(!editing && i===0){ r2=rec; }
    // **写真の欄は3つとも空にする**（2026-08-14 監査3巡目 Critical）。
    // 同じIDを写しに入れると、1枚の写真を2つの記録が指すことになり、
    // 片方を消したときにもう片方が壊れる・書き出しで二重に出る
    else { r2=Object.assign({}, rec,
      { uuid:uuid(), audio:[], media:[], env_media:[], nest_media:[] }); }
    r2.individual_key = indKey;
    if(editing && !sg.srcUuid){
      // 新しく作る記録に、開いた記録の古い観察者位置を写さない
      if(fxNow){ r2.latitude=fxNow.lat.toFixed(6); r2.longitude=fxNow.lon.toFixed(6); r2.gps_accuracy=Math.round(fxNow.acc); }
      else { r2.latitude=''; r2.longitude=''; r2.gps_accuracy=''; }
    }
    r2.target_latitude = String(sg.pt[0]); r2.target_longitude = String(sg.pt[1]);
    // その P で選んだ「止まっていたもの」を、その観察だけに入れる
    // 触っていない既存の P は、元の記録の止まり情報を全項目そのまま保つ。
    //（種類別の絞り込みを無条件に通すと、種類と別種類の詳細が併存する取込データが
    //  開いて保存しただけで削られる）
    // 位置なしだった開いた記録を受け持つ新しいP（r2===rec）は、止まり情報を触っていなければ
    // 元記録から逐語で写す。最初のPを消して別のPを置き直しても、受け持ちで判定するので失われない
    const srcPerchRec=(editing && !sg.perchEdited)
      ? (sg.srcUuid ? (sg.srcUuid===u ? base : sibSrc)
                    : ((r2===rec && !SCREENS._hadP) ? base : null))
      : null;
    if(srcPerchRec){
      ['perch_type','perch_size','perch_class','perch_species','perch_height','perch_artificial','perch_note']
        .forEach(k=>{ r2[k]=srcPerchRec[k]; });   // 値をそのまま写す（0・false・null も変えない。無い項目は無いまま）
    } else {
    const pc = sg.perch || {};
    r2.perch_type = pc.type||'';
    // 知らない種類（同期や取込で入った独自の値）は、読み込んだ内容をそのまま残す。
    // 種類ごとの絞り込みは、今ある3種類のどれかを選んでいるときだけ行う
    // 種類が空なのに詳細だけある（昔の形式・取込データ）場合も、絞り込まずそのまま残す
    const _perchLegacy = !pc.type && !!(pc.art||pc.note);
    if(_perchLegacy || (pc.type && pc.type!=='木' && pc.type!=='人工物' && pc.type!=='その他')){
      r2.perch_size = pc.size||''; r2.perch_class = pc.cls||'';
      r2.perch_species = pc.species||''; r2.perch_height = pc.height||'';
      r2.perch_artificial = pc.art||''; r2.perch_note = pc.note||'';
    } else {
      r2.perch_size = (pc.type==='木') ? (pc.size||'') : '';
      r2.perch_class = (pc.type==='木') ? (pc.cls||'') : '';
      r2.perch_species = (pc.type==='木') ? (pc.species||'') : '';
      r2.perch_height = (pc.type==='木') ? (pc.height||'') : '';
      r2.perch_artificial = (pc.type==='人工物') ? (pc.art||'') : '';
      r2.perch_note = (pc.type==='人工物'||pc.type==='その他') ? (pc.note||'') : '';
    }
    }
    // もとからあった記録は、画面の「観察日時」を正とする（Pを置き直しても過去の日時を失わない）。
    // まとめ読みした他の記録の日時はその記録のまま。落とした時刻を使うのは、新しく作られる記録だけ
    if(sibSrc){ r2.observed_at = sibSrc.observed_at; }
    // 開いた記録（editing）と、画面で日時を直した記録は、画面の「観察日時」を正とする
    else if(!((editing || SCREENS._obsAtTouched) && r2===rec) && sg.time && okStamp(sg.time)) r2.observed_at = new Date(sg.time).toISOString();
    // 距離帯は観察者とその止まり位置の距離から決める（手で選び直されていればそれを優先）
    // 手で選び直していれば（「なし」も含めて）その指定を優先する
    if(!SCREENS._bandTouched){
      const srcR = sibSrc || ((editing && sg.srcUuid===u) ? base : null);
      if(editing && sg.fromExisting && srcR){
        // 動かしていない元のPなら、もとの距離帯をそのまま（「なし」も指定として守る）
        r2.distance_band = srcR.distance_band || '';
      } else {
        // 観察者の位置が取れていないときは、当てずっぽうの距離帯を入れずに空のままにする
        const band=(r2.latitude&&r2.longitude)
          ? distBandFrom(r2.latitude, r2.longitude, r2.target_latitude, r2.target_longitude) : '';
        r2.distance_band = band || '';
      }
    }
    obRecs.push(r2);
  });
  if(sibMissing){
    toast('読み込んだ観察が別の端末・タブで削除されています。画面を開き直してから保存してください', 7000);
    return;
  }
  if(editing && !obRecs.some(r=>r.uuid===u)){
    // 開いた記録のPを一覧で消した（または元から無い）場合も、開いた記録自体は必ず保存する。
    // 保存しないと、共有項目の変更が落ち、消したはずの位置が残ったまま再び現れる
    rec.target_latitude=''; rec.target_longitude='';
    const PK=['perch_type','perch_size','perch_class','perch_species','perch_height','perch_artificial','perch_note'];
    const openedHadP = !!(base && validLatLon(coordStr(base.target_latitude), coordStr(base.target_longitude)));
    if(openedHadP){ PK.forEach(k=>{ rec[k]=''; }); rec.distance_band=''; }
    else if(base){ PK.forEach(k=>{ rec[k]=base[k]; }); }   // 逐語コピー（0・false・null も変えない）
    obRecs.unshift(rec);
  } }

  // 経路を軸に開いた保存では、画面の添付・メモ・要確認を軸の経路へ書き戻す
  //（画面はその経路の写しとして開いている。書き戻さないと、直したのに保存されない）
  if(anchorFlId){
    const fr=flRecs.find(f=>f.uuid===anchorFlId);
    if(fr){
      fr.audio=(SCREENS._audio||[]).slice();
      fr.media=(SCREENS._media||[]).slice();
      fr.memo=String(g('note')||'').trim();
      fr.needs_review=!!($('#needsReview') && $('#needsReview').checked);
      // 個体名の欄は種名の下の1つだけ（食い違いを作らない）。ただし「この線だけ違う鳥」で決めた名前は残す（監査 Major）
      if(!_whoSep.has(fr.uuid)) fr.individual_label=String(indLabel||'');
    }
  }
  // 飛翔だけの保存で写真・録音があれば、書き込む前に、その1本の経路の記録へ付ける。
  // 実体（IndexedDB）の持ち主の控えも飛翔に付け替える（バックアップの中身と実態を食い違わせない）
  let flOwnerJobs=null;
  // 軸のある保存は書き戻し（上）で完結する。ここは「軸なしで新しく経路だけ保存した」場合の付け先。
  // 軸を消した保存では、添付は消した経路の記録に残す（他の経路へ写すと二重参照になる）
  if(!obRecs.length && flRecs.length===1 && !anchorFlId){
    const flId=flRecs[0].uuid;
    const flTgt=flRecs.find(f=>f.uuid===flId)||flRecs[0];
    if((SCREENS._audio||[]).length) flTgt.audio=(SCREENS._audio||[]).slice();
    if((SCREENS._media||[]).length) flTgt.media=(SCREENS._media||[]).slice();
    // 実体の持ち主の控えの付け替え。実行は記録の書き込みが済んでから（下の完了処理で待つ）
    flOwnerJobs={ flId, items:[] };
    (SCREENS._audio||[]).forEach(a=>flOwnerJobs.items.push({db:AudioDB, kind:'audio', id:a.id}));
    (SCREENS._media||[]).forEach(m=>flOwnerJobs.items.push({db:PhotoDB, kind:'media', id:m.id}));
  }
  // 巻き戻しは「今回書いた記録」だけを対象にする。
  // 配列全体を控えて丸ごと戻すと、その間に別のタブで保存された記録まで消してしまう
  const undoLog=[];   // {key, uuid, prev（書く前の記録。無ければnull）, wrote（書いた直後のupdated_at）}
  let txJournal=null;   // 第1段ジャーナル（書き込みの進み具合を逐次控える）
  // 写し（スナップショット）を基に組み立てた記録は、置き換える直前に
  // 「写しを取った時点と同じか」を確かめる。違えば別のタブが書き換えたということなので、
  // 古い内容で上書きしない（key|uuid → 写し時点の全文）
  const baseSnapJson=new Map();
  const snapMark=(key, rec0)=>{ if(rec0 && rec0.uuid) baseSnapJson.set(key+'|'+rec0.uuid, JSON.stringify(rec0)); };
  const writeOne=(key, rec, upsert, expect)=>{
    const arr0=loadStrict(key);
    if(!arr0) return false;   // 読めない状態で書くと全記録を失う
    const cur=arr0.find(x=>x&&x.uuid===rec.uuid);
    const mk=baseSnapJson.get(key+'|'+rec.uuid);
    // 写しの時点（または自分が直前に書いた値）と違えば、別のタブが書き換えたということ
    if(mk!==undefined && JSON.stringify(cur||null)!==mk) return false;
    const prev=cur?JSON.parse(JSON.stringify(cur)):null;
    if(!expect){
      // 予定値（時刻印含む）を先に確定して控える。書いた後では
      // 「これは自分の書き込みだ」と復旧が証明できない
      rec.updated_at=nowISO();
      if(!cur && !rec.created_at) rec.created_at=nowISO();
      if(txJournal){
        const pe=txJournal.map.get(key+'|'+rec.uuid);
        if(pe){
          // 計画時から今までに入った他の正当な更新を失わないよう、
          // 「書く直前の姿」を戻り先として控え直す（この取引で未書き込みの場合だけ）
          if(!pe.wroteRec && !pe.expectedRec) pe.prev=prev;
          pe.expectedRec=stableJson(rec);
          if(!saveJournalSet(txJournal.j)) return false; }
      }
      const iS=arr0.findIndex(x=>x&&x.uuid===rec.uuid);
      if(iS<0) arr0.push(rec); else arr0[iS]=rec;
      if(!DB.save(key, arr0)) return false;
    } else {
      if(!upsert(rec)) return false;
    }
    const arr1=loadStrict(key);
    if(!arr1) return false;
    const now=arr1.find(x=>x&&x.uuid===rec.uuid);
    if(!now) return false;   // 書いたはずの記録が見つからない＝成功とは言えない
    // 1回の保存で同じ記録を続けて書く経路があるので、次に期待する値を更新しておく
    //（消してしまうと、2回目の書き込みで別のタブの割り込みを見逃す）
    if(mk!==undefined) baseSnapJson.set(key+'|'+rec.uuid, JSON.stringify(now));
    // 書けたのが「自分の書こうとした値」であることを照合する。直後に別のタブが
    // 同じ番号を上書きした場合、その値を自分の控えとして採用してはならない
    const expOk = expect ? expect(now, prev) : (stableJson(now)===stableJson(rec));
    if(!expOk) return false;   // 競合版は undoLog に登録せず中止（巻き戻しで触らない）
    undoLog.push({key, uuid:rec.uuid, prev,
      wroteRec: JSON.stringify(now)});   // 書いた直後の記録全体（時刻だけの比較では同時刻更新を見分けられない）
    if(txJournal){
      const pe=txJournal.map.get(key+'|'+rec.uuid);
      if(pe){ pe.wroteRec=JSON.stringify(now);
        if(!saveJournalSet(txJournal.j)) return false; }   // 進み具合を控えられなければ成功扱いにしない
    }
    return true;
  };
  const rollback = ()=>{
    let okAll=true;
    // 同じ記録を複数回書く経路があるため、（記録の種類×番号）ごとに
    // 「最初に書く前の姿（prev）」と「最後に書いた控え（wroteRec）」へ正規化してから戻す。
    // 途中の姿と比較すると、正しく戻せたのに失敗と誤判定する
    const norm=new Map();
    undoLog.forEach(e=>{ const k=e.key+'|'+e.uuid;
      if(!norm.has(k)) norm.set(k,{key:e.key,uuid:e.uuid,prev:e.prev,wroteRec:e.wroteRec});
      else norm.get(k).wroteRec=e.wroteRec; });
    const byKey=new Map();
    const restored=[];
    for(const e of Array.from(norm.values()).reverse()){
      if(!byKey.has(e.key)){
        let base=null;
        if(typeof GUARD_SNAP!=='undefined' && Object.prototype.hasOwnProperty.call(GUARD_SNAP, e.key)){
          // 相手の最新の姿を基準に合成する。自分の後勝ち保存が相手の別の記録の更新を
          // 消していても、この基準の上で自分の分だけ戻せば相手の更新は保たれる
          try{ const v=JSON.parse(GUARD_SNAP[e.key]); if(Array.isArray(v)) base=v; }catch(_){ }
        } else base=loadStrict(e.key);
        byKey.set(e.key, base);
      }
      const arr=byKey.get(e.key);
      if(!arr){ okAll=false; continue; }   // 読めない・合成の基準が壊れている＝触らない
      const idx=arr.findIndex(x=>x&&x.uuid===e.uuid);
      const curJson= idx>=0 ? JSON.stringify(arr[idx]) : '';
      if(idx>=0 && curJson===e.wroteRec){
        if(e.prev) arr[idx]=e.prev; else arr.splice(idx,1);
        restored.push(e);
      } else if((idx<0 && !e.prev) || (idx>=0 && e.prev && curJson===JSON.stringify(e.prev))){
        // すでに書く前の姿。戻す必要なし
      } else {
        okAll=false;   // 別の書き手の更新が残っている＝「取り消した」とは言えない
      }
    }
    byKey.forEach((arr,key)=>{ if(arr && !DB.save(key,arr)) okAll=false; });
    // 戻したはずの記録を読み直して、本当に戻ったことを確かめる
    for(const e of restored){
      const a2=loadStrict(e.key);
      if(!a2){ okAll=false; continue; }
      const cur=a2.find(x=>x&&x.uuid===e.uuid);
      if(e.prev ? JSON.stringify(cur)!==JSON.stringify(e.prev) : !!cur) okAll=false;
    }
    if(!okAll) toast('保存に失敗し、書きかけを取り消せませんでした。データ点検・修復画面で確認してください', 8000);
    return okAll;
  };
  // 今回書いた記録がすべて「書いた直後の姿のまま」残っているかを確かめる
  //（別の書き手を検知したとき、添付の後片付けを進めてよいかの判定に使う）
  const undoStillOk=()=>{
    try{
      // 同じ記録を1回の保存で複数回書く経路（共有項目そろえ→位置外し等）があるため、
      // 比較は「その記録への最後の書き込みの控え」と行う
      const last=new Map();
      undoLog.forEach(e2=>last.set(e2.key+'|'+e2.uuid, e2));
      return Array.from(last.values()).every(e2=>{
        const a2=loadStrict(e2.key);
        if(!a2) return false;
        const cur=a2.find(x=>x&&x.uuid===e2.uuid);
        return !!cur && JSON.stringify(cur)===e2.wroteRec;   // 記録全体の一致で見る
      });
    }catch(_){ return false; }
  };
  // 同じ鳥の記録が他にもあるとき、巣の内容は全部に同じものを配る。
  // 1つだけ直すと、地図に古い巣と新しい巣が2つ出たり、消したはずの巣が復活したりする
  const NEST_F=['nest_id','nest_latitude','nest_longitude','nest_tree_species','nest_tree_height','nest_state'];
  const sibs=[];
  // 個体名でまとめる保存で、これから同じ目印へ移す記録。
  // 巣・共有項目をそろえる対象に含める（目印だけ移して中身が食い違うのを防ぐ）
  // 「まとめる」ときだけ、相手の記録に共有項目や巣も配る。
  // 「名前を外す」ときは名前だけを消す（相手の中身に手を出さない）
  const indMergeIds=new Set((indR && indR.mode==='merge') ? indR.fixObs.map(o=>o.uuid) : []);
  const indUnnameIds=new Set((indR && indR.mode==='unname') ? indR.fixObs.map(o=>o.uuid) : []);
  // 巣が空になる保存でも、開いたとき巣が見えていなかった画面からは配らない（見えないものは消せない）
  const nestWiping = !rec.nest_id;
  if(indKey && obRecs.length && nestTouched() && !(nestWiping && !SCREENS._hadNestAtOpen)){
    const mine=new Set(obRecs.map(r=>r.uuid));
    const all=snapObs;
    // このまとまりにある巣の目印。1つだけなら、目印の無い記録も同じ巣とみなす
    // 目印の解決は画面・件数と同じ「生きている記録」だけで行う（ごみ箱は伝播先としてだけ扱う）
    const liveGroup=snapObsLive.filter(o=>o.individual_key===indKey || indMergeIds.has(o.uuid));
    const idsInGroup=new Set();
    liveGroup.forEach(o=>{ if(nestId(o)) idsInGroup.add(nestId(o)); });
    // 照合の基準は「開いたときに見えていた巣」。editing の元記録でも keep の読込でも同じ。
    // 巣を全部消したときも、この基準で元の巣を持つ記録へ空が行き渡る
    const ON=SCREENS._openNest||null;
    let myNid=rec.nest_id || PF_NEST_ID || nestId(base||{}) || (ON&&ON.id||'');
    if(!myNid && ON){
      // 開いた巣が無印なら、「開いた巣と位置か内容が一致する目印」が1つに定まるときだけ、
      // それを正として消し込み・変更を届ける（グループに目印が1つある、だけでは採用しない）
      const gPos=new Map(), gFp=new Map();
      liveGroup.forEach(o=>{
        const id0=nestId(o); if(!id0) return;
        if(!gPos.has(id0)) gPos.set(id0, new Set());
        gPos.get(id0).add(nestPosKey(o));
        if(!gFp.has(id0)) gFp.set(id0, new Set());
        gFp.get(id0).add(nestFpKey(o)); });
      const cands=[...idsInGroup].filter(tid=>
        (nestPosValid(ON.pos) && (gPos.get(tid)||new Set()).has(ON.pos))
        || (gFp.get(tid)||new Set()).has(ON.fp));
      if(cands.length===1) myNid=cands[0];
    }

    // 別の巣（目印が違う・位置が違う）には手を出さない。
    // 目印の無い相手は「内容が完全に一致（写し）」または「同じ位置」だけを同じ巣とみなす。
    // 開いたとき巣が無く、この画面で初めて巣を付けた場合は、巣を何も持たない記録にだけ配る
    const nestSameRec=o=>{
      const oid=nestId(o);
      return oid ? (!!myNid && oid===myNid)
        : (ON ? (nestFpKey(o)===ON.fp
              || (nestPosValid(nestPosKey(o)) && nestPosKey(o)===ON.pos))
              : !nestHasInfo(o));
    };
    // まとめ読みで obRecs に入っている兄弟にも、同じ照合で巣を配る（合わなければその記録の巣のまま）
    obRecs.forEach(r2=>{
      if(r2===rec) return;
      const src=snapObsLive.find(x=>x.uuid===r2.uuid) || r2;
      if(!nestSameRec(src)) return;
      NEST_F.forEach(k=>{ r2[k]=rec[k]||''; });
    });
    // ごみ箱の中の記録にも配る。配らないと、あとで復元したときに古い巣が戻ってくる
    all.forEach(o=>{
      if(!o || mine.has(o.uuid) || o.survey_uuid!==svUuid) return;
      if(indUnnameIds.has(o.uuid)) return;   // 名前を外す相手の巣には手を出さない
      if(o.individual_key!==indKey && !indMergeIds.has(o.uuid)) return;
      if(!nestSameRec(o)) return;
      const cp=Object.assign({}, o);
      // 相手の巣座標が壊れていたら、その記録自身に元の値を控えてから置き換える
      const a=coordStr(cp.nest_latitude), b=coordStr(cp.nest_longitude);
      if(!(a==='' && b==='') && !validLatLon(a,b)){
        cp.repair_note = repairNoteAdd(cp.repair_note, '巣の位置が不正だったため置き換えました（元の値: '+a+','+b+'）');
      }
      let diff=(cp.repair_note!==o.repair_note);
      // 統合される記録は、目印と名前もここでそろえる（あとで足すと巣・共有項目が反映されない）
      if(indMergeIds.has(o.uuid)){
        if(cp.individual_key!==indKey){ cp.individual_key=indKey; diff=true; }
        if(String(cp.individual_label||'')!==indLabel){ cp.individual_label=indLabel; diff=true; }
      }
      NEST_F.forEach(k=>{ const v=rec[k]||''; if(String(cp[k]||'')!==String(v)){ cp[k]=v; diff=true; } });
      // 生きている兄弟なら、共有項目もここでそろえる（ごみ箱の記録の中身までは変えない）
      if(!o.deleted_at) OBS_SHARED_F.forEach(k=>{ if(String(cp[k]??'')!==String(rec[k]??'')){ cp[k]=rec[k]; diff=true; } });
      if(diff) sibs.push(cp);
    });
  }
  // 個体名でまとめる相手には、新しい記録からの保存でも共有項目をそろえる
  //（目印と名前だけ移して、種名・個体数・齢などが食い違うのを防ぐ）
  if(indMergeIds.size){
    const mineM=new Set(obRecs.map(r=>r.uuid).concat(sibs.map(r=>r.uuid)));
    snapObsLive.forEach(o2=>{
      if(mineM.has(o2.uuid) || !indMergeIds.has(o2.uuid)) return;
      const cp=Object.assign({}, o2, { individual_key:indKey, individual_label:indLabel });
      OBS_SHARED_F.forEach(k=>{ cp[k]=rec[k]; });
      sibs.push(cp);
    });
  }
  // まとめ・名前外しで書き直す飛翔（宣言はここ。下の処理から書き足していく）
  const indFixFl=[];
  // 個体名でまとめたときは、同じ目印の記録すべてに共有項目をそろえる（新規からの保存でも）。
  // そろえないと、同じ1羽なのに個体数・齢などが記録ごとに食い違う
  if(indLabel && indKey){
    const mineL=new Set(obRecs.map(r=>r.uuid).concat(sibs.map(r=>r.uuid)));
    snapObsLive.forEach(o2=>{
      if(mineL.has(o2.uuid) || o2.individual_key!==indKey) return;
      const cp=Object.assign({}, o2);
      let diff=false;
      if(String(cp.individual_label||'')!==indLabel){ cp.individual_label=indLabel; diff=true; }
      OBS_SHARED_F.forEach(k=>{ if(String(cp[k]??'')!==String(rec[k]??'')){ cp[k]=rec[k]; diff=true; } });
      if(diff) sibs.push(cp);
    });
  }
  // 巣の照合に入らなかった「生きている兄弟」（位置なしで画面に載らない記録など）にも共有項目をそろえる
  if(editing && indKey){
    const mine=new Set(obRecs.map(r=>r.uuid).concat(sibs.map(r=>r.uuid)));
    snapObsLive.forEach(o2=>{
      if(mine.has(o2.uuid) || indUnnameIds.has(o2.uuid)) return;   // 名前を外す相手の中身には手を出さない
      if(o2.individual_key!==indKey && !indMergeIds.has(o2.uuid)) return;
      const cp=Object.assign({}, o2);
      let diff=false;
      // 統合される記録は目印と名前もそろえる
      if(indMergeIds.has(o2.uuid)){
        if(cp.individual_key!==indKey){ cp.individual_key=indKey; diff=true; }
        if(String(cp.individual_label||'')!==indLabel){ cp.individual_label=indLabel; diff=true; }
      }
      OBS_SHARED_F.forEach(k=>{ if(String(cp[k]??'')!==String(rec[k]??'')){ cp[k]=rec[k]; diff=true; } });
      if(diff) sibs.push(cp);
    });
  }
  // ここからは一続きの保存。書き終えて検証するまで、新しい操作は覆いで止める
  SAVE_BUSY=true; saveBusyShow(true);
  if(typeof GUARD_CONFLICT!=='undefined'){ GUARD_CONFLICT=false; GUARD_SNAP={}; }   // この保存の間の競合だけを見る
  if(typeof BACKUP_GEN!=='undefined'){ BACKUP_GEN++; _backupPending=true; _folderPending=true; }   // 作成中のバックアップを無効化し、確定点で予約し直す
  const saveAbort=()=>{ SAVE_BUSY=false; saveBusyShow(false); };
  // 仮記録（ghost）の全文はこの時点（自分の書き込みだけが済んでいる状態）で固定する。
  // 記録を書き終えた後に読み直すと、その間に別のタブが正式化した記録を
  // 「消してよい仮記録」として控えてしまう
  let ghostRecFixed;
  if(!obRecs.length && SCREENS._ghost){
    const gA=loadStrict(SCREENS._ghost.key);
    if(!gA){
      toast('記録の読み込みに失敗したため、保存を中止しました。データ点検・修復画面で確認してください', 8000);
      SAVE_BUSY=false; saveBusyShow(false); return;
    }
    const gC=gA.find(x=>x&&x.uuid===SCREENS._ghost.uuid);
    if(!gC){
      // 仮記録が見つからない＝この取引で消してよい対象を証明できない。開始しない
      toast('保存の準備に失敗しました（仮記録を確認できません）。もう一度お試しください', 8000);
      SAVE_BUSY=false; saveBusyShow(false); return;
    }
    ghostRecFixed=JSON.stringify(gC);
  }
  // 個体名でまとめた分の書き直し（同じ名前の記録を、決めた目印へ揃える）。
  // 同じ保存の取引の中で書くので、途中で失敗すればまとめて元へ戻る。
  // 書き戻すのは「いま読み直した最新の姿」に必要な項目だけを載せたもの。
  // 見つけたときの写しをそのまま書くと、その間に別のタブがした削除・復元・修正を消してしまう
  // 名前を外す相手は、他の伝播から外してあるので、ここで「名前だけ」を消す
  if(indUnnameIds.size){
    const mineU=new Set(obRecs.map(r=>r.uuid).concat(sibs.map(r=>r.uuid)));
    indR.fixObs.forEach(o=>{
      if(mineU.has(o.uuid)) return;
      sibs.push(Object.assign({}, o, { individual_label:'' }));
    });
  }
  // 飛翔にそろえる共有項目は1か所で決める（まとめる相手も、もともと同じ目印の経路も同じ扱い）。
  // 齢は「画面で触ったときだけ」そろえる（既存の規則。触っていない齢を勝手に変えない）
  const flShare=(f0)=>{
    const cp=Object.assign({}, f0);
    let diff=false;
    const wantLb=(indR && indR.mode==='unname') ? '' : indLabel;
    if(String(cp.individual_label||'')!==wantLb){ cp.individual_label=wantLb; diff=true; }
    if(indLabel){
      if(cp.individual_key!==indKey){ cp.individual_key=indKey; diff=true; }
      if(String(cp.species_name_snapshot||'')!==String(name||'')){
        cp.species_name_snapshot=name; diff=true; }
      // 種名が同じでも種IDだけ空・古いことがある（取込や旧版の記録）。IDは別に比べてそろえる
      if(String(cp.species_id||'')!==String(rec.species_id||'')){
        cp.species_id=rec.species_id||''; diff=true; }
      if(String(cp.count??'')!==String(rec.count??'')){ cp.count=rec.count; diff=true; }
      if(SCREENS._ageTouched && String(cp.age_class||'')!==String(rec.age_class||'')){
        cp.age_class=rec.age_class; diff=true; }
    }
    return diff?cp:null;
  };
  // もともと同じ目印を持っている経路にも、共有項目をそろえる
  if(indLabel && indKey){
    _snap.flLive.forEach(f2=>{
      if(f2.individual_key!==indKey) return;
      if(flRecs.some(r=>r.uuid===f2.uuid) || indFixFl.some(r=>r.uuid===f2.uuid)) return;
      const cp=flShare(f2); if(cp) indFixFl.push(cp);
    });
  }
  // 上で最新版を確かめてあるので、ここでは組み立てるだけ（二重に書かないものは飛ばす）
  if(indR && indR.mode==='merge'){
    indR.fixObs.forEach(o=>{
      if(obRecs.some(r=>r.uuid===o.uuid) || sibs.some(r=>r.uuid===o.uuid)) return;
      sibs.push(Object.assign({}, o, { individual_key:indKey, individual_label:indLabel }));
    });
  }
  if(indR){
    indR.fixFl.forEach(f=>{
      if(flRecs.some(r=>r.uuid===f.uuid) || indFixFl.some(r=>r.uuid===f.uuid)) return;
      const cp=flShare(f);
      indFixFl.push(cp || Object.assign({}, f));
    });
  }
  // 写しから作ったものに印を付ける（writeOne が置き換える直前に照合する）
  if(base) snapMark(DB.key.ob, base);
  sibs.forEach(sb=>{ const o0=snapObs.find(x=>x&&x.uuid===sb.uuid); if(o0) snapMark(DB.key.ob, o0); });
  flRecs.forEach(fr=>{ const f0=snapFl.find(x=>x&&x.uuid===fr.uuid); if(f0) snapMark(DB.key.fl, f0); });
  indFixFl.forEach(fr=>{ const f0=snapFl.find(x=>x&&x.uuid===fr.uuid); if(f0) snapMark(DB.key.fl, f0); });
  obRecs.forEach(r2=>{ const o0=snapObs.find(x=>x&&x.uuid===r2.uuid); if(o0) snapMark(DB.key.ob, o0); });
  // 書き込みを始める前に、写しを取った時点から相手が変わっていないかを確かめる。
  // 組み立て直さず「変わっていたら中止」だけを行う（古い姿で上書きしないため）
  if(indR && (indR.fixObs.length || indR.fixFl.length)){
    const vo=loadStrict(DB.key.ob), vf=loadStrict(DB.key.fl);
    if(!vo || !vf){
      toast('記録の読み込みに失敗したため、保存を中止しました。データ点検・修復画面で確認してください', 8000);
      SAVE_BUSY=false; saveBusyShow(false); return;
    }
    const intact=(was, now)=> !!now
      && String(was.updated_at||'')===String(now.updated_at||'')
      && String(was.deleted_at||'')===String(now.deleted_at||'');
    let bad=false;
    indR.fixObs.forEach(o=>{ if(!intact(o, vo.find(x=>x&&x.uuid===o.uuid))) bad=true; });
    indR.fixFl.forEach(f=>{ if(!intact(f, vf.find(x=>x&&x.uuid===f.uuid))) bad=true; });
    if(bad){
      toast('まとめる相手の記録が別の端末・タブで変わりました。画面を開き直してから保存してください', 8000);
      SAVE_BUSY=false; saveBusyShow(false); return;
    }
  }
  // 取引の第1段: これから書く全記録（削除対象も含む）の「書く前の姿」を先に控える。
  // 各記録を書くたびに「書いた直後の控え」も書き足す（writeOne 内）。
  // 途中で終了しても、起動時に「自分が書いた分だけ」を安全に元へ戻せる
  {
    const plannedMap=new Map();
    let planBad=false;
    const addPlan=(key,uuid)=>{ if(!uuid) return;
      const k=key+'|'+uuid;
      if(plannedMap.has(k)) return;
      const arr=loadStrict(key);
      if(!arr){ planBad=true; return; }
      const cur=arr.find(x=>x&&x.uuid===uuid);
      plannedMap.set(k, {key, uuid, prev: cur?JSON.parse(JSON.stringify(cur)):null, wroteRec:''}); };
    flRecs.forEach(fr=>addPlan(DB.key.fl, fr.uuid));
    indFixFl.forEach(fr=>addPlan(DB.key.fl, fr.uuid));
    obRecs.forEach(r2=>addPlan(DB.key.ob, r2.uuid));
    sibs.forEach(sb=>addPlan(DB.key.ob, sb.uuid));
    if(editing || (SCREENS._loadedFl||[]).length || (SCREENS._loadedObs||[]).length){
      const keptObsP=new Set(pts.map(sg=>sg.srcUuid).filter(Boolean));
      (SCREENS._loadedObs||[]).forEach(id=>{ if(!keptObsP.has(id)) addPlan(DB.key.ob, id); });
      const keptFlP=new Set(PF_SEGS.filter(sg=>sg.t==='F' && sg.srcUuid).map(sg=>sg.srcUuid));
      (SCREENS._loadedFl||[]).forEach(id=>{ if(!keptFlP.has(id)) addPlan(DB.key.fl, id); });
    }
    if(planBad){
      toast('記録の読み込みに失敗したため、保存を中止しました。データ点検・修復画面で確認してください', 8000);
      saveAbort(); return;
    }
    const j0={ t: nowISO(), tx: uuid(), phase:'writing', undo: Array.from(plannedMap.values()), fl:null, ghost:null };
    CUR_TX=j0.tx;
    if(!saveJournalSet(j0)){
      toast('空き容量が足りず、保存を開始できませんでした。空き容量を確保してからやり直してください', 8000);
      saveAbort(); return;
    }
    txJournal={ j: j0, map: plannedMap };
  }
  const saveHalt=()=>saveFatalHalt();
  // 取り消しの共通処理。控え（ジャーナル）を消し、消えたことまで確かめてから操作を再開する。
  // 控えが残ったまま再開すると、別経路の正当な更新を次回起動の復旧が古い姿へ戻してしまう
  const saveCancel=(msg)=>{
    if(rollback() && saveJournalClear()){
      saveAbort(); if(msg) toast(msg, 8000);
    } else saveHalt();
  };
  // 書き込み直前の生存再確認（入口確認からここまでの間に別の書き手が消していないか）。
  // 消えた対象へ書くと、削除の取り消しや新しい番号での復活＝取り違いになる
  {
    let goneLate=false;
    if(editing && !DB.observations().some(x=>x&&x.uuid===u)) goneLate=true;
    if(!goneLate && SCREENS._flAnchorUuid && !DB.flights().some(f=>f.uuid===SCREENS._flAnchorUuid)) goneLate=true;
    if(!goneLate) PF_SEGS.forEach(sg=>{
      if(sg.t==='F' && sg.srcUuid && !DB.flights().some(f=>f.uuid===sg.srcUuid)) goneLate=true;
      if(sg.t==='P' && sg.srcUuid && !DB.observations().some(o2=>o2&&o2.uuid===sg.srcUuid)) goneLate=true;
    });
    if(goneLate){
      saveJournalClear();
      saveAbort();
      toast('読み込んだ記録が別の端末・タブで削除されています。画面を開き直してから保存してください', 7000);
      return;
    }
  }
  for(const fr of flRecs){ if(!writeOne(DB.key.fl, fr, r=>DB.upsertFlight(r))){
    saveCancel('別の端末・タブで記録が変わっていたため、この保存を取り消しました。画面を開き直してください'); return; } }
  for(const fr of indFixFl){ if(!writeOne(DB.key.fl, fr, r=>DB.upsertFlight(r))){ saveCancel(); return; } }
  for(const r2 of obRecs){ if(!writeOne(DB.key.ob, r2, r=>DB.upsertObs(r))){ saveCancel(); return; } }
  for(const sb of sibs){ if(!writeOne(DB.key.ob, sb, r=>DB.upsertObs(r))){ saveCancel(); return; } }
  // まとめ読みした記録のうち、画面の一覧で「✕ 消す」されたものは削除する（明示的に消したものだけ）。
  // 経路のカードから開いた（editingでない）場合も、読み込んだ経路は同じ扱い
  if(editing || (SCREENS._loadedFl||[]).length || (SCREENS._loadedObs||[]).length){
    const keptObs=new Set(pts.map(sg=>sg.srcUuid).filter(Boolean));
    for(const id of (SCREENS._loadedObs||[])){
      if(keptObs.has(id)) continue;
      // P を消しても記録そのものは消さない（開いた記録と同じ扱い）。
      // 位置と、位置に付く情報（止まり木・距離帯）だけを外す。
      // 記録ごと消すのは記録の削除ボタンの仕事（メモ・添付まで一緒に消えるため）
      const sib0=DB.observations().find(x=>x.uuid===id);
      if(!sib0) continue;
      const cp=Object.assign({}, sib0, { target_latitude:'', target_longitude:'',
        perch_type:'', perch_size:'', perch_class:'', perch_species:'', perch_height:'',
        perch_artificial:'', perch_note:'' });
      cp.distance_band='';   // 距離帯は位置に付く情報。位置を外したら必ず外す
      if(!writeOne(DB.key.ob, cp, r=>DB.upsertObs(r))){ saveCancel(); return; }
    }
    const keptFl=new Set(PF_SEGS.filter(sg=>sg.t==='F' && sg.srcUuid).map(sg=>sg.srcUuid));
    for(const id of (SCREENS._loadedFl||[])){
      if(keptFl.has(id)) continue;
      {
        // 削除も「削除印を付けた全文」を予定値として、通常の厳格書き込みで行う
        const delArr=loadStrict(DB.key.fl);
        if(!delArr){ saveCancel(); return; }
        const delCur=delArr.find(x=>x&&x.uuid===id);
        if(delCur){
          const cpDel=Object.assign({}, JSON.parse(JSON.stringify(delCur)), { deleted_at: nowISO() });
          if(!writeOne(DB.key.fl, cpDel)){ saveCancel(); return; }
        }
      }
    }
  }
  PF_NEST_ID = resolvedNestId;   // 保存が成功したので、決めた目印を画面の状態にも反映する

  // 完了処理は非同期に進むため、途中でアプリが終了しても復旧できるように控えを残す。
  // 仮記録（ghost）は「観察を作らない＝本当に消す」場合だけ載せる。
  // 観察を作る保存では仮記録が完成した観察そのものになるため、載せると復旧が誤って消す
  const writtenJ={ t: nowISO(), tx: (txJournal&&txJournal.j&&txJournal.j.tx)||undefined, phase:'written', undo: undoLog,
    fl: flOwnerJobs ? { flId: flOwnerJobs.flId, items: flOwnerJobs.items.map(it=>({kind:it.kind, id:it.id})) } : null,
    ghost: (!obRecs.length && SCREENS._ghost) ? { key: SCREENS._ghost.key, uuid: SCREENS._ghost.uuid,
      rec: ghostRecFixed } : null };   // 取引開始時に固定した全文（DBから再取得しない）
  if(!saveJournalSet(writtenJ)){
    // 復旧の控えを残せない状態で後処理へ進まない（途中終了すると回収できなくなる）
    saveCancel('空き容量が足りず、保存を安全に完了できませんでした。空き容量を確保してからやり直してください');
    return;
  }

  // ここから先（仮記録の削除・掃除・成功表示・画面遷移）は finalize にまとめ、
  // 一度イベントループへ制御を返してから実行する。別のタブの書き込みは storage
  // イベントとして次のタスクで届くため、同期のまま完了扱いにすると取りこぼす
  const finalize=()=>{

  if(!obRecs.length){
    const finish=()=>{
      // 観察を作らないので、写真・録音の都合で作られた仮記録を片付ける。
      // 片付けに失敗したら false を返す（巻き戻すかは呼び出し側が決める——
      // 添付の付け替えを先に戻さないと、実体が消えた飛翔を指したままになる）
      // 仮記録を消す前に、競合と記録の生存をもう一度確かめる（消してからでは戻せない）
      if((typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT) || !undoStillOk()) return false;
      const gh=SCREENS._ghost;
      if(gh){
        const st=ghostDeleteVerified(gh.key, gh.uuid, (writtenJ&&writtenJ.ghost)?writtenJ.ghost.rec:undefined);
        if(st==='fatal'){ saveFatalHalt('仮記録の片付けを確認できませんでした。'); return true; }   // 補償へ進まず停止（控えは残る）
        if(st==='changed' || st==='fail') return false;   // 相手の正式な記録は消さない／確認できなければ補償へ
        SCREENS._ghost=null; mediaGcAll().catch(function(){});
      }
      // 仮記録を消した後は巻き戻さない（添付の持ち主が消えた記録を指してしまう）。
      // 控えを消せなければ完成した状態のまま停止し、次回起動の復旧に確定させてもらう
      if(!saveJournalClear()){ saveFatalHalt('保存の控えを片付けられませんでした。'); return true; }
      if(name) DB.pushRecent(name);
      SCREENS._chosenId=null; SCREENS._audio=null; SCREENS._media=null;
      SCREENS._envMedia=null; SCREENS._nestMedia=null;
      SCREENS._dirty=false; SCREENS._ghost=null;
      PF_SEGS=[]; PF_NEWLINE=true;
      toast(flRecs.length ? ('飛翔経路を'+flRecs.length+'本保存しました') : '経路を削除しました');
      // 複数個体: 飛翔だけの保存でも画面に留まる
      const flU0=((flRecs[0]&&flRecs[0].uuid) || anchorFlId || null);   // 今回書けた生存の経路を優先
      // 直している記録の「保存する」は編集を終えて「観察を追加」の地図に戻る（v240・2026-11-08 ユーザー。v234 の「留まる」をやめた）
      if(cont===false && SCREENS._obsEditView){ if(obsEditDone(svUuid, null, flU0)) return true; }
      if(typeof birdAfterSave==='function' && (cont==='addBird' || (BIRDS.length>1 && cont!==true))){
        if(birdAfterSave(null, cont==='addBird', flU0, false)) return true;
      }
      if(cont===true){ goBack(); nav('obsEdit', JSON.stringify({sv:svUuid})); } else goBack();
      return true;
    };
    if(flOwnerJobs && flOwnerJobs.items.length){
      // 付け替えは1件ずつ行い、途中で失敗したら付け替え済みの分を「戻せたことを確かめながら」全部戻す。
      // 全部戻せたときだけ記録も巻き戻す（戻せないのに記録だけ消すと、実体が宙に浮く）。
      // 終わるまで保存・離脱は SAVE_BUSY で止め、画面遷移は解除後に行う
      SAVE_BUSY=true; saveBusyShow(true);
      (async ()=>{
        try{
        const doneUndo=[];
        // 付け替え済みの分を戻す。1件ずつ書いて読み直し、戻ったことを確かめる
        const restoreOwners=async (keepKeys)=>{
          let allOk=true;
          for(const u2 of doneUndo.slice().reverse()){
            if(keepKeys && keepKeys.has(u2.kind+':'+u2.id)){
              // 生存記録が参照している添付は持ち主を変えない。ただし持ち主が
              // 本当にその飛翔になっていることを読み直して確かめる
              try{
                const rk=await u2.db.get(u2.id);
                if(!rk || rk.obs_uuid!=='' || rk.flight_uuid!==flOwnerJobs.flId) allOk=false;
              }catch(_){ allOk=false; }
              continue;
            }
            try{
              const casR=await ownerCas(u2.kind, u2.id, r=>{
                if(r.obs_uuid===u2.prev.obs_uuid && r.flight_uuid===u2.prev.flight_uuid) return null;   // すでに元の持ち主
                if(!(r.obs_uuid==='' && r.flight_uuid===flOwnerJobs.flId)) return false;   // 別の書き手が動かした＝触らない
                return { obs_uuid:u2.prev.obs_uuid, flight_uuid:u2.prev.flight_uuid };
              });
              if(!casR.ok){ allOk=false; continue; }
              const chk=await u2.db.get(u2.id);
              if(!chk || chk.obs_uuid!==u2.prev.obs_uuid || chk.flight_uuid!==u2.prev.flight_uuid) allOk=false;
            }catch(_){ allOk=false; }
          }
          return allOk;
        };
        let swapped=false;
        try{
          for(const j of flOwnerJobs.items){
            const r=await j.db.get(j.id);

// 無圧縮(格納)ZIPを解く。ローカルファイルヘッダを順に読む（このアプリで配る図鑑ZIPは無圧縮・UTF-8名で作る）
function parseStoredZip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf); const dec=new TextDecoder('utf-8');
  const entries=[]; let i=0;
  while(i+30<=u8.length){
    if(dv.getUint32(i,true)!==0x04034b50) break;   // ローカルヘッダ以外（中央ディレクトリ等）に来たら終了
    const method=dv.getUint16(i+8,true);
    const compSize=dv.getUint32(i+18,true);
    const nameLen=dv.getUint16(i+26,true), extraLen=dv.getUint16(i+28,true);
    const name=dec.decode(u8.subarray(i+30, i+30+nameLen));
    const dataStart=i+30+nameLen+extraLen;
    if(method===0 && !name.endsWith('/')) entries.push({ name, data:u8.subarray(dataStart, dataStart+compSize) });
    i=dataStart+compSize;
  }
  return entries;
}
// 種図鑑ZIP（和名.png を多数まとめたもの）を1ファイルで一括取り込み。端末内のみ保存・公開URLには出さない
async function importGuideZip(input){
  const f=(input.files||[])[0]; input.value=''; if(!f) return;
  if(!/\.zip$/i.test(f.name||'')){ toast('ZIPファイルを選んでください'); return; }
  toast('図鑑ZIPを読み込み中…（初回は少し時間がかかります）');
  let buf; try{ buf=await f.arrayBuffer(); }catch(e){ toast('ファイルを読めませんでした'); return; }
  let entries=[]; try{ entries=parseStoredZip(buf); }catch(e){ entries=[]; }
  const imgs=entries.filter(e=>/\.(png|jpe?g|webp|gif)$/i.test(e.name));
  if(!imgs.length){ toast('ZIP内に画像が見つかりません（無圧縮ZIPをお使いください）'); return; }
  const adds=[]; let done=0;
  for(const e of imgs){
    const base=e.name.replace(/^.*\//,'');
    const name=base.replace(/\.[^.]+$/,'').replace(/[\s_]*[（(]?\d+[）)]?\s*$/,'').trim();
    const ext=((base.match(/\.([a-z0-9]+)$/i)||[])[1]||'png').toLowerCase();
    const mime=ext==='png'?'image/png':(/^jpe?g$/.test(ext)?'image/jpeg':(ext==='webp'?'image/webp':'image/'+ext));
    const blob=new Blob([e.data],{type:mime}); const mid=uuid();
    try{ await PhotoDB.put({ id:mid, kind:'photo', mime, ext, size:blob.size, name:base, obs_uuid:'', created_at:nowISO(), blob });
      adds.push({ id:uuid(), species_name:name, kind:'photo', ref_id:mid, ext, mime, size:blob.size, source:'guide', created_at:nowISO() });
    }catch(err){}
    if(++done%20===0) toast(`取り込み中… ${done}/${imgs.length}`);
  }
  // 種ごとに最新1枚だけ残す（再取り込みで更新）
  let l=myguideList().concat(adds); const seen={}; const keep=[];
  for(let i=l.length-1;i>=0;i--){ const g=l[i];
    if(g.source==='guide'){ if(seen[g.species_name]) continue; seen[g.species_name]=1; }
    keep.unshift(g); }
  myguideSave(keep); scheduleFolderFull();
  const matched=adds.filter(a=>speciesByName(a.species_name)).length;
  toast(`図鑑ZIP：${adds.length}種を取り込みました（和名一致 ${matched}種）`); render();
}
