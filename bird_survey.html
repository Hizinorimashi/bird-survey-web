<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!-- ピンチ拡大可（屋外・老眼・手袋対応） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f0d">
<title>鳥類調査記録</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png"><!-- iOSはPNGのみ対応（SVG指定だと無視されスクリーンショットが使われる） -->
<link rel="stylesheet" href="./leaflet.css">
<style>
  :root{
    --bg:#0a0f0d; --panel:#12181a; --panel2:#1a2226; --line:#2a3438;
    --fg:#e8efe9; --muted:#8a9a93; --accent:#3fb984; --accent2:#2c8a63;
    --warn:#e0a030; --danger:#d05555; --chip:#233029;
    --radius:14px;
  }
  /* 屋外モード（明るい表示）。晴天の野外で暗色画面が反射で読めない対策。
     htmlのlightクラスで切替（html側に付けると最上位背景・引っ張り表示の帯まで明るくなる） */
  html.light{
    --bg:#eef1ef; --panel:#ffffff; --panel2:#dfe6e1; --line:#b9c6be;
    --fg:#17211b; --muted:#57685f; --accent:#1f7a52; --accent2:#276e50;
    --warn:#9a6b00; --danger:#b23c3c; --chip:#dbe5dd;
  }
  html.light .leaflet-container{background:#dfe3df;}
  html.light .act.recing{background:#f0dada; color:#8a2525;}
  html.light .btn.danger{border-color:#d0a0a0;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:16px; line-height:1.5; overscroll-behavior:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  h1,h2,h3{margin:0 0 .4em;}
  a{color:var(--accent);}
  /* 連打しても画面が拡大しないようにする。スマホは「素早く2回さわる」を拡大と
     受け取るので、「↶」を続けて押すと地図が拡大して困る（2026-08-13 実機で指摘） */
  button{font-family:inherit; font-size:16px; touch-action:manipulation;}
  .app{max-width:900px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* ヘッダー */
  header{position:sticky; top:0; z-index:500; background:var(--panel);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;}
  .hbar{display:flex; align-items:center; gap:10px;}
  .htitle{font-weight:700; font-size:18px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .back{background:none; border:none; color:var(--accent); font-size:17px; padding:10px 12px; cursor:pointer;}
  .hsub{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; font-size:13px; color:var(--muted);}
  .hsub .pill{background:var(--chip); border:1px solid var(--line); border-radius:20px; padding:2px 10px;}
  .pill.ok{color:var(--accent);} .pill.warn{color:var(--warn);} .pill.off{color:var(--muted);}

  main{flex:1; padding:14px; padding-bottom:90px;}

  /* カード・リスト */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
  .card.tap{cursor:pointer;} .card.tap:active{background:var(--panel2);}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1;}
  .muted{color:var(--muted);} .small{font-size:13px;} .tiny{font-size:12px;}
  .badge{display:inline-block; border-radius:20px; padding:2px 10px; font-size:12px; background:var(--chip); border:1px solid var(--line);}
  .badge.status-未開始{color:var(--muted);}
  .badge.status-調査中{color:var(--accent); border-color:var(--accent2);}
  .badge.status-終了{color:var(--muted);}
  .badge.warn{color:var(--warn);}
  .sp{height:8px;}

  /* ボタン */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:12px; padding:12px 16px; cursor:pointer; width:100%; text-align:center;}
  .btn:active{background:var(--panel);}
  .btn.primary{background:var(--accent2); border-color:var(--accent); color:#fff; font-weight:700;}
  .btn.ghost{background:none;}
  .btn.danger{color:var(--danger); border-color:#5a2e2e;}
  .btn.big{font-size:18px; padding:18px; font-weight:700;}
  .btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .btn-grid.one{grid-template-columns:1fr;}

  /* フォーム */
  label.field{display:block; margin-bottom:14px;}
  label.field > .lab{display:block; font-size:13px; color:var(--muted); margin-bottom:5px;}
  input,select,textarea{width:100%; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:16px;}
  textarea{min-height:70px; resize:vertical;}
  input:focus,select,textarea:focus{outline:none; border-color:var(--accent);}
  .req{color:var(--accent);}
  .seg{display:flex; flex-wrap:wrap; gap:8px;}
  .seg button{background:var(--panel2); border:1px solid var(--line); color:var(--muted);
    border-radius:22px; padding:11px 16px; cursor:pointer;}   /* 手袋・雨天でも押せる約44px */
  .seg button.on{background:var(--accent2); border-color:var(--accent); color:#fff;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* 大ボタン群（調査中） */
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .act{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 12px; text-align:center; cursor:pointer; font-size:17px; font-weight:700;
    /* button要素で使うため、ブラウザ既定の書体・文字色・幅を打ち消す */
    font-family:inherit; color:inherit; width:100%; display:block;}
  .act:active{background:var(--panel2);}
  .act .ic{font-size:26px; display:block; margin-bottom:6px;}
  .act.primary{background:var(--accent2); border-color:var(--accent); color:#fff;}
  .act.wide{grid-column:1 / -1;}
  .act.recing{border-color:var(--danger); background:#3a1d1d; color:#fff;}
  /* 小型ボタン（よく使う2つ以外）。約46pxで押しやすさは維持しつつ、一覧を上に見せる */
  .act.sm{padding:13px 8px; font-size:14px; font-weight:600;}   /* 約46px＝手袋でも押せる高さを維持 */
  .act.sm .ic{font-size:16px; display:inline; margin:0 4px 0 0;}

  /* 検索候補 */
  .suggest{border:1px solid var(--line); border-radius:10px; margin-top:6px; overflow:hidden; max-height:280px; overflow-y:auto;}
  .suggest .item{padding:11px 12px; border-bottom:1px solid var(--line); cursor:pointer;}
  .suggest .item:last-child{border-bottom:none;}
  .suggest .item:active{background:var(--panel2);}
  .suggest .item .fam{font-size:12px; color:var(--muted);}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .chips .c{background:var(--chip); border:1px solid var(--line); border-radius:16px; padding:5px 10px; font-size:13px;}
  .chips .c[onclick]{border-radius:20px; padding:10px 14px; font-size:15px; cursor:pointer;}   /* タップできるチップだけ大きく */
  /* いま選んでいるもの（P1/P2 のタブ、根拠の観察）。どれを入力中か分かるように塗りつぶす */
  .chips .c.on{background:var(--accent); color:#0a0f0d; border-color:var(--accent); font-weight:700;
    box-shadow:0 0 0 3px rgba(63,185,132,.35);}

  /* 地図 */
  #map{height:calc(100vh - 220px); min-height:320px; border-radius:var(--radius); border:1px solid var(--line);}
  .leaflet-container{background:#0d1412;}
  .locate-btn{width:42px; height:42px; font-size:20px; line-height:1;
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:10px; cursor:pointer; box-shadow:0 1px 5px rgba(0,0,0,.4);}
  .locate-btn:active{background:var(--panel2);}
  /* 位置指定マップの中心十字（指で目標が隠れないよう、地図の方を動かして狙う）。
     形は細い黒線のSVG（白フチ付き。航空写真の暗い場所でも見える） */
  .map-cross{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:800;
    pointer-events:none; line-height:0;}
  .map-drop-btn{width:auto; padding:9px 14px; font-size:14px; font-weight:700;
    background:var(--accent); color:#0a0f0d; border:none; border-radius:10px;
    cursor:pointer; box-shadow:0 1px 5px rgba(0,0,0,.4);}
  .map-drop-btn:active{opacity:.85;}
  @media (max-width:420px){ .map-drop-btn{margin-bottom:22px;} }   /* 狭い画面で右下の出典表示と重ならないよう一段上げる */
  /* 地図を画面いっぱいに広げるボタン（右下）。目立ちすぎないよう地の色で、押せることは枠で示す */
  .map-full-btn{width:auto; padding:8px 11px; font-size:13px; font-weight:700; white-space:nowrap;
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:10px; cursor:pointer; box-shadow:0 1px 5px rgba(0,0,0,.4);}
  .map-full-btn:active{background:var(--panel2);}
  /* 全画面のときだけ出る「↶ 1つ戻す」。地図の上でも読めるよう、はっきりした色にする */
  .map-undo-btn{width:auto; padding:8px 12px; font-size:13px; font-weight:700; white-space:nowrap;
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:10px; cursor:pointer; box-shadow:0 1px 5px rgba(0,0,0,.4);}
  .map-undo-btn:active{background:var(--panel2);}
  /* 鳴き声AI: どの画面でも出る小さな浮きボタンと、押したときだけ開く「新しく聞こえた鳥」（#main の外）。
     聞こえた鳥を画面に積まない（入力の邪魔になるため。2026-11-08 ユーザー） */
  .aifab{position:fixed; left:8px; bottom:calc(88px + env(safe-area-inset-bottom, 0px)); z-index:1200; display:flex; gap:5px; align-items:center; max-width:calc(100vw - 16px);}
  .aifab button{border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:999px; padding:6px 11px;
    font-size:13px; font-weight:700; min-height:38px; box-shadow:0 2px 8px rgba(0,0,0,.35); cursor:pointer; opacity:.94;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .aifab .aifab-main{max-width:min(260px, 62vw);}
  .aifab.on .aifab-main{border-color:var(--accent);}
  .aifab.has .aifab-main{border-color:var(--accent); background:var(--panel2);}
  .aifab .aifab-new{color:var(--accent); margin-left:4px;}
  .aifab.warn .aifab-main{background:var(--warn); color:#0a0f0d;}
  .aifab .aifab-stop{padding:6px 10px;}
  .aifab .aifab-res{background:var(--accent); color:#0a0f0d;}
  #aiPops{position:fixed; left:8px; bottom:calc(134px + env(safe-area-inset-bottom, 0px)); z-index:1210; width:min(320px, 86vw);
    max-height:min(52vh, 420px); overflow-y:auto; background:var(--panel); border:1px solid var(--accent); border-radius:12px;
    padding:6px 8px; box-shadow:0 4px 16px rgba(0,0,0,.45);}
  .aipop-hd{display:flex; justify-content:space-between; align-items:center; padding:2px 2px 6px; font-size:13px;}
  .aipop-hd button,.aipop-ft button{border:1px solid var(--line); background:var(--panel2); color:var(--fg); border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer;}
  .aipop{display:flex; justify-content:space-between; align-items:center; gap:6px; padding:5px 2px; border-top:1px solid var(--line); font-size:13px;}
  .aipop-h{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .aipop-b{display:flex; gap:5px; flex:none;}
  .aipop-b button{min-width:38px; min-height:36px; border:1px solid var(--line); background:var(--panel2); color:var(--fg); border-radius:8px; font-weight:700; cursor:pointer;}
  .aipop-b button:disabled{opacity:.5; font-size:11px;}
  body.tab-obs.tab-left:not(.tab-collapsed) .aifab, body.tab-obs.tab-left:not(.tab-collapsed) #aiPops{left:auto; right:8px;}
  .pf-pan-row{display:flex; gap:6px; align-items:center;}
  /* 編集タブの記録の一覧・保存済みの記録の印（v233） */
  .obs-pick-box{max-height:46vh; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:6px; margin-bottom:8px; background:var(--panel2);}
  .obs-pick{display:block; width:100%; text-align:left; padding:10px; margin:3px 0; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--fg); cursor:pointer; min-height:44px;}
  .obs-pick.on{border-color:var(--accent);}
  .sv-mark-wrap{background:none; border:none;}
  .sv-ic{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%; font-size:9px; font-weight:800; color:#fff; border:1px solid #fff; flex:none;}
  .sv-P{background:#4a7fd0;} .sv-N{background:#8a5a2b;} .sv-L{background:#c08a20;}
  .cur-lab{background:rgba(255,236,170,.92) !important;}
  /* ポイント（鳥の記録） */
  body:not(.tab-obs) #obsPosMap .pf-btn{width:36px; height:36px; font-size:15px;}   /* スマホの小さな地図では4つ並べて「＋」に重ねない */
  body:not(.tab-obs) #obsPosMap .leaflet-top.leaflet-left > .leaflet-control > div[style*="flex-direction:column"]{gap:5px !important;}
  .pf-pt{font-size:14px !important;}
  #ptBox{position:fixed; left:50%; transform:translateX(-50%); top:calc(64px + env(safe-area-inset-top, 0px)); z-index:1220;
    width:min(360px, 92vw); background:var(--panel); border:1px solid #e8b04b; border-radius:12px; padding:10px; box-shadow:0 6px 20px rgba(0,0,0,.5);}
  #ptBox .pt-h{font-weight:700; font-size:14px; margin-bottom:6px;}
  #ptBox .pt-row{display:flex; gap:6px; align-items:center; margin-top:6px;}
  #ptBox #ptSp{flex:1; min-width:0;}
  #ptBox #ptCnt{width:70px; flex:none;}
  #ptBox .btn{flex:1; min-height:44px;}
  .pt-mark{display:flex; align-items:center; gap:3px; white-space:nowrap;}
  .pt-dot{width:10px; height:10px; border-radius:50%; background:#e8b04b; border:2px solid #fff; flex:none;}
  .pt-lab{font-size:11px; font-weight:700; color:#111; background:rgba(255,255,255,.85); border-radius:4px; padding:0 3px;}
  body.tab-obs .pf-pan-row{flex-direction:column; align-items:flex-end;}   /* タブレットでは縦に並べる（v232） */
  body.tab-obs.tab-phone .pf-pan-row{flex-direction:row; align-items:center;}   /* スマホは右下に横並び（v237） */
  .pf-pan-row > .leaflet-control, .pf-pan-row > button{margin:0 !important; float:none !important;}
  .aipop-ft{display:flex; gap:6px; justify-content:flex-end; padding-top:6px; border-top:1px solid var(--line);}
  /* タブレットの観察入力（地図いっぱい）以外では、見出しの右端に置く（スマホで入力欄にかからないように） */
  body:not(.tab-obs) .aifab{top:calc(8px + env(safe-area-inset-top, 0px)); bottom:auto; left:auto; right:8px;}
  body:not(.tab-obs) .aifab .aifab-main{max-width:min(240px, 40vw);}
  body:not(.tab-obs) #aiPops{top:calc(56px + env(safe-area-inset-top, 0px)); bottom:auto; left:auto; right:8px;}
  .aidet.marked{border-color:var(--accent);}
  /* 地図の P / F。いまどちらで落とすのかが一目で分かるよう、選んでいる方を塗りつぶす */
  .pf-btn{font-weight:800; font-size:17px;}
  .pf-btn.on{background:var(--accent); color:#0a0f0d; border-color:var(--accent); box-shadow:0 0 0 3px rgba(63,185,132,.35);}
  /* 全画面中は、iPhoneのノッチ・ホームバーの上に操作ボタンが隠れないよう内側に寄せる。
     横向きではノッチが左右に来る（「小さく」ボタンが押せなくなる＝戻れなくなる）ので四方向とも避ける */
  .map-full .leaflet-top{margin-top:env(safe-area-inset-top, 0px);}
  .map-full .leaflet-left{left:env(safe-area-inset-left, 0px);}
  .map-full .leaflet-right{right:env(safe-area-inset-right, 0px);}
  /* 全画面中の背面ページの固定。直接 body.style を書き換えると、その間に別処理が変えた指定を消してしまう */
  body.map-full-lock{overflow:hidden;}
  /* 全画面のときに地図の中へ引っ越してくる入力の欄（種名・形・種類・高度・行動・くるくる）。
     大きくしたまま入力したい、という現場の要望（2026-08-13）。
     高さは中身なり。画面の半分までにして、地図が見えなくならないようにする */
  .map-full-tools{position:absolute; left:0; right:0; bottom:0; z-index:1200;
    background:rgba(16,18,22,.94); border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    /* 地図が見えなくならないよう、画面の45%まで。あふれる分は中で送る */
    max-height:45%; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .map-full-tools .fold{margin:0 0 6px;}
  /* 「小さく」は**いつでも押せる**ように、欄より手前に出す。
     欄に埋もれて全画面から戻れなくなった（2026-08-13 実機で指摘） */
  .map-full .map-full-btn{position:relative; z-index:1300;}
  /* 地図の下端のボタン（「＋」「大きく」）が欄に隠れないよう持ち上げる */
  .map-full .leaflet-bottom{margin-bottom:calc(env(safe-area-inset-bottom, 0px) + var(--tools-h, 0px));}
  .north-needle{display:inline-block; line-height:1.05; font-size:13px; font-weight:700; transition:transform .15s;}

  /* ---------- タブレット表示（2026-11 試験版。設定で手動オン） ----------
     観察記録の地図だけを画面いっぱいの層 #tabMapLayer へ移し、入力欄を含む画面の中身（.app）は
     その場に置いたまま、地図の上に浮かぶ小窓として見せる。**入力欄は1つも動かさない**
     （保存・個体の退避・変更の見張りは #obForm の中を読むため。計画レビュー M1）。
     重なり順: 地図の層 1000 ／ 小窓 1100 ／ 小窓の帯 1101 ／ 音声ドック 1150（地図に隠さない）／
     写真拡大 1500・通知 2000・保存中の操作禁止 99997 は既存のまま手前 */
  #tabMapLayer{position:fixed; inset:0; z-index:1000; background:var(--bg);}
  #tabMapLayer > #obsPosMap{width:100%; height:100% !important; border-radius:0 !important; border:0 !important;}
  body.tab-obs{overflow:hidden;}
  body.tab-obs .app{position:fixed; top:calc(8px + env(safe-area-inset-top, 0px)); bottom:calc(8px + env(safe-area-inset-bottom, 0px)); right:calc(8px + env(safe-area-inset-right, 0px)); left:auto; margin:0;
    width:min(340px, 36vw); max-width:none; overflow-y:auto; -webkit-overflow-scrolling:touch;
    z-index:1100; background:var(--bg); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.45); padding-top:52px; box-sizing:border-box;}
  body.tab-obs.tab-left .app{right:auto; left:calc(8px + env(safe-area-inset-left, 0px));}
  /* 入力の小窓は小さめに（2026-11-07 実機:「入力フォームがデカすぎて地図が見づらい」） */
  body.tab-obs .app{font-size:14px;}
  body.tab-obs .app .field{margin-bottom:8px;}
  body.tab-obs .app details.fold summary{padding:8px 10px;}
  body.tab-obs .app .card{padding:8px;}
  /* 共通の min-height:100vh を引き継ぐと、上下8pxの指定より高くなって下端が画面の外へはみ出し、
     下に貼り付く「保存して次の個体へ」が見えなくなる（2026-11-07 実機） */
  body.tab-obs .app{min-height:0;}
  /* 地図の長押しで線・点を選ぶので、iPad の長押しメニュー・文字選択・拡大鏡を出さない */
  #obsPosMap{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
  body.tab-obs.tab-collapsed .app{display:none;}
  /* 小窓が開いている側の地図のボタン（P/L/N・ズーム・↶・描く）を小窓の外へずらす（小窓で隠さない） */

<script>
/* ============================================================
   鳥類調査員育成用フィールド記録アプリ — Web/PWA 試作版 v1
   保存: localStorage(JSON) + IndexedDB(録音音声) / 地図: Leaflet + 地理院タイル
   ※ 軌跡記録(GPSトラック)は次版で追加予定
   ============================================================ */

/* ---------- バージョン（更新されたか目視で確認するための表示） ---------- */
const APP_VERSION = 'v244（2026-11-09 「鳥」ボタンで範囲を囲む・確認方法の欄）';

/* ---------- ユーティリティ ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const uuid = ()=> (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
      const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16);}));
const nowISO = ()=> new Date().toISOString();
function localDatetimeValue(d=new Date()){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dateValue(d=new Date()){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
const DATE_ONLY_RE = /^\d{4}-\d{2}-\d{2}$/;   // 日付だけの項目（survey_date・verified_at 等）
// 時差の付かない日時。飛翔経路は datetime-local の値をそのまま保存しているためこの形になる
const NAIVE_DT_RE = /^\d{4}-\d{2}-\d{2}[Tt ]\d{2}:\d{2}(:\d{2}(\.\d+)?)?$/;
// 時差またはZの付いた日時。観察日時は toISOString() でこの形になる
const ZONED_DT_RE = /^\d{4}-\d{2}-\d{2}[Tt ]\d{2}:\d{2}(:\d{2}(\.\d+)?)?(Z|[+-]\d{2}:?\d{2})$/;
// 業務日時（観察日時・飛翔の開始終了・検証日など）として許す形。空・日付のみ・時差なし日時・時差付き日時の4種類。
// 取込や同期でこれ以外が入ると isoLocal() が変換せず素通しし、書き出しに壊れた値がそのまま出るため入口で弾く。
// 形が合っていても存在しない日時（2026-99-99 / 25:99 / +99:99 など）は Date.parse で弾く。
// ただし Date.parse は 2026-02-30 を 3/2 に繰り上げて受け入れてしまうので、暦日は別に検査する。
function validCalendarDate(s){
  const y=+s.slice(0,4), m=+s.slice(5,7), d=+s.slice(8,10);
  const t=new Date(Date.UTC(y,m-1,d));
  if(y>=0 && y<=99) t.setUTCFullYear(y);   // Date.UTCは0〜99年を1900年代とみなすため戻す
  return t.getUTCFullYear()===y && t.getUTCMonth()===m-1 && t.getUTCDate()===d; }
function okStamp(v){ if(v==null || v==='') return true;
  if(typeof v!=='string') return false;
  if(!DATE_ONLY_RE.test(v) && !NAIVE_DT_RE.test(v) && !ZONED_DT_RE.test(v)) return false;
  if(!validCalendarDate(v)) return false;
  return !isNaN(Date.parse(v.replace(' ','T'))); }
// 管理用日時（created_at / updated_at / deleted_at）。省略は許すが空文字は許さない。
// 壊れた値は文字列比較で常に最新扱いになり、以後どの正しい更新にも勝ち続けて同期を恒久的に壊すため必ず弾く。
function okTime(v){ return v==null || (typeof v==='string' && v!=='' && okStamp(v)); }
// UUID・メディアIDは空文字を許さない。取込側の safeId は空を通すため、
// 空IDのまま取り込めてしまうと同期側（非空を要求）が拒否し続ける状態を作れる
function okUuid(v){ return typeof v==='string' && /^[\w-]+$/.test(v); }
const okStrOpt=v=>v==null || typeof v==='string';
// 記録に付く録音・写真の参照。取込・同期の両方がこれ1つを使う。
// 片方だけ緩いと「取り込めるのに同期は拒否し続ける」データを作れてしまうため、条件を分けない。
function okMediaList(a){ return a==null || (Array.isArray(a) && a.every(m=>
  m && typeof m==='object' && !Array.isArray(m) && okUuid(m.id)
  && okStrOpt(m.ext) && okStrOpt(m.mime) && okStrOpt(m.kind) && okStrOpt(m.name))); }
// 削除記録の1件。at は省略・空を許さない（欠けると文字列比較で「最新」と判定され生きた記録が消える）
function okTombstone(t){ return !!t && typeof t==='object' && !Array.isArray(t)
  && okUuid(t.uuid) && typeof t.at==='string' && t.at!=='' && okStamp(t.at); }
// 1レコードの不正箇所を列挙する（点検・修復用）。name は種別（業務日時の項目を引くため）。
// okRecord（取込・同期の合否）はこの結果が空かどうかで決める。判定を2か所に持つと
// 「点検では正常なのに同期は拒否する」ずれが生じるため、必ずこの関数を唯一の正とする。
const REF_ID_FIELDS = ['id','survey_uuid','hypothesis_uuid','ref_id','individual_key','nest_id'];
function recordIssues(name, x){
  if(!x || typeof x!=='object' || Array.isArray(x)) return ['record'];
  const bad=[];
  if(!okUuid(x.uuid)) bad.push('uuid');
  for(const f of REF_ID_FIELDS){ if(!safeId(x[f])) bad.push(f); }
  for(const f of ['created_at','updated_at','deleted_at']){ if(!okTime(x[f])) bad.push(f); }
  for(const f of (STAMP_FIELDS[name]||[])){ if(!okStamp(x[f])) bad.push(f); }
  if(!okMediaList(x.audio)) bad.push('audio');
  if(!okMediaList(x.media)) bad.push('media');
  // 環境・営巣木の写真も同じ形で検査する。見ないと、壊れた中身が
  // そのまま入り、画面や同期が止まる（2026-08-14 監査2巡目 Major）
  if(name==='observations'){
    if(!okMediaList(x.env_media)) bad.push('env_media');
    if(!okMediaList(x.nest_media)) bad.push('nest_media');
  }
  // 座標の対（観察者・鳥がいた場所・巣）。片方だけ・範囲外は、地図・書き出しで黙って落ちる値なので
  // 取込・同期では拒否し、起動点検では修復対象として見えるようにする
  if(name==='observations'){
    for(const pr of [['latitude','longitude'],['target_latitude','target_longitude'],['nest_latitude','nest_longitude']]){
      const a=(x[pr[0]]==null)?'':String(x[pr[0]]), b=(x[pr[1]]==null)?'':String(x[pr[1]]);
      if(a==='' && b==='') continue;
      if(!validLatLon(a,b)) bad.push(pr[0]);
    }
  }
  // 修復メモ（点検・修復機能が元の値を控える欄）。細工バックアップで巨大な文字列を
  // 持ち込まれて保存領域やメモリを圧迫されないよう、正式な検査項目として上限を課す
  if(!(x.repair_note==null || (typeof x.repair_note==='string' && x.repair_note.length<=REPAIR_NOTE_MAX))) bad.push('repair_note');
  // 1記録の大きさの上限。検査対象外の項目（メモ・種名など将来の項目も含めて許容している）に
  // 巨大な文字列を仕込んだ細工データが、検査を素通りして保存領域を食い潰すのを防ぐ。
  // 上限は正当な最大級の記録（長時間の飛翔経路のGPS点列など）より十分大きく取る
  try{ if(JSON.stringify(x).length>REC_JSON_MAX) bad.push('size'); }catch(e){ bad.push('size'); }
  return bad;
}
const REPAIR_NOTE_MAX = 500;       // 修復メモの上限文字数（取込・同期・点検で共通）
const REC_JSON_MAX = 4000000;      // 1記録のJSON上限文字数（約4百万字＝保存領域全体の大半。正当な記録はまず届かない）
// 手動取込の上限は「細工・破損データを弾く」ためのもので、端末のメモリ保護のためではない。
// 監査（2026-08-01 4巡目）でより小さい上限が提案されたが、動画入りのフルバックアップは正当に
// 数百MBになり得て、上限を下げると機種変時の復元が失敗する。取込は利用者自身のバックアップを
// 選ぶ操作（信頼済み）であり、復元を壊さないことを優先してこの値を維持する（設計判断）
const IMPORT_FILE_MAX = 1073741824;   // 手動取込ファイルの上限（1GB）
const MEDIA_B64_MAX = 400000000;      // メディア1件のbase64上限文字数（実体約300MB。これを超える1件は細工か破損とみなす）
// 1レコードの共通検査（取込・同期で同じものを使う）
function okRecord(name, x){ return recordIssues(name, x).length===0; }
// マイ図鑑の1件（ID＋管理用日時。両側で同じ条件にする）
function okGuideItem(g){ return g==null || (g && typeof g==='object' && !Array.isArray(g)
  && safeId(g.id) && safeId(g.ref_id)
  && okTime(g.created_at) && okTime(g.updated_at) && okTime(g.deleted_at)); }
// レコード種別ごとの業務日時項目（created_at 等の管理用日時は別途 okTime で検査）
const STAMP_FIELDS = {
  surveys:      ['survey_date','start_datetime','end_datetime'],
  observations: ['observed_at'],
  notes:        ['recorded_at'],
  hypotheses:   [],
  hyp_results:  ['verified_at'],
  flights:      ['start_time','end_time'],
};
// 日付表示。日付だけの項目はそのまま、日時はローカル時刻に直してから日付を取る。
// UTCのまま切り出すと、夜明け前後の記録が前日として表示されてしまうため。
// 日時と判別できない文字列は日付に変換しない（別物を日付として見せないため）。
function fmtDate(s){ if(!s) return '—'; s=String(s);
  if(DATE_ONLY_RE.test(s)) return s;
  if(!NAIVE_DT_RE.test(s) && !ZONED_DT_RE.test(s)) return s.slice(0,10);
  const d=new Date(s.replace(' ','T')); return isNaN(d) ? s.slice(0,10) : dateValue(d); }
// 書き出し用の日時。調査地は日本国内を前提とし、書き出す端末の地域設定に関わらず
// 日本標準時（+09:00）で固定して出す。端末依存にすると、同じ記録を別地域の端末から
// 書き出したときに日時が変わってしまうため（例 2026-08-01T05:00:00.000+09:00）。
// 日付だけの項目はそのまま返す（日時に化けさせない）。
const EXPORT_TZ_MIN = 9*60;   // 日本標準時。海外調査に使うなら記録時の時差を保存する設計が必要
function isoLocal(s){ if(!s) return ''; s=String(s);
  if(DATE_ONLY_RE.test(s)) return s;
  let v=s.replace(' ','T');
  // 時差なしの日時（飛翔経路）は国内での記録とみなす。端末ローカルとして読むと書き出す端末で値が変わる
  if(NAIVE_DT_RE.test(s)) v+='+09:00';
  else if(!ZONED_DT_RE.test(s)) return s;   // 日時と判別できないものはそのまま返す
  const d=new Date(v); if(isNaN(d)) return s;
  const t=new Date(d.getTime()+EXPORT_TZ_MIN*60000);   // getUTC* で読むとJSTの値になる
  const p=n=>String(n).padStart(2,'0');
  return `${t.getUTCFullYear()}-${p(t.getUTCMonth()+1)}-${p(t.getUTCDate())}`
    +`T${p(t.getUTCHours())}:${p(t.getUTCMinutes())}:${p(t.getUTCSeconds())}`
    +`.${String(t.getUTCMilliseconds()).padStart(3,'0')}+09:00`; }
// 一覧の並べ替えに使う時刻のものさし。観察は世界標準時（nowISO）、飛翔経路は時差なしの
// 文字列で保存されているため、生の文字列で比べると最大9時間ずれる（集計と同じ直し方）。
// 日付だけ・暦にない日時は「時刻なし」として並びの末尾へ落とす
function obsAtKey(t){
  const v=String(t==null?'':t);
  if(!v || DATE_ONLY_RE.test(v) || !okStamp(v)) return '';
  return isoLocal(v)||'';
}
function fmtTime(s){ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return '—';
  const p=n=>String(n).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,ms){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms||1800); }

/* ---------- データ層（localStorage） ---------- */
const DB = {
  key:{sv:'bs_surveys', ob:'bs_observations', nt:'bs_notes', hy:'bs_hypotheses', hr:'bs_hyp_results', fl:'bs_flights', recent:'bs_recent_species', fav:'bs_fav_species'},
  load(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } },
  // 読取・JSON解析に失敗したら例外を投げる（「本当に空」と「読めない」を区別する版）。
  // GCやバックアップなど、空を鵜呑みにするとデータ喪失につながる処理はこちらを使う。
  loadRaw(k){ const s=localStorage.getItem(k); if(s==null||s==='') return []; return JSON.parse(s); },
  // **書き込みのために読むときは、必ずこちら。** 読めなければ null を返し、
  // 呼び出し側は何も書かずに中止する。寛容版(load)は「壊れている」も「空」も
  // 同じ [] を返すので、その戻り値を保存すると残っていた記録を全部消してしまう
  // （2026-08-28 全体監査 Critical。同じ形が保存・まとめて記録・取り込み・墓標に4か所）
  loadForWrite(k){
    let a; try{ a=this.loadRaw(k); }catch(e){ a=undefined;
      try{ console.error('loadForWrite parse failed', k, e); }catch(_){} }

    return a; },
  // 保存に失敗（多くは端末の空き容量不足）したら黙って失わせず、必ず警告する。成功時のみtrue。
  save(k,v){
    if(!writeAllowed()) return false;
    try{ localStorage.setItem(k, JSON.stringify(v)); }
    catch(e){ try{ toast('⚠ 空き容量不足で保存できませんでした。写真・動画を整理するかバックアップ後に空けてください'); }catch(_){}
      try{ console.error('localStorage save failed', e); }catch(_){}
      return false; }
    if(typeof scheduleCloud==='function') scheduleCloud(); return true; },   // 門は scheduleCloud 側で判定（遮断中は保留）
  surveys(){ return this.load(this.key.sv).filter(s=>!s.deleted_at); },
  allSurveys(){ return this.load(this.key.sv); },
  observations(){ return this.load(this.key.ob).filter(o=>!o.deleted_at); },
  notes(){ return this.load(this.key.nt).filter(n=>!n.deleted_at); },
  hypotheses(){ return this.load(this.key.hy).filter(h=>!h.deleted_at); },
  hypResults(){ return this.load(this.key.hr).filter(r=>!r.deleted_at); },
  obsOf(svUuid){ return this.observations().filter(o=>o.survey_uuid===svUuid); },
  notesOf(svUuid){ return this.notes().filter(n=>n.survey_uuid===svUuid); },
  hypOf(svUuid){ return this.hypotheses().filter(h=>h.survey_uuid===svUuid); },
  flights(){ return this.load(this.key.fl).filter(f=>!f.deleted_at); },
  flightsOf(svUuid){ return this.flights().filter(f=>f.survey_uuid===svUuid); },
  flight(u){ return this.load(this.key.fl).find(f=>f.uuid===u); },
  upsertFlight(rec){ const a=this.loadForWrite(this.key.fl); if(!a) return false;
    const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.fl,a); },
  hypothesis(u){ return this.load(this.key.hy).find(h=>h.uuid===u); },
  resultsOf(hyUuid){ return this.hypResults().filter(r=>r.hypothesis_uuid===hyUuid); },
  survey(u){ return this.allSurveys().find(s=>s.uuid===u); },
  upsertSurvey(rec){ const a=this.loadForWrite(this.key.sv); if(!a) return false;
    const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.sv,a); },
  upsertObs(rec){ const a=this.loadForWrite(this.key.ob); if(!a) return false;
    const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.ob,a); },
  upsertNote(rec){ const a=this.loadForWrite(this.key.nt); if(!a) return false;
    const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.nt,a); },
  upsertHyp(rec){ const a=this.loadForWrite(this.key.hy); if(!a) return false;
    const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.hy,a); },
  upsertHypResult(rec){ const a=this.loadForWrite(this.key.hr); if(!a) return false;
    const i=a.findIndex(x=>x.uuid===rec.uuid);
    rec.updated_at=nowISO(); if(i<0){ rec.created_at=nowISO(); a.push(rec);} else a[i]=rec; return this.save(this.key.hr,a); },
  // updated_at も更新する（端末間同期は updated_at の新しい方を残すため、これが無いと削除・復元が他端末に伝わらない）。
  // 保存の成否を返す（容量不足で削除できていないのに「削除しました」と表示しないため）
  softDelete(k,u){ const a=this.loadForWrite(k); if(!a) return false;
    const i=a.findIndex(x=>x.uuid===u);
    if(i>=0){ a[i].deleted_at=nowISO(); a[i].updated_at=nowISO(); return this.save(k,a); } return false; },
  restore(k,u){ const a=this.loadForWrite(k); if(!a) return false;
    const i=a.findIndex(x=>x.uuid===u);
    if(i>=0){ delete a[i].deleted_at; a[i].updated_at=nowISO(); return this.save(k,a); } return false; },
  // 完全削除は「削除記録（墓標）」を残す。端末間同期で他端末にも完全削除を伝え、古いデータからの復活を防ぐため。
  // 墓標が保存できなければ本体も消さず、本体が消せなければ墓標も戻す（片方だけの中途半端な状態を残さない）。
  // 原本の読み取りは厳格版（読めない状態で寛容版の[]を保存すると、全記録を空で上書きしてしまうため）
  hardDelete(k,u){
    // **消す前の墓標を丸ごと控える。** 1件だけ取り消すやり方だと、
    // もともと在った墓標まで消してしまう（監査1巡目 Critical）
    const 元墓標=tombstonesForWrite();
    if(!元墓標) return false;   // 読めない断りは brokenDataWarn が出している
    if(!tombstoneAdd(u)){ try{ toast('空き容量不足のため完全削除できませんでした'); }catch(e){} return false; }
    const a=this.loadForWrite(k); if(!a){ this._墓標を戻す(元墓標); return false; }
    if(!this.save(k, a.filter(x=>x.uuid!==u))){ this._墓標を戻す(元墓標); return false; }
    return true; },
  // **丸ごと戻す**（完全削除に失敗したときの巻き戻し）。1件だけ外すのは tombstoneRemove。
  // 用途を混ぜると、UUIDを渡された側が配列の検査に落ちて何も外せなくなる（監査4巡目 Critical）
  _墓標を戻す(元墓標){ if(tombstonesSave(元墓標)) return true;
    // **戻せないときは止める。** 消していない本体に削除記録だけが付いた状態で
    // 操作を続けると、次の同期でその本体が消える（監査9巡目 Critical）
    try{ saveFatalHalt('削除記録の取り消しに失敗しました。これ以上操作せず、'
      +'設定の「記録の救出ファイル」を保存してください'); }
    catch(e){ try{ toast('⚠ 削除記録の取り消しに失敗しました。これ以上操作せず、設定の「記録の救出ファイル」を保存してください', 10000); }catch(_){} }
    return false; },
  deleted(k){ return this.load(k).filter(x=>x.deleted_at); },
  recentSpecies(){ return this.load(this.key.recent); },
  pushRecent(name){ if(!name) return; const cur=this.loadForWrite(this.key.recent);
    if(!cur) return;   // 読めないときは触らない（最近の種名のために全体を壊さない）
    let a=cur.filter(x=>x!==name);
    a.unshift(name); a=a.slice(0,12); this.save(this.key.recent,a); },
};

/* ---------- 完全削除の記録（墓標） ----------
   ごみ箱から完全削除したuuidを残し、同期時に他端末へも削除を伝える。
   期限は設けない（使われなくなった端末の古い同期ファイルがドライブに残っている限り、
   墓標が失効すると削除済み記録が復活しうるため）。1件あたり数十バイトなので残し続けて実害はない */
function tombstonesList(){ try{
  return (JSON.parse(localStorage.getItem('bs_tombstones')||'[]')||[])
    .filter(t=>t&&typeof t.uuid==='string'&&t.uuid&&typeof t.at==='string'&&t.at);
}catch(e){ return []; } }
// 使用権の確認（複数タブの検査）が済むまでは、どの経路からも記録を書き込まない。
// 画面の無効化だけに頼ると、確認中や対応していないブラウザで別のタブと同時に書けてしまう。
// 記録に関わる書き込みは必ずこの門を通す（DB.save・墓標・マイ図鑑・図鑑資料・メディア保存）。
// 端末ごとの好み（テーマ・地図の表示設定・下書き）は記録ではないので対象外
// 「読めない」ときの言い方は1か所に。何が起きたか・何をすればよいかまで言う
function brokenDataWarn(k){
  try{ toast('⚠ 保存されている記録を読み取れないため、書き込みを中止しました。'
    +'上書きを避けるためです。設定の「記録の救出ファイル」を保存してからご相談ください', 8000);
  }catch(_){}
  try{ console.error('broken storage', k); }catch(_){}
}
function writeAllowed(){
  // 回復不能の停止中は最優先で拒否する（復旧の内部権限だけは通す）
  if(typeof SAVE_FATAL!=='undefined' && SAVE_FATAL && !window.RECOVERY_OK){
    try{ toast('保存の後片付けに失敗しています。ページを再読み込みしてください', 6000); }catch(_){}
    return false;
  }
  if(window.WRITE_OK || window.RECOVERY_OK) return true;   // RECOVERY_OK=起動時復旧の内部専用権限
  try{
    toast(window.READ_ONLY
      ? 'このブラウザ／開き方では閲覧のみできます（保存はできません）'
      : '起動時の確認が終わるまで保存できません。数秒待ってからやり直してください', 5000);
  }catch(_){}
  return false;
}
// 墓標も、書き足す前は厳しく読む。読めないまま1件だけ書くと、
// それまでの完全削除がすべて無かったことになり、消した記録が同期で復活する
function tombstonesForWrite(){
  let a; try{ a=JSON.parse(localStorage.getItem('bs_tombstones')||'[]'); }
  catch(e){ a=undefined; }
  if(!Array.isArray(a)){ brokenDataWarn('bs_tombstones'); return null; }
  // **おかしな1件を捨てて詰めない。** 捨てて保存すると、直せたはずの削除記録が消え、
  // 完全削除したはずの記録が同期で復活する（監査1巡目 Critical）。
  // 検査は**取り込み・同期と同じ okTombstone** を使う。ここだけ緩いと、
  // at:'zzzz' のような日時が通り、比べ算で「いちばん新しい削除」と見なされて
  // 生きている記録が消える（監査2巡目 Critical）
  if(!a.every(okTombstone)){ brokenDataWarn('bs_tombstones'); return null; }
  return a;
}
function tombstonesSave(a){ if(!writeAllowed()) return false;
  // 書き込みの入口でも確かめる（呼び出し側の作り方に関わらず塞ぐ）
  if(!Array.isArray(a) || !a.every(okTombstone)){ brokenDataWarn('bs_tombstones'); return false; }
  try{ localStorage.setItem('bs_tombstones', JSON.stringify(a)); return true; }catch(e){ return false; } }
// 保存の成否を返す。falseのときは呼び出し側が完全削除を中止する（墓標なしで消すと他端末から復活してしまうため）
function tombstoneAdd(uuid){ if(!uuid) return false; const a=tombstonesForWrite();
  if(!a) return false;
  // すでに墓標があるときは**時刻を今にする**。古いままだと、削除後に作り直された
  // 記録をもう一度消しても、同期先から復活してしまう（監査1巡目 Critical）
  // **足す1件も同じ検査を通す。** 通らないものを書くと、以後この端末では
  // 墓標が丸ごと「読めない」判定になり、完全削除・同期・取り込みが止まる（監査3巡目 Critical）
  const 新しい={uuid, at:nowISO()};
  if(!okTombstone(新しい)){ brokenDataWarn('bs_tombstones'); return false; }
  const i=a.findIndex(t=>t.uuid===uuid);
  if(i>=0) a[i]=新しい; else a.push(新しい);
  return tombstonesSave(a); }
// 完全削除の巻き戻し用（本体の削除保存に失敗したとき、墓標だけ残さない）。成否を返す
function tombstoneRemove(uuid){ const a=tombstonesForWrite();
  if(!a) return false;
  return tombstonesSave(a.filter(t=>t.uuid!==uuid)); }

/* ---------- 録音・写真・動画の保存（IndexedDB：サイズが大きいためlocalStorageと分離） ---------- */
/* ストア 'audio' = 録音 / 'media' = 写真・動画 */
let _mediaDbPromise=null;
function openMediaDB(){
  if(_mediaDbPromise) return _mediaDbPromise;
  // open失敗時は拒否Promiseをキャッシュに残さず、次回呼び出しでやり直せるようにする（一過性の失敗から回復するため）
  const fail=(err,rej)=>{ _mediaDbPromise=null; rej(err); };
  _mediaDbPromise=new Promise((res,rej)=>{
    if(!window.indexedDB){ fail(new Error('no-indexeddb'),rej); return; }
    let r; try{ r=indexedDB.open('bird_survey_audio',5); }catch(e){ fail(e,rej); return; }
    r.onupgradeneeded=()=>{ const db=r.result;
      if(!db.objectStoreNames.contains('audio')) db.createObjectStore('audio',{keyPath:'id'});
      if(!db.objectStoreNames.contains('media')) db.createObjectStore('media',{keyPath:'id'});
      if(!db.objectStoreNames.contains('refdoc')) db.createObjectStore('refdoc',{keyPath:'id'});
      if(!db.objectStoreNames.contains('call')) db.createObjectStore('call',{keyPath:'jp'});
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv',{keyPath:'key'}); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>fail(r.error,rej);
    r.onblocked=()=>fail(new Error('indexeddb blocked'),rej);
  });
  return _mediaDbPromise;
}
// requestの成功だけでなく transaction 全体の完了(commit)を待って解決する。
// これにより await store.put(...) が「確実に保存された」ことを意味し、途中でabortしたのに成功扱いする事故を防ぐ。
function idbDo(store, mode, fn){
  // 変更を伴うときは、書き込みの門を通す（録音・写真・保存フォルダの記憶なども含む）
  if(mode==='readwrite' && !writeAllowed()) return Promise.reject(new Error('write not allowed yet'));
  return openMediaDB().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(store,mode); const st=tx.objectStore(store); const q=fn(st);
  let result;
  q.onsuccess=()=>{ result=q.result; };
  tx.oncomplete=()=>res(result);
  tx.onabort=()=>rej(tx.error||(q&&q.error)||new Error('IndexedDB transaction aborted'));
  tx.onerror=()=>rej(tx.error||(q&&q.error)||new Error('IndexedDB transaction error'));
})); }
function makeBlobStore(store, refField){
  return {
    put(rec){ return idbDo(store,'readwrite', st=>st.put(rec)); },
    get(id){ return idbDo(store,'readonly', st=>st.get(id)); },
    del(id){ return idbDo(store,'readwrite', st=>st.delete(id)); },
    all(){ return idbDo(store,'readonly', st=>st.getAll()).then(r=>r||[]); },
    // どの観察にも参照されていない残骸（保存されなかった・完全削除済み）を掃除
    // ただしマイ図鑑に登録済みのものは保護する
    gc(){
      // 隔離中は一切削除しない（復旧途中で参照を失った実体は、救出が終わるまで残す）
      if(typeof quarantineActive==='function' && quarantineActive()) return Promise.resolve();
      const valid=new Set();
      // 参照元(観察・飛翔・マイ図鑑)が1つでも読めない時は、孤児判定が誤るので一切削除しない（原本保護）
      try{
        // 観察は**写真をしまう欄が3つ**（観察・環境・営巣木）。数え漏らすと、
        // 使われているのに「残骸」と見なして実体を消してしまう（2026-08-14 監査 Critical）
        const 欄 = (refField==='media') ? ['media','env_media','nest_media'] : [refField];
        DB.loadRaw(DB.key.ob).forEach(o=>欄.forEach(f=>(o[f]||[]).forEach(a=>a&&a.id&&valid.add(a.id))));
        DB.loadRaw(DB.key.fl).forEach(f=>(f[refField]||[]).forEach(a=>a&&a.id&&valid.add(a.id)));
        const mg=localStorage.getItem('bs_myguide');
        if(mg) JSON.parse(mg).forEach(g=>{
          if((store==='audio'&&g.kind==='audio')||(store==='media'&&(g.kind==='photo'||g.kind==='video'))) valid.add(g.ref_id);
        });
      }catch(e){ return Promise.resolve(); }
      return this.all().then(list=>Promise.all(list.filter(a=>!valid.has(a.id)).map(a=>this.del(a.id)))); }
  };
}
const AudioDB = makeBlobStore('audio','audio');   // 観察の o.audio[] が参照
const PhotoDB = makeBlobStore('media','media');   // 観察の o.media[] が参照
function mediaGcAll(){
  if(typeof quarantineActive==='function' && quarantineActive()) return Promise.resolve([]);   // 隔離中は掃除しない
  return Promise.all([AudioDB.gc().catch(()=>{}), PhotoDB.gc().catch(()=>{})]);
}
// 添付の持ち主の「読取→条件判定→更新」を1つの読み書きトランザクションで行う。
// 別々の取引に分けると、間に別のタブが正当な持ち主へ変えたものを古い値で上書きしてしまう。
// decide(r) の返り値: {obs_uuid,flight_uuid}=更新 / null=変更不要（成功） / false=条件不一致（失敗）
function ownerCas(kind, id, decide){
  const store=(kind==='audio')?'audio':'media';
  if(!writeAllowed()) return Promise.reject(new Error('write not allowed'));
  return openMediaDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite'); const st=tx.objectStore(store);
    const out={ok:false, cur:null};
    const g=st.get(id);
    g.onsuccess=()=>{
      const r=g.result;
      out.cur=r||null;
      if(!r){ out.ok=false; return; }
      let nx;
      try{ nx=decide(r); }catch(e){ try{ tx.abort(); }catch(_){ } return; }
      if(nx===false){ out.ok=false; return; }
      if(nx===null){ out.ok=true; return; }
      r.obs_uuid=nx.obs_uuid; r.flight_uuid=nx.flight_uuid;
      st.put(r); out.ok=true;
    };
    tx.oncomplete=()=>res(out);
    tx.onabort=()=>rej(tx.error||new Error('IndexedDB transaction aborted'));
  }));
}

const CallDB = {

  keys(){ return idbDo('call','readonly', st=>st.getAllKeys()).then(r=>r||[]); },

};
// 端末に保存済みの鳴き声が「今の録音(ファイル)と一致」している種数を数える。
// 差し替え(ファイル変更)された種は未一致＝再保存対象として扱う。
// 保存済みの種数と、まだ落としていない分の実バイト数を返す。
// 音源は1種あたり0.2〜18MBと差が大きいので、件数×平均では通信量の目安にならない。
function countUpToDateCalls(){
  return CallDB.all().then(list=>{ const byJp={}; list.forEach(r=>{ if(r&&r.blob) byJp[r.jp]=r; });
    let n=0, restBytes=0;
    for(const jp in CALLS){ const r=byJp[jp];
      if(r && r.f===CALLS[jp].f) n++; else restBytes+=(CALLS[jp].sz||0); }
    return {n, restBytes}; }).catch(()=>({n:0, restBytes:callsTotalBytes()}));
}
function callsTotalBytes(){ let t=0; for(const jp in CALLS) t+=(CALLS[jp].sz||0); return t; }

/* 環境省RL・北海道RLカテゴリの表示名 */
const RL_LABEL={CR:'絶滅危惧ⅠA類',EN:'絶滅危惧ⅠB類',VU:'絶滅危惧Ⅱ類',NT:'準絶滅危惧',DD:'情報不足',EX:'絶滅',EW:'野生絶滅'};
const HRL_LABEL={Cr:'絶滅危惧ⅠA類',En:'絶滅危惧ⅠB類',Vu:'絶滅危惧Ⅱ類',Nt:'準絶滅危惧',Dd:'情報不足',N:'留意',Lp:'地域個体群',Ex:'絶滅'};
const TEN_LABEL={'特':'特別天然記念物','天':'天然記念物'};
/* 種名から保全指定を取得（なければnull）。注目種判定にも使う */
function conservOf(name){ return (name && CONSERV[name]) || null; }
/* 保全指定を短いラベル配列で返す（バッジ・出力用） */
function conservTags(name){ const c=conservOf(name); if(!c) return [];
  const t=[];
  if(c.e) t.push('環境省RL '+RL_LABEL[c.e]+'（'+c.e+'）');
  if(c.k) t.push('北海道RL '+HRL_LABEL[c.k]+'（'+c.k+'）');
  if(c.h) t.push('種の保存法（国内希少種）');
  if(c.t) t.push(TEN_LABEL[c.t]);
  return t;
}
/* 保全区分を色分けの小バッジで表示（環VU / 北Vu / 天 など）。カード表示用 */
function sevColor(code){ const c=String(code||'').toUpperCase();
  if(c==='CR'||c==='EN'||c==='EX') return '#b03030';   // 絶滅危惧が高い＝赤
  if(c==='VU'||c==='NT') return '#8a5a00';             // やや高い＝橙
  return '#5a6a72'; }                                  // 情報不足・留意など＝灰
function conservBadges(name){ const c=conservOf(name); if(!c) return '';
  const b=[];
  if(c.e) b.push(`<span class="badge" style="background:${sevColor(c.e)};color:#fff;" title="環境省レッドリスト ${RL_LABEL[c.e]}（${c.e}）">環${c.e}</span>`);
  if(c.k) b.push(`<span class="badge" style="background:${sevColor(c.k)};color:#fff;" title="北海道レッドリスト ${HRL_LABEL[c.k]}（${c.k}）">北${c.k}</span>`);
  if(c.t) b.push(`<span class="badge" style="background:#2f7d5b;color:#fff;" title="${TEN_LABEL[c.t]}">${c.t==='特'?'特天':'天'}</span>`);
  return b.join('');
}
/* CSV/報告書の1列用に、指定を短い文字列で返す（該当なしは空） */
function csvConserv(name,field){ const c=conservOf(name); if(!c) return '';
  if(field==='e') return c.e? RL_LABEL[c.e]+'（'+c.e+'）':'';
  if(field==='k') return c.k? HRL_LABEL[c.k]+'（'+c.k+'）':'';
  if(field==='h') return c.h? '国内希少種':'';
  if(field==='t') return c.t? TEN_LABEL[c.t]:'';
  return '';
}

/* ---------- 繁殖ランク（観察コード）の自動判定 ----------
   全国鳥類繁殖分布調査に準拠。行動タグから A:繁殖確認 > B:繁殖の可能性 > C:生息を確認 を推定。
   あくまで自動推定のため、報告書では要確認（画面には出さず出力時のみ算出） */
const BREED_A=['巣立ち雛','給餌','餌運び'];                                   // 繁殖を確認
const BREED_B=['さえずり','繁殖行動','巣材運搬','威嚇','警戒','餌渡し','dF(ディスプレイ飛翔)']; // 繁殖の可能性
const BREED_LABEL={A:'A 繁殖を確認',B:'B 繁殖の可能性',C:'C 生息を確認'};
/* 行動文字列（「・」区切り）から繁殖ランクを返す。種名があれば最低でもC */
function breedingRank(behaviorStr, hasSpecies){
  const set=String(behaviorStr||'').split('・').filter(Boolean);
  if(set.some(b=>BREED_A.includes(b))) return 'A';
  if(set.some(b=>BREED_B.includes(b))) return 'B';
  return hasSpecies? 'C':'';
}

/* 図鑑・鳴き声の参照リンク（📖=Wikipedia日本語 / 🔊=Xeno-canto。学名があれば鳴き声検索が正確） */
function speciesByName(name){ return SPECIES.find(s=>s.japanese_name===name); }
// 個体数の読み方をアプリ全体で1つにする。空欄・未入力は「1」＝記録が存在する以上、最低1個体はいる
// （入力欄の初期値も1）。以前は集計が0、報告書と地図が1、飛翔GeoJSONが空欄と読み手ごとに割れていて、
// 同じ調査の合計が画面によって違った（2026-08-04 全体監査）
// 位置の確からしさ（m）。書き出し用。空欄・数値でないもの・負の値は空にする
function accuracyM(v){
  const s=String(v==null?'':v).trim(); if(s==='') return '';
  const n=Number(s);
  return (Number.isFinite(n) && n>=0) ? n : '';
}
// 同じ個体として結び付けた記録（individual_key が同じ）は、延べではなく1個体として数える。
// 「飛んでいるところ」と「止まったところ」を両方記録しても二重に数えないため。
// 群れは最大の個体数を採る（3羽で飛んで3羽が止まった＝3羽）。結び付けの無い記録は従来どおり足す
function dedupCount(records){
  // Map を使う（素の {} だと __proto__ や constructor が目印だったとき数え落とす）
  let sum=0; const byKey=new Map();
  (records||[]).forEach(r=>{
    const k=String((r&&r.individual_key)||'').trim();
    const c=indCount(r&&r.count);
    if(!k){ sum+=c; return; }
    const cur=byKey.get(k);
    if(cur==null || c>cur) byKey.set(k,c);
  });
  byKey.forEach(v=>{ sum+=v; });
  return sum;
}
// 座標の書き方をそろえる。数値の 0 を「空」と取り違えないようにする
function coordStr(v){ return (v==null)?'':String(v); }
// 有効なら両方の値、そうでなければ両方空を返す。
// 地図・件数・書き出しで「この位置を使うかどうか」の判断をそろえるため
function coordPair(lat,lon){
  const a=coordStr(lat), b=coordStr(lon);
  return validLatLon(a,b) ? [a,b] : ['',''];
}
// 止まりが複数あると、同じ巣の情報が記録ごとに写される。
// 数えるとき・地図に出すとき・書き出すときは、同じ巣を1つにまとめる（数え方を1か所に決める）
// 巣の目印。空でなく、IDとして安全な文字だけ（同期・点検の検査と同じ条件）を通す
//（緩くすると、細工された目印が伝播して同期で拒否され続ける記録を作れてしまう）
function nestId(o){
  const v=(o && typeof o.nest_id==='string') ? o.nest_id : '';
  return (v && /^[\w-]+$/.test(v)) ? v : '';
}
function nestHasPos(o){ return validLatLon(coordStr(o.nest_latitude), coordStr(o.nest_longitude)); }
// 巣の位置の鍵（両方空なら ","）と、内容の鍵。目印の無い旧記録の同一性はこれで判断する。
// 位置は数値として比べる（"43" と "43.0" のような表記の違いで別の巣にしない）
function nestPosKey(o){
  const a=coordStr(o.nest_latitude), b=coordStr(o.nest_longitude);
  if(a==='' && b==='') return ',';
  if(!validLatLon(a,b)) return 'bad:'+a+','+b;   // 壊れた座標は「位置なし」とも「有効」とも混ぜない
  return String(Number(a))+','+String(Number(b));
}
function nestFpKey(o){
  // JSONで直列化する（'|' 連結だと「状態=a|b」と「樹種=b|c」の組み合わせ違いが同じ鍵になる）
  return JSON.stringify([nestPosKey(o), String(o.nest_state==null?'':o.nest_state),
    String(o.nest_tree_species==null?'':o.nest_tree_species), String(o.nest_tree_height==null?'':o.nest_tree_height)]);
}
function nestPosValid(k){ return k!==',' && k.slice(0,4)!=='bad:'; }
function nestHasInfo(o){ return nestHasPos(o) || !!(o.nest_state||o.nest_tree_species||o.nest_tree_height); }
// 巣の同一性は、ここ1か所だけで決める（地図・件数・書き出し・報告書で食い違わせない）。
// 同じ調査・同じ鳥のまとまりに1つでも目印があれば、目印の無い古い記録もそこへ寄せる
function nestGroups(list){
  const arr=(list||[]).filter(o=>o && nestHasInfo(o));
  const groupOf=o=>coordStr(o.survey_uuid)+'|'+coordStr(o.individual_key);
  // まとまり（調査＋鳥）ごとの目印の集まり。目印が1つに定まるときだけ、目印の無い記録をそこへ寄せる
  //（2つ以上あるまとまりで寄せると、別の巣どうしを混ぜてしまう）
  const ids=new Map();
  const idPos=new Map();   // 調査＋目印 → その巣がある位置の集まり（別の調査の位置を混ぜない）
  const idFp=new Map();    // 調査＋目印 → その巣の内容の集まり
  const idPosKey=(sv,id)=>coordStr(sv)+'|'+id;
  (list||[]).forEach(o=>{ if(!o) return; const id=nestId(o); if(!id) return;
    const pk=idPosKey(o.survey_uuid, id);
    if(!idPos.has(pk)) idPos.set(pk, new Set());
    idPos.get(pk).add(nestPosKey(o));
    if(!idFp.has(pk)) idFp.set(pk, new Set());
    idFp.get(pk).add(nestFpKey(o));
    if(!o.individual_key) return;
    if(!ids.has(groupOf(o))) ids.set(groupOf(o), new Set());
    ids.get(groupOf(o)).add(id); });
  const keyOf=o=>{
    // 目印が同じでも、調査が違えば別の巣として数える（別の日の調査の巣を1つにまとめない）

let STACK = [];               // {name, arg}
let currentSurveyUuid = null; // 調査中コンテキスト
let mapObj = null;
let _mapTimer = null;   // 地図初期化の保留タイマー（画面を離れたら取り消す）
let _recGen = 0, _mediaGen = 0;   // 録音/写真パネルの世代。再描画・画面遷移で+1し、古い非同期処理のURL割当を無効化する
/* 写真パネルは**欄ごとに世代を持つ**（2026-08-14 監査 Major）。
   1つの数を3つの欄で使い回すと、続けて描き直したときに先の欄の番号が
   古くなり、写真があるのに絵が出ない（最後に描いた欄だけ出る） */
const _mediaGenBy = { media:0, env_media:0, nest_media:0 };
let mapCurMarker = null, mapCurCircle = null; // 地図上の現在地マーカー・精度円

// 破棄を選んだ新規記録のuuid。後から完了する写真・録音の保存処理が仮記録を作り直さないための名簿（セッション内のみ）
const DISCARDED=new Set();
// 画面を離れる前の確認。録音中と、編集画面の未保存入力を無警告で捨てないための関門。
// 保存フローは保存成功時に SCREENS._dirty=false にしてから遷移するので、ここには引っかからない
// 未保存の入力を守る画面の一覧。ここに入れ忘れると、書きかけが警告なく消える
// （まとめて記録・仮説・検証結果・振り返りが対象外になっていた＝2026-08-04の全体監査 Critical）
const GUARD_SCREENS=['obsEdit','noteEdit','flightEdit','routeEdit',
  'hypEdit','hypVerify','surveyEnd'];
// 入力があった時点で「いまが保護対象の画面か」を見る。画面ごとに見張りを張り替えないための判定
function markDirtyIfGuarded(){ if(SCREENS._flLoading) return;
  const cur=STACK[STACK.length-1]||{};

function hasUnsaved(){

  // これを見ないと、添付の最中に再読み込みされて録音・写真を失う（監査8巡目 Critical）
  if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY) return true;

  if(typeof mediaBusy==='function' && mediaBusy()) return true;
  if(REC || (typeof VREC!=='undefined' && VREC) || SCREENS._dirty) return true;
  if(typeof ptHasInput==='function' && ptHasInput()) return true;   // ポイントの小窓に入力中の鳥（v232 監査 Major）

  // 開いている分を外すと、個体Aを書きかけ→Bを足す→Aに戻る、で見落とす（監査5巡目 Critical）
  return cur.name==='obsEdit' && typeof BIRDS!=='undefined'

function leaveGuardOk(){
  if(typeof SAVE_BUSY!=='undefined' && SAVE_BUSY){ toast('保存の処理中です。少し待ってください'); return false; }
  if(typeof ptCloseOk==='function' && !ptCloseOk()) return false;   // ポイントの小窓に入力中の鳥がある
  const cur=STACK[STACK.length-1]||{};
  const editScreen=(GUARD_SCREENS.indexOf(cur.name)>=0
    ||(cur.name==='surveyEdit' && SCREENS._editing));   // 既存調査の途中編集も保護（新規は下書き自動保存があるので対象外）
  const multiDirty = cur.name==='obsEdit' && typeof BIRDS!=='undefined'
    && BIRDS.some((b,i)=>i!==BIRD_IDX && b.dirty);
  const dirty=editScreen && (SCREENS._dirty || multiDirty);
  const ghost=dirty ? SCREENS._ghost : null;   // 写真・録音を先に付けてDBに仮保存された未保存の新規記録
  if(!REC && !dirty) return true;
  let msg;
  if(REC && dirty) msg='録音中で、入力内容もまだ保存されていません。両方とも破棄して離れますか？';
  else if(REC) msg='録音中です。この画面を離れると録音は保存されずに破棄されます。離れますか？';
  else if(ghost) msg='写真・録音を付けた書きかけの記録があります。保存せずに破棄しますか？';
  else msg='入力内容がまだ保存されていません。保存せずに戻りますか？';
  if(!confirm(msg)) return false;
  if(dirty){
    // 複数個体の観察画面では、表示中の個体もまとめて下の一括処理で片付ける
    //（表示中だけ先に消すと、後続の失敗で戻すとき表示中の分が戻せない）
    const obsMulti=(cur.name==='obsEdit' && typeof BIRDS!=='undefined' && BIRDS.length>1);
    if(!obsMulti && ghost){
      // 仮保存済みの幽霊記録を片付ける（墓標が付くので同期でも復活しない）。消せなければ離脱させない
      if(!DB.hardDelete(ghost.key, ghost.uuid)){
        toast('空き容量不足のため破棄できませんでした。空きを確保してからもう一度お試しください', 4000); return false; }
      mediaGcAll().catch(()=>{});
    }
    // 未保存の新規記録は破棄済み名簿へ（保存待ちの写真・録音が完了しても、もう記録を作らせない）
    const newUuid = (!obsMulti && cur.name==='obsEdit' && !SCREENS._obsEditing) ? (SCREENS._obs&&SCREENS._obs.uuid)
                  : (cur.name==='flightEdit' && !SCREENS._flightEditing) ? SCREENS._flightSelf : null;
    // 複数トレースの途中保存で保存済みになったトラックが表示中のこともある＝保存済みは名簿に入れない
    if(newUuid && !(SCREENS._ftSaved && SCREENS._ftSaved.has(newUuid))) DISCARDED.add(newUuid);
    // 複数個体: 開いていない個体の仮記録・書きかけも片付ける。
    // 逐次に消すと途中失敗で半端が残るため、消せた分を戻せる形で一括処理する
    if(obsMulti){
      const ghostsG=[];
      for(let bi=0; bi<BIRDS.length; bi++){
        const b=BIRDS[bi];
        const gh2=b.media && b.media.ghost;
        if(gh2) ghostsG.push({b, key:gh2.key, uuid:gh2.uuid, exp:gh2.rec});
      }
      const resG=birdGhostPurge(ghostsG);
      if(resG!=='ok'){ birdGhostPurgeToast(resG); return false; }
      ghostsG.forEach(g=>{ g.b.media.ghost=undefined; if(g.keptReal && g.b.st) g.b.st.keptReal=true; });
      // 全部消せてから、未保存の個体を破棄済み名簿へ入れる（半端な名簿を作らない）
      for(let bi=0; bi<BIRDS.length; bi++){
        const b=BIRDS[bi];
        if(b.st && b.st.keptReal) continue;   // 正式化された記録は名簿に入れない
        if(b.st && b.st.obs && !b.st.obsEditing) DISCARDED.add(b.st.obs.uuid);
      }
      mediaGcAll().catch(()=>{});
      BIRDS=[newBird()]; BIRD_IDX=0;   // 片付いた一覧を持ち越さない（予期しない再描画の保全と両立させる）
    }
    // 複数羽トレース中の破棄は全トラック分を名簿へ（保存に成功した分は除く＝保存済みレコードを無効化しない）。
    // トラック状態もここで片付ける（残すと次に開いた画面で古い未保存扱いが復活する）
    if(cur.name==='flightEdit' && !SCREENS._flightEditing && SCREENS._ftracks){
      SCREENS._ftracks.forEach(tr=>{ if(tr&&tr.uuid && !(SCREENS._ftSaved&&SCREENS._ftSaved.has(tr.uuid))) DISCARDED.add(tr.uuid); });
      SCREENS._ftracks=null; SCREENS._ftDirty=false; SCREENS._ftSaved=null;
    }
  }
  return true;
}

// アプリ本体のプログラムだけを最新に読み込み直す（記録データは消さない）
async function forceUpdate(){
  if(!confirm('保存した記録（調査・観察・録音）はそのままで、アプリのプログラムだけを最新に読み込み直します。よろしいですか？')) return;
  // **新しいプログラムが「入り切る」のを見届けてから読み込み直す。**
  // 先に控えを消すやり方だと、圏外や電波の悪い所で押したときに
  // 再読み込みの後アプリが開かなくなる（2026-08-28 全体監査 Major／監査1巡目 Major）。
  // 取ってくるのはサービスワーカーに任せる（必要な部品が全部そろわなければ失敗する作り）
  const reload=()=>location.reload();
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){
        const 前の=reg.active;
        await reg.update();   // 取得＋入れ替えの準備。失敗すれば例外になる
        const sw=reg.installing||reg.waiting||(reg.active!==前の?reg.active:null);
        // 入れ替えるものが無い＝すでに新しいものが入っている場合。
        // このとき画面だけ古いままのことがあるので、読み込み直す（監査6巡目 Major）。
        // 控えは消していないので、圏外でも読み込み直して問題ない
        if(!sw){ toast('すでに最新のプログラムです。読み込み直します'); reload(); return; }
        // **入り切ったときだけ先へ進む。** 時間切れや失敗で読み込み直すと、
        // 取れていない部品があるままアプリが開かなくなる（監査2巡目 Major）
        if(sw) await new Promise((res,rej)=>{
          let 済み=false;
          const 終い=()=>{ 済み=true; clearTimeout(時計); sw.removeEventListener('statechange', 見る); };
          const 見る=()=>{ if(済み) return;
            // installed は「入った」だけで、まだ効いていない。効き始めるまで待つ
            // （旧版のまま読み込み直すと、最新にしたつもりで古い画面が出る。監査4巡目 Major）
            if(sw.state==='activated' && reg.active===sw){ 終い(); res(); }
            else if(sw.state==='redundant'){ 終い(); rej(new Error('新しいプログラムを入れられませんでした')); } };
          const 時計=setTimeout(()=>{ if(済み) return; 終い();
            rej(new Error('時間内に取り込めませんでした')); }, 20000);
          sw.addEventListener('statechange', 見る); 見る();
        });
        toast('最新のプログラムを取り込みました。読み込み直します'); reload(); return;
      }
    }
    // サービスワーカーが無いときだけ、本体を直に取り直せるか確かめてから読み込み直す
    const r=await fetch('./bird_survey.html?fu='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('status '+r.status);
    const ct=(r.headers.get('content-type')||'').toLowerCase();
    const t=await r.text();
    if(ct.indexOf('html')<0 || t.indexOf('APP_VERSION')<0) throw new Error('取れたのはこのアプリの本体ではありません');
    reload();
  }catch(e){
    toast('いま新しいプログラムを取ってこられません（電波の届く所でもう一度お試しください）。いまのアプリはそのまま使えます', 7000);
  }
}

// 調査を関連データごとソフト削除（ごみ箱から戻せる）
function softDeleteSurveyCascade(u){
  const walkingHere = WALK && WALK.sv===u;
  // 歩行中なら先にルートの本保存を試す。本保存できないときは下書きに控えておき、
  // 歩行の強制停止は「全部の削除が成功した後」にだけ行う（途中で止めると下書きごと失う）
  let walkStopped=false;
  if(walkingHere){
    if(stopWalk(true)) walkStopped=true;
    else if(!routeDraftSave()){
      // 本保存も下書きも残せない。ここで削除を進めると歩いた経路ごと失うので中止する
      toast('歩行ルートを保存できないため削除を中止しました（空き容量を確認してください）', 6000);
      return false;
    }
  }
  // 控えはルートの本保存が済んだ「後」に取る（先に取ると、戻したとき確定済みのルートまで消える）。
  // 壊れて配列でない区分があるときは、書き込みを始める前に止める（親だけ消えた状態を作らない）
  const KEYS=[DB.key.sv,DB.key.ob,DB.key.nt,DB.key.hy,DB.key.fl];
  for(const k of KEYS){ let raw; try{ raw=DB.loadRaw(k); }catch(e){ raw=null; }
    if(!Array.isArray(raw)){ toast('データに壊れがあるため削除できません。データ点検・修復画面で直してください', 7000); return false; } }
  const before={}; KEYS.forEach(k=>{ before[k]=DB.load(k); });
  const undo=()=>{
    let all=true;
    KEYS.forEach(k=>{
      try{
        if(!DB.save(k,before[k])){ all=false; return; }
        // 戻ったことを読み直して確かめる（戻せていないのに黙って続けない）
        if(JSON.stringify(DB.load(k))!==JSON.stringify(before[k])) all=false;
      }catch(e){ all=false; }
    });
    if(!all){ try{ toast('削除を取り消せませんでした。データ点検・修復画面で確認してください', 8000); }catch(e){} }
    return all;
  };
  if(!DB.softDelete(DB.key.sv,u)) return false;   // 親の削除も失敗（容量不足）→記録は継続（DB.saveが警告済み）
  // 付随する記録も全部の成否を確かめる。1件でも失敗（例外を含む）したら、全部戻す
  let ok=true;
  try{
    DB.obsOf(u).forEach(o=>{ if(!DB.softDelete(DB.key.ob,o.uuid)) ok=false; });
    DB.notesOf(u).forEach(n=>{ if(!DB.softDelete(DB.key.nt,n.uuid)) ok=false; });
    DB.hypOf(u).forEach(h=>{ if(!DB.softDelete(DB.key.hy,h.uuid)) ok=false; });
    DB.flightsOf(u).forEach(f=>{ if(!DB.softDelete(DB.key.fl,f.uuid)) ok=false; });
  }catch(e){ ok=false; }
  if(!ok){ undo(); return false; }
  if(walkingHere && !walkStopped) forceStopWalk();   // 下書きは確保済み。全件成功したのでここで停止
  return true;
}

/* ---------- 調査画面の記録一覧 ----------
   画面ぜんぶを描き直さずに一覧だけ差し替えたいので、SCREENS.survey の外に出して
   単体で呼べるようにしている（obsListPaint から使う）。
   観察と「経路だけの記録」を1本の一覧にまとめ、どちらもタップで同じ統合画面が開く */
function obsListData(u){
  const obs = DB.obsOf(u);
  // 飛翔は1回だけ読む（カードごとに読み直すと、記録が増えるほど一覧が重くなる）
  const allFlights = DB.flightsOf(u);
  // 観察とつながっている経路は、観察のカード（開けば止まりも経路も1画面）に含まれるので畳む。
  // つながっていない経路（経路だけの記録）だけ、観察と同じ一覧にカードを出す
  const obsKeys = new Set(obs.map(o2=>o2.individual_key).filter(Boolean));
  const flKeys = new Set(allFlights.map(f=>String(f.individual_key||'').trim()).filter(Boolean));
  // 観察に畳んだ経路が「要確認」なら、観察のカード側にも出す（畳んだせいで見落とさないように）
  const flReviewKeys = new Set(allFlights.filter(f=>f.needs_review)
    .map(f=>String(f.individual_key||'').trim()).filter(Boolean));
  const obsNeedsReview = o=> !!o.needs_review
    || (!!o.individual_key && flReviewKeys.has(String(o.individual_key).trim()));
  const flights = allFlights
    .filter(f=>!(f.individual_key && obsKeys.has(f.individual_key)))
    .sort((a,b)=>(b.start_time||b.created_at||'').localeCompare(a.start_time||a.created_at||''));
  const selMode = !!(SCREENS._sel && SCREENS._sel.scope==='obs' && SCREENS._sel.sv===u);
  // 選んで削除している間は観察だけを出す（削除の対象を取り違えないため）
  const reviewCount=obs.filter(obsNeedsReview).length
    + (selMode?0:flights.filter(f=>f.needs_review).length);
  const listSrc=(SCREENS._obsReviewOnly ? obs.filter(obsNeedsReview) : obs)
    .map(o=>({kind:'obs', rec:o, k:obsAtKey(o.observed_at)}))
    .concat(selMode ? [] :
      (SCREENS._obsReviewOnly ? flights.filter(f=>f.needs_review) : flights)
        .map(f=>({kind:'fl', rec:f, k:obsAtKey(f.start_time||f.created_at)})));
  const sorted=listSrc.slice().sort((a,b)=>String(b.k).localeCompare(String(a.k)));
  return { obs, flights, flKeys, obsNeedsReview, selMode, reviewCount, sorted, total:obs.length+flights.length };
}
/* ---------- 個体名（同じ鳥を追い続けるときの呼び名） ----------
   同じ調査で同じ種・同じ個体名を付けた記録は「同じ1羽」として扱う。
   結び付けの実体は既存の目印（individual_key）で、個体名はその目印を選ぶための人間向けの名札。
   こうすると集計の実数・地図の色分け・書き出しは今までの仕組みのまま動く */
function indLabelOf(rec){ return String((rec&&rec.individual_label)||'').trim(); }
// その調査で使われている個体名の一覧。同じ種のものを先に並べる（選びやすさのため）
function indLabelsOf(svUuid, spName){
  const sp=String(spName||'').trim();
  const map=new Map();   // 名前 → {label, sp, key, n}
  const add=r=>{
    const l=indLabelOf(r); if(!l) return;
    const k=JSON.stringify([l, String(r.species_name_snapshot||'').trim()]);   // 連結だと「|」入りの名前で衝突する
    const e=map.get(k);
    if(e){ e.n++; if(!e.key && r.individual_key) e.key=r.individual_key; }
    else map.set(k, {label:l, sp:String(r.species_name_snapshot||'').trim(), key:r.individual_key||'', n:1});
  };
  DB.obsOf(svUuid).forEach(add);
  DB.flightsOf(svUuid).forEach(add);
  return Array.from(map.values()).sort((a,b)=>
    ((b.sp===sp)-(a.sp===sp)) || (b.n-a.n) || String(a.label).localeCompare(String(b.label)));
}
// 経路の画面から個体名を付けて保存するときの目印の引き継ぎ。
// 観察・飛翔をまたぐ揃え直し（fix）は統合画面の保存取引でしか安全に行えないので、
// ここでは目印を合わせるだけにし、食い違いが残る場合はその場で知らせる
function flIndKeyFor(svUuid, spName, label, curKey, selfUuid){
  const lb=String(label||'').trim();
  // 名前を外すときも、同じまとまりの記録に名前が残っていれば揃え直しが要る
  if(!lb){
    if(!curKey) return { key:'', fixN:0, found:false };
    const r0=indUnnameResolve(svUuid, curKey, selfUuid||'');
    return { key:curKey, fixN:r0.fixObs.length+r0.fixFl.length, found:true };
  }
  const r=indResolve(svUuid, spName, lb, curKey||'', selfUuid||'');
  // found=既にある目印に合わせた（false なら新しく発行した＝毎回ちがう値になるので比べない）
  return { key:r.key||curKey||'', fixN:r.fixObs.length+r.fixFl.length, found:r.keys.length>0 };
}
// 経路の画面は観察をまたぐ書き直しを安全に行えない（保存の取引が飛翔だけのため）。
// 揃え直しが要る場合は、そのことを利用者に伝えたうえで「要確認」を付けて残す
function flIndWarn(total){
  if(!total) return true;
  return confirm('同じ個体名の記録に、そろっていない目印が'+total+'件あります。\n'
    +'ここでは経路だけを保存し、「要確認」を付けます。\n'
    +'（その個体の観察を開いて保存すると揃います）\n\nこのまま保存しますか？');
}
// 名前を外すときの解決。目印は変えず、同じまとまりの記録から名前だけを消す
function indUnnameResolve(svUuid, curKey, selfUuid, snap){
  const out={ key:curKey, keys:[], fixObs:[], fixFl:[], merge:false, mode:'unname' };
  if(!curKey) return out;
  ((snap&&snap.obs)||DB.load(DB.key.ob)||[]).forEach(o=>{
    if(o && o.survey_uuid===svUuid && o.uuid!==selfUuid && o.individual_key===curKey && indLabelOf(o)) out.fixObs.push(o); });
  ((snap&&snap.fl)||DB.load(DB.key.fl)||[]).forEach(f=>{
    if(f && f.uuid!==selfUuid && f.survey_uuid===svUuid && f.individual_key===curKey && indLabelOf(f)) out.fixFl.push(f); });
  return out;
}
// 個体名から「同じ1羽」の正規の目印を決め、あわせて揃えるべき既存記録も返す。
// 目印を返すだけだと、同名なのに目印が空の記録や、名前を変えたときの元の仲間が
// 取り残されて「同じ名前なのに集計では複数羽」に割れてしまう（2026-08-10 監査）
function indResolve(svUuid, spName, label, curKey, selfUuid, snap){
  const out={ key:'', keys:[], fixObs:[], fixFl:[], merge:false, mode:'merge' };
  const l=String(label||'').trim();
  if(!l) return out;
  const sp=String(spName||'').trim();
  // 写しが渡されていればそこから読む（確かめた姿と組み立てる姿を同じにする）
  const obs=(snap&&snap.obsLive)||DB.obsOf(svUuid), fls=(snap&&snap.flLive)||DB.flightsOf(svUuid);
  const same=r=> indLabelOf(r)===l && String(r.species_name_snapshot||'').trim()===sp;
  // 同じ名前で使われている目印を集める（自分は除く）
  const keys=new Set();
  obs.forEach(o=>{ if(o.uuid!==selfUuid && same(o) && o.individual_key) keys.add(o.individual_key); });
  fls.forEach(f=>{ if(f.uuid!==selfUuid && same(f) && f.individual_key) keys.add(f.individual_key); });
  out.keys=Array.from(keys);
  // 正規の目印: 既にあるものの中でいちばん記録の多いもの。無ければ今の目印、それも無ければ新規
  if(out.keys.length){
    const cnt=k=>obs.filter(o=>o.individual_key===k).length + fls.filter(f=>f.individual_key===k).length;
    out.key=out.keys.slice().sort((a,b)=>cnt(b)-cnt(a) || String(a).localeCompare(String(b)))[0];
  } else out.key=curKey||uuid();
  // 揃えるべき記録: 同じ名前なのに目印が違う（空も含む）ものと、
  // いま編集している記録の元の仲間（名前を変えたときに置き去りにしないため）。
  // 目印が同じでも名前が違えば直す（初めて名付けたとき、仲間に名前が付かないのを防ぐ）
  const need=r=> (same(r) || (curKey && r.individual_key===curKey))
    && (r.individual_key!==out.key || indLabelOf(r)!==l);
  // ごみ箱の記録も揃える（復元したときに古い目印・古い名前で再び割れないように）
  const allObs=((snap&&snap.obs)||DB.load(DB.key.ob)||[]).filter(o=>o && o.survey_uuid===svUuid);
  const allFls=((snap&&snap.fl)||DB.load(DB.key.fl)||[]).filter(f=>f && f.survey_uuid===svUuid);
  allObs.forEach(o=>{ if(o.uuid!==selfUuid && need(o)) out.fixObs.push(o); });
  allFls.forEach(f=>{ if(f.uuid!==selfUuid && need(f)) out.fixFl.push(f); });
  // 別々のまとまりが1つになる場合だけ「まとめますか」と確かめる
  const all=new Set(out.keys); if(curKey) all.add(curKey);
  out.merge = all.size>1;
  return out;
}

// 種が少ないうち（猛禽1羽を追う調査など）はまとめても1つの塊になるだけなので、
// そのまま時系列で出す。一度でも切り替えたら、その調査の間はその選び方に従う
function obsGroupOn(spN){ return SCREENS._obsGroup==null ? spN>=6 : !!SCREENS._obsGroup; }
function obsGroupToggle(){
  if(recBusy()){ toast('録音を停止してから操作してください'); return; }
  const d=obsListData(SCREENS._obsListSv);
  SCREENS._obsGroup=!obsGroupOn(obsSpeciesCount(d.sorted));
  obsListPaint();
}
function obsFoldAll(){ SCREENS._obsOpen=new Set(); obsListPaint(); }
// 自動でまとめるかは「種の数」で決める（個体名で分かれた数ではない）
function obsSpeciesCount(items){
  const set=new Set();
  items.forEach(it=>set.add(String((it.rec&&it.rec.species_name_snapshot)||'').trim() || '（未同定）'));
  return set.size;
}
// 一覧のまとめの単位。個体名があれば種名と分けて持つ（追っている個体の記録が1か所に集まる）
const OBS_GRP_SEP='\u0001';   // 種名と個体名の区切り（利用者が打てない文字を使う）
function obsSpOf(rec){
  const sp=String((rec&&rec.species_name_snapshot)||'').trim() || '（未同定）';
  const lb=indLabelOf(rec);
  return lb ? (sp+OBS_GRP_SEP+lb) : sp;
}
// 群の見出しに出す「要確認」の数。観察は畳んだ経路の分も含める
let obsGrpReview=o=>!!(o&&o.needs_review);
// 種ごとの群をつくる。並びは「その群のいちばん新しい記録が新しい順」
//（現場の「さっき記録したものが上」の感覚を壊さない）
function obsGroupsOf(items){
  const map=new Map();
  items.forEach(it=>{
    const sp=obsSpOf(it.rec);
    let g=map.get(sp);
    if(!g){
      const bar=sp.indexOf(OBS_GRP_SEP);
      g={sp, spName:(bar>=0?sp.slice(0,bar):sp), lbName:(bar>=0?sp.slice(bar+1):''),
         items:[], newest:'', oldest:'', review:0};
      map.set(sp,g);
    }
    g.items.push(it);
    if(it.k){ if(!g.newest || it.k>g.newest) g.newest=it.k;
      if(!g.oldest || it.k<g.oldest) g.oldest=it.k; }
    if(it.rec && (it.kind==='obs' ? obsGrpReview(it.rec) : it.rec.needs_review)) g.review++;
  });
  return Array.from(map.values()).sort((a,b)=>
    String(b.newest).localeCompare(String(a.newest))
    || (b.items.length-a.items.length)
    || String(a.sp).localeCompare(String(b.sp)));
}
// 群の中身（カード）。閉じている群は作らないので、記録が増えても一覧が重くならない
function obsGrpBodyHtml(u, sp){
  const g=(SCREENS._obsGroups instanceof Map) ? SCREENS._obsGroups.get(sp) : null;
  if(!g) return '';
  const lim=((SCREENS._obsGrpShown instanceof Map) ? SCREENS._obsGrpShown.get(sp) : 0)||50;
  const shown=g.items.slice(0, lim);
  const more=g.items.length>shown.length
    ? `<button class="btn" onclick="obsGrpMore(this)">さらに50件表示（残り${g.items.length-shown.length}件）</button>` : '';
  return shown.map(it=>obsCardHtml(it)).join('') + more;   // カードは obsListHtml が束ねた作り方を使う
}
// 種ごとの折りたたみ。開いた種を覚え、開いた瞬間に中身を作る（render() は呼ばない）
function obsFoldToggle(el){
  const sp=el.getAttribute('data-sp')||'';
  if(!(SCREENS._obsOpen instanceof Set)) SCREENS._obsOpen=new Set();
  if(el.open){ SCREENS._obsOpen.add(sp); obsFoldFill(el,sp); }
  else SCREENS._obsOpen.delete(sp);
}
function obsFoldFill(el, sp){
  const body=el.querySelector('.gbody'); if(!body) return;
  const u=SCREENS._obsListSv;
  if(!u || !(SCREENS._obsGroups instanceof Map) || !SCREENS._obsGroups.has(sp)){ render(); return; }
  body.innerHTML=obsGrpBodyHtml(u, sp);
}
function obsGrpMore(btn){
  const d=btn.closest('details.grp'); if(!d) return;
  const sp=d.getAttribute('data-sp')||'';
  if(!(SCREENS._obsGrpShown instanceof Map)) SCREENS._obsGrpShown=new Map();
  SCREENS._obsGrpShown.set(sp, (SCREENS._obsGrpShown.get(sp)||50)+50);
  obsFoldFill(d, sp);
}
// 一覧のカード1枚（観察／経路だけの記録。どちらもタップで同じ統合画面が開く）
let obsCardHtml=()=>'';
function obsListHtml(u){
  const d=obsListData(u);
  const selMode=d.selMode;
  const obsInner = o=>`
    <div class="grow">
      <div style="font-weight:700;">${esc(o.species_name_snapshot||'（未同定）')}
        ${conservBadges(o.species_name_snapshot)}
        ${indLabelOf(o)?`<span class="pill">${esc(indLabelOf(o))}</span>`:''}
        ${d.obsNeedsReview(o)?'<span class="badge warn">要確認</span>':''}
        ${o.identification_status&&o.identification_status!=='確定'?`<span class="badge">${esc(o.identification_status)}</span>`:''}
      </div>
      <div class="small muted">${fmtTime(o.observed_at)} ・ ${esc(indCount(o.count))}個体 ・ ${esc(o.detection_method||'')}${o.habitat?' ・ '+esc(o.habitat):''}${o.age_class&&ageNorm(o.age_class)!=='不明'?' ・ '+esc(ageNorm(o.age_class)):''}${o.sex&&o.sex!=='不明'?' ・ '+esc(o.sex):''}</div>
    </div>
    <span class="tiny muted">${(o.audio&&o.audio.length)?'🎤':''}${(o.media&&o.media.length)?'📷':''}${(o.individual_key&&d.flKeys.has(String(o.individual_key).trim()))?'🛩':''}${o.latitude?'📍':''}</span>`;
  const obsCard = o=> selMode
    ? `<div class="card tap selcard ${SCREENS._sel.set.has(o.uuid)?'selected':''}" onclick="toggleSel('${o.uuid}',this)">
        <div class="row"><span class="selcb">${SCREENS._sel.set.has(o.uuid)?'☑':'☐'}</span>${obsInner(o)}</div></div>`
    : `<div class="card tap" onclick="nav('obsEdit', JSON.stringify({sv:'${u}',id:'${o.uuid}'}))">
        <div class="row">${obsInner(o)}</div></div>`;
  const cardOf = it=> it.kind==='fl' ? flightCard(u,it.rec) : obsCard(it.rec);
  obsCardHtml=cardOf;   // 群の中身を後から作るときにも同じカードを使う
  if(!d.sorted.length){
    return `<div class="empty small">${SCREENS._obsReviewOnly?'要確認の記録はありません。':'まだ記録がありません。'}</div>`;
  }
  // 選んで削除している間はまとめを一時的に解除する
  //（畳んだ中に隠れたまま消える事故を防ぐ。切替の指定そのものは残るのでキャンセルで戻る）
  const spN=obsSpeciesCount(d.sorted);
  const grouped=obsGroupOn(spN) && !selMode;
  const chips=`<div class="chips" style="margin:0 0 8px;">
      <span class="c ${grouped?'on':''}" onclick="obsGroupToggle()">種ごとにまとめる</span>
      ${(grouped && SCREENS._obsOpen && SCREENS._obsOpen.size)?`<span class="c" onclick="obsFoldAll()">すべて閉じる</span>`:''}
    </div>`;
  if(!grouped){
    const recent=d.sorted.slice(0, SCREENS._obsLimit||50);
    const moreBtn=d.sorted.length>recent.length
      ? `<div class="sp"></div><button class="btn" onclick="obsMore()">さらに50件表示（残り${d.sorted.length-recent.length}件）</button>` : '';
    return (selMode?'':chips) + recent.map(cardOf).join('') + moreBtn;
  }
  obsGrpReview=d.obsNeedsReview;   // 群の要確認の数も、畳んだ経路を含めて数える
  const groups=obsGroupsOf(d.sorted);
  SCREENS._obsGroups=new Map(groups.map(g=>[g.sp,g]));   // 開いたときに中身を作るための置き場
  if(!(SCREENS._obsOpen instanceof Set)) SCREENS._obsOpen=new Set();
  const body=groups.map(g=>{
    const open=SCREENS._obsOpen.has(g.sp);
    const span=g.newest ? `${fmtTime(g.oldest)}〜${fmtTime(g.newest)}` : '';
    return `<details class="fold grp" data-sp="${esc(g.sp)}" ${open?'open':''} ontoggle="obsFoldToggle(this)">
      <summary><span class="grow">${esc(g.spName)}${g.lbName?`<span class="pill" style="margin-left:6px;">${esc(g.lbName)}</span>`:''}${conservBadges(g.spName)}${g.review?`<span class="badge warn">要確認${g.review}</span>`:''}</span>
        <span class="small muted">${g.items.length}件${span?' ・ '+span:''}</span></summary>
      <div class="gbody">${open?obsGrpBodyHtml(u,g.sp):''}</div>
    </details>`;
  }).join('');
  return chips + body;
}
