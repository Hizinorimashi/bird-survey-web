// いまの音を残す（v232）。聞き取り中に端末が覚えている直前の音（いまの連続した区間から最大30秒）を、
// 「聞こえた鳥」に1件として残す。自分で押して残すので、人の声の判定では止めない（AIによる自動の保存とは別）。
// 自動の声と同じ保存の列（aiQ）・削除の番号の照合・容量の予約と返却・声と記録の一括確定を使う
const AI_MANUAL_SEC=30;
function aiCanSaveNow(){ return AIL.want && AIL.cap && !!AIL.seg && Date.now()-AIL.lastPcm<=5000; }
function aiSaveNow(){
  if(!aiCanSaveNow()){ toast('聞き取り中で音が届いているときだけ残せます'); return; }
  if(!writeAllowed()) return;
  if(AI_TOT.det>=AI_CAP_DET){ toast(`この調査の聞こえた鳥が上限（${AI_CAP_DET}件）に達しています`, 5000); return; }
  const seg=AIL.seg, sv=AIL.sv, b=AIL.written;
  const a=Math.max(0, b-AICFG.manual*AI_SR, b-AIL.ring.length+1);   // いまの区間だけ（中断の前の音は混ぜない）
  const pcm=aiRingGet(a, b);
  if(!pcm || pcm.length<AI_SR){ toast('残せる音がまだありません（聞き始めて1秒未満）'); return; }
  const sec=pcm.length/AI_SR, bytes=pcm.length*2;
  if(AI_TOT.clipSec+sec>AI_CAP_CLIP_SEC){ toast('この調査の声が上限（合計30分）のため残せません', 5000); return; }
  if(AI_TOT.devBytes+bytes>AI_CAP_DEV_BYTES){ toast('端末の声の保存量が上限（200MB）のため残せません', 5000); return; }
  const i16=new Int16Array(pcm.length);
  for(let i=0;i<pcm.length;i++) i16[i]=Math.max(-32768, Math.min(32767, Math.round(pcm[i]*32767)));
  const t0=aiTOf(seg,a), t1=aiTOf(seg,b), pos=aiPosNow(), posOk=pos && Math.abs(pos.t-t1)<=AI_POS_MAX_AGE;
  const clip={ id:uuid(), sv, det:null, pcm:i16, sr:AI_SR, t0 };
  const rec={ id:uuid(), kind:'det', manual:true, sv, ja:'（録音のみ）', sci:'', species_id:'', max:0, count:0, t0, t1,
    lat:posOk?pos.lat:null, lng:posOk?pos.lng:null, acc:posOk?pos.acc:null, pos_t:posOk?pos.t:null,
    model:'', clip:clip.id, clip_sec:sec, clip_bytes:bytes, clip_note:'', marked:true, obs_uuid:null, created_at:nowISO(),
    seg_id:seg.uid||'', seg_t0:seg.t0, clip_off0:a/AI_SR, clip_off1:b/AI_SR };
  rec.updated_at=rec.created_at;
  clip.det=rec.id;
  const dg=AI_DGEN[sv]||0;
  // 上限の勘定は先に押さえ、保存できなければ戻す
  AI_TOT.det++; AI_TOT.clipSec+=sec; AI_TOT.devBytes+=bytes;
  const refund=()=>{ AI_TOT.det--; AI_TOT.clipSec-=sec; AI_TOT.devBytes-=bytes; };
  aiQ(sv, async()=>{
    const db=await aiDb(); const tx=db.transaction(['det','clip'],'readwrite');
    tx.objectStore('clip').put(clip); tx.objectStore('det').put(rec);   // 声と記録は同じ処理で一緒に確定する
    await aiTxDone(tx); return true;
  }, dg).then(ok=>{
    if(!ok){ refund(); toast('残せませんでした（消した直後・保存できない状態）', 5000); return; }
    toast(`いまの音（直前${Math.round(sec)}秒）を「聞こえた鳥」に残しました`, 3000); aiListLive();
  }).catch(()=>{ refund(); toast('残せませんでした（端末の空き容量など）', 5000); });
}
function aiPopToggle(on){ AIL.popOpen=!!on; aiPopRender(); }
function aiPopUpdate(rec){ if(_aiPopRec.has(rec.id)) aiPopRender(); }
// ✕: この知らせだけ消す（「聞こえた鳥」の一覧には残る）
function aiPopClose(id){ _aiPopRec.delete(id); AIL.pops=AIL.pops.filter(x=>x!==id); aiFabUpdate(); }
function aiPopClear(){ _aiPopRec.clear(); AIL.pops=[]; aiFabUpdate(); }

// 印を付ける・外す。観察の記録は作らない（obs_uuid は将来の「観察を開く」用で、今回は使わない）
function aiMark(rec, on){
  rec.marked=!!on;
  aiQ(rec.sv, async()=>{ const db=await aiDb(); const tx=db.transaction('det','readwrite'); const st=tx.objectStore('det');
    const cur=await aiReq(st.get(rec.id)); if(!cur) return false;   // 消した後なら何もしない（復活させない）
    cur.marked=!!on; cur.updated_at=nowISO(); rec.updated_at=cur.updated_at; st.put(cur); return aiTxDone(tx); }, rec._dg).then(()=>aiListLive());
}

/* ---------- 名前を付ける（v242 学習用に集める。計画: tasks/todo.md「自前の声を学習用に集める仕組み」） ----------
   kind: ok（AI の名前で合っている）／other（別の種。ja に種名）／nonbird（鳥ではない）／unknown（分からない）／''（取り消し）
   保存済みの最新の行を読んで名前の欄だけ直す。聞き取り中の検出（AIL.events）にも同じ値を入れる（後の自動保存で消さない） */
const AI_LABEL_TEXT={ ok:'✓ 合ってる', other:'別の種', nonbird:'鳥ではない', unknown:'? 分からない' };
function aiLabelValid(rec, kind, ja){
  if(!['ok','other','nonbird','unknown',''].includes(kind)) return false;
  if(kind==='ok' && (rec.manual || !rec.ja || rec.ja==='（録音のみ）')) return false;   // 自分で残した音は AI の名前が無い
  if(kind==='other' && !(typeof ja==='string' && ja && speciesByName(ja))) return false;
  return true;
}
// 区間の決まり（DB の training_clips.region_problem と同じ）: 時間は両方 null か 0 ≤ 始め < 終わり ≤ 声の長さ（＋0.05秒）、
// 高さは両方 null か 0 ≤ 下 < 上 ≤ 24000
function aiRegionProblem(r, sec){
  if(!r) return '';
  const fin=v=>v==null || (typeof v==='number' && isFinite(v));
  if(![r.t0,r.t1,r.f0,r.f1].every(fin)) return '区間の値が数ではありません';
  if((r.t0==null)!==(r.t1==null)) return '区間の時間は始めと終わりの両方が要ります';
  if(r.t0!=null && !(r.t0>=0 && r.t0<r.t1 && (sec==null || r.t1<=sec+0.05))) return '区間の時間が正しくありません';
  if((r.f0==null)!==(r.f1==null)) return '区間の高さは下と上の両方が要ります';
  if(r.f0!=null && !(r.f0>=0 && r.f0<r.f1 && r.f1<=24000)) return '区間の高さが正しくありません';
  return '';
}
// region … 声紋で選んだ区間（名前と一組）。無ければ区間なし（付け直し・取り消しで前の区間は残さない）
function aiLabelSet(id, kind, ja, region){
  if(!writeAllowed()) return Promise.resolve(false);
  return (async()=>{
    let cur=null; try{ const db=await aiDb(); cur=await aiReq(db.transaction('det').objectStore('det').get(id)); }catch(e){}
    if(!cur || cur.kind!=='det') return false;
    ja=kind==='other' ? String(ja||'').trim() : '';
    if(!aiLabelValid(cur, kind, ja)){ toast(kind==='other'?'その名前の種が見つかりません（種の一覧の名前で入れてください）':'この声には付けられません'); return false; }
    const reg=region||null, bad=aiRegionProblem(reg, cur.clip_sec||null);
    if(bad){ toast(bad); return false; }
    const at=nowISO(), val={ label_kind:kind, label_ja:ja, labeled_at:at,
      label_t0:reg&&reg.t0!=null?reg.t0:null, label_t1:reg&&reg.t1!=null?reg.t1:null,
      label_f0:reg&&reg.f0!=null?reg.f0:null, label_f1:reg&&reg.f1!=null?reg.f1:null };
    const live=AIL.events.find(e=>e.rec.id===id); if(live) Object.assign(live.rec, val);
    const ok=await aiQ(cur.sv, async()=>{ const db=await aiDb(); const tx=db.transaction('det','readwrite'); const st=tx.objectStore('det');
      const c=await aiReq(st.get(id)); if(!c) return false;   // 消した後なら何もしない（復活させない）
      Object.assign(c, val); c.updated_at=at; st.put(c); return aiTxDone(tx); }, live?live.rec._dg:undefined);
    aiListLive();
    return !!ok;
  })();
}
function aiLabelPress(id, kind, now){
  if(kind===now) return aiLabelSet(id, '', '');   // 同じボタンをもう一度押すと取り消し
  if(kind==='other'){
    const ja=prompt('本当は何の鳥でしたか？（種名）');
    if(ja==null) return;
    return aiLabelSet(id, 'other', ja);
  }
  return aiLabelSet(id, kind, '');
}

  const hms=t=>new Date(t).toTimeString().slice(0,8);
  const marked=dets.filter(d=>d.marked).sort((a,b)=>b.t0-a.t0);
  const others=dets.filter(d=>!d.marked).map(d=>({t:d.t0, d})).concat(gaps.map(g=>({t:g.t0, g}))).sort((a,b)=>b.t-a.t);
  const row=d=>`<div class="card aidet${d.marked?' marked':''}">

        ${roBtn(`<button type="button" class="btn${d.marked?' primary':''}" style="width:auto; padding:8px 12px;" data-id="${esc(d.id)}" onclick="aiListMark(this.dataset.id, ${d.marked?'false':'true'})">${d.marked?'★':'☆'}</button>`)}

let routePath=[], routeLayer=null, routeMode='draw', routeLine=null, routeEndMarker=null, _walkStarting=false;
// 歩行記録セッション。画面をまたいで継続し、停止は「⏹記録停止／ルート保存／調査終了」だけ
let WALK=null;   // { sv, watchId, wakeLock, lastSave, saveFailed }
// 歩行中の下書き保存（調査ごとの独立キー・localStorage直書き＝自動同期を発火させず電池・通信を守る）。
// 電池切れ・アプリ落ちからの復元用。baseFp＝歩行開始時点の正規ルートの指紋（同期で届いた別ルートを誤って潰さないため）
function routeDraftKey(sv){ return 'bs_route_draft_'+sv; }
// 変更検知用の軽量指紋（点数＋末尾点）。点数だけだと「1つ戻す→新しい点」で同数のまま内容が変わるのを見逃す
function routeTailFp(){ return routePath.length+':'+(routePath.length?String(routePath[routePath.length-1]):''); }
function routeDraftSave(){
  if(!WALK || WALK.saveFailed) return false;
  try{ localStorage.setItem(routeDraftKey(WALK.sv), JSON.stringify({ sv:WALK.sv, route:routePath, baseFp:WALK.baseFp, t:Date.now() }));
    WALK.lastSave=Date.now(); WALK.savedFp=routeTailFp(); return true; }
  catch(e){ WALK.saveFailed=true;
    try{ toast('空き容量不足でルートの自動保存ができません（停止時の保存は試みます）', 4000); }catch(_){} return false; }
}
function routeDraftLoad(sv){ try{ const d=JSON.parse(localStorage.getItem(routeDraftKey(sv))||'null');
  if(d && d.sv===sv && Array.isArray(d.route)) return d; }catch(e){} return null; }
function routeDraftClear(sv){ try{ localStorage.removeItem(routeDraftKey(sv)); }catch(e){} }
// 下書きの復元判定。正規ルートが下書き作成時から変わっていなければ「点数が多い方」を自動採用。
// 変わっている（同期で別端末のルートが届いた等）ときは無断で潰さず、ユーザーに選ばせる
function maybeRestoreDraft(sv){
  SCREENS._draftChecked=sv;   // 同じ画面滞在中に二重で確認しない（画面表示時と歩行開始時の二重ダイアログ防止）
  const d=routeDraftLoad(sv); if(!d) return;
  const pts=(d.route||[]).filter(validPathPt);
  const s=DB.survey(sv); const curFp=JSON.stringify((s&&s.route)||[]);
  if((d.baseFp||'[]')===curFp){
    const same=JSON.stringify(pts)===JSON.stringify(routePath);
    if(pts.length>routePath.length || (pts.length && pts.length===routePath.length && !same)){
      // 点数が多い、または同点数でも内容が違う（「1つ戻す→新しい点」の同数変化）→下書きの方が新しい操作結果
      routePath=pts; toast('前回の続き（未保存のルート）を復元しました', 4000);
    }
    else routeDraftClear(sv);   // 正規と同じ・または正規の方が進んでいる＝下書きは不要
  } else if(pts.length){
    if(confirm('未保存の歩行ルートの下書きがあります。復元して今のルートを置き換えますか？\n（キャンセル＝下書きを破棄して今のルートを使う）')){ routePath=pts; }
    else routeDraftClear(sv);
  } else routeDraftClear(sv);
}
// 全画面共通の「🚶 ルート記録中」表示（タップで記録中のルート画面へ。表示中なら何もしない）
function walkPillTap(){ if(!WALK) return; const cur=STACK[STACK.length-1]||{};

function renderWalkPill(){
  const sub=$('#hSub'); if(!sub) return;
  const old=document.getElementById('walkPill'); if(old) old.remove();
  if(!WALK) return;
  // 記録の状態でピルの見た目を変える（カメラ・別アプリ等での中断や、GPSの長い沈黙を見逃さないため）
  const warnStyle='cursor:pointer; background:var(--warn); color:#0a0f0d;';
  let cls='pill ok', style='cursor:pointer;', label='🚶 ルート記録中';
  if(WALK.stale){ cls='pill'; style=warnStyle; label='🚶⚠ GPSを待っています'; }
  else if(WALK.resumeWait){ cls='pill'; style=warnStyle; label='🚶⚠ GPS再開を確認中'; }
  else if(WALK.warnUntil && Date.now()<WALK.warnUntil){ cls='pill'; style=warnStyle; label='🚶⚠ 中断あり→再開'; }

// 中断（カメラ・動画撮影・別アプリ・画面ロック等で位置が途絶えていた時間）を、位置の再取得を確認した時点で知らせる。
// その区間の軌跡は点が飛んで直線になるため、気付かず歩き続けないようピルとトーストで目立たせる
function walkGapNotify(ms){
  if(!WALK) return;
  const sec=Math.round(ms/1000);
  const dur = sec>=60 ? `約${Math.round(sec/60)}分` : `約${sec}秒`;
  WALK.warnUntil=Date.now()+8000;
  renderWalkPill();
  setTimeout(()=>{ if(WALK && (!WALK.warnUntil || Date.now()>=WALK.warnUntil)) renderWalkPill(); }, 8200);
  toast(`⚠ 位置の記録が${dur}中断していました（カメラ・別アプリ等）。いま再開しました。中断区間の軌跡は直線になります`, 5000);
}
// WakeLock取得（歩行中のみ）。バックグラウンド復帰時にも呼ばれ、取り直す。
// 古いセッション・古いrequestの結果は必ず捨てる（同一セッション内の多重requestで参照が迷子にならないよう世代番号で照合）
function walkWakeLock(){
  if(!WALK || !('wakeLock' in navigator)) return;
  const walk=WALK;
  const req=++walk.wlReq;
  if(walk.wakeLock){ try{ const r=walk.wakeLock.release(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} walk.wakeLock=null; }
  navigator.wakeLock.request('screen').then(w=>{
    if(WALK===walk && walk.wlReq===req){
      if(walk.wakeLock){ try{ const r=walk.wakeLock.release(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
      walk.wakeLock=w;
    } else { try{ w.release(); }catch(e){} } }).catch(()=>{});
}
// 画面復帰時: 歩行記録中ならWakeLockを取り直す（バックグラウンドでOSが解放するため）。
// カメラ・別アプリ・画面ロック等で裏に回っていた場合、位置が3秒以上途絶えていたら「GPS再開を確認中」にする。
// 「中断→再開」の通知は次の位置が実際に届いた時点で出す（復帰しただけではGPSが再開したとは限らない。
//  裏でも位置が届き続けていた端末は lastFixAt が新しいままなので中断扱いにしない）
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){ if(WALK && !WALK.hiddenAt) WALK.hiddenAt=Date.now(); return; }
  if(!WALK) return;
  walkWakeLock();
  if(WALK.hiddenAt){ WALK.hiddenAt=null;
    if(WALK.hadFix && Date.now()-WALK.lastFixAt>=3000 && !WALK.resumeWait){ WALK.resumeWait=true; renderWalkPill(); } }
});

function initRouteMap(){

const _routeBadge=(txt,bg)=>L.divIcon({className:'',html:`<div style="background:${bg};border:2px solid #fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5)">${txt}</div>`,iconSize:[20,20],iconAnchor:[10,10]});

    if(routePath.length>1) routeEndMarker=L.marker(routePath[routePath.length-1],{icon:_routeBadge('終','#d05555')}).addTo(routeLayer);
  }

// 歩いて記録の1点追加を軽量に反映（全再描画=O(n^2)を避ける）
function routeAppend(pt){
  routePath.push(pt);
  if(!mapObj || !routeLayer){ routeInfo(); return; }
  if(routePath.length===1){ L.marker(pt,{icon:_routeBadge('始','#3fb984')}).addTo(routeLayer); }
  else {
    if(routeLine) routeLine.addLatLng(pt);
    else routeLine=L.polyline(routePath,{color:'#2f6fd0',weight:4,opacity:.9}).addTo(routeLayer);
    if(routeEndMarker) routeEndMarker.setLatLng(pt);
    else routeEndMarker=L.marker(pt,{icon:_routeBadge('終','#d05555')}).addTo(routeLayer);
  }
  routeInfo();
}

function startWalk(){
  if(WALK || _walkStarting) return;   // 二重起動防止（watch/WakeLockのリークと孤児watchを防ぐ）
  const sv=SCREENS._routeSv; if(!sv){ toast('調査のルート画面から開始してください'); return; }
  if(!navigator.geolocation){ toast('位置情報を利用できません'); return; }
  if(SCREENS._draftChecked!==sv){ maybeRestoreDraft(sv); redrawRoute(); }   // 画面表示時に確認済みなら二重確認しない
  _walkStarting=true;
  const walk={ sv, watchId:null, wakeLock:null, timer:null, lastSave:Date.now(), savedFp:'', wlReq:0, saveFailed:false,
    lastFixAt:Date.now(), hiddenAt:null, warnUntil:0, stale:false, resumeWait:false, hadFix:false,   // 中断・GPS沈黙の検知用
    baseFp:JSON.stringify((DB.survey(sv)&&DB.survey(sv).route)||[]) };   // 開始時点の正規ルートの指紋（同期競合の検出用）
  // 先にwatchを張ってIDを確定（WakeLock取得のawait中に二度押しされてもリークしない）
  walk.watchId=navigator.geolocation.watchPosition(p=>{
    if(WALK!==walk) return;   // 停止済みセッションの遅延通知は無視（新しい記録に混入させない）
    // 復帰確認中なら、この位置到達が「本当の再開」。中断時間＝位置が途絶えていた実時間で通知する
    //（初回測位はまだ記録が始まっていないので中断扱いにしない＝hadFixが立ってからだけ通知）
    if(walk.resumeWait){ const gap=Date.now()-walk.lastFixAt; walk.resumeWait=false;
      if(walk.hadFix && gap>=3000) walkGapNotify(gap); else renderWalkPill(); }
    walk.hadFix=true;
    walk.lastFixAt=Date.now();
    if(walk.stale){ walk.stale=false; renderWalkPill(); }   // GPS沈黙から回復したらピルを通常表示に戻す
    const pt=[p.coords.latitude, p.coords.longitude];
    lastFix={lat:pt[0],lon:pt[1],acc:p.coords.accuracy,t:Date.now()};
    // 歩行中はこのwatchがGPSインジケータも担う（インジケータ用watchと二重にしない＝電池対策）
    const el=$('#pGps'); if(el){ el.textContent=`GPS ±${Math.round(p.coords.accuracy)}m`; el.className='pill ok'; }
    const last=routePath[routePath.length-1];
    // 直前から約5m以上動いたときだけ点を足す（GPSのゆらぎで点が溜まるのを防ぐ）
    if(!last || distMeters(last,pt)>=5){
      routeAppend(pt);
      if(routeLayer && mapObj){ try{ mapObj.panTo(pt); }catch(e){} }   // ルート地図が出ている時だけ追従（他画面の地図を動かさない）
    }
  }, e=>{
    if(WALK!==walk) return;   // 古いセッションの失敗通知で新しい記録を止めない
    // 圏外・測位不能・タイムアウトは一時的な失敗。watchを維持すれば回復時に自動で続きが録れるため止めない
    //（60秒以上沈黙が続けば下の監視タイマーがピル「GPSを待っています」で知らせる）
    if(!e || e.code!==1){ const el=$('#pGps'); if(el){ el.textContent='GPS 再取得中…'; el.className='pill off'; } return; }
    // 位置情報の許可が取り消された（回復不能）ときだけ停止する
    if(!stopWalk(true)){ toast('位置情報が使えなくなり、保存もできないため記録状態を保持しています（空き容量を確保してください）', 4000); return; }
    toast('位置情報が許可されていないため記録を停止しました。端末の設定を確認してください', 4000);
    const el=$('#pGps'); if(el){ el.textContent='GPS 取得不可'; el.className='pill off'; }
    const cur=STACK[STACK.length-1]||{}; if(cur.name==='survey') startGpsIndicator();   // 調査画面なら通常監視に復帰
  }, {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
  // 20秒ごとの下書き保存（静止中でも未保存の変更があれば保存する。点追加時だけの判定だと静止中に保存されない）。
  // あわせてGPSの沈黙を監視: 画面が表のまま60秒以上位置が届かなければピルを「GPSを待っています」に変える
  //（トーストは出さない——立ち止まり・樹冠下などで沈黙はあり得るため、控えめに色で知らせるだけ）
  walk.timer=setInterval(()=>{ if(WALK!==walk) return;
    if(routeTailFp()!==walk.savedFp) routeDraftSave();
    if(document.visibilityState==='visible'){
      const quiet=Date.now()-walk.lastFixAt>60000;
      if(quiet!==walk.stale){ walk.stale=quiet; renderWalkPill(); }
    }
  }, 20000);
  WALK=walk;
  _walkStarting=false;
  if(routeDraftSave()) SCREENS._dirty=false;   // 開始時点の状態を下書き化。成功したら「描く」での未保存扱いも解除
  toast('ルート記録を開始しました。他の画面に移っても記録は続きます（上の🚶が目印）', 3000);
  renderRouteCtrls(); renderWalkPill();
  walkWakeLock();   // 画面が消えると端末によっては記録が止まるため、可能なら点けたままにする
}
// 監視だけを強制停止する（保存はしない）。削除確定後など「続けても意味がない」場合の最終手段
function forceStopWalk(){
  const walk=WALK; if(!walk) return;
  if(walk.watchId!=null && navigator.geolocation){ try{ navigator.geolocation.clearWatch(walk.watchId); }catch(e){} }
  if(walk.timer){ clearInterval(walk.timer); }
  if(walk.wakeLock){ try{ const r=walk.wakeLock.release(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
  WALK=null; renderWalkPill();
}
// 停止＝「保存に成功してから監視を止める」。保存できないときは記録を続けたまま false を返す（データを失わない）
function stopWalk(silent){
  if(!WALK){ if(!silent) renderRouteCtrls(); return true; }
  const walk=WALK;
  if(routePath.length>=2){
    const s=DB.survey(walk.sv);
    if(s){
      const nowFp=JSON.stringify(s.route||[]);
      if(nowFp!==walk.baseFp &&
         !confirm('歩行中に、別の端末からこの調査のルート変更が届いています。今歩いた記録で置き換えますか？\n（キャンセル＝届いた内容を残す。歩いた分は下書きとして保持されます）')){
        // 置き換えない: 停止前に最新の歩行分を下書きへ確定し、routePathは届いた正規ルートに合わせる
        //（この後saveRouteが呼ばれても、届いたルートを上書きしない）。下書きに残せないなら停止しない（表示との食い違い防止）
        if(!routeDraftSave()){ toast('歩いた分を下書きに残せないため停止を中止しました（空き容量を確保してください）', 4000); return false; }
        routePath=(s.route||[]).filter(validPathPt);
        if(routeLayer) redrawRoute();
      } else {
        s.route=routePath.slice(); s.route_length_m=Math.round(pathLength(routePath));
        if(!DB.upsertSurvey(s)){
          toast('保存できないため記録を続けています。空き容量を確保してからもう一度停止してください', 4000);
          return false;   // WALKを維持＝watchもWakeLockも生きたまま。下書きも残る
        }
        routeDraftClear(walk.sv);
      }
    } else {
      // 調査が見つからない（削除済み等）→ 本保存はできないが、停止前に最新分を下書きへ確定して残す。
      // 下書きにも残せないなら停止しない（「保持されます」の表示と食い違わないように）
      if(!routeDraftSave()){ toast('歩いた分を下書きに残せないため停止を中止しました（空き容量を確保してください）', 4000); return false; }
    }
  }
  // 2点未満のときは下書きに触らない（過去の下書きを誤って消さない。不要な下書きは復元判定が整理する）
  if(walk.watchId!=null && navigator.geolocation){ try{ navigator.geolocation.clearWatch(walk.watchId); }catch(e){} }
  if(walk.timer){ clearInterval(walk.timer); }
  if(walk.wakeLock){ try{ const r=walk.wakeLock.release(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
  WALK=null;
  if(!silent){ toast('ルート記録を停止しました'); renderRouteCtrls(); }
  renderWalkPill();
  return true;
}
function saveRoute(svUuid){

        <!-- トレースの形。線＝飛んだ道すじ、面＝範囲を囲む（旋回上昇・行動範囲・営巣範囲）。
             既定は線。面のときだけ「面の種類」を出し、意味の無い飛翔高度は隠す -->
        <div class="two">
          <label class="field"><span class="lab">形</span>
            <select data-seg="shape" onchange="flightShapePick()">
              <option value="${esc(SHAPE_LINE)}" ${shapeOf(f)===SHAPE_LINE?'selected':''}>線（飛んだ道すじ）</option>
              <option value="${esc(SHAPE_AREA)}" ${shapeOf(f)===SHAPE_AREA?'selected':''}>面（範囲を囲む）</option>
            </select></label>
          <label class="field" id="flAreaTypeRow" style="display:none;"><span class="lab">面の種類</span>
            <select data-seg="area_type" onchange="SCREENS._dirty=true;">
              <option value="">未選択</option>
              ${AREA_TYPES.concat((f.area_type && !AREA_TYPES.includes(f.area_type))?[f.area_type]:[])
                .map(x=>`<option value="${esc(x)}" ${f.area_type===x?'selected':''}>${esc(x)}</option>`).join('')}
            </select></label>
        </div>
        <label class="field" id="flHeightRow"><span class="lab">飛翔高度</span>${segH('height_class',OPT.flightHeight)}</label>
        <label class="field"><span class="lab">行動（複数可）</span>${segB}</label>
        ${localOnly?`<input type="hidden" name="count" value="${esc(f.count==null||f.count===''?1:f.count)}">`:`<label class="field"><span class="lab">個体数</span>
          <input type="number" name="count" min="0" value="${esc(f.count==null||f.count===''?1:f.count)}"></label>`}
        <label class="field row" style="gap:12px; align-items:center;">
          <input type="checkbox" id="flReview" style="width:auto;" ${f.needs_review?'checked':''}>
          <span class="lab" style="margin:0;">要確認フラグ</span></label>
      </form>
      ${multiN>1
        ?'<div class="note">複数同時トレース中は録音・写真を付けられません。保存後に各経路を開いて追加してください。</div>'
        :`<div class="field"><span class="lab">録音</span><div id="recPanel"></div></div>
      <div class="field"><span class="lab">写真・動画</span><div id="mediaPanel"></div></div>`}
      <button class="btn primary big" onclick="saveFlight('${f.uuid}','${svUuid}',${editing},false)">${multiN>1?`まとめて保存する（${multiN}個体）`:'保存する'}</button>
      ${multiN>1?'':`<div class="sp"></div>
      ${localOnly?'':`<button class="btn" onclick="saveFlight('${f.uuid}','${svUuid}',${editing},'same')">＋ 保存して<b>同じ鳥</b>の続きを描く（見失って再発見）</button>`}
      <div class="sp"></div>
      ${localOnly?'':`<button class="btn" onclick="saveFlight('${f.uuid}','${svUuid}',${editing},true)">＋ 保存して<b>別の個体・種</b>を続けて描く</button>`}`}
      ${multiN>1?'':`<div class="sp"></div>
      ${localOnly?'':`<button class="btn" onclick="saveFlight('${f.uuid}','${svUuid}',${editing},'obs')">🌿 保存して、止まったところを観察に記録する</button>`}`}
      ${editing?`<div class="sp"></div><button class="btn danger" onclick="deleteFlight('${f.uuid}')">この飛翔経路を削除</button>`:''}
    `,
    onMount:()=>{ SCREENS._chosenId=f.species_id||''; flightPath=(f.path||[]).slice();
      { const _tr=(!editing && SCREENS._ftracks)?SCREENS._ftracks[SCREENS._ftIdx]:null;   // 複数羽トレースはトラックの履歴を戻す
        flightOps=(_tr && Array.isArray(_tr.ops))?_tr.ops.slice():[]; }
      flightShape=shapeOf(f); flightShapeSyncUI();   // 画面をまたいで残らないよう、開くたびに形を入れ直す
      SCREENS._audio=(f.audio||[]).slice(); SCREENS._media=(f.media||[]).slice();
      SCREENS._mediaCtx = multiN>1 ? null : {kind:'flight', uuid:f.uuid, sv:svUuid};   // 複数トレース中はメディアの持ち主を作らない
      SCREENS._flightSelf=f.uuid; SCREENS._flightSv=svUuid; SCREENS._flightEditing=editing;
      const flEl=$('#flForm'); if(flEl){ ['input','change'].forEach(ev=>flEl.addEventListener(ev, ()=>{ SCREENS._dirty=true; })); }   // 種名・時刻・メモ等の変更検知
      if(SCREENS._ftracks && SCREENS._ftDirty) SCREENS._dirty=true;   // トラック切り替えの再描画で未保存状態を引き継ぐ
      if($('#recPanel')) renderRecPanel(); if($('#mediaPanel')) renderMediaPanel();
      updateSpRefLinks(f.species_name_snapshot||''); _mapTimer=setTimeout(()=>initFlightMap(),50); }
  };
};
/* ---------- 複数羽同時トレース（トラック切り替え） ----------
   1トラック＝保存時に1つの飛翔経路レコード。切り替えは「フォーム値＋経路を退避 → 再描画」で行い、
   描画・十字・undo など既存部品をそのまま使う。既存レコードの編集では使わない（単線のまま） */
function stashFlightTrack(){
  const tr=(SCREENS._ftracks||[])[SCREENS._ftIdx]; if(!tr) return;
  const g=n=>{ const el=$(`#flForm [name="${n}"]`); return el?el.value:''; };
  const name=(($('#spInput')&&$('#spInput').value)||'').trim();
  const behSet=[...document.querySelectorAll('#flForm [data-seg="behavior"] button.on')].map(b=>b.textContent);
  tr.path=flightPath.slice();
  tr.ops=flightOps.slice();   // 操作の履歴もトラックと一緒に退避する（切り替えて戻っても1操作ずつ戻せる）
  tr.fields={
    species_id: name ? (SCREENS._chosenId||'') : '', species_name_snapshot: name,
    age_class: segVal('age_class'), individual_label:(g('individual_label')||'').trim(),
    start_time: g('start_time')||'', end_time: g('end_time')||'',
    // 形はトラックごとに持つ（切り替えても面が線に戻らない）。面に飛翔高度は持たせない
    shape: flightIsArea()?SHAPE_AREA:SHAPE_LINE,
    area_type: flightIsArea()?(segVal('area_type')||''):'',
    height_class: flightIsArea()?'':segVal('height_class'),
    behavior: otherMerge(behSet.join('・'),'behavior'),
    count: g('count')||'', memo:(g('memo')||'').trim(),
    needs_review: $('#flReview')?$('#flReview').checked:false,
    audio:(SCREENS._audio||[]).slice(), media:(SCREENS._media||[]).slice(),
  };
}
function switchFlightTrack(i){
  if(!SCREENS._ftracks || i===SCREENS._ftIdx || !SCREENS._ftracks[i]) return;
  // 録音中（マイク許可待ち含む）の切り替えは再描画で録音が無警告に消えるため止める
  if(recBusy()){ toast('録音中はタブを切り替えられません。先に録音を停止してください'); return; }
  stashFlightTrack();
  if(SCREENS._dirty) SCREENS._ftDirty=true;   // render()が_dirtyを消すため、未保存の事実をここで覚える
  SCREENS._ftIdx=i; SCREENS._ftKeep=true; render();
}
function addFlightTrack(){
  if(!SCREENS._ftracks) return;
  // 録音・写真が絡む状態で複数トレースへ入ると、メディアの持ち主（仮レコード・ghost）と
  // トラック状態が競合する。構造的に避けるため、この場合は1羽ずつの保存へ誘導する
  if(recBusy()){ toast('録音中は個体を追加できません。先に録音を停止してください'); return; }
  if((SCREENS._audio&&SCREENS._audio.length)||(SCREENS._media&&SCREENS._media.length)||SCREENS._ghost){
    toast('録音・写真を付けた経路は複数同時トレースにできません。先にこの経路を保存してから、次の個体を記録してください', 4500); return; }
  stashFlightTrack();
  if(SCREENS._dirty) SCREENS._ftDirty=true;
  const prev=(SCREENS._ftracks[SCREENS._ftIdx]||{}).fields||{};
  const st=prev.start_time||localDatetimeValue();   // 同時観察なので開始時刻は揃える
  // 追加した個体は別の鳥なので、元の観察との結び付き（目印）は引き継がない
  SCREENS._ftracks.push({ uuid:uuid(), path:[], st0:st, indKey:'', fields:{
    species_id:'', species_name_snapshot:'', age_class:'不明', individual_label:'',
    start_time: st, end_time:'',
    height_class:'不明', behavior:'', count:1, memo:'', needs_review:false, audio:[], media:[] } });
  SCREENS._ftIdx=SCREENS._ftracks.length-1; SCREENS._ftKeep=true; render();
}
// 複数トラックの一括保存。1件でも失敗したらそこで止める（保存済み件数は知らせる）
function saveFlightMulti(svUuid){
  if(recBusy()){ toast('録音の処理中です。終わってから保存してください', 5000); return; }
  if(mediaBusy()){ toast('写真・動画の取り込み中です。終わってから保存してください', 5000); return; }
  stashFlightTrack();
  const tracks=SCREENS._ftracks||[];
  const act=[];
  for(let i=0;i<tracks.length;i++){ const tr=tracks[i]; const fl=tr.fields||{};
    const pts=(tr.path||[]).filter(validPathPt);
    // 「空」＝すべての入力が初期値のまま。1項目でも入力があれば空扱いにしない（黙って捨てない）
    const untouched = !pts.length && !(fl.species_name_snapshot||'').trim() && !(fl.memo||'').trim()
      && !(fl.individual_label||'').trim() && !(fl.end_time||'') && !(fl.behavior||'')
      && !fl.needs_review && (!fl.age_class||fl.age_class==='不明') && (!fl.height_class||fl.height_class==='不明')
      && shapeOf(fl)===SHAPE_LINE && !(fl.area_type||'')   // 形を面に変えたら「操作あり」
      && (String(fl.count==null?'':fl.count).trim()===''||String(fl.count)==='1')
      && String(fl.start_time||'')===String(tr.st0||'')   // 開始時刻を初期値から変えたら「操作あり」
      && !((fl.audio&&fl.audio.length)||(fl.media&&fl.media.length));
    if(untouched) continue;   // 完全に手つかずのトラックだけ除外
    const label=(fl.species_name_snapshot||'').trim()||('個体'+(i+1));
    const need=minPointsFor(shapeOf(fl));   // 線2点・面3点。判定は1か所に任せる
    if(pts.length<need){ toast(`${i+1}番目のトラック（${label}）の${shapeOf(fl)}が${need}点未満です。地図で描くか、タブを切り替えて内容を消してください`, 4500); return; }
    if(shapeOf(fl)===SHAPE_AREA){
      // 面は「囲めていること」と「種類が選んであること」が要る（他の保存経路と同じ決まり）
      const pb=areaProblem(pts);
      if(pb){ toast(`${i+1}番目のトラック（${label}）が面になっていません（${pb}）`, 5000); return; }
      if(!(fl.area_type||'')){ toast(`${i+1}番目のトラック（${label}）の面の種類を選んでください`, 5000); return; }
    }
    if(String(fl.count).trim()!==''){ const n=Number(fl.count);
      if(!Number.isInteger(n) || n<0){ toast(`${i+1}番目のトラック（${label}）の個体数は0以上の整数で入力してください`); return; } }
    act.push({i,tr});
  }
  if(!act.length){ toast('地図で2点以上の経路を描いてから保存してください'); return; }
  // 同じ種名でラベルが全て空のトラック群には 個体A/B/… を自動付与（色分け「個体」で区別できるように）。
  // 元データ（tr.fields）は書き換えず保存レコードにだけ載せる（途中失敗→再試行でラベルが片寄るのを防ぐ）
  const byName={};
  act.forEach(a=>{ const n=(a.tr.fields.species_name_snapshot||'').trim();
    (byName[n]=byName[n]||[]).push(a); });
  Object.keys(byName).forEach(n=>{ const g=byName[n];
    if(n && g.length>1 && g.every(a=>!(a.tr.fields.individual_label||'').trim())){
      // 自動の名前は「その調査・その種でまだ使っていないもの」を選ぶ。
      // いつもAから振ると、別の機会に描いた別個体が同じ名前になり、同じ1羽として数えられてしまう
      const used=new Set(indLabelsOf(svUuid, n).filter(x=>x.sp===n).map(x=>x.label));
      let j=0;
      g.forEach(a=>{
        let lb='';
        while(j<1000){
          lb = j<26 ? ('個体'+String.fromCharCode(65+j)) : ('個体'+(j+1)); j++;
          if(!used.has(lb)) break;
          lb='';
        }
        while(!lb || used.has(lb)) lb='個体'+uuid();   // 使い切ったら、未使用になるまで一意の名前を作る
        used.add(lb); a.autoLabel=lb;
      });
    }});
  // 個体名の解決は書き込みの前に全トラックぶんまとめて行う（途中で条件が変わらないように）
  // 同じ「種名＋個体名」のトラックは1つの個体。組ごとに1回だけ解決し、同じ目印を配る
  //（トラックごとに解決すると、同じ一括保存の中で同名なのに別々の目印になってしまう）
  const indPre=new Map();        // トラック → 目印
  const indFixTrack=new Map();   // トラック → 揃え直しが残るか（要確認を付ける対象）
  const indGroups=[];            // 確認のあとで解き直すための控え
  let indFixTotal=0;
  {
    const byInd=new Map();
    act.forEach(a=>{
      const fl=a.tr.fields;
      const nm=(fl.species_name_snapshot||'').trim();
      const lb=(fl.individual_label||'').trim()||a.autoLabel||'';
      const gk=JSON.stringify([lb, nm]);
      if(!byInd.has(gk)) byInd.set(gk, {nm, lb, list:[]});
      byInd.get(gk).list.push(a);
    });
    byInd.forEach(g=>{
      if(!g.lb){ g.list.forEach(a=>{ indPre.set(a.tr.uuid, a.tr.indKey||''); indFixTrack.set(a.tr.uuid, false); }); return; }
      const seed=(g.list.find(a=>a.tr.indKey)||{tr:{}}).tr.indKey||'';
      const r=flIndKeyFor(svUuid, g.nm, g.lb, seed, g.list[0].tr.uuid);
      indFixTotal+=r.fixN;
      const key=r.key||seed||uuid();
      g.list.forEach(a=>{ indPre.set(a.tr.uuid, key); indFixTrack.set(a.tr.uuid, r.fixN>0); });
      indGroups.push({ nm:g.nm, lb:g.lb, seed, key, fixN:r.fixN, found:r.found, head:g.list[0].tr.uuid });
    });
  }
  if(!flIndWarn(indFixTotal)) return;
  // 確認のあいだに状況が変わっていないか、書き込みの直前に組ごとに確かめ直す
  for(const g of indGroups){
    const re=flIndKeyFor(svUuid, g.nm, g.lb, g.seed, g.head);
    if(re.found!==g.found || (re.found && re.key!==g.key) || re.fixN!==g.fixN){
      toast('同じ個体名の記録の状況が変わりました。画面を開き直してから保存してください', 8000); return; }
  }
  // 取引化: 控え→覆い→全件書き込み→一拍→全文検証→完了/補償（統合画面の保存と同じ順序）
  const mUndo=[];   // {uuid, prev, wroteRec}
  const mRollback=()=>{
    let okAll=true;
    let arr=null;
    if(typeof GUARD_SNAP!=='undefined' && Object.prototype.hasOwnProperty.call(GUARD_SNAP, DB.key.fl)){
      try{ const v=JSON.parse(GUARD_SNAP[DB.key.fl]); if(Array.isArray(v)) arr=v; }catch(_){ }
    } else arr=loadStrict(DB.key.fl);
    if(!arr) return false;   // 読めない・合成の基準が壊れている＝触らない
    for(let i=mUndo.length-1;i>=0;i--){ const e=mUndo[i];
      const idx=arr.findIndex(x=>x&&x.uuid===e.uuid);
      const curJson= idx>=0 ? JSON.stringify(arr[idx]) : '';
      if(idx>=0 && curJson===e.wroteRec){ if(e.prev) arr[idx]=e.prev; else arr.splice(idx,1); }
      else if((idx<0 && !e.prev) || (idx>=0 && e.prev && curJson===JSON.stringify(e.prev))){ }
      else okAll=false;
    }
    if(!DB.save(DB.key.fl, arr)) okAll=false;
    for(const e of mUndo){
      const a2=loadStrict(DB.key.fl);
      if(!a2){ okAll=false; continue; }
      const cur=a2.find(x=>x&&x.uuid===e.uuid);
      if(e.prev ? JSON.stringify(cur)!==JSON.stringify(e.prev) : !!cur) okAll=false;
    }
    return okAll;
  };
  SAVE_BUSY=true; saveBusyShow(true);
  if(typeof GUARD_CONFLICT!=='undefined'){ GUARD_CONFLICT=false; GUARD_SNAP={}; }   // この保存の間の競合だけを見る
  if(typeof BACKUP_GEN!=='undefined'){ BACKUP_GEN++; _backupPending=true; _folderPending=true; }   // 作成中のバックアップを無効化し、確定点で予約し直す
  // 取引の第1段: 書く前の姿を控える（途中終了は起動時に取引ごと中止できる）。
  // 各記録を書くたびに進み具合（wroteRec）も書き足す
  const arrPreM=loadStrict(DB.key.fl);
  if(!arrPreM){ SAVE_BUSY=false; saveBusyShow(false);
    toast('記録の読み込みに失敗したため、保存を中止しました。データ点検・修復画面で確認してください', 8000);
    return; }
  const plannedM=new Map();
  act.forEach(a=>{
    const cur=arrPreM.find(x=>x&&x.uuid===a.tr.uuid);
    plannedM.set(a.tr.uuid, { key:DB.key.fl, uuid:a.tr.uuid, prev: cur?JSON.parse(JSON.stringify(cur)):null, wroteRec:'' });
  });
  const jM={ t: nowISO(), tx: uuid(), phase:'writing', undo: Array.from(plannedM.values()), fl:null, ghost:null };
  CUR_TX=jM.tx;
  if(!saveJournalSet(jM)){
    SAVE_BUSY=false; saveBusyShow(false);
    toast('空き容量が足りず、保存を開始できませんでした。空き容量を確保してからやり直してください', 8000);
    return;
  }
  for(const a of act){ const fl=a.tr.fields;
    const name=(fl.species_name_snapshot||'').trim();
    const rec={ uuid:a.tr.uuid, survey_uuid:svUuid,
      species_id: name?(fl.species_id||''):'', species_name_snapshot:name,
      path:(a.tr.path||[]).slice(),
      start_time:fl.start_time||'', end_time:fl.end_time||'',
      shape:shapeOf(fl), area_type:(shapeOf(fl)===SHAPE_AREA)?(fl.area_type||''):'',
      // 面には飛翔高度の意味がないので、既定の「不明」も入れない
      height_class:(shapeOf(fl)===SHAPE_AREA)?'':(fl.height_class||'不明'), age_class:fl.age_class||'不明',
      individual_label:(fl.individual_label||'').trim()||a.autoLabel||'', behavior:fl.behavior||'',
      count:fl.count||'', memo:(fl.memo||'').trim(),
      // 要確認は「揃え直しが残る組」のトラックにだけ付ける
      needs_review:(!!fl.needs_review || !!indFixTrack.get(a.tr.uuid)),
      // 観察から引き継いだ結び付きはそのトラックだけが持つ。
      // 個体名を付けたトラックは、同じ調査・同じ種の同名がすでにあればその目印に合わせる（＝同じ1羽）
      individual_key: indPre.get(a.tr.uuid) || a.tr.indKey || '',
      audio:fl.audio||[], media:fl.media||[] };
    const arrWM=loadStrict(DB.key.fl);
    if(!arrWM){
      if(mRollback() && saveJournalClear(jM.tx)){ SAVE_BUSY=false; saveBusyShow(false);
        toast('記録の読み込みに失敗したため、保存を中止しました。データ点検・修復画面で確認してください', 8000); }
      else saveFatalHalt();
      return;
    }
    const iWM=arrWM.findIndex(x=>x&&x.uuid===rec.uuid);
    const prev0=(iWM>=0)?JSON.parse(JSON.stringify(arrWM[iWM])):null;
    rec.updated_at=nowISO(); if(iWM<0){ if(!rec.created_at) rec.created_at=nowISO(); arrWM.push(rec); } else arrWM[iWM]=rec;
    // 予定値と「書く直前の姿」を書く前に控える（復旧が自分の書き込みを識別できるように）
    {
      const peM0=plannedM.get(rec.uuid);
      if(peM0){ peM0.prev=prev0; peM0.expectedRec=stableJson(rec);
        if(!saveJournalSet(jM)){
          if(mRollback() && saveJournalClear(jM.tx)){ SAVE_BUSY=false; saveBusyShow(false);
            toast('空き容量が足りず、保存を安全に完了できませんでした。空き容量を確保してからやり直してください', 8000); }
          else saveFatalHalt();
          return;
        }
      }
    }
    if(!DB.save(DB.key.fl, arrWM)){
      // 途中で失敗したら、先に書けた分も全部戻す（一部だけ確定させない）
      if(mRollback() && saveJournalClear(jM.tx)){ SAVE_BUSY=false; saveBusyShow(false);
        toast('保存に失敗しました。空き容量を確保してからもう一度保存してください', 4500); }
      else saveFatalHalt();
      return;
    }
    const aNM=loadStrict(DB.key.fl);
    const now=aNM?(aNM.find(x=>x&&x.uuid===rec.uuid)||null):null;
    if(!now || stableJson(now)!==stableJson(rec)){
      // 書けていない、または書けたのが自分の値でない（横から上書きされた）
      if(mRollback() && saveJournalClear(jM.tx)){ SAVE_BUSY=false; saveBusyShow(false);
        toast('保存に失敗しました。もう一度保存してください（空き容量も確認）', 4500); }
      else saveFatalHalt();
      return;
    }
    // 先に mUndo へ入れる（進み具合の控えに失敗しても、この1件を含めて全部戻せるように）
    mUndo.push({ uuid:rec.uuid, prev: prev0?JSON.parse(JSON.stringify(prev0)):null, wroteRec: JSON.stringify(now) });
    // 進み具合を控える（復旧が「自分の書いた分」を確かめられるように）
    const peM=plannedM.get(rec.uuid);
    if(peM){ peM.wroteRec=JSON.stringify(now);
      if(!saveJournalSet(jM)){
        if(mRollback() && saveJournalClear(jM.tx)){ SAVE_BUSY=false; saveBusyShow(false);
          toast('空き容量が足りず、保存を安全に完了できませんでした。空き容量を確保してからやり直してください', 8000); }
        else saveFatalHalt();
        return;
      }
    }
    // 保存できたトラックを記録（後で破棄しても保存済みレコードを破棄済み名簿に入れないため）
    (SCREENS._ftSaved=SCREENS._ftSaved||new Set()).add(a.tr.uuid);
  }
  // 取引の第2段: 全件書けた（控え付き）。途中終了しても起動時に検証して片付けられる
  if(!saveJournalSet({ t: nowISO(), tx: jM.tx, phase:'written',
      undo: mUndo.map(e=>({key:DB.key.fl, uuid:e.uuid, prev:e.prev, wroteRec:e.wroteRec})),
      fl:null, ghost:null })){
    if(mRollback() && saveJournalClear(jM.tx)){ SAVE_BUSY=false; saveBusyShow(false);
      toast('空き容量が足りず、保存を安全に完了できませんでした。空き容量を確保してからやり直してください', 8000); }
    else saveFatalHalt();
    return;
  }
  (async ()=>{
    await new Promise(r=>setTimeout(r,0));   // 別のタブの書き込み通知（storage）が届くのを一拍待つ
    const aVM=loadStrict(DB.key.fl);
    const bad=!aVM || mUndo.some(e=>{
      const cur=aVM.find(x=>x&&x.uuid===e.uuid);
      return !cur || JSON.stringify(cur)!==e.wroteRec;
    }) || (typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT);
    if(bad){
      if(mRollback() && saveJournalClear(jM.tx)){ SAVE_BUSY=false; saveBusyShow(false);
        toast('別のタブによる書き換えを検知したため、この保存を取り消しました。内容を確認してから保存し直してください', 9000); }
      else saveFatalHalt();
      return;
    }
    if(!saveJournalClear(jM.tx)){ saveFatalHalt('保存の控えを片付けられませんでした。'); return; }
    SAVE_BUSY=false; saveBusyShow(false); backupConfirmPoint();
    act.forEach(a=>{ const n=(a.tr.fields.species_name_snapshot||'').trim(); if(n) DB.pushRecent(n); });
    SCREENS._audio=null; SCREENS._media=null; SCREENS._mediaCtx=null;
    SCREENS._ftracks=null; SCREENS._ftDirty=false; SCREENS._ftSaved=null; SCREENS._dirty=false;
    toast(`${mUndo.length}本の飛翔経路を保存しました`);
    goBack();

}
// 折れ線を滑らかな曲線に（Chaikin法。始点・終点は保持。生データは変えず表示・書き出しにだけ使う）
function smoothPath(pts, iterations){
  pts=(pts||[]).filter(p=>Array.isArray(p)&&p.length===2);
  if(pts.length<3) return pts.slice();
  let cur=pts.slice();
  const n=(iterations==null)?2:iterations;
  for(let it=0; it<n; it++){
    const next=[cur[0]];
    for(let i=0;i<cur.length-1;i++){
      const a=cur[i], b=cur[i+1];
      next.push([a[0]*0.75+b[0]*0.25, a[1]*0.75+b[1]*0.25]);
      next.push([a[0]*0.25+b[0]*0.75, a[1]*0.25+b[1]*0.75]);
    }
    next.push(cur[cur.length-1]);
    cur=next;
  }
  return cur;
}
// 緯度経度が有効な数値か（不正な文字列でLeafletが例外を投げ地図全体が壊れるのを防ぐ）
// parseFloat('35abc')=35 のような部分一致は弾く（純粋な数値表記のみ許可）＋範囲チェック
const _numRe=/^[+-]?\d+(\.\d+)?$/;
function validLatLon(lat,lon){ const sa=String(lat).trim(), sb=String(lon).trim();
  if(!_numRe.test(sa)||!_numRe.test(sb)) return false;
  const a=parseFloat(sa), b=parseFloat(sb);
  return a>=-90&&a<=90&&b>=-180&&b<=180; }
// 日本のおおよその範囲（緯度20〜46・経度122〜154）。国内調査前提の常識チェック用
//（緯度と経度の取り違え・貼り付けミスの検出が目的。保存は止めず「要確認」を付けるだけ）
function inJapanBounds(lat,lon){ const a=parseFloat(lat), b=parseFloat(lon);
  return a>=20&&a<=46&&b>=122&&b<=154; }
function validPathPt(p){ if(!Array.isArray(p)||p.length!==2) return false;

function distMeters(a,b){
  const R=6371000, toR=Math.PI/180;
  const dLat=(b[0]-a[0])*toR, dLon=(b[1]-a[1])*toR;
  const s=Math.sin(dLat/2)**2 + Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));

function pathLength(path){ let d=0; const p=(path||[]).filter(x=>Array.isArray(x)&&x.length===2);

function fmtDist(d){ return d>=1000?(d/1000).toFixed(2)+'km':Math.round(d)+'m'; }

/* ---------- トレースの「形」（線 / 面） ----------

   面は**閉じた線**なので、保存・同期・削除・まとめは今までの仕組みがそのまま効く。

   **読み方を1か所に集める。** 線は長さ、面は面積。混ぜると
   「画面ごとに数字が違う」（2026-08-04 全体監査で潰した穴）が再発する。 */

function shapeOf(f){ return (f && f.shape===SHAPE_AREA) ? SHAPE_AREA : SHAPE_LINE; }
function isArea(f){ return shapeOf(f)===SHAPE_AREA; }

function minPointsFor(shape){ return shape===SHAPE_AREA ? 3 : 2; }

// 球面上の多角形の面積（m²）。始点と終点が違っても閉じたものとして計算する
function pathArea(path){
  const p=(path||[]).filter(validPathPt);
  if(p.length<3) return 0;
  const R=6378137, toR=Math.PI/180;
  let s=0;
  for(let i=0;i<p.length;i++){
    const a=p[i], b=p[(i+1)%p.length];
    s += (b[1]-a[1])*toR * (2 + Math.sin(a[0]*toR) + Math.sin(b[0]*toR));

   囲んだ範囲が定まらず、面積も打ち消し合って実際より小さく出る。
   データベース側 `app/geometry.py` と**同じ決まり**にしてある。 */

function ringShoelace(path){

// 線分が交わるか。**端どうしが触れる場合・重なる場合も含む**

function segSide(p,q,r){ const v=(q[1]-p[1])*(r[0]-p[0])-(q[0]-p[0])*(r[1]-p[1]);

function segCross(a,b,c,d){
  const s1=segSide(a,b,c), s2=segSide(a,b,d), s3=segSide(c,d,a), s4=segSide(c,d,b);
  if(s1!==s2 && s3!==s4) return true;
  if(s1===0 && segOn(a,b,c)) return true;
  if(s2===0 && segOn(a,b,d)) return true;
  if(s3===0 && segOn(c,d,a)) return true;
  if(s4===0 && segOn(c,d,b)) return true;

function ringSelfIntersects(path){
  const p=(path||[]).filter(validPathPt); const n=p.length;

  for(let i=0;i<n;i++){ const a=p[i], b=p[(i+1)%n];
    for(let j=i+1;j<n;j++){
      if(j===i || (j+1)%n===i || j===(i+1)%n) continue;   // 端を共有する線分は対象外
      if(segCross(a,b,p[j],p[(j+1)%n])) return true;
    } }

// 面として保存できない理由。保存できるなら空文字
function areaProblem(path){
  let p=(path||[]).filter(validPathPt);

  if(p.length>1 && p[0][0]===p[p.length-1][0] && p[0][1]===p[p.length-1][1]) p=p.slice(0,-1);
  if(p.length<3) return `点が${p.length}つしかありません（面は3点以上）`;
  if(ringDistinct(p)<3) return '同じ場所の点ばかりで囲めていません';
  // 重なった点は長さ0の線を作り、輪が自分自身に接する
  if(ringDistinct(p)!==p.length) return '同じ場所の点が2回使われています（1つ戻して置き直してください）';
  // 交差の判定を先に。左右対称の蝶ネクタイ形は面積が打ち消し合って0になるため
  if(ringSelfIntersects(p)) return '囲んだ線が交差しています（順に囲み直してください）';
  if(Math.abs(ringShoelace(p))<1e-12) return '点が一直線に並んでいて囲めていません';

}
function fmtArea(m2){
  if(m2>=1000000) return (m2/1000000).toFixed(2)+'km²';
  if(m2>=10000) return (m2/10000).toFixed(2)+'ha';
  return Math.round(m2)+'m²';
}

function traceMetric(f){

      if(trArea && p.length>2) L.polygon(p,{color:col,weight:2.5,opacity:.8,fill:false}).addTo(flightLayer);
      else if(p.length>1) L.polyline(p,{color:col,weight:3,opacity:.8}).addTo(flightLayer);
      if(p.length && !trArea) L.circleMarker(p[p.length-1],{radius:5,color:'#fff',weight:1,fillColor:col,fillOpacity:1}).addTo(flightLayer);
    });
  }
  if(flightPath.length){
    const badge=(txt,bg)=>L.divIcon({className:'',html:`<div style="background:${bg};border:2px solid #fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5)">${txt}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
    if(flightIsArea()){
      // 面は閉じて描く。**塗らない**（報告書の結果図に合わせる）。
      // **始点・終点は出さない**（どこが始まりでも同じ図になる）
      if(flightPath.length>2){
        // 旋回上昇は ◎（きれいな二重丸）。囲った形は薄く残す
        if(segVal('area_type')==='旋回上昇' && drawSoar(flightLayer, flightPath, {color:'#9b59b6'})){
          L.polygon(flightPath,{color:'#9b59b6',weight:1,opacity:.35,fill:false,dashArray:'4,4'}).addTo(flightLayer);
        } else {
          L.polygon(flightPath,{color:'#9b59b6',weight:2.5,opacity:.95,fill:false}).addTo(flightLayer);
        }
      }
      else if(flightPath.length>1) L.polyline(flightPath,{color:'#9b59b6',weight:3,opacity:.6,dashArray:'5,4'}).addTo(flightLayer);
      flightPath.forEach(p=>L.circleMarker(p,{radius:4,color:'#fff',weight:1,fillColor:'#9b59b6',fillOpacity:1}).addTo(flightLayer));
      L.marker(flightPath[0],{icon:badge('面','#9b59b6')}).addTo(flightLayer);
    } else {
      // 向きは**矢印**で示す。始・終の丸い印はやめた（2026-08-13 指摘）
      if(flightPath.length>1){
        L.polyline(flightPath,{color:'#e0a030',weight:4,opacity:.9}).addTo(flightLayer);
        flightArrowPts(flightPath).forEach(a=>
          L.marker(a.p,{icon:flightArrowIcon(a.b,'#e0a030'), interactive:false, rotateWithView:true}).addTo(flightLayer));
      }
      flightPath.forEach(p=>L.circleMarker(p,{radius:4,color:'#fff',weight:1,fillColor:'#e0a030',fillOpacity:1}).addTo(flightLayer));
    }
  }
  const info=$('#fInfo');
  if(info){
    const multi=(SCREENS._ftracks&&SCREENS._ftracks.length>1)?`（全${SCREENS._ftracks.length}個体・表示中のタブに点が入ります）`:'';
    // 大きさの読み方は traceMetric に一本化する（線は長さ・面は面積）
    const m=traceMetric({shape:flightShape, path:flightPath});
    const need=minPointsFor(flightShape);
    const size = flightIsArea()
      ? (flightPath.length>=need ? `面積 約${m.text}` : `あと${need-flightPath.length}点で面になります`)
      : `全長 約${m.text}`;
    info.textContent = flightPath.length ? `${flightPath.length}点 ・ ${size}${multi}`
      : (flightCrossMode
          ? `まだ点がありません。地図を動かして「点を追加」で${flightIsArea()?'囲んで':'描いて'}ください。`
          : `まだ点がありません。地図をタップして${flightIsArea()?'囲んで':'描いて'}ください。`)+multi; }
}
function flightUndo(){
  if(!flightPath.length) return;
  if(flSoarBlocked()) return;
  // 最後の1操作ぶんを戻す。履歴が点の数と食い違っていたら（開いたときから有る点など）1点だけ戻す
  let n=1;
  if(flightOps.length){ const k=flightOps[flightOps.length-1]; if(k>=1 && k<=flightPath.length){ n=k; flightOps.pop(); } else flightOps=[]; }
  flightPath.splice(flightPath.length-n, n); SCREENS._dirty=true; redrawFlight();
}
function flightClear(){ if(!flightPath.length) return; if(flSoarBlocked()) return; if(!confirm('描いた線を全部消しますか？')) return; flightPath=[]; flightOps=[]; SCREENS._dirty=true; redrawFlight(); }
function saveFlight(u,svUuid,editing,cont){
  // 録音中に保存→遷移すると離脱確認と衝突して履歴・録音状態が崩れるため、先に停止してもらう。
  // 録音本体の保存待ち・写真動画の取り込み待ちの間も始めない
  //（保存成功の後に添付処理が続くと、途中終了で実体が結び付かないまま失われる）
  if(recBusy()){ toast('録音の処理中です。終わってから保存してください', 5000); return; }
  if(mediaBusy()){ toast('写真・動画の取り込み中です。終わってから保存してください', 5000); return; }
  if(!editing && SCREENS._ftracks && SCREENS._ftracks.length>1){ saveFlightMulti(svUuid); return; }   // 複数羽トレースは一括保存へ
  // 添付・メモ専用（localOnly）で開いた既存の短い経路は、経路を触っていなければそのまま保存できる。
  // **形を変えたときは免除しない**——免除すると、2点の線を面に変えて保存でき、
  // 3点未満の面（囲えない図形）ができてしまう
  const _flPrev = editing ? (DB.flight(u)||{}) : {};
  const _flPathSame = SCREENS._flLocalOnly && editing
    && JSON.stringify(flightPath)===JSON.stringify(_flPrev.path||[])
    && flightShape===shapeOf(_flPrev);
  // 保存できる最小の点数は形で変わる（線2点・面3点）。判定は minPointsFor に任せる
  const _flNeed=minPointsFor(flightShape);
  if(flightPath.length<_flNeed && !_flPathSame){
    toast(`地図で${_flNeed}点以上${flightIsArea()?'囲んで':'描いて'}から保存してください`); return; }
  // 面は「囲めていること」と「種類が選んであること」が要る（統合画面と同じ決まり）
  if(flightIsArea() && !_flPathSame){
    const _pb=areaProblem(flightPath);
    if(_pb){ toast(`面になっていません（${_pb}）`, 6000); return; }
  }
  if(flightIsArea() && !(segVal('area_type')||'')){
    toast('面の種類を選んでください（旋回上昇・概略行動範囲など）。'
      +'種類によって個体数に数えるかどうかが変わります', 6000); return; }
  const name=(($('#spInput')&&$('#spInput').value)||'').trim();
  const g=n=>{ const el=$(`#flForm [name="${n}"]`); return el?el.value:''; };
  // 個体数: 観察入力と同じ検査（従来は文字列のまま無検証で保存され、書き出しにそのまま出ていた）。
  // 切り捨てず元の値で検査する（-0.5→-0の負数すり抜けを防ぐ）
  // 添付・メモ専用（localOnly）は個体数の欄が無い（隠し欄）。検査で止めると
  // 既存・取込記録の値が直せないまま添付やメモまで保存できなくなるため、検査しない
  //（値は保存時に元のまま保たれる）
  if(!(SCREENS._flLocalOnly && editing)){
    const fcEl=$('#flForm [name="count"]');
    if(fcEl && fcEl.validity && fcEl.validity.badInput){ toast('個体数は数値で入力してください'); return; }
    if(fcEl && fcEl.value.trim()!==''){ const fcN=Number(fcEl.value);
      if(!Number.isInteger(fcN) || fcN<0){ toast('個体数は0以上の整数で入力してください'); return; } }
  }
  const behSet=[...document.querySelectorAll('[data-seg="behavior"] button.on')].map(b=>b.textContent);
  const behavior=otherMerge(behSet.join('・'),'behavior');
  const prev=editing?DB.flight(u):{uuid:u};
  let age=segVal('age_class'), individual=(g('individual_label')||'').trim(), height=segVal('height_class');
  // 形と面の種類。**面に飛翔高度は持たせない／線に戻したら面の種類は空にする**
  //（種類が残ると、線なのに書き出しで面として扱われる）
  const shapeNew=flightIsArea()?SHAPE_AREA:SHAPE_LINE;
  const areaTypeNew=(shapeNew===SHAPE_AREA)?(segVal('area_type')||''):'';
  if(shapeNew===SHAPE_AREA) height='';
  // 時刻は、欄の値が「開いたとき表示した値のまま」なら元の文字列を保つ
  //（表示は分単位に丸めているため、無操作の保存で秒や時差の情報を失わないように）
  const t0=SCREENS._flTime0||{start:'',end:'',dispStart:'',dispEnd:''};
  const stIn=g('start_time')||'', enIn=g('end_time')||'';
  const stOut=(editing && stIn===t0.dispStart) ? t0.start : stIn;
  const enOut=(editing && enIn===t0.dispEnd) ? t0.end : enIn;
  // 個体名を付けたら、同じ調査・同じ種の同名と同じ目印にする（統合画面と同じ規則）
  const _flInd = (SCREENS._flLocalOnly && editing)
    ? { key:(prev.individual_key||''), fixN:0 }   // 添付・メモ専用では個体名を触らせない
    : flIndKeyFor(svUuid, name, individual, (prev.individual_key||''), u);
  if(!flIndWarn(_flInd.fixN)) return;
  if(!(SCREENS._flLocalOnly && editing)){
    // 書き込みの直前にもう一度解き直す（確認を出していなくても、その間に
    // 別のタブが同じ名前の記録を足していることがある）
    const _re=flIndKeyFor(svUuid, name, individual, (prev.individual_key||''), u);
    if(_re.found!==_flInd.found || (_re.found && _re.key!==_flInd.key) || _re.fixN!==_flInd.fixN){
      toast('同じ個体名の記録の状況が変わりました。画面を開き直してから保存してください', 8000); return; }
  }
  const rec=Object.assign({},prev,{ uuid:u, survey_uuid:svUuid,
    species_id: name ? (SCREENS._chosenId||'') : '', species_name_snapshot:name,   // 種名が空なら種IDも空（観察側と同じ保証）
    path:flightPath.slice(),
    start_time:stOut, end_time:enOut,
    shape:shapeNew, area_type:areaTypeNew,
    height_class:height,
    age_class:age, individual_label:individual,
    behavior:behavior,
    count:g('count')||'',
    memo:(g('memo')||'').trim(),
    // 揃え直しが残る保存は「要確認」を付けて、あとで気づけるようにする
    needs_review: $('#flReview').checked || !!_flInd.fixN,
    // 同一個体の目印。観察と行き来したときに引き継ぐ（画面で触れないので既存値を持ち越す）
    // 'obs'（止まった）と 'same'（見失って再発見＝同じ鳥）は、目印が無ければここで発行して結び付ける
    individual_key: _flInd.key || (((SCREENS._ftracks||[])[SCREENS._ftIdx]||{}).indKey||'') || (SCREENS._flIndKey||'')
      || (prev.individual_key||'') || ((cont==='obs'||cont==='same') ? uuid() : ''),
    audio:SCREENS._audio||[], media:SCREENS._media||[] });
  if(SCREENS._flLocalOnly && editing && prev){
    // 添付・メモ専用の画面。共有項目（種名・種ID・個体数・齢）は欄が無いので、元の値をそのまま保つ
    rec.species_id=prev.species_id||''; rec.species_name_snapshot=prev.species_name_snapshot||'';
    rec.count=prev.count; rec.age_class=prev.age_class;
    rec.individual_label=prev.individual_label||'';   // 個体名は統合画面だけで変える（食い違いを作らない）

  }
  // 統合画面の保存と同じ順序: 控え→覆い→書き込み→一拍→全文再検証→完了/補償。
  // 検証はフラグに頼らず毎回行う（別のタブの書き込み通知は一拍遅れて届く）。
  // 読み込みは厳格版（壊れたJSONを空として上書きすると全飛翔記録を失う）
  const arrPre=loadStrict(DB.key.fl);
  if(!arrPre){ toast('記録の読み込みに失敗したため、保存を中止しました。データ点検・修復画面で確認してください', 8000); return; }
  const prevFl0=arrPre.find(x=>x&&x.uuid===u)||null;
  const prevFlJson=prevFl0?JSON.stringify(prevFl0):'';
  SAVE_BUSY=true; saveBusyShow(true);
  if(typeof GUARD_CONFLICT!=='undefined'){ GUARD_CONFLICT=false; GUARD_SNAP={}; }   // この保存の間の競合だけを見る
  if(typeof BACKUP_GEN!=='undefined'){ BACKUP_GEN++; _backupPending=true; _folderPending=true; }   // 作成中のバックアップを無効化し、確定点で予約し直す
  // 単独の飛翔も取引の控えを持つ（検証の一拍の間に終了しても復旧できるように）
  const txS=uuid(); CUR_TX=txS;
  const jS={ t:nowISO(), tx:txS, phase:'writing', fl:null, ghost:null,
    undo:[{ key:DB.key.fl, uuid:u, prev: prevFl0?JSON.parse(JSON.stringify(prevFl0)):null, wroteRec:'', expectedRec:'' }] };
  {
    const arrW=loadStrict(DB.key.fl);
    if(!arrW){ SAVE_BUSY=false; saveBusyShow(false);
      toast('記録の読み込みに失敗したため、保存を中止しました。データ点検・修復画面で確認してください', 8000); return; }
    const iW=arrW.findIndex(x=>x&&x.uuid===u);
    rec.updated_at=nowISO(); if(iW<0){ if(!rec.created_at) rec.created_at=nowISO(); arrW.push(rec); } else arrW[iW]=rec;
    jS.undo[0].expectedRec=stableJson(rec);
    if(!saveJournalSet(jS)){ SAVE_BUSY=false; saveBusyShow(false);
      toast('空き容量が足りず、保存を開始できませんでした。空き容量を確保してからやり直してください', 8000); return; }
    if(!DB.save(DB.key.fl, arrW)){
      if(!saveJournalClear(txS)){ saveFatalHalt('保存の控えを片付けられませんでした。'); return; }
      SAVE_BUSY=false; saveBusyShow(false); return; }   // 保存失敗なら成功表示も遷移もしない
  }
  const aW0=loadStrict(DB.key.fl);
  if(!aW0){ saveFatalHalt('記録の読み込みに失敗しました。'); return; }   // 厳格読み込みの保証を切らさない
  const wroteObj=aW0.find(x=>x&&x.uuid===u)||null;
  if(wroteObj && stableJson(wroteObj)!==stableJson(rec)){
    // 書けたのが自分の値でない（直後に別のタブが上書きした）。
    // すでに書く前の姿なら、控えを片付けてから解除。それ以外は停止
    if(prevFl0 && JSON.stringify(wroteObj)===prevFlJson){
      if(!saveJournalClear(txS)){ saveFatalHalt('保存の控えを片付けられませんでした。'); return; }
      SAVE_BUSY=false; saveBusyShow(false);
      toast('別のタブによる書き換えを検知したため、この保存は完了していません。内容を確認してから保存し直してください', 9000);
      return;
    }
    saveFatalHalt(); return;
  }
  if(!wroteObj){
    // 書いたはずの記録が見つからない。現在値が「書く前の姿」なら解除できるが、
    // それ以外（競合で消された・別の姿）は画面を再利用させない
    const cur0=(DB.load(DB.key.fl)||[]).find(x=>x&&x.uuid===u)||null;
    const cur0Json=cur0?JSON.stringify(cur0):'';
    if((!prevFl0 && !cur0) || (prevFl0 && cur0Json===prevFlJson)){
      if(!saveJournalClear(txS)){ saveFatalHalt('保存の控えを片付けられませんでした。'); return; }
      SAVE_BUSY=false; saveBusyShow(false);
      toast('保存できませんでした（空き容量を確認してください）'); return;
    }
    saveFatalHalt(); return;
  }
  const wroteFl=JSON.stringify(wroteObj);
  // 取り消しの基準配列: 競合を検知していれば相手の最新の姿、通常は厳格読み込み
  const flBase=()=>{
    if(typeof GUARD_SNAP!=='undefined' && Object.prototype.hasOwnProperty.call(GUARD_SNAP, DB.key.fl)){
      try{ const v=JSON.parse(GUARD_SNAP[DB.key.fl]); if(Array.isArray(v)) return v; }catch(_){ }
      return null;
    }
    return loadStrict(DB.key.fl);
  };
  jS.undo[0].wroteRec=wroteFl; jS.phase='written';
  if(!saveJournalSet(jS)){
    // 進み具合を控えられない。書いた分を戻して中止する
    const arrB=flBase();
    let undoneB=false;
    if(arrB){ const iB=arrB.findIndex(x=>x&&x.uuid===u);
      if(iB>=0 && JSON.stringify(arrB[iB])===wroteFl){
        if(prevFl0) arrB[iB]=prevFl0; else arrB.splice(iB,1);
        undoneB=DB.save(DB.key.fl, arrB);
      }
    }
    if(undoneB && saveJournalClear(txS)){ SAVE_BUSY=false; saveBusyShow(false);
      toast('空き容量が足りず、保存を安全に完了できませんでした。空き容量を確保してからやり直してください', 8000); }
    else saveFatalHalt();
    return;
  }
  (async ()=>{
  await new Promise(r=>setTimeout(r,0));
  const aV=loadStrict(DB.key.fl);
  if(!aV){ saveFatalHalt('記録の読み込みに失敗しました。'); return; }
  const curFl=aV.find(x=>x&&x.uuid===u)||null;
  const curJson=curFl?JSON.stringify(curFl):'';
  const conflicted=(typeof GUARD_CONFLICT!=='undefined' && GUARD_CONFLICT);
  if(conflicted && curJson===wroteFl){
    // 別の書き手を検知した。自分の値のままなら取り消して仕切り直す
    //（後勝ち保存の配列では、自分の書き込みが相手の更新を上書きした可能性がある）
    const arrR=flBase();   // 相手の最新の姿を基準に、自分の分だけ戻す
    let undone=false;
    if(arrR){
      const iR=arrR.findIndex(x=>x&&x.uuid===u);
      // 相手の姿の中で対象が「自分の書いた値」ならprevへ置き換え、
      // すでにprev・不在・第三の姿ならそのまま（相手の状態が正）。
      // どの場合も、相手の姿全体を正本として保存し直す（相手の他の記録の更新を保つ）
      if(iR>=0 && JSON.stringify(arrR[iR])===wroteFl){
        if(prevFl0) arrR[iR]=prevFl0; else arrR.splice(iR,1);
      }
      if(DB.save(DB.key.fl, arrR)){
        const a3=loadStrict(DB.key.fl);
        undone=!!a3 && JSON.stringify(a3)===JSON.stringify(arrR);
      }
    }
    if(undone && saveJournalClear(txS)){ SAVE_BUSY=false; saveBusyShow(false);
      toast('別のタブによる書き換えを検知したため、この保存を取り消しました。内容を確認してから保存し直してください', 9000); }
    else saveFatalHalt();
    return;
  }
  if(curJson!==wroteFl){
    // 別のタブの書き込みが残っている。補償規則は統合画面と同じ:
    // すでに書く前の姿なら「取り消し済み」として解除、それ以外は停止
    if(curJson===prevFlJson){
      if(!saveJournalClear(txS)){ saveFatalHalt('保存の控えを片付けられませんでした。'); return; }
      SAVE_BUSY=false; saveBusyShow(false);
      toast('別のタブによる書き換えを検知したため、この保存は完了していません。内容を確認してから保存し直してください', 9000);
      return;
    }
    saveFatalHalt();
    return;
  }
  if(!saveJournalClear(txS)){ saveFatalHalt('保存の控えを片付けられませんでした。'); return; }
  SAVE_BUSY=false; saveBusyShow(false); backupConfirmPoint();
  if(name) DB.pushRecent(name);
  SCREENS._audio=null; SCREENS._media=null; SCREENS._mediaCtx=null;
  SCREENS._ftracks=null; SCREENS._ftDirty=false;   // 単線保存でもトラック状態は片付ける
  SCREENS._dirty=false;   // 保存済みなので離脱ガード対象から外す
  toast('飛翔経路を保存しました');
  if(cont==='obs'){
    // 止まったところを観察として記録する。位置は経路の終点（＝止まった場所）を初期値にする
    const last=(rec.path||[])[ (rec.path||[]).length-1 ] || null;
    goBack();
    // 終点＝止まった場所なので、観察者の位置ではなく P（鳥がいた場所）として渡す
    nav('obsEdit', JSON.stringify({sv:svUuid, keep:{
      plat:last?last[0]:'', plon:last?last[1]:'',
      species_name:name, count:rec.count, age_class:age, individual_key:rec.individual_key,
      individual_label:individual }}));   // 個体名も引き継ぐ（同じ鳥の続きなので）
  }
  else if(cont==='same'){
    // 見失って再発見した同じ鳥の続き。目印も渡すので、集計では1個体として数えられる
    const keep={ species_id:SCREENS._chosenId||'', species_name:name, age_class:age,
      individual_label:individual, height_class:height, behavior:behavior,
      count:rec.count, individual_key:rec.individual_key };
    goBack(); nav('flightEdit', JSON.stringify({sv:svUuid, keep})); }
  else if(cont){ // 別の個体・種。属性だけ引き継ぐ（目印も個体名も渡さない＝別個体として数える）
    const keep={ species_id:SCREENS._chosenId||'', species_name:name, age_class:age,
      height_class:height, behavior:behavior };
    goBack(); nav('flightEdit', JSON.stringify({sv:svUuid, keep})); }
  else goBack();
  })();
}
function deleteFlight(u){ if(!confirm('この飛翔経路を削除しますか？')) return;
  if(!DB.softDelete(DB.key.fl,u)) return;
  SCREENS._dirty=false; SCREENS._ghost=null; toast('削除しました'); goBack(); }

/* 飛翔経路のカード（調査画面・まとめ画面で共用） */
// 経路のカードは統合画面へつなぐ。同じ鳥の観察があればそれを開き（止まりも経路も1画面に載る）、
// 無ければ経路を軸に統合画面を開く。昔の飛翔専用画面は「複数羽の同時トレース」専用に残す
function openFlightUnified(u, flUuid){
  const f=DB.flightsOf(u).find(x=>x.uuid===flUuid);
  if(!f){ toast('記録が見つかりません'); return; }
  const sib=f.individual_key ? DB.obsOf(u).find(o2=>o2.individual_key===f.individual_key) : null;
  if(sib) nav('obsEdit', JSON.stringify({sv:u, id:sib.uuid}));
  else nav('obsEdit', JSON.stringify({sv:u, fl:flUuid}));
}
function flightCard(u,f){
  // 面は線と別の見出し（⬠）と読み方（面積）にする。同じ「🛩・全長」で出すと取り違える
  const _area=isArea(f), _m=traceMetric(f);
  // 囲めていない面は地図・集計・書き出しから外れる。**理由をカードに出して気づけるようにする**
  //（一覧から消すと、なぜ図に出ないのか分からないまま残る）
  const _pb=_area?areaProblem((f.path||[]).filter(validPathPt)):'';
  const _sub=_area ? (_pb ? `面になっていません（${esc(_pb)}）`
      : `${esc(f.area_type||'面')}${traceDrawable(f)?' 約'+_m.text:''}`)
    : esc(f.height_class||'');
  return `<div class="card tap" onclick="openFlightUnified('${u}','${f.uuid}')">
    <div class="row"><div class="grow">
      <div style="font-weight:700;">${_area?'⬠':'🛩'} ${esc(f.species_name_snapshot||'（未同定）')}
        ${conservBadges(f.species_name_snapshot)}
        ${f.age_class&&ageNorm(f.age_class)!=='不明'?`<span class="pill">${esc(ageNorm(f.age_class))}</span>`:''}
        ${f.individual_label?`<span class="pill">${esc(f.individual_label)}</span>`:''}
        ${f.needs_review?'<span class="badge warn">要確認</span>':''}
        ${_pb?'<span class="badge warn">要点検</span>':''}</div>
      <div class="small muted">${fmtTime(f.start_time)}${f.end_time?'→'+fmtTime(f.end_time):''} ・ ${esc((f.path||[]).length)}点 ・ ${_sub}${f.behavior?' ・ '+esc(f.behavior):''}
        <span class="tiny muted">${(f.audio&&f.audio.length)?' 🎤':''}${(f.media&&f.media.length)?' 📷':''}</span></div>
    </div></div></div>`; }

/* 飛翔経路まとめ（全経路を1枚の地図に重ねて表示＋一覧） */
SCREENS.flightList = (u)=>{
  const s=DB.survey(u); if(!s) return SCREENS.home();
  const flights=DB.flightsOf(u).sort((a,b)=>(b.start_time||b.created_at||'').localeCompare(a.start_time||a.created_at||''));
  const drawable=flights.filter(traceDrawable);
  return {
    title:'飛翔経路まとめ',
    sub:[`<span class="pill">${esc(s.name||'調査')}</span>`, `<span class="pill">経路 ${flights.length}</span>`],
    html:`
      ${drawable.length?`<div id="map"></div>
        <div class="sp"></div>
        <div class="note">この調査の飛翔経路を全部まとめて表示しています（向きは<b>矢印</b>。左下のボタンで始まり・終わりの印も出せます）。左下の凡例で線の色分けを 種／齢／個体 に切り替えられます。線をタップすると内容、下のカードをタップすると編集画面が開きます。</div>`
        :''}

    onMount:()=>{ if(drawable.length) _mapTimer=setTimeout(()=>drawMap([],[],drawable),50); }

};

function saveHyp(u,svUuid,editing){
  const f=$('#hyForm'); const g=n=>{const el=f.querySelector(`[name="${n}"]`); return el?el.value:'';};
  if(!g('title').trim()){ toast('仮説タイトルを入力してください'); return; }
  const prev=editing?DB.hypothesis(u):{uuid:u};
  const rec=Object.assign({},prev,{ uuid:u, survey_uuid:svUuid, title:g('title'),
    hypothesis_text:g('hypothesis_text'), expected_result:g('expected_result'), rationale:g('rationale'),
    required_data:g('required_data'), target_species:g('target_species'), target_location:g('target_location'),
    status:segVal('status')||'未検証' });
  if(!DB.upsertHyp(rec)) return; toast('保存しました');
  SCREENS._dirty=false;   // 保存済み＝離脱確認の対象から外す
  if(editing) goBack(); else { goBack(); nav('hypDetail',u); }
}
function deleteHyp(u){ if(!confirm('この仮説と検証結果を削除しますか？')) return;
  // 仮説と一緒に消す検証結果には印(deleted_with_hyp)を付ける。復元時にこれだけ戻す（個別に消した結果は戻さない）。
  // 子を先に保存し、成功したときだけ親を消す。逆順だと「親だけ消えて検証結果が孤立」する
  const before=DB.load(DB.key.hr);   // 巻き戻し用の控え（親の削除に失敗したとき子だけ消えた状態にしない）
  const arr=DB.load(DB.key.hr); let ch=false;
  arr.forEach(r=>{ if(r.hypothesis_uuid===u && !r.deleted_at){ r.deleted_at=nowISO(); r.deleted_with_hyp=true; ch=true; } });
  if(ch && !DB.save(DB.key.hr,arr)) return;   // 保存失敗はDB.saveが警告済み。成功表示も遷移もしない
  if(!DB.softDelete(DB.key.hy,u)){
    // 子だけ消えた状態は「仮説は残っているのに検証結果が全部消えた」ように見える。必ず戻す
    if(ch && !DB.save(DB.key.hr,before)){
      toast('削除に失敗し、検証結果を元に戻すこともできませんでした。空き容量を確保してから、データ点検・修復画面で確認してください', 8000);
    }
    return;
  }
  SCREENS._dirty=false; toast('削除しました'); goBack(); }

function saveHypResult(u,hyUuid,editing){
  const f=$('#hrForm'); const g=n=>{const el=f.querySelector(`[name="${n}"]`); return el?el.value:'';};
  const judgment=segVal('judgment');
  if(judgment && !g('judgment_reason').trim()){ toast('判定するときは判定理由を入力してください'); return; }
  const obsIds=[...document.querySelectorAll('#hrForm .chips .c.on')].map(el=>el.dataset.obs).filter(Boolean);
  const prev=editing?DB.resultsOf(hyUuid).find(x=>x.uuid===u):{uuid:u};
  const rec=Object.assign({},prev,{ uuid:u, hypothesis_uuid:hyUuid,
    verified_at:g('verified_at'), observed_result:g('observed_result'), judgment,
    judgment_reason:g('judgment_reason'), missing_information:g('missing_information'),
    alternative_explanation:g('alternative_explanation'), next_action:g('next_action'),
    next_method:g('next_method'), note:g('note'), observation_uuids:obsIds });
  if(!DB.upsertHypResult(rec)) return;   // 保存失敗なら成功表示も遷移もしない
  // 判定が付いたら仮説ステータスを検証済みへ更新（未検証のときのみ）
  const h=DB.hypothesis(hyUuid);
  if(judgment && h && (h.status==='未検証'||h.status==='検証中')){ h.status='検証済み'; DB.upsertHyp(h); }
  toast('保存しました');
  SCREENS._dirty=false;   // 保存済み＝離脱確認の対象から外す
  goBack();
}
function deleteHypResult(u){ if(!confirm('この検証結果を削除しますか？')) return;
  if(!DB.softDelete(DB.key.hr,u)) return;   // 削除できていないのに成功表示して戻ると、直前の編集内容も失われる
  SCREENS._dirty=false; toast('削除しました'); goBack(); }

SCREENS.surveyEnd = (u)=>{
  const s=DB.survey(u); if(!s) return SCREENS.home();
  const obs=DB.obsOf(u);
  // 飛翔経路も種数・個体数に含める。含めないと、飛翔だけを記録した調査で
  // 終了画面が「0種・0個体」、種別集計が「1種・2個体」と食い違う（2026-08-04 全体監査で実測）
  const flightsAll=DB.flightsOf(u).filter(traceDrawable);
  // 面（範囲）のうち「概略行動範囲・推定営巣範囲・大まかな確認範囲」は羽数に数えない。
  // 囲った範囲を個体数に足すと、確認個体数が実態より増える（数え方は countsAsIndividuals に一本化）
  const flightsCount=flightsAll.filter(countsAsIndividuals);
  const flightLines=flightsAll.filter(f=>!isArea(f));
  const flightAreas=flightsAll.filter(isArea);
  const spCount=new Set([...obs, ...flightsAll].filter(x=>x.species_name_snapshot)
    .map(x=>x.species_name_snapshot)).size;
  const total=obs.reduce((a,o)=>a+indCount(o.count),0)
    + flightsCount.reduce((a,f)=>a+indCount(f.count),0);
  const totalUniq=dedupCount([...obs, ...flightsCount]);   // 同じ鳥として結び付けた組を1個体に数え直した値
  // 未同定・要確認も飛翔を含める。種数と個体数だけ飛翔を数えると内訳が合わなくなる
  const undet=obs.filter(o=>o.identification_status==='未同定'||!o.species_name_snapshot).length
    + flightsAll.filter(f=>!f.species_name_snapshot).length;
  const review=obs.filter(o=>o.needs_review).length
    + flightsAll.filter(f=>f.needs_review).length;
  const hyps=DB.hypOf(u);
  const verified=hyps.filter(h=>h.status==='検証済み').length;
  const r=s.review||{};
  const fields=[['learned','今日分かったこと'],['unknown','今日分からなかったこと'],
    ['limits','調査条件による制約'],['missed','見落とした可能性'],
    ['next','次回確認すること'],['report','報告書に記載する事項'],['overall','全体所感']];
  return {
    title:'調査終了・振り返り',
    html:`
      <div class="card">
        <h3>自動集計</h3>
        <div class="tablewrap"><table>
          <tr><td>観察記録数</td><td class="num">${obs.length}</td><td>確認種数</td><td class="num">${spCount}</td></tr>
          <tr><td>総個体数（延べ）</td><td class="num">${total}</td><td>未同定件数</td><td class="num">${undet}</td></tr>
          ${totalUniq!==total?`<tr><td>総個体数（実数）</td><td class="num">${totalUniq}</td><td colspan="2" class="tiny muted">同じ鳥として結び付けた組を1個体に数え直した値</td></tr>`:''}
          <tr><td>飛翔経路数</td><td class="num">${flightLines.length}</td><td>要確認件数</td><td class="num">${review}</td></tr>
          ${flightAreas.length?`<tr><td>範囲（面）の数</td><td class="num">${flightAreas.length}</td><td colspan="2" class="tiny muted">旋回上昇・行動範囲・営巣範囲など。行動範囲・営巣範囲・大まかな確認範囲は個体数に数えていません</td></tr>`:''}
          <tr><td>メモ件数</td><td class="num">${DB.notesOf(u).length}</td><td></td><td class="num"></td></tr>
          <tr><td>仮説件数</td><td class="num">${hyps.length}</td><td>検証済み仮説</td><td class="num">${verified}</td></tr>
        </table></div>
      </div>
      <form id="rvForm">
        ${fields.map(([k,lab])=>`<label class="field"><span class="lab">${lab}</span>
          <textarea name="${k}">${esc(r[k]||'')}</textarea></label>`).join('')}
      </form>
      <button class="btn primary big" onclick="finishSurvey('${u}')">${s.status==='終了'?'振り返りを保存':'振り返りを保存して調査を終了'}</button>
      <div class="sp"></div>
      <div class="note">終了後も再編集できます。総個体数は延べ数のため、生息個体数とは限りません。</div>
    `
  };
};
function finishSurvey(u){
  if(WALK && WALK.sv===u){   // 歩行記録が残っていれば止めてルートを本保存（先に保存してからsを読む）
    if(!stopWalk(true)){ toast('ルートを保存できなかったため終了を中止しました。空き容量を確保してからもう一度お試しください', 4000); return; }
  }
  const s=DB.survey(u); const f=$('#rvForm'); const review={};
  f.querySelectorAll('textarea').forEach(t=>review[t.name]=t.value);
  s.review=review;
  if(s.status!=='終了'){ s.status='終了'; s.end_datetime=nowISO(); }
  if(!DB.upsertSurvey(s)) return; stopGps(); autoBackupRecords(); scheduleFolderFull(); toast('保存しました');
  SCREENS._dirty=false;   // 保存済み＝離脱確認の対象から外す
  reset('home'); nav('survey',u);
}

SCREENS.summary = (u)=>{
  const s=DB.survey(u); const obs=DB.obsOf(u); const flights=DB.flightsOf(u);
  const map={};
  // 同じ目印が複数の種にまたがったとき（途中で種名を直した等）は、最初に現れた種にまとめて数える。
  // 種ごとに数えると、行の合計と全体の実数が食い違い、終了画面の数字とも合わなくなる
  const keyOwner=new Map();
  const claimKey=(rec,name)=>{ const k=String(rec.individual_key||'').trim();
    if(k && !keyOwner.has(k)) keyOwner.set(k,name); };
  const ent=key=>map[key]||(map[key]={name:key, total:0, count:0, first:null, last:null, methods:new Set(), review:0, undet:0, routes:0, recs:[]});
  // 初認・終認の比較は、観察（世界標準時で保存）と飛翔（時差なしで保存）で保存形式が違うため、
  // 文字列のまま比べると順序が逆転する（実測: 観察05:00・飛翔04:00で初認05:00・終認04:00）。
  // 書き出しと同じ isoLocal で日本時間に揃えてから比べる
  // 日付だけの値（2026-08-04）や日時と読めない値は初認・終認から外す。
  // 混ぜると、日付だけの値が常に最小になって初認に居座り、時刻表示すると再び逆転して見える
  const touchTime=(m,t)=>{ const s=String(t||'');
    // 日付だけの値と、暦として存在しない日時（2026-02-30 / 25時 等）は除外する。
    // okStamp は取込・同期でも使っている共通の検査で、暦日と解釈可能性まで見る
    if(!s || DATE_ONLY_RE.test(s) || !okStamp(s)) return;
    const v=isoLocal(t); if(!v) return;
    if(!m.first||v<m.first) m.first=v;
    if(!m.last||v>m.last) m.last=v; };
  obs.forEach(o=>{ const m=ent(o.species_name_snapshot||'（未同定）');
    m.total+=indCount(o.count); m.count++; m.recs.push(o); claimKey(o,m.name);
    if(o.detection_method) m.methods.add(o.detection_method);
    if(o.needs_review) m.review++;
    if(o.identification_status==='未同定'||!o.species_name_snapshot) m.undet++;
    touchTime(m,o.observed_at);
  });
  // 飛翔経路も種別集計に合流（延べ個体に加算・確認方法に「飛翔」・経路数を計上）。
  // 面（範囲）は種としては数えるが、行動範囲・営巣範囲などは**羽数に数えない**
  //（囲った範囲を個体数に足すと、確認個体数が実態より増える）
  let flightRoutes=0, flightInd=0, flightDist=0, flightAreas=0;
  flights.forEach(f=>{ const path=(f.path||[]).filter(validPathPt);
    if(!traceDrawable(f)) return;   // 点数の判定は1か所（線2点・面3点）
    const m=ent(f.species_name_snapshot||'（未同定）');
    const c=indCount(f.count);
    const counts=countsAsIndividuals(f);
    // 数えない面は recs にも入れない（実数の計算で拾われて羽数に戻ってしまうため）
    if(counts){ m.total+=c; m.recs.push(f); claimKey(f,m.name); }
    m.methods.add('飛翔');
    if(isArea(f)){ m.areas=(m.areas||0)+1; flightAreas++; }
    else { m.routes++; flightRoutes++; flightDist+=pathLength(path); }
    if(counts) flightInd+=c;
    if(f.needs_review) m.review++;
    touchTime(m,f.start_time);
  });
  const rows=Object.values(map).sort((a,b)=>b.total-a.total);
  // 鳴き声AIの検出回数（この端末に溜まった「聞こえた鳥」。自分で残した音は除く）。読み込みは画面を出した後（v234）。
  // 個体数・回数・種数には混ぜない。AIだけで出た種は、目視の行の下に「AIのみ」として並べる
  const aiCnt=(SCREENS._sumAi && SCREENS._sumAi.sv===u) ? SCREENS._sumAi.cnt : null;
  const aiOnly=aiCnt ? Object.keys(aiCnt).filter(n=>!map[n]).sort((a,b)=>aiCnt[b]-aiCnt[a]) : [];
  // 同一個体として結び付けた記録を1つに数えた個体数。
  // 目印ごとの最大羽数は**種をまたいで**先に求める（同じ目印がトビ2羽とノスリ5羽なら5羽が1組）。
  // そのうえで、その目印は「最初に現れた種」の行だけが数える＝行の合計と全体の実数が必ず一致する
  const keyMax=new Map();
  rows.forEach(r=>r.recs.forEach(x=>{ const k=String(x.individual_key||'').trim(); if(!k) return;
    const c=indCount(x.count); const cur=keyMax.get(k);
    if(cur==null || c>cur) keyMax.set(k,c); }));
  rows.forEach(r=>{
    let sum=0;
    r.recs.forEach(x=>{ if(!String(x.individual_key||'').trim()) sum+=indCount(x.count); });
    keyMax.forEach((v,k)=>{ if(keyOwner.get(k)===r.name) sum+=v; });
    r.uniq=sum;
  });
  const totalInd=rows.reduce((a,r)=>a+r.total,0);
  const uniqInd=rows.reduce((a,r)=>a+r.uniq,0);
  const spCount=rows.filter(r=>r.name!=='（未同定）').length;
  // 調査ルートの長さから密度（種数/km・個体数/km）を算出。
  // 分子はラインセンサスに合わせ「観察のみ・未同定を除く」（飛翔経路は含めない）
  const routeLen=pathLength((s.route||[]).filter(validPathPt));
  const km=routeLen/1000;
  // 注記どおり「未同定を除く」を個体数・種数の両方に適用（従来は種数のみ除外で、個体/kmに未同定が混ざっていた）
  const obsIdOk=obs.filter(o=>!(o.identification_status==='未同定' || !o.species_name_snapshot));
  const obsInd=obsIdOk.reduce((a,o)=>a+indCount(o.count),0);
  const obsSp=new Set(obsIdOk.map(o=>o.species_name_snapshot).filter(n=>n&&n!=='（未同定）')).size;
  const densHtml = km>0 ? `<div class="sp"></div>
      <h3 style="margin:0 0 6px;">ルート密度</h3>
      <div class="row" style="gap:8px;flex-wrap:wrap;">
        <span class="pill">ルート長 約${fmtDist(routeLen)}</span>
        <span class="pill">種数 ${(obsSp/km).toFixed(1)}/km</span>
        <span class="pill">個体 ${(obsInd/km).toFixed(1)}/km</span>
      </div>
      <div class="note">観察記録のみをルート長で割った相対値です（飛翔経路・未同定は除く。ラインセンサスの目安）。</div>` : '';
  return {
    title:'種別集計',
    sub:[`<span class="pill">確認種数 ${rows.filter(r=>r.name!=='（未同定）').length}</span>`,`<span class="pill">延べ ${totalInd}個体</span>`,
      (uniqInd!==totalInd)?`<span class="pill">実数 ${uniqInd}個体</span>`:'',
      flightRoutes?`<span class="pill">飛翔 ${flightRoutes}経路</span>`:''].filter(Boolean),
    html:`
      ${(rows.length||aiOnly.length)? `<div class="tablewrap"><table>
        <thead><tr><th>種名</th><th class="num">個体</th><th class="num">回数</th><th class="num">経路</th><th>初認</th><th>終認</th><th>確認</th><th class="num">鳴き声AI</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td>${esc(r.name)}${r.review?` <span class="badge warn tiny">要${r.review}</span>`:''}</td>
          <td class="num">${r.total}${r.uniq!==r.total?`<br><span class="tiny muted">実${r.uniq}</span>`:''}</td><td class="num">${r.count}</td><td class="num">${r.routes||''}${r.areas?`<br><span class="tiny muted">面${r.areas}</span>`:''}</td>
          <td>${fmtTime(r.first)}</td><td>${fmtTime(r.last)}</td>
          <td class="tiny muted">${[...r.methods].join('/')}</td><td class="num">${aiCnt?(aiCnt[r.name]||''):'…'}</td></tr>`).join('')}
        ${aiOnly.map(n=>`<tr class="muted"><td>${esc(n)} <span class="badge tiny">AIのみ</span></td><td class="num"></td><td class="num"></td><td class="num"></td><td></td><td></td><td class="tiny muted">鳴き声AI</td><td class="num">${aiCnt[n]}</td></tr>`).join('')}</tbody>
      </table></div>` : '<div class="empty">観察記録がありません。</div>'}
      <div class="sp"></div>
      <div class="note">合計個体数は延べ数です。同一個体の重複記録を含むため、生息個体数とは限りません。飛翔経路の個体数も延べに含みます。<br>
      「実数」は、観察と飛翔経路を行き来して<b>同じ鳥として記録した組</b>を1個体として数え直した値です（群れは最大の羽数）。結び付けていない記録は延べのままです。<br>
      「鳴き声AI」は、この端末の鳴き声AIが聞き取った回数（「聞こえた鳥」の件数）です。AIの候補なので聞き違いを含み、個体数・回数・確認種数には入れていません。「AIのみ」はAIだけが聞き取った種です。</div>
      ${densHtml}
      ${(flightRoutes||flightAreas)?`<div class="sp"></div>
      <h3 style="margin:0 0 6px;">飛翔経路のまとめ</h3>
      <div class="row" style="gap:8px;flex-wrap:wrap;">
        <span class="pill">経路数 ${flightRoutes}</span>
        ${flightAreas?`<span class="pill">範囲（面） ${flightAreas}</span>`:''}
        <span class="pill">延べ ${flightInd}個体</span>
        <span class="pill">合計距離 約${fmtDist(flightDist)}</span>
      </div>
      ${flightAreas?'<div class="note">範囲（面）のうち、概略行動範囲・推定営巣範囲・大まかな確認範囲は個体数に数えていません。合計距離は線だけの合計です。</div>':''}`:''}
      <div class="sp"></div>
      <button class="btn" onclick="nav('exportSurvey','${u}')">⤓ この調査を書き出す（CSV/GeoJSON）</button>
    `,
    onMount:()=>sumAiLoad(u)
  };
};
// 種別集計の「鳴き声AI」列: 端末の中の検出を数え、変わっていたら集計を描き直す（同じなら描き直さない＝繰り返さない）
async function sumAiLoad(u){
  let rows=[]; try{ rows=await aiDetsOf(u); }catch(e){ rows=[]; }
  const cnt={};
  rows.forEach(d=>{ if(d && d.kind==='det' && !d.manual && d.ja) cnt[d.ja]=(cnt[d.ja]||0)+1; });
  const prev=(SCREENS._sumAi && SCREENS._sumAi.sv===u) ? JSON.stringify(SCREENS._sumAi.cnt) : null;
  if(prev===JSON.stringify(cnt)) return;
  SCREENS._sumAi={ sv:u, cnt };
  const cur=STACK[STACK.length-1]||{};
  if(cur.name==='summary' && cur.arg===u) render();
}

  const nestAll=nestRecords(DB.obsOf(u));       // 位置が無くても巣の情報がある記録

  return {
