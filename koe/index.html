<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="こえログ">
<meta name="description" content="鳴き声AIで、どこでどんな鳥の声が聞こえたかを記録するアプリ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="leaflet.css">
<title>こえログ</title>
<style>
:root{
  --bg:#F5F3EC; --surface:#FFFFFF; --surface2:#EEEBE2; --line:#E2DED2;
  --text:#1D2620; --muted:#5B675F; --faint:#88938C;
  --pri:#2E6A4E; --pri-ink:#FFFFFF; --pri-soft:#DCEBE2;
  --acc:#C8701F; --danger:#B3402F; --danger-soft:#F6E1DC;
  --hi:#24603F; --hi-bg:#D8EBDF; --mid:#2F5F8F; --mid-bg:#DDE8F4; --lo:#66614F; --lo-bg:#ECE8DC;
  --shadow:0 1px 2px rgba(30,40,30,.06),0 6px 18px rgba(30,40,30,.07);
  --r:18px; --tabh:66px; --hdrh:58px;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101613; --surface:#18201C; --surface2:#212B26; --line:#2B3631;
  --text:#E6EDE8; --muted:#A6B2AB; --faint:#7E8B84;
  --pri:#72C49C; --pri-ink:#0D1A13; --pri-soft:#1D3A2C;
  --acc:#F0A04B; --danger:#EC7B67; --danger-soft:#3A221E;
  --hi:#86D8AE; --hi-bg:#1D3A2C; --mid:#93BCE8; --mid-bg:#1C2B3C; --lo:#C2BDAD; --lo-bg:#2A2924;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  font-size:17px;line-height:1.6;min-height:100dvh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}

/* ---- 見出し ---- */
#hdr{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(var(--st) + 8px) 18px 8px;display:flex;align-items:center;gap:10px;min-height:var(--hdrh)}
#hdr h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .logo{display:flex;align-items:center;gap:8px}
#hdr .logo i{width:30px;height:30px;border-radius:9px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
#hdr .logo i svg{width:18px;height:18px}
.iconbtn{width:46px;height:46px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--surface2)}
.iconbtn svg{width:26px;height:26px}
main{max-width:640px;margin:0 auto;padding:0 16px calc(var(--tabh) + var(--sb) + 28px)}

/* ---- 下のタブ ---- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--sb);height:calc(var(--tabh) + var(--sb))}
#tabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12.5px;font-weight:600;color:var(--faint);position:relative}
#tabs button svg{width:26px;height:26px}
#tabs button[aria-current="page"]{color:var(--pri)}
#tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--pri)}
#tabs .dot{position:absolute;top:9px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}

/* ---- 部品 ---- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 10px}
.sec-h h2{font-size:19px;margin:0;font-weight:800}
.sec-h span{color:var(--muted);font-size:15px}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.btn{border:none;border-radius:14px;padding:13px 20px;font-weight:700;font-size:17px;background:var(--surface2);color:var(--text);min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn:active{filter:brightness(.95)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.c-hi{background:var(--hi-bg);color:var(--hi)} .c-mid{background:var(--mid-bg);color:var(--mid)} .c-lo{background:var(--lo-bg);color:var(--lo)}
.c-new{background:var(--acc);color:#fff}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}
.av.s{width:36px;height:36px;font-size:15px}
.play{flex:none;width:48px;height:48px;border-radius:50%;border:none;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}
.play svg{width:22px;height:22px}
.play .i-stop{display:none}
.play.playing{background:var(--pri);color:var(--pri-ink)}
.play.playing .i-play{display:none} .play.playing .i-stop{display:block}
.noplay{flex:none;width:48px;text-align:center;color:var(--faint);font-size:11.5px;line-height:1.3}
.empty{text-align:center;color:var(--muted);padding:34px 18px}
.empty svg{width:54px;height:54px;margin:0 auto 10px;color:var(--faint)}
.progress{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}

/* ---- きく ---- */
.stage{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
.status{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:700;font-size:15.5px;margin-bottom:22px}
.status .d{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.status.on{background:var(--hi-bg);color:var(--hi)}
.status.on .d{background:var(--hi);animation:blink 1.6s infinite}
.status.wait{background:var(--lo-bg);color:var(--lo)}
.status.wait .d{background:var(--acc)}
@keyframes blink{50%{opacity:.25}}
.bigwrap{position:relative;width:236px;height:236px;display:grid;place-items:center}
.ring{position:absolute;inset:18px;border-radius:50%;background:var(--pri);opacity:0;pointer-events:none}
.on .ring.lv{opacity:.18;transform:scale(calc(1 + var(--lv,0) * .22));transition:transform .45s ease-out}
.on .ring.pulse{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.28}100%{transform:scale(1.28);opacity:0}}
.bigbtn{position:relative;width:196px;height:196px;border-radius:50%;border:none;background:var(--pri);color:var(--pri-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:25px;font-weight:800;letter-spacing:.08em;
  box-shadow:0 12px 32px rgba(46,106,78,.33)}
.bigbtn svg{width:60px;height:60px}
.bigbtn:active{transform:scale(.97)}
.on .bigbtn{background:var(--surface);color:var(--danger);box-shadow:0 0 0 4px var(--danger) inset,0 12px 32px rgba(0,0,0,.12)}
.bigbtn.busy{opacity:.75}
.hint{color:var(--muted);text-align:center;font-size:15px;margin:18px 8px 6px;max-width:360px}
.metaRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.meta{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.meta svg{width:16px;height:16px}
.meta.btnlike{cursor:pointer;color:var(--text);font-weight:700}
.sp-card{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 14px;margin-bottom:10px}
.sp-card .nm{font-size:19px;font-weight:800;line-height:1.3}
.sp-card .sub{font-size:14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.sp-card .body{flex:1;min-width:0}
.sp-card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--hi-bg);transform:scale(1.02)}100%{background:var(--surface);transform:none}}
.welcome{padding:24px 20px;text-align:center}
.welcome h2{font-size:22px;margin:6px 0 4px}
.steps{text-align:left;margin:18px 0 20px;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;margin:12px 0;font-size:16px}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-weight:800;display:grid;place-items:center;font-size:15px}

/* ---- きろく ---- */
.day{display:block;width:100%;text-align:left;border:1px solid var(--line);padding:15px 16px;margin-bottom:12px}
.day .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.day .dt{font-size:19px;font-weight:800}
.day .cnt{color:var(--muted);font-size:14.5px;white-space:nowrap}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.names span{background:var(--surface2);border-radius:999px;padding:3px 11px;font-size:14px}
.back{display:inline-flex;align-items:center;gap:4px;border:none;background:none;color:var(--pri);font-weight:700;padding:8px 6px 8px 0;font-size:16px}
.back svg{width:22px;height:22px}
.minimap{position:relative;z-index:0;height:210px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin:6px 0 4px;background:var(--surface2)}  /* z-index:0 … 地図の部品が上に開いた画面より手前に出ないように（v1.1.0） */
.row{display:flex;align-items:center;gap:12px;padding:11px 8px 11px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .tm{flex:none;width:48px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;font-weight:700}
.row .body{flex:1;min-width:0}
.row .nm{font-weight:800;font-size:17px}
.row .sub{font-size:13.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.more{flex:none;width:40px;height:44px;border:none;background:none;color:var(--faint);display:grid;place-items:center;border-radius:10px}
.more svg{width:22px;height:22px}
.list{padding:2px 0}

/* ---- 見つけた鳥 ---- */
.total{display:flex;align-items:center;gap:16px;padding:18px 20px;margin:4px 0 6px}
.total b{font-size:44px;line-height:1;color:var(--pri);font-weight:900}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;white-space:nowrap;border:none;background:none;border-radius:10px;padding:8px 6px;font-size:14.5px;font-weight:700;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.birdrow{display:flex;align-items:center;gap:13px;padding:11px 14px;border:none;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.birdrow:last-child{border-bottom:none}
.birdrow .body{flex:1;min-width:0}
.birdrow .nm{font-weight:800;font-size:17.5px}
.birdrow .sub{font-size:13.5px;color:var(--muted)}
.birdrow .n{font-weight:800;color:var(--muted);font-size:15px;white-space:nowrap}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:17px;min-height:50px}

/* ---- 地図 ---- */
#mapWrap{position:fixed;left:0;right:0;top:calc(var(--hdrh) + var(--st));bottom:calc(var(--tabh) + var(--sb));z-index:5}
#map{position:absolute;inset:0;background:var(--surface2)}
#mapBar{position:absolute;top:10px;left:10px;right:10px;z-index:500;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#mapBar>*{pointer-events:auto}
#mapBar .seg button{padding:8px 14px}
#mapBar .seg{background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
#mapBar select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;min-height:46px;font-size:15px;font-weight:700;box-shadow:var(--shadow);max-width:100%}
#mapEmpty{position:absolute;left:16px;right:16px;bottom:16px;z-index:500;padding:14px 16px;text-align:center}
.mapme{position:absolute;right:12px;bottom:16px;z-index:500;width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--pri)}
.mapme svg{width:24px;height:24px}
.leaflet-popup-content{font-family:inherit;font-size:15px;margin:12px 14px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--text)}
.pop{display:flex;align-items:center;gap:12px;min-width:180px}
.pop b{font-size:17px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}

/* ---- シート ---- */
#sheet{position:fixed;inset:0;z-index:100}
#sheet .backdrop{position:absolute;inset:0;background:rgba(10,15,12,.45);animation:fade .2s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;
  padding:8px 18px calc(22px + var(--sb));animation:up .25s ease-out;max-width:640px;margin:0 auto}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
#sheet h2{font-size:21px;margin:4px 0 12px}
#sheet h3{font-size:16px;margin:22px 4px 8px;color:var(--muted)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.acts{display:flex;flex-direction:column;gap:10px}
.setrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .body{flex:1;min-width:0}
.setrow .t{font-weight:700}
.setrow .d{font-size:13.5px;color:var(--muted)}
.sw{position:relative;flex:none;width:56px;height:32px;border-radius:99px;border:none;background:var(--line);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--pri)}
.sw[aria-checked="true"]::after{transform:translateX(24px)}
.credit{font-size:12.5px;color:var(--muted);line-height:1.7}
.credit a{color:var(--pri)}

/* ---- 録音・声紋・正誤（v1.1.0） ---- */
.recRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;width:100%}
.recRow .btn{flex:1 1 150px;min-height:48px;font-size:15.5px;padding:10px 12px}
.recRow .btn.rec{white-space:nowrap}
.btn.rec{background:var(--danger-soft);color:var(--danger)}
.btn.rec.on{background:var(--danger);color:#fff}
.btn.rec.on::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
#liveBox{margin:14px 0 0}
#liveCv{display:block;width:100%;height:96px;border-radius:12px;background:#111;image-rendering:pixelated}
.liveCap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:3px 4px 0}
.chip.c-rec{background:var(--danger-soft);color:var(--danger)}
.chip.c-ok{background:var(--hi-bg);color:var(--hi)}
.chip.c-no{background:var(--lo-bg);color:var(--lo)}
.verd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.verd .btn{min-height:46px;font-size:15.5px;padding:8px 10px;border:2px solid transparent}
.verd .btn[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.memo{width:100%;min-height:64px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;resize:vertical}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cands button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14.5px;font-weight:700}
.spBtn{flex:none;width:44px;height:44px;border-radius:50%;border:none;background:var(--surface2);color:var(--muted);display:grid;place-items:center}
.spBtn svg{width:21px;height:21px}
#spWrap{position:relative;overflow-x:auto;overflow-y:hidden;border-radius:12px;background:#111;-webkit-overflow-scrolling:touch}
#spBox{position:relative;height:256px}
#spCv,#spSel{position:absolute;left:0;top:0;height:256px;width:100%;image-rendering:pixelated}
#spSel{touch-action:pan-x pinch-zoom}
#spSel.pick{touch-action:none}
.spAx{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:3px 2px 0}
.spTools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.spTools .btn{min-height:42px;font-size:14.5px;padding:6px 12px;flex:1 1 auto}
.spRes{margin-top:8px}
.spRes .birdrow{padding:8px 10px}

/* ---- 地図の切り替え・今いる場所 ---- */
.mapbase{position:absolute;right:12px;bottom:76px;z-index:500;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.mapbase button{padding:6px 10px;min-height:40px}

/* ---- 暗い画面 ---- */
#pocket{position:fixed;inset:0;z-index:200;background:#000;color:#6b6b6b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:30px;user-select:none}
#pocket b{color:#9a9a9a;font-size:20px}
#pocket .last{color:#7d7d7d;font-size:17px;min-height:1.6em}
#pocket .help{position:absolute;bottom:calc(30px + var(--sb));font-size:14px}

/* ---- お知らせ ---- */
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--sb) + 16px);transform:translateX(-50%) translateY(20px);z-index:300;
  background:#1E2823;color:#fff;padding:12px 18px;border-radius:14px;font-size:15.5px;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-color-scheme:dark){#toast{background:#E6EDE8;color:#101613}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<div id="mapWrap" hidden>
  <div id="map" aria-label="聞こえた場所の地図"></div>
  <div id="mapBar"></div>
  <div class="seg mapbase" id="mapBase" role="group" aria-label="地図の種類"></div>
  <button class="mapme" onclick="mapLocate()" aria-label="今いる場所へ" id="mapMe"></button>
  <div id="mapEmpty" class="card" hidden></div>
</div>
<nav id="tabs" aria-label="画面の切り替え"></nav>
<div id="sheet" hidden></div>
<div id="pocket" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="leaflet.js"></script>
<script>
'use strict';
/* =====================================================================
   こえログ — 鳴き声AIで、どこでどんな鳥の声が聞こえたかを記録する
   鳥調査アプリ（bird_survey.html）の鳴き声AI（v247 時点）を切り出したもの。
   AI: BirdNET v2.4（端末の中だけで判定。音も記録もどこにも送らない）
   ===================================================================== */
const APP_VERSION='1.1.0';

/* ---------- 定数 ---------- */
const SR=48000, WIN=144000;          // 3秒区間（AIの入力）
const BATCH=4;                       // 一度にAIへ渡す区間の数
const RING_SEC=40;                   // 直近40秒の音を持っておく（声の切り出し用）
const MERGE_WINS=5;                  // 同じ鳥をひとまとめにする間隔（区間数＝15秒）
const MAX_PER_WIN=3;                 // 1区間で記録する種の上限
const HUMAN_THR=0.3;                 // 人の声とみなす値
const POS_MAX_AGE=60000;             // 位置を付けてよい時間差（ms）

function dayKey(ms){ const d=new Date(ms); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function hm(ms){ const d=new Date(ms); return d.getHours()+':'+pad2(d.getMinutes()); }
function dayLabel(key, withRel=true){
  const [y,m,d]=key.split('-').map(Number), dt=new Date(y,m-1,d);
  const base=`${m}月${d}日（${WD[dt.getDay()]}）`;
  const now=new Date(); const yr=y!==now.getFullYear()?y+'年':'';
  if(withRel){ if(key===dayKey(Date.now())) return '今日 '+base; if(key===dayKey(Date.now()-864e5)) return '昨日 '+base; }
  return yr+base;
}
function shortDate(ms){ const d=new Date(ms), now=new Date();
  return (d.getFullYear()!==now.getFullYear()?d.getFullYear()+'年':'')+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
function dur(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h? `${h}:${pad2(m)}:${pad2(s)}` : `${pad2(m)}:${pad2(s)}`; }
function durWords(sec){ const m=Math.round(sec/60); if(m<1) return '1分未満'; if(m<60) return m+'分'; return Math.floor(m/60)+'時間'+(m%60?m%60+'分':''); }
function mb(b){ return b<1024*1024 ? Math.max(0.1,b/1024/1024).toFixed(1)+'MB' : Math.round(b/1024/1024)+'MB'; }
function hash(s){ let h=0; for(const c of String(s)) h=(h*31+c.codePointAt(0))|0; return Math.abs(h); }
function spColor(ja){ return AV_COLORS[hash(ja)%AV_COLORS.length]; }

/* =====================================================================
   記録（端末の中: IndexedDB 'koelog'）
   det  … 聞こえた鳥（同じ鳥が15秒以内に続けて聞こえたら1件にまとめる）
   clip … 声（24kHz・16bit）
   sess … 聞いた時間
   ===================================================================== */
let _db=null;
function db(){
  if(_db) return _db;
  _db=new Promise((res,rej)=>{
    const r=indexedDB.open('koelog',1);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains('det')) d.createObjectStore('det',{keyPath:'id'}).createIndex('t0','t0');
      if(!d.objectStoreNames.contains('clip')) d.createObjectStore('clip',{keyPath:'id'});
      if(!d.objectStoreNames.contains('sess')) d.createObjectStore('sess',{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked'));
  });
  _db.catch(()=>{ _db=null; });
  return _db;
}
const txDone=tx=>new Promise((res,rej)=>{ tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error('abort')); });
const reqP=r=>new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
async function dbAll(store){ const d=await db(); return reqP(d.transaction(store).objectStore(store).getAll()); }
async function dbGet(store,id){ const d=await db(); return reqP(d.transaction(store).objectStore(store).get(id)); }
function plain(o){ const c={}; for(const k in o) if(k[0]!=='_') c[k]=o[k]; return c; }
async function dbPut(store,obj){ const d=await db(); const tx=d.transaction(store,'readwrite'); tx.objectStore(store).put(plain(obj)); return txDone(tx); }
function savDet(d){ if(!DETS.has(d.id)) return Promise.resolve(); return dbPut('det', d).catch(e=>{ console.warn(e); toast('記録を保存できませんでした（端末の空き容量など）', 5000); }); }

const DETS=new Map();   // id → det
const SESS=new Map();   // id → sess
let CLIP_BYTES=0, CLIP_RESERVED=0;
async function loadAll(){
  const [ds, ss]=await Promise.all([dbAll('det'), dbAll('sess')]);
  DETS.clear(); SESS.clear(); CLIP_BYTES=0;
  for(const d of ds){ DETS.set(d.id, d); if(d.clip){ CLIP_BYTES+=d.clip_bytes||0; d._clipCounted=true; } }
  for(const s of ss) SESS.set(s.id, s);
}
function detList(){ return [...DETS.values()].sort((a,b)=>b.t0-a.t0); }
// 先に手元の一覧から外し、聞き取り中の追記・保存待ちの声を止めてから保存庫を消す（監査 Major3）。
// 外した記録は savDet・声の保存が書き戻さない（DETS に無いものは書かない）
async function delDets(ids){
  const recs=[];
  for(const id of ids){ const r=DETS.get(id); if(!r) continue; recs.push(r); DETS.delete(id);
    LS.events.forEach(e=>{ if(e.rec.id===id) e.closed=true; });
    LS.pending=LS.pending.filter(p=>p.ev.rec.id!==id);
    if(r.clip && r._clipCounted){ CLIP_BYTES-=r.clip_bytes||0; r._clipCounted=false; } }
  const d=await db(); const tx=d.transaction(['det','clip'],'readwrite');
  for(const r of recs){ tx.objectStore('det').delete(r.id); if(r.clip) tx.objectStore('clip').delete(r.clip); }
  await txDone(tx);
}

   鳴き声AI（鳥調査アプリ v247 の ai* を元に、調査の仕組みを外したもの）

function modelBase(){
  return location.hostname.endsWith('github.io')
    ? 'https://raw.githubusercontent.com/Hizinorimashi/bird-survey-web/'+MODEL_COMMIT+'/birdnet'
    : new URL('models/birdnet', location.href).href;   // 手元の試験用（tests/serve.js が用意する）
}
function aiFiles(){
  const app=['birdnet-worker.js','tf.min.js','pcm-recorder.js','labels_en_us.txt','labels_ja.txt','hokkaido_list.json','hokkaido_alias.json']
    .map(f=>new URL('ai/'+f, location.href).href);
  const base=modelBase();
  const model=['model.json', ...Array.from({length:13},(_,i)=>`group1-shard${i+1}of13.bin`)].map(f=>base+'/'+f);
  return { app, model };
}
const AI={ state:'unknown', err:'', progress:0, prep:null, worker:null, workerP:null, reqId:0, pending:{}, haveModel:false, q:[], cur:null };
// state: unknown / nosupport / none（未取り込み）/ installing / ready / failed
async function aiCheck(){
  if(AI.state==='installing') return AI.state;
  if(!('caches' in window) || !window.AudioWorkletNode || !(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) || !window.indexedDB || !window.Worker){
    AI.state='nosupport'; return AI.state; }
  try{
    const f=aiFiles(); const ca=await caches.open(CACHE_APP), cm=await caches.open(CACHE_MODEL);
    let a=0, m=0;
    for(const u of f.app) if(await ca.match(u)) a++;
    for(const u of f.model) if(await cm.match(u)) m++;
    AI.haveModel = m===f.model.length;
    if(a===f.app.length && AI.haveModel){
      try{ AI.prep=await aiPrepare(); AI.state='ready'; AI.err=''; }
      catch(e){ AI.state='failed'; AI.err=String(e&&e.message||e); }
    } else AI.state='none';
  }catch(e){ AI.state='failed'; AI.err=String(e&&e.message||e); }
  return AI.state;
}
async function aiInstall(){
  if(AI.state==='installing' || AI.state==='nosupport') return;
  AI.state='installing'; AI.err=''; AI.progress=0; render();
  try{
    for(const k of await caches.keys()) if(k.startsWith('koelog-ai-app-') && k!==CACHE_APP) await caches.delete(k);
    const f=aiFiles(); const ca=await caches.open(CACHE_APP), cm=await caches.open(CACHE_MODEL);
    const jobs=f.app.map(u=>[ca,u,1]).concat(f.model.map(u=>[cm,u,u.endsWith('.bin')?5:1]));   // 重さ（進み具合の目安）
    const total=jobs.reduce((s,j)=>s+j[2],0); let done=0;
    for(const [c,u,w] of jobs){
      if(!(await c.match(u))){   // 前回の途中まで・鳥調査アプリで取り込み済みの分は取り直さない
        const res=await fetch(u, { cache:'no-store' });
        if(!res.ok) throw new Error(`${u.split('/').pop()} を取り込めませんでした（${res.status}）`);
        const body=await res.clone().arrayBuffer();
        if(!body.byteLength) throw new Error(`中身が空でした（${u.split('/').pop()}）`);
        if((res.headers.get('content-type')||'').includes('text/html')) throw new Error('想定と違う中身でした');
        await c.put(u, res);
      }
      done+=w; AI.progress=done/total; aiProgressPaint();
    }
    AI.state='unknown';
    const st=await aiCheck();
    if(st!=='ready') throw new Error(AI.err||'取り込んだ中身を確かめられませんでした');
    try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
    toast('鳴き声AIの準備ができました。圏外でも使えます', 4000);
  }catch(e){
    AI.state='failed'; AI.err=String(e&&e.message||e);
    toast('取り込めませんでした。電波の良い所でもう一度押してください', 6000);
  }
  AI.progress=0; render();
}
function aiProgressPaint(){ document.querySelectorAll('[data-aiprog]').forEach(el=>{ el.style.width=Math.round(AI.progress*100)+'%'; });
  document.querySelectorAll('[data-aiprogt]').forEach(el=>{ el.textContent=Math.round(AI.progress*100)+'%'; }); }
async function aiUninstall(){
  if(AI.state==='installing') return;
  if(!confirm('鳴き声AI（約64MB）を端末から消します。\nこれまでの記録と声は消えません。\n\n同じ端末の「鳥類調査記録」アプリでも同じAIを使っている場合、そちらも取り込み直しになります。\nよろしいですか？')) return;
  if(LS.want) listenStop();
  workerKill();
  try{ await caches.delete(CACHE_APP); await caches.delete(CACHE_MODEL); }catch(e){}
  AI.prep=null; AI.state='unknown'; await aiCheck(); render();
  toast('鳴き声AIを端末から消しました');
}
async function cacheText(name,url){ const c=await caches.open(name); const r=await c.match(url);
  if(!r) throw new Error('AIのファイルが端末にありません: '+url.split('/').pop()); return r.text(); }
// 種名ラベルと北海道の一覧を読み、検査する（鳥調査アプリと同じ検査。おかしければAIを使わせない）
async function aiPrepare(){
  const f=aiFiles(); const at=n=>f.app.find(u=>u.endsWith('/'+n));
  const [en, ja, hkT, alT]=await Promise.all(['labels_en_us.txt','labels_ja.txt','hokkaido_list.json','hokkaido_alias.json'].map(n=>cacheText(CACHE_APP, at(n))));
  const bad=m=>{ throw new Error('北海道の種の一覧が壊れています: '+m); };
  let hk, al; try{ hk=JSON.parse(hkT); al=JSON.parse(alT); }catch(e){ bad('読み取れません'); }
  const enL=en.split('\n'), jaL=ja.split('\n');
  const labels=enL.filter(l=>l.trim()).map((l,i)=>{ const [sci,enName]=l.trim().split('_');
    return { sci, en:enName, ja:((jaL[i]||'').trim().split('_')[1]||enName) }; });
  const sciIndex=Object.create(null); labels.forEach((b,i)=>{ sciIndex[b.sci]=i; });
  const isLabel=x=>typeof x==='string' && Object.prototype.hasOwnProperty.call(sciIndex,x);
  if(!hk || hk.format!=='hokkaido-list' || hk.version!==1 || !Array.isArray(hk.species)) bad('形式');
  if(!al || al.format!=='hokkaido-alias' || al.version!==1 || !al.alias || typeof al.alias!=='object' || Array.isArray(al.alias)) bad('対応表の形式');
  const ids=new Set(); const okStr=(v,n)=>typeof v==='string' && v.length>0 && v.length<=n;
  for(const sp of hk.species){
    if(!sp || !okStr(sp.id,60) || !okStr(sp.list_ja,60) || !okStr(sp.master_ja,60) || !okStr(sp.sci,60) || ids.has(sp.id)) bad('種の行');
    if(!Array.isArray(sp.birdnet) || !sp.birdnet.every(isLabel)) bad('対応先 '+sp.id);
    ids.add(sp.id);
  }
  if(hk.species.length!==505) bad('種数');
  for(const [id,arr] of Object.entries(al.alias)) if(!ids.has(id) || !Array.isArray(arr) || !arr.length || !arr.every(isLabel)) bad('承認済み対応 '+id);
  const extra = al.extra===undefined ? [] : al.extra;
  if(!Array.isArray(extra) || extra.length>50) bad('追加種の形式');
  for(const x of extra){
    if(!x || !okStr(x.id,200) || ids.has(x.id) || !okStr(x.list_ja,200) || !okStr(x.master_ja,200) || !okStr(x.sci,200)) bad('追加種の行');
    if(!Array.isArray(x.birdnet) || !x.birdnet.length || !x.birdnet.every(isLabel)) bad('追加種の対応先 '+x.id);
    ids.add(x.id);
  }
  const hkIdx=new Set(), idxName=new Map();
  for(const sp of hk.species.concat(extra)){
    const targets=sp.birdnet.length? sp.birdnet : (al.alias[sp.id]||[]);
    for(const s of targets){ const i=sciIndex[s];
      if(idxName.has(i) && idxName.get(i)!==sp.list_ja) bad('同じ分類に2つの種が対応しています '+s);
      hkIdx.add(i); idxName.set(i, sp.list_ja); }
  }
  const nonBird=new Set(NONBIRD_SCI.filter(s=>sciIndex[s]!==undefined).map(s=>sciIndex[s]));
  // 名前を直すときの候補: 北海道の種（505＋追加）。北海道に絞らないときは BirdNET の和名も
  const hkNames=new Map(); for(const sp of hk.species.concat(extra)) if(!hkNames.has(sp.list_ja)) hkNames.set(sp.list_ja, sp.sci);
  return { labels, hkIdx, idxName, nonBird, humanIdx:sciIndex['Human vocal'], hkNames };
}

/* ---------- 判別ワーカー ---------- */
function workerKill(err){
  if(AI.worker){ try{ AI.worker.terminate(); }catch(e){} }
  AI.worker=null; AI.workerP=null; AI.cur=null;
  err=err||new Error('AIを止めました');
  const q=AI.q; AI.q=[]; q.forEach(j=>j.rej(err));
  const p=AI.pending; AI.pending={}; Object.values(p).forEach(x=>x.rej(err));
}
// worker への依頼は1件ずつ出す（v1.1.0 監査 Major）。聞き取り（prio 1）を声紋の「AIで調べる」（prio 0）より先に出し、
// 返事の待ち時間は worker に出した時から数える（ほかの依頼の後ろで待った時間で、聞き取りが誤って止まらないように）。
// 時間切れでも worker はその依頼を処理中なので、本当の返事が来るまで次は出さない
function aiAsk(msg, transfer, ms, prio){
  return new Promise((res,rej)=>{
    if(!AI.worker){ rej(new Error('AIが動いていません')); return; }
    AI.q.push({ msg, transfer, ms, prio:prio||0, res, rej }); aiDispatch();
  });
}
function aiDispatch(){
  if(AI.cur || !AI.q.length || !AI.worker) return;
  let k=0; for(let i=1;i<AI.q.length;i++) if(AI.q[i].prio>AI.q[k].prio) k=i;
  const j=AI.q.splice(k,1)[0], id=++AI.reqId; let tm=null, settled=false;
  AI.cur={ id };
  const fin=()=>{ clearTimeout(tm); if(AI.cur && AI.cur.id===id){ AI.cur=null; setTimeout(aiDispatch, 0); } };
  AI.pending[id]={ res:v=>{ fin(); if(!settled){ settled=true; j.res(v); } }, rej:e=>{ fin(); if(!settled){ settled=true; j.rej(e); } } };
  if(j.ms) tm=setTimeout(()=>{ if(!settled){ settled=true; j.rej(new Error('AIの返事がありませんでした')); } }, j.ms);
  AI.worker.postMessage(Object.assign({}, j.msg, {id}), j.transfer||[]);
}
function workerEnsure(){
  if(AI.workerP) return AI.workerP;
  const p=AI.workerP=(async()=>{
    if(AI.state!=='ready') throw new Error('鳴き声AIがまだ取り込まれていません');
    const f=aiFiles(); const at=n=>f.app.find(u=>u.endsWith('/'+n));
    const [tfT, wT]=await Promise.all([cacheText(CACHE_APP, at('tf.min.js')), cacheText(CACHE_APP, at('birdnet-worker.js'))]);
    const url=URL.createObjectURL(new Blob([tfT,'\n;\n',wT], {type:'text/javascript'}));
    const w=new Worker(url); AI.worker=w;
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    w.onmessage=({data})=>{
      if(data.message==='progress') return;
      const q=data && AI.pending[data.id]; if(!q) return;
      delete AI.pending[data.id];
      if(data.message==='error') q.rej(new Error(data.text)); else q.res(data);
    };
    // 処理役が壊れたら、待ち行列の残りを壊れた処理役へ出さない: 止めて、出した依頼も待っている依頼もすべて断る（v1.1.0 再監査 Major）。
    // 聞き取り中なら止めて知らせる（もう一度「聞く」で作り直す）
    w.onerror=()=>{ if(AI.worker!==w) return;
      workerKill(new Error('AIの処理で問題が起きました'));
      if(LS.want) setTimeout(()=>listenStop('鳴き声AIで問題が起きたため止めました。もう一度「聞く」を押してください'), 0); };
    await aiAsk({ message:'init', modelUrl:f.model[0], cacheName:CACHE_MODEL }, null, 120000);
  })();
  p.catch(()=>{ if(AI.workerP===p) workerKill(); });
  return p;
}

/* =====================================================================
   聞き取り
   ===================================================================== */
const LS={ want:false, preparing:false, cap:false, starting:false, gen:0, reasons:new Set(), needResume:false,
  ctx:null, stream:null, node:null, wake:null, geoId:null, pos:null, geoErr:false, lastPcm:0,
  ring:new Float32Array(SR*RING_SEC), written:0, next:0, judged:0, busy:null, seg:null,
  events:[], pending:[], humanWins:new Set(), lost:[], sess:null, tick:null, level:0, lastName:'', flash:new Set(),
  winHits:new Map(), rec:null, manual:[], analyser:null };
// winHits: 判定した3秒区間ごとのAIの上位（自分で録った音の候補に使う）。rec: 録音中（開始・停止）。manual: 判定を待って保存する自分の録音
const REASON={ hidden:'画面が消えていました', play:'声の再生中', fail:'マイクを使えませんでした' };
function canRun(){ return LS.want && !LS.preparing && LS.reasons.size===0 && !LS.needResume && !document.hidden && AI.state==='ready' && !!AI.worker; }
function sync(){
  if(canRun()){ if(!LS.cap && !LS.starting) captureStart(); }
  else if(LS.cap || LS.starting) captureStop();
  paintListen();
}
function pauseFor(r){ LS.reasons.add(r); sync(); }
function resumeFor(r){ if(!LS.reasons.has(r)) return; LS.reasons.delete(r); sync(); }

async function listenToggle(){ if(LS.want) listenStop(); else listenStart(); }
async function listenStart(){
  if(LS.want) return;
  playStop();   // 再生音をマイクが拾わないように（監査 Major4）
  if(AI.state==='nosupport'){ toast('この端末・ブラウザでは使えません', 5000); return; }
  if(AI.state!=='ready'){ toast('先に鳴き声AIを取り込んでください'); return; }
  LS.want=true; LS.preparing=true; LS.needResume=false; LS.reasons.delete('fail');
  paintListen();
  try{ await workerEnsure(); }
  catch(e){ LS.want=false; LS.preparing=false; toast('鳴き声AIを起動できませんでした: '+(e&&e.message||e), 6000); paintListen(); return; }
  LS.preparing=false;
  if(!LS.want) return;   // 準備中に止めた
  LS.sess={ id:uuid(), t0:Date.now(), t1:Date.now(), sec:0 }; SESS.set(LS.sess.id, LS.sess); dbPut('sess', LS.sess).catch(()=>{});
  clearInterval(LS.tick); LS.tick=setInterval(tick, 1000);
  sync();
}
function listenStop(msg){
  if(!LS.want) return;
  LS.want=false; LS.preparing=false;
  captureStop();
  for(const e of LS.events) e.closed=true; LS.events=[];
  clearInterval(LS.tick); LS.tick=null;
  if(LS.sess){ LS.sess.t1=Date.now(); dbPut('sess', LS.sess).catch(()=>{}); LS.sess=null; }
  pocketClose();
  render();
  if(msg) toast(msg, 5000);
}
function tick(){
  if(!LS.want) return;
  if(LS.cap && LS.sess){ LS.sess.sec++; if(LS.sess.sec%15===0){ LS.sess.t1=Date.now(); dbPut('sess', LS.sess).catch(()=>{}); } }
  // マイクの音が5秒以上届かない → つなぎ直す
  if(LS.cap && Date.now()-LS.lastPcm>5000){ captureStop(); sync(); }
  const el=$('#elapsed'); if(el && LS.sess) el.textContent=dur(LS.sess.sec);
  const rt=$('#recT'); if(rt && LS.rec) rt.textContent=dur(LS.rec.n/CLIP_SR);
}

/* ---------- マイク ---------- */
async function addWorklet(ctx){
  const u=aiFiles().app.find(x=>x.endsWith('/pcm-recorder.js'));
  const t=await cacheText(CACHE_APP, u);
  const bu=URL.createObjectURL(new Blob([t], {type:'text/javascript'}));
  try{ await ctx.audioWorklet.addModule(bu); } finally{ URL.revokeObjectURL(bu); }
}
function release(o){
  try{ o.node && (o.node.port.onmessage=null, o.node.disconnect()); }catch(e){}
  try{ o.stream && o.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ o.ctx && o.ctx.close(); }catch(e){}
}
async function captureStart(){
  const gen=++LS.gen; LS.starting=true; paintListen();
  const o={stream:null, ctx:null, node:null};
  const stale=()=>gen!==LS.gen || !canRun();
  try{
    o.stream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:!!CFG.agc } });
    if(stale()) throw 'stale';
    o.ctx=new (window.AudioContext||window.webkitAudioContext)({ sampleRate:SR });
    await addWorklet(o.ctx);
    if(stale()) throw 'stale';
    if(o.ctx.state==='suspended'){ try{ await o.ctx.resume(); }catch(e){} }
    if(stale()) throw 'stale';
    const src=o.ctx.createMediaStreamSource(o.stream);
    o.node=new AudioWorkletNode(o.ctx, 'pcm-recorder');
    LS.ring.fill(0); LS.written=0; LS.next=0; LS.judged=0; LS.busy=null;
    LS.humanWins.clear(); LS.lost=[]; LS.pending=[]; LS.winHits.clear(); manualDropAll();
    for(const e of LS.events) e.closed=true; LS.events=[];
    LS.seg={ t0:Date.now() };
    o.node.port.onmessage=e=>{ if(gen===LS.gen) onPcm(e.data); };
    src.connect(o.node);
    try{ const an=o.ctx.createAnalyser(); an.fftSize=1024; an.smoothingTimeConstant=0; an.minDecibels=-110; an.maxDecibels=-20; src.connect(an); o.analyser=an; }catch(e){ o.analyser=null; }
    LS.stream=o.stream; LS.ctx=o.ctx; LS.node=o.node; LS.analyser=o.analyser; LS.cap=true; LS.lastPcm=Date.now();
    liveStart();
    wakeOn(); geoStart();
  }catch(err){
    release(o);
    if(gen===LS.gen && err!=='stale'){
      console.warn(err);
      LS.needResume=true; LS.reasons.add('fail');
      toast('マイクを使えませんでした。マイクの使用を許可してから、もう一度押してください', 7000);
      listenStop();
    }
  }finally{
    if(gen===LS.gen){ LS.starting=false; paintListen(); }
  }
}
function captureStop(){
  if(LS.rec) recStop(true);   // 録音中なら、そこまでを残す
  flushPending(true);   // 止める前に、判定済みの声は残す（世代を進める前に呼ぶ）
  LS.gen++; LS.starting=false;
  release(LS); LS.node=LS.stream=LS.ctx=null; LS.analyser=null;
  LS.cap=false; LS.level=0;
  if(LS.geoId!=null && navigator.geolocation){ try{ navigator.geolocation.clearWatch(LS.geoId); }catch(e){} } LS.geoId=null;
  if(LS.wake){ try{ const r=LS.wake.release(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} LS.wake=null; }
}
function wakeOn(){
  if(!('wakeLock' in navigator) || !LS.cap) return;
  const gen=LS.gen;
  navigator.wakeLock.request('screen').then(w=>{
    if(gen===LS.gen && LS.cap){ if(LS.wake){ try{ LS.wake.release(); }catch(e){} } LS.wake=w; } else { try{ w.release(); }catch(e){} }
  }).catch(()=>{});
}
function geoStart(){
  if(!navigator.geolocation || LS.geoId!=null) return;
  try{ LS.geoId=navigator.geolocation.watchPosition(p=>{
      LS.pos={ lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, t:Date.now() }; LS.geoErr=false; paintMeta();
      if(UI.tab==='map') mapMe(LS.pos, false); },
    ()=>{ LS.geoErr=true; paintMeta(); }, { enableHighAccuracy:true, maximumAge:10000 }); }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ LS.reasons.add('hidden'); sync(); return; }
  LS.reasons.delete('hidden'); sync();
});

/* ---------- 判別 ---------- */
function onPcm(chunk){
  const R=LS.ring.length;
  let s=0;
  for(let i=0;i<chunk.length;i++){ const v=chunk[i]; LS.ring[(LS.written+i)%R]=v; s+=v*v; }
  if(LS.rec) recAppend(chunk);
  LS.written+=chunk.length; LS.lastPcm=Date.now();
  const dB=20*Math.log10(Math.sqrt(s/chunk.length)+1e-9);   // 音の大きさ（-60dB〜-15dB を 0〜1 に）
  LS.level=Math.max(0, Math.min(1, (dB+60)/45));
  const r=$('#lvRing'); if(r) r.style.setProperty('--lv', LS.level.toFixed(2));
  pump();
}
function ringGet(a,b){
  const R=LS.ring.length;
  if(a<0 || a<LS.written-R || b>LS.written) return null;
  const out=new Float32Array(b-a);
  for(let s=a;s<b;s++) out[s-a]=LS.ring[s%R];
  return out;
}
const tOf=(seg,s)=>seg.t0+s/SR*1000;
async function pump(){
  if(LS.busy!==null || !LS.cap || !LS.seg) return;
  const gen=LS.gen, seg=LS.seg, R=LS.ring.length;
  if(LS.next < LS.written-R){   // 処理が遅れて消えた音は判定にも保存にも使わない
    const nn=Math.ceil((LS.written-R)/WIN)*WIN;
    LS.lost.push([LS.next, nn]); LS.next=nn; LS.judged=nn;
  }
  const avail=Math.floor((LS.written-LS.next)/WIN);
  if(avail<1){ flushPending(false); return; }
  const n=Math.min(BATCH, avail), start=LS.next, end=start+n*WIN;
  const pcm=ringGet(start,end); if(!pcm) return;
  LS.next=end; LS.busy=gen;
  try{
    const r=await aiAsk({ message:'scores', pcm }, [pcm.buffer], 60000, 1);
    if(gen!==LS.gen) return;
    for(let f=0; f<r.n; f++) handleWindow(start+f*WIN, r.scores.subarray(f*r.C,(f+1)*r.C), seg);
    LS.judged=end;
    flushPending(false);
  }catch(err){
    console.warn(err);
    if(gen===LS.gen){ LS.lost.push([start,end]); LS.judged=end; }
    if(gen===LS.gen && /返事がありません|問題が起き|動いていません/.test(String(err&&err.message))){
      workerKill(); setTimeout(()=>listenStop('鳴き声AIが応答しなくなったため止めました。もう一度「聞く」を押してください'), 0);
    }
  }finally{
    if(LS.busy===gen) LS.busy=null;
  }
  if(LS.cap && gen===LS.gen) setTimeout(pump, 0);
}
function speciesSet(){ const s=new Set(); for(const d of DETS.values()) if(isBird(d)) s.add(d.ja); return s; }
function handleWindow(ws, row, seg){
  const P=AI.prep; if(!P) return;
  if(P.humanIdx!==undefined && row[P.humanIdx]>=HUMAN_THR) LS.humanWins.add(ws);
  winHitsPut(ws, row);
  const thr=SENS[CFG.sens].thr;
  const hits=[];
  const cand = CFG.hk ? P.hkIdx : row.keys();
  for(const i of cand){ const s=row[i]; if(!P.nonBird.has(i) && s>=thr) hits.push({i, s}); }
  hits.sort((a,b)=>b.s-a.s); hits.length=Math.min(hits.length, MAX_PER_WIN);
  const tw=tOf(seg,ws);
  let changed=false;
  for(const h of hits){
    const ja=P.idxName.get(h.i) || (P.labels[h.i]&&P.labels[h.i].ja) || '';
    if(!ja) continue;
    let ev=LS.events.find(e=>e.ja===ja && !e.closed && e.seg===seg && ws-e.endS<=MERGE_WINS*WIN);
    if(!ev){
      const known=speciesSet(), todayHas=detList().some(d=>d.ja===ja && dayKey(d.t0)===dayKey(tw));
      const pos=LS.pos, posOk=pos && Math.abs(pos.t-tw)<=POS_MAX_AGE;
      const rec={ id:uuid(), ja, sci:P.labels[h.i].sci, max:0, count:0, t0:tw, t1:tOf(seg,ws+WIN),
        lat:posOk?pos.lat:null, lng:posOk?pos.lng:null, acc:posOk?Math.round(pos.acc):null,
        clip:null, clip_sec:0, clip_bytes:0, clip_note:'', sess:LS.sess?LS.sess.id:'', model:MODEL_VER, created_at:new Date().toISOString() };
      ev={ rec, ja, seg, endS:ws+WIN, closed:false };
      LS.events.push(ev); DETS.set(rec.id, rec);
      LS.flash.add(ja); LS.lastName=ja;
      if(!known.has(ja)){ toast('はじめての鳥: '+ja, 4000); try{ navigator.vibrate&&navigator.vibrate([40,60,40]); }catch(e){} }
      else if(!todayHas){ try{ navigator.vibrate&&navigator.vibrate(30); }catch(e){} }
    }
    const rec=ev.rec;
    rec.count++; ev.endS=ws+WIN; rec.t1=tOf(seg,ws+WIN);
    if(rec.lat==null && LS.pos && Math.abs(LS.pos.t-tw)<=POS_MAX_AGE){ rec.lat=LS.pos.lat; rec.lng=LS.pos.lng; rec.acc=Math.round(LS.pos.acc); }
    if(h.s>rec.max){
      rec.max=h.s;
      // いちばんよく聞こえた区間の前後を、その範囲を判定し終えたら切り出す（保存前なら差し替える）
      if(CFG.clips && !rec.clip && !rec._saving){
        const a=Math.max(0, ws-CLIP_PAD*SR), b=ws+WIN+CLIP_PAD*SR;
        LS.pending=LS.pending.filter(p=>p.ev!==ev);
        LS.pending.push({ ev, a, b, best:[ws, ws+WIN], need:Math.ceil(b/WIN)*WIN, seg, gen:LS.gen });
      }
    }
    savDet(rec); changed=true;
  }
  for(const e of LS.events) if(!e.closed && e.seg===seg && ws-e.endS>MERGE_WINS*WIN) e.closed=true;
  LS.events=LS.events.filter(e=>!e.closed || LS.pending.some(p=>p.ev===e));
  if(changed) liveUpdate();
}
// 声の保存。force … 聞き取りを止めるとき（最後まで判定できていなくても、判定済みの所までで残す）
function flushPending(force){
  manualFlush(force);
  if(!CFG.clips){ LS.pending=[]; return; }
  const ready=LS.pending.filter(p=>p.gen===LS.gen && (LS.judged>=p.need || (force && LS.judged>=p.best[1])));
  if(!ready.length){ if(force) LS.pending=[]; return; }
  LS.pending=LS.pending.filter(p=>!ready.includes(p));
  if(force) LS.pending=[];
  for(const p of ready){
    const rec=p.ev.rec;
    if(rec.clip || rec._saving || !DETS.has(rec.id)) continue;
    const b=Math.min(p.b, LS.judged, LS.written);
    let human=false;
    for(let s=Math.floor(p.a/WIN)*WIN; s<b; s+=WIN) if(LS.humanWins.has(s)){ human=true; break; }
    const lost=LS.lost.some(([x,y])=>p.a<y && x<b);
    const pcm=(!lost && !human) ? ringGet(p.a,b) : null;
    const nOut=pcm ? Math.floor(pcm.length/2) : 0, bytes=nOut*2, sec=nOut/CLIP_SR;
    const day=dayKey(rec.t0);
    const sameDay=detList().filter(d=>!d.manual && isBird(d) && d.clip && d.ja===rec.ja && dayKey(d.t0)===day).length;   // 自分で録った音・鳥ではない記録は枠に数えない（v1.1.0 監査 Major）
    let note='';
    if(human) note='人の声が入ったため、声は残していません';
    else if(lost || !pcm) note='音が途切れたため、声は残せませんでした';
    else if(sameDay>=CLIP_PER_SP_DAY) note=`この日の${rec.ja}の声は${CLIP_PER_SP_DAY}件残してあります`;
    else if(CLIP_BYTES+CLIP_RESERVED+bytes>CLIP_DEV_BYTES) note='声の保存量が上限（300MB）に達しました';
    if(note){ rec.clip_note=note; savDet(rec); continue; }
    // 48kHz → 24kHz（2つずつ平均）・16bit
    const i16=new Int16Array(nOut);
    for(let i=0;i<nOut;i++){ const v=(pcm[2*i]+pcm[2*i+1])*0.5; i16[i]=Math.max(-32768, Math.min(32767, Math.round(v*32767))); }
    const clip={ id:uuid(), det:rec.id, pcm:i16, sr:CLIP_SR, t0:tOf(p.seg,p.a) };
    rec._saving=true; CLIP_RESERVED+=bytes;
    (async()=>{
      const d=await db();
      if(!DETS.has(rec.id)) return;   // 待っている間に消された
      const tx=d.transaction(['det','clip'],'readwrite');
      Object.assign(rec, { clip:clip.id, clip_sec:Math.round(sec*10)/10, clip_bytes:bytes, clip_note:'' });
      tx.objectStore('clip').put(clip); tx.objectStore('det').put(plain(rec));   // 声と記録を一緒に確定する
      await txDone(tx);
      if(DETS.has(rec.id)){ CLIP_BYTES+=bytes; rec._clipCounted=true; return; }
      // 書いている間に消された → 書いた分も消す
      const t2=d.transaction(['det','clip'],'readwrite'); t2.objectStore('det').delete(rec.id); t2.objectStore('clip').delete(clip.id); await txDone(t2);
    })().catch(e=>{
      console.warn(e); Object.assign(rec, { clip:null, clip_sec:0, clip_bytes:0, clip_note:'声の保存に失敗しました（端末の空き容量など）' }); savDet(rec);
    }).finally(()=>{ rec._saving=false; CLIP_RESERVED-=bytes; liveUpdate(); });
  }
}

/* ---------- 自分で録る（いまの音を残す・録音 開始/停止）v1.1.0 ----------
   どちらも聞き取り中のマイクの音を使う（別にマイクを開かない）。
   AIの判定が録った区間の終わりまで済んでから保存し、その間にAIが聞き取った鳥（上位5）と人の声の印を付ける。
   聞き取りが止まるときは、判定済みの所までの候補で保存する。人の声が入っていても残す（ユーザー決定 2026-11-18） */
const q16=v=>Math.max(-32768, Math.min(32767, Math.round(v*32767)));
function to24k(f){ const n=Math.floor(f.length/2), o=new Int16Array(n); for(let i=0;i<n;i++) o[i]=q16((f[2*i]+f[2*i+1])*0.5); return o; }
function winHitsPut(ws, row){
  const P=AI.prep; if(!P) return;
  const top=[], cand=CFG.hk ? P.hkIdx : row.keys();
  for(const i of cand){ const s=row[i]; if(s>=CAND_MIN && !P.nonBird.has(i)) top.push([i,s]); }
  top.sort((a,b)=>b[1]-a[1]); top.length=Math.min(top.length, CAND_N);
  LS.winHits.set(ws, top);
  const old=LS.written-SR*(REC_MAX_SEC+RING_SEC);   // 録音の最長より古い区間は捨てる（入れた順＝古い順）
  for(const k of LS.winHits.keys()){ if(k<old) LS.winHits.delete(k); else break; }
}
function candsFor(a, b){
  const P=AI.prep, m=new Map(); let human=false;
  for(let s=Math.floor(a/WIN)*WIN; s<b; s+=WIN){
    if(LS.humanWins.has(s)) human=true;
    const t=LS.winHits.get(s); if(!t || !P) continue;
    for(const [i,v] of t){ const ja=P.idxName.get(i) || (P.labels[i]&&P.labels[i].ja) || ''; if(!ja) continue;
      const c=m.get(ja); if(!c || v>c.s) m.set(ja, { ja, sci:P.hkNames.get(ja)||P.labels[i].sci||'', s:Math.round(v*1000)/1000 }); }
  }
  return { cands:[...m.values()].sort((x,y)=>y.s-x.s).slice(0,CAND_N), human };
}
// 保存量の予約（v1.1.0 監査 Critical）: 自分で録る音は、録っている間・判定を待つ間も保存量を先に押さえる。
// 押さえた分は保存の終わり（成功・失敗）・取り消し（短すぎ・世代違い・すべて消す）で必ず返す
function resv(bytes){ if(CLIP_BYTES+CLIP_RESERVED+bytes>CLIP_DEV_BYTES) return false; CLIP_RESERVED+=bytes; return true; }
function unresv(m){ if(m && m.res){ CLIP_RESERVED-=m.res; m.res=0; } }
const FULL_MSG='声の保存量が上限（300MB）に達しました。古い記録を消してください';
function saveBack(){
  if(!LS.cap || !LS.seg){ toast('「聞く」で聞いている間に使えます'); return; }
  const b=LS.written, a=Math.max(0, b-CFG.back*SR, b-LS.ring.length);
  if(b-a<SR){ toast('まだ音がたまっていません。少し待ってから押してください'); return; }
  const pcm=ringGet(a, b); if(!pcm){ toast('音を取り出せませんでした'); return; }
  const i16=to24k(pcm);
  if(!resv(i16.length*2)){ toast(FULL_MSG, 6000); return; }
  manualQueue({ kind:'back', a, b, i16, res:i16.length*2 });
  toast(`直前${Math.round((b-a)/SR)}秒の音を残しています…`, 2500);
}
function recToggle(){ if(LS.rec) recStop(false); else recStart(); }
function recStart(){
  if(!LS.cap || !LS.seg){ toast('「聞く」で聞いている間に使えます'); return; }
  if(!resv(CLIP_SR*2)){ toast(FULL_MSG, 6000); return; }   // 最初の1秒分を押さえる（以後は届いた分ずつ）
  playStop();
  LS.rec={ a:LS.written, buf:new Int16Array(REC_MAX_SEC*CLIP_SR), n:0, odd:null, res:CLIP_SR*2 };
  paintListen();
}
function recAppend(ch){
  const r=LS.rec, buf=r.buf; let i=0, n=r.n;
  const need=(n+Math.ceil((ch.length+1)/2))*2-r.res;   // この塊を書くのに足りない分を押さえる
  if(need>0){ if(resv(need)) r.res+=need;
    else { setTimeout(()=>{ if(LS.rec===r){ recStop(false); toast('声の保存量が上限（300MB）に達したため、ここまでの録音を残しました', 6000); } }, 0); return; } }
  if(r.odd!==null && ch.length){ if(n<buf.length) buf[n++]=q16((r.odd+ch[0])*0.5); r.odd=null; i=1; }
  for(; i+1<ch.length && n<buf.length; i+=2) buf[n++]=q16((ch[i]+ch[i+1])*0.5);
  if(i===ch.length-1) r.odd=ch[i];
  r.n=n;
  if(n>=buf.length) setTimeout(()=>{ if(LS.rec===r){ recStop(false); toast(`録音は${REC_MAX_SEC/60}分までです。ここまでを残しました`, 4000); } }, 0);
}
// fromCap … 聞き取りが止まる途中（captureStop から）。そこまでを残す
function recStop(fromCap){
  const r=LS.rec; if(!r) return; LS.rec=null;
  if(r.n<CLIP_SR*0.5){ unresv(r); toast('録音が短すぎるため残しませんでした'); }
  else{ manualQueue({ kind:'rec', a:r.a, b:r.a+r.n*2, i16:r.buf.slice(0, r.n), res:r.res }); r.res=0;
    toast(fromCap ? '聞き取りが止まったため、そこまでの録音を残しました' : '録音を残しています…', fromCap?4500:2500); }
  if(!fromCap) paintListen();
}
function manualQueue(m){
  m.seg=LS.seg; m.gen=LS.gen; m.need=Math.ceil(m.b/WIN)*WIN;
  m.pos=LS.pos && Date.now()-LS.pos.t<=POS_MAX_AGE ? Object.assign({}, LS.pos) : null;
  LS.manual.push(m); manualFlush(false);
}
function manualFlush(force){
  if(!LS.manual.length) return;
  const ready=LS.manual.filter(m=>m.gen===LS.gen && (force || LS.judged>=m.need));
  LS.manual.filter(m=>m.gen!==LS.gen).forEach(unresv);   // 世代違い（通常は起きない）は捨てて予約を返す
  LS.manual=LS.manual.filter(m=>m.gen===LS.gen && !ready.includes(m));
  for(const m of ready) manualSave(m);
}
function manualDropAll(){ LS.manual.forEach(unresv); LS.manual=[]; if(LS.rec){ unresv(LS.rec); LS.rec=null; } }
let DB_EPOCH=0;   // すべて消すたびに進める（消している間に書き終えた録音を残さない）
async function manualSave(m){
  const { cands, human }=candsFor(m.a, m.b);
  const bytes=m.i16.length*2, sec=m.i16.length/CLIP_SR, ep=DB_EPOCH;   // 保存量は録ったときに押さえ済み（m.res）
  const t0=tOf(m.seg,m.a), pos=m.pos;
  const rec={ id:uuid(), ja:'', sci:'', manual:m.kind, max:0, count:0, t0, t1:tOf(m.seg,m.b),
    lat:pos?pos.lat:null, lng:pos?pos.lng:null, acc:pos?Math.round(pos.acc):null,
    clip:null, clip_sec:Math.round(sec*10)/10, clip_bytes:bytes, clip_note:'', human, cands, label:'', memo:'',
    sess:LS.sess?LS.sess.id:'', model:MODEL_VER, created_at:new Date().toISOString() };
  const clip={ id:uuid(), det:rec.id, pcm:m.i16, sr:CLIP_SR, t0 };
  rec.clip=clip.id;
  try{
    const d=await db(); const tx=d.transaction(['det','clip'],'readwrite');
    tx.objectStore('clip').put(clip); tx.objectStore('det').put(plain(rec)); await txDone(tx);
    if(ep!==DB_EPOCH){ const t2=d.transaction(['det','clip'],'readwrite'); t2.objectStore('det').delete(rec.id); t2.objectStore('clip').delete(clip.id); await txDone(t2); return; }
    DETS.set(rec.id, rec); CLIP_BYTES+=bytes; rec._clipCounted=true;
    toast(`録音を残しました（${Math.round(sec)}秒）。「きろく」で聞けます${human?'（人の声が入っています）':''}`, 4000);
    liveUpdate();
  }catch(e){ console.warn(e); toast('録音を保存できませんでした（端末の空き容量など）', 5000); }
  finally{ unresv(m); }
}

/* ---------- 音の計算（FFT・フィルタ・雑音を減らす）v1.1.0 ---------- */
const _fftC={};
function fftTab(N){
  if(_fftC[N]) return _fftC[N];
  const rev=new Uint32Array(N), cs=new Float32Array(N/2), sn=new Float32Array(N/2), bits=Math.round(Math.log2(N));
  for(let i=0;i<N;i++){ let r=0, x=i; for(let b=0;b<bits;b++){ r=(r<<1)|(x&1); x>>=1; } rev[i]=r; }
  for(let i=0;i<N/2;i++){ cs[i]=Math.cos(2*Math.PI*i/N); sn[i]=-Math.sin(2*Math.PI*i/N); }
  return (_fftC[N]={ rev, cs, sn });
}
function fft(re, im, inv){
  const N=re.length, { rev, cs, sn }=fftTab(N);
  for(let i=0;i<N;i++){ const j=rev[i]; if(j>i){ let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; } }
  for(let size=2; size<=N; size<<=1){ const h=size>>1, step=N/size;
    for(let i=0;i<N;i+=size) for(let j=0;j<h;j++){ const k=j*step, wr=cs[k], wi=inv?-sn[k]:sn[k], a=i+j, b=a+h;
      const tr=re[b]*wr-im[b]*wi, ti=re[b]*wi+im[b]*wr; re[b]=re[a]-tr; im[b]=im[a]-ti; re[a]+=tr; im[a]+=ti; } }
  if(inv) for(let i=0;i<N;i++){ re[i]/=N; im[i]/=N; }
}
const _hann={};
function hann(N){ return _hann[N] || (_hann[N]=Float32Array.from({length:N}, (_,i)=>0.5-0.5*Math.cos(2*Math.PI*i/N))); }
function biquad(x, sr, type, fc){
  fc=Math.max(10, Math.min(sr/2-50, fc));
  const w=2*Math.PI*fc/sr, c=Math.cos(w), al=Math.sin(w)/(2*Math.SQRT1_2);
  const [b0,b1,b2]= type==='hp' ? [(1+c)/2, -(1+c), (1+c)/2] : [(1-c)/2, 1-c, (1-c)/2];
  const a0=1+al, A1=-2*c/a0, A2=(1-al)/a0, B0=b0/a0, B1=b1/a0, B2=b2/a0;
  const y=new Float32Array(x.length); let x1=0,x2=0,y1=0,y2=0;
  for(let i=0;i<x.length;i++){ const v=x[i], o=B0*v+B1*x1+B2*x2-A1*y1-A2*y2; x2=x1; x1=v; y2=y1; y1=o; y[i]=o; }
  return y;
}
// 高さで絞る（声紋で囲んだ範囲だけ鳴らす）。2段ずつで急な切れ目にする
function bandpass(x, sr, f0, f1){ return biquad(biquad(biquad(biquad(x,sr,'hp',f0),sr,'hp',f0),sr,'lp',f1),sr,'lp',f1); }
const i16f=a=>{ const f=new Float32Array(a.length); for(let i=0;i<a.length;i++) f[i]=a[i]/32768; return f; };
const f16=f=>{ const a=new Int16Array(f.length); for(let i=0;i<f.length;i++) a[i]=q16(f[i]); return a; };
// 雑音を減らす（再生用。保存した音は変えない）: 200Hz より低い音（風・車）を切り、
// 周波数ごとの「いつも鳴っている音」（全体の下から2割の大きさ）を差し引く。差し引きすぎによるキュルキュル音は、前の区間・隣の高さとならして抑える
const NR_HP=200, NR_N=1024, NR_HOP=256, NR_ALPHA=2, NR_FLOOR=0.12, NR_SAMPLE=400;
// 省メモリ版（v1.1.0 監査 Major）: 前後に N ずつ無音を足したと見なして区間を読み、結果へ直接重ねる。
// 周期ハン窓・ずらし N/4 なので、どの位置も窓の2乗の和はちょうど 1.5（重ね直しの割り算は定数でよい）。
// 5分（24kHz）で 入力・高域通過・出力 の3本ぶん（約90MB）。処理は専用の worker で行う（画面を止めない）
function denoise(x, sr){
  const N=NR_N, H=NR_HOP, K=N/2+1, w=hann(N), L=x.length;
  if(L<N) return x;
  let hp=biquad(x,sr,'hp',NR_HP); hp=biquad(hp,sr,'hp',NR_HP);
  const nF=Math.floor((L+N)/H)+1;   // 区間の始まり s=0,H,…（足した無音を含む座標。本物の音は N〜N+L）
  const re=new Float32Array(N), im=new Float32Array(N);
  const frame=s=>{ const o=s-N; for(let i=0;i<N;i++){ const j=o+i; re[i]=(j>=0 && j<L ? hp[j] : 0)*w[i]; im[i]=0; } fft(re, im, false); };
  const S=Math.min(nF, NR_SAMPLE), mags=Array.from({length:K}, ()=>new Float32Array(S));
  for(let j=0;j<S;j++){ frame(Math.floor(j*nF/S)*H); for(let k=0;k<K;k++) mags[k][j]=Math.hypot(re[k], im[k]); }
  const noise=new Float32Array(K); for(let k=0;k<K;k++){ const a=mags[k].sort(); noise[k]=a[Math.floor(S*0.2)]; }
  const y=new Float32Array(L), g=new Float32Array(K), gPrev=new Float32Array(K).fill(1), WS=1/1.5;
  for(let f=0; f<nF; f++){
    const s=f*H; frame(s);
    for(let k=0;k<K;k++){ const m=Math.hypot(re[k], im[k])+1e-12; g[k]=Math.max(NR_FLOOR, 1-NR_ALPHA*noise[k]/m, 0.6*gPrev[k]); }
    for(let k=0;k<K;k++){ const gs=(g[Math.max(0,k-1)]+2*g[k]+g[Math.min(K-1,k+1)])/4; gPrev[k]=g[k];
      re[k]*=gs; im[k]*=gs; if(k>0 && k<N/2){ re[N-k]*=gs; im[N-k]*=gs; } }
    fft(re, im, true);
    const o=s-N; for(let i=0;i<N;i++){ const j=o+i; if(j>=0 && j<L) y[j]+=re[i]*w[i]*WS; }
  }
  let pk=0; for(let i=0;i<L;i++){ const a=Math.abs(y[i]); if(a>pk) pk=a; }
  if(pk>0.98) for(let i=0;i<L;i++) y[i]*=0.98/pk;
  return y;
}
// 声紋の計算（純粋な関数。worker でも動く）。H … 縦の段数、maxCols … 横の列数の上限
function specCore(x, sr, fm, H, maxCols){
  fm=Math.min(fm, sr/2);
  const N=fm<=3000?4096:fm<=6000?2048:1024;
  const hop=Math.max(32, Math.ceil(x.length/maxCols)), cols=Math.max(1, Math.floor(x.length/hop));
  const w=hann(N), re=new Float32Array(N), im=new Float32Array(N), db=new Float32Array(cols*H), binHz=sr/N, maxBin=N/2;
  const k0s=new Int32Array(H), k1s=new Int32Array(H);
  for(let y=0;y<H;y++){ const fA=(H-1-y)/H*fm, fB=(H-y)/H*fm; const k0=Math.min(maxBin, Math.floor(fA/binHz)); k0s[y]=k0; k1s[y]=Math.min(maxBin, Math.max(k0, Math.ceil(fB/binHz)-1)); }
  const norm=N*N/16;
  for(let c=0;c<cols;c++){ const s=Math.round(c*hop+hop/2-N/2);
    for(let i=0;i<N;i++){ const j=s+i; re[i]=(j>=0 && j<x.length ? x[j] : 0)*w[i]; im[i]=0; }
    fft(re, im, false);
    for(let y=0;y<H;y++){ let p=0; for(let k=k0s[y];k<=k1s[y];k++){ const v=re[k]*re[k]+im[k]*im[k]; if(v>p) p=v; }
      db[y*cols+c]=Math.max(-120, 10*Math.log10(p/norm+1e-12)); } }
  const floor=new Float32Array(H), tmp=new Float32Array(cols);
  for(let y=0;y<H;y++){ for(let c=0;c<cols;c++) tmp[c]=db[y*cols+c]; floor[y]=tmp.slice().sort()[Math.floor(cols/2)]; }
  return { db, floor, cols };
}
/* 音の計算専用の worker（v1.1.0 監査 Major: 長い録音で画面を止めない）。上の関数をそのまま写して作る。
   dspRun … 依頼。owner が 'sp' の依頼は声紋の画面を離れるときに打ち切る（worker ごと止めて作り直す） */
const DSP={ w:null, id:0, p:{} };
function dspSrc(){
  return `const NR_HP=${NR_HP},NR_N=${NR_N},NR_HOP=${NR_HOP},NR_ALPHA=${NR_ALPHA},NR_FLOOR=${NR_FLOOR},NR_SAMPLE=${NR_SAMPLE};const _fftC={},_hann={};\n`
    + [fftTab, fft, hann, biquad, denoise, specCore].map(String).join('\n')
    + `\nonmessage=({data})=>{ try{ let r, tr;
      if(data.kind==='nr'){ r=denoise(data.x, data.sr); tr=[r.buffer]; }
      else { r=specCore(data.x, data.sr, data.fm, data.H, data.maxCols); tr=[r.db.buffer, r.floor.buffer]; }
      postMessage({ id:data.id, r }, tr); }catch(e){ postMessage({ id:data.id, err:String(e&&e.message||e) }); } };`;
}
function dspRun(kind, x, sr, extra, owner){
  return new Promise((res,rej)=>{
    try{
      if(!DSP.w){ const u=URL.createObjectURL(new Blob([dspSrc()], {type:'text/javascript'}));
        try{ DSP.w=new Worker(u); } finally{ setTimeout(()=>URL.revokeObjectURL(u), 60000); }
        DSP.w.onmessage=({data})=>{ const q=DSP.p[data.id]; if(!q) return; delete DSP.p[data.id]; if(data.err) q.rej(new Error(data.err)); else q.res(data.r); };
        DSP.w.onerror=()=>dspStop(null, '音の処理で問題が起きました'); }
      const id=++DSP.id, c=x.slice();   // 呼び手の元の音は残す（写しを渡す）
      DSP.p[id]={ res, rej, owner:owner||'' };
      DSP.w.postMessage(Object.assign({ id, kind, x:c, sr }, extra||{}), [c.buffer]);
    }catch(e){ rej(e); }
  });
}
// owner を指定したときは、その持ち主の依頼が待っているときだけ止める
function dspStop(owner, msg){
  if(!DSP.w) return;
  if(owner && !Object.values(DSP.p).some(q=>q.owner===owner)) return;
  try{ DSP.w.terminate(); }catch(e){}
  DSP.w=null; const p=DSP.p; DSP.p={};
  const err=new Error(msg||'打ち切りました'); err.cancel=!msg; Object.values(p).forEach(q=>q.rej(err));
}

/* ---------- 声の再生（再生中は聞き取りを止め、再生音をAIが拾わないようにする） ---------- */
let _player=null, _playId=null, _playGen=0, _playOff=0;
function wav(i16, sr){
  const buf=new ArrayBuffer(44+i16.length*2), v=new DataView(buf);
  const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+i16.length*2,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,i16.length*2,true);
  new Int16Array(buf,44).set(i16);
  return new Blob([buf], {type:'audio/wav'});
}
function playMark(){ document.querySelectorAll('[data-play]').forEach(b=>b.classList.toggle('playing', b.dataset.play===_playId));
  const a=document.getElementById('spPlay'); if(a) a.textContent=_playId==='sp:all'?'■ 止める':'▶ 全体を聞く';
  const s=document.getElementById('spPlaySel'); if(s) s.textContent=_playId==='sp:sel'?'■ 止める':'▶ 選んだ所だけ聞く'; }
function playStop(){
  _playGen++;
  if(_player){ const p=_player; _player=null; try{ p.onended=p.onpause=p.onerror=null; p.pause(); }catch(e){} try{ URL.revokeObjectURL(p.src); }catch(e){} }
  _playId=null; playMark();
  resumeFor('play');
}
function canPlay(){ if(LS.rec){ toast('録音中は再生できません。録音を止めてから聞いてください', 3500); return false; } return true; }
async function playClip(id){
  if(_playId===id){ playStop(); return; }
  if(!canPlay()) return;
  playStop();
  const g=_playGen;
  let c=null; try{ c=await dbGet('clip', id); }catch(e){}
  if(g!==_playGen) return;
  if(!c || !c.pcm){ toast('声が見つかりませんでした'); return; }
  const sr=c.sr||CLIP_SR;
  if(CFG.nr){ let f=null;
    if(c.pcm.length>CLIP_SR*20) toast('雑音を減らしています…', 2000);
    try{ f=await dspRun('nr', i16f(c.pcm), sr); }catch(e){ if(e.cancel) return; console.warn(e); }   // 打ち切り（画面を離れた）なら鳴らさない
    if(g!==_playGen) return;
    if(f){ playPcm(id, f16(f), sr); return; } }
  playPcm(id, c.pcm, sr);
}
// i16 … 16bit の音。off … 声紋の再生位置の線のための開始時刻（秒）
function playPcm(key, i16, sr, off){
  pauseFor('play');
  const a=new Audio(URL.createObjectURL(wav(i16, sr)));
  _player=a; _playId=key; _playOff=off||0; playMark();
  const end=()=>{ if(_player===a) playStop(); };
  a.onended=end; a.onpause=end; a.onerror=end;
  a.play().catch(end);
}

/* ---------- 声紋（スペクトログラム）v1.1.0 ----------
   鳥調査アプリ v247 の声紋の見え方（高さ・雑音を沈める・濃淡・拡大）にならう。
   「雑音: 沈める」… 高さごとに、いつも鳴っている音（中央値）を差し引いて、声を浮かせて見せる（表示だけ）
   囲んだ所だけ聞く … 囲んだ時間を切り出し、囲んだ高さの外を切って鳴らす（高さ150Hz未満のなぞりは時間だけ）
   AIで調べる … 囲んだ所（無ければ全体）を3秒ずつAIに渡し、種ごとの最大値を出す */
const SP_H=256, SP_MAX_COLS=6000, SP_FMAXES=[3000,6000,12000];
const SP_RANGES=[{ db:25, ja:'くっきり' }, { db:45, ja:'ふつう' }, { db:70, ja:'かすかな音も' }];
const SP={ gen:0, det:null, f32:null, nr:null, sr:CLIP_SR, sel:null, zoom:1, db:null, floor:null, cols:0, pick:false, res:null };
const _luts={};
function specLut(){
  if(_luts.c) return _luts.c;
  const t=new Uint8Array(256*3), stops=[[0,[0,0,4]],[0.25,[59,15,112]],[0.5,[140,41,129]],[0.75,[254,159,109]],[1,[252,253,191]]];
  for(let i=0;i<256;i++){ const v=i/255; let j=0; while(j<stops.length-2 && v>stops[j+1][0]) j++;
    const [a0,c0]=stops[j], [a1,c1]=stops[j+1], u=(v-a0)/(a1-a0);
    for(let q=0;q<3;q++) t[i*3+q]=Math.round(c0[q]+(c1[q]-c0[q])*u); }
  return (_luts.c=t);
}
async function openSpec(id){
  const d=DETS.get(id); if(!d || !d.clip) return;
  const g=++SP.gen;
  let c=null; try{ c=await dbGet('clip', d.clip); }catch(e){}
  if(g!==SP.gen) return;
  if(!c || !c.pcm){ toast('声が見つかりませんでした'); return; }
  openSheet(specHtml(d));   // ここで SP.gen が進む
  const g2=SP.gen;
  Object.assign(SP, { det:id, f32:i16f(c.pcm), nr:null, sr:c.sr||CLIP_SR, sel:null, zoom:1, db:null, pick:false, res:null });
  specLabels(); specSelPaint(); specFit(); specBind();
  await specCompute(g2);
}
function specHtml(d){

    <div class="small muted" style="margin-bottom:10px">${shortDate(d.t0)} ${hm(d.t0)} ・ ${d.clip_sec||''}秒　横が時間、縦が音の高さ。明るいほど強い音</div>
    <div id="spWrap"><div id="spBox"><canvas id="spCv" height="${SP_H}"></canvas><canvas id="spSel" height="${SP_H}" aria-label="声紋。範囲を選ぶを押してからなぞると囲めます"></canvas></div></div>
    <div class="spAx"><span id="spAxT"></span><span id="spAxF"></span></div>
    <div class="spTools">
      <button class="btn pri" id="spPlay" onclick="specPlay(false)">▶ 全体を聞く</button>
      <button class="btn" id="spPickB" onclick="specPickToggle()" aria-pressed="false">□ 範囲を選ぶ</button>
    </div>

      <button class="btn" onclick="specZoom(-1)" aria-label="縮める">－</button>
      <button class="btn" onclick="specZoom(1)" aria-label="広げる">＋</button>
    </div>
    <div id="spSelBox" style="margin-top:10px"></div>
    <div class="card" style="margin-top:12px"><div class="setrow"><div class="body"><div class="t">聞くとき雑音を減らす</div><div class="d">低い音（風・車）を切り、いつも鳴っている音を差し引いて鳴らします。保存した音は変えません</div></div>
      <button class="sw" role="switch" id="spNr" aria-checked="${CFG.nr}" onclick="cfgSet('nr',!CFG.nr);this.setAttribute('aria-checked',CFG.nr)" aria-label="聞くとき雑音を減らす"></button></div></div>
    <div class="acts" style="margin-top:14px"><button class="btn wide" onclick="detMenu('${safeId(d.id)}')">正しいかを記入する・メモ</button><button class="btn wide" onclick="closeSheet()">閉じる</button></div>`;
}
function specLabels(){
  const set=(id,t)=>{ const e=document.getElementById(id); if(e) e.textContent=t; };
  set('spF', `0〜${CFG.spFmax/1000}kHz`); set('spC', CFG.spClean?'沈める':'そのまま'); set('spR', SP_RANGES[CFG.spRange].ja);
  set('spAxT', SP.f32 ? `0〜${(SP.f32.length/SP.sr).toFixed(1)}秒${SP.zoom>1?' ・ ×'+SP.zoom+'（横に動かせます）':''}` : '');
  set('spAxF', `縦 0〜${CFG.spFmax/1000}kHz`);
}
// 声紋を worker で計算して描く。g … 開いた声紋の世代。高さを切り替えたら前の計算の結果は捨てる（cid）
let _specCid=0;
async function specCompute(g){
  if(!SP.f32) return;
  const cid=++_specCid, ax=document.getElementById('spAxT');
  if(ax) ax.textContent='声紋を描いています…';
  let r=null;
  try{ r=await dspRun('spec', SP.f32, SP.sr, { fm:CFG.spFmax, H:SP_H, maxCols:SP_MAX_COLS }, 'sp'); }
  catch(e){ if(!e.cancel && g===SP.gen){ console.warn(e); toast('声紋を描けませんでした: '+(e&&e.message||e), 5000); } return; }
  if(g!==SP.gen || cid!==_specCid) return;
  Object.assign(SP, { db:r.db, floor:r.floor, cols:r.cols });
  specPaint(); specSelDraw();
}
// 色を塗る。上端は強さの上位0.3%（一番強い1点に引きずられない）、下端は上端から濃淡の幅だけ下（鳥調査アプリと同じ）
function specPaint(){
  const cv=document.getElementById('spCv'), db=SP.db, fl=SP.floor; if(!cv || !db) return;
  const cols=SP.cols, H=SP_H, clean=CFG.spClean;
  cv.width=cols; const sc=document.getElementById('spSel'); if(sc) sc.width=cols;
  const step=Math.max(1, Math.floor(cols*H/60000)), smp=[];
  for(let i=0;i<cols*H;i+=step){ const y=Math.floor(i/cols); smp.push(clean ? db[i]-fl[y] : db[i]); }
  smp.sort((a,b)=>a-b);
  let top=smp[Math.min(smp.length-1, Math.floor(smp.length*0.997))], bot=top-SP_RANGES[CFG.spRange].db;
  bot=clean ? Math.max(bot, 3) : Math.max(bot, -100);
  if(top<bot+(clean?20:10)) top=bot+(clean?20:10);
  const lut=specLut(), ctx=cv.getContext('2d'), img=ctx.createImageData(cols, H), sp=1/(top-bot);
  for(let y=0;y<H;y++){ const off=clean ? fl[y] : 0;
    for(let c=0;c<cols;c++){ const v=Math.max(0, Math.min(1, (db[y*cols+c]-off-bot)*sp)), k=(v*255|0)*3, p=(y*cols+c)*4;
      img.data[p]=lut[k]; img.data[p+1]=lut[k+1]; img.data[p+2]=lut[k+2]; img.data[p+3]=255; } }
  ctx.putImageData(img, 0, 0);
  specLabels();
}
function specFit(){
  const wrap=document.getElementById('spWrap'), box=document.getElementById('spBox'); if(!wrap || !box) return;
  const w=SP.zoom===1 ? '100%' : Math.round(wrap.clientWidth*SP.zoom)+'px';
  box.style.width=w; for(const id of ['spCv','spSel']){ const e=document.getElementById(id); if(e) e.style.width=w; }
}
function specZoom(dir){
  const wrap=document.getElementById('spWrap'); if(!wrap || !SP.f32) return;
  const z0=SP.zoom, z=Math.max(1, Math.min(16, dir>0 ? z0*2 : z0/2)); if(z===z0) return;
  const mid=(wrap.scrollLeft+wrap.clientWidth/2)/(wrap.clientWidth*z0);   // 真ん中の時刻を動かさない
  SP.zoom=z; specFit(); wrap.scrollLeft=Math.max(0, mid*wrap.clientWidth*z-wrap.clientWidth/2); specLabels();
}
function specToggle(what){
  if(!SP.f32) return;
  if(what==='fmax'){ const i=SP_FMAXES.indexOf(CFG.spFmax); cfgSet('spFmax', SP_FMAXES[(i+1)%SP_FMAXES.length]); SP.sel=null; SP.res=null; specSelPaint(); specLabels(); specCompute(SP.gen); return; }
  else if(what==='clean') cfgSet('spClean', !CFG.spClean);
  else if(what==='range') cfgSet('spRange', (CFG.spRange+1)%SP_RANGES.length);
  specPaint(); specSelDraw();
}
function specPickToggle(){
  SP.pick=!SP.pick;
  const b=document.getElementById('spPickB'), sc=document.getElementById('spSel');
  if(b){ b.setAttribute('aria-pressed', SP.pick); b.textContent=SP.pick?'□ なぞって囲む（押すと終わり）':'□ 範囲を選ぶ'; }
  if(sc) sc.classList.toggle('pick', SP.pick);
}
function specBind(){
  const sc=document.getElementById('spSel'); if(!sc) return;
  let st=null;
  const at=e=>{ const r=sc.getBoundingClientRect(); return { x:Math.max(0, Math.min(1, (e.clientX-r.left)/r.width)), y:Math.max(0, Math.min(1, (e.clientY-r.top)/r.height)) }; };
  sc.onpointerdown=e=>{ if(!SP.pick) return; st=at(e); try{ sc.setPointerCapture(e.pointerId); }catch(x){} e.preventDefault(); };
  sc.onpointermove=e=>{ if(!st) return; SP.sel=specBoxFrom(st, at(e)); specSelDraw(); };
  sc.onpointerup=sc.onpointercancel=e=>{ if(!st) return; const s=specBoxFrom(st, at(e)); st=null;
    SP.sel = s.t1-s.t0>=0.1 ? s : null; SP.res=null; specSelDraw(); specSelPaint(); };
}
function specBoxFrom(a, b){
  const dur=SP.f32.length/SP.sr, fm=CFG.spFmax;
  let f0=(1-Math.max(a.y,b.y))*fm, f1=(1-Math.min(a.y,b.y))*fm;
  if(f1-f0<150){ f0=null; f1=null; }   // 横になぞっただけ → 高さでは絞らない
  return { t0:Math.min(a.x,b.x)*dur, t1:Math.max(a.x,b.x)*dur, f0, f1 };
}
function specSelDraw(head){
  const sc=document.getElementById('spSel'); if(!sc || !SP.f32) return;
  const ctx=sc.getContext('2d'), W=sc.width, H=sc.height, dur=SP.f32.length/SP.sr, fm=CFG.spFmax;
  ctx.clearRect(0,0,W,H);
  const s=SP.sel;
  if(s){ const x0=s.t0/dur*W, x1=s.t1/dur*W, y0=s.f1!=null?(1-Math.min(1,s.f1/fm))*H:0, y1=s.f0!=null?(1-s.f0/fm)*H:H;
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,0,W,H); ctx.clearRect(x0,y0,x1-x0,y1-y0);
    // 横に引き伸ばして表示するので、縦の線は表示の幅に合わせて太くし、横の線は2pxのまま
    const kx=W/Math.max(1, sc.clientWidth||W), vx=2*kx;
    ctx.fillStyle='#7FE0B0'; ctx.fillRect(x0,y0,x1-x0,2); ctx.fillRect(x0,y1-2,x1-x0,2); ctx.fillRect(x0,y0,vx,y1-y0); ctx.fillRect(x1-vx,y0,vx,y1-y0); }
  if(head!=null){ const kx=W/Math.max(1, sc.clientWidth||W), x=head/dur*W; ctx.fillStyle='#fff'; ctx.fillRect(x-kx, 0, 2*kx, H); }
}
function specSelPaint(){
  const el=document.getElementById('spSelBox'); if(!el) return;
  const s=SP.sel, aiOk=AI.state==='ready';
  el.innerHTML = (s ? `<div class="small muted">選んだ所: ${s.t0.toFixed(1)}〜${s.t1.toFixed(1)}秒${s.f0!=null?` ・ ${(s.f0/1000).toFixed(1)}〜${(s.f1/1000).toFixed(1)}kHz`:''}</div>
      <div class="spTools"><button class="btn pri" id="spPlaySel" onclick="specPlay(true)">▶ 選んだ所だけ聞く</button>
        <button class="btn" onclick="specAsk()" ${aiOk?'':'disabled'}>選んだ所をAIで調べる</button>
        <button class="btn" onclick="SP.sel=null;SP.res=null;specSelDraw();specSelPaint()">選び直す</button></div>`
    : `<div class="spTools"><button class="btn" onclick="specAsk()" ${aiOk?'':'disabled'}>全体をAIで調べる</button></div>`)
    + `<div id="spRes" class="spRes"></div>`;
  playMark(); specResPaint();
}
async function specPlay(onlySel){
  const key=onlySel?'sp:sel':'sp:all';
  if(_playId===key){ playStop(); return; }
  if(!SP.f32 || !canPlay()) return;
  playStop();
  const g=SP.gen, pg=_playGen, sr=SP.sr, s=onlySel && SP.sel;
  let f=SP.f32;
  if(CFG.nr){   // 全体で雑音を見積もってから切り出す（worker で計算。結果は開いている間とっておく）
    if(!SP.nr){ if(SP.f32.length>CLIP_SR*20) toast('雑音を減らしています…', 2000);
      try{ const r=await dspRun('nr', SP.f32, sr, null, 'sp'); if(g===SP.gen) SP.nr=r; }catch(e){ if(e.cancel) return; console.warn(e); } }
    if(g!==SP.gen || pg!==_playGen || (onlySel && SP.sel!==s)) return;   // 待つ間に選び直した・消したなら古い範囲は鳴らさない（v1.1.0 再監査 Major）
    if(SP.nr) f=SP.nr;
  }
  let off=0;
  if(s){ f=f.slice(Math.floor(s.t0*sr), Math.ceil(s.t1*sr)); off=s.t0; if(s.f0!=null) f=bandpass(f, sr, s.f0, s.f1); }
  if(g!==SP.gen || pg!==_playGen || (onlySel && SP.sel!==s)) return;
  playPcm(key, f16(f), sr, off);
  const loop=()=>{ if(g!==SP.gen || _playId!==key || !_player){ specSelDraw(); return; }
    specSelDraw(_playOff+_player.currentTime); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
// 48kHz（AIの入力）の i 番目の値を、元の音から直線でつないで作る（全体を48kHzに広げた写しは作らない。5分で58MBになるため）
function at48(f, sr, i){ const p=i*sr/SR, j=Math.floor(p), u=p-j; if(j>=f.length) return 0; return f[j]*(1-u)+(j+1<f.length?f[j+1]:f[j])*u; }
const ASK_PER=4;   // 声紋の「AIで調べる」は4区間ずつ頼む（聞き取りの判定をはさめるように）
async function specAsk(){
  if(AI.state!=='ready'){ toast('先に鳴き声AIを取り込んでください'); return; }
  if(!SP.f32) return;
  const g=SP.gen, s=SP.sel, el=()=>document.getElementById('spRes');
  SP.res='busy'; specResPaint();
  try{
    await workerEnsure();
    let f=SP.f32;
    if(s){ f=f.slice(Math.floor(s.t0*SP.sr), Math.ceil(s.t1*SP.sr)); if(s.f0!=null) f=bandpass(f, SP.sr, s.f0, s.f1); }
    const sr=SP.sr, n48=Math.floor(f.length*SR/sr), starts=[];
    if(n48<=WIN) starts.push(-1);
    else { const step=n48>60*SR ? WIN : WIN/2; let st=0; for(; st+WIN<=n48; st+=step) starts.push(st); if(starts[starts.length-1]+WIN<n48) starts.push(n48-WIN); }
    const P=AI.prep, best=new Map();
    for(let i0=0;i0<starts.length;i0+=ASK_PER){
      const part=starts.slice(i0, i0+ASK_PER), pcm=new Float32Array(part.length*WIN);
      part.forEach((st,i)=>{ const o=i*WIN;
        if(st<0){ const pad=Math.floor((WIN-n48)/2); for(let k=0;k<n48;k++) pcm[o+pad+k]=at48(f, sr, k); }   // 3秒に満たない音は真ん中に置く
        else for(let k=0;k<WIN;k++) pcm[o+k]=at48(f, sr, st+k); });
      const r=await aiAsk({ message:'scores', pcm }, [pcm.buffer], 60000, 0);
      if(g!==SP.gen || SP.sel!==s) return;
      for(let k=0;k<r.n;k++){ const row=r.scores.subarray(k*r.C, (k+1)*r.C), cand=CFG.hk ? P.hkIdx : row.keys();
        for(const i of cand){ const v=row[i]; if(v<CAND_MIN || P.nonBird.has(i)) continue;
          const ja=P.idxName.get(i) || (P.labels[i]&&P.labels[i].ja) || ''; if(ja && (!best.has(ja) || v>best.get(ja))) best.set(ja, v); } }
    }
    SP.res=[...best.entries()].sort((a,b)=>b[1]-a[1]).slice(0, CAND_N);
  }catch(e){ if(g!==SP.gen) return; SP.res={ err:String(e&&e.message||e) }; }
  specResPaint();
}
function specResPaint(){
  const el=document.getElementById('spRes'); if(!el) return;
  const r=SP.res;
  if(!r){ el.innerHTML=''; return; }
  if(r==='busy'){ el.innerHTML='<div class="small muted">AIが調べています…</div>'; return; }
  if(r.err){ el.innerHTML=`<div class="small" style="color:var(--danger)">調べられませんでした: ${esc(r.err)}</div>`; return; }
  el.innerHTML = r.length ? `<div class="small muted" style="margin:6px 2px">AIの答え（押すとこの記録の名前にします。確からしさは目安）</div>
      <div class="card list">${r.map(([ja,v])=>`<button class="birdrow" data-act="setname" data-id="${esc(SP.det)}" data-v="${esc(ja)}" data-keep="1">${avatar(ja,true)}<div class="body"><div class="nm">${esc(ja)}</div></div><span class="n">${Math.round(v*100)}%</span></button>`).join('')}</div>`
    : '<div class="small muted">鳥の声は見つかりませんでした（どの鳥も5%未満）</div>';
}

/* ---------- いまの音の声紋（きく画面の流れる帯） ---------- */
let _liveRaf=0, _liveDrawT=0, _liveBuf=null, _liveFloor=null;
function liveStart(){ if(!_liveRaf) _liveRaf=requestAnimationFrame(liveDraw); }
function liveDraw(){
  _liveRaf=0;
  const an=LS.analyser; if(!an || !LS.cap) return;   // 聞き取りが止まったら描くのもやめる
  _liveRaf=requestAnimationFrame(liveDraw);
  const cv=document.getElementById('liveCv');
  if(!cv || !CFG.liveOn || UI.tab!=='listen' || document.hidden || !$('#pocket').hidden) return;
  const now=performance.now(); if(now-_liveDrawT<40) return; _liveDrawT=now;
  const bins=an.frequencyBinCount, H=cv.height, W=cv.width;
  if(!_liveBuf || _liveBuf.length!==bins){ _liveBuf=new Float32Array(bins); _liveFloor=null; }
  an.getFloatFrequencyData(_liveBuf);
  const sr=LS.ctx ? LS.ctx.sampleRate : SR, top=Math.min(bins, Math.floor(12000/(sr/an.fftSize)));
  if(!_liveFloor || _liveFloor.length!==H) _liveFloor=new Float32Array(H).fill(-100);
  const ctx=cv.getContext('2d'); ctx.drawImage(cv, -2, 0);
  const img=ctx.createImageData(2, H), lut=specLut();
  for(let y=0;y<H;y++){
    const k0=Math.floor((H-1-y)/H*top), k1=Math.max(k0+1, Math.floor((H-y)/H*top));
    let v=-140; for(let k=k0;k<k1;k++){ const a=_liveBuf[k]; if(a>v) v=a; }
    if(!isFinite(v)) v=-140;
    const fl=_liveFloor[y]; _liveFloor[y]= v<fl ? fl+(v-fl)*0.3 : fl+(v-fl)*0.004;   // いつも鳴っている音をゆっくり追う
    const e=CFG.spClean ? (v-_liveFloor[y]-3)/30 : (v+100)/70, q=Math.max(0, Math.min(255, e*255|0))*3;
    for(let x=0;x<2;x++){ const p=(y*2+x)*4; img.data[p]=lut[q]; img.data[p+1]=lut[q+1]; img.data[p+2]=lut[q+2]; img.data[p+3]=255; }
  }
  ctx.putImageData(img, W-2, 0);
}

const UI={ tab:'listen', day:null, birdSort:'new', mapPeriod:'all', mapSp:'' };
const TABS=[['listen','きく',IC.ear],['log','きろく',IC.list],['map','地図',IC.map],['birds','見つけた鳥',IC.bird]];

function setTab(t){
  if(UI.tab===t && !UI.day){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  UI.tab=t;
  if(UI.day){ UI.day=null; if(history.state && history.state.day) history.back(); }

}

}
let _liveT=null;
function liveUpdate(){   // 検出のたびに呼ぶ（まとめて0.3秒後に描き直す）

  _liveT=setTimeout(()=>{ _liveT=null;

function renderListen(){
  hdr(`<span class="logo"><i>${IC.wave}</i>こえログ</span>`, `<button class="iconbtn" onclick="openSettings()" aria-label="設定">${IC.gear}</button>`);

function todayAgg(){

async function labelSet(id, kind){

  d.labeled_at=d.updated_at=new Date().toISOString();
  LS.events.forEach(e=>{ if(e.rec.id===id) e.closed=true; });   // 記入した記録には、聞き取りの続きを足さない
  await savDet(d);
  detMenu(id); render();
}
let _memo=null;   // { id, t }  入力の0.6秒後にまとめて保存
function memoInput(id, v){
  const d=DETS.get(id); if(!d) return;
  d.memo=String(v).slice(0,300);
  clearTimeout(_memo&&_memo.t); _memo={ id, t:setTimeout(memoFlush, 600) };
}
function memoFlush(){
  if(!_memo) return; const m=_memo; _memo=null; clearTimeout(m.t);
  const d=DETS.get(m.id); if(!d) return;
  d.updated_at=new Date().toISOString(); savDet(d);
}

function fixName(id){
  const d=DETS.get(id); if(!d) return;
  openSheet(`<h2>${d.manual?'名前を選ぶ':'正しい名前を選ぶ'}</h2>
    <p class="muted small" style="margin-top:-6px">いまの名前: ${esc(nameOf(d))}${d.fixed?'（AIは「'+esc(d.orig_ja)+'」）':''}</p>

    <div class="card list" id="fixL" style="margin-top:10px"></div>`);
  fixList(id);
  setTimeout(()=>{ const q=$('#fixQ'); if(q) q.focus(); }, 250);
