function nameCandidates(){
  const P=AI.prep; const m=new Map();
  for(const d of DETS.values()) if(d.ja && !m.has(d.ja)) m.set(d.ja, d.sci||'');
  if(P){ for(const [ja,sci] of P.hkNames) if(!m.has(ja)) m.set(ja, sci);
    if(!CFG.hk) for(const l of P.labels) if(l.ja && !m.has(l.ja) && !/[A-Za-z]/.test(l.ja)) m.set(l.ja, l.sci); }
  return m;
}
function fixList(id){
  const el=$('#fixL'); if(!el) return;
  const q=kata(($('#fixQ')||{}).value||'').trim();
  const cur=DETS.get(id); if(!cur) return;
  const all=[...nameCandidates().entries()].filter(([ja])=>ja!==cur.ja);
  const used=speciesSet();
  const cand=new Map((cur.cands||[]).map((c,i)=>[c.ja,i]));   // 自分で録った音: AIの候補を先に
  let hit=q ? all.filter(([ja])=>ja.includes(q)) : all.filter(([ja])=>used.has(ja) || cand.has(ja));
  hit.sort((a,b)=>(q ? (a[0].indexOf(q)-b[0].indexOf(q)) : 0) || ((cand.has(a[0])?cand.get(a[0]):99)-(cand.has(b[0])?cand.get(b[0]):99)) || a[0].localeCompare(b[0],'ja'));
  const more=hit.length>60; hit=hit.slice(0,60);
  el.innerHTML = (q?'':'<div class="small muted" style="padding:10px 14px 0">これまでに記録した鳥（ほかは名前で探してください）</div>')
    + (hit.length ? hit.map(([ja])=>`<button class="birdrow" data-act="fix" data-id="${esc(id)}" data-v="${esc(ja)}">${avatar(ja,true)}<div class="body"><div class="nm">${esc(ja)}</div></div></button>`).join('')
       : '<div class="empty small">見つかりません</div>')
    + (more?'<div class="small muted" style="padding:10px 14px">さらに絞り込んでください</div>':'');
}
// keep … 開いている画面（声紋・詳しい画面）を閉じずに名前だけ変える
async function fixApply(id, ja, keep){
  const d=DETS.get(id); if(!d || !ja) return;
  const cs=(d.cands||[]).find(c=>c.ja===ja);
  const sci=(AI.prep && AI.prep.hkNames.get(ja)) || nameCandidates().get(ja) || (cs&&cs.sci) || '';   // 書き換える前に引く
  if(d.manual){ d.ja=ja; d.sci=sci; d.label='ok'; }   // 自分で録った音: 自分で付けた名前＝確かめた名前
  else if(ja===d.ja){ d.label='ok'; }                 // 今の名前と同じ＝合ってる
  else {
    if(!d.fixed){ d.orig_ja=d.ja; d.orig_sci=d.sci; }
    d.ja=ja; d.sci=sci; d.fixed=(ja!==d.orig_ja);
    if(!d.fixed){ d.sci=d.orig_sci; delete d.orig_ja; delete d.orig_sci; }
    d.label=d.fixed ? 'other' : 'ok';
  }
  d.labeled_at=d.updated_at=new Date().toISOString();
  LS.events.forEach(e=>{ if(e.rec.id===id) e.closed=true; });   // 聞き取り中でも、直した記録には足さない
  await savDet(d);
  if(keep){ const t=document.getElementById('spTitle');
    if(t) t.textContent='声紋 ・ '+nameOf(d); else if(!$('#sheet').hidden) detMenu(id);
    render(); }
  else { closeSheet(); render(); }
  toast(`「${ja}」にしました`);
}

function birdAgg(){
  const m=new Map();
  for(const d of DETS.values()){ if(!isBird(d)) continue;
    let a=m.get(d.ja); if(!a){ a={ ja:d.ja, sci:d.sci, n:0, first:d.t0, last:d.t0, days:new Set(), best:null }; m.set(d.ja,a); }
    a.n++; a.days.add(dayKey(d.t0)); if(d.t0<a.first) a.first=d.t0; if(d.t0>a.last) a.last=d.t0;
    if(d.clip && (!a.best || (d.max||0)>(a.best.max||0))) a.best=d;

  return [...m.values()];
}

      ${avatar(a.ja)}<div class="body"><div class="nm">${esc(a.ja)}</div><div class="sub">はじめて ${shortDate(a.first)} ・ ${a.days.size}日</div></div>
      <span class="n">${a.n}回</span></button>`).join('')}</div>`
    : `<div class="empty">${IC.bird}<div>まだありません<br><span class="small">聞こえた鳥が、ここにたまっていきます</span></div></div>`;
}
function openSpecies(ja){
  const a=birdAgg().find(x=>x.ja===ja); if(!a){ closeSheet(); return; }
  const ds=detList().filter(d=>isBird(d) && d.ja===ja);
  const days=[...a.days].sort().reverse();
  openSheet(`<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">${avatar(ja)}<div style="flex:1;min-width:0"><h2 style="margin:0">${esc(ja)}</h2><div class="small muted"><i>${esc(a.sci||'')}</i></div></div>${a.best?playBtn(a.best.clip):''}</div>
    <div class="small muted">はじめて ${shortDate(a.first)} ・ さいご ${shortDate(a.last)} ・ ${a.days.size}日 ・ ${a.n}回</div>
    <div class="acts" style="margin:14px 0 4px"><button class="btn pri wide" data-act="mapfor" data-v="${esc(ja)}">${IC.map}地図で見る</button></div>
    ${days.slice(0,30).map(k=>`<h3>${dayLabel(k)}</h3><div class="card list">${ds.filter(d=>dayKey(d.t0)===k).map(rowHtml).join('')}</div>`).join('')}
    ${days.length>30?`<p class="small muted">ほか${days.length-30}日（地図・書き出しで見られます）</p>`:''}`);
  playMark();
}
function mapFor(ja){ closeSheet(); UI.mapSp=ja; UI.mapPeriod='all'; UI.tab='map'; UI.day=null; render(); }

/* ---------- 地図 ---------- */
let MAP=null, MAPLAYER=null, MINI=null, MAPBASE=null, MEPOS=null;
const TILE_ATTR='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>';
// 地図の種類（v1.1.0）。写真は地理院の「全国最新写真（シームレス）」
const BASES={
  pale:{ ja:'淡色', url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png' },
  std:{ ja:'標準', url:'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png' },
  photo:{ ja:'写真', url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg' } };
if(!BASES[CFG.base]) CFG.base='pale';
function baseLayer(){ return window.L.tileLayer(BASES[CFG.base].url, { attribution:TILE_ATTR, maxZoom:19, maxNativeZoom:18 }); }
function mapBaseSet(k){
  if(!BASES[k]) return; cfgSet('base', k);
  if(MAP){ if(MAPBASE) MAP.removeLayer(MAPBASE); MAPBASE=baseLayer().addTo(MAP); MAPBASE.bringToBack(); }
  mapBasePaint();
}
function mapBasePaint(){ const el=$('#mapBase'); if(!el) return;
  el.innerHTML=Object.entries(BASES).map(([k,b])=>`<button aria-pressed="${CFG.base===k}" onclick="mapBaseSet('${k}')">${b.ja}</button>`).join(''); }
function renderMap(){
  hdr('地図');
  $('#mapMe').innerHTML=IC.locate;
  if(!window.L || !window.L.map){ $('#mapEmpty').hidden=false; $('#mapEmpty').textContent='地図の部品を読み込めませんでした'; return; }
  if(!MAP){
    MAP=window.L.map('map', { zoomControl:false, attributionControl:true, maxZoom:19 }).setView([43.06,141.35], 7);
    MAPBASE=baseLayer().addTo(MAP);
    window.L.control.zoom({ position:'bottomleft' }).addTo(MAP);
    MAPLAYER=window.L.layerGroup().addTo(MAP);
    MEPOS=window.L.layerGroup().addTo(MAP);
  }
  mapBar(); mapBasePaint();
  const p=LS.pos; if(p && Date.now()-p.t<=POS_MAX_AGE) mapMe(p, false);
  setTimeout(()=>{ MAP.invalidateSize(); mapDraw(true); }, 30);
}
// 今いる場所: 青い点と誤差の円。move … そこへ寄る（17。すでに寄っていればそのまま）
function mapMe(p, move){
  if(!MAP || !MEPOS) return;
  MEPOS.clearLayers();
  window.L.circle([p.lat,p.lng], { radius:Math.max(3, p.acc||0), color:'#2B7BE4', weight:1, fillColor:'#2B7BE4', fillOpacity:.12, interactive:false }).addTo(MEPOS);
  window.L.circleMarker([p.lat,p.lng], { radius:8, color:'#fff', weight:3, fillColor:'#2B7BE4', fillOpacity:1, interactive:false }).addTo(MEPOS);
  if(move) MAP.setView([p.lat,p.lng], Math.max(MAP.getZoom(), 17));
}
function mapBar(){
  const p=UI.mapPeriod, seg=(k,l)=>`<button aria-pressed="${p===k}" onclick="UI.mapPeriod='${k}';mapBar();mapDraw(true)">${l}</button>`;
  const names=birdAgg().map(a=>a.ja).sort((a,b)=>a.localeCompare(b,'ja'));
  if(UI.mapSp && !names.includes(UI.mapSp)) UI.mapSp='';
  $('#mapBar').innerHTML=`<div class="seg">${seg('today','今日')}${seg('week','1週間')}${seg('all','すべて')}</div>
    <select onchange="UI.mapSp=this.value;mapDraw(true)" aria-label="鳥で絞り込む"><option value="">すべての鳥</option>${names.map(n=>`<option ${n===UI.mapSp?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
}
function mapDets(){
  const now=Date.now(), today=dayKey(now);
  return detList().filter(d=>d.lat!=null && d.lng!=null
    && (!UI.mapSp || (isBird(d) && d.ja===UI.mapSp))
    && (UI.mapPeriod==='all' || (UI.mapPeriod==='today' ? dayKey(d.t0)===today : now-d.t0<=7*864e5)));
}
function popHtml(d){ return `<div class="pop">${avatar(nameOf(d),true)}<div style="flex:1"><b>${esc(nameOf(d))}</b><div class="small muted">${shortDate(d.t0)} ${hm(d.t0)}</div><div>${conf(d)}</div></div>${d.clip?playBtn(d.clip):''}</div>`; }
function marker(d){
  return window.L.circleMarker([d.lat,d.lng], { radius:9, color:'#fff', weight:2.5, fillColor:spColor(nameOf(d)), fillOpacity:.95 })
    .bindPopup(()=>popHtml(d), { closeButton:true, autoPanPadding:[30,80] }).on('popupopen', playMark);
}
function mapDraw(fit){
  if(!MAP) return;
  MAPLAYER.clearLayers();
  const ds=mapDets();
  ds.slice().reverse().forEach(d=>marker(d).addTo(MAPLAYER));
  const em=$('#mapEmpty');
  if(!ds.length){
    em.hidden=false;
    const anyPos=[...DETS.values()].some(d=>d.lat!=null);
    em.innerHTML = anyPos ? 'この条件の記録はありません' : 'まだ場所つきの記録がありません<div class="small muted">「きく」で聞くと、聞こえた場所に印が付きます</div>';
    return;
  }
  em.hidden=true;
  if(fit){ const b=window.L.latLngBounds(ds.map(d=>[d.lat,d.lng])); MAP.fitBounds(b, { padding:[50,50], maxZoom:15 }); }
}
function mapLocate(){
  const p=LS.pos;
  if(p && Date.now()-p.t<15000){ mapMe(p, true); return; }   // 聞き取り中の新しい位置があればすぐ
  if(!navigator.geolocation){ toast('位置を使えません'); return; }
  toast('今いる場所を探しています…', 2000);
  navigator.geolocation.getCurrentPosition(q=>{ mapMe({ lat:q.coords.latitude, lng:q.coords.longitude, acc:q.coords.accuracy }, true); },
    ()=>toast('位置を取得できませんでした（位置の使用を許可してください）', 4000), { enableHighAccuracy:true, timeout:15000, maximumAge:10000 });
}
function miniMap(ds){
  if(!window.L || !window.L.map) return;
  MINI=window.L.map('mini', { zoomControl:false, attributionControl:true, scrollWheelZoom:false, maxZoom:19 });
  baseLayer().addTo(MINI);
  const pts=ds.filter(d=>d.lat!=null);
  pts.slice().reverse().forEach(d=>marker(d).addTo(MINI));
  MINI.fitBounds(window.L.latLngBounds(pts.map(d=>[d.lat,d.lng])), { padding:[30,30], maxZoom:15 });
}
function destroyMini(){ if(MINI){ try{ MINI.remove(); }catch(e){} MINI=null; } }

/* ---------- シート ---------- */
// 画面を替える・閉じるときは、書きかけのメモを保存し、声紋の再生・計算を止める
function sheetLeave(){ memoFlush(); if(_playId && String(_playId).startsWith('sp:')) playStop(); dspStop('sp'); SP.gen++; SP.f32=SP.nr=SP.db=null; SP.res=null; }
function openSheet(html){
  sheetLeave();
  const s=$('#sheet');
  s.innerHTML=`<div class="backdrop" onclick="closeSheet()"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  if(s.hidden){ s.hidden=false; history.pushState(Object.assign({}, history.state||{}, {sheet:1}),''); }
}
function closeSheet(fromPop){
  const s=$('#sheet'); if(s.hidden) return;
  sheetLeave();
  s.hidden=true; s.innerHTML='';
  if(!fromPop && history.state && history.state.sheet) history.back();
}
window.addEventListener('popstate', e=>{
  if(!$('#sheet').hidden){ closeSheet(true); playMark(); return; }
  const day=(e.state&&e.state.day)||null;
  if(day!==UI.day){ UI.day=day; render(); }
});

/* ---------- 設定 ---------- */

  const ai = AI.state==='ready' ? `<div class="setrow"><div class="body"><div class="t">鳴き声AI</div><div class="d">取り込み済み（${MODEL_VER}）。圏外でも使えます</div></div><button class="btn" onclick="aiUninstall()">消す</button></div>`
    : AI.state==='installing' ? `<div class="setrow"><div class="body"><div class="t">鳴き声AI</div><div class="progress" style="margin-top:8px"><i data-aiprog style="width:${Math.round(AI.progress*100)}%"></i></div></div></div>`
    : `<div class="setrow"><div class="body"><div class="t">鳴き声AI</div><div class="d">${AI.state==='nosupport'?'この端末では使えません':'まだ取り込んでいません'}</div></div>${AI.state!=='nosupport'?'<button class="btn pri" onclick="closeSheet();aiInstall()">取り込む</button>':''}</div>`;
  openSheet(`<h2>設定</h2>
    <h3>聞き方</h3>
    <div class="card" style="padding:14px 14px 12px">
      <div class="t" style="font-weight:700;margin-bottom:8px">拾う感度</div>
      <div class="seg">${Object.entries(SENS).map(([k,v])=>`<button aria-pressed="${CFG.sens===k}" onclick="cfgSet('sens','${k}');openSettings()">${v.label}</button>`).join('')}</div>
      <div class="small muted" style="margin-top:8px">${SENS[CFG.sens].d}${LS.want?'（いま聞いている分からすぐ効きます）':''}</div>
    </div>
    <div class="card" style="margin-top:10px">
      <div class="setrow"><div class="body"><div class="t">北海道の鳥に絞る</div><div class="d">オフにすると世界の約6,500種から探します（間違いが増えます）</div></div>
        <button class="sw" role="switch" aria-checked="${CFG.hk}" onclick="cfgSet('hk',${!CFG.hk});openSettings()" aria-label="北海道の鳥に絞る"></button></div>
      <div class="setrow"><div class="body"><div class="t">声も残す</div><div class="d">AIが聞き取った鳥の、よく聞こえた7秒ほどを残します（同じ鳥は1日3件まで）。人の声が入った所は残しません</div></div>
        <button class="sw" role="switch" aria-checked="${CFG.clips}" onclick="cfgSet('clips',${!CFG.clips});openSettings()" aria-label="声も残す"></button></div>
      <div class="setrow"><div class="body"><div class="t">いまの音の声紋を出す</div><div class="d">聞いている間、きく画面に流れる声紋を出します</div></div>
        <button class="sw" role="switch" aria-checked="${CFG.liveOn}" onclick="cfgSet('liveOn',${!CFG.liveOn});openSettings();paintListen()" aria-label="いまの音の声紋を出す"></button></div>
    </div>
    <h3>自分で録る</h3>
    <div class="card" style="padding:14px 14px 12px">
      <div class="t" style="font-weight:700;margin-bottom:8px">「いまの音を残す」の長さ</div>
      <div class="seg">${BACK_SECS.map(v=>`<button aria-pressed="${CFG.back===v}" onclick="cfgSet('back',${v});openSettings();paintListen()">直前${v}秒</button>`).join('')}</div>
      <div class="small muted" style="margin-top:8px">押したときから、さかのぼって残します。「録音する」は止めるまで（最長${REC_MAX_SEC/60}分）。自分で録った音は、人の声が入っていても残します（印が付きます）</div>
    </div>
    <h3>雑音</h3>
    <div class="card">
      <div class="setrow"><div class="body"><div class="t">聞くとき雑音を減らす</div><div class="d">低い音（風・車）を切り、いつも鳴っている音（川・虫・機械）を差し引いて鳴らします。保存した音は変えません</div></div>
        <button class="sw" role="switch" aria-checked="${CFG.nr}" onclick="cfgSet('nr',${!CFG.nr});openSettings()" aria-label="聞くとき雑音を減らす"></button></div>
      <div class="setrow"><div class="body"><div class="t">マイクの自動音量調整</div><div class="d">オンにすると小さな音を拾いやすくなりますが、雑音も大きくなります。AIは音の大きさより声の形で判断します${LS.want?'（次に聞き始めたときから効きます）':''}</div></div>
        <button class="sw" role="switch" aria-checked="${CFG.agc}" onclick="cfgSet('agc',${!CFG.agc});openSettings()" aria-label="マイクの自動音量調整"></button></div>
      <div class="setrow"><div class="body"><div class="t">声紋の「雑音: 沈める」</div><div class="d">いつも鳴っている音を差し引いて、鳥の声を浮かせて見せます（見え方だけ）</div></div>
        <button class="sw" role="switch" aria-checked="${CFG.spClean}" onclick="cfgSet('spClean',${!CFG.spClean});openSettings()" aria-label="声紋の雑音を沈める"></button></div>

      <div class="setrow"><div class="body"><div class="t">表に書き出す</div><div class="d">Excel で開ける形（CSV）。日時・鳥・場所など</div></div><button class="btn" onclick="exportCsv()" ${nDet?'':'disabled'}>書き出す</button></div>
      <div class="setrow"><div class="body"><div class="t">すべての記録を消す</div><div class="d">元に戻せません</div></div><button class="btn danger" onclick="delAll()" ${nDet?'':'disabled'}>消す</button></div>

      AIの判定は目安です。めずらしい鳥ほど間違いが多くなります。<br><br>

      判定の処理: BirdNET Live（BirdNET-Team）・birdnet-web（georg95）MIT License<br>
      TensorFlow.js Apache License 2.0 ／ Leaflet BSD-2-Clause<br>
      地図: 国土地理院 地理院タイル（淡色地図・標準地図・全国最新写真（シームレス））
    </div></div>`);
}
async function delAll(){
  if(!confirm('すべての記録と声を消します。元に戻せません。よろしいですか？')) return;
  if(!confirm('本当に消しますか？（書き出していない記録は二度と見られません）')) return;
  if(LS.want) listenStop();
  playStop();
  DETS.clear(); SESS.clear(); CLIP_BYTES=0; LS.pending=[]; manualDropAll(); DB_EPOCH++;   // 先に手元から外す（書き戻し防止）
  try{ const d=await db(); const tx=d.transaction(['det','clip','sess'],'readwrite');
    tx.objectStore('det').clear(); tx.objectStore('clip').clear(); tx.objectStore('sess').clear(); await txDone(tx);
    toast('すべて消しました'); }
  catch(e){ toast('消せませんでした'); }
  closeSheet(); render();
}
// 文字の項目: 表計算ソフトが式とみなす先頭（= + - @ タブ 改行。前に空白があっても）なら ' を付けて文字にする（監査 Major2）
// 数値の項目（typeof number）はそのまま
function csvCell(v){
  if(v==null) v='';
  let t=String(v);
  if(typeof v==='string' && /^[\s　]*[=+\-@\t\r\n]/.test(t)) t="'"+t;
  return /[",\r\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
}
function isoLocal(ms){ const d=new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }
function exportCsv(){
  const cols=['日付','聞こえ始め','聞こえ終わり','鳥','学名','AIの判定(%)','目安','回数(3秒区間)','緯度','経度','位置の誤差(m)','名前を直した','AIの判定名','声','AIの版','記録ID',
    '記録の種類','確かめた結果','メモ','人の声','AIの候補'];
  const rows=detList().slice().reverse().map(d=>[dayKey(d.t0), isoLocal(d.t0).slice(11), isoLocal(d.t1).slice(11), d.ja||'', d.sci||'', d.manual?'':Math.round((d.max||0)*100),
    d.manual?'':d.fixed?'名前を直した':(d.max>=0.7?'ほぼ確実':d.max>=0.4?'たぶん':'かも'), d.manual?'':(d.count||0),
    d.lat!=null?Number(d.lat.toFixed(6)):'', d.lng!=null?Number(d.lng.toFixed(6)):'', d.acc!=null?Number(d.acc):'',
    d.fixed?1:0, d.fixed?d.orig_ja:'', d.clip?'あり':'', d.model||'', d.id,
    d.manual==='back'?'自分で録音（さかのぼり）':d.manual==='rec'?'自分で録音（開始・停止）':'AIが聞き取った',
    d.label&&LABELS[d.label]?LABELS[d.label].ja:'', d.memo||'', d.manual&&d.human?'あり':'',
    (d.cands||[]).map(c=>`${c.ja} ${Math.round(c.s*100)}%`).join(' / ')]);
  const body='﻿'+[cols].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([body],{type:'text/csv;charset=utf-8'}));
  a.download=`こえログ_${dayKey(Date.now())}.csv`; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast('書き出しました');
}

// 種名など外から来た文字は onclick に埋め込まず、data 属性で受け渡す（監査 Major1）
document.addEventListener('click', e=>{
  const t=e.target.closest && e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, v=t.dataset.v||'', id=t.dataset.id||'';
  if(a==='species') openSpecies(v);
  else if(a==='mapfor') mapFor(v);
  else if(a==='fix') fixApply(id, v);
  else if(a==='setname') fixApply(id, v, true);
});

/* ---------- 起動 ---------- */
(async function boot(){
  render();
  try{ await loadAll(); }catch(e){ console.warn(e); toast('記録を読めませんでした（プライベートブラウズでは使えません）', 7000); }
  await aiCheck();
  render();
  if('serviceWorker' in navigator && location.protocol!=='file:'){ try{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }catch(e){} }
})();
window.addEventListener('pagehide', ()=>{ if(LS.sess){ LS.sess.t1=Date.now(); dbPut('sess', LS.sess).catch(()=>{}); } });
</script>
